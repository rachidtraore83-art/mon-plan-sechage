<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mon plan"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#f5f5f7"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="description" content="Plan simple pour produits séchés — guide, emballage et vente."/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png"/>
<link rel="apple-touch-icon" href="images/icon-192.png"/>
<title>Mon plan : produits séchés</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="app">
  <h1>Mon plan : produits séchés</h1>
  <div class="saved" id="saved" data-testid="saved-indicator"></div>
</header>
<main id="app" data-testid="page"></main>
<nav class="tabs" role="tablist" aria-label="Navigation principale" data-testid="floating-nav">
  <button role="tab" data-tab="parcours" data-testid="tab-parcours" aria-label="Accueil — ton point de départ" aria-selected="true">
    <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.2 3 11h2.5v8.5h5V14h3v5.5h5V11H21L12 3.2z"/></svg></span>
    <span class="tab-label">Accueil</span>
    <span class="tab-desc">Ton point de départ</span>
  </button>
  <button role="tab" data-tab="cultures" data-testid="tab-cultures" aria-label="Cultures — toutes les plantes" aria-selected="false">
    <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c-2.5 3.5-5 5.2-5 8.5A5 5 0 0 0 12 21a5 5 0 0 0 5-9.5C17 8.2 14.5 6.5 12 3zm0 7.5c.8 0 1.5.7 1.5 1.5S12.8 13.5 12 13.5 10.5 12.8 10.5 12 11.2 10.5 12 10.5z"/></svg></span>
    <span class="tab-label">Cultures</span>
    <span class="tab-desc">Toutes les plantes</span>
  </button>
  <button role="tab" data-tab="trouver" data-testid="tab-trouver" aria-label="Trouver — ce qui te convient" aria-selected="false">
    <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 3a7 7 0 1 0 4.3 12.5l4.1 4.1 1.4-1.4-4.1-4.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg></span>
    <span class="tab-label">Trouver</span>
    <span class="tab-desc">Ce qui te convient</span>
  </button>
  <button role="tab" data-tab="equip" data-testid="tab-equip" aria-label="Matériel : les outils" aria-selected="false">
    <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 7h16v2H4V7zm2 4h12v9H6v-9zm2 2v5h8v-5H8zM9 3h6v2H9V3z"/></svg></span>
    <span class="tab-label">Matériel</span>
    <span class="tab-desc">Le matériel</span>
  </button>
  <button role="tab" data-tab="calc" data-testid="tab-calc" aria-label="Calculs — estimer ton lot" aria-selected="false">
    <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm1 3v3h8V6H8zm0 5v2h2v-2H8zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2zM8 15v2h2v-2H8zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg></span>
    <span class="tab-label">Calculs</span>
    <span class="tab-desc">Estimer ton lot</span>
  </button>
</nav>

<!-- One-time gentle tip: add to home screen -->
<div id="install-tip" class="install-tip hidden" data-testid="install-tip" role="dialog" aria-label="Astuce">
  <div class="install-tip-inner">
    <p data-testid="install-tip-text">Astuce douce : sur Android (Chrome), ouvre le menu ⋮ puis « Ajouter à l’écran d’accueil ». L’appli s’ouvre comme une app, même sans réseau après la première visite.</p>
    <button type="button" class="btn ghost" id="install-tip-dismiss" data-testid="install-tip-dismiss">Compris</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  /* Service worker — multi-file deploy only */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
  /* Install tip — separate key so app save data is never touched */
  var TIP_KEY = "bf-seches-install-tip-dismissed-v1";
  function hideTip() {
    var el = document.getElementById("install-tip");
    if (el) el.classList.add("hidden");
  }
  function showTip() {
    var el = document.getElementById("install-tip");
    if (el) el.classList.remove("hidden");
  }
  try {
    if (!localStorage.getItem(TIP_KEY)) {
      /* slight delay so the tour / first paint settle */
      setTimeout(showTip, 1200);
    }
  } catch (e) {}
  var btn = document.getElementById("install-tip-dismiss");
  if (btn) {
    btn.addEventListener("click", function () {
      try { localStorage.setItem(TIP_KEY, "1"); } catch (e) {}
      hideTip();
    });
  }
})();
</script>
</body>
</html>
