dessin"],"q":"Que met-on sur une fiche outil ?","a":"Tu mets le nom de l’outil, la dernière vérification, le prochain contrôle, une remarque, et la signature ou l’initiale de qui a contrôlé. Tu peux classer critique, utile ou confort. Après entretien: date et suite. La fiche vit près de l’outil ou dans le carnet outils.","example":"Fiche tamis: critique; dernière vérif 28 octobre, toile correcte; prochain contrôle dans quinze jours; remarque « rechange dans la boîte »; initiales OT.","next":"Remplis une fiche complète pour la balance ou le tamis avec les champs ci-dessus.","alt":"Le carnet de la moto note date de révision et ce qu’il faudra revoir: même idée pour le tamis.","hint":"En ouvrant la fiche, sais-tu quand a eu lieu le dernier vrai contrôle ?","mod":"m10","li":4},{"keys":["travailler","atelier","regler","hauteur","table","reduire","fatigue","gestes","dangereux","cacher","stock","decorer"],"q":"Pourquoi régler la hauteur de table ?","a":"Pour ne pas casser ton dos et garder une posture tenable. La fatigue crée des oublis d’étiquette et des gestes moins sûrs. Des épaules plus basses au conditionnement protègent le corps et le produit. Tu notes le réglage sur la liste d’ouverture.","example":"Tu cales la table d’emballage pour travailler sans te pencher. Après une heure, tu es encore précise sur les numéros de lot. Tu écris « hauteur réglée » sur la liste du matin.","next":"Règle une fois la hauteur pour tes épaules au conditionnement et note le avant ou après.","alt":"Écraser le mil trop bas pendant des heures fatigue tout le corps: on monte le mortier ou on se relaie.","hint":"Après une heure d’emballage, où sens-tu la fatigue en premier ?","mod":"m10","li":5},{"keys":["travailler","atelier","faire","allees","garder","libres","stocker","coques","tas","laisser","couteaux"],"q":"Que faire des allées ?","a":"Tu les gardes libres. Un carton de coques ou un seau au milieu du passage prépare la chute et le stress. Tu coches « allée libre » à l’ouverture. Tu ranges aussitôt ce qui traîne. Un atelier clair se lit aussi au sol.","example":"Le matin tu trouves le bac à coques dans le passage vers l’emballage. Tu le remets dans la zone marquée avant d’ouvrir le lot. Tu coches la ligne allée sur la liste de contrôle.","next":"Ajoute « allée libre » à la liste d’ouverture et applique-la demain dès l’arrivée.","alt":"Laisser un seau au milieu de la cour, c’est offrir un obstacle à quiconque traverse vite.","hint":"Peux-tu traverser l’atelier les bras chargés sans contourner un objet ?","mod":"m10","li":5},{"keys":["bases","vendre","aliment","doit","etre","promesse","claire","tenable","floue","medicale","inventee"],"q":"Que doit être la promesse ?","a":"La promesse doit être claire, répétée partout la même, et tenue par le sachet réel. Chez toi: poudre de pain de singe, cent pour cent pulpe, rien d’ajouté. Une promesse floue force la cliente à inventer la sienne. Prix, sachet, lieu et message doivent se tenir ensemble.","example":"Sur le sachet, au marché et dans ta bouche, la même phrase. Le sachet se referme. Tu ne promets rien d’autre inventé pour forcer la vente.","next":"Écris ta promesse en une phrase et vérifie qu’elle apparaît sur sachet et discours oral.","alt":"Dire « riz propre et bien pesé » et le tenir à chaque vente construit la file; changer de phrase chaque jour la casse.","hint":"Ta cliente entend-elle la même chose sur le sachet et dans ta voix ?","mod":"m11","li":0},{"keys":["bases","vendre","aliment","canaux","demarrage","canal","maitrise","aucun","dix","coup"],"q":"Canaux au démarrage ?","a":"Tu en choisis un seul au démarrage: un marché, un cercle de voisines, un dépôt-vente ou des commandes groupées. Pas dix canaux d’un coup. Tu mesures les rachats sur quinze jours d’essai. Tu notes les objections pour clarifier le message.","example":"Quinze jours sur le marché de quartier seulement. Tu notes rachats et freins. Ensuite seulement tu envisages une boutique amie.","next":"Nomme ton canal unique des quinze prochains jours et refuse par écrit les autres pour cette période.","alt":"Mieux vaut un petit étal bien tenu qu’être partout et nulle part le même jour.","hint":"Combien de lieux de vente as-tu vraiment le temps de bien suivre en même temps ?","mod":"m11","li":0},{"keys":["chaine","valeur","fournisseurs","cartographier","maillons","fruit","cliente","logo","seul","radio"],"q":"Que cartographier ?","a":"Tu cartographies la chaîne du fruit à la cliente: récolte ou achat de gousses, transport, atelier, emballage, vente. Sous chaque case: fournisseur actuel et plan B. Tu dates la page. Tu choisis une seule amélioration de maillon pour la semaine.","example":"Cinq cases sur une page Baobab Bliss. Sous transport tu notes ton chauffeur habituel et un plan B. Cette semaine tu améliores seulement la propreté des sacs de route.","next":"Dessine les cases et remplis fournisseur actuel plus plan B sous au moins trois d’entre elles.","alt":"Dessiner le chemin du mil du champ à l’assiette montre où une panne bloquerait tout le repas.","hint":"Quels maillons, s’ils cassent demain, arrêtent ton sachet ?","mod":"m11","li":1},{"keys":["chaine","valeur","fournisseurs","criteres","ecrits","choisir","mentir","vexer","decor"],"q":"Critères écrits ?","a":"Oui: tu gardes une grille écrite qualité, délai, prix et transparence pour choisir et suivre les fournisseurs. Un tarif très bas avec des fruits douteux se paie plus cher ensuite. Contrôler un fournisseur peut tenir en une visite, quelques questions, un sac test. Tu restes claire et respectueuse.","example":"Avant d’acheter un nouveau lot de gousses, tu coches ta grille: propreté vue, délai annoncé, clarté sur l’origine, prix. Tu dates. Tu refuses un lot opaque sur l’origine malgré un prix bas.","next":"Crée ou complète la grille qualité-délai-prix-transparence et utilise-la sur un achat réel.","alt":"Choisir une couturière seulement sur le prix, sans regarder délais et finitions, se paie plus tard.","hint":"Tes quatre critères tiennent-ils sur une page que tu ouvres avant de payer ?","mod":"m11","li":1},{"keys":["environnement","produits","baobab","coques","abord","gerer","mesurer","laisser","pourrir","mettre","poudre"],"q":"Coques d’abord ?","a":"D’abord tu les sépares, tu les pèses, tu marques une zone au sol loin de l’emballage, et tu expliques la zone à toute aide. Ensuite tu cherches un usage simple testable. Sans pesée et sans zone, le « plus tard » devient un tas sale. Une seule idée d’usage suffit pour commencer.","example":"Premier geste du lot: bac coques dans le carré marqué, pesée notée, phrase à Aïcha. Ensuite tu appelles l’artisan intéressé. Pas l’inverse.","next":"Avant toute idée d’usage, marque la zone et pèse les coques d’un lot.","alt":"On range les épluchures avant d’imaginer le compost: sinon la cuisine reste envahie.","hint":"As-tu déjà le lieu et le poids, ou seulement l’idée d’un bel usage ?","mod":"m11","li":2},{"keys":["responsabilite","sociale","simple","commencer","personnes","verite","produit","claim","invente","medaille"],"q":"Par où commencer ?","a":"Par des gestes concrets visibles: cinq règles près du lave-mains, accords de travail datés, horaires humains, écoute du voisinage, vérité sur le produit. Tu formes cinq minutes sur une seule règle avant le lot. Tu suis les heures réellement travaillées.","example":"Tu commences par afficher lavage, cheveux, bijoux, blessures, visiteurs. Tu signes avec ton aide tâche et rémunération du jour. Tu notes les heures le soir.","next":"Affiche les cinq règles et signe un accord de travail simple pour la prochaine session d’aide.","alt":"On commence une équipe de cour par les règles de respect et de paiement, pas par un long discours abstrait.","hint":"Quel geste visible près du lave-mains peux-tu poser aujourd’hui ?","mod":"m11","li":3},{"keys":["responsabilite","sociale","simple","aide","remuneration","regles","radio","seule","rien"],"q":"Avant une aide ?","a":"Avant qu’elle commence le lot, tu poses clarté sur tâche, durée, rémunération et pauses, sur une page datée que vous signez. Tu fais un briefing court sur une seule règle. Tu montres lave-mains, zones et allées. Sans ce cadre, tu ne protèges ni son temps ni le tien.","example":"Aïcha arrive. Tu lis: emballage trois heures, rémunération convenue, pause au milieu, règle du jour « bijoux retirés ». Vous signez. Puis le lot commence.","next":"Prépare la page d’accord type et utilise-la avant la prochaine venue d’une aide.","alt":"Avant d’envoyer quelqu’un au marché avec ton argent, on dit quoi acheter, pour combien, et quand rentrer.","hint":"Tâche, durée, rémunération et pauses sont-elles écrites avant que les mains touchent la poudre ?","mod":"m11","li":3},{"keys":["conduire","projet","douze","dix","huit","mois","calendrier","intentions","empilent","fin","gout","ameliore"],"q":"Sans calendrier ?","a":"Sans calendrier tu fais tout le même jour ou tu oublies ce qui bloque autre chose. La frise ordonne les jalons sur douze à dix-huit mois. Tu marques le chemin critique. Chaque mois tu passes en revue: fait, décalé, annulé. Une frise murale regardée conduit mieux qu’un plan secret.","example":"Sans frise tu voulais étiquette, nouveau canal et revue des coûts la même semaine. Avec frise tu enchaînes: étiquette d’abord, puis essai de vente, puis coûts.","next":"Pose trois jalons sur une frise visible et partage-la une fois avec ton aide.","alt":"Sans calendrier de pluie et de semis, on sème n’importe quand et on s’étonne de la récolte.","hint":"Qu’est-ce qui, sur un mur, t’empêcherait de tout empiler sur la même semaine ?","mod":"m11","li":4},{"keys":["financer","inventer","programmes","abord","separer","maison","atelier","programme","melanger"],"q":"D’abord ?","a":"D’abord tu sépares l’argent du ménage et celui de l’atelier. Ensuite tu listes besoins et sources génériques avec leurs contraintes. Tu n’inventes pas un programme non vérifié. Tu dates les décisions. Le épreuve de ventes basses vient avant de signer une échéance lourde.","example":"Deux enveloppes distinctes. Puis tableau des besoins sachets et fruits. Sources: fonds propres d’abord. Tu dates. Pas de crédit signé ce soir.","next":"Sépare physiquement ou sur le carnet enveloppe maison et enveloppe atelier aujourd’hui.","alt":"Avant de compter les gains de la boutique, on sait quelle caisse est la boutique et laquelle est la maison.","hint":"Peux-tu montrer du doigt l’argent atelier sans toucher l’argent maison ?","mod":"m11","li":5},{"keys":["financer","inventer","programmes","cites","cote","chaque","source","argent","tableau","type","generique","cout"],"q":"Que cites-tu à côté de chaque source d’argent sur ton tableau ?","a":"Tu cites la contrainte et le coût de cette source, plus une date de décision. Un crédit porte des échéances. Une avance client demande une livraison tenue. Les fonds propres sont limités mais souples. Aucun chiffre inventé présenté comme acquis.","example":"Ligne « avance cliente »: contrainte livrer trente sachets pour telle date; décision samedi. Ligne « crédit »: contrainte échéance mensuelle; en attente après épreuve de ventes basses.","next":"Sur ton tableau, ajoute une colonne contrainte et une colonne date de décision à côté de chaque source.","alt":"Emprunter un pagne à une voisine, c’est aussi noter quand le rendre: la source a toujours une contrainte.","hint":"À côté du nom de la source, as-tu écrit ce qu’elle t’oblige à tenir ?","mod":"m11","li":5},{"keys":["diagramme","procede","separer","pages","flux","baobab","futur","sechage","mangue","cacher","dechets","melanger"],"q":"Que séparer sur les pages ?","a":"Tu sépares le flux baobab d’un futur séchage mangue. Sur la page baobab tu n’ajoutes pas de grande flèche de chaleur centrale: la pulpe arrive déjà sèche dans la gousse. Tu versions chaque dessin. L’archive garde l’ancien. Légende et frontière de système clarifient ce qui est dedans ou dehors.","example":"Page 1 datée: procédé Baobab Bliss seulement. Page à part titrée « mangue plus tard ». Aucune flèche de four sur la page baobab.","next":"Vérifie ton diagramme: retire toute flèche de séchage chaud central si elle n’existe pas chez toi, et date la version.","alt":"Ne pas mélanger sur le même croquis le chemin de l’école et celui du marché sans titres: on se trompe de route.","hint":"Ta page baobab porte-t-elle encore des étapes d’un autre produit ?","mod":"cap","li":0},{"keys":["diagramme","procede","pulpe","baobab","deja","seche","gousse","jamais","controlee","toujours","sechage","chaud"],"q":"La pulpe de baobab ?","a":"La pulpe de baobab est déjà sèche dans la gousse. Ton diagramme ne place donc pas un séchage chaud central comme pour une mangue. Un finissage doux éventuel se marque comme optionnel et rare. Les contrôles et les sorties de coques et graines restent visibles sur le dessin.","example":"Sur ton schéma, après casse et séparation vient le tamis, pas un grand bloc « séchoir ». Un petit encadré optionnel suffit si tu fais parfois un finissage doux.","next":"Relis ton diagramme et étiquette clairement toute étape de chaleur comme optionnelle si elle n’est pas centrale.","alt":"Le mil déjà séché au champ ne repasse pas forcément au séchoir central: on le note ainsi sur le croquis du grenier.","hint":"Où la sécheresse de ta pulpe commence-t-elle vraiment: dans la gousse, ou dans un appareil ?","mod":"cap","li":0},{"keys":["plan","maitrise","atelier","bon","vivant","proportionne","absent","roman","jamais"],"q":"Un bon plan ?","a":"Un bon plan de maîtrise est proportionné, vivant, relié au diagramme, avec responsable et enregistrement pour chaque surveillance. Il liste points sensibles, quoi surveiller, limites, actions si écart. Une page tenue bat un roman jamais lu. Tu dates la version.","example":"Trois priorités tenues ce mois: mains, corps étrangers, fermeture après contrôle simple. Chaque ligne a un qui et une coche réelle sur le lot.","next":"Limite ton plan aux lignes tenables cette saison et date la version rangée avec le diagramme.","alt":"Trois règles de cuisine vraiment suivies protègent mieux le repas que vingt pages collées et oubliées.","hint":"Combien de lignes as-tu réellement tenues sur le dernier lot ?","mod":"cap","li":1},{"keys":["verifier","etiquette","test","utile","lecture","bout","bras","aucun","prix","seul"],"q":"Test utile ?","a":"Le test à bout de bras est utile: une personne lit-elle l’essentiel facilement? Tu corriges taille et contraste, puis tu retestes. Une relecture extérieure montre ce que la cliente ne comprendra pas. Tu verifies aussi que le lot imprimé retrouve le carnet.","example":"Une amie à bout de bras lit dénomination et poids, rate le lot. Tu agrandis le lot, tu retestes, tu archives l’ancienne maquette.","next":"Fais un test à bout de bras avec une personne extérieure et note trois mots qu’elle a lus sans effort.","alt":"Un panneau de fête illisible de la route ne guide personne, même peint avec soin.","hint":"Qui a lu ton étiquette sans que tu sois à côté pour expliquer ?","mod":"cap","li":2},{"keys":["plan","duree","vie","base","date","observation","conditions","decrites","copie","magique","optimisme","seul"],"q":"Base d’une date ?","a":"La base d’une durée affichée, ce sont des observations datées sur des sachets réels: couleur, odeur, grain, fermeture, conditions de stockage. Tu restes en deçà du dernier point sain. Tu ne copies pas une date magique vue ailleurs. L’emballage et le stockage font partie de la base.","example":"Après des contrôles à 10, 20 et 30 jours en pièce décrite, tu annonces une durée plus courte que le dernier point sain, liée au sachet bien fermé.","next":"Avant toute date sur étiquette, vérifie que tu as au moins une série d’observations datées et décrites.","alt":"On ne promet la garde du tô que si on l’a regardé aux heures dites, pas sur le souvenir d’une voisine.","hint":"Quelle observation datée soutient le chiffre que tu veux imprimer ?","mod":"cap","li":3},{"keys":["fiche","couts","dossier","devant","chiffre","invente","ecrire","exemple","effacer","trace","presenter","officiel"],"q":"Devant un chiffre inventé ?","a":"Tu le marques clairement comme exemple d’exercice, jamais comme acquis. Tu annexes la nature de la source: ticket, estimation, ou exemple inventé. Sans cette mention, le dossier devient fragile dès la première question. Tu dates la fiche.","example":"Sur la ligne transport tu écris un montant d’exemple et la mention « exemple d’exercice ». Plus loin une ligne sachets porte « ticket du 12 octobre ».","next":"Parcours ta fiche et marque chaque chiffre inventé avec la mention d’exemple avant de la montrer.","alt":"Sur une liste de marché, on note « prix imaginé » à côté d’un montant inventé pour ne pas se croire riche.","hint":"Un lecteur extérieur voit-il tout de suite quels chiffres sont réels et lesquels sont d’exercice ?","mod":"cap","li":4},{"keys":["fiche","couts","dossier","seuil","volume","couvrir","fixes","couleur","logo","radio"],"q":"Seuil ?","a":"Le seuil de rentabilité est le niveau où le prix couvre le coût complet au volume réaliste. Tu l’entoures après chaque recalcul. Tu relies la fiche au prix de lancement. Si le volume change, tu recalcules le même jour. Tu peux y lire si tu vends trop juste.","example":"Après ajout d’une ligne main-d’œuvre, tu recalcules, tu entoures le nouveau seuil, tu vérifies que le prix du marché le couvre encore au volume prévu.","next":"Entoure le seuil sur ta fiche actuelle et écris une phrase qui le lie au prix de lancement.","alt":"Le point où la vente des beignets a enfin payé farine, bois et ton temps: c’est le seuil qu’on surveille.","hint":"Le seuil est-il visible d’un coup d’œil, et relié au prix que tu annonces ?","mod":"cap","li":4},{"keys":["plan","lancement","meilleur","demarrage","canal","modeste","maitrise","grande","annonce","vide","aucun","critere"],"q":"Meilleur démarrage ?","a":"Un démarrage prudent tient en un canal, un volume plafonné, un message gelé, des critères écrits et une date de revue. Tu prépares stock, étiquettes validées et carnet de retours. Le jour J, tu ne touches pas à trois réglages d’un coup. Après revue: continuer, ajuster ou pause, versionné et daté.","example":"Tu ouvres sur un marché, trente sachets max, une phrase orale, revue à quinze jours sur rachats et objections. Tu versions ensuite le plan selon la décision.","next":"Écris canal, plafond, phrase, critères et date de revue sur une seule page avant de vendre.","alt":"On goûte un nouveau plat d’abord en famille restreinte avant d’inviter tout le quartier.","hint":"Ton cadre d’essai tient-il sur une page avec une date de revue ?","mod":"cap","li":5},{"keys":["plan","lancement","premier","sachet","date","revue","criteres","rien","ecrire","changer","reglages"],"q":"Avant le premier sachet ?","a":"Avant le premier sachet de lancement tu as: étiquette validée, message oral unique, volume plafond, critères continuer ou pause, date de revue, stock préparé, carnet de retours prêt. Tu gèles tamis, prix et sachet pour ne pas tout mélanger le jour J. Tu sais qui fait quoi si tu as une aide.","example":"La veille du marché: épreuve d’étiquette validée collée, phrase répétée, par exemple trente sachets prêts, feuille des mots exacts vide datée, critères écrits. Rien d’autre ne bouge ce samedi-là.","next":"Coche une liste « veille de lancement » avec les points ci-dessus avant ton prochain essai.","alt":"Avant d’ouvrir l’étal, on a prix, marchandise et monnaie prêts: sinon la première cliente attend dans le vide.","hint":"Que te manque-t-il encore sur la table la veille, hors la poudre elle-même ?","mod":"cap","li":5}],"META":{"version":3,"updated":"2026-10-31","note":"v3 merge: A for m0-m3, B for m4, batchB for m5-m7, C for m8-cap with templated rewrite | content fix pass (layers+boilerplate) | pad-fix m10–cap (within-field dups=0) | boilerplate scrub + topup m0–m9; cross-lesson detector | cours4 audit+prof fix | qbank unique examples","choices":[{"module":"m0","file":"A.json","n_lessons":5,"why":"Deeper expert (319 vs 265 avg); same structure; scrub forbidden en-dash/= in main"},{"module":"m1","file":"A.json","n_lessons":7,"why":"Deeper chemistry depth (pectine, minéraux, oxydation); stronger expert"},{"module":"m2","file":"A.json","n_lessons":7,"why":"Deeper micro/hygiene expert; includes hygiene personnelle lesson"},{"module":"m3","file":"A.json","n_lessons":6,"why":"Deeper labelling (déclaration nutritionnelle, mentions obligatoires); scrub symbols"},{"module":"m4","file":"B.json","n_lessons":7,"why":"Stronger process-engineering framing; pulp already dry; dedicated future hot-drying lesson; deeper expert"},{"module":"m5","file":"batchB.json","n_lessons":6,"why":"Clean main layers; full activity mix incl. calc; solid packaging depth"},{"module":"m6","file":"batchB.json","n_lessons":7,"why":"Clean of forbidden 'danger' and acronyms on main; good HACCP plain-language"},{"module":"m7","file":"batchB.json","n_lessons":6,"why":"Clean of NBF acronym on main; honest about Burkina baobab standard text availability"},{"module":"m8","file":"C.json","n_lessons":6,"why":"Only version; real sensory quizzes; keep"},{"module":"m9","file":"C.json","n_lessons":6,"why":"Only version; rewrite templated body/prof/quiz from tip/plus/expert"},{"module":"m10","file":"C.json","n_lessons":6,"why":"Only version; rewrite templated body/prof/quiz"},{"module":"m11","file":"C.json","n_lessons":6,"why":"Only version; rewrite templated body/prof/quiz"},{"module":"cap","file":"C.json","n_lessons":6,"why":"Only version; rewrite templated body/prof/quiz"}],"fix2":"aggressive pad to word mins"}}</script>
<script>
const STORE_KEY='olga-cours-agro-v1';
const DATA=window.COURSE_DATA;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function nbsp(s){return String(s==null?'':s).replace(/(\d) (\w)/g,'$1\u00a0$2').replace(/100 pour cent/g,'100\u00a0pour\u00a0cent');}
function stripAcc(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function el(tag,cls,html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function defaultState(){
  return {v:2,pace:18,doneLessons:{},quiz:{},wrong:[],badges:[],streak:0,lastDay:'',weekGoal:3,weekDone:0,weekId:'',exHints:{},askHist:[],capNotes:{},moduleCele:{},cardPos:{}};
}
function load(){try{const r=localStorage.getItem(STORE_KEY);if(!r)return defaultState();const o=JSON.parse(r);return Object.assign(defaultState(),o);}catch(e){return defaultState();}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(S));updateSaved();}
let S=load();
let view='home';
let ctx={mod:null,li:0,screen:'lesson'};

function today(){const d=new Date();return d.toISOString().slice(0,10);}
function weekId(){const d=new Date();const t=new Date(d.getFullYear(),0,1);const w=Math.ceil((((d-t)/86400000)+t.getDay()+1)/7);return d.getFullYear()+'-W'+w;}
function touchStreak(){
  const t=today();const w=weekId();
  if(S.weekId!==w){S.weekId=w;S.weekDone=0;}
  if(S.lastDay!==t){
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    S.streak=(S.lastDay===y)?(S.streak||0)+1:1;
    S.lastDay=t;
  }
}
function updateSaved(){const n=$('#saved');if(n)n.textContent='Enregistré';}

function profSVG(){
  return `<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#d6eaff"/><circle cx="24" cy="20" r="10" fill="#f5d0b0"/><ellipse cx="24" cy="38" rx="14" ry="10" fill="#7eb6ff"/><circle cx="20" cy="19" r="1.4" fill="#1d1d1f"/><circle cx="28" cy="19" r="1.4" fill="#1d1d1f"/><path d="M19 24c2 2 8 2 10 0" stroke="#c47a5a" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M12 16c4-8 20-8 24 0" stroke="#5b3a29" stroke-width="4" fill="none"/></svg>`;
}
function profBox(text, tip){
  let tipHtml=tip?`<div class="tip">Astuce : ${nbsp(tip)}</div>`:'';
  return `<div class="prof" data-testid="prof"><div>${profSVG()}</div><div class="bubble"><div class="tag">Ta prof, guide du cours</div><div>${nbsp(text)}</div>${tipHtml}</div></div>`;
}

function lessonsOf(mid){return DATA.LESSONS[mid]||[];}
function modMeta(mid){return DATA.MODULES.find(m=>m.id===mid);}
function lessonKey(mid,i){return mid+'#'+i;}
function isLessonDone(mid,i){return !!S.doneLessons[lessonKey(mid,i)];}
function moduleProgress(mid){
  const L=lessonsOf(mid);if(!L.length)return 0;
  let n=0;L.forEach((_,i)=>{if(isLessonDone(mid,i))n++;});
  return n/L.length;
}
function moduleComplete(mid){return moduleProgress(mid)>=1;}
function lessonTitle(mid,li){
  const L=lessonsOf(mid)[li];
  return L?L.title:'';
}

function setTab(name){
  if(name==='badges') name='save';
  view=name;ctx.screen='lesson';
  $$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name||(name==='save'&&b.dataset.tab==='badges')));
  render();
}

function render(){
  const root=$('#app');root.innerHTML='';
  if(view==='home')renderHome(root);
  else if(view==='map')renderMap(root);
  else if(view==='ask')renderAsk(root);
  else if(view==='review')renderReview(root);
  else if(view==='save')renderSave(root);
  else if(view==='module')renderModule(root);
  else if(view==='lesson')renderLesson(root);
  window.scrollTo(0,0);
}

function renderHome(root){
  const doneMods=DATA.MODULES.filter(m=>moduleComplete(m.id)).length;
  const totalL=DATA.MODULES.reduce((a,m)=>a+lessonsOf(m.id).length,0);
  const doneL=Object.keys(S.doneLessons).filter(k=>S.doneLessons[k]).length;
  const pct=Math.round(100*doneL/Math.max(1,totalL));
  root.appendChild(el('div','h2',nbsp('Bonjour Olga')));
  root.appendChild(el('div','muted',nbsp('Mon cours d’ingénieure agroalimentaire, Baobab Bliss, Ouagadougou')));
  const honest=el('div','callout','');
  honest.innerHTML=nbsp('Ce cours suit les matières des écoles d’ingénieurs alimentaires en France, et les règles utiles en France, en Europe et au Burkina. Ce n’est pas un diplôme officiel. C’est une autoformation pour ton atelier, à ton rythme sur 12 à 18 mois.');
  root.appendChild(honest);
  root.insertAdjacentHTML('beforeend',profBox('Je suis ta prof, un guide intégré au cours (pas une personne réelle ni une intelligence en ligne). Chaque leçon dure environ 5 à 10 minutes, avec plusieurs petites cartes. Tu peux me poser des questions hors ligne.','Lis une ou deux leçons par séance, puis fais l’exercice chez toi.'));
  const p=el('div','card','');
  p.innerHTML=`<div class="h3">Ta progression</div>
    <div class="progress" data-testid="progress"><i style="width:${pct}%"></i></div>
    <div class="muted">${doneL} leçons sur ${totalL}, ${doneMods} modules terminés, série ${S.streak||0} jour(s)</div>
    <div class="muted">Objectif de la semaine : ${S.weekDone||0} / ${S.weekGoal||3} leçons</div>`;
  root.appendChild(p);
  const pace=el('div','card','');
  pace.innerHTML=`<div class="h3">Ton rythme (indicatif)</div>
    <label>Je choisis</label>
    <select id="paceSel"><option value="12">12 mois</option><option value="18">18 mois</option></select>
    <div class="muted" id="paceHint"></div>`;
  root.appendChild(pace);
  $('#paceSel').value=String(S.pace||18);
  const setHint=()=>{const v=+$('#paceSel').value;S.pace=v;save();
    $('#paceHint').textContent=v===12?'Un peu plus chaque semaine.':'Plus léger, idéal pour démarrer.';};
  setHint();$('#paceSel').onchange=setHint;

  root.appendChild(el('div','h3','Tes modules'));
  DATA.MODULES.forEach(m=>{
    const pr=Math.round(100*moduleProgress(m.id));
    const b=document.createElement('button');b.className='row';b.type='button';
    b.innerHTML=`<div class="meta"><strong>${nbsp(m.title)}</strong>
      <span>${nbsp(m.monthHint+', '+m.weeks+' sem., '+m.hours+' h (indicatif)')}</span>
      ${moduleComplete(m.id)?'<span class="badge">'+nbsp(m.badge)+'</span>':'<span class="muted">'+pr+' %</span>'}</div>`;
    b.onclick=()=>{view='module';ctx={mod:m.id,li:0,screen:'list'};render();};
    root.appendChild(b);
  });
}

function renderMap(root){

function stemFr(w){
  w=stripAcc(w);
  if(w.length<=4)return w;
  const suf=['issement','ations','ation','ements','ement','euses','eurs','euse','eurs','iques','ique','ments','ment','tions','tion','ances','ance','ents','ent','ees','ee','és','es','er','ir','re','ez','ons','ais','ait','ant','aux','ale','ales','eux','ive','ives','ien','iens','ière','iere','ières','ieres'];
  for(const s of suf){if(w.endsWith(s)&&w.length-s.length>=4){w=w.slice(0,-s.length);break;}}
  return w;
}
function tokensOf(q){
  return stripAcc(q).replace(/[^a-z0-9%\s]/g,' ').split(/\s+/).filter(w=>w.length>1&&!STOP_FR.has(w));
}
function expandTokens(words){
  const out=new Set();
  words.forEach(w=>{
    out.add(w);out.add(stemFr(w));
    const syn=SYN[w]||SYN[stemFr(w)];
    if(syn)syn.forEach(s=>{out.add(stripAcc(s));out.add(stemFr(s));});
  });
  return [...out];
}
function editDist(a,b){
  if(Math.abs(a.length-b.length)>2)return 99;
  if(a===b)return 0;
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>i);
  for(let j=1;j<=n;j++){
    let prev=dp[0];dp[0]=j;
    for(let i=1;i<=m;i++){
      const tmp=dp[i];
      dp[i]=a[i-1]===b[j-1]?prev:1+Math.min(prev,dp[i],dp[i-1]);
      prev=tmp;
    }
  }
  return dp[m];
}
function fuzzyHit(word,hayTokens){
  if(hayTokens.has(word))return 2;
  if(word.length<4)return 0;
  for(const h of hayTokens){
    if(h.length<4)continue;
    if(editDist(word,h)<=1)return 1.5;
    if(word.length>=5&&h.length>=5&&editDist(word,h)<=2)return 1;
  }
  return 0;
}

function formatAnswer(item){
  const parts=[];
  if(item.a)parts.push(item.a);
  if(item.example)parts.push(item.example);
  if(item.next)parts.push('Prochaine étape : '+item.next);
  return parts.join(' ');
}

function scoreQbankItem(item, rawWords, expanded, ctxMod, ctxLi){
  const keyStr=stripAcc((item.keys||[]).join(' '));
  const qStr=stripAcc(item.q||'');
  const aStr=stripAcc((item.a||'')+' '+(item.example||''));
  const hay=keyStr+' '+qStr+' '+aStr;
  const hayTokens=new Set(hay.split(/\s+/).filter(Boolean).map(stemFr));
  (item.keys||[]).forEach(k=>hayTokens.add(stemFr(stripAcc(k))));
  let word=0;
  let overlap=0;
  const seen=new Set();
  rawWords.forEach(w=>{
    const sw=stemFr(w);
    if(hayTokens.has(sw)||hay.includes(w)){
      if(!seen.has(sw)){seen.add(sw);overlap+=1;}
    }
  });
  expanded.forEach(w=>{
    if(hay.includes(w))word+=2.5;
    word+=fuzzyHit(w,hayTokens);
  });
  let strongKey=false;
  (item.keys||[]).forEach(k=>{
    const kk=stripAcc(k);
    if(rawWords.some(w=>w===kk||stemFr(w)===stemFr(kk))){word+=4;strongKey=true;}
    else if(expanded.some(w=>w===kk||stemFr(w)===stemFr(kk)))word+=2.5;
    else if(kk.length>=4&&rawWords.some(w=>editDist(w,kk)<=1))word+=2;
  });
  for(let i=0;i<rawWords.length-1;i++){
    const bi=rawWords[i]+' '+rawWords[i+1];
    if(hay.includes(bi))word+=3;
  }
  let ctx=0;
  if(ctxMod&&item.mod===ctxMod){
    ctx+=6;
    if(typeof item.li==='number'&&item.li===ctxLi)ctx+=10;
  }
  return {s:word+ctx, word, overlap, strongKey};
}

function confidentHit(hit){
  // Refuse weak single-token accidents (e.g. nonsense + "inconnu").
  if(!hit||hit.word<6)return false;
  if(hit.strongKey&&hit.word>=6)return true;
  if(hit.overlap>=2&&hit.word>=6)return true;
  if(hit.overlap>=1&&hit.word>=12)return true;
  return false;
}

function searchAsk(q, opts){
  opts=opts||{};
  const rawWords=tokensOf(q);
  if(!rawWords.length)return [];
  const expanded=expandTokens(rawWords);
  const ctxMod=opts.mod||null;
  const ctxLi=typeof opts.li==='number'?opts.li:null;
  const scored=(DATA.QBANK||[]).map(item=>{
    const sc=scoreQbankItem(item,rawWords,expanded,ctxMod,ctxLi);
    return {item,s:sc.s,word:sc.word,overlap:sc.overlap,strongKey:sc.strongKey};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||b.word-a.word);
  return scored.slice(0,8);
}

function searchLessons(q){
  const rawWords=tokensOf(q);
  const expanded=expandTokens(rawWords);
  const hits=[];
  DATA.MODULES.forEach(m=>{
    lessonsOf(m.id).forEach((les,li)=>{
      const blob=stripAcc([les.title,les.prof,les.tip,les.simple,(les.body||[]).join(' ')].join(' '));
      let s=0;
      expanded.forEach(w=>{if(blob.includes(w))s+=2;});
      rawWords.forEach(w=>{if(stripAcc(les.title).includes(w))s+=4;});
      if(s>0)hits.push({mod:m.id,li,title:les.title,s,modTitle:m.title});
    });
  });
  return hits.sort((a,b)=>b.s-a.s).slice(0,5);
}

}

function markLessonDone(){
  const k=lessonKey(ctx.mod,ctx.li);
  if(!S.doneLessons[k]){S.doneLessons[k]=1;touchStreak();S.weekDone=(S.weekDone||0)+1;save();}
  if(moduleComplete(ctx.mod)){
    const m=modMeta(ctx.mod);
    if(!S.badges.includes(m.badge)){S.badges.push(m.badge);save();}
  }
}

function cardsOf(les){
  if(Array.isArray(les.body))return les.body;
  if(typeof les.body==='string' && les.body.trim())return [les.body];
  return ['(Leçon en cours de rédaction.)'];
}

function renderLesson(root){
  const m=modMeta(ctx.mod);const les=lessonsOf(ctx.mod)[ctx.li];
  const back=document.createElement('button');back.className='btn ghost';back.type='button';back.textContent='Liste du module';
  back.onclick=()=>{view='module';ctx.screen='list';render();};root.appendChild(back);
  root.appendChild(el('div','muted',nbsp(m.title)));
  root.appendChild(el('div','h2',nbsp(les.title)));
  root.insertAdjacentHTML('beforeend',profBox(les.prof, les.tip||les.profTip||''));

  const cards=cardsOf(les);
  const ck=lessonKey(ctx.mod,ctx.li);
  let pos=S.cardPos[ck]||0;if(pos>=cards.length)pos=0;
  const bodyWrap=el('div','card','');
  const bodyEl=el('div','lessonBody','');
  bodyEl.innerHTML=nbsp(cards[pos]);
  bodyWrap.appendChild(bodyEl);
  const pager=el('div','pager','');
  const prev=document.createElement('button');prev.className='btn soft';prev.type='button';prev.textContent='Carte précédente';prev.style.width='auto';prev.style.flex='1';
  const dots=el('div','dots',`Carte ${pos+1} / ${cards.length}`);
  const nextC=document.createElement('button');nextC.className='btn soft';nextC.type='button';nextC.textContent='Carte suivante';nextC.style.width='auto';nextC.style.flex='1';
  const paint=()=>{bodyEl.innerHTML=nbsp(cards[pos]);dots.textContent=`Carte ${pos+1} / ${cards.length}`;prev.disabled=pos===0;nextC.disabled=pos===cards.length-1;S.cardPos[ck]=pos;save();};
  prev.onclick=()=>{if(pos>0){pos--;paint();}};
  nextC.onclick=()=>{if(pos<cards.length-1){pos++;paint();}};
  pager.appendChild(prev);pager.appendChild(dots);pager.appendChild(nextC);
  bodyWrap.appendChild(pager);
  root.appendChild(bodyWrap);
  paint();

  const simpleBtn=document.createElement('button');simpleBtn.className='btn soft';simpleBtn.type='button';simpleBtn.id='btnSimple';
  simpleBtn.textContent='Je n’ai pas compris';simpleBtn.onclick=()=>{
    let box=$('#simpleBox');if(!box){box=el('div','callout','');box.id='simpleBox';simpleBtn.after(box);}
    box.innerHTML=profBox('Plus simple : '+les.simple);
  };
  root.appendChild(simpleBtn);

  const askHere=document.createElement('button');askHere.className='btn soft';askHere.type='button';askHere.textContent='Demander à ta prof (cette leçon)';
  askHere.onclick=()=>{view='ask';ctx={mod:ctx.mod,li:ctx.li,screen:'ask',fromLesson:true};$$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='ask'));render();};
  root.appendChild(askHere);

  root.appendChild(el('div','h3','Quiz'));
  (les.quiz||[]).forEach((qz,qi)=>renderQuiz(root,qz,qi,les));

  if(les.activity){root.appendChild(el('div','h3','Activité'));renderActivity(root,les.activity);}
  if(les.exercise){root.appendChild(el('div','h3','Chez toi'));renderExercise(root,les.exercise);}

  const plus=document.createElement('details');plus.className='fold';
  plus.innerHTML=`<summary>Pour aller plus loin</summary><div class="muted" style="margin-top:8px;white-space:pre-wrap">${nbsp(les.plus)}</div>`;root.appendChild(plus);
  const exp=document.createElement('details');exp.className='fold';exp.dataset.expert='1';
  exp.innerHTML=`<summary>Niveau expert</summary><div class="muted" style="margin-top:8px;white-space:pre-wrap">${esc(les.expert)}</div>`;root.appendChild(exp);

  const next=document.createElement('button');next.className='btn primary';next.type='button';next.textContent='Leçon suivante';
  next.onclick=()=>{markLessonDone();const L=lessonsOf(ctx.mod);if(ctx.li+1<L.length){ctx.li++;render();}else{view='module';render();}};
  root.appendChild(next);
  const done=document.createElement('button');done.className='btn ghost';done.type='button';done.textContent='Marquer terminée';
  done.onclick=()=>{markLessonDone();view='module';render();};root.appendChild(done);
}

function renderQuiz(root,qz,qi,les){
  const wrap=el('div','card qCard','');wrap.dataset.quiz=qi;
  wrap.innerHTML=`<div class="h3" style="font-size:15px">${nbsp(qz.q)}</div><div class="qChoices"></div><div class="qFeed"></div>`;
  root.appendChild(wrap);
  const box=wrap.querySelector('.qChoices');const feed=wrap.querySelector('.qFeed');
  let locked=false;
  qz.choices.forEach((ch,i)=>{
    const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=nbsp(ch);
    b.onclick=()=>{
      if(locked)return;
      if(i===qz.correct){
        locked=true;b.classList.add('ok');
        feed.innerHTML=profBox('Oui. '+qz.why_ok);
        const k=lessonKey(ctx.mod,ctx.li)+'::'+qi;S.quiz[k]=1;save();
      }else{
        b.classList.add('ko');
        const why=qz.why_ko||'Pas encore.';
        const hint=qz.hint||(les&&les.tip)||'Relis la carte qui parle de ce point, puis réessaie.';
        feed.innerHTML=profBox(why+' Voici un indice pour retrouver la bonne idée.')+
          `<div class="callout">${nbsp('Indice : '+hint)}</div>`+
          `<button class="btn soft retry" type="button">Réessayer</button>`+
          `<button class="btn ghost askWhy" type="button">Demander à ta prof</button>`;
        const w={mod:ctx.mod,li:ctx.li,q:qz.q,choices:qz.choices,correct:qz.correct,why_ok:qz.why_ok,why_ko:qz.why_ko};
        if(!S.wrong.some(x=>x.q===w.q)){S.wrong.push(w);save();}
        wrap.querySelector('.retry').onclick=()=>{locked=false;feed.innerHTML='';
          [...wrap.querySelectorAll('.choice')].forEach(c=>c.classList.remove('ok','ko'));};
        wrap.querySelector('.askWhy').onclick=()=>{
          view='ask';ctx={mod:ctx.mod,li:ctx.li,screen:'ask',fromLesson:true};
          $$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='ask'));
          renderAsk($('#app'), qz.q);
          // replace full render carefully
          const root=$('#app');root.innerHTML='';renderAsk(root,qz.q);
        };
      }
    };
    box.appendChild(b);
  });
}

function parseNum(v){
  if(v==null)return null;
  const t=String(v).trim();
  if(t==='')return null;
  const n=Number(t.replace(',','.'));
  return n;
}

function renderActivity(root,act){
  const wrap=el('div','card','');root.appendChild(wrap);
  if(act.type==='tf'){
    wrap.innerHTML=`<div>${nbsp(act.prompt)}</div>`;
    act.statements.forEach((st)=>{
      const row=el('div','','');row.style.margin='10px 0';
      row.innerHTML=`<div>${nbsp(st.t)}</div>`;
      const v=document.createElement('button');v.className='btn soft';v.type='button';v.textContent='Vrai';v.style.width='48%';v.style.display='inline-block';
      const f=document.createElement('button');f.className='btn soft';f.type='button';f.textContent='Faux';f.style.width='48%';f.style.display='inline-block';f.style.marginLeft='4%';
      const fb=el('div','','');
      const check=(val)=>{const ok=val===st.truth;fb.innerHTML=profBox((ok?'Oui. ':'Pas tout à fait. ')+st.why);};
      v.onclick=()=>check(true);f.onclick=()=>check(false);
      row.appendChild(v);row.appendChild(f);row.appendChild(fb);wrap.appendChild(row);
    });
  } else if(act.type==='order'){
    wrap.innerHTML=`<div>${nbsp(act.prompt)}</div><div class="orderList"></div><button class="btn soft checkOrder" type="button">Vérifier</button><div class="orderFeed"></div>`;
    let order=[...act.steps.map((_,i)=>i)];
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    const list=wrap.querySelector('.orderList');
    function paint(){
      list.innerHTML='';
      order.forEach((idx,pos)=>{
        const row=el('div','step','');
        row.innerHTML=`<span style="flex:1">${nbsp(act.steps[idx])}</span>`;
        const up=document.createElement('button');up.className='btn ghost';up.type='button';up.textContent='↑';up.onclick=()=>{if(pos>0){[order[pos-1],order[pos]]=[order[pos],order[pos-1]];paint();}};
        const down=document.createElement('button');down.className='btn ghost';down.type='button';down.textContent='↓';down.onclick=()=>{if(pos<order.length-1){[order[pos+1],order[pos]]=[order[pos],order[pos+1]];paint();}};
        row.appendChild(up);row.appendChild(down);list.appendChild(row);
      });
    }
    paint();
    let hintN=0;
    wrap.querySelector('.checkOrder').onclick=()=>{
      const ok=order.every((v,i)=>v===act.correct[i]);
      const feed=wrap.querySelector('.orderFeed');
      if(ok) feed.innerHTML=profBox('Parfait. '+act.solution);
      else {hintN++;const h=hintN===1?act.hint1:hintN===2?act.hint2:act.solution;feed.innerHTML=profBox(h);}
    };
  } else if(act.type==='match'){
    wrap.innerHTML=`<div>${nbsp(act.prompt)}</div><div class="matchArea"></div><button class="btn soft checkMatch" type="button">Vérifier</button><div class="matchFeed"></div>`;
    const area=wrap.querySelector('.matchArea');
    const sel={};
    act.left.forEach((L,i)=>{
      const row=el('div','','');row.style.margin='8px 0';
      row.innerHTML=`<div><strong>${nbsp(L)}</strong></div>`;
      const selEl=document.createElement('select');
      selEl.innerHTML='<option value="">Choisir…</option>'+act.right.map((r,ri)=>`<option value="${ri}">${nbsp(r)}</option>`).join('');
      selEl.onchange=()=>{sel[i]=+selEl.value;};
      row.appendChild(selEl);area.appendChild(row);
    });
    let hintN=0;
    wrap.querySelector('.checkMatch').onclick=()=>{
      let ok=true;Object.keys(act.pairs).forEach(k=>{if(sel[+k]!==act.pairs[k]&&sel[k]!==act.pairs[k])ok=false;});
      const feed=wrap.querySelector('.matchFeed');
      if(ok && Object.keys(sel).length===act.left.length) feed.innerHTML=profBox('Oui. '+act.solution);
      else {hintN++;feed.innerHTML=profBox(hintN===1?act.hint1:hintN===2?act.hint2:act.solution);}
    };
  } else if(act.type==='calc'){
    wrap.innerHTML=`<div>${nbsp(act.prompt)}</div>`;
    act.fields.forEach(f=>{wrap.innerHTML+=`<label>${nbsp(f.label)}</label><input data-f="${f.id}" inputmode="decimal" />`;});
    wrap.innerHTML+=`<button class="btn soft calcGo" type="button">Calculer avec mes chiffres</button><div class="calcOut muted"></div><div class="muted">${nbsp(act.tip||'')}</div>`;
    wrap.querySelector('.calcGo').onclick=()=>{
      const vals={};act.fields.forEach(f=>{vals[f.id]=parseNum(wrap.querySelector(`[data-f="${f.id}"]`).value);});
      const out=wrap.querySelector('.calcOut');
      const bad=Object.values(vals).some(v=>v!=null&&(isNaN(v)||!isFinite(v)));
      if(bad){out.textContent='Un chiffre n’est pas lisible. Utilise une virgule ou un point, sans lettres.';return;}
      const neg=Object.values(vals).some(v=>v!=null&&v<0);
      if(neg){out.textContent='Un poids ou un prix négatif n’a pas de sens ici. Corrige le signe.';return;}
      const huge=Object.values(vals).some(v=>v!=null&&v>1e9);
      if(huge){out.textContent='Ce chiffre est énorme. Vérifie l’unité (grammes, FCFA).';return;}
      if(act.fields.length===2 && act.fields[0].id==='avant'){
        if(vals.avant==null||vals.apres==null||isNaN(vals.avant)||isNaN(vals.apres)){out.textContent='Remplis les deux poids avec tes chiffres, ou laisse pour plus tard.';return;}
        if(vals.avant===0){out.textContent='Le poids avant est zéro. Remplis un vrai poids.';return;}
        const d=vals.avant-vals.apres;out.textContent='Eau retirée approximative : '+d+' g (tes chiffres).';
      } else if(act.fields.length===3 && act.fields[0].id==='a'){
        if([vals.a,vals.b,vals.c].some(x=>x==null||isNaN(x))){out.textContent='Remplis les trois notes.';return;}
        out.textContent='Moyenne : '+((vals.a+vals.b+vals.c)/3).toFixed(2);
      } else if(act.fields[0].id==='fruit'||act.fields[0].id==='ech'){
        let sum=0,n=0;Object.values(vals).forEach(v=>{if(v!=null&&!isNaN(v)){sum+=v;n++;}});
        out.textContent=n?('Total des cases remplies : '+sum+' FCFA'):'Toutes les cases sont vides — c’est OK.';
      } else if(act.fields[0].id==='t1'){
        if(vals.t1==null||vals.t2==null){out.textContent='Remplis tes deux durées.';return;}
        out.textContent='Essai 1 : '+vals.t1+' min, essai 2 : '+vals.t2+' min. Compare aussi le toucher.';
      } else if(act.fields[0].id==='brut'){
        if(vals.brut==null||vals.pulpe==null||isNaN(vals.brut)||isNaN(vals.pulpe)||vals.brut===0){out.textContent='Remplis poids fruit et poids pulpe (fruit différent de zéro).';return;}
        out.textContent='Rendement pulpe approx. : '+((100*vals.pulpe)/vals.brut).toFixed(1)+' % (tes chiffres).';
      } else out.textContent=nbsp(act.note||'');
      out.insertAdjacentHTML('afterend',profBox(act.note||'Note tes chiffres dans ton carnet.'));
    };
  } else if(act.type==='label'){
    wrap.innerHTML=`<div>${nbsp(act.prompt)}</div>`;
    if(act.svg){const d=el('div','draw','');d.innerHTML=act.svg;wrap.appendChild(d);}
    const sel={};let hintN=0;
    act.labels.forEach((lab,i)=>{
      const row=el('div','','');row.innerHTML=`<label>${nbsp(lab)}</label>`;
      const s=document.createElement('select');
      const opts=[...new Set(Object.values(act.correct))];
      s.innerHTML='<option value="">Choisir…</option>'+opts.map(o=>`<option>${nbsp(o)}</option>`).join('');
      s.onchange=()=>{sel[i]=s.value;};row.appendChild(s);wrap.appendChild(row);
    });
    const btn=document.createElement('button');btn.className='btn soft';btn.type='button';btn.textContent='Vérifier';
    const feed=el('div','','');wrap.appendChild(btn);wrap.appendChild(feed);
    btn.onclick=()=>{
      const corr=act.correct;
      const ok=act.labels.every((_,i)=>sel[i]===corr[String(i)]||sel[i]===corr[i]);
      if(ok) feed.innerHTML=profBox('Oui. '+act.solution);
      else {hintN++;feed.innerHTML=profBox(hintN===1?act.hint1:hintN===2?act.hint2:act.solution);}
    };
  } else if(act.type==='case'){
    wrap.innerHTML=`<div class="h3">${nbsp(act.prompt)}</div><div class="muted">${nbsp(act.story)}</div><div style="margin-top:8px">${nbsp(act.q)}</div>`;
    const feed=el('div','','');
    act.choices.forEach((ch,i)=>{
      const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=nbsp(ch);
      b.onclick=()=>{
        if(i===act.correct){b.classList.add('ok');feed.innerHTML=profBox(act.why_ok);}
        else{b.classList.add('ko');feed.innerHTML=profBox(act.why_ko+' Réessaie.');}
      };
      wrap.appendChild(b);
    });
    wrap.appendChild(feed);
  }
}

function renderExercise(root,ex){
  const wrap=el('div','card','');
  wrap.innerHTML=`<div>${nbsp(ex.prompt)}</div>
    <button class="btn soft hint1" type="button">Indice 1</button>
    <button class="btn soft hint2" type="button">Indice 2</button>
    <button class="btn soft sol" type="button">Voir une solution exemple</button>
    <div class="exFeed"></div>
    <label>Ma note (pour moi)</label>
    <textarea class="exNote" rows="3" placeholder="Écris ici si tu veux"></textarea>`;
  root.appendChild(wrap);
  const key=lessonKey(ctx.mod,ctx.li)+'::ex';
  wrap.querySelector('.exNote').value=S.capNotes[key]||'';
  wrap.querySelector('.exNote').onchange=e=>{S.capNotes[key]=e.target.value;save();};
  const feed=wrap.querySelector('.exFeed');
  wrap.querySelector('.hint1').onclick=()=>{feed.innerHTML=profBox('Indice 1 : '+ex.hint1);};
  wrap.querySelector('.hint2').onclick=()=>{feed.innerHTML=profBox('Indice 2 : '+ex.hint2);};
  wrap.querySelector('.sol').onclick=()=>{feed.innerHTML=profBox('Exemple : '+ex.solution);};
}

function boot(){
  $$('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  updateSaved();render();
}
document.addEventListener('DOMContentLoaded',boot);

</script>
