l’humidité et à l’oxygène, protection mécanique, opacités si besoin. Communication: dénomination, poids, lot, contact. Pour une poudre sèche hygroscopique, la barrière vapeur domine souvent. Le suremballage coûte et pollue; le sous-emballage abîme le produit. Le bon choix est proportionné à la durée de vie visée et au canal de vente. Une grille simple: durée de vie visée, climat, canal, budget film. Tu scores chaque option de film sur ces axes. L’option gagnante est un compromis explicite, pas un coup de cœur.","expert":"Cadre ingénieur: interaction emballage–aliment–environnement. Le flux de vapeur à travers un film se caractérise par un taux de transmission de vapeur d’eau (WVTR, g/(m², 24 h) dans des conditions de test). La durée jusqu’à une humidité critique dépend de WVTR, de la surface A, de la masse de solide et de l’écart d’humidité relative (Labuza packaging). Forme simplifiée souvent utilisée: t_s ≈ m_s (X_c − X_0) / (A , WVTR , ΔHR/100). Exemple (nombres inventés): m_s=0,25 kg, ΔX=0,02, A=0,03 m², WVTR=1 g/(m², 24 h), ΔHR=40 → t_s de l’ordre de quelques semaines à quelques mois selon unités cohérentes: tu convertis soigneusement grammes et jours. La valeur exacte de ton film: à confirmer sur fiche fournisseur ou essai. Règlement (CE) 1935/2004 (expert) pose le principe général des matériaux au contact; détail dans la leçon dédiée. Stockage Baobest cité: ordre sous 25 °C et humidité relative modérée. Cahier des charges emballage artisanal: (1) aptitude au contact alimentaire documentée; (2) soudabilité; (3) barrière vapeur dans ton atelier; (4) surface imprimable ou étiquetable; (5) coût et disponibilité locale. Mesure simple comparative: remplir deux sachets de 50 g, les peser, les laisser 72 h dans la cuisine, reperer la prise de masse. Exemple (nombres inventés): sachet A +0,2 g; sachet B +1,1 g. Sans appareil de perméabilité, ce test relatif guide. Normes et règlements de contact se détaillent aux leçons suivantes. Pour fruits séchés futurs, la sensibilité à l’oxygène et à la lumière peut monter: l’opaque devient plus intéressant. L’emballage protège contre l’humidité, l’oxygène, la lumière et les chocs, et porte l’information loyale. Exemple (nombres inventés pour l’exercice): tu compares un sachet bien soudé et un sachet mal fermé après sept jours en pièce humide, puis tu notes texture et odeur.","quiz":[{"q":"Quel rôle vient en premier pour une poudre à Ouagadougou ?","choices":["Protéger surtout de l’humidité","Remplacer le lot écrit","Seulement décorer"],"correct":0,"why_ok":"L’air humide attaque la poudre sèche.","why_ko":"Décor et omission du lot ne protègent pas."},{"q":"Que porte aussi l’emballage ?","choices":["Des infos utiles : nom, poids, lot","Rien d’écrit","Uniquement une blague"],"correct":0,"why_ok":"C’est la carte d’identité du produit.","why_ko":"Sans info claire, la cliente et toi perdez le fil."},{"q":"Pourquoi regarder d’autres sachets du marché ?","choices":["Pour copier une marque concurrente sur ton étiquette","Pour éviter de peser","Pour observer fermetures et opacité"],"correct":2,"why_ok":"Tu formes ton œil technique.","why_ko":"Observer n’autorise pas à copier une marque, ni à sauter la pesée."},{"q":"Emballe encore chaud :","choices":["Efface les microbes par magie","Favorise la condensation","Améliore toujours le goût"],"correct":1,"why_ok":"La vapeur se condense dans le sachet.","why_ko":"Ni goût magique ni stérilisation garantie."}],"activity":{"type":"tf","prompt":"Rôles de l’emballage","statements":[{"t":"L’emballage sert seulement à faire joli.","truth":false,"why":"Il protège et informe aussi."},{"t":"Une poudre sèche peut reprendre l’humidité de l’air.","truth":true,"why":"C’est pour cela qu’on cherche une barrière."},{"t":"Le lot peut être porté par l’emballage.","truth":true,"why":"Traçabilité visible pour toi et la cliente."}]},"exercise":{"prompt":"Observe trois emballages alimentaires chez toi ou au marché et note pour chacun : opaque ou non, type de fermeture, impression de solidité.","hint1":"Pas besoin d’acheter.","hint2":"Une ligne par emballage.","solution":"Exemple modèle : lait en poudre : opaque, soudure, semble épais ; épices : transparent, zip ; farine : papier, pli."}},{"title":"Films et barrières","body":["Un film d’emballage peut freiner plus ou moins la vapeur d’eau, l’oxygène et la lumière. Pour ta poudre Baobab Bliss, freiner la vapeur d’eau et la lumière est souvent prioritaire. Un film trop « ouvert » laisse la poudre coller en saison des pluies.","On parle de structures simples (un seul matériau) ou de structures multicouches (plusieurs couches collées). Les multicouches cherchent un compromis: soudable à l’intérieur, barrière au milieu, résistance à l’extérieur. Tu demandes au vendeur ce que le film est censé faire, en langage clair.","La valeur chiffrée de barrière se lit sur une fiche technique quand elle existe. Si tu n’en as pas, tu fais un essai simple: sachets remplis, pesés, stockés au même endroit, repesés après quelques jours. Celui qui grossit le plus a repris plus d’eau.","Pour les futurs mangues séchées, la barrière compte aussi, parfois avec d’autres priorités (lumière, odeurs). Tu garderas la même méthode d’essai. Ne te fie pas seulement à l’épaisseur au toucher: un film épais mal conçu peut moins protéger qu’un film plus fin bien choisi. Garde un échantillon de chaque film testé avec la date et le résultat de prise de masse. Ta mémoire seule ne suffit pas après la saison des pluies."],"prof":"Quand un vendeur te dit « c’est du bon plastique », demande à quoi il résiste: l’eau, l’air, le soleil. S’il ne sait pas, tu notes « à tester ». Ton essai de reprise de poids vaut mieux qu’un slogan. On verra ensuite le contact alimentaire: barrière et conformité vont ensemble. Demande au vendeur de film ce qu’il sait de la barrière à l’humidité. S’il ne sait rien, tu notes « inconnu » et tu compares avec un autre fournisseur avant d’engager toute la production.","tip":"Si tu as deux films, lance un mini essai de reprise de poids sur trois jours.","simple":"Comme choisir un manteau pour la saison des pluies: épais ne suffit pas, il faut qu’il rebute vraiment l’eau. Ton film est le manteau de la poudre. Comme choisir une bâche pour couvrir le mil: trop fine la pluie passe, trop lourde tu peines à la manier; tu cherches l’équilibre.","plus":"Grandeurs utiles: WVTR (vapeur d’eau), OTR (oxygène), transmission lumière. Conditions de test (température, humidité relative) doivent être lues avec le chiffre, sinon la comparaison ment. Structures courantes pour poudres: combinaisons type polyester, aluminium, polyéthylène (noms techniques en pli expert). L’aluminium apporte souvent une barrière très forte à la vapeur et à la lumière. Le polyéthylène aide à souder. Chez toi, l’essai gravimétrique artisanal (prise de masse) est un premier filtre avant un achat de volume. Les films monocouche et multicouches combinent des propriétés. Une face intérieure soudable, une couche barrière, parfois une couche opaque. La perméabilité à la vapeur d’eau se mesure en laboratoire; toi, tu compares par des essais de prise de masse. La lumière accélère certaines dégradations: un film opaque ou une étiquette large aide. Le choix dépend du climat de Ouagadougou et de la durée avant vente. Les conditions d’essai doivent être répétables: même local, même durée, même masse. Sinon tu compares des choses différentes. Note HR approximative si tu as un hygromètre bon marché.","expert":"WVTR typique de structures PET/Al/PE: ordre souvent très bas (≤ 0,1 à environ 1 g/(m², 24 h) selon structure et conditions) — TDS industrielles; à confirmer pour ton film. Formule simplifiée déjà vue: t_s ≈ m_s (X_c − X_0) / (A , WVTR , ΔHR/100). Exemple (nombres inventés): compare film A WVTR=0,5 et film B WVTR=5 dans les mêmes conditions: le temps jusqu’à X_c est environ dix fois plus long pour A. Essai atelier: sachets de surface comparable, même masse de poudre, même local; Δm / (A , Δt) approxime un flux. Normes d’essai industrielles (ASTM E96 ou équivalents) encadrent les mesures labo; tu n’es pas un labo, mais tu peux classer deux films. OTR importe surtout si oxydation (lipides); pour pulpe baobab acide et pauvre en lipides, H₂O et lumière dominent souvent. Opaque blanc ou métallisé: réduit photo-oxydation et perte de couleur. Grandeur usuelle: taux de transmission de vapeur d’eau, exprimé en masse par surface et par temps sous conditions fixées. Plus la valeur est basse, plus le film freine l’humidité. Sans fiche technique, tu refuses de croire un vendeur sur parole et tu testes. Structures courantes: polyoléfines soudables; couches barrière plus techniques selon budget. Pour Baobab Bliss, priorité: soudure fiable + frein humidité + coût compatible avec ton sachet 300 g. Exemple d’essai: 5 sachets par type de film, même masse, même local, 5 jours, classement par prise de masse moyenne. Documente. Le film « le plus cher » n’est pas automatiquement le bon. WVTR et OTR décrivent les barrières vapeur d’eau et oxygène; un film brillant n’est pas forcément barrière. Exemple (nombres inventés pour l’exercice): tu choisis un film selon la durée de vie visée et l’humidité de la pièce, puis tu valides par un essai de reprise d’humidité sur lot réel.","quiz":[{"q":"Pour la poudre baobab, quelle barrière est souvent prioritaire ?","choices":["Seulement le bruit","La couleur du logo seule","Vapeur d’eau et lumière"],"correct":2,"why_ok":"Humidité et lumière dégradent la poudre.","why_ko":"Bruit et logo ne définissent pas la barrière utile."},{"q":"Comment comparer deux films sans fiche ?","choices":["Mini essai de reprise de poids","Choisir le plus brillant seulement","Demander au hasard"],"correct":0,"why_ok":"La prise de masse parle de l’humidité reprise.","why_ko":"Brillance et hasard ne mesurent pas la barrière."},{"q":"Pourquoi lire les conditions d’un chiffre de barrière ?","choices":["Parce que c’est joli","Pour éviter de souder","Parce que le chiffre dépend de température et humidité de test"],"correct":2,"why_ok":"Sans conditions, la comparaison est trompeuse.","why_ko":"Cela n’a rien à voir avec la beauté ni l’interdiction de souder."},{"q":"Un film plus épais au toucher :","choices":["N’est pas forcément plus barrière","Est toujours parfait","Remplace l’étiquette"],"correct":0,"why_ok":"La structure compte plus que l’épaisseur seule.","why_ko":"Épaisseur ≠ garantie, et n’imprime pas l’étiquette."}],"activity":{"type":"match","prompt":"Relie besoin et idée de barrière","left":["Freiner l’humidité","Cacher la lumière","Pouvoir souder"],"right":["Film peu ouvert à la vapeur","Film opaque ou métallisé","Face intérieure soudable"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche le besoin technique.","hint2":"Élimine les associations absurdes.","solution":"Chaque besoin a une réponse film."},"exercise":{"prompt":"Si tu as deux sachets différents, remplis-les d’un même poids de poudre, pèse, stocke ensemble, repèse après trois jours, note le gagnant.","hint1":"Même local.","hint2":"Note la date.","solution":"Exemple modèle : sachet A +0,2 g ; sachet B +1,1 g donc A reprend moins d’eau dans cet essai."}},{"title":"Matériaux au contact des aliments","body":["Tout ce qui touche ta poudre doit être pensé pour le contact alimentaire: film intérieur, cuillères, bols de dosage. Un sac poubelle ordinaire ou un seau de lessive ne sont pas faits pour cela, même s’ils semblent « propres ».","Tu demandes au fournisseur une preuve simple que le matériau est destiné aux aliments. En Europe, on parle de déclaration de conformité pour certains plastiques; chez toi, tu commences par refuser le douteux et par garder les factures et noms de matériaux.","Les mauvaises migrations peuvent donner un goût de plastique ou un doute sur la sécurité du produit. Même sans labo, tu peux sentir et goûter un essai à blanc (sachet vide chaud, puis poudre témoin) et écarter ce qui sent mauvais.","Pour Baobab Bliss, écris une courte liste « autorisé au contact »: sachet choisi, bol inox ou plastique alimentaire, cuillère dédiée. Tout le reste reste hors de la zone poudre. Classe les films en trois boîtes: documenté, en attente d’info, refusé. Rien de la boîte refusée ne touche la poudre Baobab Bliss. Si un vendeur promet « alimentaire » sans papier, demande un écrit avec le type d’aliment et la température d’usage. Sans écrit, tu reportes l’achat."],"prof":"Le contact alimentaire, c’est du sérieux calme. Tu n’as pas besoin de réciter des numéros de textes sur ton étiquette. Tu as besoin de gestes: bon matériau, preuve fournisseur si possible, test d’odeur, zone dédiée. Si un vendeur refuse toute information, tu cherches ailleurs. Ta poudre 100 pour cent pulpe mérite un écrin digne. Un film sans aucune information de contact alimentaire, tu le traites comme un inconnu: tu ne remplis pas toute ta production dessus. Cherche une alternative ou une déclaration du fournisseur.","tip":"Colle sur le mur de l’atelier la liste « autorisé au contact » en trois lignes.","simple":"Tu ne sers pas le tô dans le seau du savon, même rincé à la hâte. Même idée: la poudre a ses propres outils et ses propres sachets. Comme refuser de stocker de l’eau potable dans un bidon qui a contenu de l’huile moteur: le contenant compte autant que le contenu.","plus":"Principes: inertie suffisante, pas de transfert qui rend l’aliment dangereux, qui change inacceptablement sa composition ou ses qualités sensorielles. Bonnes pratiques de fabrication des matériaux. Traçabilité du lot de film. En formation ingénieur, on relie ces principes au règlement cadre européen sur les matériaux au contact et aux mesures spécifiques plastiques (détail expert). Au Burkina, tu t’alignes d’abord sur les exigences de ton canal et sur le bon sens hygiénique, tout en préparant un dossier fournisseur propre si tu exportes un jour. Les matériaux au contact des aliments ne doivent pas céder aux denrées des constituants en quantité susceptible de nuire à la santé ou d’accepter le produit, dans le cadre des règles applicables. En pratique artisanale: exiger une déclaration d’aptitude, garder la référence du film, éviter les sacs poubelle et les films d’usage inconnu. Les plastiques ont des règles spécifiques dans l’Union européenne; même pour Ouaga, l’esprit de précaution documentée te protège.","expert":"Règlement (CE) n° 1935/2004, article 3: les matériaux et objets sont fabriqués conformément aux bonnes pratiques de fabrication de sorte que, dans les conditions normales ou prévisibles d’emploi, ils ne cèdent pas leurs constituants aux aliments en une quantité susceptible de présenter un point à surveiller pour la santé humaine, d’entraîner une modification inacceptable de la composition des aliments, ou une altération de leurs caractères organoleptiques. Article 16: déclaration écrite de conformité lorsque des mesures spécifiques l’exigent; documentation à disposition des autorités. Pour les plastiques, règlement (UE) n° 10/2011: déclaration de conformité aux stades autres que la vente au détail, contenu de l’annexe IV, limites de migration globale et spécifique, renouvellement si changement substantiel. Règlement (CE) n° 2023/2006: bonnes pratiques de fabrication des matériaux. Pour Olga: exiger du fournisseur, quand c’est possible, une attestation « contact alimentaire » et conserver le lot de film; faire un test sensoriel d’emballage; ne jamais réutiliser des contenants chimiques. Cadre européen de référence (utile si export): règlement 1935/2004 (exigences générales, traçabilité des matériaux, déclaration); règlement 10/2011 pour les plastiques (listes de monomères et additifs, essais de migration globale et spécifique). La déclaration de conformité du fournisseur n’est pas un badge décoratif: elle doit couvrir l’usage (type d’aliment, température, durée). Pour une poudre sèche à température ambiante, précise cet usage. Au Burkina, appuie-toi sur les exigences locales et sur des fournisseurs capables de documenter. Protocole interne: pas de nouveau film en production sans fiche + essai soudure + essai prise d’humidité. Les matériaux au contact suivent le règlement (CE) 1935/2004 et, pour plastiques, le (UE) 10/2011: inertie, migration globale et migrations spécifiques. Exemple (nombres inventés pour l’exercice): tu demandes une déclaration de conformité au fournisseur de film avant le premier tirage commercial.","quiz":[{"q":"Que faire d’un seau de lessive pour la poudre ?","choices":["S’en servir après un rinçage rapide","Ne pas l’utiliser au contact","Mélanger lessive et poudre"],"correct":1,"why_ok":"Ce n’est pas un contenant alimentaire.","why_ko":"Un rinçage hâtif ne transforme pas un seau chimique en outil alimentaire."},{"q":"Que demandes-tu au fournisseur de film ?","choices":["Seulement le prix le plus bas sans question","Un logo copié d’une autre marque","Une preuve qu’il est destiné aux aliments"],"correct":2,"why_ok":"Tu documentes le contact alimentaire.","why_ko":"Le prix seul ou la copie ne valident pas le contact."},{"q":"Un goût de plastique sur un essai :","choices":["Prouve que c’est meilleur","Remplace le lot","Fait écarter ce film"],"correct":2,"why_ok":"Altération sensorielle : tu refuses.","why_ko":"Ce n’est ni un atout ni un substitut de lot."},{"q":"La liste « autorisé au contact » sert à :","choices":["Décorer le mur seulement","Séparer clairement outils et sachets alimentaires","Remplacer le lavage des mains"],"correct":1,"why_ok":"Elle guide les gestes quotidiens.","why_ko":"Elle ne remplace ni hygiène des mains ni sérieux."}],"activity":{"type":"case","prompt":"Cas contact","story":"On te propose un film très bas prix sans aucune info sur le contact alimentaire.","q":"Que fais-tu ?","choices":["Remplir toute la production tout de suite","Chercher une alternative documentée ou tester et documenter avant usage poudre","Utiliser des sacs poubelle"],"correct":1,"why_ok":"Tu protèges le produit et ta marque.","why_ko":"Produire en aveugle ou avec sacs poubelle n’est pas une option sérieuse."},"exercise":{"prompt":"Rédige ta liste « autorisé au contact » (3 à 6 lignes) et colle-la dans l’atelier.","hint1":"Inclue sachet, bol, cuillère.","hint2":"Date la feuille.","solution":"Exemple modèle : sachet structure choisie lot F… ; bol inox ; cuillère plastique alimentaire bleue ; pas d’autres contenants dans la zone poudre."}},{"title":"Choisir et souder le sachet Baobab Bliss","body":["Tu choisis un format dans ton atelier, format familial ensuite. Le film doit être soudable sur ta pince ou ta machine. Tu testes sur des sachets vides avant de remplir la poudre précieuse.","La soudure doit être continue, sans canal. Tu tires doucement sur les bords: une bonne soudure résiste; une mauvaise s’ouvre en laissant un chemin d’air. Note température approximative, temps et pression de ta pince quand tu trouves un réglage qui marche.","Remplis en zone aussi sèche que possible, sans souffler avec la bouche dans le sachet. Essuie les zones de soudure si de la poudre empêche la fermeture. Une soudure « farinée » est une fuite annoncée.","Après soudure, contrôle visuel de chaque sachet sur un petit lot. Plus tard, tu pourras échantillonner. Étiquette ensuite: nom, poids, lot, dates selon ton canal. Le dessin choisi (A, B ou C) vient après la technique solide. Forme toute personne qui soude: les mêmes gestes, le même test de traction. Un geste différent chaque jour crée des fuites invisibles. Compte les sachets écartés à chaque fin de série et écris le motif: poudre dans le joint, pli, brûlure. Les motifs guident la formation."],"prof":"Beaucoup de défauts clients viennent d’une soudure faible, pas du baobab lui-même. Prends dix minutes pour régler la pince sur du vide, puis seulement tu doses. Si la poudre colle sur la zone de soudure, tu as un geste à corriger, pas « juste un mauvais film ». Je préfère dix sachets parfaits à trente sachets qui sifflent d’air. Fais dix soudures d’essai avant un lot client. Tire sur les bords. Si ça s’ouvre trop facilement ou si la poudre est prise dans le joint, tu règles le geste ou l’outil avant de continuer.","tip":"Fais cinq sachets vides d’essai et tire dessus avant le premier lot du jour.","simple":"Comme fermer hermétiquement une bassine de sauce arachide pour le lendemain: si le couvercle laisse un jour, l’odeur et l’air passent. La soudure est ton couvercle. Comme fermer hermétiquement un sachet d’épices pour le voyage: tu écoutes le pli, tu regardes la ligne de soudure, tu retestes si tu doutes.","plus":"Paramètres de soudure typiques de départ pour certaines structures polyester et polyéthylène: ordres de grandeur autour de 145 °C pendant 1,5 à 2,5 s (fiche Sparal) ou autour de 160 °C pendant environ 3 s (autre fiche) — toujours à valider sur ton film. Tu montes par petits pas. Contrôles: pelage, immersion douce, compression. Format: 50 à 80 g pour l’essai, 300 g pour le familial, sticks plus tard — selon ton plan Emballage. L’étiquette suit les exigences locales (nom, quantité, lot, fabricant, conservation). Le sachet Baobab Bliss doit se fermer de façon répétable. Paramètres artisanaux: température de la pince ou du fer, temps de contact, pression, propreté de la zone à souder. La poudre dans le joint est une cause classique de fuite. Dimensionnement: assez de matière pour 300 g sans trop d’air libre, mais pas un ballon. L’étiquette ne doit pas gêner la soudure. La soudure se juge à l’étanchéité et à la régularité du cordon, pas seulement à la vitesse. Paramètres: température, temps, pression. Un test de pression douce ou d’immersion sur échantillon révèle les fuites. Tu formes chaque aide à écarter un sachet douteux plutôt qu’à rattraper à la main.","expert":"Intégrité d’emballage comme maîtrise: souvent point critique ou point opératoire selon ton analyse des points à surveiller (reprise H₂O). Surveillance: 100 pour cent visuel sur petit volume; tests de traction manuelle par échantillon. Correction: ressouder si possible, sinon isoler le sachet. Enregistrement: réglages pince et défauts du jour. Exemple (nombres inventés): 120 sachets, 4 ressoudés, 1 écarté (canal ouvert) → taux de défaut 4,2 pour cent avant amélioration du dépoussiérage de la zone de soudure. Structure: face intérieure PE pour thermosoudure; barrière au milieu; face externe imprimable. Ne pas confondre force de soudure et barrière du film: une soudure excellente sur un film trop perméable laisse quand même entrer l’humidité à travers la paroi. Contrôle de soudure: test de traction manuel normalisé dans ton atelier (tirer avec la même force ressentie), Bain éventuel pour fuites si tu as l’équipement, inspection visuelle continue. Exemple (nombres inventés): sur 50 sachets, 3 joints douteux; taux 6 pour cent; action: nettoyer la zone, former à nouveau l’aide. Capabilité: viser un taux de défauts décroissant mois après mois. Spécification interne: « soudure continue, pas de plis ouverts, pas de poudre dans le joint ». Lien traçabilité: code lot lisible après soudure. Lien coût: chaque sachet écarté coûte film + poudre + temps. Capabilité longue: suis le taux de défauts sur douze mois. Une carte de contrôle artisanale (points sur un graphique mensuel) montre les dérives. Formation annuelle courte de l’équipe soudure. Pièces de rechange de la pince si outil électrique. Standard de travail photographié (photo d’une bonne soudure vs mauvaise, sans jargon) affiché au poste.","quiz":[{"q":"Avant de remplir la poudre, tu :","choices":["Oublies la pince","Règles la soudure sur des sachets vides","Soudes au hasard"],"correct":1,"why_ok":"Tu valides le réglage sans gaspiller le produit.","why_ko":"Hasard et oubli créent des fuites."},{"q":"Une soudure farinée de poudre :","choices":["Est toujours la meilleure","Peut laisser un canal d’air","Remplace l’étiquette"],"correct":1,"why_ok":"La poudre empêche la fusion propre.","why_ko":"Ce n’est ni un idéal ni un substitut d’étiquette."},{"q":"Que notes-tu sur la pince ?","choices":["Seulement la couleur du fil","Température approximative, temps, pression","Rien"],"correct":1,"why_ok":"Pour reproduire le bon réglage.","why_ko":"Sans note, chaque jour recommence à zéro."},{"q":"Le dessin de face avant :","choices":["Remplace la soudure","Vient après une technique de sachet solide","Efface le besoin de lot"],"correct":1,"why_ok":"D’abord protéger, ensuite habiller.","why_ko":"Le dessin ne soude pas et n’efface pas le lot."}],"activity":{"type":"label","prompt":"Repère les zones du sachet","labels":["A","B","C"],"correct":{"0":"soudure","1":"étiquette","2":"fond du sachet"},"hint1":"Du haut vers le bas.","hint2":"La soudure est souvent en haut.","solution":"A soudure, B étiquette, C fond.","svg":"<svg viewBox=\"0 0 200 160\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<rect x=\"50\" y=\"20\" width=\"100\" height=\"120\" rx=\"8\" fill=\"#fff\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"150\" y2=\"40\" stroke=\"#0071e3\" stroke-width=\"4\"/>\n<rect x=\"65\" y=\"55\" width=\"70\" height=\"40\" rx=\"4\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"100\" y=\"80\" text-anchor=\"middle\" font-size=\"11\">étiquette</text>\n<text x=\"100\" y=\"130\" text-anchor=\"middle\" font-size=\"10\">fond</text>\n</svg>"},"exercise":{"prompt":"Règle ta pince sur cinq vides, puis produis dix sachets poudre et note le nombre de défauts de soudure.","hint1":"Tire doucement sur chaque soudure.","hint2":"Note le réglage.","solution":"Exemple modèle : réglage X ; 10 sachets ; 1 ressoudé ; 0 écarté."}},{"title":"Reprise d’humidité et stock","body":["Après emballage, le travail continue: le stock peut sauver ou gâcher le lot. Choisis un endroit sec, propre, à l’abri du soleil direct et des animaux. Surélève les cartons du sol.","La poudre reprend l’humidité si le sachet est faible ou si l’air est très humide et le film limite. Surveille l’aspect: grumeaux, collage, odeur. Un sachet témoin du lot, ouvert seulement pour contrôle, t’aide à voir le vieillissement.","Organise le stock en « premier entré, premier sorti ». Les lots anciens partent avant les nouveaux. Écris la date sur le carton. Mélanger les dates, c’est perdre la traçabilité.","Pour les futurs fruits séchés, la même discipline tient, parfois avec des cibles d’humidité différentes. Le carnet de stock (entrée, sortie, reste) évite les surprises quand une cliente commande. Ouvre le moins possible les cartons entamés. Chaque ouverture expose les sachets à l’air humide de la pièce. Place un sachet témoin daté au milieu du stock et pèse-le chaque semaine. La courbe te parle plus qu’une impression. Écarte tout carton mouillé immédiatement et vérifie les sachets voisins. Un carton humide est un signal, pas une décoration."],"prof":"Le stock n’est pas un coin oublié. C’est la dernière machine de ton procédé: l’air et le temps. Si tu ne peux mesurer l’humidité relative, tu peux au moins éviter les murs qui suintent et le soleil sur les sachets. Ouvre un sachet témoin une fois par mois et note ce que tu vois. Ton futur toi te remerciera. Le stock est un poste de maîtrise: surélevé, sec, loin des murs humides, ancien devant. Une belle production mal stockée se dégrade sans bruit.","tip":"Place un carton témoin à hauteur d’yeux avec la date du lot le plus ancien devant.","simple":"Comme le sac de mil: tu ne le poses pas directement sur le sol humide de la saison des pluies, tu le mets sur une palette ou des briques. Même réflexe pour tes cartons de sachets. Comme ranger le mil dans des bidons surélevés plutôt qu’à même le sol pendant la saison des pluies: l’endroit change la durée de vie.","plus":"La durée de vie dépend de l’aw initiale, de la barrière, de la température et de l’humidité relative du local (cartes de stabilité type Labuza). Sans essai, tu n’inventes pas une date longue. Tu peux viser une période courte au début et l’allonger après observations. Rotation FIFO. Séparation des produits odorants (savon, pétrole) loin de la poudre. Inventaire hebdomadaire au démarrage. La reprise d’humidité dépend de l’air ambiant, de la qualité de soudure et du film. Un local humide accélère les échanges même à travers un film moyen. La rotation (premier entré, premier sorti) évite les sachets oubliés. Les cartons au sol et les murs froids créent de la condensation. Contrôle: toucher d’un sachet témoin chaque semaine. Cartographie du local: zones plus sèches, zones près des murs extérieurs, zones de passage. Place les lots longs dans la zone la plus stable. Documente un schéma simple au mur. Un thermomètre et un hygromètre bon marché, même imparfaits, donnent une tendance. Note les valeurs le lundi. Corréle avec le sachet témoin. Forme l’aide au rangement: hauteur minimale, distance aux murs, sens de rotation. Un affichage photo aide plus qu’un long texte.","expert":"Lien isotherme de sorption: à une humidité relative donnée, la poudre équilibre à une humidité X et une aw. Si le film laisse diffuser, X monte vers l’équilibre extérieur. Temps caractéristique lié à WVTR (leçon barrières). Exemple (nombres inventés): lot emballé à aw 0,45; local souvent autour de 70 pour cent HR; film moyen → grumeaux observés à 6 semaines; film plus barrière → 4 mois sans grumeaux visibles (à confirmer chez toi). ASLT (tests accélérés): Q10 et Arrhenius pour estimer une durée, toujours validés à température réelle. Stockage Baobest: ordre sous 25 °C et HR modérée. Ne pas inventer une DLC ou DDM: la date « à consommer de préférence avant » se base sur ton essai et ton canal. Humidité relative et température pilotent l’équilibre hygroscopique des poudres. Sans enregistreur, tu observes: sensation de local, présence de moisissures sur murs, sachets mous. Actions: étagères, distance au sol, aération contrôlée, éviter les ouvertures fréquentes des cartons. Exemple (nombres inventés): sachet témoin +0,8 g en 14 jours dans un coin humide contre +0,1 g sur étagère centrale. Conclusion opérationnelle: déplacer le stock. Enregistrement: date entrée, position, date sortie. Pour mangues séchées futures, la sensibilité peut être plus forte: zones dédiées. Corrélation qualitative: jours de pluie intense et plaintes « sachet mou ». Tiens un mini journal météo local lié aux observations stock. Actions préventives avant la saison des pluies: audit joints, renouvellement films douteux, surélévation renforcée. Objectif: zéro lot dégradé pour humidité de stockage sur l’année. La reprise d’humidité suit le gradient d’activité de l’eau entre poudre et ambiance, freiné par le film et la soudure. Exemple (nombres inventés pour l’exercice): masse d’un sachet suivie chaque semaine; une hausse nette avec texture collante déclenche enquête soudure et stockage.","quiz":[{"q":"Où stocker les cartons ?","choices":["Au sec, surélevés, hors soleil direct","Contre un mur qui suinte","À même le sol humide"],"correct":0,"why_ok":"Tu limites reprise d’eau et chaleur.","why_ko":"Sol humide et mur humide attaquent le lot."},{"q":"Que signifie premier entré, premier sorti ?","choices":["On mélange toutes les dates","Les lots anciens partent avant les nouveaux","On vend d’abord le plus joli logo"],"correct":1,"why_ok":"Rotation claire.","why_ko":"Logo et mélange détruisent la discipline."},{"q":"Un sachet témoin sert à :","choices":["Observer le vieillissement du lot","Remplacer tous les contrôles","Boire la poudre entière"],"correct":0,"why_ok":"Tu suis l’évolution sans ouvrir toute la production.","why_ko":"Il ne remplace pas tout et n’est pas une collation obligatoire."},{"q":"Une date longue sur l’étiquette :","choices":["Est inutile si tu as un logo","S’invente pour faire moderne","Se base sur des observations, pas sur une invention"],"correct":2,"why_ok":"Tu restes honnête.","why_ko":"Inventer ou se cacher derrière un logo n’est pas du pilotage."}],"activity":{"type":"order","prompt":"Ordre d’une bonne mise en stock","steps":["Contrôler les sachets","Ranger surélevé au sec","Mettre le plus ancien devant","Noter entrée sur le carnet"],"correct":[0,1,2,3],"hint1":"D’abord la qualité du sachet.","hint2":"L’écrit clôture le geste.","solution":"Contrôle, rangement sec, rotation, carnet."},"exercise":{"prompt":"Dessine ton coin stock idéal (même petit) et liste trois améliorations possibles cette semaine.","hint1":"Sol, soleil, odeurs.","hint2":"Une amélioration gratuite d’abord.","solution":"Exemple modèle : briques sous cartons ; éloigner le savon ; étiqueter le carton le plus ancien."}},{"title":"Éco-conception légère","body":["Éco-conception, ici, veut dire: protéger assez avec le moins de gaspillage possible. Pas de film inutilement énorme, pas de double emballage sans raison, pas de sachets ratés jetés par dizaines faute de réglage.","Tu réduis les déchets à la source: mieux souder, mieux doser, mieux stocker. Un sachet qui se conserve correctement évite de jeter de la poudre. C’est déjà de l’écologie concrète à Ouagadougou.","Demain, tu pourras regarder des films plus simples à collecter ou des formats qui limitent le vide. Aujourd’hui, tu mesures déjà: nombre de sachets écartés par lot, grammes de poudre perdus au sol, cartons réutilisés.","Pour les futurs séchages, l’énergie du séchoir sera un gros poste. Le noter t’aidera à choisir des épaisseurs et des charges raisonnables. L’éco-conception relie emballage, procédé et pertes. Mesure une fois par mois les grammes de film par kilogramme de poudre vendable. Si le chiffre monte sans raison, cherche le gaspillage. Avant d’imprimer une phrase verte sur l’étiquette, demande-toi quelle preuve tu montrerais à une cliente curieuse. Pas de preuve, pas de phrase. Compare deux mois de rebuts avant et après une formation soudure. Si le taux ne baisse pas, change la méthode, pas seulement le discours."],"prof":"On ne te demande pas une analyse de cycle de vie complète. On te demande trois chiffres simples par semaine: sachets écartés, poudre balayée perdue, cartons réemployés. Avec ça, tu vois si tu progresses. L’écologie commence par ne pas gâcher ce que tu as déjà bien fait. L’éco-conception commence par « moins de défauts » et « juste assez de film ». Gaspiller moins de sachets est déjà un geste propre et économique.","tip":"Ajoute sur la fiche lot une case « sachets écartés » et « poudre perdue estimée ».","simple":"Comme cuisiner juste assez de tô pour le repas: trop de restes froids jetés, c’est de l’énergie et de la farine perdues. Ici tu cuisines le juste emballage et le juste remplissage. Comme couper le tissu juste à la mesure pour un pagne: trop large tu gaspillent, trop juste tu rates la couture; tu apprends la juste mesure.","plus":"Hiérarchie classique: réduire, réutiliser, recycler quand la filière existe. Pour un micro-atelier, réduire les non-conformités d’emballage a souvent plus d’impact immédiat que changer de matériau sans preuve. Le suremballage (sachet plus étui plus film décoratif) coûte et pollue si le canal ne l’exige pas. Tu peux aussi optimiser la taille: un format qui se vide complètement limite le produit collé aux parois. Lien avec ton budget marketing: moins de pertes, plus de marge pour les dégustations utiles. L’éco-conception légère pour une micro-entreprise: réduire les rebuts, éviter le suremballage, choisir des formats disponibles localement, garder la protection nécessaire. Un film trop faible qui fait jeter des lots n’est pas écologique. Mesure: taux de défauts emballage, grammes de film par sachet utile. Amélioration continue plutôt que slogan. Communication responsable: pas de promesse écologique non prouvée sur l’étiquette. Tu peux dire « nous réduisons les sachets écartés » si tu le mesures. La preuve bat le slogan.","expert":"Indicateurs: taux de défaut emballage = sachets écartés / sachets produits; perte poudre = masse balayée ou restée hors sachet / masse destinée. Exemple (nombres inventés): 200 sachets, 12 écartés → 6 pour cent; cible interne 3 pour cent après réglage pince. Masse perdue 0,4 kg sur 10 kg → 4 pour cent. ACV simplifiée (idée): inventaire sommaire (film g/sachet, carton, énergie soudure) sans prétendre à une norme ISO ACV complète. Pour séchage futur, énergie spécifique kWh par kg d’eau évaporée ou par kg de produit fini: à mesurer quand tu auras un compteur. Éco-conception emballage alimentaire doit rester compatible avec la sécurité (barrière suffisante): alléger un film jusqu’à perdre la barrière est un faux gain si tu jettes le produit ensuite. Indicateurs: pour cent sachets écartés; masse de film par kg de poudre vendable; reprise d’humidité moyenne des témoins. Exemple (nombres inventés): 6 pour cent défauts soudure au mois 1; 2 pour cent au mois 3 après formation. Calcul: cent fois écartés divisé par produits. Plan d’action lié aux causes (poussière dans joint, pince trop chaude, film variable). Fin de vie: selon filières locales disponibles; ne pas inventer une recyclabilité non prouvée sur l’étiquette. Priorité Baobab Bliss: protéger 100 pour cent pulpe jusqu’à la cliente, avec le moins de pertes possible. Analyse de cycle de vie complète est hors portée artisanale; l’éco-conception légère reste pertinente. Évite le greenwashing. Si un fournisseur affirme « compostable », exige le référentiel et les conditions (souvent industrielles, pas le sol du jardin). Décision Baobab Bliss: protection d’abord, affirmations environnementales ensuite et prouvées.","quiz":[{"q":"Premier levier éco chez toi souvent :","choices":["Ignorer les écarts","Réduire sachets ratés et poudre perdue","Ajouter trois suremballages décoratifs"],"correct":1,"why_ok":"Moins de gaspillage, plus d’impact utile.","why_ko":"Suremballer ou ignorer n’écologise pas."},{"q":"Que note-t-on sur la fiche lot ?","choices":["Sachets écartés et pertes estimées","Seulement le prénom du voisin","Rien sur les déchets"],"correct":0,"why_ok":"Tu mesures pour progresser.","why_ko":"Sans mesure, pas de progrès visible."},{"q":"Alléger un film jusqu’à perdre la barrière :","choices":["Peut faire jeter plus de produit ensuite","Remplace les contrôles","Est toujours gagnant"],"correct":0,"why_ok":"Un faux gain si le produit se gâte.","why_ko":"Ce n’est ni toujours gagnant ni un substitut de contrôle."},{"q":"L’énergie du futur séchoir :","choices":["S’ignore totalement","Se remplace par un logo vert inventé","Se note pour choisir des pratiques raisonnables"],"correct":2,"why_ok":"Mesurer aide à décider.","why_ko":"Ignorer ou afficher un logo inventé n’aide pas."}],"activity":{"type":"calc","prompt":"Taux de défaut emballage (Exemple)","fields":[{"id":"produits","label":"Sachets produits"},{"id":"ecartes","label":"Sachets écartés"}],"note":"Pour cent défauts égale cent fois écartés divisé par produits.","tip":"Exemple d’exercice, tes chiffres ensuite."},"exercise":{"prompt":"Sur un lot, compte sachets produits et écartés, estime la poudre perdue au sol, écris un mini plan pour baisser les deux.","hint1":"Une action concrète.","hint2":"Une semaine de suivi.","solution":"Exemple modèle : 6 pour cent défauts donc nettoyer zone soudure ; perte 0,3 kg donc doseur plus stable."}}],"m6":[{"title":"Points sensibles : les voir pour les maîtriser","body":["Un point sensible, c’est un endroit du procédé où quelque chose de non désiré peut arriver à ta poudre: saleté, corps étrangers, reprise d’humidité, mauvaise soudure. Chez Baobab Bliss, tu apprends à les voir calmement pour mieux les maîtriser.","Parcours ta ligne réelle: réception des fruits, table de cassage, bols, tamis, zone de soudure, stock. À chaque étape, demande: « Qu’est-ce qui pourrait mal tourner ici pour ma cliente ? » Écris une courte liste, sans panique.","Tu distingues trois familles simples: ce qui se voit (cheveu, éclat de coque), ce qui se développe si c’est humide (moisissures), ce qui vient des produits chimiques ou odeurs (savon près du stock). Chaque famille a des gestes de maîtrise différents.","Cette leçon prépare les principes de maîtrise enseignés en école. Tu n’as pas encore besoin de grands tableaux. Tu as besoin d’yeux ouverts et d’un carnet. Demain, tu transformeras cette liste en plan simple. Revoyez la feuille des points sensibles après tout changement: nouveau film, nouvel aide, nouveau local. Un changement non relu crée des trous. Quand un incident arrive, ajoute une ligne datée sur la feuille des points sensibles. La feuille vivante bat le classeur oublié."],"prof":"Voir les points sensibles, ce n’est pas devenir anxieuse. C’est devenir lucide. Une feuille avec huit lignes franches vaut mieux qu’un classeur vide. Si tu bloques, commence par trois points seulement: réception, tamis, soudure. On enrichira ensuite. Commence par une feuille courte: réception, tamis, soudure, stock. Pour chaque case, une phrase sur ce qui peut mal tourner. Tu enrichiras ensuite.","tip":"Marche demain dans l’atelier avec une feuille et note huit points sensibles maximum.","simple":"Comme inspecter la cuisine avant d’inviter la famille: tu regardes où ça peut salir le repas, tu ranges, tu ne cries pas. Même calme pour ta ligne baobab. Comme repérer les marches cassées dans une cour avant d’y faire courir des enfants: tu listes les endroits sensibles avant d’écrire un règlement entier.","plus":"En hygiene des aliments, on parle de points à surveiller biologiques, chimiques et physiques. Sur un atelier familial de poudre sèche, les physiques (corps étrangers) et la maîtrise de l’humidité (qui conditionne le biologique) dominent souvent. Les chimiques surviennent via mauvais contenants ou contaminations croisées (détergents). Identifier sans hiérarchiser encore: la hiérarchie et les points critiques viennent aux leçons suivantes. Le diagramme de flux est l’outil central: sans flux réel, l’analyse invente. L’analyse des points sensibles précède le plan détaillé. On classe souvent ce qui peut nuire en biologiques, chimiques et physiques. En poudre sèche artisanale, les corps étrangers et l’humidité qui favorise les moisissures reviennent souvent. Le diagramme de flux réel de ton atelier est la base: inventer un flux d’usine ne t’aide pas. Priorise les points selon fréquence et gravité ressentie, même sans matrice formelle. Ce qui arrive souvent et abîme le produit passe en haut de liste. Revoyez après incidents.","expert":"Codex CXC 1-1969 (révision 2020/2022): le système HACCP repose sur l’analyse des points à surveiller et des mesures de maîtrise le long du flux, plutôt que sur les seuls tests produit fini. point à surveiller: agent biologique, chimique ou physique ayant le potentiel de causer un effet adverse sur la santé. Pour baobab artisanal, exemples: fragments de coque (physique); moisissures si reprise d’humidité (biologique); migration d’un mauvais plastique (chimique). Probabilité × sévérité guide la signification (approche qualitative au démarrage). Prérequis (PRP / bonnes pratiques d’hygiène): locaux, eau, personnel, nettoyage, lutte nuisibles, allergènes si pertinents — avant même de parler de CCP. Règlement (CE) 852/2004 art. 5 (si cadre européen) exige des procédures fondées sur les principes HACCP après production primaire, avec flexibilité selon nature et taille. Méthode: (1) dessiner le flux réel; (2) lister à chaque étape ce qui peut nuire; (3) noter les mesures déjà en place; (4) repérer les trous. Exemple Baobab Bliss: réception (fruits abîmés), cassage (éclats de coque), tamis (toile trouée), soudure (fuites), stock (humidité). Mesures: inspection, plateau blanc, test de traction, étagères. Codex et textes européens détaillent l’analyse formelle aux leçons suivantes. Ici: lucidité locale. Feuille vivante: revue tous les deux mois ou après un incident. Matrice simple fréquence × gravité sur une page. Cotation 1 à 3. Les scores élevés deviennent priorités d’action du trimestre. Conserve les versions datées. Lien avec le module points critiques: seuls certains points sensibles deviennent points critiques surveillés en continu. Un point sensible combine un points sensibles (bio, chimie, physique) et une étape où tu peux encore agir. Exemple (nombres inventés pour l’exercice): tu listes pour la pulpe: corps étrangers à la casse, humidité avant sachet, hygiène des mains au conditionnement — trois lignes avec surveillance écrite.","quiz":[{"q":"Un point sensible, c’est :","choices":["Un prix de vente","Un endroit où un problème peut arriver au produit","Une décoration du carnet"],"correct":1,"why_ok":"Tu repères pour maîtriser.","why_ko":"Ni décor ni prix."},{"q":"Par où commencer la liste ?","choices":["Par un règlement d’un autre continent recopié entier","Par le logo","Par le flux réel de ton atelier"],"correct":2,"why_ok":"Le flux vécu guide l’analyse.","why_ko":"Recopier hors sol ou décorer ne protège pas."},{"q":"Un éclat de coque est surtout :","choices":["Un problème physique","Un problème de prix","Un problème de couleur de logo"],"correct":0,"why_ok":"Corps étranger.","why_ko":"Pas un sujet de prix ou de logo."},{"q":"Pourquoi limiter la première liste ?","choices":["Pour éviter d’écrire","Pour tout oublier","Pour rester actionnable"],"correct":2,"why_ok":"Huit lignes franches battent cent lignes vaines.","why_ko":"Oublier ou ne pas écrire n’aide pas."}],"activity":{"type":"tf","prompt":"Points sensibles","statements":[{"t":"Le stock peut être un point sensible pour l’humidité.","truth":true,"why":"L’air et le film jouent là."},{"t":"Seuls les microbes comptent, jamais les corps étrangers.","truth":false,"why":"Les physiques comptent beaucoup en poudre."},{"t":"Une feuille courte peut suffire au début.","truth":true,"why":"Lucidité avant volume de papier."}]},"exercise":{"prompt":"Marche dans ton atelier et liste huit points sensibles avec un geste de maîtrise pour chacun.","hint1":"Une ligne : point plus geste.","hint2":"Reste concrète.","solution":"Exemple modèle : tamis : inspecter toile ; soudure : tirer sur les bords ; stock : surélever."}},{"title":"Les 7 principes en langage simple","body":["La méthode enseignée dans le monde entier pour organiser la maîtrise repose sur sept idées. En langage simple: repérer ce qui peut arriver, trouver où tu dois vraiment tenir bon, fixer une limite claire, surveiller, corriger, vérifier que ça marche, écrire ce que tu fais.","Tu n’as pas besoin d’un logiciel. Une feuille par principe suffit au début. Mieux vaut deux points bien surveillés que vingt cases vides. Exemple Baobab Bliss: corps étrangers après tamis; intégrité de soudure; stockage sec.","Une limite peut être un chiffre (activité de l’eau) ou une observation claire (soudure continue sans canal). Le critère utile est que toi et une aide compreniez la même chose. « À peu près bien » n’est pas une limite.","Les enregistrements sont légers mais réels: date, lot, contrôle, résultat, signature ou initiale. C’est ta mémoire d’atelier. Ils servent aussi si un acheteur demande comment tu travailles. Affiche les sept idées en mots simples près du poste de travail. Si une aide lit et comprend, tu as bien traduit. Entraîne-toi à expliquer une idée par soir pendant une semaine. Le huitième jour, tu les tiens vraiment."],"prof":"Les sept principes ne sont pas là pour t’impressionner. Ils sont là pour t’empêcher d’oublier une étape. Si tu retiens une phrase: « Je sais quoi surveiller, comment, et quoi faire si ça dérape. » On détaillera les douze étapes d’application juste après. Respire: c’est un guide, pas un examen. Les sept idées se retiennent comme une chanson courte: voir, tenir, limiter, surveiller, corriger, vérifier, écrire. Si une idée manque, le plan boite.","tip":"Choisis deux points à surveiller vraiment cette semaine et écris leur limite.","simple":"Les freins d’une moto: tu vérifies ce qui est critique pour la route, pas chaque décoration du rétroviseur. Même esprit: surveille ce qui protège vraiment la cliente. Comme surveiller une marmite: tu sais ce qui peut brûler, tu restes près du feu, tu as une limite de temps, tu baisses si ça attache, tu notes pour la prochaine fois.","plus":"Les sept principes Codex (formulation 2020): (1) analyser les points à surveiller et mesures de maîtrise; (2) déterminer les points critiques; (3) établir des limites critiques validées; (4) surveiller; (5) actions correctives; (6) valider le plan puis vérifier; (7) documenter. Le règlement européen d’hygiène reprend une logique proche pour les exploitants après la production primaire, avec souplesse pour les petites structures. À ton échelle, tu appliques l’esprit sans usine de papier. Ces idées structurantes viennent des principes reconnus internationalement pour la maîtrise sanitaire. Elles s’appliquent avec proportionnalité: une micro-entreprise écrit peu mais pour de vrai. Les points où tu tiens bon doivent être surveillables avec tes moyens. Une limite non mesurable n’est pas une limite opérationnelle. Enseigne les sept idées à une aide en quinze minutes avec un exemple baobab unique. Si elle peut les redire, la traduction est bonne. Sinon, simplifie encore les mots du mur. Les sept principes vont de l’analyse des points sensibles à la documentation: identifier, déterminer les points critiques, fixer les limites, surveiller, corriger, vérifier, enregistrer. En micro-atelier tu restes proportionnée: peu de lignes, vraiment tenues.","expert":"Libellés Codex CXC 1-1969 rév. 2020 — Principe 1: Conduct a hazard analysis and identify control measures. P2: Determine the CCPs. P3: Establish validated critical limits. P4: Establish a system to monitor control of CCPs. P5: Establish the corrective actions when monitoring indicates a deviation. P6: Validate the HACCP plan and then establish procedures for verification. P7: Establish documentation concerning all procedures and records. 5(2) liste a–g en miroir (identification point à surveiller, CCP, limites, surveillance, corrections, vérification, documents proportionnés). Flexibilité: récital 15 et communications Commission sur GHP/HACCP pour PME — les bonnes pratiques peuvent suffire si l’analyse ne trouve pas de CCP. Exemple atelier baobab (pédagogique): CCP candidat = intégrité emballage (limite: soudure continue); surveillance visuelle; correction: ressouder ou écarter; vérification: revue mensuelle des écarts. Les sept principes du Codex (CXC 1-1969, révision récente): analyse des points à surveiller; détermination des CCP; limites critiques; système de surveillance; actions correctives; procédures de vérification; documentation. En ISO 22000 on distingue aussi PRP, OPRP et CCP selon le niveau de maîtrise. Pour Olga: traduire sans sigles sur le terrain. Exemple: point à surveiller physique éclat de coque; maîtrise au tamis et inspection; limite « zéro éclat visible sur plateau »; surveillance chaque lot; correction: retrait plateau et nettoyer; vérification: revue mensuelle des fiches; document: fiche lot. Flexibilité 852/2004 pour petites structures: procédures proportionnées. Codex et paquet hygiène structurent l’approche des points critiques. Exemple (nombres inventés pour l’exercice): une limite d’humidité finale écrite avant la saison; si dépassée, re-séchage ou blocage documenté le jour même, pas report vague. Tu refuses une généralisation plus large que l’échantillon réellement vu, près de trousse de soins.","quiz":[{"q":"Combien de principes fondent la méthode ?","choices":["Deux seulement","Vingt-cinq","Sept"],"correct":2,"why_ok":"Sept idées enchaînées.","why_ko":"Ni deux ni vingt-cinq."},{"q":"Une bonne limite est :","choices":["Claire pour toi et pour une aide","Un secret jamais dit","Floue exprès"],"correct":0,"why_ok":"Partagée et compréhensible.","why_ko":"Flou et secret empêchent la surveillance."},{"q":"Mieux vaut :","choices":["Aucun écrit","Vingt cases jamais remplies","Deux points vraiment surveillés"],"correct":2,"why_ok":"La réalité bat le papier creux.","why_ko":"Cases vides ou absence d’écrit n’aident pas."},{"q":"Que contient un enregistrement minimal ?","choices":["Date, lot, contrôle, résultat","Seulement une blague","Uniquement le prix"],"correct":0,"why_ok":"Assez pour comprendre le lot plus tard.","why_ko":"Blague ou prix seuls ne documentent pas la maîtrise."}],"activity":{"type":"order","prompt":"Ordre logique des idées de maîtrise","steps":["Repérer ce qui peut arriver","Choisir où tenir bon","Fixer une limite et surveiller","Corriger, vérifier, écrire"],"correct":[0,1,2,3],"hint1":"D’abord voir.","hint2":"L’écrit clôture.","solution":"Analyse, points à tenir, limites et surveillance, puis correction vérification documents."},"exercise":{"prompt":"Écris sur une feuille tes sept lignes (une par principe) appliquées à Baobab Bliss en phrases très courtes.","hint1":"Utilise tes vrais gestes.","hint2":"Deux points critiques max au début.","solution":"Exemple modèle : liste de ce qui peut nuire ; points tamis et soudure ; limites visuelles ; surveillance chaque lot ; correction écarter ; vérif mensuelle ; carnet."}},{"title":"Les 12 étapes : vue d’ensemble","body":["Pour appliquer les sept principes, on suit souvent douze étapes. Les cinq premières préparent le terrain: équipe, description du produit, usage prévu, diagramme de flux, confirmation du flux sur place. Ensuite viennent les sept principes.","Chez Baobab Bliss, « l’équipe » peut être toi et une personne de confiance. Le produit: poudre de pulpe de baobab 100 pour cent, sachet, usage boisson ou cuisine après préparation par la cliente. Le flux: celui que tu as dessiné.","Confirmer le flux sur place veut dire marcher réellement dans l’atelier avec le schéma à la main. Tu corriges ce qui manque (exemple: une table de tri oubliée). Un schéma inventé depuis le canapé ne protège personne.","Ensuite seulement tu analyses les points sensibles, tu choisis les points critiques, tu fixes limites, surveillance, corrections, vérifications et écrits. Cette leçon donne la carte; les suivantes zooment. Marche dans l’atelier avec ta feuille de flux une fois par mois. Ce qui est dessiné doit encore être vrai. Photographie ton flux une fois: les photos aident à former une aide nouvelle sans tout réexpliquer.","Les douze étapes incluent l’équipe, la description du produit, l’usage, le diagramme, la vérification sur place, puis les sept principes. Chez Baobab Bliss, commence par un diagramme vrai et trois points sensibles maîtrisés plutôt qu’un classeur vide."],"prof":"Ne mémorise pas les douze étapes comme une poésie. Utilise-les comme une liste de contrôle une fois, puis quand tu changes quelque chose (nouveau film, nouveau fruit). Si tu es seule, tu es quand même « l’équipe »: tu notes tes décisions pour ne pas les perdre. Je peux t’aider à reformuler ton flux en phrases courtes. Les douze étapes sont une feuille de route d’équipe. Même seule, tu peux jouer plusieurs rôles sur le papier: ce qui compte, c’est de ne pas sauter l’étape « flux réel ».","tip":"Imprime ou recopie la liste des douze étapes et coche ce qui est déjà fait.","simple":"Comme préparer une fête: d’abord qui vient et quel menu, ensuite le chemin de la cuisine, puis les contrôles (sel, cuisson). Tu ne commences pas par le discours sur les desserts. Comme préparer une fête: d’abord qui fait quoi, ensuite le menu, puis les contrôles le jour J, enfin le bilan. Sauter le menu crée le chaos.","plus":"Les douze étapes Codex relient gouvernance du plan et science des points à surveiller. La description du produit inclut composition, structure, emballage, durée de vie visée, conditions de stockage, étiquetage. L’usage prévu inclut le consommateur cible (familles, enfants ?). Pour Olga: adultes et familles préparant une boisson; pas un aliment médical. Le diagramme doit coller à la réalité y compris les retours de produit (rebroyage). La séquence pédagogique classique va de l’équipe et de la description du produit jusqu’à la documentation, en passant par le flux, l’analyse, les points critiques et la surveillance. Tu n’as pas à produire un classeur d’usine. Tu as à suivre la logique une fois, puis à vivre le plan au quotidien. Description du produit et usage attendu évitent les analyses hors sujet. Tu ne traites pas Baobab Bliss comme une viande crue. Le bon cadrage économise du temps. Les reprises de produit (rework) doivent être décrites: quand reconcentrer une poudre, quand jeter. Sans règle, le rework devient un trou sanitaire.","expert":"Enchaînement Codex (Section 19 / Figure 1): (1) Assembler l’équipe et définir le champ d’application; (2) Décrire le produit; (3) Identifier l’usage prévu; (4) Construire le diagramme de flux; (5) Confirmer le diagramme sur site; (6) Analyser les points à surveiller et mesures (Principe 1); (7) Déterminer les CCP (P2); (8) Établir des limites critiques validées (P3); (9) Établir la surveillance (P4); (10) Établir les actions correctives (P5); (11) Valider le plan et établir la vérification (P6); (12) Établir la documentation (P7). ISO 22000:2018 articule PRP, OPRP et CCP dans la clause 8 (maîtrise opérationnelle): les OPRP maîtrisent des points à surveiller significatifs avec critères d’action; les CCP avec limites critiques mesurables. Pour un atelier familial, tu peux rester sur PRP solides plus un ou deux CCP candidats sans viser une certification immédiate. Les douze étapes Codex incluent les cinq préalables (équipe, description produit, usage attendu, diagramme, vérification sur site) puis les sept principes. Vérification sur site: tu marches réellement dans l’atelier avec ta feuille. Usage attendu Baobab Bliss: consommation après reconstitution ou saupoudrage, public général, conservation au sec. Description produit: pulpe de baobab en poudre, 100 pour cent, sachet. Équipe: toi + aide éventuelle + conseil (Rachid) pour revue. Documentation: allégée mais retracable. Ne pas confondre volume de pages et maîtrise réelle. Validation du diagramme: chaque flèche correspond à un geste réel photographiable. Les reprises (rework) doivent apparaître. Les déchets aussi. Un flux trop linéaire est souvent faux. Appendice: liste du matériel en contact (bacs, tamis, pince) pour préparer le nettoyage PRP.","quiz":[{"q":"Les cinq premières étapes servent surtout à :","choices":["Remplacer les contrôles","Préparer le terrain avant l’analyse détaillée","Décorer le mur"],"correct":1,"why_ok":"Équipe, produit, usage, flux, confirmation.","why_ko":"Elles ne remplacent pas les contrôles ni le décor."},{"q":"Confirmer le flux, c’est :","choices":["Marcher dans l’atelier avec le schéma","Imaginer depuis le canapé seulement","Effacer le carnet"],"correct":0,"why_ok":"La réalité corrige le papier.","why_ko":"Imaginaire seul ou effacement n’aident pas."},{"q":"Qui peut former l’équipe au début ?","choices":["Obligatoirement vingt ingénieurs","Toi et une personne de confiance","Personne"],"correct":1,"why_ok":"L’échelle doit coller à ton atelier.","why_ko":"Ni usine fantôme ni absence totale."},{"q":"Quand revenir aux douze étapes ?","choices":["Chaque minute","Jamais après la première fois","Quand tu changes film, fruit ou organisation"],"correct":2,"why_ok":"Les changements demandent une revue.","why_ko":"Jamais ou chaque minute sont absurdes."}],"activity":{"type":"label","prompt":"Place les grandes zones du flux","labels":["1","2","3","4"],"correct":{"0":"Réception","1":"Process","2":"Point critique","3":"Expédition"},"hint1":"De gauche à droite.","hint2":"L’expédition est à la fin.","solution":"Réception, process, point critique, expédition.","svg":"<svg viewBox=\"0 0 300 130\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<rect x=\"10\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/><text x=\"37\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Récept.</text>\n<path d=\"M65 60h20\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"85\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/><text x=\"112\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Process</text>\n<path d=\"M140 60h20\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"160\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#fff8e8\" stroke=\"#0071e3\"/><text x=\"187\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Critique</text>\n<path d=\"M215 60h20\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"235\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#e8ffe8\" stroke=\"#0071e3\"/><text x=\"262\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Expéd.</text>\n</svg>"},"exercise":{"prompt":"Dessine ton diagramme de flux actuel et marche-le une fois en corrigeant trois écarts.","hint1":"Prends la feuille avec toi.","hint2":"Note les écarts.","solution":"Exemple modèle : ajout d’une case « refroidissement » oubliée entre finition et soudure."}},{"title":"Points critiques baobab et mangue","body":["Un point critique, c’est une étape où une maîtrise est essentielle et où tu peux mesurer ou observer une limite. Tout n’est pas critique. Si tout est critique, plus rien ne l’est vraiment.","Pour le pain de singe artisanal, des candidats fréquents sont l’intégrité de l’emballage (soudure) et, si tu finis, le résultat d’humidité ou d’activité de l’eau. Le cassage seul est souvent une bonne pratique, pas un point critique thermique.","Pour une future mangue séchée, le séchage lui-même devient souvent critique: sous-sécher laisse trop d’eau disponible pour les moisissures. Tu vois pourquoi les deux fiches process restent séparées: les points critiques ne se copient pas.","Choisis au plus deux points critiques pour Baobab Bliss aujourd’hui. Écris pour chacun: problème maîtrisé, limite, comment tu surveilles, que faire si hors limite. C’est déjà un mini plan digne d’une ingénieure. Pour chaque point critique choisi, écris qui surveille, quand, et quoi faire si la limite est dépassée. Sans cela, le point est décoratif. Si tu ne peux pas mesurer une limite, change la limite ou change le point. Une limite vague n’arrête rien."],"prof":"Résiste à la tentation de tout baptiser critique. Le tri à réception est vital, mais tu le maîtrises souvent par refus du fruit (bonne pratique), pas par une limite instrumentale continue. La soudure, elle, se joue à chaque sachet. Je préfère ta clarté à une longue liste décorative. Peu de points critiques bien tenus battent une longue liste abandonnée. Choisis ce que tu peux vraiment surveiller chaque lot.","tip":"Écris aujourd’hui une fiche d’un demi-page pour un seul point critique réel.","simple":"Dans une maison, l’extinction des braises avant de dormir est critique; ranger les chaussures l’est moins. Tu réserves ton énergie de surveillance au feu, pas aux chaussures. Comme décider de tenir surtout la porte de la rue et le feu de la cuisine: tu ne mets pas un gardien sur chaque tiroir.","plus":"Arbre de décision Codex (outils 2022) aide à distinguer ce qui est maîtrisé par prérequis et ce qui exige un point critique. ISO 22000 ajoute les OPRP: point à surveiller significatifs maîtrisés par critères d’action sans toujours être CCP. Pour baobab: hygiène du tamis en PRP; soudure peut être CCP; réception en PRP avec critères d’acceptation. Pour mangue: séchage souvent CCP (humidité ou aw finale, temps-température documentés). Un point critique est une étape où la maîtrise est essentielle pour éviter ou ramener à un niveau acceptable ce qui peut nuire. En baobab artisanal, candidats fréquents: inspection et tamis (physique), maîtrise de l’humidité et soudure (qui protège contre reprise et moisissures). En mangue séchée future: l’étape de séchage elle-même devient centrale. Change de process = recalcule les points. Un nouveau séchoir mangue crée de nouveaux candidats. Archive l’ancienne version datée du plan. Limites d’action et limites critiques: tu peux avoir une zone d’alerte avant la limite dure. Exemple soudure: alerte si traction faible, rejet si ouvert.","expert":"Exemple pédagogique baobab — CCP emballage: point à surveiller = reprise d’humidité et contamination post-process; limite critique = soudure continue sans canal (test pelage OK); surveillance = contrôle visuel 100 pour cent + test pelage sur échantillon; correction = ressouder ou isoler; vérification = revue des taux de défauts mensuels; enregistrements = fiche lot emballage. Exemple pédagogique mangue — CCP séchage: point à surveiller = survie ou croissance microbienne si trop humide; limite = humidité produit ≤ cible (ex. guides mangue souvent autour de 15 pour cent base humide selon référentiels cités Rivier/ABNORM mangue séchée — à confirmer pour ton produit) et/ou aw ≤ 0,60; surveillance = mesure fin de cycle + relevé T et temps; correction = re-sécher ou bloquer; validation = essais montrant que le barème atteint la cible. Ne pas importer le CCP mangue tel quel sur baobab sans analyse. Arbre de décision classique: cette étape élimine-t-elle ou réduit-elle significativement le problème ? Une étape ultérieure le fait-elle mieux ? Si oui et que tu peux surveiller avec une limite, candidat point critique. OPRP (ISO 22000): maîtrise utile mais pas forcément limite critique au sens CCP. Exemple baobab: soudure surveillée par test de traction chaque début de série. Exemple mangue: température et temps de séchage enregistrés. Évite la sur-classification: vingt CCP fictifs tuent le système. Revue annuelle ou après changement de process. Documentation minimale par point critique: nom de l’étape, problème maîtrisé, limite, méthode de surveillance, fréquence, responsable, action corrective, enregistrement. Une fiche par point. Revue si changement de film, d’outil ou de produit (mangue). Formation archivée (date, personnes).","quiz":[{"q":"Si tout est déclaré critique :","choices":["C’est parfait","On peut supprimer la surveillance","Plus rien n’est vraiment priorisé"],"correct":2,"why_ok":"La priorisation disparaît.","why_ko":"Ce n’est ni parfait ni une excuse pour supprimer la surveillance."},{"q":"Pour baobab artisanal, un candidat fréquent est :","choices":["La couleur du logo seule","L’intégrité de la soudure","Le prénom du voisin"],"correct":1,"why_ok":"La soudure protège après process.","why_ko":"Logo et voisin ne sont pas des point critique."},{"q":"Pour la mangue future, souvent critique :","choices":["Le séchage jusqu’à la cible d’humidité","Le rangement des chaussures","Uniquement l’impression de l’étiquette"],"correct":0,"why_ok":"Sous-sécher laisse trop d’eau disponible.","why_ko":"Étiquette et chaussures ne sèchent pas le fruit."},{"q":"Le tri à réception est souvent :","choices":["Un point critique thermique de pasteurisation","Une bonne pratique avec critères","Inutile"],"correct":1,"why_ok":"Tu refuses le fruit douteux.","why_ko":"Ce n’est pas une pasteurisation, et ce n’est pas inutile."}],"activity":{"type":"case","prompt":"Cas points critiques","story":"Une amie te dit de mettre vingt points critiques sur ta feuille pour « faire sérieux ».","q":"Que réponds-tu ?","choices":["Je choisis peu de points vraiment surveillables","J’écris vingt cases vides","J’abandonne toute maîtrise"],"correct":0,"why_ok":"Peu mais réel.","why_ko":"Cases vides ou abandon ne protègent pas."},"exercise":{"prompt":"Rédige une fiche pour un point critique baobab (limite, surveillance, correction).","hint1":"Une demi-page.","hint2":"Utilise ton vrai geste.","solution":"Exemple modèle : soudure continue ; visuel chaque sachet ; ressouder ou écarter ; note sur fiche lot."}},{"title":"Plan de maîtrise au quotidien","body":["Le plan de maîtrise, c’est la version vivante de tes principes: liste de contrôle du matin, contrôles pendant le lot, clôture du soir. Chez Baobab Bliss, il tient sur deux pages si tu es honnête et concrète.","Matin: propreté de la table, outils propres, film et balance prêts, mains lavées. Pendant: tri, séparation soignée, tamis inspecté, soudure testée. Soir: lots clôturés, stock rangé, déchets sortis, carnet à jour.","Quand quelque chose dépasse la limite, tu appliques la correction écrite: écarter, ressayer, isoler. Tu ne « négocies » pas avec un sachet ouvert. Puis tu te demandes pourquoi, pour éviter la répétition.","Une fois par mois, tu relis les écarts du mois. C’est ta vérification. Si les mêmes défauts reviennent, tu changes un geste ou un outil, pas seulement tu soupires. Le soir, ne pars pas sans avoir noté les écarts du jour, même « aucun ». Le silence non écrit n’aide pas la revue. Prépare la liste de contrôle de demain la veille au soir. Le matin, tu exécutes au lieu d’inventer. Garde les listes de contrôle remplies un mois visible, puis archive. Voir la pile pleine motive plus qu’un discours sur la qualité."],"prof":"Le quotidien bat le classeur parfait jamais ouvert. Affiche la liste de contrôle là où tu travailles. Si une aide t’accompagne, elle doit pouvoir la suivre sans toi. Quand tu rates un jour, tu reprends le lendemain sans te culpabiliser: tu notes juste le trou et tu continues. La liste de contrôle du jour est ton volant. Si elle est trop longue, tu la sautes. Douze cases bien choisies battent quarante cases fantômes.","tip":"Affiche une liste de contrôle matin-pendant-soir en douze cases maximum.","simple":"Comme la routine du petit déjeuner des enfants: toujours les mêmes gestes dans le même ordre, pour ne rien oublier même quand tu es pressée. Comme la liste du marché écrite sur un papier: courte, lue avant de sortir, cochée en rentrant, sinon tu oublies l’essentiel.","plus":"On parle parfois de plan de maîtrise sanitaire (PMS) en France: ensemble des mesures d’hygiène et de HACCP. À ton échelle, c’est l’équivalent artisanal. Les guides de bonnes pratiques d’hygiène (GBPH) aident les filières, sans remplacer ta responsabilité. ISO 22000 formalise PRP, traçabilité, situations d’urgence, revue. Tu peux t’en inspirer sans certification immédiate. Le plan quotidien relie surveillance, corrections et enregistrements. Matin: hygiène et matériel. Pendant: contrôles lots. Soir: clôture et écarts. Les écarts non écrits n’existent pas pour l’amélioration. La revue hebdomadaire lit les écarts et décide une action. Vérification ≠ surveillance. Surveiller, c’est pendant le lot. Vérifier, c’est relire, tester, auditer à froid. Les deux cases doivent exister sur le calendrier mensuel. Glossaire mural en cinq mots: surveiller, corriger, vérifier, tracer, clôturer. Chacun sait ce qu’on attend le soir. Chaque case cochée à la va-vite se voit à la revue. Préfère dix cases vraies à vingt cases pensées. Ajuste la liste chaque mois selon les écarts réels.","expert":"Structure type d’un PMS artisanal: (1) bonnes pratiques (locaux, eau, personnel, nettoyage, nuisibles); (2) plan HACCP simplifié; (3) traçabilité et gestion non-conformités; (4) formation et revue. Vérification (principe 6) ≠ surveillance (principe 4): la surveillance est continue ou par lot; la vérification confirme périodiquement que le système fonctionne (étalonnage balance, revue écarts, éventuellement analyse labo). Validation: preuve que les mesures choisies sont capables d’atteindre les objectifs (essais de soudure, essais d’humidité). Exemple (nombres inventés): objectif défaut soudure inférieur à 3 pour cent; après formation pince, taux passé de 7 pour cent à 2 pour cent sur 300 sachets — validation interne. Règlement 852/2004: documents proportionnés à la nature et à la taille. Contenu type PMS artisanal: PRP (nettoyage, hygiène des mains, nuisibles, eau, déchets); points critiques et surveillance; actions correctives; vérification (revue fiches, tests); traçabilité. Exemple de liste de contrôle (12 cases): mains et plan de travail; état tamis; balance zéro; film et pince; fruits conformes; séparation propre; plateau blanc; soudure essai; code lot; poids sachets; stock surélevé; fiches rangées. Mesure d’efficacité: nombre d’écarts majeurs par mois en baisse. Pas de papier mort. Indicateurs de vérification: pour cent fiches complètes; nombre d’écarts ouverts; temps moyen de clôture d’un écart. Tableau mensuel. Audit interne léger tous les trois mois: une heure, liste de contrôle, trois actions max. Pas d’audit-théâtre. Escalade: si un écart critique revient trois fois, stop production jusqu’à action. Règle écrite, pas émotion du jour. Journal de bord des stops. Reprise autorisée seulement après check list de redémarrage cochée à deux. Le plan quotidien transforme les limites en coches horodatées: qui, quoi, quand, action si écart. Exemple (nombres inventés pour l’exercice): trois surveillances tenables — mains, corps étrangers, fermeture sachet — avec initiales sur sept jours.","quiz":[{"q":"Que faire si un sachet est hors limite ?","choices":["Effacer la limite","Le vendre quand même en silence","Appliquer la correction écrite"],"correct":2,"why_ok":"La correction protège la cliente.","why_ko":"Silence ou effacement empirent le problème."},{"q":"La revue mensuelle des écarts sert à :","choices":["Vérifier et améliorer","Remplacer le lavage des mains","Décorer"],"correct":0,"why_ok":"Tu apprends des défauts.","why_ko":"Elle ne remplace pas l’hygiène de base."},{"q":"La liste de contrôle doit être :","choices":["Longue de cent pages","Visible et utilisable par une aide","Cachée dans un tiroir fermé"],"correct":1,"why_ok":"Vivante et partagée.","why_ko":"Cachée ou interminable ne sert pas au quotidien."},{"q":"Surveillance et vérification :","choices":["Sont inutiles","Sont identiques toujours","Ne sont pas la même chose"],"correct":2,"why_ok":"L’une suit le lot, l’autre juge le système.","why_ko":"Ni fusion ni inutilité."}],"activity":{"type":"order","prompt":"Ordre d’une journée type","steps":["liste de contrôle matin","Contrôles pendant le lot","Corrections si besoin","Clôture soir et carnet"],"correct":[0,1,2,3],"hint1":"Tu ouvres propre.","hint2":"Tu fermes en écrivant.","solution":"Matin, pendant, corrections, soir."},"exercise":{"prompt":"Rédige ta liste de contrôle matin-pendant-soir (12 cases) et teste-la un jour entier.","hint1":"Coche pour de vrai.","hint2":"Barre ce qui est inutile.","solution":"Exemple modèle : mains, table, balance, film, tri, tamis, soudure test, code lot, stock, déchets, carnet, revue écarts du jour."}},{"title":"Traçabilité lot","body":["La traçabilité, c’est pouvoir dire d’où vient un sachet et où il est allé. Au minimum: fournisseur des fruits, date de process, code lot, quantité, destinataire si tu vends à une boutique.","Sur chaque sachet Baobab Bliss, le code lot doit être lisible. Dans le carnet, la même code renvoie aux contrôles du jour. Si une cliente revient avec une question, tu retrouves le lot en quelques minutes.","Garde les relations « un pas en arrière, un pas en avant »: qui t’a fourni, à qui tu as livré. Tu n’as pas besoin de suivre toute la ville. Tu as besoin du maillon voisin.","Exercice: prends un sachet déjà fait (ou un Exemple) et reconstruis sa fiche complète. Si un trou apparaît, tu corriges ton système avant qu’il ne compte vraiment. Imprime ou écris le format du code lot et colle-le près de la pince à souder. Un code inventé à la volée se perd. Après chaque livraison boutique, note lot et quantité avant de ranger les sacs vides. Cinq secondes qui sauvent une recherche. Si une cliente revient avec un sachet, remercie-la et ouvre la fiche ensemble. Cet exercice réel vaut dix simulations."],"prof":"La traçabilité n’est pas de la paperasse pour faire joli. C’est ton filet quand quelque chose cloche. Commence simple: un cahier, une colonne code, une colonne contrôles, une colonne sorties. Les outils numériques viendront s’ils aident vraiment. Pour l’instant, l’écrit fiable bat l’application abandonnée. Prends un sachet au hasard cette semaine et chronomètre le temps pour retrouver sa fiche. Si tu dépasses dix minutes, simplifie le classement.","tip":"Vérifie aujourd’hui qu’un sachet pris au hasard a son jumeau dans le carnet.","simple":"Comme noter qui a emprunté quelle bassine au quartier: tu sais à qui demander si elle manque. Ici tu sais quel fruit a nourri quel sachet. Comme retrouver qui a emprunté quelle chaise à la cérémonie: tu as noté les noms, tu rétrouves vite, sinon c’est la dispute.","plus":"En droit alimentaire européen, la traçabilité est une obligation générale des exploitants (règlement 178/2002). Au Burkina et dans l’espace régional, l’esprit de suivi et de responsabilité de l’opérateur apparaît aussi dans les textes de sécurité sanitaire. Pour toi: traçabilité interne solide d’abord. Si tu exportes, l’importateur demandera des preuves plus formelles. Conservation des enregistrements: au moins la durée de vie du produit plus une marge. Traçabilité interne: un pas en arrière (fournisseur), un pas en avant (client ou canal). Supports: code sur sachet, fiche lot, registre sorties. Exercices de reconstruction et de mock-retrait entraînent l’équipe. Durée de conservation des enregistrements: au moins la vie du produit plus une marge. Formats de code: date plus lettre de série suffisent au début. Évite les codes illisibles. Teste la lecture après frottement et après un mois en stock. Clients professionnels (boutiques): demande un accusé de réception simple (date, lots, quantités). Ce papier ferme le pas en avant.","expert":"Règlement (CE) n° 178/2002 art. 18: traçabilité à toutes les étapes; identification des fournisseurs et, le cas échéant, des entreprises auxquelles les produits ont été fournis; information mise à disposition des autorités sur demande. Art. 19: si l’exploitant considère qu’une denrée n’est pas conforme à la sécurité et qu’elle a quitté son contrôle immédiat, retrait; information des autorités; si le produit peut avoir atteint le consommateur, information efficace et, si nécessaire, rappel. Art. 17: responsabilité de respecter le droit alimentaire. Pour Baobab Bliss: registre fournisseurs fruits; registre lots process; registre livraisons (nom, date, lots, quantités). Exemple (nombres inventés): lot 2026-05-12-A, 80 sachets de 300 g, 50 vendus dégustation, 30 en stock boutique X — reconstruction en 5 minutes. Exercice de mock-retrait: choisir un lot et lister où il est. Cadre 178/2002 art. 18-19: traçabilité, retrait, information. Application Baobab Bliss: registres fournisseurs, lots, livraisons. Exemple (nombres inventés): lot 2026-05-12-A; 80 sachets; reconstruction en 6 minutes; un trou = une vente non notée; action = registre sorties obligatoire. Tests semestriels de mock-retrait. Export: l’importateur exigera souvent des preuves plus formelles. Numérique optionnel: un tableur aide si tu le tiens; un cahier tenu bat un tableur abandonné. Scénarios de retrait: (A) défaut soudure massif d’un créneau horaire; (B) fournisseur signale un problème amont. Pour chaque scénario, liste de diffusion (boutique, clientes connues, auto). Temps cible de première information: moins de 24 h. Exercice annuel chronométré. Traçabilité un pas amont et un pas aval: fournisseur du lot de gousses, et canaux ayant reçu le lot de sachets. Exemple (nombres inventés pour l’exercice): exercice blanc de rappel en trente minutes avec carnet et numéros de lot seulement.","quiz":[{"q":"Traçabilité minimale, c’est :","choices":["Oublier les dates","Relier sachet, lot, fournisseur et contrôles","Seulement un beau tampon"],"correct":1,"why_ok":"Le fil continu compte.","why_ko":"Tampon seul ou oubli des dates cassent le fil."},{"q":"« Un pas en arrière, un pas en avant » signifie :","choices":["Ne rien écrire","Suivre chaque habitant de la ville","Connaître fournisseur et client immédiat"],"correct":2,"why_ok":"Les maillons voisins.","why_ko":"Ni omniscience ni vide."},{"q":"Si une denrée non conforme a quitté ton contrôle (cadre européen) :","choices":["Tu changes seulement le logo","Tu attends sans rien faire","Tu engages un retrait et tu informes"],"correct":2,"why_ok":"Responsabilité d’opérateur.","why_ko":"Attendre ou changer un logo ne suffit pas."},{"q":"Pourquoi un exercice de reconstruction ?","choices":["Pour éviter le carnet","Pour perdre du temps inutilement","Pour trouver les trous avant un vrai souci"],"correct":2,"why_ok":"Tu testes ton système.","why_ko":"Ce n’est ni inutile ni une excuse pour supprimer le carnet."}],"activity":{"type":"match","prompt":"Relie élément et rôle","left":["Code sur sachet","Fiche carnet","Registre livraisons"],"right":["Identifie le lot pour la cliente","Garde les contrôles du jour","Dit où sont partis les sac
