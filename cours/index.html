 simulation pédagogique. Paramètres L*a*b*: L* clarté; a* vert-rouge; b* bleu-jaune; ΔE* = sqrt((ΔL*)^2+(Δa*)^2+(Δb*)^2). Seuil perceptuel souvent cité autour de ΔE* ≈ 1–3 selon contexte (ne pas dogmatiser). Pour futurs chips de banane: inactivation enzymatique (eau chaude courte, ou vapeur) avant séchage. Pour baobab: FIFO, barrière O2/H2O, tri optique manuel. dC/dt = k, f(aw,T,pH). Exemple (Exemple): aw 0,3 vs 0,6 à 30 °C sur 60 jours. ΔE* perceptuel souvent 1–3. Blanchiment pour fruits humides futurs, pas geste baobab par défaut. Maillard vs PPO vs caramélisation. L*a*b*, ΔE*=sqrt(ΔL*^2+Δa*^2+Δb*^2). aw intermédiaire accélère Maillard. Exemple (Exemple): ΔE*=5 entre témoin et stock (valeur d’école). FIFO, barrière O2/H2O. Futurs chips banane: blanchiment court avant séchage. Mécanismes: sorption GAB; oxydation ascorbate; Maillard; autoxydation lipidique. Régulation future étiquette: 1169/2011 si export. Exemple (Exemple): plan d’essais 2 stockages (ombre vs soleil) × 2 fermetures (bien vs mal) sur 14 jours, observation sensorielle quotidienne. Exemple (Exemple): témoin opaque lot 18 photographié à J0 et J30 sous la même fenêtre. Deux familles: brunissement enzymatique (PPO, optimum souvent vers 30–40 °C et pH proche de la neutralité, freiné par pH bas) et non enzymatique (Maillard, oxydation d’acide ascorbique vers composés bruns). L’acide ascorbique s’oxyde plus vite à l’air, à la chaleur et à la lumière; les produits d’oxydation participent à la couleur. Exemple (nombres inventés pour l’exercice): plan 2 stockages (ombre contre soleil) × 2 fermetures (soudure nette contre sachet mal fermé) sur 14 jours, observation sensorielle quotidienne et photo témoin. En fin de séchage de fruits futurs, Maillard s’emballe souvent quand l’activité de l’eau passe près de 0,6 alors que la température reste haute. Pour l’étiquette, un changement de couleur non annoncé peut être lu comme un défaut de loyauté: tu documentes la dérive avant de promettre une teinte stable.","quiz":[{"q":"Sur la pulpe de baobab déjà sèche, tu surveilles surtout…","choices":["Stockage, reprise d’humidité et fragments sombres","Un blanchiment à grande eau chaque heure","L’ajout de colorant alimentaire"],"correct":0,"why_ok":"Leviers réels pour ta poudre actuelle.","why_ko":"Ni blanchiment horaire ni colorant dans ta ligne 100 %."},{"q":"La réaction de Maillard implique surtout…","choices":["Uniquement du sel et de l’huile","La fermeture éclair du sachet","Sucres et composés aminés sous certaines conditions"],"correct":2,"why_ok":"Chimie sucres-aminés.","why_ko":"Pas une affaire de sel seul ni de fermeture."},{"q":"Pourquoi un sachet témoin opaque est-il utile ?","choices":["Remplacer le nettoyage","Augmenter magiquement la vitamine C","Comparer la couleur dans le temps"],"correct":2,"why_ok":"Référence visuelle datée.","why_ko":"Il ne crée pas de vitamine ni ne lave l’atelier."},{"q":"Le brunissement enzymatique concerne surtout…","choices":["Des fruits encore humides et endommagés","Les étiquettes en papier","La poudre parfaitement sèche jamais ouverte"],"correct":0,"why_ok":"Enzymes actives dans les tissus humides.","why_ko":"Pas le cas principal de ta poudre sèche bien menée."}],"activity":{"type":"order","prompt":"Ordre pour suivre la couleur d’un lot","steps":["Trier et tamiser","Conditionner","Garder un témoin opaque daté","Comparer plus tard à la lumière du jour"],"correct":[0,1,2,3],"hint1":"On commence par nettoyer la matière.","hint2":"La comparaison clôt.","solution":"Tri-tamisage, conditionnement, témoin, comparaison."},"exercise":{"prompt":"Crée un témoin : une cuillère de poudre du lot du jour dans un petit pot opaque daté. Écris L (clair), M ou F sur le carnet selon ta perception.","hint1":"Même lot que la production du jour.","hint2":"Pot vraiment opaque.","solution":"Exemple : « Lot 18 : 31 oct. 2026 : teinte M : pot témoin sur étagère nord. »"}},{"title":"Lipides et oxydation (graines et huiles)","body":["La pulpe elle-même est très pauvre en matières grasses. Les lipides se concentrent surtout dans les graines. Si tu presses un jour l’huile de graines de baobab, tu entreras dans un autre métier: rancissement, lumière, oxygène, métaux.","L’oxydation des lipides crée des odeurs de rance. Elle est favorisée par la chaleur, la lumière, l’oxygène et certains métaux. Les antioxydants naturels peuvent ralentir, mais le bon stockage reste la première barrière.","Pour Baobab Bliss pulpe: évite de laisser des fragments de graines broyées dans la poudre si tu veux un profil stable et une promesse pulpe pure. Le tamisage sépare clairement pulpe et graines.","Si tu stockes des graines en attendant une future huile, garde-les au sec, au frais relatif, à l’abri de la lumière, dans des contenants propres. Note la date de récolte. Si tu vends un jour l’huile, ce sera une autre étiquette, une autre hygiène, un autre plan d’oxydation. Ne mélange pas les stocks dès aujourd’hui. Une fine farine de graine passée à travers un tamis trop large peut apporter de l’amertume et du rance plus tard: ajuste la maille."],"prof":"Ne mélange pas les deux lignes dans ta tête: sachet de pulpe d’un côté, projet huile de l’autre. Beaucoup de problèmes d’odeur « bizarre » viennent d’un mélange involontaire graines et pulpe ou d’un stockage chaud. Sépare les zones sur ta table de travail. L’odeur « bizarre » d’un sachet doit déclencher une enquête: graines, chaleur, humidité, sachet percé. Note avant de jeter ou de sauver.","tip":"Zone pulpe et zone graines : deux bassines marquées, jamais partagées le même jour sans lavage.","simple":"L’huile d’arachide oubliée au soleil prend une odeur fatiguée. Les lipides des graines de baobab craignent la même exposition. La pulpe, presque sans gras, joue une autre partition. L’arachide grillée sent bon; l’arachide rance sent la fatigue. Apprends ce contraste pour juger tes graines stockées.","plus":"Indices: indice de peroxyde (peroxydes primaires), TBARs ou anisidine (secondaires), profil d’acides gras par chromatographie. Graines de baobab: lipides bien plus élevés que la pulpe (revues Chadare et autres). Pulpe: lipides souvent < 1 g pour 100 g selon études proximate. Séparation mécanique: séchage relatif des graines, vannage, tamis. Contaminations croisées atelier: même robot ou même pierre de broyage sans nettoyage. Indices peroxyde et secondaires. Pulpe souvent <1 g lipides/100 g. Graines beaucoup plus riches (revues). Séparation mécanique soignée. Nettoyage croisé: si la pierre ou le robot a broyé des graines, lavage complet avant la pulpe. Marque les outils. L’odeur de rance est un signal d’enquête, pas une fatalité à masquer avec un arôme. Les lipides sont surtout dans les graines, pas dans la pulpe tamisée. Si des fragments de graines passent le tamis, tu importes de l’huile oxydable dans la poudre. L’oxydation lipidique produit des odeurs de rance (aldéhydes, etc.). Chaleur, lumière, métaux et oxygène l’accélèrent. Marque clairement les bassines pulpe et graines. Lave les outils entre zones. Une odeur de rance déclenche une enquête (tamis, stockage, mélange), pas un arôme masquant.","expert":"Autoxydation radicalaire: initiation (radicaux), propagation (ROO, + RH vers ROOH + R, ), termination. Énergie d’activation et effet température: Q10 souvent ≈ 2 pour certaines oxydations (ordre de grandeur). Lumière: photo-oxydation via sensibilisateurs. Métaux: Fe, Cu catalysent. Exemple (Exemple): huile stockée 30 jours à 35 °C vs 25 °C — on attend une montée plus rapide de l’indice de peroxyde au chaud; mesure réelle requise. Pour une poudre de pulpe, le point à surveiller lipide est faible si la séparation graines est bonne; le point à surveiller odorant résiduel existe si fine farine de graine passe le tamis. Spécification interne possible: « absence visuelle de fragments de graine; tamis maille X mm ». Mailles exactes: à valider sur ton équipement. Autoxydation radicalaire, Q10, photo-oxydation, catalyse Fe/Cu. Exemple (Exemple): 30 jours à 35 vs 25 °C. Spécification interne: absence visuelle de fragments de graine. ROO, propagation; indices peroxyde/anisidine; photo-oxydation. Pulpe lipides souvent <1 g/100 g; graines >>. Exemple (Exemple): stockage 30 j à 35 °C vs 25 °C. Spécification: maille maximale et absence visuelle fragments. Ligne huile = autre HACCP futur. Exemple (Exemple): bassines PULPE et GRAINES marquées, outil passé au lavage entre zones. L’oxydation des lipides suit des étapes d’initiation, propagation et terminaison radicalaires. Les indices classiques (peroxyde, anisidine, TBA) mesurent des stades différents; en micro-atelier tu commences par le sensoriel et l’inspection visuelle des fragments. Exemple (nombres inventés pour l’exercice): comparaison sensorielle après 30 jours à environ 35 °C contre 25 °C sur deux pots identiques, à l’abri de la lumière. Spécification pratique: maille maximale du tamis et absence visuelle de fragments de graines dans la poudre destinée au sachet. Une future ligne d’huile de graines demanderait un HACCP séparé (pressage, filtration, protection contre l’oxydation). Pour la pulpe, la séparation mécanique soignée reste le premier contrôle d’entrée des lipides.","quiz":[{"q":"Où se trouvent surtout les lipides du fruit de baobab ?","choices":["Dans la pulpe en très grande quantité","Dans l’étiquette papier","Dans les graines"],"correct":2,"why_ok":"Les graines portent l’huile ; la pulpe en contient très peu.","why_ko":"Pulpe pauvre en gras ; étiquette sans lipides."},{"q":"Qu’est-ce qui favorise le rance ?","choices":["Chaleur, lumière, oxygène, certains métaux","Un sachet bien fermé au frais relatif","Le simple nom Baobab Bliss"],"correct":0,"why_ok":"Leviers classiques d’oxydation.","why_ko":"Un bon stockage protège ; le nom n’oxyde rien."},{"q":"Pour une poudre de pulpe pure, tu…","choices":["Ajoutes de l’huile de friture","Broyes tout ensemble pour « enrichir »","Sépares bien pulpe et graines au tamis"],"correct":2,"why_ok":"Séparation nette égale promesse 100 % pulpe.","why_ko":"Mélanger ou ajouter de l’huile casse la ligne produit."},{"q":"Pulpe et projet huile doivent…","choices":["Avoir des zones et contenants séparés","Être vendus dans le même sachet sans mention","Partager la même bassine sale"],"correct":0,"why_ok":"Séparation physique égale maîtrise.","why_ko":"Mélange et silence étiquette : mauvaises pratiques."}],"activity":{"type":"match","prompt":"Associe produit et vigilance","left":["Pulpe Baobab Bliss","Graines stockées","Huile future"],"right":["Tamisage et humidité","Sec, ombre, contenants propres","Rance, lumière, oxygène"],"pairs":{"0":0,"1":1,"2":2},"hint1":"La pulpe passe au tamis.","hint2":"L’huile craint le rance.","solution":"Pulpe vers tamisage ; graines vers stockage sec ; huile vers oxydation."},"exercise":{"prompt":"Organise ta table : colle deux étiquettes « PULPE » et « GRAINES ». Place les outils dédiés. Photographie ou dessine le plan dans le carnet.","hint1":"Même un carton divisé suffit.","hint2":"Lave si un outil doit changer de zone.","solution":"Exemple : schéma daté avec deux zones, passoires marquées, note « lavage obligatoire si prêt croisé »."}}],"m2":[{"title":"Les familles de microbes","body":["Dans ton atelier circulent des êtres microscopiques: bactéries, levures et moisissures. Certains abîment le goût ou l’odeur. D’autres peuvent rendre malade. Beaucoup sont inoffensifs dans un produit sec et propre, mais tout change si l’hygiène glisse.","La pulpe de baobab bien sèche et acide n’est pas un buffet ouvert pour toutes les bactéries. En revanche, les moisissures aiment parfois les milieux plus secs ou acides que l’on croit. Les levures peuvent pousser dans des boissons sucrées si tu prépares un nectar et le laisses au chaud.","Tu n’as pas besoin de voir les microbes pour les maîtriser. Tu maîtrises leurs portes d’entrée: mains, ustensiles, poussière, eau de lavage mal gérée, insectes, sachets sales.","Pour Baobab Bliss: chaque lot a une histoire microbienne qui commence au fruit et continue jusqu’à la cliente. Ton travail, c’est de couper les chemins sales. Apprends à séparer dans ta tête altération (goût, odeur, aspect) et pathogène (maladie possible). Les deux demandent de la propreté, mais les décisions de retrait ne sont pas identiques. Un fruit fendu ou moisi à l’ouverture de la gousse se retire avant extraction. Ce geste simple change la flore d’entrée."],"prof":"Pense « familles » plutôt que liste de peurs. Bactéries, levures, moisissures: trois styles de vie. Sur ta table, tu agis sur l’eau disponible, la propreté et le temps. Si une odeur de moisi apparaît, tu isole le lot, tu notes, tu ne mélange pas avec le stock sain. On verra les mycotoxines juste après. Quand tu sens une odeur de cave, tu n’es pas « trop sensible »: tu es en train de faire du contrôle sensoriel. Note et isole.","tip":"Avant chaque session, regarde ta table comme une étrangère : que retirerais-tu ?","simple":"Au marché, trois types de vendeurs: ceux qui crient, ceux qui chuchotent, ceux qui s’installent longtemps. Les microbes aussi ont des styles. Toi, tu choisis quels « stands » tu laisses ouverts sur ta table. Trois types d’invités à la maison: ceux qui partent vite, ceux qui restent, ceux qui laissent des traces. Les microbes aussi. Tu choisis la maison qu’ils trouvent.","plus":"Bactéries: procaryotes; croissance souvent limitée à aw plus élevée que les moisissures xérophiles. Levures: eucaryotes unicellulaires; fermentations possibles en milieu liquide sucré. Moisissures: filaments (mycélium); spores aériennes; certaines produisent des mycotoxines. Flore d’altération versus pathogènes. Produits à basse aw: sélection de flores adaptées (xérophiles). Acidité: barrière partielle. Mesures: dénombrements (UFC/g), recherche de pathogènes selon plan. Gram+, Gram−, Staphylococcus, Aspergillus/Penicillium. Poudres: spoilage mycélien si reprise d’humidité. Salmonella critique dans certaines poudres industrielles — plan interne baobab. Contrôle à réception des gousses: aspect, odeur, traces d’insectes, fentes. Refus matière = premier CCP informel avant même un diagramme HACCP formalisé (module qualité). La maîtrise sanitaire commence par des barrières simples avant les analyses coûteuses. Les analyses confirment; elles ne remplacent pas le lavage ni le tri. Bactéries, levures et moisissures n’ont pas les mêmes besoins d’eau ni les mêmes signatures visuelles. Les spores de moisissures résistent mieux à la dessiccation que beaucoup de cellules végétatives. Un fruit moisi à la réception est une porte d’entrée: le refus matière avant cassage évite de contaminer toute la table. Tu formes l’œil sur tes propres photos de lots acceptables et refusés, affichées en interne, sans dramatiser.","expert":"Taxonomie utile en IAA: bactéries Gram+ (ex. Bacillus sporulés dans poussières/épices), Gram− (entérobactéries indicateur d’hygiène fécale), Staphylococcus lié aux mains, moisissures Aspergillus/Penicillium/Fusarium selon matrices. Pour poudres sèches: spoilage souvent mycélien si reprise d’humidité; pathogènes: Salmonella historiquement critique dans certaines poudres (lait, épices, protéines) — la pulpe de baobab n’a pas un critère générique unique dans le règlement 2073/2005 listant toutes les poudres de fruits, d’où lecture cas par cas et plan interne. Exemple (Exemple): dénombrement flore totale 10^3 UFC/g vs 10^6 UFC/g sur deux lots pédagogiques — le second impose revue hygiène même sans pathogène détecté. Méthodes ISO de référence selon cible (ex. ISO 6579 Salmonella). Échantillonnage: voir leçon plans. Exemple (Exemple): 10 puissance 3 vs 10 puissance 6 UFC/g flore totale. ISO 6579 Salmonella. Échantillonnage détaillé en fin de module. Taxonomie utile; spoilage vs pathogène; aw et sélection xérophile. Exemple (Exemple): flore totale 10^3 vs 10^6 UFC/g. Salmonella dans matrices sèches (littérature laits/épices) justifie hygiène stricte même sans critère baobab dédié. ISO selon cible. Plans d’échantillonnage: comprendre n,c,m,M avant d’acheter une analyse. Exemple (Exemple): pour un indicateur d’hygiène de procédé, 5 unités prélevées en différents points du lot consolidé. Actions non-conformité: isolement, nettoyage renforcé, formation, éventuel retrait selon gravité et cadre local. Textes: 852/2004 (hygiène, HACCP, flexibilité); 2073/2005 (critères); 2023/915 (contaminants); Codex GHPs. Exemple (Exemple): fiche d’incident moisissure avec photo, masse isolée, destination (retrait), signature. Lien UEMOA 007/2007 comme cadre régional à connaître sans s’y substituer aux pratiques terrain. Exemple (Exemple): cinq portes d’entrée listées, deux corrigées le jour même.","quiz":[{"q":"Quelles sont les trois grandes familles utiles à connaître ?","choices":["Carton, verre et métal","Vitamines, fibres et minéraux","Bactéries, levures et moisissures"],"correct":2,"why_ok":"Ce sont les familles microbiennes du cours.","why_ko":"Nutriments ou emballages ne sont pas des microbes."},{"q":"Sur une poudre sèche et acide, qui reste souvent le plus préoccupant ?","choices":["Toutes les bactéries sans exception au même niveau","Les virus de l’étiquette papier","Les moisissures si l’humidité revient"],"correct":2,"why_ok":"Reprise d’humidité et moisissures : vigilance centrale.","why_ko":"Pas une égalité absolue ni un sujet d’étiquette."},{"q":"Comment « vois »-tu surtout les microbes en atelier familial ?","choices":["Par les portes d’entrée : mains, outils, poussière, eau","Uniquement avec un microscope obligatoire chaque heure","En goûtant un produit moisi pour vérifier"],"correct":0,"why_ok":"Tu maîtrises les chemins d’entrée.","why_ko":"Ni microscope permanent ni dégustation douteuse."},{"q":"Si une odeur de moisi apparaît sur un lot, tu…","choices":["Isoles, notes, et tu ne mélanges pas au stock sain","Verses tout dans le grand bac commun","Caches le lot sous un autre"],"correct":0,"why_ok":"Isolation et traçabilité.","why_ko":"Mélanger ou cacher aggrave la situation."}],"activity":{"type":"match","prompt":"Associe famille et idée","left":["Bactéries","Levures","Moisissures"],"right":["Souvent limitées si très peu d’eau disponible","Aiment parfois les boissons sucrées au chaud","Filaments et spores, parfois toxines"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Les boissons sucrées évoquent les levures.","hint2":"Les filaments pointent les moisissures.","solution":"Bactéries : eau ; levures : boissons ; moisissures : filaments."},"exercise":{"prompt":"Fais la liste de cinq portes d’entrée possibles dans ton atelier (exemple : torchon humide, mains, bassine fissurée…). Coche celles que tu corriges cette semaine.","hint1":"Pense aussi insectes et poussière.","hint2":"Une correction simple suffit pour commencer.","solution":"Exemple : torchon trop humide (à remplacer), couvercle manquant, téléphone posé sur la table, fenêtre ouverte sans moustiquaire, bassine rayée. Deux corrections faites et datées."}},{"title":"Ce qui fait pousser les microbes","body":["Les microbes ont besoin de conditions favorables: eau disponible, nourriture, température douce, temps, et parfois oxygène. Enlève un pilier, et leur vie devient plus difficile.","Pour ta poudre: garder une activité de l’eau basse et un sachet fermé coupe surtout l’eau et limite les contaminations. Pour une boisson préparée: le temps au chaud devient critique. Tu prépares, tu sers, tu ne laisses pas traîner une jarre ouverte une journée entière au soleil.","Le froid ralentit beaucoup de croissances, mais ce n’est pas toujours disponible à Ouagadougou pour tout le stock. Alors tu miseras sur la sécheresse, la propreté, l’ombre et la rotation des lots (premier entré, premier sorti).","Le tri des gousses est un levier aussi fort qu’un produit chimique. Un mur ouest qui chauffe au soleil de l’après-midi peut transformer ta caisse en incubateur. Déplacer la caisse est parfois plus utile qu’un discours. Pour les boissons de dégustation, prévois des volumes petits renouvelés plutôt qu’une grande jarre unique.","Quatre leviers reviennent toujours: eau disponible, température, temps, et nutriments. Une caisse chaude au soleil après-midi peut devenir un incubateur. Déplacer la caisse au frais et à l’ombre change plus qu’un discours. Pour les boissons de dégustation, renouvelle de petits volumes plutôt qu’une grande jarre unique qui attend toute la journée."],"prof":"Retiens la règle des piliers: eau, nourriture, chaleur, temps. Sur Baobab Bliss poudre, tu coupes l’eau et tu gères le temps d’ouverture. Sur une dégustation de boisson au marché, tu gères le temps et la glace ou l’ombre. Dis-moi toujours quel pilier tu vises: je t’aide à choisir le geste. Dis-moi quel pilier tu vises aujourd’hui: eau, chaleur, temps ou propreté. Un seul pilier bien tenu vaut mieux que quatre intentions floues.","tip":"Inscris « premier entré, premier sorti » sur ta caisse de stock.","simple":"Le linge humide en boule dans un coin devient vite une mauvaise surprise. Le même linge étendu au sec reste net plus longtemps. Les microbes aiment les coins humides et oubliés. Le tô laissé couvert refroidit autrement que le tô découvert. Le temps et la chaleur jouent partout, y compris sur une jarre sucrée.","plus":"Facteurs intrinsèques: aw, pH, nutriments, antimicrobiens naturels, structure. Facteurs extrinsèques: T, humidité relative, gaz (air, vide, MAP). Facteurs implicites: flore concurrente, traitements. Courbes de croissance: latence, exponentielle, stationnaire, déclin. Température: psychrotrophes, mésophiles, thermophiles. Pour poudres: adsorption d’humidité selon HR ambiante (isothermes). Facteurs intrinsèques et extrinsèques. Courbes de croissance. Classes de température microbiennes. Isothermes et HR ambiante pour poudres. Petit matériel utile: thermomètre de pièce, hygromètre, feutre pour dates, caisse surélevée du sol. Ces objets valent mieux qu’un discours long sur la théorie des piliers. La maîtrise sanitaire commence par des barrières simples avant les analyses coûteuses, dans le contexte précis de cette leçon. Les analyses confirment; elles ne remplacent pas le lavage ni le tri, dans le contexte précis de cette leçon. Tu prépares ainsi le diagramme des points à surveiller du module qualité: chaque porte d’entrée identifiée ici reviendra comme cause potentielle à maîtriser. Tu relis chaque levier à un geste: fermer le sachet (eau), ombrager le stock (température), ne pas laisser une bassine ouverte toute la nuit (temps), et trier les fruits abîmés (nutriments et contamination). Ces portes d’entrée reviendront dans le plan de maîtrise.","expert":"Modèle de croissance primaire (ex. Baranyi, Gompertz) hors détail ici; idée: vitesse maximale μ_max dépend de T, aw, pH (modèles secondaires type Ratkowsky, gamma concept). Exemple (Exemple): μ_max double entre 20 et 30 °C pour un organisme mésophile pédagogique en milieu liquide — pas applicable tel quel à une poudre à aw 0,3. Règle pratique boisson: zone 5 à 60 °C souvent citée comme plage où beaucoup de bactéries croissent vite si le milieu le permet (cadre restauration); pour une jarre de dégustation, temps court et récipients propres. FIFO: date sur chaque carton. Mesure: thermomètre local de stockage; hygromètre si possible. μ_max et modèles secondaires (aperçu). Zone 5–60 °C souvent citée en restauration pour liquides à point à surveiller — adapter au contexte dégustation. FIFO daté. Hygromètre utile. Intrinsèque/extrinsèque/implicite. Baranyi/Gompertz (aperçu). Ratkowsky. Exemple (Exemple): μ_max double 20 vers 30 °C en liquide pédagogique. Boisson marché: volumes renouvelés, ombre, temps court. FIFO. Zone température restauration 5–60 °C: rappel contextuel liquides. Plans d’échantillonnage: comprendre n,c,m,M avant d’acheter une analyse, dans le contexte précis de cette leçon. Exemple (Exemple): pour un indicateur d’hygiène de procédé, 5 unités prélevées en différents points du lot consolidé, dans le contexte précis de cette leçon. Actions non-conformité: isolement, nettoyage renforcé, formation, éventuel retrait selon gravité et cadre local, dans le contexte précis de cette leçon. Textes: 852/2004 (hygiène, HACCP, flexibilité); 2073/2005 (critères); 2023/915 (contaminants); Codex GHPs, dans le contexte précis de cette leçon. Exemple (Exemple): fiche d’incident moisissure avec photo, masse isolée, destination (retrait), signature, dans le contexte précis de cette leçon. Lien UEMOA 007/2007 comme cadre régional à connaître sans s’y substituer aux pratiques terrain, dans le contexte précis de cette leçon. Exemple (Exemple): jarre de dégustation renouvelée toutes les heures à l’ombre, pas une seule jarre journée.","quiz":[{"q":"Quels piliers favorisent surtout la pousse microbienne ?","choices":["Eau disponible, nourriture, température douce, temps","Uniquement la couleur de l’étiquette","Le nom de la marque seul"],"correct":0,"why_ok":"Ce sont les leviers classiques.","why_ko":"L’étiquette ou la marque ne nourrissent pas les microbes."},{"q":"Pour une jarre de boisson au marché, le pilier critique est souvent…","choices":["La forme du logo","Le temps au chaud","Le grammage exact de l’étiquette or"],"correct":1,"why_ok":"Temps et température sur un liquide.","why_ko":"Logo et or n’arrêtent pas une croissance."},{"q":"Le tri des gousses abîmées sert à…","choices":["Augmenter magiquement le pH","Remplacer le lavage des mains","Réduire la flore déjà présente avant extraction"],"correct":2,"why_ok":"Moins d’entrées contaminées.","why_ko":"Ni substitut au lavage ni effet magique sur le pH."},{"q":"« Premier entré, premier sorti » aide à…","choices":["Mélanger les dates au hasard","Oublier les plus anciens au fond","Limiter le vieillissement inutile des lots"],"correct":2,"why_ok":"Rotation claire du stock.","why_ko":"Le contraire crée des coins oubliés."}],"activity":{"type":"order","prompt":"Ordre pour une dégustation boisson plus maîtrisée","steps":["Laver le récipient","Préparer la boisson","Servir rapidement à l’ombre","Vider et laver en fin de marché"],"correct":[0,1,2,3],"hint1":"On commence par laver.","hint2":"On termine en nettoyant.","solution":"Laver, préparer, servir vite, vider et laver."},"exercise":{"prompt":"Mesure ou estime la température de ton lieu de stock (thermomètre ou sensation matin midi soir). Note trois heures dans la journée.","hint1":"Même endroit chaque fois.","hint2":"Ajoute si le soleil frappe la caisse.","solution":"Exemple : « 8 h ombre : frais. 13 h : chaud contre le mur. 18 h : redescend. Action : déplacer la caisse du mur ouest. »"}},{"title":"Moisissures et mycotoxines","body":["Les moisissures forment des filaments et des spores qui voyagent dans l’air. Sur une poudre qui a repris l’humidité, tu peux voir des taches, sentir un odeur de cave, ou parfois ne rien voir alors qu’une toxine a déjà été produite en amont sur la matière.","Les mycotoxines sont des poisons naturels produits par certaines moisissures. Les aflatoxines sont les plus citées pour de nombreuses denrées tropicales (fruits secs, oléagineux, céréales selon cas). Elles ne se « lavent » pas comme une poussière.","Pour Baobab Bliss: trier les fruits abîmés, éviter l’humidité, séparer les lots suspects, tenir un stock sec. Si tu exportes un jour vers l’Europe, des teneurs maximales existent selon la catégorie d’aliment: tu liras l’annexe avec un labo, sans inventer un chiffre.","Un lot avec moisissure visible ne se mélange pas au lot sain pour « diluer ». Tu l’isoles et tu décides avec une règle écrite à l’avance. Écris ta règle moisissure avant le prochain incident, pas après. La décision à froid est plus juste. Pour l’export futur, tu ne devineras pas le seuil: tu liras la ligne de l’annexe avec le labo selon la catégorie exacte de ton produit."],"prof":"Je vais être claire et calme: diluer un lot moisi dans un grand sac n’est pas une méthode. Tu perds la confiance et tu étends le problème. On écrit ensemble ta règle: tache visible ou odeur de moisi égale isolation du lot, photo, date, décision (retrait de la vente). Pour les aflatoxines, seul un labo compte. Je refuse avec toi la tentation de « juste un petit mélange ». C’est le moment où une responsable se distingue d’une journée pressée.","tip":"Ajoute dans ton carnet une ligne « règle moisissure » signée de ta main.","simple":"Une mangue pourrie au fond du panier abîme les autres si tu la laisses. Un coin de poudre moisi joue le même rôle dans un grand bac. On retire le coin, on ne le disperse pas. Une mangue pourrie au fond du panier: tout le monde comprend. Une poudre moisie au fond du bac: même histoire, moins visible, aussi sérieuse.","plus":"Genres fréquents: Aspergillus, Penicillium, Fusarium (selon matrice). Aflatoxines B1, B2, G1, G2; M1 dans le lait. Stabilité thermique relative: beaucoup de mycotoxines résistent à une cuisson ordinaire. Prévention terrain supérieure à « rattrapage ». Règlement (UE) 2023/915: teneurs maximales par catégorie (fruits séchés, fruits à coque, etc.). Catégorie exacte pour poudre de pulpe de baobab: à confirmer avec la classification du produit avant export — ne pas inventer le seuil. Aflatoxines B1/B2/G1/G2. Stabilité thermique relative. 2023/915 lignes fruits séchés (ex. 2,0 et 4,0 µg/kg consommateur final hors cas particuliers) — vérifier catégorie baobab. Formation visuelle: photos (tes propres) de lots acceptables vs refusés, affichées en interne, sans dramatiser. La règle écrite bat la mémoire orale le jour de rush. Les mycotoxines (dont aflatoxines) sont des métabolites de certaines moisissures; elles ne se voient pas toujours alors que le fruit paraît encore « à peu près bon ». La prévention amont (tri, séchage suffisant des denrées concernées, stockage sec) prime sur un traitement magique après coup. Tu écris une règle de refus moisissure avant le rush. Les limites chiffrées se lisent dans l’annexe du marché visé selon la catégorie exacte du produit: tu ne copies pas un chiffre d’amande sur la poudre de baobab sans vérifier.","expert":"Règlement (UE) 2023/915 annexe I section mycotoxines. Exemples publiés pour fruits séchés: pour fruits séchés destinés à un triage ou traitement physique avant consommateur, B1 5,0 µg/kg et somme B1+B2+G1+G2 10,0 µg/kg; pour fruits séchés (ou produits transformés concernés) mis sur le marché pour le consommateur final (hors figues séchées et hors cas particuliers), B1 2,0 µg/kg et somme 4,0 µg/kg (vérifier toujours le numéro de ligne et les remarques de l’annexe pour ton produit exact). Figues séchées: lignes dédiées (6,0 et 10,0 µg/kg). Oléagineux et fruits à coque: autres lignes. Méthodes d’analyse: HPLC, LC-MS/MS; incertitude de mesure et règles d’interprétation du règlement. Plan interne Baobab Bliss: critères d’acceptation matière (aspect, odeur), fréquence d’analyses aflatoxines selon volume et canal (local vs export). Exemple (Exemple): 1 analyse sur lot consolidé de 50 kg avant un envoi-test — fréquence pédagogique, à ajuster. HPLC/LC-MS. Exemple (Exemple): 1 analyse sur 50 kg consolidés avant envoi-test. Plan fréquence selon canal. Pas de dilution. 2023/915: fruits séchés triage 5,0 / 10,0 µg/kg; consommateur final 2,0 / 4,0 µg/kg (hors figues et cas listés) — vérifier ligne exacte pour ton produit. Exemple (Exemple): plan 1 analyse/50 kg avant export-test. Méthodes LC-MS/MS. Pour mycotoxines, privilégie les plans contaminants adaptés plutôt qu’un simple dénombrement de flore. Exemple (Exemple): règle moisissure signée avant incident, appliquée sur un coin de bac suspect. Les aflatoxines (B1, B2, G1, G2; M1 dans le lait) sont notamment associées à Aspergillus. Le règlement (UE) 2023/915 fixe des teneurs maximales par denrée; la catégorie exacte de la poudre de pulpe de baobab doit être lue dans l’annexe avant export, sans inventer un seuil. Codex CXS 193 donne aussi des références pour certaines fruits à coque. Exemple (nombres inventés pour l’exercice): avant un essai export, tu budgets une analyse mycotoxines sur un échantillon composite représentatif du lot, avec méthode type LC-MS/MS demandée au labo, et tu archives bulletin et numéro de lot ensemble. Un plan d’échantillonnage contaminants est souvent plus lourd qu’un simple dénombrement de flore: tu suis le guide du labo ou de l’autorité plutôt qu’un seul pot tiré au hasard.","quiz":[{"q":"Que faire d’un lot avec moisissure visible ?","choices":["Le diluer dans un grand sac pour cacher","Le vendre d’abord aux inconnus","L’isoler et appliquer ta règle écrite"],"correct":2,"why_ok":"Isolation et règle claire.","why_ko":"Diluer ou cibler des inconnus n’est pas acceptable."},{"q":"Les aflatoxines…","choices":["Disparaissent toujours au simple soleil du matin","Sont des toxines de certaines moisissures, mesurées en labo","Se lisent à l’œil nu comme du sucre"],"correct":1,"why_ok":"Mesure labo, pas magie solaire ni sucre visible.","why_ko":"Ni soleil ni œil ne quantifient les aflatoxines."},{"q":"Pour un export européen futur, les seuils…","choices":["Se lisent dans l’annexe selon la catégorie exacte du produit","S’inventent pour aller plus vite","Sont inutiles dès que le goût plaît"],"correct":0,"why_ok":"Catégorie et annexe, avec aide labo.","why_ko":"Ni invention ni goût seul."},{"q":"La prévention la plus utile aujourd’hui est…","choices":["Ajouter un parfum fort","Tri, sécheresse, isolation des suspects","Mélanger tous les lots chaque soir"],"correct":1,"why_ok":"Gestes terrain.","why_ko":"Parfum ou mélange nocturne n’aident pas."}],"activity":{"type":"case","prompt":"Cas moisissure","story":"Tu trouves une tache verte dans un coin du bac de poudre.","q":"Premier geste ?","choices":["Isoler la zone et le lot, noter date et photo","Continuer le conditionnement sans pause","Remuer pour répartir la couleur"],"correct":0,"why_ok":"Tu stoppes la propagation et tu traces.","why_ko":"Remuer ou ignorer étend le problème."},"exercise":{"prompt":"Rédige ta règle moisissure en trois lignes (si je vois…, alors je…, je note…). Signe et date.","hint1":"Pas de dilution.","hint2":"Prévois qui décide (toi).","solution":"Exemple : « Si tache ou odeur de moisi : j’isole le lot, je ne vends pas, je photographie, je note. Décision : Olga seulement. Date. »"}},{"title":"Pathogènes et poudres sèches","body":["Un pathogène est un microbe capable de rendre malade. Dans les poudres alimentaires, l’histoire industrielle a montré que des bactéries comme certaines salmonelles peuvent survivre longtemps au sec, puis se réveiller quand la poudre retrouve un milieu humide (boisson, sauce).","Cela ne veut pas dire que ta pulpe est forcément contaminée. Cela veut dire que l’hygiène des mains, l’eau de nettoyage, les surfaces et la protection contre les crottes d’animaux ou d’insectes comptent énormément, même si le produit paraît sec.","Tu réduis la chance d’entrée: fruits propres, table propre, séchage des outils, exclusion des animaux de l’espace de production, lavage des mains, sachets propres.","Les analyses de pathogènes sont des actes de laboratoire avec un plan d’échantillonnage. Tu ne « goûtes » pas pour savoir si c’est pathogène. Tu préviens, tu traces, tu fais analyser quand le volume et le canal le demandent. Le conditionnement près des toilettes ou d’un point d’eau sale est une mauvaise idée d’aménagement. Déplace la table si besoin. Les analyses pathogènes coûtent: priorise-les quand le volume, un salon, ou un acheteur les exige, tout en maintenant les barrières quotidiennes."],"prof":"Je préfère te parler de portes d’entrée que de panique. Un chat sur la table, un seau d’eau sale, des mains après les toilettes sans lavage: voilà des histoires concrètes. Corrige trois portes cette semaine. Quand tu vendras plus loin ou exporteras, on construira un plan d’analyses avec un labo. Corriger trois portes d’entrée cette semaine est un meilleur plan que lire dix pages sans rien changer. Je veux tes trois photos ou notes.","tip":"Affiche près du point d’eau : « Mains lavées avant chaque session et après chaque pause. »","simple":"Une graine sèche peut attendre la pluie pour germer. Certains microbes pathogènes attendent aussi un verre d’eau ou une bouillie pour se remettre en marche. Garde la poudre propre avant cette rencontre. Une graine attend la pluie. Un microbe sec attend parfois le verre d’eau de la cliente. Garde la poudre digne avant cette rencontre.","plus":"Pathogènes d’intérêt en IAA: Salmonella spp., Listeria monocytogenes (surtout aliments prêts à manger humides/réfrigérés), Bacillus cereus (spores, riz et aliments amidonnés, aussi épices), Staphylococcus aureus (toxine dans aliments manipulés). Poudres: survie de Salmonella documentée dans diverses matrices sèches; dose infectieuse variable. Indicateurs d’hygiène: entérobactéries, E. coli. Règlement 2073/2005: critères de sécurité et critères d’hygiène des procédés selon denrées listées — lire si une catégorie te concerne (ex. fruits prédécoupés prêts à manger, jus non pasteurisés); absence de ligne « poudre de baobab » générique ⇒ plan interne + appui labo. Salmonella, Listeria (contextes humides RTE), B. cereus, S. aureus. Indicateurs E. coli / entérobactéries. 2073/2005: pas de ligne baobab générique. Aménagement: flux avant / après, point d’eau, poubelle fermée, exclusion animale affichée. Une demi-journée de rangement réduit plus de possibilités qu’un achat gadget. Dans les poudres sèches, la croissance est souvent freinée par la basse activité de l’eau, mais la survie de pathogènes introduits par les mains, l’eau ou les surfaces reste possible. Salmonella en particulier est redoutée dans les aliments à faible humidité. Les indicateurs (Escherichia coli, entérobactéries) aident à juger l’hygiène sans remplacer une recherche ciblée quand le labo la propose. L’aménagement (flux avant, point d’eau, poubelle fermée, exclusion animale) réduit les entrées plus sûrement qu’un gadget.","expert":"Critères 2073/2005: plan d’échantillonnage n, c, m, M. Exemple fruits et légumes prédécoupés prêts à manger: E. coli, n=5, c=2, m=100 UFC/g, M=1000 UFC/g en cours de fabrication (hygiène de procédé). Listeria monocytogenes: critères selon denrée et capacité de croissance (100 UFC/g ou absence dans 25 g selon cas). Pour une poudre sèche vendue à diluer: évaluer si le produit fini « prêt à manger » après simple dilution chez le consommateur change l’analyse des points à surveiller (module HACCP ultérieur). Exemple (Exemple): prélèvement de 5 unités d’un lot consolidé pour recherche Salmonella (absence dans 25 g) avant un salon — scénario pédagogique. Actions si non-conformité: isolement, investigation hygiène, éventuel retrait selon gravité et cadre légal local. Plans n,c,m,M. Exemple fruits prédécoupés E. coli 5-2-100-1000. Exemple (Exemple): 5 unités Salmonella absence/25 g avant salon. Actions: isolement, revue hygiène. Pathogènes cibles et indicateurs. 2073/2005 exemples RTE végétaux. Exemple (Exemple): n=5 Salmonella absence/25 g. Investigation: mains, eau, table, nuisibles. Module HACCP approfondira CCP et PRPo. Pour pathogènes en poudre, l’absence dans 25 g sur n unités parle plus qu’un seul pot. Exemple (Exemple): savon fixe + exclusion animale + torchons lavés, trois photos datées. Le règlement (CE) 2073/2005 pose des critères de sécurité des aliments et d’hygiène des procédés avec plans n, c, m, M. Il n’existe pas de ligne générique « poudre de baobab » aussi claire que pour certains jus prêts à consommer: tu choisis la catégorie la plus proche avec le labo et tu évites d’inventer un critère. Pour beaucoup de pathogènes en denrée sèche, l’absence dans 25 g sur n unités d’échantillon parle plus qu’un seul pot. Exemple (nombres inventés pour l’exercice): tu documentes savon fixe au poste, exclusion animale affichée, et torchons lavés datés — trois preuves photographiques avant d’envoyer un premier bulletin microbio. Les prérequis d’hygiène (PRP) et, plus tard, les points critiques, s’appuient sur ces barrières quotidiennes.","quiz":[{"q":"Certains pathogènes dans les poudres…","choices":["Peuvent survivre au sec puis reprendre en milieu humide","Meurent tous dès que le produit est acide","Se voient toujours comme du sable noir"],"correct":0,"why_ok":"Survie au sec puis reprise : point clé.","why_ko":"Ni mort garantie par l’acidité seule ni vision sable."},{"q":"Pour savoir si un pathogène est présent, tu…","choices":["Passes par un laboratoire et un plan","Goûtes une pincée « test »","Demandes seulement à une voisine"],"correct":0,"why_ok":"L’analyse labo tranche.","why_ko":"Ni dégustation ni rumeur."},{"q":"Quel geste réduit une porte d’entrée fréquente ?","choices":["Laisser le chat circuler sur la table de conditionnement","Laver les mains avant la session et après les pauses","Réutiliser l’eau sale de la veille"],"correct":1,"why_ok":"Mains propres : barrière simple et forte.","why_ko":"Animaux sur table et eau sale ouvrent des portes."},{"q":"L’absence d’une ligne « baobab » dans un tableau européen signifie…","choices":["Que tu peux ignorer toute hygiène","Que tu construis un plan interne avec un labo selon ton usage","Que tu inventes tes propres pathogènes"],"correct":1,"why_ok":"Plan adapté, pas le vide.","why_ko":"Ni laissez-passer ni invention."}],"activity":{"type":"tf","prompt":"Vrai ou faux : pathogènes et poudre","statements":[{"t":"Une poudre sèche peut encore poser question si elle est mal manipulée.","truth":true,"why":"Survie possible au sec."},{"t":"Goûter suffit pour détecter un pathogène.","truth":false,"why":"Seul le labo détecte correctement."},{"t":"Exclure les animaux de la zone de production aide.","truth":true,"why":"Porte d’entrée réduite."}]},"exercise":{"prompt":"Corrige trois portes d’entrée cette semaine (photo avant après ou note). Exemples : point d’eau, exclusion animale, torchons.","hint1":"Choisis des gestes réalistes.","hint2":"Date chaque correction.","solution":"Exemple : 1) savon fixe près du seau d’eau claire. 2) porte fermée aux animaux. 3) torchons lavés et séchés. Photos ou notes datées."}},{"title":"Nettoyer et désinfecter","body":["Nettoyer enlève les saletés visibles et invisibles (graisses, poussières, restes de poudre). Désinfecter réduit les microbes restants sur une surface déjà propre. Désinfecter sur une table encore sale sert peu: la saleté protège les microbes.","Ordre utile: débarrasser, laver avec de l’eau et un détergent alimentaire adapté, rincer, laisser sécher, puis désinfecter si tu utilises un désinfectant autorisé pour le contact alimentaire, puis rincer encore si la notice l’exige, puis sécher.","À Ouagadougou, l’eau de qualité variable demande de la prudence: eau claire dédiée au dernier rinçage des surfaces alimentaires, récipients propres, séchage à l’air protégé plutôt qu’un torchon douteux.","Établis une fréquence: avant chaque session, après chaque session, et un grand nettoyage hebdomadaire des coins. Écris qui fait quoi. Le grand nettoyage hebdomadaire vise les coins: pieds de table, jointures, dessous de caisse. C’est là que la farine de poudre s’accumule. Ne mélange jamais un produit chloré avec un acide: lis les notices et range les produits séparément, hors de portée des enfants.","Nettoyer enlève la matière; désinfecter vise les microbes restants sur une surface déjà propre. Inverser l’ordre laisse de la saleté qui protége les microbes. Une ronde hebdomadaire vise pieds de table, jointures et dessous de caisse, là où la farine de poudre s’accumule. Tu ranges les produits de nettoyage hors de portée des enfants et tu ne mélanges jamais un produit chloré avec un acide."],"prof":"Beaucoup d’ateliers confondent « passer un chiffon humide » et « nettoyer ». Le chiffon sale déplace la poussière. Prends deux chiffons clairement marqués, lave-les souvent, et laisse sécher les bassines à l’envers sur une grille propre. Si tu utilises un produit désinfectant, lis la notice: temps de contact, dilution, rinçage. Si tu n’as qu’un seul chiffon, lave-le à fond entre les zones sale et propre, ou passe au séchage air. Un chiffon unique sale annule le lavage.","tip":"Marque au marqueur « sale » et « propre » sur deux bassines de lavage d’outils.","simple":"Laver une marmite collée: tu ne verses pas l’eau de javel sur la croûte sèche d’abord. Tu fais tremper, tu grattes, tu rinces. Puis seulement tu désinfectes si besoin. Ta table suit la même logique. La marmite collée se traite par étapes. Ta table aussi. La précipitation chimique sur la croûte ne remplace pas le grattage.","plus":"Détergence: tension active, température, action mécanique, temps. Biofilms: communautés microbiennes adhérentes — plus difficiles. Désinfectants: chlore, alcool, acides, composés d’ammonium quaternaire selon usages et compatibilités matériaux; toujours fiche technique et rinçage si requis. Validation: tests de surface (boîtes contact, ATP en industrie). Atelier familial: liste de contrôle écrite vaut mieux qu’une mémoire fatiguée. Détergence: chimie, T, mécanique, temps. Biofilms. Désinfectants et fiches. 852/2004 et GBPH. PND écrit. Fiches produits: dilution, temps de contact, rinçage, surfaces compatibles, stockage hors enfants. Un cahier de dilution évite les surdosages inutiles et les sous-dosages inefficaces. Tu prépares ainsi le diagramme des points à surveiller du module qualité: chaque porte d’entrée identifiée ici reviendra comme cause potentielle à maîtriser, dans le contexte précis de cette leçon. Le choix de la concentration et du temps de contact suit la notice: le surdosage n’accélère pas toujours l’efficacité et abîme surfaces et peaux; le sous-dosage laisse un faux sentiment de maîtrise. Tu écris une liste de contrôle avant production, après production, et hebdomadaire. L’eau de rinçage compte autant que le produit: une eau douteuse recontamine la table.","expert":"Cadre UE: règlement (CE) 852/2004 — exigences d’hygiène, procédures fondées sur HACCP (sauf production primaire), flexibilité PME. Guides de bonnes pratiques d’hygiène (GBPH) validés: outils d’aide. Plan de nettoyage-désinfection (PND): zones (sale, propre), fréquences, produits, dilutions, responsables, enregistrements. Exemple (Exemple): dilution d’eau de Javel alimentaire selon notice pour obtenir une concentration utile; temps de contact 5 à 15 min selon produit — suivre la fiche, ne pas mélanger avec acides. Compatibilité: chlore et acides = dégagement dangereux — ne jamais mélanger les produits. Rinçage final à l’eau potable. Traçabilité: fiche journalière cochée. Exemple (Exemple): temps de contact 5–15 min selon fiche. Jamais mélanger chlore et acide. Rinçage eau potable. Fiche journalière cochée. 852/2004, flexibilité PME, GBPH. PND zones sale/propre. Exemple (Exemple): contact 10 min selon fiche. Interdiction mélange chlore+acide (dégagement). ATP/boîtes contact en industrie; liste de contrôle familiale comme socle. Après nettoyage, des contrôles de surface (si disponibles) complètent le plan produit. Exemple (Exemple): liste de contrôle avant/après/hebdo cochée sept jours de suite. Séquence type: enlever les déchets grossiers, laver avec détergent adapté aux matières grasses et aux poudres, rincer, puis désinfecter si le plan le prévoit, puis sécher ou laisser sécher. Les oxydants chlorés perdent du titre avec le temps et la chaleur: tu dates les dilutions. Exemple (nombres inventés pour l’exercice): liste de contrôle avant, après et hebdomadaire cochée sept jours de suite, avec initiales. En industrie on complète parfois par ATP ou boîtes contact; en micro-atelier la liste de contrôle observée et datée reste le socle. Ne jamais mélanger chlore et acide (dégagement nocif). Les produits se stockent étiquetés, séparés des denrées et des emballages propres.","quiz":[{"q":"Pourquoi désinfecter sur une table encore sale sert peu ?","choices":["Parce que la saleté protège les microbes","Parce que le désinfectant rend la table plus sale","Parce que la loi interdit toute table"],"correct":0,"why_ok":"La matière organique freine la désinfection.","why_ko":"Pas une histoire de table interdite ni de saleté créée."},{"q":"Quel ordre est le plus sage ?","choices":["Nettoyer, rincer, sécher, puis désinfecter selon notice","Désinfecter d’abord sur la croûte, puis ignorer le lavage","Mélanger tous les produits « pour plus d’effet »"],"correct":0,"why_ok":"Propre d’abord, chimie ensuite selon notice.","why_ko":"Mélanges et inversion d’ordre : mauvaises pratiques."},{"q":"Un torchon douteux pour « sécher »…","choices":["Remplace le lavage des mains","Garantit une stérilité hospitalière","Peut recontaminer la surface"],"correct":2,"why_ok":"Recontamination possible.","why_ko":"Ni stérilité ni substitut au lavage."},{"q":"Que doit préciser ton plan de nettoyage ?","choices":["Uniquement la couleur des murs","Qui, quoi, quand, avec quel produit","Seulement le prix du savon"],"correct":1,"why_ok":"Responsable, fréquence, produit.","why_ko":"Prix ou couleur ne font pas un plan."}],"activity":{"type":"order","prompt":"Remets l’ordre de nettoyage d’une bassine","steps":["Débarrasser les restes","Laver avec détergent","Rincer","Laisser sécher à l’abri"],"correct":[0,1,2,3],"hint1":"On enlève d’abord les restes.","hint2":"Le séchage clôt.","solution":"Débarrasser, laver, rincer, sécher."},"exercise":{"prompt":"Écris ta liste de contrôle de nettoyage d’une page (avant, après, hebdo). Colle-la au mur de l’atelier.","hint1":"Trois blocs suffisent.","hint2":"Laisse une case à cocher.","solution":"Exemple : Avant : table, outils, mains. Après : bassines, sol local, déchets. Hebdo : coins, grilles, stocks bas. Cases datées."}},{"title":"Hygiène personnelle","body":["Ton corps est un outil de production. Mains, ongles, cheveux, vêtements, bijoux, blessures: tout peut porter des microbes vers la poudre. L’hygiène personnelle n’est pas une leçon de morale, c’est une barrière technique.","Lavage des mains: eau claire, savon, toutes les faces, entre les doigts, sous les ongles, puis séchage propre. Moments clés: avant de commencer, après les toilettes, après avoir touché l’argent du marché, après s’être mouché, après avoir manipulé des déchets.","Porte un vêtement propre dédié à la production si tu peux. Attache les cheveux. Évite les bagues nombreuses sur la ligne de conditionnement. Couvre une plaie proprement et change de poste si la plaie coule.","Si quelqu’un t’aide (famille, amie), les mêmes règles s’appliquent. Une seule personne « pressée » peut annuler une matinée soignée. Prévois un savon de réserve. Un protocole affiché sans savon devient une décoration. Si tu es très malade (diarrhée, vomissements), tu reports le conditionnement. La règle se décide maintenant, calmement.","Les mains sont le premier outil qui touche le sachet. Un lavage raté « parce que pressée » peut annuler une matinée soignée. Prévois un savon de réserve: un protocole affiché sans savon devient une décoration. Si tu as une diarrhée ou des vomissements, tu reports le conditionnement. Cette règle se décide maintenant, calmement, avant le rush."],"prof":"Montre le lavage des mains comme tu montrerais une recette: lentement, une fois, devant ton aide. Chronomètre environ le temps d’une chanson courte. Garde du savon visible, pas caché. Si l’eau est limitée, organise quand même un rite clair: cuvette d’eau savonneuse renouvelée, puis rinçage dans une seconde cuvette d’eau plus claire réservée. Montre le lavage une fois par semaine au début, jusqu’à ce que le geste soit automatique pour toi et ton aide. La répétition bat le discours.","tip":"Place savon et essuie-mains propres avant de sortir la poudre.","simple":"Avant de pétrir la pâte à beignets pour la famille, tu te laves les mains. Ici c’est la même politesse, offerte à des clientes que tu ne verras peut-être pas. Avant le pétrissage familial, les mains passent au savon. Avant le sachet Baobab Bliss, même politesse offerte à la cliente inconnue.","plus":"Flore des mains: Staphylococcus, entérobactéries possibles. Bijoux: zones difficiles à laver. Plaies: Staphylococcus aureus et toxines dans certains aliments manipulés longuement. Formation du personnel: enregistrement simple (nom, date, règles lues). Santé: une personne très malade (diarrhée, vomissements) ne conditionne pas la poudre ce jour-là — règle écrite sans dramatiser. Flore des mains, bijoux, plaies, formation datée. 852/2004 annexe II ch. VIII. Codex hygiène générale. Tenue dédiée même simple (pagne ou t-shirt réservé atelier) diminue l’apport de poussière extérieure. Cheveux attachés. Ongles courts pour le conditionnement. Hygiène personnelle: lavage des mains aux moments clés, cheveux attachés, bijoux retirés au poste propre, plaies protégées, tenue dédiée même simple. Le règlement (CE) 852/2004 (annexe II, chapitre VIII) et le Codex d’hygiène générale cadrent ces exigences pour les opérateurs. Ongles courts au conditionnement. Formation datée d’une aide vaut mieux qu’un rappel oral oublié. Tu affiches les moments de lavage près du point d’eau et tu vérifies chaque matin que le savon n’est pas vide avant d’ouvrir le poste propre.","expert":"Règl. 852/2004 annexe II chapitre VIII (hygiène personnelle): propreté, tenues adaptées, lavage des mains, comportement. Codex Code d’usages en matière d’hygiène (principes généraux): même logique internationale. Atelier familial Burkina: adaptation pragmatique (eau, savon, tenue dédiée) documentée. Exemple (Exemple): protocole 20 secondes de frottement savonné + rinçage + séchage air ou papier à usage unique — durée indicative, à ancrer dans une routine. Audit interne mensuel: observation d’un lavage complet, sans noter de « faute » humiliante, avec rappel calme. Exemple (Exemple): 20 secondes de frottement savonné. Audit interne mensuel observation sans humiliation. 852/2004 annexe II ch. VIII. Codex GHPs. Exemple (Exemple): protocole 20 s savon + rinçage + séchage. Règle maladie digestive: report conditionnement. Formation aide datée. Bijoux minimisés sur ligne. L’hygiène personnelle se juge aussi par observation: ce n’est pas un critère 2073, c’est une barrière préalable. Exemple (Exemple): démonstration de lavage chronométrée avec une aide, savon plein. Le respect du protocole de lavage se vérifie par observation croisée une fois par semaine, sans humiliations, avec rappel calme et savon toujours disponible. Les moments clés de lavage incluent l’entrée au poste propre, le retour des toilettes, le passage du sale au propre, et après avoir touché le visage ou les déchets. Exemple (nombres inventés pour l’exercice): démonstration chronométrée avec une aide, savon plein, durée effective d’au moins le temps affiché sur ta consigne. Observation croisée une fois par semaine, sans humiliation: rappel calme et réassort du savon. Une maladie digestive aiguë exclut temporairement du conditionnement: tu l’écris dans le règlement intérieur simple de l’atelier pour éviter le débat le jour J.","quiz":[{"q":"Après avoir touché l’argent au marché, avant de reprendre la poudre, tu…","choices":["Continues sans pause","Te laves les mains selon le protocole","Essuies juste les doigts sur le pagne"],"correct":1,"why_ok":"L’argent est une surface très manipulée.","why_ko":"Pagne ou rien ne remplacent le lavage."},{"q":"Les mêmes règles pour une aide familiale ?","choices":["Oui, tout le monde sur la ligne suit les mêmes gestes","Non, la famille est automatiquement « propre »","Seulement si elle est payée"],"correct":0,"why_ok":"La poudre ne distingue pas qui touche.","why_ko":"Ni statut familial ni salaire n’exemptent."},{"q":"Une plaie qui coule sur la ligne de conditionnement…","choices":["Peut rester ouverte « pour aérer »","Doit être couverte et le poste adapté","Est un détail sans lien avec la poudre"],"correct":1,"why_ok":"Barrière physique et bon sens hygiène.","why_ko":"Aérer une plaie sur la ligne n’a pas de sens ici."},{"q":"Où placer le savon ?","choices":["Caché dans une chambre loin de l’atelier","Visible, près du point de lavage, avant de sortir la poudre","Uniquement chez la voisine"],"correct":1,"why_ok":"Disponible égale utilisé.","why_ko":"Loin ou chez la voisine, il ne sert pas au bon moment."}],"activity":{"type":"order","prompt":"Ordre d’un lavage des mains utile","steps":["Mouiller","Savonner toutes les faces","Rincer","Sécher proprement"],"correct":[0,1,2,3],"hint1":"On mouille d’abord.","hint2":"On sèche proprement à la fin.","solution":"Mouiller, savonner, rincer, sécher."},"exercise":{"prompt":"Forme une aide (ou toi-même en miroir) : une démonstration lente de lavage. Note la date et qui était présent.","hint1":"Compte tranquillement pendant le savonnage.","hint2":"Vérifie qu’il reste du savon.","solution":"Exemple : « 31 oct. 2026 : démonstration avec Aminata : savon plein : protocole affiché. »"}},{"title":"Critères microbiologiques et plans d’échantillonnage","body":["Un critère microbiologique dit quel microbe on cherche, sur quel aliment, avec quelles limites, à quel moment (fabrication ou durée de vie), et que faire si le résultat dépasse la limite. Un plan d’échantillonnage dit combien d’unités tu prélèves (n), combien peuvent être entre deux seuils (c), et quels sont les seuils m et M.","Ce langage d’ingénieure évite le « un seul pot magique ». Pour Baobab Bliss débutante, tu peux commencer par des contrôles simples (aspect, odeur, humidité ressentie) et planifier des analyses labo quand tu auras un volume ou un canal qui le demande. Tu n’inventes pas des seuils: tu copies ceux qui s’appliquent ou tu te fais conseiller.","Garde chaque bulletin d’analyse avec le numéro de lot. C’est la mémoire de ton atelier. Demande au labo l’unité (UFC par gramme, absence dans 25 g, µg kg) et la méthode. Sans cela, le chiffre flotte. Commence petit: un bulletin bien rangé enseigne plus que dix résultats éparpillés dans des messages.","Un bulletin sans lien au numéro de lot ne sert presque à rien. Demande au labo l’unité (UFC par gramme, absence dans 25 g, microgrammes par kilogramme) et la méthode."],"prof":"Ne te laisse pas impressionner par les lettres n, c, m, M. On les traduira avec un exemple simple. Aujourd’hui, retiens surtout: un seul prélèvement ne raconte pas tout un lot, et un beau chiffre sans numéro de lot ne sert à presque rien. Demande toujours au labo la méthode et l’unité. Les lettres n, c, m, M deviennent amies quand tu les racontes avec des tomates du panier. On les révise autant que tu veux.","tip":"Crée une pochette « bulletins labo » dès le premier essai payé.","simple":"Pour savoir si un panier de tomates est beau, tu n’en regardes pas qu’une seule au fond. Tu en observes plusieurs. L’échantillonnage, c’est cette sagesse mise en chiffres. Pour juger un panier, plusieurs tomates. Pour juger un lot, plusieurs unités. Même sagesse.","plus":"Deux familles de critères dans le règlement (CE) 2073/2005: sécurité des aliments (ex. absence de Salmonella dans une masse donnée) et hygiène des procédés (ex. E. coli en cours de fabrication). Interprétation: satisfaisant, acceptable (si c le permet), insatisfaisant. Actions: amélioration d’hygiène, retrait, investigation. Méthodes de référence ISO souvent citées. Critères sécurité vs hygiène de procédé (2073/2005). Interprétation satisfaisant / acceptable / insatisfaisant. Actions associées. Relation labo: devis clair, délai, limite de quantification, incertitude. Tu compares les bulletins dans le temps pour voir si ton hygiène s’améliore, pas seulement pour un tampon « conforme ». Les plans à trois classes (satisfaisant, acceptable, insatisfaisant) utilisent n (nombre d’unités), c (nombre d’unités tolérées entre m et M), m (seuil bas) et M (seuil haut). Tu relis chaque résultat à une action écrite: libérer, trier, ou bloquer. Exige devis, délai, limite de quantification et mention d’incertitude. Tu compares les bulletins dans le temps pour voir si l’hygiène s’améliore.","expert":"Plan en deux ou trois classes. Paramètres: n (nombre d’unités), c (nombre max d’unités entre m et M), m (seuil bas), M (seuil haut). Exemple hygiène de procédé (fruits prédécoupés RTE): E. coli n=5, c=2, m=100 UFC/g, M=1000 UFC/g. Si une unité > M ou plus de c unités > m: lot non satisfaisant pour ce critère de procédé. Exemple (Exemple) pédagogique pour une poudre: tu définis un plan interne « flore mésophile » n=5, c=2, m=10^4, M=10^5 UFC/g — valeurs d’école à valider avec un technicien labo, pas une copie aveugle. Aflatoxines: échantillonnage contaminants selon règlements dédiés (plans souvent plus lourds pour lots d’export). Conservation des preuves: 1 à plusieurs années selon exigence client. Exemple (Exemple) plan interne flore n=5 c=2 m=10^4 M=10^5 — validation technicien labo. Contaminants: plans souvent plus lourds à l’export. Plans deux/trois classes; n,c,m,M. Exemple E. coli RTE 5-2-100-1000. Exemple (Exemple) flore interne 5-2-10^4-10^5 à valider. Contaminants: échantillonnage souvent plus lourd. Archivage bulletins+lots. Cette leçon est le lieu naturel pour maîtriser n, c, m et M sans les confondre. Exemple (Exemple): brouillon de message labo demandant n et méthodes, sans seuil inventé. Dans 2073/2005, un critère de sécurité des aliments (par ex. absence de Salmonella dans 25 g) se lit autrement qu’un critère d’hygiène des procédés (souvent des limites m et M sur des indicateurs). Exemple (nombres inventés pour l’exercice): tu rédiges un message labo qui demande n, la matrice « poudre de fruit », les méthodes, et qui refuse de coller un seuil inventé « parce que le voisin l’a dit ». Pour les contaminants chimiques, l’échantillonnage est souvent plus lourd (agrégats, sous-échantillons): tu suis le guide contaminants plutôt qu’un seul sachet. Archivage: bulletin, méthodes, et numéro de lot ensemble, versionnés.","quiz":[{"q":"Que signifie à peu près « n » dans un plan ?","choices":["Le nombre d’unités prélevées","Le nom du microbe en latin","Le numéro de téléphone du labo"],"correct":0,"why_ok":"n compte les unités d’échantillon.","why_ko":"Ni latin ni téléphone."},{"q":"Pourquoi un seul pot « magique » ne suffit pas ?","choices":["Parce que les labos refusent toujours un pot","Parce qu’un lot peut être hétérogène","Parce que la poudre refuse d’être analysée"],"correct":1,"why_ok":"L’hétérogénéité exige plusieurs unités.","why_ko":"Les labos analysent des pots ; la poudre n’a pas de volonté."},{"q":"Que garder avec chaque bulletin ?","choices":["Rien, on jette après lecture","Uniquement le logo imprimé en grand","Le numéro de lot"],"correct":2,"why_ok":"Traçabilité bulletin-lot.","why_ko":"Logo seul ou destruction : inutiles."},{"q":"Les seuils européens…","choices":["S’inventent selon l’humeur du jour","Sont identiques pour tous les aliments du monde","Se lisent selon la denrée listée, sans invention"],"correct":2,"why_ok":"Lecture ciblée du texte.","why_ko":"Ni humeur ni universalité magique."}],"activity":{"type":"match","prompt":"Associe la lettre à l’idée","left":["n","c","m et M"],"right":["Nombre d’unités","Nombre toléré entre seuils","Seuils bas et haut"],"pairs":{"0":0,"1":1,"2":2},"hint1":"n comme nombre.","hint2":"m et M comme limites.","solution":"n unités ; c tolérance ; m et M seuils."},"exercise":{"prompt":"Écris à un labo (brouillon de message) : produit, lot, analyses souhaitées (par ex. moisissures, humidité), et demande n et méthodes. Ne l’envoie que si tu es prête.","hint1":"Reste factuelle.","hint2":"Pas de chiffre inventé dans le message.","solution":"Exemple : « Bonjour, je produis de la pulpe de baobab en poudre à Ouagadougou. Lot 21. Pouvez-vous proposer humidité, moisissures, et m’indiquer le plan n et les méthodes ? »"}}],"m3":[{"title":"Bases de nutrition sans promesse médicale","body":["La nutrition décrit ce que les aliments apportent: énergie, glucides, fibres, protéines, lipides, vitamines, minéraux, eau. Elle aide à composer des repas variés. Elle ne transforme pas un sachet en traitement. Baobab Bliss propose une pulpe pure. Tes clientes l’utilisent en boisson, en bouillie, en cuisine.","Tu peux parler de goût, de texture, d’usage. Tu ne dis pas que cela guérit, soigne ou remplace un avis de santé. Les besoins varient selon l’âge, l’activité, la grossesse, la maladie. Tu n’es pas tenue de calculer les besoins de chaque cliente. Tu restes honnête sur ce que contient ton produit quand tu auras des analyses.","Cette leçon pose le cadre: comprendre pour mieux étiqueter, jamais pour inventer une histoire médicale. Forme aussi ton aide à dire non poliment aux demandes de promesse médicale. Une seule personne qui promet trop peut abîmer la marque. Garde un carnet des questions clientes: elles guideront plus tard tes fiches d’information sobres.","La nutrition sur l’étiquette décrit des nutriments, pas un traitement. Tu refuses les phrases du type « soigne » ou « guérit ». Forme ton aide à dire non poliment. Garde un carnet des questions clientes: elles guideront des fiches d’information sobres."],"prof":"Quand une cliente te tire vers une promesse de santé, tu souris et tu reviens au concret: « C’est de la pulpe de baobab pure, à diluer ou à cuisiner. » Si elle insiste sur un effet corps, tu renvoies vers une professionnelle de santé. Ton rôle, c’est l’aliment net, pas le diagnostic. Ton script de trois phrases est un outil de survie commerciale honnête. Répète-le devant un miroir jusqu’à ce qu’il sonne naturel.","tip":"Apprends une phrase courte de recentrage et répète-la jusqu’à ce qu’elle soit naturelle.","simple":"Le mil nourrit, l’eau hydrate, le médicament soigne sous conseil. On ne demande pas au mil de remplacer le médicament. Pareil pour ta pulpe. Le mil nourrit. Le médicament soigne sous conseil. La pulpe reste dans la famille des aliments. Chacun sa place au repas.","plus":"Macros: glucides (4 kcal/g), protéines (4), lipides (9) — facteurs Atwater courants. Fibres: rôle satiété et transit (sans claim maladie). Micronutriments: besoins journaliers de référence (VNR) dans l’étiquetage UE. Communication: allégations de santé encadrées (règlement 1924/2006); hors liste autorisée et conditions, tu t’abstiens. Burkina: règles locales d’étiquetage et de publicité selon canal; prudence identique. Atwater 4/4/9. VNR. 1924/2006 et 432/2012. Positionnement aliment. Script oral. Cartographie orale vs écrite: ce que tu dis au marché doit pouvoir être imprimé sans honte. Enregistre les écarts dans le carnet commercial pour former les aides. L’étiquette est un contrat de loyauté avec la cliente. Chaque mot doit pouvoir être expliqué calmement devant un contrôleur ou une voisine curieuse. La cohérence entre oral, WhatsApp et sachet évite les doubles discours qui détruisent la confiance plus vite qu’un défaut de texture. Chaque mot du sachet doit pouvoir être expliqué calmement devant un contrôleur ou une voisine curieuse. La cohérence entre oral, message et sachet évite les doubles discours. Tu préfères une phrase courte vraie à une longue promesse floue.","expert":"Règl. (CE) 1924/2006: allégation de santé = relation entre denrée et santé; allégation de réduction d’un facteur de maladie (article 14): régime d’autorisation spécifique. Liste d’allégations autorisées: règl. (UE) 432/2012 et modifications. Interdictions: allégations thérapeutiques sur denrées (cadre médicaments distinct). Pour Baobab Bliss: positionnement « aliment »; éventuelle allégation nutritionnelle (« source de vitamine C ») seulement si seuils et analyses OK. Exemple (Exemple): phrase refusée « guérit l’anémie »; phrase acceptable « pulpe de baobab 100 %, à diluer dans l’eau froide ». Formation équipe de vente orale: script de 3 phrases. Exemple (Exemple): refuser « guérit l’anémie »; garder « 100 %, diluer ». Formation équipe 3 phrases. Atwater; VNR; 1924/2006; 432/2012. Frontière aliment/médicament. Exemple (Exemple): script 3 phrases. Interdiction thérapeutique sur denrée. BF: vérifier pub locale selon canal. Chaîne d’information: dénomination vers ingrédients vers allergènes vers net vers dates vers conservation vers exploitant vers nutrition vers allégations (si et seulement si). Exemple (Exemple): audit croisé de 10 phrases WhatsApp classées garde/retire en 20 minutes d’équipe. Textes: 1169/2011 art. 9, 13, 21, 30; 1924/2006; 432/2012; contrôles loyauté (DGCCRF en France). Exemple (Exemple): maquette v1.2 avec portion 12 g, tableau « à mesurer », DDM provisoire clairement marquée comme à valider par suivi sensoriel 3 mois. Exemple (Exemple): script oral de trois phrases récité sans promesse médicale. Le cadre européen sépare information nutritionnelle (règlement (UE) 1169/2011) et allégations de santé ou nutritionnelles (règlement (CE) 1924/2006). Une allégation de santé non autorisée expose l’opérateur; la DGCCRF en France et les autorités locales ailleurs contrôlent loyauté et tromperie. Exemple (nombres inventés pour l’exercice): maquette avec portion 12 g, tableau nutritionnel marqué « à mesurer », DDM provisoire clairement « à valider par suivi », et script oral de trois phrases sans promesse médicale. Tu documentes la source de chaque chiffre nutritionnel (bulletin ou base reconnue) avant impression.","quiz":[{"q":"Que peux-tu dire naturellement sur ton sachet ?","choices":["Goût, usage culinaire, composition honnête","Qu’il remplace un traitement","Qu’il guérit une longue liste de maux"],"correct":0,"why_ok":"Communication alimentaire calme.","why_ko":"Pas de rôle médicament."},{"q":"La nutrition sert surtout à…","choices":["Éviter toute étiquette","Comprendre les apports pour mieux informer","Transformer chaque sachet en ordonnance"],"correct":1,"why_ok":"Comprendre pour informer.","why_ko":"Ni ordonnance ni absence d’étiquette."},{"q":"Si une cliente demande un effet sur une maladie, tu…","choices":["Promets un résultat en sept jours","Inventes un dosage « guérisseur »","Recentres sur l’aliment et renvoies vers une pro de santé"],"correct":2,"why_ok":"Limite claire de ton rôle.","why_ko":"Dosage inventé ou promesse : hors cadre."},{"q":"Les besoins nutritionnels…","choices":["Se lisent sur le logo seul","Varient selon les personnes","Sont identiques pour tous les humains à tout âge"],"correct":1,"why_ok":"Variabilité réelle.","why_ko":"Pas d’uniformité magique ni de logo suffisant."}],"activity":{"type":"tf","prompt":"Vrai ou faux : nutrition et promesse","statements":[{"t":"Tu peux décrire l’usage en boisson sans promesse médicale.","truth":true,"why":"Usage culinaire OK."},{"t":"Tu peux écrire que la pulpe guérit une maladie.","truth":false,"why":"Interdit dans ce cours."},{"t":"Les analyses guideront les chiffres nutritionnels futurs.","truth":true,"why":"Pas d’invention."}]},"exercise":{"prompt":"Écris ton script oral de trois phrases (présentation produit + usage + limite santé). Apprends-le à voix haute.","hint1":"Phrase 3 égale recentrage.","hint2":"Pas de mot maladie.","solution":"Exemple : « Voici la pulpe Baobab Bliss, 100 % pain de singe. Tu la dilues dans l’eau ou tu la mets en bouillie. Pour toute question de santé, vois une professionnelle : moi je vends un aliment net. »"}},{"title":"La déclaration nutritionnelle","body":["La déclaration nutritionnelle est le tableau qui indique l’énergie et les nutriments pour 100 g (et parfois par portion). En Europe, un format légal existe. Au Burkina, tu suivras les règles du canal où tu vends, tout en visant une information claire. Sans analyse, tu ne remplis pas le tableau avec des chiffres inventés.","Tu peux préparer la structure vide et la compléter quand le bulletin arrive. Les valeurs se calculent parfois à partir de données de composition, mais pour un produit artisanal variable, la mesure sur ton lot est plus honnête. La littérature donne des ordres de grandeur, pas ton étiquette finale.","Si tu indiques une portion (par exemple une cuillère), tu définis cette portion clairement pour que la cliente compare juste. Quand le bulletin arrivera, vérifie que la base (pour 100 g) et l’humidité du lot correspondent à ce que tu vends. Un écart de process peut décaler les chiffres.","Si tu indiques le sel, souviens-toi qu’il se calcule souvent à partir du sodium. Demande au labo comment ils l’expriment. Vérifie que la base (pour 100 g) et l’humidité du lot correspondent à ce que tu vends. Si tu indiques le sel, souviens-toi qu’il se calcule souvent à partir du sodium: demande au labo comment ils l’expriment."],"prof":"Fais un tableau brouillon sur papier: lignes énergie, matières grasses, glucides, fibres, protéines, sel. Colonnes pour 100 g et pour ta portion. Laisse les cases vides avec « à mesurer ». Ce brouillon te rend déjà plus professionnelle qu’un chiffre fantaisie. Ton tableau vide daté est déjà un acte de qualité. Beaucoup d’étiquettes mentent; la tienne attendra juste. Sur cette leçon, je te guide hors ligne : une idée, un geste, une note. Pas de note scolaire, juste ton atelier.","tip":"Décide dès maintenant le poids de ta portion typique en grammes, au ressenti cuillère, puis pèse-la une fois.","simple":"Le bulletin de notes à l’école: tu n’inventes pas une moyenne. Tu attends les vraies notes. Le tableau nutritionnel attend de vraies mesures. Le bulletin scolaire attend les vraies notes. Ton tableau attend les vraies mesures. Même dignité. Une image du quotidien suffit pour débloquer l’idée avant de revenir aux cartes.","plus":"Règl. (UE) 1169/2011 art. 30: contenu obligatoire de la déclaration (énergie, lipides, saturés, glucides, sucres, protéines, sel); volontaires: fibres, mono-insaturés, etc. Conversion énergie: facteurs Atwater. Tolérances d’étiquetage: guide européen sur les incertitudes. Portion: définie par l’exploitant, réaliste. Arrondi: règles d’annexe. Art. 30 1169/2011. kJ/kcal. Sel=Na×2,5. Fibres méthode reconnue. Tolérances guide UE. Incertitudes et arrondis: le labo peut t’expliquer la tolérance d’étiquetage. Ne sur-interprète pas un écart de 0,1 g comme une fraude si la méthode le permet. L’étiquette est un contrat de loyauté avec la cliente, dans le contexte précis de cette leçon. Chaque mot doit pouvoir être expliqué calmement devant un contrôleur ou une voisine curieuse, dans le contexte précis de cette leçon. La cohérence entre oral, WhatsApp et sachet évite les doubles discours qui détruisent la confiance plus vite qu’un défaut de texture, dans le contexte précis de cette leçon. Quand les analyses arriveront, tu n’auras qu’à remplir des cases déjà prévues: le travail de structure est un investissement de temps présent.","expert":"Déclaration obligatoire UE pour la plupart des denrées préemballées (exemptions limitées). Unités: kJ et kcal; g de nutriments. Sel = sodium × 2,5. Fibres: méthode AOAC ou équivalent reconnu. Exemple (Exemple): portion 10 g; si glucides analysés 75 g/100 g ⇒ 7,5 g par portion. Affichage: champ visuel, taille de caractère minimale (hauteur x selon surface). Allégation nutritionnelle ⇒ déclaration obligatoire même si exemption ailleurs. Pour Olga hors UE: aligner sur exigences burkinabè du circuit choisi; si export UE, appliquer 1169/2011 au produit mis sur ce marché. Exemple (Exemple): 10 g portion, 75 g glucides/100 g ⇒ 7,5 g/portion. Export UE: appliquer le règlement au marché cible. Art. 30–34 1169/2011. Sel=Na×2,5. Fibres. Exemple (Exemple): portion 12 g. Champ visuel et taille x. Allégation ⇒ déclaration obligatoire. Export: règles du marché de mise en vente. Chaîne d’information: dénomination vers ingrédients vers allergènes vers net vers dates vers conservation vers exploitant vers nutrition vers allégations (si et seulement si), dans le contexte précis de cette leçon. Exemple (Exemple): audit croisé de 10 phrases WhatsApp classées garde/retire en 20 minutes d’équipe, dans le contexte précis de cette leçon. Textes: 1169/2011 art. 9, 13, 21, 30; 1924/2006; 432/2012; contrôles loyauté (DGCCRF en France), dans le contexte précis de cette leçon. Exemple (Exemple): maquette v1.2 avec portion 12 g, tableau « à mesurer », DDM provisoire clairement marquée comme à valider par suivi sensoriel 3 mois, dans le contexte précis de cette leçon. Exemple (Exemple): portion pesée à 12 g, tableau vide daté « à mesurer ».","quiz":[{"q":"Sans bulletin d’analyse, tu…","choices":["Remplis avec des chiffres « jolis »","Copies le tableau d’un soda","Laisses les cases « à mesurer » plutôt qu’inventer"],"correct":2,"why_ok":"Honnêteté d’abord.","why_ko":"Invention ou copie hors sujet."},{"q":"Le tableau se présente souvent pour…","choices":["Une année entière de ventes","100 g, et parfois aussi par portion définie","Le poids du carton d’expédition seulement"],"correct":1,"why_ok":"Base 100 g plus portion claire.","why_ko":"Ni année de ventes ni carton seul."},{"q":"Les fourchettes de la littérature…","choices":["Doivent être cachées à tout jamais","Remplacent toujours le labo","Aident à comprendre, pas à remplacer ton analyse"],"correct":2,"why_ok":"Repères, pas étiquette finale.","why_ko":"Ni remplacement total ni secret absolu pédagogique."},{"q":"Pourquoi peser ta cuillère portion ?","choices":["Pour décorer la balance","Pour éviter d’écrire la dénomination","Pour que la colonne « portion » ait un sens"],"correct":2,"why_ok":"Portion réelle égale comparaison juste.","why_ko":"Ni décor ni substitut de dénomination."}],"activity":{"type":"calc","prompt":"Pèse ta portion typique (cuillère rase de poudre)","fields":[{"id":"portion","label":"Poids de ta portion ( g)"}],"note":"Un seul chiffre réel suffit pour commencer. Tu pourras calculer les nutriments par portion après analyse.","tip":"Même cuillère que celle que tu recommandes."},"exercise":{"prompt":"Dessine le tableau nutritionnel vide sur une feuille (lignes + colonnes 100 g et portion). Écris « à mesurer » dans chaque case chiffre.","hint1":"Inclus énergie et nutriments de base.","hint2":"Ajoute le poids de portion choisi.","solution":"Exemple : tableau avec portion 12 g, toutes cases « à mesurer », daté."}},{"title":"Mentions obligatoires sur un sachet","body":["Un sachet sérieux porte des mentions qui permettent à la cliente de savoir ce qu’elle achète et à qui parler. En Europe, une liste légale existe. Chez toi, même avant l’export, tu gagnes à viser cette clarté.","Base utile: dénomination (pulpe de baobab ou pain de singe), liste des ingrédients (ici un seul: pulpe), quantité nette, nom et adresse de l’exploitante, lot, date de durabilité, conseils de conservation et d’usage.","La lisibilité compte: contraste, taille suffisante, pas d’information essentielle cachée sous un pli. La langue doit être comprise par tes clientes (français à Ouagadougou).","Tu prépares une maquette papier avant d’imprimer. Tu fais relire par une amie qui ne connaît pas le produit: ce qu’elle ne trouve pas doit être mieux placé. Décide avec Rachid ce qui apparaît selon le canal: sachet remis en main, page web publique, message WhatsApp. La confidentialité du domicile peut différer du besoin de contact cliente. La date de durabilité doit reposer sur une idée de stabilité (même simple au début), pas sur un chiffre au hasard.","Les canaux changent le besoin de contact: sachet remis en main, page publique, message. La confidentialité du domicile peut différer du besoin d’un contact cliente. La date de durabilité repose sur une idée de stabilité, même simple au début, pas sur un chiffre au hasard."],"prof":"Pour l’instant, ton nom et ton quartier peuvent rester privés sur une version web publique, mais sur le sachet que tu remets en main propre, la cliente doit pouvoir te joindre. Décide avec Rachid ce qui apparaît selon le canal. Sur la maquette de cours, on travaillera avec des champs clairs sans exposer inutilement. Le test à bout de bras sauve des impressions inutiles. Si tu ne lis pas le lot à distance raisonnable, la cliente non plus.","tip":"Fais une maquette A4 pliée façon sachet et teste-la à bout de bras.","simple":"Une lettre sans adresse n’arrive pas. Un sachet sans nom lisible laisse la cliente seule si elle a une question. Les mentions sont l’adresse de ton produit. Un sachet sans contact clair laisse la cliente seule. Les mentions sont le chemin du retour.","plus":"Règl. 1169/2011 art. 9: liste des mentions obligatoires (dénomination, ingrédients, allergènes, quantité nette, DDM ou DLC, conservation, nom/adresse exploitant, origine si requis, mode d’emploi si besoin, titre alcoométrique si concerné, déclar
