ation nutritionnelle). Art. 13: présentation, lisibilité. Denrées non préemballées: règles nationales. Burkina: vérifier exigences d’étiquetage du circuit (marché, boutique, export). 9 et 13 1169/2011. DDM vs DLC. Lot et 178/2002. Métrologie du net. Cohérence multi-canal: même dénomination sur sachet, statut WhatsApp et éventuelle page web. Les écarts créent la confusion et les soupçons de loyauté. Mentions typiques à prévoir selon le marché: dénomination de vente, quantité nette, nom et adresse de l’exploitante (selon canal), lot, date de durabilité, liste d’ingrédients si besoin, et mode d’emploi simple. Le règlement (UE) 1169/2011 articles 9 et 13 cadrent le obligatoire et la lisibilité pour l’UE. DDM et DLC ne se confondent pas. Métrologie du net: la balance engage. Même dénomination sur sachet et message.","expert":"DDM (« à consommer de préférence avant ») vs DLC (« à consommer jusqu’au »): poudre sèche stable plutôt DDM si justifiée par stabilité; justification par études de vieillissement (couleur, aw, microbes, sensoriel). Lot: code permettant la traçabilité amont-aval (règl. 178/2002). Quantité nette: unités légales, contrôle métrologique selon pays. Exemple (Exemple): dénomination « Pulpe de baobab en poudre (pain de singe) »; ingrédient « pulpe de baobab 100 % »; net 200 g; DDM 12 mois après conditionnement sous réserve d’étude; conservation « au sec, à l’abri de la lumière, bien refermé ». Ne pas ajouter de due date fantaisiste sur un reçu client hors étiquette produit (consigne Olga ailleurs). Exemple (Exemple): DDM 12 mois sous réserve d’étude; conservation au sec, lumière limitée, bien refermé. Art. 9 et 13. DDM justifiée par stabilité. Lot/178/2002. Exemple (Exemple): net 200 g; DDM 12 mois sous étude. Métrologie balance. Confidentialité adresse selon canal. Textes: 1169/2011 art. En mentions obligatoires, chaque maillon de la chaîne doit être lisible sur le sachet. Exemple (Exemple): test des dix secondes, lot trop petit, maquette corrigée. Pour un monoproduit « pulpe de baobab en poudre », la liste d’ingrédients peut se réduire à la dénomination si aucun ajout. Le lot assure la traçabilité avec le règlement (CE) 178/2002. Exemple (nombres inventés pour l’exercice): test des dix secondes — une lectrice doit trouver dénomination, net et lot sans plisser les yeux; si le lot est illisible, tu grossis la police avant tirage. La taille minimale des caractères et le contraste sont des exigences de loyauté pratique autant que de texte réglementaire. Adresse complète sur sachet remis en main peut différer d’une identité web publique: tu choisis consciemment.","quiz":[{"q":"Parmi ces éléments, lequel fait partie des mentions de base ?","choices":["Uniquement un slogan publicitaire","Uniquement un dessin sans texte","Dénomination, quantité nette, identité de l’exploitante"],"correct":2,"why_ok":"Mentions d’identification du produit et de l’exploitante.","why_ko":"Dessin seul ou slogan seul ne suffisent pas."},{"q":"Pourquoi faire relire la maquette par une amie ?","choices":["Pour remplacer toute règle d’étiquetage","Pour tester si l’essentiel se trouve facilement","Pour inventer des chiffres ensemble"],"correct":1,"why_ok":"Test de lisibilité réelle.","why_ko":"Ni remplacement légal ni invention."},{"q":"La langue sur le sachet à Ouagadougou devrait être…","choices":["Comprise par tes clientes (souvent le français ici)","Absente pour faire « moderne »","Uniquement une langue étrangère illisible"],"correct":0,"why_ok":"Compréhension d’abord.","why_ko":"Illisible ou vide : mauvais service."},{"q":"Le numéro de lot sert à…","choices":["Décorer sans sens","Remplacer la dénomination","Retrouver l’histoire du produit si besoin"],"correct":2,"why_ok":"Traçabilité.","why_ko":"Pas un ornement ni un substitut de nom."}],"activity":{"type":"label","prompt":"Place les mentions sur le schéma de sachet","labels":["Dénomination","Quantité nette","Lot et date","Nom exploitante"],"correct":{"0":"Face avant","1":"Face avant","2":"Face arrière","3":"Face arrière"},"hint1":"L’avant attire l’œil sur le nom et le poids.","hint2":"L’arrière porte le détail et la trace.","solution":"Avant : dénomination et quantité. Arrière : lot, date, exploitante (schéma pédagogique).","svg":"<svg viewBox=\"0 0 320 140\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<rect x=\"20\" y=\"20\" width=\"120\" height=\"100\" rx=\"8\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"80\" y=\"55\" text-anchor=\"middle\" font-size=\"11\">Face avant</text>\n<text x=\"80\" y=\"75\" text-anchor=\"middle\" font-size=\"9\">nom produit</text>\n<rect x=\"180\" y=\"20\" width=\"120\" height=\"100\" rx=\"8\" fill=\"#e8f8ef\" stroke=\"#0a7a5a\"/>\n<text x=\"240\" y=\"55\" text-anchor=\"middle\" font-size=\"11\">Face arrière</text>\n<text x=\"240\" y=\"75\" text-anchor=\"middle\" font-size=\"9\">infos</text>\n</svg>"},"exercise":{"prompt":"Dessine les deux faces de ton sachet et place au crayon les mentions de base. Fais relire à une personne. Note ce qu’elle n’a pas trouvé en 10 secondes.","hint1":"Chronomètre réel.","hint2":"Corrige l’emplacement ensuite.","solution":"Exemple : « Elle n’a pas trouvé le lot (trop petit). J’agrandis et je contraste. »"}},{"title":"Allergènes et traces","body":["Certains aliments provoquent des allergies sévères chez des personnes sensibles. En Europe, une liste précise de substances doit être mise en évidence dans la liste d’ingrédients quand elles sont volontairement présentes.","La pulpe de baobab seule n’appartient pas à cette liste classique. En revanche, si tu partages un atelier avec des arachides, du lait en poudre, du sésame ou des fruits à coque, des traces croisées peuvent exister.","Tu gères d’abord la séparation physique: horaires, outils, nettoyage, stockage. Ensuite seulement tu songes à une phrase de précaution honnête si un croisement réel encore possible demeure. Tu n’écris pas « peut contenir » au hasard pour te protéger sans geste derrière.","Si tu n’as aucun autre allergène dans ton espace, dis simplement la vérité: un seul ingrédient, pulpe de baobab. Les quatorze groupes majeurs européens méritent une affiche interne si tu manipules plusieurs aliments. Même hors export, cela structure ton lavage. Le sur-signalement « peut contenir tout » fatigue les personnes allergiques et affaiblit la confiance. Sois précise.","Les quatorze allergènes majeurs de la liste européenne méritent une affiche interne si tu manipules plusieurs aliments. Même hors export, cela structure le lavage. Le sur-signalement « peut contenir tout » fatigue les personnes concernées et affaiblit la confiance. Sois précise."],"prof":"Fais le tour de ton espace mentalement: qu’est-ce qui entre encore ici ? Beurre de cacahuète familial, snack aux noix, lait ? Si oui, on organise le temps (baobab le matin, autres aliments le soir) et le lavage. La phrase d’étiquette vient après les gestes, jamais à la place. Fais le tour du local une fois par mois: de nouveaux snacks familiaux apparaissent sans prévenir. Mets à jour ta liste.","tip":"Liste sur une feuille tous les autres aliments qui passent dans le même local.","simple":"Sur une planche à découper, l’odeur d’un poisson reste parfois. Les allergènes aussi « restent » sur outils et tables. On lave pour vraiment changer de chapitre. La planche à poisson garde une mémoire. Les tables aussi. Le lavage change vraiment de chapitre.","plus":"Annexe II du règl. 1169/2011: 14 groupes (gluten de certaines céréales, crustacés, œufs, poisson, arachide, soja, lait, fruits à coque, céleri, moutarde, sésame, sulfites au-delà d’un seuil, lupin, mollusques). Mise en évidence typographique. Contaminations croisées: pas d’obligation UE uniforme de mention « peut contenir », mais responsabilité de l’opérateur et bonnes pratiques; certaines approches nationales et guides professionnels existent. Prévention > phrase. Annexe II 1169/2011. Art. 21 mise en évidence. Sulfites seuil 10 mg/kg. Guides croisement. Outils dédiés couleur différente pour allergènes majeurs si tu diversifies un jour. Aujourd’hui, la discipline de liste mensuelle suffit souvent. Annexe II du règlement (UE) 1169/2011 liste les substances à déclaration obligatoire (dont arachide, fruits à coque, gluten, lait, sulfites au-dessus du seuil). L’article 21 exige une mise en évidence dans la liste. Les sulfites ont un seuil classique à 10 mg/kg. Une liste mensuelle datée des allergènes présents dans le local réduit les oublis quand un snack familial apparaît sans prévenir.","expert":"Art. 21 1169/2011: modalités de mise en évidence. Absence de liste d’ingrédients ⇒ « contient » + allergène. Sulfites: seuil 10 mg/kg ou 10 mg/l. Fruits à coque: liste nommée (amande, noisette, noix, etc.). Exemple (Exemple): atelier qui traite arachides le lundi et baobab le mardi sans nettoyage validé ⇒ point à surveiller croisé; avec nettoyage documenté et outils dédiés ⇒ point à surveiller réduit. Validation: inspection visuelle + test protéique commercial si disponible. Étiquette: éviter les mentions « peut contenir » décoratives qui perdent leur sens pour les allergiques (sur-signalement). Exemple (Exemple): arachides lundi / baobab mardi sans nettoyage = croisement; avec nettoyage documenté = possibilité réduite. Annexe II (14 groupes). 21. Sulfites 10 mg/kg. Exemple (Exemple): arachide matin / baobab après-midi sans lavage = croisement. Sur-signalement à éviter. Validation nettoyage. Textes: 1169/2011 art. En allergènes, le maillon croisement se gère d’abord par lavage, ensuite par phrase. Exemple (Exemple): arachides cantonnées au soir, bassine dédiée, liste affichée. Une liste mensuelle des allergènes présents dans le local, datée et affichée, réduit les oublis quand un nouveau snack familial apparaît sans prévenir. La pulpe de baobab seule n’est pas l’un des allergènes de l’annexe II, mais le croisement compte si tu manipules arachides ou autres allergènes dans la même pièce. Exemple (nombres inventés pour l’exercice): arachides cantonnées au soir, bassine dédiée, liste affichée. Prévention: outils dédiés, ordre de production du moins concerné au plus concerné, nettoyage validé entre les deux. Une phrase « peut contenir » se justifie par une analyse de croisement réelle, pas par une peur vague. Les guides d’étiquetage aident à rédiger sans diluer le signal pour les personnes concernées.","quiz":[{"q":"La pulpe de baobab seule…","choices":["N’est pas l’un des allergènes majeurs listés en Europe","Doit toujours être écrite en rouge médical","Exige automatiquement la mention « contient gluten »"],"correct":0,"why_ok":"Pas dans la liste des 14 groupes majeurs.","why_ko":"Ni rouge médical obligatoire ni gluten inventé."},{"q":"Que faire d’abord en cas d’autres allergènes dans le local ?","choices":["Séparer dans le temps et nettoyer pour de vrai","Mélanger les outils pour aller plus vite","Écrire une phrase au hasard sans changer les gestes"],"correct":0,"why_ok":"Gestes d’abord.","why_ko":"Phrase vide ou mélange : inutiles."},{"q":"La mention « peut contenir »…","choices":["Doit reposer sur une réalité de croisement, pas sur le hasard","Est obligatoire sur chaque fruit entier au verger","Remplace tout nettoyage"],"correct":0,"why_ok":"Honnêteté liée aux pratiques.","why_ko":"Ni substitut de lavage ni règle verger."},{"q":"Pourquoi lister les autres aliments du local ?","choices":["Pour remplir l’étiquette de publicité","Pour augmenter le prix automatiquement","Pour voir les croisements possibles"],"correct":2,"why_ok":"Cartographie des croisements.","why_ko":"Ni pub ni prix magique."}],"activity":{"type":"case","prompt":"Cas croisement","story":"Tu emballes du baobab sur une table où tu as écrasé des arachides le matin, sans lavage.","q":"Que fais-tu avant le conditionnement ?","choices":["Tu continues en te disant que le baobab « efface » tout","Tu ajoutes des arachides dans le sachet pour uniformiser","Tu nettoies à fond et tu reports si ce n’est pas prêt"],"correct":2,"why_ok":"Nettoyage réel avant reprise.","why_ko":"Ni magie baobab ni ajout d’arachides."},"exercise":{"prompt":"Dresse la liste des allergènes majeurs éventuels présents dans ton foyer-atelier. En face, écris le geste de séparation (horaire, outil dédié, absence).","hint1":"Sois honnête.","hint2":"Une ligne par allergène réel.","solution":"Exemple : « Arachides familial : soir seulement, bassine dédiée. Lait en poudre : autre armoire. Sésame : absent. »"}},{"title":"Allégations : ce que tu ne dis pas","body":["Une allégation nutritionnelle parle de la teneur (« source de… », « riche en… », « sans matières grasses »). Une allégation de santé parle d’un effet sur l’organisme. Les deux sont encadrées là où le droit européen s’applique, et restent délicates partout. Sans analyse et sans respect des seuils, tu n’écris pas « riche en vitamine C ».","Sans autorisation, tu n’écris pas qu’un nutriment « renforce » quoi que ce soit. Ce qui reste toujours possible: la vérité simple sur la composition (100 % pulpe), l’origine, le mode d’emploi, le goût décrit sans exagération. Forme ton oreille: chaque adjectif sur le sachet doit pouvoir être défendu.","Si tu ne peux pas l’expliquer calmement, retire-le. Colle près de la zone d’emballage la liste « je garde ou je retire ». Mets à jour quand une nouvelle phrase apparaît sur WhatsApp. Les publicités orales au marché suivent la même sobriété que le sachet.","La cliente entend une promesse comme une étiquette. Affiche près de l’emballage la liste « je garde ou je retire ». Mets à jour quand une nouvelle phrase apparaît sur un message."],"prof":"On va faire un jeu: je te propose des phrases, tu dis « je garde » ou « je retire ». « Pulpe pure »: je garde. « Boost immunitaire puissant »: je retire. « Aide à guérir »: je retire. « À diluer dans l’eau froide »: je garde. Entraîne-toi jusqu’à ce que le réflexe soit automatique. Le jeu « je garde ou je retire » peut devenir un rituel de cinq minutes avant chaque session d’emballage. Ça maintient le réflexe.","tip":"Barre au crayon rouge mental tout verbe d’effet sur le corps dans ta maquette.","simple":"Au marché, promettre que des tomates « guérissent la vue » ferait sourire ou fâcher. Mieux vaut dire: tomates fraîches du jardin. Même sobriété pour ton baobab. Des tomates « qui guérissent la vue » font sourire. Des phrases sobres font revenir. Choisis le second commerce.","plus":"Tu relis la limite critique à un enregistrement que tu peux remplir chaque lot. Si la surveillance est trop lourde, tu simplifies la ligne plutôt que d’inventer des coches. Baobab Bliss avance avec des limites tenues, pas un tableau décoratif. Tu dates chaque dépassement et l’action corrective réellement faite. Une allégation nutritionnelle parle d’un nutriment (« source de… », « riche en… »); une allégation de santé relie un nutriment à une fonction du corps. En Europe, le règlement (CE) 1924/2006 exige des allégations autorisées et des conditions d’emploi. Hors UE, la loyauté locale interdit aussi la tromperie. Si tu ne peux pas prouver, tu retires la phrase. Baobab Bliss avance avec des limites tenues. Tu dates chaque retrait de formulation publicitaire. Tu tiens un registre des formulations publicitaires retirées avec la date et la raison. Une phrase orale au marché suit la même règle que le texte imprimé: si elle n’est pas prouvable, tu ne la dis pas.","expert":"CCP ou limite opérationnelle en atelier artisanal: paramètre, cible, limite critique, fréquence, responsabilité, action corrective écrite. Exemple (nombres inventés pour l’exercice): humidité cible 8 %, limite haute 10 %, mesure chaque lot de mouture, action = resséchage et nouveau contrôle. Tu sépares hypothèse et mesure sur la fiche signée. Une seule valeur hors série ne prouve pas un procédé incapable: vérifie étalonnage et prélèvement avant de conclure. Le dossier client ne porte pas d’identifiant interne de leçon. Le règlement (CE) 1924/2006 distingue allégations nutritionnelles (annexe) et allégations de santé (listes autorisées après évaluation). Une allégation thérapeutique (« guérit », « traite ») sort du cadre alimentaire. Exemple (nombres inventés pour l’exercice): tu remplaces « renforce l’immunité » par une description sensorielle et d’usage culinaire (« acidulée, pour bouillies et jus »), et tu archives la version retirée. Conditions d’emploi: souvent un seuil minimal du nutriment par 100 g ou par portion. Sans bulletin aligné, tu n’imprimes pas « source de vitamine C ». La surveillance des messages (sachet, oral, statut) fait partie du plan de maîtrise de l’information, pas d’un à-côté marketing. Exemple (nombres inventés pour l’exercice): audit blanc de dix messages WhatsApp; trois phrases d’allure santé retirées le même jour; archive avant/après. Tu croises aussi le règlement local de loyauté: même hors Union européenne, tromper sur un effet du produit expose l’atelier. Une allégation conditionnelle (« contribue à… ») n’est pas un refuge si la condition d’emploi ou l’autorisation manquent. Tu complètes par une action concrète mesurable avant la fin de la semaine, notée près de le stock.","quiz":[{"q":"« Riche en vitamine C » sans analyse ni seuil…","choices":["S’écrit seulement en gros caractères","Ne s’écrit pas","S’écrit si le goût est acide"],"correct":1,"why_ok":"Il faut base analytique et conditions.","why_ko":"Ni goût ni taille de police ne remplacent les conditions."},{"q":"Quelle phrase est la plus sûre ici ?","choices":["Boost santé miracle dès demain","Pulpe de baobab 100 %, à diluer dans l’eau","Guérit la fatigue en trois jours"],"correct":1,"why_ok":"Composition et usage.","why_ko":"Miracle et guérison : hors cadre."},{"q":"Les allégations de santé en Europe…","choices":["Sont libres dès qu’on sourit","Sont encadrées et souvent soumises à autorisation","Concernent seulement les emballages en bois"],"correct":1,"why_ok":"Cadre réglementaire strict.","why_ko":"Ni liberté totale ni contrainte bois."},{"q":"Sur les réseaux sociaux, une promesse liée au produit…","choices":["Peut tout inventer car « ce n’est pas l’étiquette »","Doit être écrite en anglais seulement","Doit rester aussi sage que sur le sachet"],"correct":2,"why_ok":"Même exigence de loyauté.","why_ko":"Ni passe-droit ni obligation d’anglais."}],"activity":{"type":"tf","prompt":"Je garde ou je retire (vrai égale je garde)","statements":[{"t":"« Pulpe de baobab 100 % »","truth":true,"why":"Composition vraie."},{"t":"« Guérit les articulations »","truth":false,"why":"Allégation médicale ou de santé non maîtrisée : à retirer."},{"t":"« À conserver au sec »","truth":true,"why":"Conseil d’usage légitime."}]},"exercise":{"prompt":"Fais deux colonnes sur une feuille : « je garde » et « je retire ». Place-y huit phrases que tu as déjà dites ou entendu dire sur le pain de singe.","hint1":"Inclus des phrases de voisines.","hint2":"Sois sévère sur la colonne retirer.","solution":"Exemple garde : 100 %, Ouaga, diluer, goût acidulé. Retirer : guérit, boost immunitaire, remplace le médicament, miracle."}},{"title":"Maquette complète Baobab Bliss","body":["Tu rassemblés maintenant les pièces: dénomination, ingrédient unique, quantité nette, lot, date, conservation, usage, nom et adresse de l’exploitante, tableau nutritionnel en attente d’analyse, aucune allégation hasardeuse.","Choisis une face avant simple: nom du produit, quantité, promesse 100 % pulpe. Face arrière: détails, lot, date, adresse ou contact choisi, tableau ou mention « valeurs en cours de mesure » si tu ne publies pas encore de chiffres.","Vérifie le contraste et la taille. Fais le test des dix secondes avec deux personnes. Corrige. Seulement ensuite tu penses impression.","Cette maquette vivra: quand les analyses arriveront, tu rempliras les cases vides. Tu ne changes pas la promesse 100 % pulpe. Numérote tes versions de maquette (première version, version suivante, deuxième version). Archive les photos. Si un acheteur pose une question dans six mois, tu sauras ce qui était imprimé. Le poids net annoncé engage ta balance. Vérifie-la avec des poids connus quand tu pourras. Avant de fermer, écris une action concrète liée à cette leçon pour les sept prochains jours.","Si une cliente pose une question dans six mois, tu dois savoir ce qui était imprimé. Le poids net engage ta balance: vérifie-la avec des masses connues quand tu pourras. Avant de fermer la maquette, écris une action concrète pour les sept prochains jours (relecture, photo d’archive, ou correction de police)."],"prof":"On termine le module étiquette par un objet concret. Prends papier, crayon, règle. Je préfère une maquette un peu maladroite mais complète à un dessin magnifique qui ment. Quand tu hésites sur une phrase, relis la leçon allégations. Quand tu hésites sur un chiffre, laisse vide. Je préfère ta maquette corrigée deux fois à une impression précipitée. On est presque au rendez-vous avec la cliente: autant être dignes.","tip":"Photographie ta maquette finale datée et range-la dans le carnet Baobab Bliss.","simple":"Coudre un pagne: tu épingles d’abord, tu essaies, tu corriges, tu couds. La maquette, c’est l’étape des épingles pour ton sachet. Épingler un pagne avant de coudre évite les larmes. Épingler une maquette avant d’imprimer évite les cartons inutiles. Image utile pour cette leçon : un geste du quotidien que tu peux mimer en trente secondes avant d’ouvrir les cartes.","plus":"liste de contrôle finale alignée 1169/2011 (esprit) + réalité BF: dénomination, ingrédients, net, DDM, conservation, exploitant, lot, mode d’emploi, nutrition (ou report), allergènes (néant ou croisement réel), langue, lisibilité. Cohérence site web, WhatsApp et sachet: mêmes phrases. Archivage: version n°1, n°2… liste de contrôle 1169 esprit + BF. Cohérence canaux. Versions. Étude stabilité aperçu 0–12 mois. Avant tirage, liste de contrôle signée (toi + une relectrice). Incrémente la version si tu touches net, DDM ou allégation. Archive PDF photo de la maquette. liste de contrôle avant tirage: dénomination, net, identité, lot, durabilité, nutrition si présente, absence d’allégation non tenue, cohérence des canaux, numéro de version. Archive une photo ou un PDF de chaque maquette validée. Deux relectures (toi et une personne extérieure) avant impression. Tu testes la lisibilité à bout de bras et tu fais lire la maquette à une personne extérieure avant tout tirage payant. Le numéro de version apparaît sur le fichier et sur la photo d’archive.","expert":"Contrôle pré-impression: liste de contrôle signée. Gestion des versions: si tu modifies une allégation ou un poids net, tu incrémentes la version et tu archives. Métrologie: balance contrôlée pour le poids net annoncé. Étude de stabilité (aperçu): 3 températures ou au moins conditions réelles Ouaga, points 0, 1, 3, 6, 12 mois sur aw, sensoriel, microbes de base — plan à dimensionner selon moyens. Exemple (Exemple): maquette v1 sans tableau chiffré; v2 après bulletin labo avec déclaration complète. Export UE: relecture contre art. 9 et 13, 1924/2006, 2023/915 si contaminants déclarés ou surveillés. Ne pas publier d’adresse privée sur une page web ouverte si la confidentialité est requise: canal sachet physique distinct. Exemple (Exemple): v1 sans chiffres; v2 après bulletin. Relecture export: art. 9, 13, 1924/2006, 2023/915 selon besoin. Adresse privée hors page web ouverte si requis. liste de contrôle complète. Étude stabilité aperçu (aw, sensoriel, microbes) 0–12 mois. Exemple (Exemple): v1 sans chiffres, v2 post-labo. Relecture export 1169/1924/2023-915. Métrologie net. Séparer identité web publique et sachet remis en main. Textes: 1169/2011 art. Sur la maquette complète, tu vérifies toute la chaîne d’un seul regard recto verso. Exemple (Exemple): maquette v1.1 photographiée après deux relectures externes. La maquette est un document de maîtrise de l’information: version, date, signataires. Exemple (nombres inventés pour l’exercice): maquette v1.1 photographiée après deux relectures externes, écart de contraste du lot corrigé. Métrologie: erreur maximale tolérée sur la quantité nette selon le cadre métrologique du marché. Sépare identité web publique et mentions du sachet remis en main si besoin de confidentialité, tout en restant joignable. Textes pivots: 1169/2011 pour l’UE; loyauté et métrologie locales pour le premier marché.","quiz":[{"q":"Que faire des cases nutritionnelles avant analyse ?","choices":["Les remplir avec des moyennes inventées","Les laisser en attente plutôt que d’inventer","Les remplacer par un slogan santé"],"correct":1,"why_ok":"Attente honnête.","why_ko":"Invention ou slogan santé : non."},{"q":"Le test des dix secondes sert à…","choices":["Chronométrer la cuisson de la bouillie","Remplacer le numéro de lot","Vérifier que l’essentiel se trouve vite"],"correct":2,"why_ok":"Lisibilité réelle.","why_ko":"Ni cuisine ni substitut de lot."},{"q":"La promesse 100 % pulpe…","choices":["Autorise l’ajout secret de sucre","Doit disparaître dès qu’il y a une analyse","Reste stable même quand le tableau se remplit"],"correct":2,"why_ok":"Composition inchangée.","why_ko":"Ni disparition ni sucre secret."},{"q":"Avant d’imprimer en nombre, tu…","choices":["Commandes le plus grand tirage possible sans test","Effaces le lot pour « alléger »","Valides une maquette corrigée après relecture"],"correct":2,"why_ok":"Validation d’abord.","why_ko":"Ni tirage aveugle ni suppression de lot."}],"activity":{"type":"order","prompt":"Ordre pour sortir une maquette sage","steps":["Lister les mentions obligatoires","Rédiger sans allégation hasardeuse","Tester la lisibilité","Corriger puis figer la version"],"correct":[0,1,2,3],"hint1":"On liste d’abord.","hint2":"On fige à la fin.","solution":"Lister, rédiger sage, tester, corriger et figer."},"exercise":{"prompt":"Réalise la maquette papier recto verso complète (cases nutrition « à mesurer » OK). Fais passer le test des dix secondes à deux personnes. Note leurs retours et corrige.","hint1":"Matériel : feuille, stylo, règle.","hint2":"Photographie la version corrigée.","solution":"Exemple : maquette v1 datée, retours « lot trop petit » et « usage trouvé », version v1.1 photographiée."}}],"m4":[{"title":"Du fruit à la poudre chez toi","body":["Chez Baobab Bliss à Ouagadougou, la pulpe de pain de singe est déjà sèche dans la gousse. Ton métier n’est pas de retirer l’eau d’un fruit juteux comme une mangue. Tu choisis des fruits sains, tu casses les gousses, tu sépares pulpe, graines et fibres, tu broies avec soin, tu tamises, tu contrôles l’aspect et l’humidité si tu peux, puis tu emballes au sec.","Chauffer sans besoin fatigue le goût, la couleur et la vitamine C. Une finition douce n’intervient que si l’humidité ou l’activité de l’eau restent hors de ta cible après le tamis. Sinon tu laisses refroidir calmement et tu passes au sachet dans un endroit peu humide.","Le séchage à l’air chaud en couches fines sert surtout à tes futurs produits riches en eau: mangue, tomate, oignon, feuilles. Garde deux pages séparées dans ton carnet: une pour le pain de singe d’aujourd’hui, une pour ces futurs séchages avec claies et air chaud.","Cette semaine, dessine ta ligne réelle sur une feuille: réception, cassage, séparation, tamis, contrôle, sachet. Mets à côté un schéma mangue avec lavage, découpe, claies et air chaud. Les deux métiers se ressemblent de loin, pas de près. Montre le dessin à quelqu’un de la famille pour vérifier qu’il est clair."],"prof":"Beaucoup collent le même mot « séchage » sur tous les fruits. Pour ton baobab, le cœur du métier est la propreté de la séparation et du tamis, puis un emballage vraiment sec. Moins tu chauffes sans raison, plus tu gardes couleur et arôme. Si un lot colle entre les doigts ou semble trop humide, mesure d’abord si tu as un moyen simple, puis seulement tu envisages une finition douce. Je suis là pour t’aider à distinguer les deux carnets.","tip":"Dessine aujourd’hui ta ligne réelle Baobab Bliss en six cases et date la page.","simple":"Pense à des biscuits déjà croustillants que tu tries et mets en boîte, à côté de mangues fraîches à faire sécher longtemps au soleil. Deux gestes voisins sur la même table de cuisine, deux durées et deux outils très différents. Le pain de singe ressemble aux biscuits; la mangue ressemble au fruit à sécher.","plus":"En école d’ingénieur agroalimentaire, on parle d’opérations unitaires: séparation mécanique, broyage, classification granulométrique, conditionnement. Pour la pulpe de baobab, les dossiers industriels et l’autorisation européenne de la pulpe séchée décrivent une chaîne de cassage et de séparation plus qu’un séchage intensif. Des granulométries commerciales citent parfois une toile fine autour de 144 micromètres; d’autres acceptent une plage large selon l’usage boisson ou ingrédient. Une humidité rapportée autour de 10 à 13 pour cent apparaît dans des fiches; certaines cibles industrielles visent plus bas pour limiter le collage. Chez toi, tu fixes une cible mesurable (toucher, pesée avant et après une nuit en sachet test, ou appareil si tu en as un) et tu la tiens lot après lot, sans copier un barème mangue. La vitamine C et les arômes acides-fruités sont thermosensibles: chaque degré et chaque minute inutiles se paient en qualité sensorielle. Tu peux déjà préparer la page « futurs fruits » avec les mots claies, air chaud, épaisseur de couche, sans les mélanger à la page pain de singe.","expert":"Procédé type (synthèse pédagogique à partir de dossiers industriels et de la décision européenne 2008/575/CE autorisant la pulpe séchée de baobab comme nouvel aliment): (1) fruits mûrs sains; (2) stockage sec à l’abri des insectes; (3) cassage des gousses; (4) extraction des fragments pulpe-graines; (5) séparation pulpe, graines, fibres; (6) broyage contrôlé; (7) tamisage selon usage sachet; (8) contrôles humidité, activité de l’eau aw, corps étrangers, aspect; (9) finition douce seulement si hors cible; (10) refroidissement sous le point de collage; (11) dosage et soudure en zone sèche; (12) étiquetage et stockage frais et peu humide (ordre de grandeur cité industriellement: sous environ 25 °C et humidité relative modérée). L’étiquetage du nouvel aliment en Europe exige la dénomination « Baobab fruit pulp » sur les denrées qui en contiennent; cela n’impose pas un séchage intensif supplémentaire si la pulpe est déjà conforme. Exemple (nombres inventés pour l’exercice): 100 kg de fruits bruts donnent 38 kg de pulpe tamisée, soit un rendement de 38 pour cent. Compare à un essai mangue où 100 kg de fruit frais peuvent donner de l’ordre de 8 à 10 kg de produit séché selon les guides techniques de séchage en couche mince. Deux bilans, deux carnets. La diffusivité effective Deff et les courbes de séchage (modèles de Page MR = exp(-k t^n), Fick en plaque) concernent le carnet « futurs fruits », pas le geste quotidien pain de singe. Ne copie jamais un temps de claie mangue sur ton baobab. Si tu mesures une activité de l’eau, vise une zone où la croissance des moisissures est très limitée (souvent citée autour de aw inférieure ou égale à 0,60 à 0,65 pour la stabilité microbienne générale des aliments secs); la valeur exacte de ton lot se confirme sur place. Synthèse procédé: la décision européenne 2008/575/CE décrit une pulpe obtenue par cassage et séparation, non par un séchage intensif type fruit juteux. Chez Baobab Bliss, le diagramme prioritaire reste fruit, cassage, séparation, broyage, tamis, contrôle, refroidissement, sachet. Toute chaleur ajoutée doit être justifiée par une mesure hors cible. Documente séparément le futur séchage mangue (épaisseur, T air, courbe de poids). Exemple inventé de rendement: 38 kg de poudre pour 100 kg de fruits. Compare sans les confondre à un ordre de grandeur mangue séchée beaucoup plus bas en masse finale.","quiz":[{"q":"Que fait surtout Baobab Bliss avec le pain de singe ?","choices":["Séparer, broyer, tamiser et protéger une pulpe déjà sèche","Remouiller la pulpe avant le sachet","Retirer la majeure partie de l’eau comme pour la mangue"],"correct":0,"why_ok":"La pulpe est déjà sèche dans la gousse. Ton métier est de la rendre fine, propre et bien emballée.","why_ko":"Le gros retrait d’eau ou le remouillage ne décrivent pas le procédé baobab de base."},{"q":"Quand envisager une finition douce ?","choices":["Toujours, une journée entière à haute température","Jamais, même si la poudre colle","Seulement si humidité ou activité de l’eau restent hors cible"],"correct":2,"why_ok":"La finition n’est pas automatique : elle corrige un écart mesuré.","why_ko":"Chauffer systématiquement ou ignorer un lot qui colle n’est pas du pilotage."},{"q":"Où noter le futur séchage mangue ?","choices":["Sur une page séparée du carnet baobab","Sur la même ligne que le tamis baobab","Nulle part, ce n’est pas utile"],"correct":0,"why_ok":"Deux procédés, deux fiches : tu évites d’appliquer un barème mangue au pain de singe.","why_ko":"Mélanger les règles dans une seule ligne crée des erreurs de gestes."},{"q":"Chauffer sans besoin, pour la pulpe, tend surtout à :","choices":["Remplacer le tamis","Augmenter toujours le rendement utile","Abîmer arômes et vitamine C"],"correct":2,"why_ok":"La vitamine C et les arômes sont sensibles à la chaleur inutile.","why_ko":"Le chauffage n’augmente pas magiquement le rendement utile et ne remplace pas le tamis."}],"activity":{"type":"order","prompt":"Ordre du procédé baobab de base","steps":["Sélectionner les fruits","Casser les gousses","Séparer pulpe et graines","Tamiser puis emballer au sec"],"correct":[0,1,2,3],"hint1":"Tu commences par choisir le fruit.","hint2":"Le sachet vient après le tamis.","solution":"Sélectionner, casser, séparer, tamiser puis emballer au sec."},"exercise":{"prompt":"Dessine ton flux réel Baobab Bliss (6 cases) et entoure l’étape où tu perds le plus de temps.","hint1":"Parcours un lot de la semaine.","hint2":"Compare au schéma idéal de la leçon.","solution":"Exemple modèle : achat, cassage, séparation, broyage, tamis, sachet. Temps long souvent à la séparation manuelle : note une idée d’amélioration (outil, organisation de table)."}},{"title":"Opérations unitaires et bilan matière","body":["Une opération unitaire est un geste technique clairement nommé: recevoir, casser, séparer, broyer, tamiser, doser, souder. Chez Baobab Bliss, tu enchaînes ces gestes comme une petite usine familiale. Nommer chaque étape t’aide à mesurer le temps, le poids et les pertes, et à expliquer le travail à une aide qui débute.","Le bilan matière compare ce qui entre et ce qui sort. Tu pèses les fruits à l’arrivée, puis la pulpe nette après séparation, puis la poudre tamisée, puis le poids total des sachets remplis. La différence, ce sont les coques, graines, fibres, poussières de tamis et petits écarts de dosage.","Exemple (nombres inventés pour l’exercice): tu reçois 20 kg de fruits. Après cassage et séparation, tu as 7,2 kg de pulpe brute. Après tamis, 6,5 kg de poudre fine. Le rendement global sur fruit est 6,5 divisé par 20, soit 32,5 pour cent. Tu notes aussi le rendement sur pulpe brute: 6,5 divisé par 7,2, environ 90 pour cent.","Pour tes futurs fruits juteux, le bilan ajoute l’eau évaporée, qui pèse souvent plus lourd que la matière sèche utile. Sur baobab, l’eau change peu d’une étape à l’autre: ce sont surtout les coques et graines qui font baisser le rendement. Garde la formule d’eau pour le carnet mangue et entraîne-toi d’abord sur le pain de singe."],"prof":"Le bilan matière n’est pas un exercice d’école inutile. C’est ton outil pour savoir si un fournisseur te livre bien, si ton tamis jette trop de refus, ou si tu doses trop juste dans les sachets. Une balance fiable et un carnet daté suffisent pour commencer. Note toujours la date, le nom du lot, l’étape pesée et qui a pesé. Si les chiffres ne ferment pas, recommence la pesée avant de soupçonner le fournisseur.","tip":"Pèse un petit lot de bout en bout cette semaine et calcule les deux rendements (sur fruit et sur pulpe).","simple":"Quand tu prépares du tô, tu vois le mil entrer et la pâte sortir. Ce qui manque sur la balance, ce sont les pertes sur le chemin: farine qui vole, fond de marmite. Le bilan matière, c’est la même idée avec une balance et des cases nommées sur une page du carnet.","plus":"En génie des procédés alimentaires, le bilan massique sur un système s’écrit: entrées égales sorties plus accumulation. Sur un lot fini traité entièrement, l’accumulation dans l’atelier est nulle: la somme des entrées égale la somme des sorties (produit utile plus co-produits plus pertes). On définit un rendement massique η égale m_produit divisé par m_entrée choisie (fruit entier ou pulpe extraite). Les coques et graines de baobab sont des co-produits possibles: d’autres filières pressent l’huile de graines. Chez toi, décide clairement s’ils sont valorisés, donnés ou écartés, et pèse-les quand même pour fermer le bilan. Les pertes de process (poussières, coulures, sacs mal vidés) se suivent pour améliorer le poste le plus faible. Un écart permanent au même poste signale un outil, un geste ou une formation à revoir. Tu peux aussi suivre le rendement moyen sur dix lots pour lisser les variations de fruit. Note aussi le temps passé à chaque poste: un rendement bon obtenu trop lentement peut coûter cher en main-d’œuvre.","expert":"Exemple travaillé (nombres inventés, marqués Exemple): entrée fruit 50,0 kg; coques 22,0 kg; graines et fibres 10,5 kg; pulpe avant tamis 16,8 kg; refus de tamis 1,2 kg; poudre fine 15,5 kg; écart non localisé 0,1 kg. Vérification partielle: 22,0 plus 10,5 plus 15,5 plus 1,2 plus 0,1 égale 49,3 kg; l’écart de 0,7 kg par rapport à 50 kg invite à revoir la précision de pesée, l’étalonnage de la balance ou les poussières non collectées. Rendement poudre sur fruit: 15,5 divisé par 50,0 égale 0,31 (31 pour cent). Rendement poudre sur pulpe avant tamis: 15,5 divisé par 16,8 environ 0,92. Pour une mangue séchée future, le bilan d’eau utilise les teneurs en base sèche X (kg eau par kg matière sèche): masse d’eau évaporée égale m_s fois (X_0 moins X_f). Si la mangue entre à X_0 égale 4 kg eau par kg MS (environ 80 pour cent d’humidité sur base humide) et sort à X_f égale 0,18, la masse d’eau retirée par kilogramme de matière sèche est 3,82 kg. Cette logique n’a presque pas d’équivalent sur le pain de singe déjà sec: d’où deux carnets. Tiens un tableau mensuel des rendements pour voir si tu progresses. En atelier plus grand, on ajoute parfois un bilan énergétique (chaleur utile pour sécher): inutile sur baobab sec, central sur mangue. Enfin, exprime parfois le rendement en base sèche si tu compares des lots d’humidité différente: m_sec égale m_humide fois (1 moins w), où w est la fraction massique d’eau. Sur baobab sec, l’écart base humide et base sèche reste petit; sur mangue, il est énorme. Boucle d’amélioration: après cinq lots, trace η_fruit et η_pulpe. Si η_pulpe chute, inspecte toile et humidité; si η_fruit chute, inspecte tri des fruits et pertes de coques mal vidées. Étalonne la balance avec une masse connue une fois par semaine. Pour un futur fruit juteux, ajoute explicitement la masse d’eau évaporée m_s (X0 − Xf) dans une colonne séparée du carnet baobab.","quiz":[{"q":"À quoi sert un bilan matière chez toi ?","choices":["Choisir la couleur de l’emballage","Comparer poids entrants et sortants pour voir pertes et rendement","Remplacer l’étiquette du sachet"],"correct":1,"why_ok":"Le bilan relie ce qui entre à ce qui sort et montre où tu perds de la matière.","why_ko":"Étiquette et couleur ne remplacent pas une pesée de flux."},{"q":"Si tu as 6,5 kg de poudre après 20 kg de fruits, le rendement global est :","choices":["65 pour cent","2 pour cent","32,5 pour cent"],"correct":2,"why_ok":"6,5 divisé par 20 donne 0,325, soit 32,5 pour cent. C’est l’exemple de la leçon.","why_ko":"Vérifie la division : produit utile sur entrée fruit."},{"q":"Sur baobab, ce qui fait surtout baisser le rendement, c’est :","choices":["Coques, graines et fibres","L’évaporation massive d’eau comme la mangue","Le numéro du lot sur l’étiquette"],"correct":0,"why_ok":"La pulpe est déjà sèche : les masses écartées sont surtout solides.","why_ko":"L’évaporation massive décrit plutôt un fruit juteux."},{"q":"Pourquoi nommer chaque opération unitaire ?","choices":["Pour mesurer temps, poids et pertes étape par étape","Pour éviter de peser","Pour écrire en anglais sur l’étiquette"],"correct":0,"why_ok":"Nommer les postes permet de piloter et d’améliorer chacun.","why_ko":"L’anglais sur l’étiquette et l’absence de pesée ne sont pas le but."}],"activity":{"type":"calc","prompt":"Exemple : calcule le rendement poudre sur fruit","fields":[{"id":"entree","label":"Poids fruits entrés (kg)"},{"id":"poudre","label":"Poids poudre fine (kg)"}],"note":"Rendement égale poudre divisée par fruits. Tu peux reprendre 20 et 6,5.","tip":"Même unité des deux côtés."},"exercise":{"prompt":"Sur un mini-lot, pèse fruits, pulpe avant tamis, poudre fine, refus de tamis. Écris le bilan et les deux rendements.","hint1":"Utilise la même balance.","hint2":"Note la date et le lot.","solution":"Modèle : fruits 10 kg ; pulpe 3,6 kg ; poudre 3,3 kg ; refus 0,3 kg. Rendement poudre sur fruit 33 pour cent ; sur pulpe environ 92 pour cent."}},{"title":"Broyage, tamis et granulométrie","body":["Le broyage réduit la taille des morceaux de pulpe. Trop fort ou trop long, tu chauffes la poudre et tu crées trop de poussières qui collent partout. Trop faible, tu laisses des grains durs dans le sachet. Cherche un réglage qui donne une poudre agréable à boire sans chauffer la matière dans tes mains.","Le tamis classe les particules. Ce qui passe est ta coupe fine pour Baobab Bliss. Ce qui reste peut être rebrouyé une fois ou réservé à un autre usage familial. Une toile trop large laisse des grains. Une toile trop fine baisse le débit et augmente les refus. Choisis une toile et garde-la pour comparer les lots.","La granulométrie, c’est la répartition des tailles. Une poudre trop hétérogène se comporte bizarrement dans l’eau et se tasse mal dans le sachet. Vise une coupe régulière, lot après lot, avec la même toile, le même temps de broyage et le même geste de bras.","Nettoie broyeur et tamis entre les lots. Un reste collé d’hier change le goût et la couleur d’aujourd’hui. Garde une brosse dédiée alimentaire, un torchon propre, et note le nettoyage dans le carnet comme une vraie étape de la ligne."],"prof":"Si une cliente dit que la poudre « gratte » en bouche, regarde d’abord le tamis et le temps de broyage, pas l’étiquette marketing. Note le numéro de toile si tu en as un, ou décris l’ouverture avec une photo à côté d’une pièce de monnaie. La régularité d’une semaine à l’autre compte plus qu’un chiffre magique inventé. Je t’aide à lire ce que le refus te raconte sur ton réglage.","tip":"Photographie ta toile de tamis à côté d’une pièce et range la photo dans le carnet du lot.","simple":"C’est comme tamiser la farine pour une pâte à crêpes un soir de fête: trop grossier, tu sens les grains sous la langue; trop fin et trop longtemps, tu perds du temps pour un gain faible pendant que la famille attend autour du feu.","plus":"La granulométrie se décrit souvent par un diamètre médian ou par le pourcentage passant à une ouverture donnée, via une analyse sur tamis empilés. En industrie, on cite parfois une ouverture proche de 100 à 150 micromètres pour une poudre boisson fine; d’autres usages acceptent plus large. Sans granulomètre laser, une colonne de deux ou trois tamis et une balance te donnent déjà un profil: masse retenue sur chaque toile divisée par masse totale. Le broyage augmente la surface spécifique: la poudre devient plus sensible à l’humidité ambiante et à l’oxydation. D’où l’intérêt d’emballer vite après le tamis, au sec, plutôt que de laisser des bacs ouverts toute la journée chaude. Garde la même toile pendant au moins dix lots avant de changer, sinon tu ne sauras pas ce qui a amélioré la texture. Construis un petit graphique mental: fraction passant versus jour. Une chute brutale signale usure de toile, humidité ou changement de broyage.","expert":"Mécanismes: l’énergie mécanique se dissipe en fracture et en chaleur locale. Un broyage trop long élève la température de la poudre et peut favoriser le collage ou la perte d’arômes volatils. Pour le tamis, le rendement de passage dépend de la charge sur la toile, de l’humidité (la poudre humide bouche les mailles) et du mouvement. Si la toile s’aveugle, arrête, nettoie, vérifie l’humidité du lot avant de forcer. Exemple (nombres inventés): 2,00 kg déposés; 1,70 kg passent une toile fine; 0,30 kg de refus. Fraction passant: 85 pour cent. Tu vises une fourchette stable (par exemple 80 à 90 pour cent) plutôt qu’un record unique. Les dossiers d’autorisation de la pulpe de baobab décrivent un broyage puis une séparation en lots grossiers et fins (ordre de grandeur publié: particules de quelques micromètres à quelques centaines de micromètres). Chez toi, choisis une coupe et tiens-la semaine après semaine. Un contrôle simple: trois sachets du même lot, même dose dans l’eau, même temps d’attente, même jugement de grainéité. En notation d’ingénieur, on parle parfois de d50 (diamètre médian) et de span (largeur de distribution); ta fraction passant sur une toile fixe est un excellent substitut artisanal. m4-Broyage-tamis-et-granulométrie-X). Définis un d_pass cible artisanal (fraction passant sur ta toile fixe). Suis-le comme un SPC simplifié: moyenne mobile sur cinq lots, alerte si écart marqué. Documente la lumière et le geste d’opérateur, sources de biais. Spécification interne proposée: fraction passant sur toile fixe entre 80 et 90 pour cent, température de poudre au toucher proche de la pièce après broyage, nettoyage documenté. Si la fraction sort de la fourchette, ouvre une action: régler broyage, nettoyer toile, ou vérifier humidité. Les dossiers d’autorisation mentionnent des plages granulométriques larges; ta stabilité artisanale vaut mieux qu’une course au micromètre non mesuré.","quiz":[{"q":"Un broyage trop agressif peut surtout :","choices":["Chauffer la poudre et créer trop de poussière","Remplacer l’emballage","Augmenter l’eau dans le fruit"],"correct":0,"why_ok":"L’énergie en trop devient chaleur et fines excessives.","why_ko":"Le broyage ne remplit pas d’eau le fruit et ne remplace pas le sachet."},{"q":"À quoi sert le tamis ?","choices":["Colorer la poudre","Classer les particules et garder une coupe régulière","Mesurer la vitamine C"],"correct":1,"why_ok":"Le tamis sépare selon la taille pour une texture stable.","why_ko":"Couleur et vitamine C ne se lisent pas sur la toile."},{"q":"Pourquoi nettoyer entre les lots ?","choices":["Pour faire briller l’étiquette","Éviter de mélanger goût et couleur d’un lot à l’autre","Pour chauffer plus fort"],"correct":1,"why_ok":"Les restes collés contaminent le lot suivant.","why_ko":"Ni l’étiquette ni le chauffage ne justifient le nettoyage croisé."},{"q":"Une poudre très hétérogène tend à :","choices":["Ne plus jamais coller","Se conserver toujours mieux","Se comporter irrégulièrement dans l’eau et dans le sachet"],"correct":2,"why_ok":"Des tailles mélangées donnent sédimentation et tassement irréguliers.","why_ko":"L’hétérogénéité n’améliore pas magiquement conservation ni collage."}],"activity":{"type":"label","prompt":"Place les bons noms sur le schéma du tamis","labels":["Charge","Toile","Produit fin"],"correct":{"0":"Haut","1":"Toile","2":"Bas"},"hint1":"La charge arrive en haut.","hint2":"Le produit fin sort en bas.","solution":"Haut égale charge ; milieu égale toile ; bas égale produit fin.","svg":"<svg viewBox=\"0 0 220 140\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<ellipse cx=\"110\" cy=\"30\" rx=\"70\" ry=\"12\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"110\" y=\"34\" text-anchor=\"middle\" font-size=\"10\">Haut</text>\n<rect x=\"40\" y=\"42\" width=\"140\" height=\"40\" fill=\"#fff8e8\" stroke=\"#0071e3\"/>\n<text x=\"110\" y=\"66\" text-anchor=\"middle\" font-size=\"10\">Toile</text>\n<ellipse cx=\"110\" cy=\"100\" rx=\"50\" ry=\"18\" fill=\"#e8ffe8\" stroke=\"#0071e3\"/>\n<text x=\"110\" y=\"104\" text-anchor=\"middle\" font-size=\"10\">Bas</text>\n</svg>"},"exercise":{"prompt":"Fais un mini-essai : pèse 200 g avant tamis, pèse le passant et le refus, calcule la fraction passant.","hint1":"Même balance, même unité.","hint2":"Note la toile utilisée.","solution":"Exemple modèle : 200 g ; passant 170 g ; refus 30 g ; fraction 85 pour cent. Écris la toile et la date."}},{"title":"Humidité, activité de l’eau et finition douce","body":["L’humidité dit combien d’eau pèse dans ta poudre. L’activité de l’eau dit si cette eau est disponible pour les microbes et pour le collage. Deux notions proches, pas identiques. Sur pain de singe, tu vises une poudre libre, non collante, stable dans le sachet fermé.","Si tu n’as pas encore d’appareil, tu observes: la poudre coule-t-elle, forme-t-elle des grumeaux, reprend-elle du poids après une nuit dans un sachet mal fermé ? Ces signes guident tes décisions en attendant une mesure plus précise au labo ou avec un petit appareil.","La finition douce, c’est un séchage léger et court seulement si tu es hors cible. Air un peu chaud, couche fine, surveillance rapprochée. Tu n’imites pas un cycle mangue de plusieurs heures à haute température sur une pulpe déjà sèche.","Après finition, laisse refroidir avant d’emballer. Une poudre encore chaude dans un sachet fermé peut créer de la condensation interne et défaire tout ton travail de séparation et de tamis.","Humidité (eau en masse) et activité de l’eau (eau disponible pour les microbes et les réactions) ne se confondent pas. Une finition douce ne sert que si la pulpe naturelle n’est pas assez sèche pour ton sachet. Tu mesures, tu notes, tu décides: pas de séchage « pour faire sérieux »."],"prof":"Beaucoup confondent « sec au toucher » et « stable pour des semaines ». Le toucher aide, la mesure rassure, le sachet bien soudé protège. Si tu dois choisir une seule amélioration cette semaine, commence par fermer vraiment hermétique et stocker au frais relatif, loin du mur chaud de la cuisine. La finition douce vient après le diagnostic, pas avant.","tip":"Fais un test : un sachet bien soudé et un sachet mal fermé, même poudre, même pièce, compare le toucher après 48 heures.","simple":"C’est comme du linge presque sec: si tu le plies encore tiède dans un sac plastique, il ressort humide. Si tu attends qu’il soit frais, il reste agréable. Ta poudre aime la même patience avant le sachet. Comme le linge sur la corde: l’étoffe peut sembler sèche au toucher alors qu’elle garde encore de l’eau au pli. L’activité de l’eau, c’est cette eau encore disponible, pas seulement le poids perdu.","plus":"L’activité de l’eau aw est le rapport entre la pression de vapeur d’eau du produit et celle de l’eau pure à la même température. Elle gouverne la croissance microbienne, les réactions chimiques et le collage mieux que le seul pourcentage d’humidité. Les isothermes de sorption (modèles BET ou GAB) relient humidité d’équilibre et aw à température fixe. Pour les poudres fruitées, on cherche souvent une zone sous le point où la poudre agglomère fortement. Les cibles pratiques générales pour limiter les moisissures citent souvent aw inférieure ou égale à environ 0,60 à 0,65; les poudres très fluides visent parfois beaucoup plus bas. Ta valeur exacte se confirme sur ton lot, avec un appareil étalonné ou un laboratoire. Si tu accèdes un jour à un labo, demande humidité et activité de l’eau sur le même échantillon. Crée un test 48 heures: sachet A soudé sur poudre fraîche, sachet B sur poudre tiède. Compare masse et toucher. Garde la photo des deux.","expert":"Finition douce: objectif abaisser X (humidité base sèche) ou aw juste assez, sans cuire la pulpe. Paramètres: température d’air modérée, vitesse d’air, épaisseur de couche, durée. Surveille le poids d’un plateau témoin. Arrête dès que la cible est atteinte. Exemple (nombres inventés): plateau de 500 g de poudre; après 40 minutes d’air tiède en couche fine, 492 g. Perte 8 g d’eau, soit 1,6 pour cent sur base humide initiale. Vérifie le toucher et, si possible, aw. Refroidissement: la température de la poudre doit descendre sous la température de collage, liée à la transition vitreuse Tg des sucres et acides; l’eau plastifie et abaisse Tg (approche Gordon, Taylor pour un mélange solide-eau). Emballe ensuite. Ne déclare pas une durée de conservation inventée: tu la construiras par essais de stockage dans le module emballage. Relation pratique: à température fixe, l’isotherme X(aw) te dit quelle humidité correspond à ton aw cible. Peu de paramètres GAB publiés sont spécifiques au baobab: avance par essais et comparaison sensorielle lot à lot. m4-Humidité-activité-de-l-X). Relie collage à Tg qualitative: plus aw monte, plus Tg baisse. Sans DSC, utilise la saison (harmattan sec versus hivernage) comme facteur expérimental et note les lots collants sur un calendrier mural. Garde le ton calme. Relie au tip: Fais un test: un sachet bien soudé et un sachet mal fermé,. Procédure finition: couche fine, air tiède, plateau témoin pesé toutes les dix minutes, arrêt dès cible toucher ou aw. Refroidissement obligatoire avant soudure. Exemple inventé: 500 g à 492 g en 40 minutes. Calendrier saisonnier des lots collants à ton quartier. Sans isotherme GAB baobab publiée complète, ta série d’essais locaux construit la connaissance produit.","quiz":[{"q":"Humidité et activité de l’eau, c’est :","choices":["Deux idées proches mais pas identiques","Exactement la même chose toujours","Seulement la couleur de la poudre"],"correct":0,"why_ok":"L’humidité est une masse d’eau ; l’activité dit sa disponibilité.","why_ko":"Ce n’est ni un seul chiffre magique ni une question de seule couleur."},{"q":"Quand faire une finition douce ?","choices":["Toujours une nuit entière à très haute température","Jamais, même si la poudre colle","Seulement si tu es hors cible après contrôle"],"correct":2,"why_ok":"La finition corrige un écart, elle n’est pas un rituel.","why_ko":"Les extrêmes « toujours » ou « jamais » ne pilotent pas la qualité."},{"q":"Pourquoi refroidir avant d’emballer ?","choices":["Pour que l’étiquette colle mieux au mur","Pour augmenter l’eau dans la poudre","Éviter la condensation dans le sachet"],"correct":2,"why_ok":"La vapeur d’une poudre chaude se condense sur un film plus froid.","why_ko":"Ce n’est ni pour le mur ni pour ajouter de l’eau."},{"q":"Un sachet mal fermé pendant 48 heures peut :","choices":["Faire reprendre de l’humidité à la poudre","Remplacer le tamis","Augmenter le rendement fruit"],"correct":0,"why_ok":"L’air humide de la pièce entre et la poudre s’alourdit ou colle.","why_ko":"Ni le tamis ni le rendement fruit ne dépendent de cette fermeture."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"L’activité de l’eau parle de disponibilité de l’eau, pas seulement du pourcentage.","truth":true,"why":"C’est la définition utile pour la stabilité."},{"t":"Il faut toujours sécher le baobab comme une mangue pendant des heures.","truth":false,"why":"La pulpe est déjà sèche ; la finition est conditionnelle."},{"t":"Emballer la poudre encore bien chaude peut créer de la condensation.","truth":true,"why":"Le refroidissement avant soudure protège le lot."}]},"exercise":{"prompt":"Prépare deux sachets du même lot : un très bien soudé, un volontairement mal fermé. Après 48 heures, compare toucher, grumeaux, poids si tu peux.","hint1":"Même pièce, même étagère.","hint2":"Note le moment de la journée.","solution":"Modèle : le sachet mal fermé est plus lourd ou plus collant. Conclusion : la fermeture fait partie du procédé."}},{"title":"Séchage à l’air chaud pour tes futurs fruits","body":["Quand tu sécheras mangue, tomate, oignon ou feuilles, tu entreras dans un autre métier: retirer beaucoup d’eau avec de l’air chaud qui passe sur des couches fines. Ici tu apprends les idées, sans les coller sur le pain de singe d’aujourd’hui.","L’air apporte de la chaleur et emporte la vapeur. Plus l’air est chaud et sec, plus il peut prendre d’eau, mais trop chaud brûle la couleur et le goût. L’épaisseur sur la claie change tout: une couche épaisse sèche au centre beaucoup plus lentement.","On dessine souvent une courbe: au début l’eau part vite, puis plus lentement quand l’intérieur du morceau résiste. Ton chronomètre et une petite balance de plateau valent mieux qu’une recette copiée sans mesure.","Note dans le carnet « futurs fruits »: produit, épaisseur, température d’air si tu la connais, durée, poids avant et après, couleur, goût. Ces lignes construiront ton propre barème burkinabè.","Pour la mangue ou la tomate futures, l’air chaud porte la chaleur et emporte la vapeur. Tu contrôles température, humidité de l’air, épaisseur des tranches et temps. Un air trop humide allonge le séchage; des tranches trop épaisses restent humides au centre."],"prof":"Ne mélange jamais un temps de mangue avec un lot de pain de singe. Quand tu liras « séchage » dans un guide, demande-toi: ce guide parle-t-il d’un fruit juteux ou d’une pulpe déjà sèche ? Cette seule question t’évitera des erreurs coûteuses en goût. Je peux t’aider à classer chaque conseil dans le bon carnet. Le séchage air chaud est un métier de patience instrumentée: température lue, air qui circule, tranches régulières. Un thermomètre menteur coûte plus cher qu’un thermomètre vérifié. Note chaque essai comme un lot d’apprentissage.","tip":"Ouvre une page « futurs fruits » et écris aujourd’hui quatre titres : produit, épaisseur, temps, poids.","simple":"Sécher des tranches de mangue, c’est un peu comme faire sécher du linge épais dehors: le bord sèche avant le cœur. Si tu entasses trop, le milieu reste humide alors que le dessus paraît prêt. Comme faire sécher des tranches de manioc près du feu: trop près ça brûle dehors et reste mou dedans; trop loin ça n’avance pas. L’épaisseur et la distance font le résultat.","plus":"Psychrométrie utile: l’air humide se caractérise par température sèche, humidité relative et température de wet bulb. Le potentiel de séchage dépend de l’écart entre l’humidité de l’air et l’humidité à l’interface du produit. En couche mince, on suit souvent le rapport d’humidité MR égale (X moins Xe) divisé par (X0 moins Xe), avec X humidité base sèche, Xe à l’équilibre, X0 initiale. Les modèles empiriques Lewis, Page (MR égale exp des moins k t puissance n) et Henderson, Pabis ajustent les courbes; pour mangue et oignon, Page est fréquemment le meilleur ajustement dans la littérature de séchage. Protocole minimal: épaisseur fixée, charge kg par m² notée, T air si connue, poids toutes les heures jusqu’à stabilisation relative, couleur finale. Le rapport d’humidité MR = (X − Xe) / (X0 − Xe) décrit la trajectoire de séchage (X humidité base sèche, Xe équilibre, X0 initiale). Les modèles simples (Newton, Page) aident à comparer des essais, pas à remplacer le chronomètre atelier. Épaisseur et charge des claies changent tout. Un guide type Cirad pour mangue rappelle des phases et charges réalistes: tu t’en inspires sans copier un barème hors contexte.","expert":"Diffusivité effective: en régime diffusif pour une plaque d’épaisseur 2L, ln(MR) approximativement ln(8 sur pi carré) moins (pi carré Deff t) divisé par (4 L carré). Deff se lit sur la pente. Arrhenius: Deff égale D0 exp des moins Ea sur R T, avec R égale 8,314 J par mol par kelvin. Exemple publié (mangue 3 mm, 70 °C): Deff de l’ordre de 6,8 fois 10 puissance moins 10 m² par s (Akoy). Exemple de calcul pédagogique: avec L égale 1,5 mm, objectif MR égale 0,1, le temps Fick idéal tombe autour d’une heure, souvent inférieur au temps réel atelier (rétrécissement, croûtage, charge des claies). Les guides Cirad pour mangue citent des cycles beaucoup plus longs en deux phases de température: ton chronomètre terrain reste la référence. Ea publiées pour fruits séchés couvrent souvent quelques dizaines de kJ par mol. Utilise Fick pour comparer des réglages, pas pour remplacer l’essai. m4-Séchage-à-l-air-X). À partir de MR(t), estime k et n du modèle de Page par régression ln(-ln MR) versus ln t. Puis compare à une estimation Fick de Deff. Commente l’écart sans forcer l’accord: le terrain prime. Garde le ton calme. Relie au tip: Ouvre une page « futurs fruits » et écris aujourd’hui quatre. Protocole données: enregistrer m(t), calculer X base sèche si tu connais la matière sèche approximative, puis MR. Ajuster Page: ln(−ln MR) = ln k + n ln t. Estimer Deff via pente ln MR versus t. Publié mangue 3 mm 70 °C: Deff ordre 6,8×10⁻¹⁰ m²/s (Akoy). Ton temps réel dépassera souvent Fick idéal: note l’écart. Deux phases de température type guides Cirad restent une référence terrain à adapter.","quiz":[{"q":"Le séchage à l’air chaud en couche fine sert surtout :","choices":["À remouiller la pulpe","À remplacer toujours le tamis baobab","À tes futurs fruits juteux, pas au pain de singe de base"],"correct":2,"why_ok":"C’est le carnet mangue-tomate-oignon.","why_ko":"Il ne remplace pas le tamis ni ne remouille la pulpe."},{"q":"Que signifie une couche trop épaisse sur la claie ?","choices":["L’étiquette se remplit toute seule","Le fruit devient instantanément une poudre","Le centre sèche beaucoup plus lentement"],"correct":2,"why_ok":"L’eau du cœur met plus de temps à diffuser.","why_ko":"Ni poudre instantanée ni étiquette automatique."},{"q":"MR dans les courbes de séchage représente :","choices":["Le numéro de lot marketing","Un rapport d’humidité qui suit le progrès du séchage","Le prix du sachet"],"correct":1,"why_ok":"MR normalise l’humidité entre début et équilibre.","why_ko":"Ce n’est ni un prix ni un code marketing."},{"q":"Pourquoi noter poids avant et après ?","choices":["Pour éviter d’étiqueter","Pour remplacer le lavage des fruits","Pour construire ton propre barème mesuré"],"correct":2,"why_ok":"Les poids donnent la quantité d’eau partie.","why_ko":"Lavage et étiquette restent nécessaires par ailleurs."}],"activity":{"type":"order","prompt":"Ordre d’un essai de séchage futur","steps":["Couper en épaisseur régulière","Charger les claies sans entasser","Suivre poids et temps","Noter couleur et goût en fin"],"correct":[0,1,2,3],"hint1":"Tu prépares le morceau d’abord.","hint2":"Tu juges la qualité à la fin.","solution":"Couper, charger, suivre poids et temps, noter qualité."},"exercise":{"prompt":"Sur une page « futurs fruits », écris le protocole d’un essai mangue imaginé : épaisseur, nombre de claies, comment tu pèseras.","hint1":"Même sans séchoir, le protocole s’écrit.","hint2":"Prévoyois une claie témoin.","solution":"Modèle : tranches 5 mm ; une seule couche ; plateau témoin pesé toutes les heures ; arrêt quand le poids se stabilise et que le centre n’est plus frais ; note couleur."}},{"title":"Séchoir solaire et séchoir électrique : principes","body":["Un séchoir solaire capture la chaleur du soleil pour chauffer l’air qui traverse tes claies. Un séchoir électrique chauffe l’air avec une résistance et souvent un ventilateur. Les deux cherchent le même résultat: air plus chaud et plus capable d’emporter l’eau de tes futurs fruits.","Le solaire dépend du ciel, de l’heure et de la saison. Tu apprends à démarrer tôt, à protéger de la poussière et de la pluie, à finir parfois le lendemain. L’électrique offre un rythme plus régulier si le courant est stable, avec une température plus facile à viser.","Dans les deux cas, la circulation d’air compte autant que la chaleur. Sans mouvement d’air, l’humidité stagne autour du produit. Des claies propres, un chargement en une seule couche et un espace sous le toit pour la vapeur améliorent le résultat.","Tu ne compares pas les prix ici. Tu compares le principe: source de chaleur, maîtrise de la température, dépendance au temps, besoin en entretien. Ton choix futur dépendra de ton volume, de ton quartier et de ce que tu pourras maintenir.","Séchoir solaire: énergie gratuite mais variable avec le ciel. Séchoir électrique: plus stable, coût d’énergie à suivre. Dans les deux cas tu mesures le produit, pas seulement le boîtier. Un jour nuageux n’est pas un échec: c’est une donnée de planning."],"prof":"Quand quelqu’un te conseille « prends tel séchoir », demande d’abord: est-ce pour mangue ou pour baobab ? Pour baobab sec, tu n’achètes pas un outil pour un problème que tu n’as pas. Pour la mangue future, tu regardes stabilité de température, nettoyage, et comment tu mesuras. Je t’aide à poser ces questions sans te précipiter. Choisis l’outil selon la régularité dont tu as besoin et l’énergie que tu peux payer. Mesure le fruit, pas la fierté de l’appareil. Une page d’essai datée bat une brochure.","tip":"Liste trois questions que tu poseras avant tout essai de séchoir pour un fruit juteux.","simple":"Le solaire ressemble à faire sécher le linge au soleil: efficace les jours clairs, plus lent sous les nuages. L’électrique ressemble à un fer à repasser réglable: plus prévisible, branché sur le courant de la maison ou de l’atelier. Le ciel change; ton carnet garde la trace.","plus":"Principes d’ingénierie: bilan d’énergie sur l’air (chauffage sensible) et sur le produit (chaleur latente de vaporisation de l’eau, ordre 2250 kJ par kg d’eau à pression atmosphérique, valeur de référence). Un séchoir solaire direct expose souvent le produit au rayonnement; un séchoir indirect chauffe l’air dans un collecteur puis l’envoie sur les claies, ce qui peut mieux protéger la couleur. Les tunnels solaires étudiés au Sahel (exemples publiés à Niamey sur mangue et tomate) montrent des Deff de l’ordre de 10 puissance moins 9 m² par s, variables selon charge et météo. Un séchoir à résistance vise une température d’air plus stable; le ventilateur fixe la vitesse d’air qui contrôle le coefficient de transfert externe. Le solaire dépend de l’ensoleillement, de l’orientation et de la ventilation; l’électrique dépend de la régulation et de l’homogénéité des zones. Dans les deux cas, surcharge des claies et reprise d’humidité nocturne sont des ennemis classiques. Tu prévois un stockage tampon sec après séchage avant emballage.","expert":"Sans parler de prix, la grille de décision ingénieur regarde: plage de température utile (souvent 40 à 70 °C selon produit et qualité visée), homogénéité sur les claies, facilité de nettoyage (hygiène), protection contre insectes et poussières, possibilité de mesurer T et temps, maintenance locale. Pour baobab déjà sec, un grand séchoir est rarement le premier investissement: hygiène de table, tamis, balance, soudure et film barrière rapportent plus. Pour une future ligne mangue, un petit essai comparatif solaire contre électrique sur le même fruit, même épaisseur, même charge, avec courbe de poids, enseigne plus qu’une brochure. Documente rayonnement approximatif (jour clair ou voilé), température intérieure, humidité relative si tu as un hygromètre, et pertes qualité (brunissement, casse). m4-Séchoir-solaire-et-séchoir-X). Bilan d’ordre: énergie pour chauffer l’air versus chaleur latente pour évaporer l’eau. Même sans chiffres précis, classe les pertes (fuites d’air, surchauffe, charge mal répartie). Priorise les pertes que tu peux réduire à l’organisation. Une Une preuve écrite avec la date dans ton carnet. Garde le ton calme. Relie au tip: Liste trois questions que tu poseras avant tout essai de séc. Grille pondérée (sans prix): nettoyage 5, mesure T 5, insectes 4, homogénéité claies 5, maintenance 4. Visite terrain obligatoire avant décision. Solaire indirect protège souvent mieux la couleur que l’exposition directe. Ventilation = coefficient de transfert externe. Baobab sec: priorise film et soudure avant grand tunnel. Mangue future: essai A/B solaire versus électrique sur même épaisseur. Bilan d’énergie simplifié: chaleur sensible pour monter le produit et l’air, chaleur latente pour évaporer l’eau. Exemple (nombres inventés pour l’exercice): tu compares le temps pour passer de 70 pour cent à 15 pour cent d’humidité sur deux charges (fine contre épaisse) au même réglage, et tu notes l’écart. Capteurs: au moins un thermomètre produit et un contrôle d’humidité finale. Le solaire demande un plan B les jours sans soleil; l’électrique demande un suivi de consommation pour le coût de revient. Tu relis le choix solaire ou électrique à un essai daté sur la même charge de fruit, près du coin tamis.","quiz":[{"q":"Solaire et électrique cherchent surtout :","choices":["À remplacer le tamis du baobab","Un air plus capable d’emporter l’eau des fruits juteux","À imprimer les étiquettes"],"correct":1,"why_ok":"Les deux chauffent et renouvellent l’air pour le séchage.","why_ko":"Ni tamis baobab ni étiquette."},{"q":"Le séchoir solaire dépend surtout :","choices":["Du seul numéro de lot","De la couleur de l’étiquette","Du ciel, de l’heure et de la saison"],"correct":2,"why_ok":"L’énergie vient du soleil, variable.","why_ko":"Lot et étiquette ne chauffent pas l’air."},{"q":"Sans circulation d’air :","choices":["Le fruit sèche toujours plus vite","Le bilan matière disparaît","L’humidité stagne autour du produit"],"correct":2,"why_ok":"La vapeur doit être emportée.","why_ko":"Sans flux d’air, le séchage ralentit."},{"q":"Pour le pain de singe déjà sec, le premier levier est souvent :","choices":["De chauffer chaque lot une nuit entière","D’acheter d’abord le plus gros tunnel","Hygiène, tamis, soudure et film plutôt qu’un grand séchoir"],"correct":2,"why_ok":"Tu n’investis pas d’abord dans un outil pour un besoin faible.","why_ko":"Grand tunnel et chauffage systématique ne sont pas le premier geste baobab."}],"activity":{"type":"match","prompt":"Associe principe et idée","left":["Séchoir solaire","Séchoir électrique","Claie surchargée","Ventilation"],"right":["Dépend du ciel","Température plus régulière si courant stable","Centre encore humide","Emporte la vapeur"],"pairs":{"0":0,"1":1,"2":2,"3":3},"hint1":"Pense à la source d’énergie.","hint2":"Surcharge et air stagnant freinent.","solution":"Solaire-ciel ; électrique-régularité ; surcharge-centre humide ; ventilation-vapeur."},"exercise":{"prompt":"Écris une grille de 5 critères pour juger un séchoir futur (sans prix) : nettoyage, mesure, insectes, stabilité, maintenance.","hint1":"Une ligne par critère.","hint2":"Ajoute comment tu testeras.","solution":"Modèle : (1) surfaces lavables ; (2) place pour thermomètre ; (3) grilles anti-insectes ; (4) écart de T entre claies ; (5) pièces réparables localement. Test : un essai mangue avec courbe de poids."}},{"title":"Refroidissement, collage et écoulement de la poudre","body":["Après tamis ou finition, la poudre chaude ou un peu humide peut coller. Le collage forme des grumeaux durs. L’écoulement raconte si la poudre glisse ou s’archée dans un entonnoir ou un sachet.","Refroidir dans un bac propre, en couche pas trop épaisse, loin de la vapeur de cuisine, prépare un bon emballage. Tu touches: la poudre doit être proche de la température de la pièce avant la soudure.","L’humidité reprise pendant une pause trop longue sur table ouverte favorise aussi le collage. Travaille par petites quantités: tamise, refroidis, emballe, plutôt que de laisser un grand bassin toute la journée.","Pour tes futurs fruits séchés en morceaux, le collage de poudre est moins central, mais le croustillant et la reprise d’humidité le sont. Les mêmes idées de refroidissement et de protection reviennent. Interdis-toi verbalement d’ouvrir un grand bac toute la journée: portionne en bols que tu emballes dans l’heure.","Une poudre chaude emballée trop tôt condense de l’humidité dans le sachet. Refroidis à l’abri de l’air humide. Le collage et le mauvais écoulement signalent souvent une activité de l’eau trop haute ou une transition vitreuse dépassée. Tu corriges le process avant de changer de film au hasard."],"prof":"Si ta poudre « prend en masse » dans le sachet après quelques jours chauds, regarde trois choses avant de changer de fruit: soudure, film, et si tu as emballé trop chaud ou trop humide. Le collage a des causes physiques claires. Je t’aide à les classer sans paniquer ni jeter tout un stock trop vite. Laisse refroidir avant de souder. Une précipitation pour finir crée des sachets qui collent une semaine plus tard. Le temps de pause est un poste de maîtrise, pas du retard.","tip":"Fais couler une petite dose dans un verre : note si elle s’écoule librement ou si elle forme un pont.","simple":"Pense au sucre en poudre un jour d’harmattan humide: il forme des blocs dans la boîte. Au sec, il coule. Ta pulpe de baobab joue le même jeu avec l’air de Ouagadougou. Comme le tô trop chaud mis dans une boîte fermée: la vapeur revient en eau sur le couvercle. La poudre fait pareil dans un sachet soudé trop tôt.","plus":"Le collage (caking) des poudres riches en sucres et acides est lié à la température de transition vitreuse Tg. Au-dessus de Tg, la matrice amorphe se ramollit; un peu plus haut, le point de collage apparaît. L’eau plastifie: plus d’humidité, Tg plus basse (Gordon, Taylor). D’où l’intérêt d’une aw basse et d’un emballage barrière. L’écoulement se caractérise parfois par l’angle de repos ou des tests d’entonnoir; artisanalement, un test de verse dans un verre gradué suffit pour comparer les lots. Test d’écoulement standard: même entonnoir, même hauteur, temps pour vider 100 g. Trois répétitions, moyenne notée. Au-dessus de la température de transition vitreuse, la matrice sucrée se ramollit: stickiness puis caking. L’eau plastifie et abaisse cette température. Refroidissement, faible humidité ambiante au conditionnement et film adapté limitent la reprise. Un test d’écoulement simple suit tes lots. Tu notes la température approximative de la poudre avant soudure et l’humidité ressentie de la pièce. Un ventilateur qui souffle de l’air humide sur la table d’emballage annule le bénéfice du refroidissement.","expert":"Exemple pédagogique (composants typiques de littérature, pas une mesure sur ton lot): une matrice riche en sucres de fruits peut avoir une Tg anhydre modérée; à 4 pour cent d’eau, Tg chute. Si la pièce fait 30 à 35 °C et que Tg retombe près de cette zone, le collage devient probable. Les supports type maltodextrine remontent Tg dans d’autres poudres de jus, mais Baobab Bliss reste à 100 pour cent pulpe: tu ne « corriges » pas avec un additif; tu maîtrises eau, température et film. En silo industriel on parle aussi d’archage et de rat-holes; en sachet, tu vois grumeaux et dose irrégulière. Plan d’action atelier: refroidir sous Tg approximative, emballer vite, stocker au plus frais et sec possible, contrôler soudure. Enregistre les jours d’humidité élevée où les lots collent plus: tu construiras une carte saisonnière ton quartier. m4-Refroidissement-collage-et-écoulement-X). Interprète l’écoulement avec aw et T pièce. Pose une règle interne: pas d’emballage si T poudre nettement au-dessus de T pièce au toucher. Valide la règle sur dix lots avant de la graver dans le SOP. Garde le ton calme. Relie au tip: Fais couler une petite dose dans un verre: note si elle s’é. Règle SOP: emballage seulement si poudre proche T pièce au centre du bac. Test écoulement 100 g × 3. Carte saisonnière collage. Lien qualitatif Tg, eau, T. Pas d’additif maltodextrine: Baobab Bliss reste 100 pour cent pulpe; la maîtrise passe par eau, T et barrière. Isolement des lots grumeleux avec code et cause racine.","quiz":[{"q":"Emballer une poudre encore bien chaude favorise :","choices":["Condensation et collage plus tard","L’effacement du numéro de lot","Un meilleur rendement fruit"],"correct":0,"why_ok":"La vapeur se condense et plastifie la surface des particules.","why_ko":"Ni rendement fruit ni lot."},{"q":"Le collage est surtout lié à :","choices":["Le prénom sur la carte de visite","La seule couleur de l’étiquette","Eau disponible et température autour de la matrice sucrée"],"correct":2,"why_ok":"Tg et humidité expliquent le phénomène.","why_ko":"Marketing n’explique pas le caking."},{"q":"Pourquoi travailler par petites quantités ?","choices":["Pour éviter de peser","Pour chauffer plus","Pour tamiser, refroidir et emballer sans longue pause ouverte"],"correct":2,"why_ok":"Moins d’exposition à l’air humide de la pièce.","why_ko":"Pesée et chauffage ne sont pas la raison."},{"q":"Un test d’écoulement simple :","choices":["Mélanger avec de l’eau de javel","Verser une dose et voir si elle coule ou s’archée","Goûter sans noter"],"correct":1,"why_ok":"L’observation d’écoulement compare les lots.","why_ko":"Goûter sans note ou javel ne mesurent pas l’écoulement."}],"activity":{"type":"case","prompt":"Cas atelier","story":"En saison humide, ta poudre forme des grumeaux deux jours après emballage. Les sachets étaient remplis encore tièdes.","q":"Premier geste utile ?","choices":["Revoir refroidissement et soudure avant de changer de fruit","Retirer le nom Baobab Bliss de l’étiquette","Doubler la température de finition sur tous les lots"],"correct":0,"why_ok":"Cause probable : emballage chaud et reprise d’humidité.","why_ko":"Chauffer plus ou changer l’étiquette ne corrige pas la physique du collage."},"exercise":{"prompt":"Sur trois lots, note : température ressentie à l’emballage (tiède ou frais), qualité de soudure, écoulement à 48 heures.","hint1":"Même format de sachet.","hint2":"Une ligne par lot.","solution":"Modèle : lot A tiède, soudure moyenne, grumeaux ; lot B frais, soudure nette, écoulement libre. Décision : standard « frais au toucher avant soudure »."}}],"m5":[{"title":"À quoi sert l’emballage","body":["L’emballage de Baobab Bliss protège ta poudre de l’humidité, de la lumière, des odeurs et des salissures. Il porte aussi le nom, le poids et le lot pour ta cliente. Ce n’est pas seulement un joli papier: c’est une barrière et une carte d’identité.","Une poudre sèche reprend vite l’eau dans l’air de Ouagadougou en saison humide. Si le sachet laisse passer trop d’humidité, la poudre colle, s’agglomère, perd son aspect. Tu choisis donc une structure adaptée avant de parler dessin.","L’emballage facilite aussi le dosage et le transport. Un sachet bien fermé voyage mieux qu’un bol ouvert. Pour les futurs fruits séchés, la même logique tient: protéger ce que tu as mis tant de soin à préparer.","Cette semaine, regarde trois sachets autour de toi (farine, lait en poudre, épices) et note comment ils ferment, s’ils sont opaques, s’ils semblent épais. Tu construis un œil d’emballeuse sans acheter tout de suite. Décide quelle durée de vie tu vises avant de choisir le film. Un sachet pour vente rapide n’a pas les mêmes besoins qu’un sachet qui attend trois mois."],"prof":"Avant de tomber amoureuse d’un dessin, pose la question de la protection. Une belle étiquette sur un film trop ouvert à l’humidité te coûtera des retours. On travaillera le contact alimentaire et la soudure juste après. Pour l’instant, retiens: protéger, informer, permettre le geste d’usage. Avant d’acheter un stock de sacs, regarde trois emballages déjà sur le marché et note ce qu’ils protègent vraiment: lumière, air, chocs, information.","tip":"Liste sur une page les trois rôles de ton sachet : protéger, informer, servir l’usage.","simple":"Comme une bonne bassine avec couvercle pour le tô restant: tu gardes propre, tu évites que ça sèche trop ou prenne l’odeur du frigo. Le sachet joue ce rôle pour ta poudre. Comme choisir un panier pour porter des œufs: joli ne suffit pas; il doit empêcher la casse et te laisser lire ce que tu transportes.","plus":"Les fonctions packaging enseignées en école: contenir, protéger (barrières vapeur d’eau, oxygène, lumière), communiquer (étiquette), faciliter l’usage (ouverture, dose). Pour une poudre hygroscopique, la barrière à la vapeur d’eau domine souvent. L’opacité protège aussi les composés sensibles à la lumière. L’éco-conception viendra plus tard: d’abord un sachet qui fait son travail technique. Tu relis cette leçon à la section Emballage de ton appli métier, sans la recopier ici. L’emballage remplit des fonctions techniques et de communication. Techniques: barrière à
