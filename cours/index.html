<script>window.COURSE_DATA={"MODULES":[{"id":"m0","title":"Comment bien étudier","weeks":2,"hours":8,"badge":"Premiers pas","phase":"A","monthHint":"Mois 1"},{"id":"m1","title":"Ce dont ton baobab est fait","weeks":4,"hours":20,"badge":"Chimie vivante","phase":"A","monthHint":"Mois 1 et 2"},{"id":"m2","title":"Garder ton produit propre et sain","weeks":4,"hours":20,"badge":"Microbes sous contrôle","phase":"A","monthHint":"Mois 2 et 3"},{"id":"m3","title":"Nourrir et bien étiqueter","weeks":3,"hours":14,"badge":"Étiquette honnête","phase":"A","monthHint":"Mois 3"},{"id":"m4","title":"Procédé baobab et séchage futur","weeks":6,"hours":28,"badge":"Maîtrise du procédé","phase":"B","monthHint":"Mois 4 à 6"},{"id":"m5","title":"Choisir le bon emballage","weeks":3,"hours":16,"badge":"Sachet solide","phase":"B","monthHint":"Mois 6 et 7"},{"id":"m6","title":"Organiser la qualité au quotidien","weeks":4,"hours":22,"badge":"Qualité claire","phase":"B","monthHint":"Mois 7 et 8"},{"id":"m7","title":"Les règles chez toi et ailleurs","weeks":3,"hours":16,"badge":"Règles lues","phase":"B","monthHint":"Mois 8 et 9"},{"id":"m8","title":"Goûter et améliorer","weeks":3,"hours":12,"badge":"Goût juste","phase":"C","monthHint":"Mois 10"},{"id":"m9","title":"Mesurer et comparer sans se tromper","weeks":3,"hours":12,"badge":"Chiffres utiles","phase":"C","monthHint":"Mois 11"},{"id":"m10","title":"Organiser ton atelier et tes coûts","weeks":4,"hours":16,"badge":"Atelier rangé","phase":"C","monthHint":"Mois 12"},{"id":"m11","title":"Vendre, soigner la planète, mener le projet","weeks":4,"hours":16,"badge":"Projet lancé","phase":"C","monthHint":"Mois 13 et 14"},{"id":"cap","title":"Ton dossier Baobab Bliss","weeks":6,"hours":20,"badge":"Dossier prêt","phase":"C","monthHint":"Mois 15 à 18"}],"LESSONS":{"m0":[{"title":"Pourquoi ce cours existe","body":["Ce cours t’accompagne pendant 12 à 18 mois. Il reprend les matières qu’une ingénieure alimentaire étudie en France, traduites pour ton atelier Baobab Bliss à Ouagadougou. Ce n’est pas un diplôme officiel. C’est une autoformation solide pour produire, emballer et vendre une pulpe de baobab nette.","Chaque module mélange science, atelier et vente. Tu avances leçon par leçon, avec quiz, activité et un petit geste concret. Ta prof intégrée répond hors ligne avec des explications écrites à l’avance.","Ton produit aujourd’hui: pain de singe, cent pour cent pulpe, rien d’ajouté. Demain, tu pourras sécher d’autres fruits. Le cours prépare les deux sans mélanger les gestes.","Tu choisis ton rythme. Une à trois leçons par semaine suffisent. Note ce que tu fais dans ton carnet Baobab Bliss: date, lot, observation. Tu peux ouvrir le cours sans connexion après le premier chargement. Garde le fichier au même endroit que ton application Baobab Bliss pour le retrouver facilement. Quand tu avances, tu deviens capable d’expliquer tes gestes à une aide familiale avec les bons mots. Le projet final te demandera de relier procédé, hygiène, emballage et vente. Les modules du début préparent ce dossier sans te précipiter."],"prof":"Olga, bonjour. Je suis ta prof dans ce cours. Je reste avec toi sur chaque carte. Ici, on clarifie le cadre: tu apprends comme une future responsable d’atelier, sans promesse de titre scolaire. Quand une notion est floue, appuie sur « Je n’ai pas compris » ou cherche dans ma banque de questions. On lie toujours la théorie à ton sachet de pulpe. Si tu te sens dépassée par le volume, commence seulement par cette leçon et l’exercice d’objectif. Je préfère une phrase claire sur ton mur à dix modules ouverts trop vite. Dis-moi (dans la banque) le mot « rythme » si tu veux un conseil de calendrier.","tip":"Écris aujourd’hui ton objectif Baobab Bliss pour les 12 prochains mois en une phrase.","simple":"Pense à une couture longue: on coupe le tissu en pièces, on coud une couture après l’autre. Ce cours découpe le métier alimentaire en pièces courtes. Tu n’enfiles pas tout le rouleau d’un coup. Un voyage long se prépare avec une liste courte: eau, pagne, papiers. Ici ta liste courte c’est l’objectif Baobab Bliss et le prochain module utile.","plus":"Les écoles françaises d’ingénieur agroalimentaire (grade master, niveau 7 du répertoire national) articulent sciences de l’aliment, génie des procédés, qualité, droit alimentaire, économie et stages longs. Le référentiel de la commission des titres fixe notamment environ 180 crédits pour le cycle ingénieur de six semestres et un volume d’enseignement présentiel borné. Notre parcours ne délivre aucun de ces crédits. Il en reprend les thèmes utiles à une unité familiale qui vise ensuite une petite usine. Les « crédits » affichés dans le cours sont indicatifs (charge de travail), jamais officiels. Les compétences RNCP côté agroalimentaire insistent sur formuler, dimensionner, analyser, maîtriser les points à surveiller, piloter. Le premier module traduit cela en méthode d’autoformation: objectif, rythme, outils de révision, éthique de l’information. Les ECTS affichés ailleurs dans le parcours restent indicatifs. Le parcours compagnon reste hors CTI: pas d’inscription, pas de jury, pas de mobilité obligatoire. Tu gagnes un langage d’atelier et une discipline de carnet. Les écoles citées dans la recherche (AgroParisTech, Institut Agro, ENSAIA, Oniris, ISARA, Bordeaux INP, Polytech Montpellier, Cnam) illustrent la diversité des maquettes, toutes autour des mêmes piliers science-procédé-qualité-droit-entreprise.","expert":"Cadre CTI (Références et orientations 2026): le titre d’ingénieur diplômé confère le grade de master (niveau 7). Architecture typique: 10 semestres post-bac ou 6 semestres après validation d’au moins 4 semestres d’enseignement supérieur. Cycle ingénieur: 30 ECTS par semestre, 180 ECTS au total. Volume face-à-face FISE souvent situé entre plus de 1 800 h et moins de 2 000 h sur 6 semestres (borne basse possible vers 1 700 h selon pédagogie projet). Stages FISE cumulés: au moins 28 semaines, prioritairement en entreprise. Mobilité internationale FISE: au moins 16 semaines. Niveau d’anglais minimal B2 du CECRL pour le diplôme. Blocs de compétences RNCP récurrents côté agroalimentaire (exemples Cnam RNCP42440, ENSCBP RNCP36180): formuler; dimensionner des opérations; analyser propriétés physico-chimiques, biochimiques et microbiologiques; maîtriser les points à surveiller sanitaires; piloter production et qualité. Exemple (indicatif, non officiel): si tu comptes 8 à 20 h de travail personnel par module sur 12 modules plus un projet, tu vises grosso modo 100 à 250 h sur 12 à 18 mois — loin des 1 500 à 1 800 h d’un master complet, mais cohérent avec une fondatrice très occupée. Limite honnête: aucun badge du cours n’équivaut à un diplôme CTI ni à une inscription scolaire. Pour situer l’effort: un semestre ingénieur français vaut 30 ECTS, soit souvent 750 à 900 h de travail étudiant selon la convention 25–30 h par crédit. Notre phase A entière reste bien en dessous. Exemple (Exemple): 4 modules × 12 h = 48 h sur deux mois — charge réaliste pour une fondatrice. Documents de référence: CTI R&O 2026; fiches RNCP42440 et RNCP36180 pour la cartographie des blocs, sans inscription scolaire. Lecture CTI R&O 2026: éléments essentiels (sciences, méthodes ingénieur, recherche/innovation, données, entreprise, éthique/SST, transitions, société, langues, autoévaluation). Le premier module opérationnalise surtout autoévaluation et éthique de l’information. Exemple (Exemple) de charge: 2 h/semaine × 60 semaines = 120 h, milieu de fourchette 100–250 h. Badge « Premiers pas »: non transferable académiquement. Lien vers modules suivants: chimie (M1) puis hygiène (M2) avant toute montée en procédé. Exemple (Exemple): tu bloques 2 créneaux de 30 minutes cette semaine et tu les tiens.","quiz":[{"q":"Ce parcours te délivre-t-il un diplôme d’ingénieure reconnu ?","choices":["Oui, avec le sceau de la commission des titres","Non, c’est une autoformation utile pour ton atelier","Oui, dès que tu termines le module zéro"],"correct":1,"why_ok":"Le cours le dit clairement : autoformation inspirée des programmes, pas un titre officiel.","why_ko":"Aucun établissement ni commission ne valide ce fichier. Les badges restent amicaux."},{"q":"Quel produit ancre les exemples d’aujourd’hui ?","choices":["Un médicament à base de plantes","Un yaourt industriel importé","La pulpe de baobab Baobab Bliss"],"correct":2,"why_ok":"Tout part de ton pain de singe, cent pour cent pulpe.","why_ko":"Les autres pistes ne sont pas le cœur de Baobab Bliss dans ce cours."},{"q":"Combien de temps le rythme proposé couvre-t-il ?","choices":["Deux week-ends intensifs seulement","Cinq années d’école en présentiel","Environ 12 à 18 mois"],"correct":2,"why_ok":"L’accueil et cette leçon fixent une fenêtre de 12 à 18 mois adaptable.","why_ko":"Ce n’est ni un sprint de deux week-ends ni le cycle scolaire complet."},{"q":"Que faire si une idée reste floue ?","choices":["Attendre un diplôme avant de produire","Effacer le module entier","Demander à ta prof dans le cours ou relire la carte simple"],"correct":2,"why_ok":"Ta prof hors ligne et la carte simple existent pour ça.","why_ko":"Tu n’as pas besoin d’un diplôme pour clarifier une carte aujourd’hui."}],"activity":{"type":"tf","prompt":"Vrai ou faux sur le cadre du cours","statements":[{"t":"Le rythme proposé s’étale sur environ 12 à 18 mois.","truth":true,"why":"C’est le curseur d’accueil du parcours."},{"t":"Les badges du cours remplacent un diplôme d’ingénieure.","truth":false,"why":"Badges amicaux, non officiels."},{"t":"Baobab Bliss reste l’exemple central des exercices.","truth":true,"why":"Chaque module revient à ta pulpe et ton atelier."}]},"exercise":{"prompt":"Écris en une phrase ton objectif Baobab Bliss pour les douze prochains mois (quantité, qualité ou clients du quartier).","hint1":"Pense à ce que tu veux voir dans les mains de tes clientes.","hint2":"Reste concrète : lots, sachets, quartier.","solution":"Exemple : « D’ici douze mois, je vends des sachets de pulpe nette et stable aux clientes d’Ouagadougou, avec date et lot sur chaque sachet. »"}},{"title":"Comment une leçon se passe","body":["Une leçon suit toujours le même chemin court. Tu lis deux à quatre cartes. Tu écoutes le conseil de ta prof. Tu prends l’astuce du jour. Si besoin, tu ouvres l’explication encore plus simple.","Ensuite tu fais le quiz (quatre questions). Puis l’activité (ordre, associations, calcul, cas ou étiquette). Enfin l’exercice terrain: un geste dans ton atelier ou au marché.","Les volets « Pour aller plus loin » et « Niveau expert » sont optionnels. Ils approfondissent comme à l’école. Tu peux les lire plus tard sans bloquer ta semaine.","Quand tu termines, coche la leçon. Ton progrès reste sauvé sur ton téléphone. Tu peux reprendre exactement où tu t’étais arrêtée. Tu peux marquer une leçon comme « à revoir » mentalement si ton score quiz est bas. Reviens-y après une nuit de sommeil: la mémoire consolide mieux avec un espacement court. N’ouvre pas trois volets expert le même soir si tu n’as pas fait l’exercice. L’atelier ancre ce que la lecture commence. Pour Baobab Bliss, écris la date et le numéro de lot dès que tu termines la session. Ce geste simple relie la leçon à ton stock réel et prépare les modules qualité."],"prof":"Regarde la leçon comme un circuit de marché: entrée, stands, sortie avec un panier. Les cartes sont l’entrée. Le quiz vérifie que tu as bien choisi. L’exercice met le panier dans ton atelier. Si une activité te bloque, lis d’abord mon indice, puis la solution modèle après ton essai. Quand l’activité est un calcul et que tu n’as pas encore de balance, laisse les champs vides et note « à mesurer » dans ton carnet. Ce n’est pas un échec: c’est une liste d’équipement futur.","tip":"Fais toujours l’exercice le même jour que les cartes, même en cinq minutes.","simple":"C’est comme préparer du tô: tu ne sers pas la pâte avant d’avoir chauffé l’eau. Ici tu ne passes pas à l’exercice avant d’avoir lu les cartes et tenté le quiz. Une recette de beignets se lit, se mesure, se goûte. Une leçon se lit, se quizze, se fait dans l’atelier. Même rythme de cuisine.","plus":"Pédagogie active: lecture courte, retrieval practice (quiz), application (activité), transfert (exercice atelier). Les couches « plus » et « expert » correspondent à la dualité cours de base / approfondissement des maquettes type Institut Agro ou AgroParisTech. Le stockage local du progrès imite un carnet de compétences, sans validation externe. Règle d’usage: ne pas ouvrir trois leçons d’affilée sans un geste terrain, sinon les notions restent abstraites. Le feedback immédiat after quiz (why_ok, why_ko) suit les principes de pratique de récupération. L’activité varie les formats pour éviter l’apprentissage fragile lié à un seul type d’item. L’exercice terrain crée un souvenir épisodique lié à ton local à Ouagadougou. Formats d’activité du compagnon: vrai/faux, ordre, association, cas, calcul, étiquette. Le mélange réduit le biais d’item. L’exercice atelier crée une Une preuve écrite avec la date dans ton carnet. Le score local n’est pas une note d’école: c’est un signal de révision. Tu documentes tes choix de rythme dans le carnet: cela devient une preuve de pilotage personnel, compétence attendue aussi chez une ingénieure en formation continue.","expert":"En ingénierie pédagogique des formations CTI, l’alignement constructif relie objectifs, activités et évaluation (Biggs). Ici: objectif = savoir expliquer et appliquer une notion sur la pulpe; activité = quiz + tâche authentique; évaluation = auto-score local + solution modèle. Taxonomie de Bloom simplifiée pour Olga: se souvenir (cartes), comprendre (simple/prof), appliquer (exercice), analyser (plus), évaluer/créer (expert + projet final). Charge cognitive: une idée par carte, phrases courtes, pas de jargon en surface. Espacement: mieux vaut 20 minutes trois fois par semaine qu’une séance de trois heures mensuelle pour la rétention (littérature spacing effect). Exemple (indicatif): module de 7 leçons × 45 minutes = environ 5 h 15 de contact plus 2 h d’exercices atelier. Alignement pédagogique: objectif observable (« tu sais expliquer aw sur ta poudre »), preuve (quiz + note carnet), critère de réussite (3 réponses justes sur 4 et exercice daté). Charge cognitive intrinsèque réduite par une idée par carte. Exemple (Exemple): durée cible 25 minutes cartes+quiz, 10 minutes activité, 10 minutes exercice, 15 minutes expert optionnel. Taxonomie opérationnelle Bloom pour Olga: se souvenir (cartes), comprendre (simple/prof), appliquer (exercice), analyser (plus), évaluer/créer (expert + capstone). Espacement: 20 minutes × 3/semaine > 3 h mensuelles. Exemple (Exemple): leçon 45 min + 15 min expert. Outil de reprise: si score < 75 %, balise « à revoir » dans le carnet. Pas de compensation entre modules (esprit UE non compensables CTI, adapté ici en logique pédagogique). Références opérationnelles: CTI R&O 2026 (architecture ECTS, stages, anglais B2); RNCP blocs formuler/dimensionner/analyser/maîtriser/piloter. Exemple (Exemple): auto-évaluation trimestrielle sur une grille à 5 lignes (rythme, carnet, hygiène, étiquette, questions ouvertes). Limite: aucune équivalence diplôme. Livrable M0: objectif 12 mois + feuille phases A/B/C affichée. Exemple (Exemple): quiz 2/4 puis 4/4 après relecture de la carte simple le lendemain.","quiz":[{"q":"Quel ordre est le plus utile dans une leçon ?","choices":["Exercice d’abord, cartes ensuite","Cartes, quiz, activité, exercice","Expert seulement, sans quiz"],"correct":1,"why_ok":"Tu construis d’abord le sens, puis tu vérifies, puis tu appliques.","why_ko":"Sauter les cartes ou le quiz affaiblit l’ancrage."},{"q":"Les volets expert sont-ils obligatoires pour avancer ?","choices":["Non, tu peux les lire plus tard","Oui, sinon la leçon reste bloquée","Oui, et ils remplacent l’exercice"],"correct":0,"why_ok":"Ils approfondissent sans bloquer ton rythme atelier.","why_ko":"Rien dans le parcours n’impose l’expert avant l’exercice."},{"q":"Où ton progrès est-il conservé ?","choices":["Uniquement sur un serveur scolaire en France","Nulle part, tu dois tout recopier","Sur ton téléphone, dans le cours"],"correct":2,"why_ok":"Le cours sauve l’état en local sur ton appareil.","why_ko":"Pas besoin d’école ni de recopier à la main pour progresser."},{"q":"Que faire si l’activité te résiste ?","choices":["Abandonner le module entier","Changer la réponse au hasard sans lire","Lire l’indice de ta prof, réessayer, puis voir la solution"],"correct":2,"why_ok":"Indices puis essai puis solution modèle : méthode calme et efficace.","why_ko":"Abandonner ou répondre au hasard n’enseigne rien."}],"activity":{"type":"order","prompt":"Remets les étapes d’une leçon dans l’ordre","steps":["Lire les cartes","Faire le quiz","Faire l’activité","Faire l’exercice atelier"],"correct":[0,1,2,3],"hint1":"On commence par lire.","hint2":"L’atelier arrive en dernier.","solution":"Lire les cartes, puis quiz, puis activité, puis exercice atelier."},"exercise":{"prompt":"Ouvre une leçon déjà vue, refais seulement le quiz, et note ton score dans ton carnet avec la date.","hint1":"Choisis une leçon courte.","hint2":"Le carnet peut être un cahier papier.","solution":"Exemple : « 31 oct. 2026 : leçon Comment une leçon se passe : quiz 4 sur 4 : refait le soir. »"}},{"title":"Ton calendrier sur 12 à 18 mois","body":["Le parcours compte douze modules plus un projet final. Sur 12 mois, tu vises environ un module par mois. Sur 18 mois, tu respireras davantage entre les blocs.","Phase A (fondations): étudier, composition du baobab, hygiène, nutrition et étiquette. Phase B (cœur atelier): procédé, emballage, qualité, règles. Phase C (marché): goût, mesures, coûts, vente responsable, puis projet.","Chaque module affiche une durée indicative en semaines et en heures. Ce sont des ordres de grandeur, pas un contrat. Ta vie de fondatrice prime: avance quand tu peux.","Bloque dans ton agenda deux créneaux courts par semaine. Un créneau lecture-quiz. Un créneau geste atelier. Protège-les comme un rendez-vous cliente. Affiche les mois sur une feuille: mois 1 méthode et début chimie, mois 2-3 hygiène et étiquette, puis le cœur atelier. Adapte si une saison de fruits change ta priorité procédés. Le projet final n’est pas une surprise: dès maintenant, collecte photos de table, lots, et questions clientes dans une pochette. Pour Baobab Bliss, écris la date et le numéro de lot dès que tu termines la session, utile pour cette leçon. Ce geste simple relie la leçon à ton stock réel et prépare les modules qualité, utile pour cette leçon."],"prof":"Fais simple: choisis d’abord 12 ou 18 mois sur l’écran d’accueil, puis colle une feuille au mur avec les trois phases. Quand tu rates une semaine (marché chargé, famille), tu décale d’une case sans culpabilité. L’utile pour moi, c’est la régularité douce, pas la vitesse. Si tu voyages ou si le marché déborde, décale d’une semaine entière plutôt que de grignoter trois leçons à moitié. Une leçon finie vaut mieux que quatre commencées.","tip":"Place le créneau atelier juste après une session de production réelle : tu observes mieux.","simple":"C’est la saison des mangues: tu ne cueilles pas tout le verger le même jour. Tu avances arbre après arbre. Ici, module après module. Les pluies arrivent par saisons. Ton apprentissage aussi: tu acceptes les semaines denses et les semaines calmes, sans casser le fil.","plus":"Découpage type « semestres compressés » inspiré des cycles LMD: Semestre A = M0 à M3; Semestre B = M4 à M7; Semestre C = M8 à M11 plus capstone. Poids indicatif total vers 60 « crédits » de charge (très en dessous des 180 ECTS du cycle ingénieur). Répartition proposée dans la note de recherche: M4 séchage le plus lourd, puis qualité et réglementation. Ajuste si ton actualité atelier change (labo, première vente). Découpage compressé type LMD: A fondations, B usine, C marché. Poids indicatif vers 60 crédits de charge totale sur le compagnon, loin des 180 ECTS du cycle. M4 (procédé) sera le plus lourd plus tard. Ajuste selon labo et premières ventes. Les heures module affichées (accueil) sont des ordres de grandeur: lecture, quiz, exercice, relecture. Elles n’incluent pas forcément une étude de stabilité complète ni des analyses payantes. Budgète séparément labo et impression d’étiquettes. Tu marques aussi les mois où la pulpe est plus abondante et ceux où tu te concentres sur l’emballage et la vente. Une frise murale simple bat un calendrier parfait jamais regardé.","expert":"Planification: charge hebdomadaire cible 2 à 4 h (1 à 3 leçons + 1 exercice). Sur 52 semaines × 3 h = 156 h, compatible avec la fourchette 100–250 h. Jalons de revue (auto): fin de phase A = tu expliques aw, hygiène de base et étiquette honnête; fin de phase B = tu as un schéma de procédé pulpe + liste de contrôle emballage + ébauche de plan qualité; fin de phase C = dossier projet Atelier Baobab Bliss. Gestion des retards: règle des deux semaines glissantes — si deux semaines blanches, tu refais la dernière leçon (effet de reprise) avant d’ouvrir la suivante. Exemple (indicatif): mois 1 = M0+début M1; mois 2–3 = fin M1+M2; mois 3 = M3; etc. Les stages scolaires (≥28 semaines CTI FISE) sont remplacés ici par un carnet de pratique daté (photos, lots, observations clients). Gestion de projet personnelle: jalons de revue fin de phase, buffer de deux semaines, règle de reprise (refaire la dernière leçon après blanc). Exemple (Exemple): retard de 10 jours en mois 2 vers tu termines M1 leçon restante avant d’ouvrir M2. Remplacement des stages CTI par carnet de pratique daté (photos, lots, observations). Chemin critique: M3 (étiquette) avant de dépenser en impression; M2 (hygiène) avant d’augmenter les volumes; M4 (procédé) avant d’investir dans un séchoir pour mangue. Exemple (Exemple): mois 1–3 = M0–M3; mois 4–8 = M4–M7; mois 9–12 = M8–M11 + capstone, avec glissement possible vers 18 mois. Indicateurs de santé du plan: leçons terminées/semaine, exercices datés, absences >14 jours. Exemple (Exemple): feuille A/B/C collée le 1er du mois, revue le 15.","quiz":[{"q":"Que signifie la phase A du parcours ?","choices":["Uniquement la vente en ligne","Seulement le séchage industriel","Les fondations : méthode, composition, hygiène, étiquette"],"correct":2,"why_ok":"Phase A pose les bases avant le cœur atelier.","why_ko":"Vente seule ou séchage seul viennent plus tard."},{"q":"Les heures affichées par module sont…","choices":["Un contrat d’école obligatoire","Des ordres de grandeur pour t’organiser","Le temps exact chronométré en France"],"correct":1,"why_ok":"Ce sont des indications de charge, pas un chronomètre scolaire.","why_ko":"Rien n’impose la durée minute par minute."},{"q":"Combien de créneaux courts par semaine sont conseillés ?","choices":["Deux : lecture-quiz et geste atelier","Aucun, seulement le week-end en une fois","Dix cours d’affilée le dimanche"],"correct":0,"why_ok":"Deux créneaux courts soutiennent la régularité.","why_ko":"Une seule grosse session fatigue et retient moins."},{"q":"Si tu rates une semaine chargée, que faire ?","choices":["Saute directement au projet final","Abandonne le module en cours","Décale d’une case et reprends sans te gronder"],"correct":2,"why_ok":"La régularité douce bat la précipitation.","why_ko":"Abandonner ou sauter casse le fil des fondations."}],"activity":{"type":"match","prompt":"Associe chaque phase à son contenu","left":["Phase A","Phase B","Phase C"],"right":["Fondations science et étiquette","Procédé, emballage, qualité, règles","Goût, chiffres, coûts, vente, projet"],"pairs":{"0":0,"1":1,"2":2},"hint1":"A comme bases.","hint2":"C comme clients et projet.","solution":"A fondations ; B cœur atelier ; C marché et projet."},"exercise":{"prompt":"Sur une feuille, dessine trois colonnes A, B, C et écris sous chacune un module que tu attends le plus. Colle la feuille près de ton espace de travail.","hint1":"Regarde la liste des modules sur l’accueil.","hint2":"Une ligne par colonne suffit.","solution":"Exemple : A « composition du baobab » ; B « emballage » ; C « coûts et vente ». Feuille datée et affichée."}},{"title":"Demander à ta prof et réviser","body":["Ta prof n’est pas une personne au téléphone. C’est un guide écrit dans le cours, toujours disponible hors ligne. Elle explique, donne des indices, et répond à des questions fréquentes grâce à une banque préparée.","Quand une réponse de quiz est fausse, lis pourquoi. Puis reessaie. Le bouton « Je n’ai pas compris » reformule la leçon avec une image du quotidien.","Pour réviser: rouvre les leçons où ton score quiz était bas. Refais seulement quiz et activité. Relis la carte simple. Garde l’expert pour un jour calme.","Note tes questions récurrentes dans ton carnet. Si la banque ne couvre pas un cas très précis de ton lot, écris l’observation et reprends-la quand le module procédé arrivera. La banque de questions comprend des clés: tape un mot comme humidité, moisissure, étiquette, lot, mains. Plus le mot est précis, plus la réponse sera utile. Si tu écris une question très locale (« mon lot de la semaine sent le renfermé »), note-la au carnet: les modules microbes et procédé t’y ramèneront avec méthode.","Quand tu revises, tu relis d’abord ta note datée, puis tu refais le quiz à voix basse. Une révision courte et régulière ancre mieux qu’une longue soirée rare. Note ce qui reste flou pour la prochaine question à ta prof."],"prof":"Parle-moi comme à une collègue patient. Dis: « je n’ai pas compris l’eau disponible » plutôt que « je suis nulle ». Je vais te redonner l’idée avec une image de cuisine. Pour les questions tapées, utilise des mots simples: humidité, moisissure, sachet, étiquette, clientèle. Je cherche alors dans ma banque. Je ne me fâche jamais pour une mauvaise réponse. Je fâche seulement (doucement) quand on invente un chiffre sur un sachet. Pour le reste, on recommence la carte.","tip":"Après chaque quiz raté, écris en une ligne ce que tu confondais.","simple":"C’est comme demander ton chemin au marché: tu nommes le stand que tu cherches. Ici tu nommes la notion. Plus c’est précis, mieux je te guide. Demander son chemin deux fois au marché n’est pas une honte. Redemander une notion deux fois non plus.","plus":"Banque de questions: clés de recherche (mots), question formulée, réponse courte ancrée Baobab Bliss, module lié. Pédagogie de l’erreur: feedback immédiat (why_ok / why_ko) supérieur au score nu. Révision espacée: J+1, J+7, J+30 sur les leçons à score faible. Limite assumée: pas d’intelligence artificielle en ligne; pas de diagnostic médical; pas de conseil juridique personnalisé. Pour un cas labo ou export, tu croiseras plus tard avec un professionnel humain. Qualité d’une fiche prof: 40 à 90 mots, une action, une limite. Indexation par mots-clés normalisés. Révision espacée J+1, J+7, J+30 sur scores faibles. Pas de conseil médical ni juridique personnalisé dans la banque. La banque ne remplace pas un forum vivant: si une question revient souvent, elle mérite une fiche. Tu peux noter dans ton carnet « à ajouter plus tard » pour Rachid ou pour une mise à jour du cours. Reste dans le français simple pour les clés de recherche.","expert":"Design de la banque: inversion d’index sur tokens normalisés (minuscules, sans accents optionnel). Couverture cible: méta-cours, chimie pulpe, microbiologie, étiquetage, puis procédés. Qualité d’une fiche: réponse 40–90 mots, une action atelier, une limite (« à mesurer sur ton lot », « selon catégorie réglementaire »). Métrique interne de révision: leçons avec score quiz inférieur à 75 % marquées « à revoir ». Exemple (indicatif): 70 fiches sur les modules M0–M3 × 60 mots ≈ 4 200 mots de dialogue prof, soit l’équivalent d’un petit fascicule de tutorat. Ne jamais inventer un seuil légal dans une réponse prof: renvoyer vers la lecture de l’annexe ou du labo. Couverture cible batch A: méta-cours, chimie pulpe, microbio, étiquetage — environ 70 fiches. Exemple (Exemple): clé « aflatoxine » renvoie à isolation de lot + labo + lecture d’annexe, sans seuil inventé. Métrique interne: leçon sous 75 % au quiz marquée à revoir. Architecture fiche: keys[], q, a, mod. Réponse: définition courte + geste Baobab Bliss + limite. Exemple (Exemple): question « puis-je diluer un lot moisi ? » vers non, isolation, règle écrite. Couverture batch A ~70 fiches. Exclusion: dosages médicaux, prix d’équipements, conseils d’investissement Robinhood, secrets Clover. Révision: espacement J+1/J+7/J+30. Références opérationnelles: CTI R&O 2026 (architecture ECTS, stages, anglais B2); RNCP blocs formuler/dimensionner/analyser/maîtriser/piloter, dans le contexte précis de cette leçon. Exemple (Exemple): auto-évaluation trimestrielle sur une grille à 5 lignes (rythme, carnet, hygiène, étiquette, questions ouvertes), dans le contexte précis de cette leçon. Livrable M0: objectif 12 mois + feuille phases A/B/C affichée, dans le contexte précis de cette leçon. Exemple (Exemple): trois questions posées à ta prof sur « humidité », réponses résumées au carnet. Tu confrontes le résultat à une limite écrite avant de décider la suite, près de bassine bleue.","quiz":[{"q":"Ta prof est…","choices":["Un guide écrit hors ligne dans le cours","Une enseignante joignable par appel chaque soir","Un robot payant sur internet"],"correct":0,"why_ok":"Elle vit dans le fichier, sans connexion ni honoraires.","why_ko":"Pas d’appel live ni de service payant ici."},{"q":"Que faire après une mauvaise réponse au quiz ?","choices":["Ignorer et passer à un autre module au hasard","Effacer ton score pour oublier","Lire l’explication, puis réessayer"],"correct":2,"why_ok":"Le feedback puis le nouvel essai ancrent la notion.","why_ko":"Ignorer ou effacer n’enseigne pas."},{"q":"Comment réviser efficacement ?","choices":["Refaire quiz et activité des leçons faibles","Relire seulement l’expert une fois par an","Changer toutes les réponses sans lire"],"correct":0,"why_ok":"Tu cibles ce qui a glissé, avec peu de temps.","why_ko":"L’expert rare ou le hasard ne remplacent pas la révision active."},{"q":"Si la banque ne connaît pas ton cas de lot très précis ?","choices":["Tu notes l’observation et tu la reprendras au module procédé","Tu arrêtes toute production","Tu inventes une règle sanitaire"],"correct":0,"why_ok":"Le carnet garde le cas pour plus tard, sans inventer.","why_ko":"Inventer une règle ou tout stopper n’est pas la méthode du cours."}],"activity":{"type":"case","prompt":"Cas prof","story":"Tu confonds humidité et activité de l’eau après le quiz.","q":"Premier geste utile ?","choices":["Jeter tous les sachets sans noter","Écrire un chiffre inventé sur l’étiquette","Ouvrir « Je n’ai pas compris » puis chercher « eau » chez ta prof"],"correct":2,"why_ok":"Tu clarifies d’abord avec les outils du cours.","why_ko":"Jeter ou inventer ne corrige pas la confusion."},"exercise":{"prompt":"Pose trois questions courtes à ta prof (par la recherche du cours) sur un thème que tu crains : eau, moisissure ou étiquette. Note les réponses dans ton carnet.","hint1":"Une question égale un sujet.","hint2":"Recopie la réponse en résumé.","solution":"Exemple : 1) « L’activité de l’eau, c’est quoi ? » 2) « Comment ranger un sachet ouvert ? » 3) « Que mettre comme dénomination ? » : trois résumés datés."}},{"title":"Éthique, sources et limites","body":["Tu ne inventes pas de chiffres sur ton étiquette. Tu ne promets pas de guérir. Tu ne copies pas le texte d’un autre producteur en le présentant comme le tien. Baobab Bliss gagne par la netteté et l’honnêteté.","Dans ce cours, les exemples chiffrés d’école portent la mention « Exemple » quand les nombres sont inventés pour calculer. Les fourchettes publiées sur la pulpe sont présentées comme des ordres de grandeur issus d’études, à confirmer sur ton lot.","Le cours ne remplace pas un laboratoire, ni un avocat, ni un médecin. Pour un contrôle officiel ou un export, tu t’appuieras sur des analyses et des interlocuteurs compétents.","Quand tu ne sais pas, tu écris « à mesurer » ou tu laisses le champ vide plutôt que d’afficher une valeur fantaisie. C’est déjà le réflexe d’une responsable qualité. Tu peux afficher sur ton mur trois règles: pas de chiffre inventé, pas de promesse médicale, pas de mélange d’un lot douteux dans un lot sain. Cela résume l’éthique Baobab Bliss. Quand une source du cours cite une fourchette, retiens le mot « fourchette ». Ton arbre d’Ouagadougou n’est pas un laboratoire moyen d’un autre pays."],"prof":"Je serai stricte et douce sur ce point. Si tu me demandes un miracle santé pour vendre plus, je te ramènerai à une phrase honnête: cent pour cent pulpe, goût, usage en boisson ou cuisine. Pour un chiffre d’humidité ou de vitamine, on dira d’où il vient ou on attendra ton bulletin d’analyse. Si tu me demandes un slogan vendeur douteux, je te propose trois phrases sobres à la place. La confiance se construit plus lentement, mais elle tient la saison des pluies.","tip":"Sur ton brouillon d’étiquette, barre au crayon toute phrase qui promet un effet sur le corps.","simple":"Au marché, si tu ne connais pas le prix d’un article, tu ne cries pas un montant au hasard. Tu vérifies. Pareil pour les chiffres de ton sachet. Le commerçant qui pèse juste garde ses clientes. L’étiquette juste fait la même chose pour toi.","plus":"Éthique professionnelle IAA: loyauté de l’information (cadre français et européen de l’information consommateur), absence de allégations de santé non autorisées, traçabilité des lots, responsabilité de l’exploitant. Sources du cours: programmes d’écoles, règlements européens publics, catalogue de normalisation burkinabè, revues sur Adansonia digitata. Hiérarchie: mesure sur ton lot > bulletin labo > fourchette publiée citée > champ vide. Interdit pédagogique: inventer un seuil légal « parce que ça sonne juste ». Hiérarchie des preuves: mesure sur lot, bulletin labo, fourchette publiée citée, champ vide. Food Law 178/2002: responsabilité de l’opérateur. 1169/2011 et 1924/2006: loyauté de l’information et allégations. NBF 01-212:2018 listée ABNORM: obtenir le texte avant d’en citer des seuils. L’éthique couvre aussi les photos de clientes et les témoignages: pas de détournement, pas de maladie citée pour vendre. Sur WhatsApp, les mêmes règles que sur le sachet. Le cours refuse le sensationnalisme. Tu distingués ce que tu as mesuré, ce que tu as lu, et ce que tu estimes. Sur une étiquette ou un message, tu n’empruntes un chiffre que s’il vient d’un bulletin ou d’une source que tu peux montrer. Le doute s’écrit aussi: « à confirmer » protège mieux qu’une affirmation trop belle.","expert":"Cadre juridique (aperçu expert): règlement (UE) 1169/2011 sur l’information des consommateurs; règlement (CE) 1924/2006 sur les allégations nutritionnelles et de santé (listes positives, conditions); règlement (CE) 178/2002 (Food Law): responsabilité de l’opérateur, traçabilité, retrait. Au Burkina: norme NBF 01-212:2018 « Pulpe du fruit de baobab (pain de singe) — Spécifications » listée au catalogue ABNORM 2025 (texte intégral des spécifications à obtenir auprès de l’organisme de normalisation — ne pas inventer les seuils). UEMOA règlement 007/2007 sur la sécurité sanitaire. Règle de rédaction du cours: tout « Exemple » numérique d’exercice est fictif et étiqueté; toute fourchette vitaminique ou minérale issue de la littérature est présentée avec variabilité géographique (ex. vitamine C de la pulpe rapportée dans une plage large selon origines et méthodes). Limite: ce fichier n’est pas un avis juridique. Limite documentaire: le catalogue ABNORM 2025 confirme le titre de la norme baobab; le texte intégral des spécifications n’est pas recopié ici. UEMOA 007/2007 cadre régional. Exemple (Exemple): refuser d’écrire « vitamine C = 300 mg » sans bulletin, même si une étude étrangère cite un ordre voisin. Cartographie sources: CTI/RNCP (cadre diplôme), EUR-Lex (178/2002, 852/2004, 1169/2011, 1924/2006, 2073/2005, 2023/915), agriculture.gouv.fr (paquet hygiène), ABNORM catalogue 2025 (NBF 01-212:2018 titre confirmé), Chadare 2009 et travaux Cissé/Nour/Soloviev (composition). Exemple (Exemple): citation orale « souvent décrit comme riche en vitamine C dans les études » vs écriture chiffrée interdite sans bulletin. Non vérifié ici: texte intégral NBF 01-212; catégorie exacte aflatoxines pour poudre baobab. Exemple (Exemple): une phrase médicale barrée sur le brouillon d’étiquette avant photo.","quiz":[{"q":"Que faire si tu n’as pas encore d’analyse labo pour un nutriment ?","choices":["Copier le chiffre d’une publicité étrangère","Laisser vide ou écrire « à mesurer », sans inventer","Mettre un beau chiffre pour rassurer"],"correct":1,"why_ok":"L’honnêteté prime : vide ou « à mesurer ».","why_ko":"Inventer ou copier une pub trompe la cliente."},{"q":"Peux-tu promettre sur le sachet que la pulpe guérit une maladie ?","choices":["Oui, si une voisine l’a dit","Oui, si le goût est bon","Non, le cours interdit les promesses médicales"],"correct":2,"why_ok":"Aucune allégation médicale dans Baobab Bliss.","why_ko":"Le goût ou un témoignage oral ne créent pas une autorisation."},{"q":"À quoi sert la mention « Exemple » devant certains nombres du cours ?","choices":["Remplacer une norme officielle","Prouver un résultat de ton dernier lot","Signaler un nombre inventé pour s’entraîner à calculer"],"correct":2,"why_ok":"Tu t’exerces sans confondre avec tes mesures réelles.","why_ko":"Ce n’est ni ton lot ni une norme."},{"q":"Le cours remplace-t-il un laboratoire ?","choices":["Non, il t’aide à poser les bonnes questions","Oui, pour l’export seulement","Oui, entièrement"],"correct":0,"why_ok":"Les analyses restent le travail du labo.","why_ko":"Aucun écran ne remplace un bulletin d’essai."}],"activity":{"type":"tf","prompt":"Vrai ou faux : éthique Baobab Bliss","statements":[{"t":"Tu peux inventer un taux de vitamine pour remplir l’étiquette.","truth":false,"why":"Chiffre labo ou champ vide."},{"t":"Les exemples marqués « Exemple » servent à s’entraîner.","truth":true,"why":"Nombres d’école, pas ton lot."},{"t":"Une promesse de guérison sur le sachet est acceptée dans ce cours.","truth":false,"why":"Interdit : pas de claim médical."}]},"exercise":{"prompt":"Prends ton brouillon d’étiquette (ou une feuille blanche). Liste trois phrases que tu pourrais écrire honnêtement dès maintenant, et une phrase que tu refuses d’écrire.","hint1":"Honnête : composition, origine, usage culinaire.","hint2":"À refuser : promesse sur le corps.","solution":"Exemple honnête : « Pulpe de baobab 100 % », « Ouagadougou », « À diluer dans l’eau froide ». À refuser : « Guérit la fatigue ». "}}],"m1":[{"title":"L’eau et l’activité de l’eau","body":["Dans un aliment, l’eau totale (humidité) et l’eau disponible ne disent pas la même chose. L’humidité est une masse d’eau rapportée à la masse du produit. L’activité de l’eau décrit combien cette eau est libre pour les microbes, les réactions chimiques ou le collage de la poudre.","La pulpe de baobab est déjà naturellement sèche dans la gousse. Ton travail Baobab Bliss, ce n’est pas un séchage chaud comme pour une mangue future. C’est extraire, séparer, tamiser, puis contrôler que la poudre reste sèche, libre et propre jusqu’au sachet.","Si la poudre reprend de l’humidité ambiante (saison des pluies, sachet mal fermé), elle peut former des grumeaux et offrir un terrain plus favorable aux moisissures. Un stockage au sec et un emballage bien refermé protègent ton lot.","Pour tes futurs fruits séchés (mangue, tomate, oignon…), tu suivras humidité et activité de l’eau en fin de séchage. Dès maintenant, touche ta poudre, note la date et le lot, et range les sachets ouverts dans une boîte sèche. Quand tu pourras accéder à un hygromètre de pièce, note l’humidité relative près du stock le matin et l’après-midi. Cela t’explique pourquoi la poudre colle plus certains jours. Une finition de séchage très douce n’est envisagée que si une mesure montre une humidité trop haute, pas par habitude. Sur baobab, l’habitude c’est contrôler, pas chauffer."],"prof":"Imagine un linge épais: deux linges peuvent peser la même eau, mais l’un la garde prisonnière dans les fibres et l’autre la laisse libre. L’activité de l’eau parle de cette liberté. Sur ton pain de singe, surveille surtout la reprise d’humidité après ouverture. Si tu sens des grumeaux nouveaux, note le lot avant de décider quoi faire. Si tu n’as pas d’aw-mètre, tu n’es pas bloquée: toucher, grumeaux, odeur, date, emballage. Plus tard le chiffre viendra. Je préfère ton observation honnête à un nombre copié.","tip":"Après ouverture d’un sachet, referme-le aussitôt et glisse-le dans une boîte sèche dédiée.","simple":"L’éponge et le bol d’eau: même « quantité » d’idée d’eau, mais l’éponge retient et le bol laisse libre. L’activité de l’eau ressemble à cette liberté, pas seulement au poids d’eau. Le mil stocké dans un sac mal fermé sous la pluie s’alourdit. Ta poudre aussi « boit » l’air humide si le sachet respire trop.","plus":"Humidité base humide: masse d’eau divisée par masse totale. Humidité base sèche: masse d’eau divisée par masse de solide sec. Activité de l’eau (aw): rapport entre la pression de vapeur d’eau du produit et celle de l’eau pure à la même température (approximation courante). Isothermes de sorption: relient humidité d’équilibre et aw à température fixe. Modèles BET (région monocouche) et GAB (plus large domaine alimentaire). Cible pratique souvent citée pour limiter la croissance microbienne générale: aw vers 0,60–0,65 ou moins (ordres de grandeur littérature alimentaire). Paramètres GAB spécifiques à la pulpe de baobab: peu publiés — à mesurer sur place si tu industrialises. hb et db se convertissent: X=hb/(1−hb). aw≈p/p0. Isothermes GAB à trois paramètres. Cibles microbiennes générales souvent vers aw ≤ 0,60–0,65 (littérature). Paramètres GAB baobab: rarement publiés — mesure locale si montée en échelle. Mesure pratique sans aw-mètre: observation sensorielle + contrôle d’emballage + hygrométrie de pièce si disponible. Avec labo: étuve humidité + aw à T contrôlée. Interpréter toujours à la même température de mesure.","expert":"Définitions. Soit m_eau la masse d’eau et m_tot la masse totale: humidité hb = m_eau / m_tot. Humidité db X = m_eau / m_sec avec m_sec = m_tot − m_eau, d’où hb = X/(1+X) et X = hb/(1−hb). Activité de l’eau: aw = f/f0 ≈ p/p0 (fugacité ou pression de vapeur relative). Isotherme GAB: X = (X_m , C , K , aw) / [(1 − K, aw), (1 − K, aw + C, K, aw)], où X_m est la monocouche (g eau / g MS), C et K des constantes du modèle (0 < K ≤ 1 typiquement). La zone proche de X_m est souvent associée à une meilleure stabilité (moins d’oxydation et de Maillard) selon Labuza et travaux dérivés. Exemple (nombres d’école, mention Exemple): hb = 0,08 ⇒ X = 0,08/0,92 ≈ 0,087 g/g MS. Si une isotherme fictive donne aw ≈ 0,35 à cette X, tu es sous les seuils de croissance de la plupart des bactéries pathogènes, mais les moisissures xerophiles peuvent encore intervenir selon espèce et température — d’où hygiène et emballage. Mesure: étuve pour humidité; aw-mètre à température contrôlée pour aw. Incertitude et calibration: suivre la fiche de ton labo. Décision atelier: accepter, ré-étuver doucement seulement si nécessaire (finition), ou écarter un lot qui a repris l’humidité avec signes de moisissure. Exemple (Exemple): hb=0,08 ⇒ X≈0,087 g/g MS. Décision: accepter, finition douce si besoin, ou écarter si moisissure. Calibration aw-mètre selon fiche labo. Lien emballage: film à faible perméabilité vapeur d’eau allonge le temps avant aw critique. Conversion hb↔db; GAB X=(Xm C K aw)/[(1−K aw)(1−K aw+C K aw)]. Monocouche Xm souvent zone de meilleure stabilité (Labuza). Exemple (Exemple): Xm=0,08; C=10; K=0,7; aw=0,4 vers calculer X. Décision atelier baobab: pas de séchage chaud systématique; finition seulement si mesure le demande. Futurs fruits: courbes de séchage au module procédé. Exemple (Exemple): deux sachets du même lot, l’un bien fermé, l’autre ouvert 48 h, comparaison tactile.","quiz":[{"q":"L’activité de l’eau mesure surtout…","choices":["Le prix du fruit au marché","La couleur du sachet","La disponibilité de l’eau pour microbes et réactions"],"correct":2,"why_ok":"C’est la liberté de l’eau, pas un décor ni un prix.","why_ko":"Couleur et prix ne définissent pas l’activité de l’eau."},{"q":"Pour le pain de singe Baobab Bliss, le geste central aujourd’hui est…","choices":["Faire un séchage chaud en couche mince comme pour la mangue","Contrôler sécheresse, propreté et stockage après extraction","Ajouter de l’eau pour « réveiller » la pulpe"],"correct":1,"why_ok":"La pulpe est déjà sèche dans la gousse ; tu contrôles ensuite.","why_ko":"Le séchage chaud est pour d’autres produits futurs, pas le geste par défaut du pain de singe."},{"q":"Que peut provoquer une reprise d’humidité sur la poudre ?","choices":["Une disparition automatique des acides","Grumeaux et terrain plus favorable aux moisissures","Une étiquette plus lisible"],"correct":1,"why_ok":"L’humidité libre favorise collage et moisissures.","why_ko":"Ni l’étiquette ni les acides ne « s’améliorent » ainsi."},{"q":"Humidité et activité de l’eau sont-elles identiques ?","choices":["Non, l’une est une masse, l’autre une disponibilité","Oui, toujours le même chiffre","Oui, dès que le fruit est entier"],"correct":0,"why_ok":"Deux grandeurs liées mais distinctes.","why_ko":"Elles ne se confondent pas en un seul chiffre magique."}],"activity":{"type":"calc","prompt":"Calcule l’humidité base humide avec TES pesées (échantillon)","fields":[{"id":"humide","label":"Masse avant séchage labo ( g)"},{"id":"sec","label":"Masse après séchage labo ( g)"}],"note":"Si tu n’as pas encore de labo, laisse vide et note « à mesurer ». Sur baobab, ce calcul sert au contrôle, pas à un séchage systématique.","tip":"Utilise seulement tes chiffres réels."},"exercise":{"prompt":"Choisis un sachet ouvert et un sachet fermé de la même période. Touche la poudre, note date, lot, sensation (libre ou grumeaux), lieu de stockage.","hint1":"Lave-toi les mains avant de toucher.","hint2":"Une ligne par sachet dans le carnet.","solution":"Exemple : « Lot 12 : sachet fermé : poudre libre : boîte sèche. Lot 12 : sachet ouvert depuis 3 jours : léger grumeau : à finir vite et à mieux refermer. »"}},{"title":"Glucides, fibres et pectine","body":["La pulpe de baobab est surtout riche en glucides. On y trouve des sucres simples qui donnent une note sucrée, et des fibres, dont des substances pectiques qui épaississent légèrement quand tu dilues la poudre dans l’eau.","Les fibres insolubles et solubles n’agissent pas pareil en bouche ni en boisson. La pectine, fibre soluble, aide à former une texture un peu « liée ». C’est utile pour une boisson ou une bouillie, sans rien ajouter si tu restes sur cent pour cent pulpe.","D’une région à l’autre, les teneurs varient. Les études publient des fourchettes, pas une seule vérité pour Ouagadougou. Ton lot peut différer: seul un dosage labo parle pour ton sachet.","Pour tes futurs produits (confiture de mangue, coulis…), la pectine du baobab a même été étudiée comme aide gélifiante. Chez Baobab Bliss aujourd’hui, tu n’ajoutes rien: tu comprends juste pourquoi ta poudre « tient » un peu dans l’eau. Le tamisage change aussi la perception en bouche: une poudre plus fine se disperse autrement. Note la maille approximative de ton tamis dans le carnet pour répéter un lot apprécié. Si tu testes une confiture future avec ta pulpe comme aide gélifiante, ce sera un autre produit, clairement nommé, pas le sachet 100 % pulpe."],"prof":"Quand tu prépareras une boisson pour une cliente, observe si elle épaissit après quelques minutes. Ce n’est pas un défaut: les fibres et la pectine travaillent. Si tu veux une boisson plus fluide, tu ajustes la dose de poudre et l’eau, toujours sans additif si telle est ta promesse. Pour la cliente qui trouve la boisson « trop collante », propose d’abord moins de poudre, pas un additif. Tu restes alignée avec ta promesse.","tip":"Note la dose de poudre et le volume d’eau de ta boisson test, avec la date.","simple":"C’est un peu comme le farine de mil dans la bouillie: selon la quantité, le liquide se lie. Les fibres du baobab jouent un rôle voisin dans ta tasse. La farine de pois chiche et la farine de mil ne lient pas l’eau pareil. Les fibres du baobab ont leur propre manière: tu l’apprivoises par essais notés.","plus":"Proximate analysis typique (ordres de grandeur littérature): glucides totaux souvent majoritaires (souvent au-delà de 70 g pour 100 g selon études et bases de calcul); fibres brutes ou alimentaires rapportées dans des plages variables (ex. quelques grammes à près de 10 g pour 100 g selon méthode). Pectine: valeurs très dispersées selon protocole (de l’ordre de 2 à 3 % dans certaines études jam, jusqu’à des chiffres très élevés dans d’anciennes sources sur « pectin » — traiter avec prudence et citer la méthode). Sucres libres: fructose, glucose, saccharose détectés; amidon souvent absent ou négligeable dans la pulpe sèche (Nour et al., confirmations ultérieures). Variabilité géographique: toujours rappeler Chadare et revues. Sucres libres détectés: glucose, fructose, saccharose. Amidon souvent absent. Pectine: valeurs très variables selon protocole (prudence). Proximate: glucides souvent >70 g/100 g selon études — fourchettes, pas norme Olga. En bouche, distinguer sucré, acide, astringent, lié. La pectine contribue au lié. Un tamis plus fin change l’hydratation apparente. Documente maille et dose pour reproductibilité artisanale.","expert":"Classification: monosaccharides, disaccharides, oligosaccharides, polysaccharides (amidon, cellulose, hémicelluloses, pectines). Pectines: polymères d’acide galacturonique plus ou moins méthylés; degré d’estérification (DE) influence le mode de gélification (haut méthoxyle vs bas méthoxyle — en expert seulement). Pour un nectar ou une boisson, la viscosité apparente dépend de la concentration en poudre, du pH, des ions calcium et de la taille de particule après tamisage. Exemple (Exemple): 30 g de poudre dans 250 ml d’eau (ratio masse indicatif) — tu mesures au viscosimètre ou, en atelier, au temps d’écoulement dans un entonnoir standard maison. Décision produit: rester 100 % pulpe implique accepter la texture naturelle; un futur nectar pasteurisé suivra un barème thermique distinct (module procédé). Ne pas afficher un pourcentage de fibres sur l’étiquette sans bulletin aligné sur la méthode de déclaration nutritionnelle choisie. DE de pectine et ions calcium influencent la gélification (expert). Viscosité apparente: essais ratio poudre/eau. Exemple (Exemple): 30 g dans 250 ml, temps d’écoulement entonnoir. Déclaration fibres sur étiquette seulement avec méthode alignée. Polysaccharides pectiques: acide galacturonique, méthylation, DE. Gélification HM vs LM (calcium). Exemple (Exemple): ratio 1 c. à soupe pour une tasse vs 1 c. à café — viscosité perçue. Littérature jam: pectine baobab parfois ~2,5 % selon méthode, parfois chiffres anciens très élevés: toujours lire le protocole. Étiquette fibres: méthode AOAC/équivalente. Grandeurs et unités: hb (g/g), aw (sans dimension), pH, AT (g/100 g), L*a*b*, indice de peroxyde (méq O2/kg). Exemple (Exemple): tableau de suivi lot avec date, hb ou observation, couleur, acidité perçue 1–5, décision. Incertitude: toute mesure labo porte une incertitude; décide avec marge, pas au centième fantaisiste. Exemple (Exemple): 1 cuillère vs 2 cuillères dans le même volume d’eau, texture notée à 2 et 10 minutes.","quiz":[{"q":"Quel type de composé domine souvent la pulpe de baobab ?","choices":["Les glucides","Les matières grasses","Le sel de cuisine ajouté"],"correct":0,"why_ok":"Les analyses proximate placent les glucides en tête.","why_ko":"La pulpe est pauvre en lipides et tu n’ajoutes pas de sel dans la promesse 100 %."},{"q":"La pectine dans ta boisson peut…","choices":["Remplacer entièrement l’emballage","Lier un peu la texture sans additif","Annuler tout besoin d’hygiène"],"correct":1,"why_ok":"Fibre soluble qui contribue à la texture.","why_ko":"Elle ne remplace ni sachet ni hygiène."},{"q":"Les chiffres publiés sur les fibres sont…","choices":["Identiques pour tous les arbres du monde","Des fourchettes selon études et méthodes","Obligatoires sur ton sachet sans analyse"],"correct":1,"why_ok":"La littérature varie ; ton lot se mesure.","why_ko":"Pas de chiffre universel ni d’obligation d’inventer."},{"q":"Pour rester « cent pour cent pulpe », tu…","choices":["Ajoutes toujours de la gélatine","Mélanges une farine inconnue","N’ajoutes pas d’épaississant extérieur"],"correct":2,"why_ok":"Ta promesse produit reste pure pulpe.","why_ko":"Tout ajout casse la promesse actuelle de Baobab Bliss."}],"activity":{"type":"match","prompt":"Associe chaque idée à son rôle","left":["Sucres simples","Fibres et pectine","Promesse Baobab Bliss"],"right":["Goût sucré perçu","Texture un peu liée dans l’eau","Rien d’ajouté à la pulpe"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Le goût sucré vient surtout des sucres.","hint2":"La promesse exclut les additifs.","solution":"Sucres vers goût ; fibres vers texture ; promesse vers rien d’ajouté."},"exercise":{"prompt":"Prépare deux tasses : même volume d’eau froide, deux doses différentes de ta poudre. Note doses, temps, texture perçue (fluide, liée, grumeleuse).","hint1":"Utilise une cuillère toujours égale.","hint2":"Goûte après 2 minutes et après 10 minutes.","solution":"Exemple : « 1 c. à café pour une tasse : fluide à 2 min. 1 c. à soupe pour une tasse : plus liée à 10 min. Sans additif. »"}},{"title":"Vitamine C et sa dégradation","body":["La pulpe de baobab est connue dans la littérature pour des teneurs élevées en vitamine C, avec une grande variabilité selon l’origine, la maturité, le stockage et la méthode de dosage. Ce n’est pas un chiffre unique à coller sur tous tes sachets.","La vitamine C (acide ascorbique) craint la chaleur prolongée, la lumière, l’oxygène et un milieu trop basique. Elle se dégrade aussi pendant un stockage long si l’emballage laisse passer l’air et la lumière.","Pour Baobab Bliss: tu n’appliques pas un séchage chaud agressif sur une pulpe déjà sèche. Tu limites surtout le temps d’ouverture, la lumière directe et la chaleur du stockage. Tu gardes la promesse « rien d’ajouté » sans inventer un taux sur l’étiquette.","Si un jour tu pasteurises un nectar de baobab, le barème temps-température fera baisser une partie de la vitamine C: tu le mesureras en labo avant et après, au lieu de deviner. La gousse entière stockée à l’ombre peut mieux préserver certains composés sensibles que la poudre déjà ouverte. Planifie l’extraction selon ta capacité à conditionner vite. Pour un nectar futur pasteurisé, tu compareras vitamine C avant et après barème avec un labo, au lieu de promettre l’égalité."],"prof":"Beaucoup de clientes ont entendu dire que le pain de singe « contient beaucoup de vitamine C ». Toi, tu réponds avec calme: la littérature le décrit souvent ainsi, et ton sachet dira ce que ton analyse confirmera. En attendant, tu protèges la poudre de la lumière et tu refermes bien. C’est déjà de la vraie maîtrise. Refuse poliment d’improviser un taux sur WhatsApp. Dis: « Les études en décrivent souvent beaucoup; mon chiffre viendra du labo. »","tip":"Stocke tes sachets finis à l’abri du soleil direct, au sec.","simple":"Le citron coupé qui reste sur la table perd de sa vivacité. Ta poudre ouverte longtemps à la chaleur et à la lumière fatigue aussi ses composés sensibles. Le thé oublié au soleil perd son caractère. Ta poudre au soleil aussi fatigue ce qu’elle a de plus fragile.","plus":"Acide L-ascorbique: réducteur, soluble dans l’eau. Dégradation: oxydation en déhydroascorbate puis produits ultérieurs; accélérée par température, ions métalliques (cuivre, fer), pH défavorable, présence d’oxygène. Fourchettes publiées pour pulpe: très larges (exemples de travaux: de l’ordre de la centaine à plusieurs centaines de mg pour 100 g selon échantillon et méthode — toujours citer l’étude). Stockage en gousse entière à l’abri de la lumière peut mieux préserver que la poudre exposée (résultats expérimentaux rapportés au Nigeria et ailleurs). Étiquette: déclaration d’une vitamine seulement avec méthode et bulletin. Dégradation: oxydation, métaux, T, O2, pH. Fourchettes publiées très larges (centaines de mg/100 g selon travaux). Stockage gousse vs poudre: résultats expérimentaux variables. La lumière visible et UV accélère certaines oxydations. Un sachet opaque ou un suremballage carton aide. Évite la vitrine en plein soleil pour les sachets démo. Toute fourchette de composition doit rester étiquetée comme fourchette littéraire jusqu’à ton bulletin. La variabilité géographique du baobab est documentée depuis les revues de synthèse.","expert":"Cinétique (ordre 1 souvent utilisé en première approximation): C = C0 , exp(−k, t), avec k fonction d’Arrhenius k = k0 , exp(−Ea/(R, T)). Ea énergie d’activation (J/mol), R = 8,314 J/(mol, K), T température absolue. Exemple (Exemple): si k double quand T passe de 25 °C à 35 °C, le temps pour perdre 10 % de vitamine C est divisé par deux — schéma pédagogique, pas une mesure sur ton lot. En procédé nectar: pasteurisation 80 °C / 10 min citée dans des travaux sur nectar de baobab (Cissé et al.) comme barème étudié, avec impact organoleptique et nutritionnel à documenter. Pour la poudre sèche à basse aw, la mobilité des réactants baisse, ce qui ralentit certaines dégradations, mais l’oxydation de surface reste possible si l’O2 entre. Contrôle: emballage barrière, opaque ou secondaire opaque, chronométrage FIFO des lots. Cinétique ordre 1 et Arrhenius. Exemple (Exemple): si k double de 25 à 35 °C, temps pour −10 % divisé par deux. Pasteurisation nectar 80 °C / 10 min étudiée (Cissé et al.) — impact à mesurer. FIFO et barrière O2. C = C0 e^(−kt); k=k0 e^(−Ea/RT). Exemple (Exemple): Ea pédagogique telle que Q10≈2 entre 25 et 35 °C. Nectar: barème 80 °C / 10 min (travaux nectar baobab) — pertes vitaminiques à quantifier. Fourchettes pulp: ~125–500+ mg/100 g selon études (Cissé, Parkouda, Ibrahim, etc.). Ne pas figer un seul chiffre marketing. Grandeurs et unités: hb (g/g), aw (sans dimension), pH, AT (g/100 g), L*a*b*, indice de peroxyde (méq O2/kg), dans le contexte précis de cette leçon. Exemple (Exemple): tableau de suivi lot avec date, hb ou observation, couleur, acidité perçue 1–5, décision, dans le contexte précis de cette leçon. Incertitude: toute mesure labo porte une incertitude; décide avec marge, pas au centième fantaisiste, dans le contexte précis de cette leçon. Exemple (Exemple): pot opaque vs pot clair pendant 3 jours, comparaison couleur et odeur.","quiz":[{"q":"Pourquoi ne pas coller un taux unique de vitamine C sur tous tes sachets ?","choices":["Parce que l’étiquette interdit toute date","Parce que les teneurs varient selon lots et méthodes","Parce que la vitamine C n’existe pas dans le baobab"],"correct":1,"why_ok":"La littérature montre une forte variabilité ; le labo tranche pour ton lot.","why_ko":"La vitamine C est bien étudiée dans la pulpe ; la date reste un autre sujet."},{"q":"Quels facteurs fatiguent surtout la vitamine C ?","choices":["Le simple fait de tamiser à sec une fois","Écrire le nom Baobab Bliss","Chaleur prolongée, lumière, oxygène"],"correct":2,"why_ok":"Ce sont les leviers classiques de dégradation.","why_ko":"Tamiser une fois ou nommer la marque ne définissent pas la chimie."},{"q":"Pour ta poudre actuelle, le bon réflexe est…","choices":["Limiter ouverture, lumière et chaleur de stockage","Ajouter un médicament dans le sachet","Bouillir la poudre sèche une heure chaque jour"],"correct":0,"why_ok":"Protection douce, sans traitement agressif inutile.","why_ko":"Ni ébullition quotidienne de la poudre ni médicament."},{"q":"Avant d’écrire un chiffre de vitamine sur l’étiquette, tu…","choices":["Attends un bulletin d’analyse fiable","Inventes un nombre rond","Copies une publicité vue en ligne"],"correct":0,"why_ok":"Le bulletin guide la déclaration.","why_ko":"Pub et invention ne valent pas une analyse."}],"activity":{"type":"order","prompt":"Ordre pour protéger la vitamine C de ta poudre","steps":["Refermer le sachet après usage","Ranger à l’abri du soleil","Éviter un stockage très chaud","Noter le lot et la date"],"correct":[0,1,2,3],"hint1":"On commence par refermer.","hint2":"La trace écrite clôt la série.","solution":"Refermer, ombre, fraîcheur relative, traçabilité."},"exercise":{"prompt":"Place deux petites portions de poudre dans deux pots propres : l’un opaque fermé au frais relatif, l’autre transparent près d’une fenêtre. Après trois jours, compare odeur, couleur, grumeaux. Note sans conclure médicalement.","hint1":"Même lot source.","hint2":"Ne goûte pas un essai douteux.","solution":"Exemple : « Pot opaque : couleur stable, odeur nette. Pot clair : légère pâleur, odeur plus plate. Conclusion atelier : mieux vaut opaque et fermé. »"}},{"title":"Acides organiques et pH","body":["Le goût acidulé du pain de singe vient surtout d’acides organiques naturels: citrique, tartrique, malique, succinique, et aussi l’acide ascorbique. Le pH de la pulpe est bas, souvent autour de valeurs acides rapportées près de 3,3 dans certaines études.","Un pH bas freine beaucoup de bactéries. Il ne remplace pas la propreté: moisissures et certaines levures tolèrent mieux l’acidité. Tu combines donc acidité naturelle, basse disponibilité en eau, et gestes d’hygiène.","L’acidité titrable (quantité d’acides) et le pH (intensité acide perçue sur une échelle) ne sont pas la même mesure. Deux lots peuvent avoir des profils différents selon l’arbre et la saison.","En boisson, l’acidité rafraîchit. En futur nectar pasteurisé, elle influence aussi la survie microbienne et le choix du barème. Note le goût de chaque lot: plus acide, plus doux, plus astringent. Standardise toujours le même ratio poudre sur eau pour comparer deux lots au papier pH ou à la dégustation. Sinon tu compares des boissons différentes, pas des lots. Note aussi l’astringence: sensation de rêche en bouche, distincte de l’acidité vive.","L’acidité guide aussi ce que tu promets au goût: une pulpe trop douce pour une cliente habituée à l’acidulé n’est pas « mauvaise », elle est différente. Tu notes le lot et tu ajustes le message, pas la chimie inventée."],"prof":"Quand une cliente dit « c’est trop acide », tu peux diluer un peu plus ou mélanger avec une bouillie selon l’usage familial, sans sucre ajouté si tu veux garder la ligne produit pure en sachet. Sur le sachet lui-même, tu décris le produit sans promesse santé. En atelier, un carnet de dégustation par lot vaut de l’or. Si une cliente dit « trop acide », propose une dilution plus grande ou un usage en bouillie, sans sucre ajouté dans le sachet. Le sachet reste pur.","tip":"Goûte une pincée diluée de chaque nouveau lot et note acidité perçue de 1 à 5.","simple":"Le tamarin et le citron: tu reconnais l’acidité sans thermomètre. Le pH met un chiffre sur cette sensation, pour comparer tes lots avec calme. Le jus de tamarin et le jus de citron: deux acidités, deux souvenirs. Tes lots de baobab auront aussi leur signature; le carnet la capture.","plus":"pH = −log10[H+]. Échelle 0–14; 7 neutre. Pulpe baobab: pH ≈ 3,3 (Nour et al. 1980, cité dans les revues). Acidité libre totale rapportée par Soloviev et al.: environ 6,5–11,2 g équivalents acide malique pour 100 g de matière sèche (plage). Mesure atelier basique: papier pH ou pH-mètre sur suspension aqueuse de poudre à ratio fixé. Standardiser le ratio eau/poudre sinon tu compares des choses incomparables. pH≈3,3 (Nour et al.). Acidité libre 6,5–11,2 g éq. malique /100 g MS (Soloviev et al.). Mesure: papier ou pH-mètre sur suspension standardisée. L’acidité oriente aussi les associations culinaires: boisson froide, bouillie, sauces. Note les retours clientes sans transformer cela en claim santé. Le carnet sensoriel alimente le module goût (M8). Toute fourchette de composition doit rester étiquetée comme fourchette littéraire jusqu’à ton bulletin, dans le contexte précis de cette leçon. La variabilité géographique du baobab est documentée depuis les revues de synthèse, dans le contexte précis de cette leçon.","expert":"Relation pH / conservation: en dessous de pH 4,5 environ, la germination des spores de Clostridium botulinum dans les conserves est contrôlée par d’autres règles (cadre des appertisés) — peu central pour une poudre sèche, mais utile si tu lances un nectar. Pour une poudre à basse aw, le pH agit surtout sur la flore résiduelle et sur le goût. Titration: acidité titrable AT (°C ou g/100 g) selon norme labo (soude, indicateur ou pH-métrie). Exemple (Exemple): 10,00 g de poudre + 100 ml d’eau distillée; titration jusqu’à pH 8,1; AT calculée en g d’acide malique / 100 g. Décision sensorielle: si AT monte et que les clientes du quartier froncent le nez, tu ajustes la dose d’usage recommandée sur la notice, pas la composition (toujours 100 % pulpe). Interférence: particules non dissoutes faussent le pH — filtrer ou laisser décanter selon protocole. Lien conservation et pH 4,5 dans les appertisés (contexte différent). Titration jusqu’à pH 8,1. Exemple (Exemple): 10 g + 100 ml, AT en g malique/100 g. Filtrer les particules pour limiter les biais. pH=−log10[H+]. AT par titration. pH≈3,3 (Nour). AT 6,5–11,2 g éq. malique/100 g MS (Soloviev). Exemple (Exemple): protocole 10,00 g + 100 ml, titration pH 8,1. Lien barrière microbienne partielle. Pour nectar futur: pH oriente barème et type de spoilage (levures/moisissures). Exemple (Exemple): même ratio poudre sur eau pour lots A et B, scores d’acidité 4 et 3. Les acides organiques dominants de la pulpe (citrique, malique, tartrique selon les analyses publiées) abaissent le pH d’une suspension aqueuse. Un pH bas freine beaucoup de bactéries pathogènes végétatives, mais laisse intactes certaines levures et moisissures: ce n’est pas une stérilisation. Exemple (nombres inventés pour l’exercice): suspension 10,00 g de poudre dans 100 ml d’eau distillée; pH lu 3,2; tu compares au lot précédent 3,5 sous le même protocole. L’acidité titrable (meq ou g d’acide citrique équivalent jusqu’à pH 8,1) complète le pH: deux lots au même pH peuvent différer en « punch » acidulé. Pour un nectar futur, le seuil classique pH 4,6 oriente le type de barème (pasteurisation plutôt que stérilisation commerciale des aliments peu acides), mais tu mesures toujours ton produit réel avant de choisir un traitement thermique.","quiz":[{"q":"Le goût acidulé du pain de singe vient surtout…","choices":["Du plastique du sachet","De vinaigre ajouté en atelier","D’acides organiques naturels de la pulpe"],"correct":2,"why_ok":"Citrique, tartrique, malique et autres acides naturels.","why_ko":"Ni vinaigre ajouté ni sachet ne créent ce goût typique."},{"q":"Un pH bas suffit-il à lui seul pour remplacer l’hygiène ?","choices":["Oui, les moisissures détestent toujours l’acidité au point de disparaître","Non, tu combines acidité, basse eau disponible et propreté","Oui, plus besoin de laver les mains"],"correct":1,"why_ok":"L’acidité aide mais ne remplace pas les gestes.","why_ko":"Moisissures et mauvaises pratiques restent possibles."},{"q":"pH et acidité titrable…","choices":["Mesurent deux choses liées mais distinctes","Sont toujours strictement le même chiffre","Servent uniquement à fixer le prix"],"correct":0,"why_ok":"Intensité versus quantité d’acides.","why_ko":"Ce ne sont ni un doublon exact ni un outil de prix."},{"q":"Pour comparer le pH de deux lots, tu…","choices":["Changes le ratio à chaque fois au feeling","Utilises le même ratio poudre sur eau et la même méthode","Goûtes seulement sans rien noter"],"correct":1,"why_ok":"La standardisation rend la comparaison honnête.","why_ko":"Sans méthode fixe, tu compares du vent."}],"activity":{"type":"tf","prompt":"Vrai ou faux : acidité","statements":[{"t":"Le pH bas freine beaucoup de bactéries.","truth":true,"why":"Milieu acide peu favorable à nombre d’entre elles."},{"t":"Les moisissures sont toujours impossibles en milieu acide.","truth":false,"why":"Plusieurs tolèrent l’acidité."},{"t":"Noter le goût de chaque lot aide la régularité Baobab Bliss.","truth":true,"why":"Carnet sensoriel utile."}]},"exercise":{"prompt":"Prépare une suspension simple (même cuillère de poudre, même verre d’eau) pour deux lots différents. Goûte et note acidité 1 à 5, sans matériel si tu n’as pas de papier pH.","hint1":"Même température d’eau.","hint2":"Rince ta bouche entre les deux.","solution":"Exemple : « Lot A : acidité 4 sur 5. Lot B : 3 sur 5. Même ratio. Date notée. »"}},{"title":"Minéraux de la pulpe","body":["La pulpe apporte aussi des minéraux. Les études citent souvent le potassium et le calcium en têtes de liste, avec du magnésium et des oligoéléments (fer, manganèse, cuivre) en plus petites quantités. Les valeurs changent selon le sol, le climat et la méthode.","Ces minéraux intéressent la nutrition, mais tu ne transformes pas ton sachet en médicament. Sur l’étiquette, tu n’affirmes un minéral que si ton analyse et les règles d’étiquetage le permettent.","La teneur en cendres (résidu après incinération au labo) donne une idée de la fraction minérale globale. Ce n’est pas un détail à inventer: c’est une mesure de laboratoire.","Pour l’atelier: les minéraux ne se « voient » pas à l’œil. Ce qui se voit, ce sont les impuretés (sable, fragments de coque). Le tamisage et le tri protègent autant la confiance de la cliente que la composition. Le tri des coques et du sable protège aussi l’image minérale: une cendre « sale » peut venir de poussière, pas seulement du fruit. Quand le budget labo arrivera, priorise d’abord humidité et hygiène, puis un profil minéral si tu veux une allégation nutritionnelle précise."],"prof":"Si une cliente demande « il y a du calcium ? », tu peux dire que la littérature en décrit souvent dans la pulpe, et que tu feras analyser ton lot quand tu construiras le tableau nutritionnel. En attendant, tu parles goût, usage et pureté. C’est plus digne qu’un chiffre inventé. Je te déconseille les phrases « très riche en… » tant que le bulletin n’est pas là. « Souvent décrit dans les études » suffit à l’oral.","tip":"Sur le brouillon d’étiquette, réserve une ligne « minéraux : en attente d’analyse ».","simple":"Le sel dans la sauce: tu ne le vois pas grain par grain une fois fondu, mais tu le sens. Les minéraux de la pulpe sont cachés ainsi; seul le labo les compte vraiment. Les cailloux dans le riz se voient. Le sable dans la poudre se sent entre les dents. Le tamis est ton allié minéral autant que gustatif.","plus":"Exemples de ordres de grandeur publiés (une étude, pas une norme Baobab Bliss): potassium parfois centaines de mg pour 100 g; calcium également élevé comparé à beaucoup de fruits; magnésium présent; fer de l’ordre de quelques mg pour 100 g selon sources. Cendres: souvent quelques g pour 100 g. Toujours indiquer la référence et la base (frais ou sec). Contamination minérale externe (poussière) peut fausser cendres et métaux — d’où tri et hygiène. Ordres de grandeur publiés (une étude): K et Ca élevés, Mg présent, Fe quelques mg/100 g. Cendres quelques g/100 g. Toujours citer la source. Contamination minérale externe (poussière lateritique) fausse cendres et métaux. Travail sur nappe propre, bassin couvert, tri. Les oligoéléments d’intérêt nutritionnel ne se voient pas; les grains de sable se sentent. Les cendres totales donnent un ordre de grandeur minéral, pas le détail calcium ou fer. Une contamination par poussière ou sable augmente les cendres sans valeur nutritionnelle. Tu travailles sur surface propre et tu refuses les lots trop gritty au toucher. Quand tu cites un minéral, tu nommes l’étude ou le bulletin, jamais une moyenne inventée. Pour une mangue séchée future, le profil minéral changera: tu ne recopies pas les chiffres baobab sur un autre fruit.","expert":"Déclaration nutritionnelle UE (rappel): les minéraux ne se déclarent dans le tableau que s’ils sont présents en quantité significative selon les annexes du règlement 1169/2011 (seuils de « quantité significative » pour allégation ou déclaration — lire l’annexe XIII pour les VNR). Allégation « source de » / « riche en »: règlement 1924/2006 et annexes. Exemple (Exemple pédagogique): si une analyse fictive donne 80 mg de calcium / 100 g et que le seuil de quantité significative pour le calcium n’est pas atteint pour le mode de déclaration choisi, tu n’affirmes pas « source de calcium ». Méthodes: spectrométrie d’absorption atomique, ICP — hors atelier familial. Plan: un bulletin sur un lot pilote avant toute mention chiffrée. Burkina: aligner aussi sur les exigences locales d’étiquetage du canal de vente choisi. Déclaration UE: quantité significative et VNR (annexe XIII 1169/2011). Allégations « source de » / « riche en »: 1924/2006. Exemple (Exemple): calcium insuffisant pour allégation vers silence chiffré. ICP ou AAS au labo. Spectrométrie AAS/ICP. Déclaration: annexes 1169/2011 (VNR, quantité significative). Allégations 1924/2006. Exemple (Exemple): Fe 4,8 mg/100 g dans une étude (Ibrahim et al. ordre) — insuffisant pour conclure sur ton lot. Plan: un profil minéral sur lot pilote avant toute phrase chiffrée. Exemple (Exemple): refus d’écrire « riche en fer » malgré une insistante cliente du marché. La composition minérale de la pulpe varie selon sol, maturité et méthode analytique. Les publications rapportent souvent calcium, potassium, magnésium et phosphore en quantités non négligeables, et des oligoéléments (fer, zinc) à des teneurs beaucoup plus faibles et variables. Exemple (nombres inventés pour l’exercice): tu refuses d’imprimer « riche en fer » alors qu’un bulletin pilote donne un fer trop bas pour soutenir une allégation, et tu gardes seulement « source de calcium » si un jour un profil labo et les règles d’allégation le permettent. Les cendres insolubles dans l’acide aident à suspecter une charge minérale externe (sable). Un plan raisonnable: un profil minéral sur un lot pilote bien tracé avant toute phrase chiffrée sur sachet ou affiche. Les métaux lourds éventuels se lisent dans les annexes contaminants du marché visé, jamais par invention.","quiz":[{"q":"Quel minéral est souvent abondant dans les analyses de pulpe ?","choices":["L’or alimentaire","Le potassium (et souvent le calcium)","Le fluor ajouté en usine"],"correct":1,"why_ok":"K et Ca reviennent fréquemment dans les tableaux publiés.","why_ko":"Pas d’or ni de fluor ajouté dans ta promesse 100 %."},{"q":"Peux-tu afficher un taux de fer inventé pour « faire joli » ?","choices":["Oui, si le chiffre est petit","Non, seulement après analyse et règles d’étiquette","Oui, le week-end seulement"],"correct":1,"why_ok":"Honnêteté et conformité d’abord.","why_ko":"Ni la taille du chiffre ni le jour de la semaine n’autorisent l’invention."},{"q":"Les cendres au labo renseignent surtout…","choices":["Le nom de l’arbre","La date de péremption exacte","La fraction minérale globale"],"correct":2,"why_ok":"Résidu d’incinération lié aux minéraux.","why_ko":"Pas une date ni un nom d’arbre."},{"q":"Que protège le tamisage côté minéraux et confiance ?","choices":["Il limite sable et fragments indésirables","Il remplace toute analyse future","Il crée du calcium nouveau"],"correct":0,"why_ok":"Propreté physique du produit.","why_ko":"Il ne synthétise pas de minéraux ni ne remplace le labo."}],"activity":{"type":"case","prompt":"Cas étiquette","story":"Une voisine te conseille d’écrire « très riche en fer » sans analyse.","q":"Que fais-tu ?","choices":["Tu écris la phrase pour vendre plus vite","Tu refuses et tu attends un bulletin","Tu remplaces le fer par un médicament"],"correct":1,"why_ok":"Pas d’allégation sans base analytique et cadre légal.","why_ko":"Vitesse commerciale ou médicament : hors règles du cours."},"exercise":{"prompt":"Rédige trois phrases orales honnêtes pour répondre à « c’est bon pour quels minéraux ? » sans chiffre inventé.","hint1":"Appuie-toi sur « souvent décrit dans les études » + « mon lot sera analysé ».","hint2":"Termine par l’usage culinaire.","solution":"Exemple : « Les études parlent souvent de potassium et de calcium dans la pulpe. Mon lot sera analysé avant tout chiffre sur le sachet. En attendant, c’est une pulpe pure à diluer ou cuisiner. »"}},{"title":"Brunissement et réactions de couleur","body":["La couleur de ta poudre raconte une histoire. Un brunissement peut venir d’enzymes (sur fruits encore humides), de la réaction de Maillard (sucres et protéines à certaines humidités et chaleurs), ou d’une caramélisation à très haute température.","Sur le pain de singe déjà sec, tu surveilles surtout un brunissement lent lié au stockage (chaleur, humidité reprise, oxygène) et la contamination par des fragments sombres de coque. Le tri et le tamisage gardent une teinte plus régulière.","Pour une mangue ou une banane séchée futures, le brunissement enzymatique au début du procédé sera un vrai sujet: blanchiment, acidification, maîtrise du temps. Ce n’est pas le même geste que pour la pulpe de baobab.","Note la couleur de chaque lot (clair, moyen, foncé) à côté de la date. Une dérive soudaine te signale un problème de stockage ou de matière première. Photographie toujours au même endroit de la pièce pour limiter les biais de lumière. Une dérive vraie se voit mieux ainsi. Les fragments de coque sombre se retirent mieux avant tamisage fin. Prévois un temps de tri dans ton calcul de productivité."],"prof":"Garde un petit fond de sachet témoin de chaque lot dans une boîte opaque datée. Dans un mois, compare avec le stock de vente. Si le témoin reste stable et le stock a brunî, regarde emballage et chaleur du local. Tu deviens ainsi l’œil qualité de Baobab Bliss. Si le stock de vente a foncé et le témoin opaque non, regarde chaleur et emballage avant de blâmer le fruit entier.","tip":"Photographie chaque lot à la même place, même lumière du jour, pour comparer plus tard.","simple":"Le pain oublié trop près du feu fonce. Ta poudre aussi « fatigue » sa couleur si elle vit au chaud et à l’humidité. L’ombre et la sécheresse la ménagent. Le riz trop grillé ne redevient pas blanc. Une poudre trop brunie au stockage ne « guérit » pas non plus: on corrige le prochain lot.","plus":"Maillard: réactions complexes entre carbonyles (sucres réducteurs) et aminés (acides aminés, protéines); optimale à aw intermédiaire; produit mélanoïdines brunes. Enzymatique: polyphénol oxydases sur tissus endommagés humides. Caramélisation: sucres seuls à haute T. Mesure couleur: système L*a*b*, ΔE* pour l’écart. Sur baobab, protéines faibles: Maillard possible mais souvent moins spectaculaire que sur laits ou viandes; le stockage reste le levier pratique. Maillard vs enzymatique vs caramélisation. L*a*b* et ΔE*. Sur baobab, protéines faibles: Maillard souvent discret; stockage = levier. Le tri optique manuel (table claire) avant tamis réduit les points noirs. Forme les aides à retirer coque et fibres grossières selon un échantillon témoin « acceptable ». Le brunissement enzymatique (polyphénol oxydase) demande eau libre, oxygène et enzymes actives: il concerne surtout fruits frais coupés. Sur pulpe déjà sèche, le levier dominant est plutôt non enzymatique: chaleur, humidité reprise, lumière. La réaction de Maillard couple sucres réducteurs et acides aminés; elle accélère quand l’activité de l’eau n’est ni trop basse ni saturée. Sur baobab, les protéines sont faibles, donc Maillard reste souvent discret si le sachet reste sec et opaque. Tu photographies un témoin à J0 sous la même lumière pour juger J30 sans te fier à la mémoire.","expert":"Cinétique de brunissement non enzymatique souvent suivie par absorbance ou ΔE*. Modèle simple: dC/dt = k , f(aw, T, pH). aw trop basse ralentit; aw intermédiaire accélère Maillard. Exemple (Exemple): deux lots à 30 °C, aw 0,3 vs 0,6 (valeurs d’école) — le second brunit plus vite sur 60 jours dans une
