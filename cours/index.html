rsus contrôles faits. Une panne répétée sur le même outil demande une cause racine, pas seulement une réparation express. Forme chaque aide sur la fiche de fin de journée en cinq minutes chronométrées. Tiens un carnet d’entretien une ligne par outil: date, geste fait, qui, anomalie vue, prochaine échéance. Une balance hors tolérance sort de la ligne jusqu’à réglage, même si «ça a l’air juste». Stocke un tamis de rechange propre et emballé. Chronomètre cinq minutes de fin de journée: si tu dépasses souvent, la gamme est trop longue ou mal placée dans le flux.","expert":"Maintenance: préventive vs corrective; liste de contrôle courte; pièces d’usure; historique. Pour balances: contrôle métrologique interne régulier. Pour tamis: inspection toile. Exemple (nombres inventés pour l’exercice): balance, masse 500 g chaque lundi; tamis, inspection toile; table, lavage séchage. Pour Baobab Bliss: cinq minutes après le lot évitent la panne le jour de foire. Tu notes « ok » ou « à surveiller ». La maintenance commence par ce que tu touches vraiment, pas par un manuel fantôme. La maintenance préventive réduit la variance qualité (toile percée → granulométrie hors cible; balance dérivée → masses fausses). Une liste de contrôle courte après lot bat un grand plan jamais suivi. Tu historises les pannes pour voir les pièces d’usure. Pour Baobab Bliss: balance, tamis, soudeuse, tables. Cinq minutes notées. Quand un contrôle masse échoue, tu retires l’instrument jusqu’à correction. Le lien ingénieur: fiabilité machine = maîtrise process. Une panne répétée sur la même pièce déclenche une action structurelle (pièce de rechange, geste d’usage). Le carnet de maintenance devient une base de décision d’achat. Rien d’inventé: seulement ton historique. La maintenance préventive soutient la maîtrise process (esprit ISO 22000 sur les PRP opérationnels). Maintenance et PRP: esprit ISO 22000. Cinq minutes de liste de contrôle après lot battent un manuel de maintenance jamais ouvert.","quiz":[{"q":"Que privilégier au quotidien?","choices":["Cacher l’outil cassé","Attendre la casse","L’entretien de routine avant la panne"],"correct":2,"why_ok":"La prévention bat l’urgence.","why_ko":"Attendre ou cacher empire."},{"q":"Que met-on sur une fiche outil?","choices":["Dernier contrôle et prochain contrôle","Le prix d’un concurrent","Seulement un dessin"],"correct":0,"why_ok":"La fiche porte l’historique.","why_ko":"Ni décor ni concurrence."},{"q":"Que faire si la balance dépasse l’écart toléré?","choices":["Continuer les ventes sans note","La retirer jusqu’à réglage","Changer le nom du lot"],"correct":1,"why_ok":"Instrument douteux hors service.","why_ko":"Continuer aveugle est dangereux pour la confiance."},{"q":"Pourquoi sécher les outils après lavage?","choices":["Pour faire joli seulement","Pour éviter de noter","Pour limiter les problèmes produit liés à l’humidité résiduelle"],"correct":2,"why_ok":"Séchage et hygiène liés.","why_ko":"Ce n’est pas que l’esthétique."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"Le nettoyage après lot fait partie de l’entretien.","truth":true,"why":"Premier niveau."},{"t":"Une balance jamais vérifiée reste fiable sans contrôle.","truth":false,"why":"Il faut vérifier."},{"t":"Noter l’entretien dans un carnet aide.","truth":true,"why":"Traçabilité."}]},"exercise":{"prompt":"Crée 3 fiches (balance, tamis, table): geste de fin de journée, fréquence, dernier contrôle coché.","hint1":"Une demi-page chacune.","hint2":"Fais le contrôle aujourd’hui.","solution":"Exemple: balance , masse 500 g chaque lundi; tamis , inspection toile; table , lavage séchage."}},{"title":"Travailler bien dans l’atelier","body":["Travailler bien, c’est protéger ton corps et ton produit en même temps. Chez Baobab Bliss, tu règles la hauteur de table pour ne pas casser ton dos, tu portes des chaussures stables, tu gardes les allées libres, tu te laves les mains aux bons moments.","La qualité naît aussi d’une posture tenable sur la durée. Tu découpes les journées trop longues. La fatigue crée des oublis d’étiquette et des chutes. Tu bois de l’eau. Tu ranges les couteaux. Tu n’improvises pas un branchement électrique douteux pour aller plus vite.","Tu expliques les gestes sûrs à toute aide: comment soulever un bac, où poser une bassine chaude si un jour tu chauffes, comment signaler une blessure légère. Un atelier silencieux sur la sécurité devient un atelier fragile. Pour un futur séchoir, chaleur et vapeur demanderont des règles accrues.","Aujourd’hui, corrige un seul point ergonomique baobab (hauteur, lumière, allée) et note le avant ou après. Tu écris le point ergonomique choisi sur la liste de contrôle d’ouverture. Tu règles la hauteur de table pour épaules basses au conditionnement. Lave-mains sur le chemin d’entrée.","Registre de presque-accidents relu chaque mois avec une action fermée. Baobab Bliss protège mains et dos: la fatigue produit des erreurs de lot."],"prof":"L’ergonomie n’est pas un luxe de grand site: c’est la condition pour tenir douze à dix-huit mois de progression. Une douleur ignorée revient dans le produit via la précipitation. Regarde ton corps comme un outil critique à entretenir. Une amélioration simple aujourd’hui vaut mieux qu’un discours courageux et un lumbago demain. Garde une page datée après l’essai. Garde une page datée après l’essai du calage de table.","tip":"Choisis une seule correction ergonomique cette semaine et mesure si tu finis moins fatiguée.","simple":"Comme piler le mil: tu ajustes le mortier pour ne pas te faire mal aux reins, tu fais des pauses, tu ranges le pilon hors du passage. La force sans prudence se paie le lendemain. L’atelier demande la même sagesse.","plus":"Ergonomie de base: hauteur de plan de travail près des coudes, alternatives assis/debout, manutention avec dos droit et charge proche du corps. Sécurité: prévention des chutes, coupures, bascules de piles, électricité, produits de nettoyage stockés à part. Exemple (nombres inventés pour l’exercice): table trop basse de 10 cm; après calage, tu gagnes moins de douleurs d’épaules sur une série de 100 sachets. liste de contrôle ouverture/fermeture d’atelier. Trousse de premiers soins accessible et connue. Signale les presque-accidents: un bac qui a failli tomber enseigne autant qu’un vrai incident. Éclairage du poste de contrôle étiquette réduit les erreurs autant que les maux de tête. Place l’eau et le savon là où les mains en ont vraiment besoin, pas au bout d’un couloir. Alterne les tâches lourdes et fines pour limiter la fatigue d’une seule posture. Note les presque-accidents sur une ligne datée: bac instable, fil au sol, pile trop haute. Une revue mensuelle de ces lignes guide les petits aménagements avant qu’un vrai incident n’arrive.","expert":"Conditions de travail: sol, éclairage, chaleur, bruit, coupures, rangement des outils tranchants. Lien qualité: un espace clair réduit les erreurs de mélange et les chutes de corps étrangers. Exemple (nombres inventés pour l’exercice): tu corriges un fil au sol et tu mesures le temps de nettoyage avant et après. Pour Baobab Bliss: tour d’atelier du soir — sol, outils, fermetures, torchons. Dix minutes protègent demain. Tu écris le point corrigé (éclairage, allée) sans discours long. Le soin des personnes et du produit avancent ensemble. Les conditions de travail sont un PRP humain: éclairage pour voir les corps étrangers, sol non glissant, outils rangés. Un espace confus augmente les erreurs de mélange de lots. Tu corriges d’abord les situations les plus fréquentes. Pour Baobab Bliss, le tour du soir est un standard de fermeture. Tu peux chronométrer un chantier 5S d’une zone (exemple inventé: 12 min) pour montrer le gain. Le respect des personnes et la maîtrise produit avancent ensemble, sans slogans. Tu inclus l’hydratation, les pauses et la lumière du soir dans ta revue: la fatigue crée des erreurs de lot. Un atelier humainement tenable est un atelier plus maîtrisé. Écris deux actions max par mois. Les PRP du Règl. (CE) 852/2004 incluent l’environnement de travail favorable à l’hygiène. Environnement de travail: PRP du Règl. (CE) 852/2004. Le tour du soir (sol, outils, fermetures, torchons) est le standard de fermeture écrit. Environnement de travail: PRP du Règlement (CE) 852/2004.","quiz":[{"q":"Pourquoi régler la hauteur de table?","choices":["Pour cacher le stock","Pour décorer","Pour réduire la fatigue et les gestes dangereux"],"correct":2,"why_ok":"L’ergonomie protège le corps et la qualité.","why_ko":"Ni décor ni cachette."},{"q":"Que faire des allées?","choices":["Y stocker les coques en tas","Les garder libres","Y laisser les couteaux"],"correct":1,"why_ok":"Allées libres, chutes en baisse.","why_ko":"Stocker dans le passage nuit."},{"q":"Que sont les presque-accidents?","choices":["Des blagues","Des signaux à noter avant la blessure","Des preuves à cacher"],"correct":1,"why_ok":"Ils enseignent la prévention.","why_ko":"Ni blague ni secret."},{"q":"Que lier à la qualité produit?","choices":["Le volume de la radio","Seulement la couleur du mur","Fatigue et précipitation"],"correct":2,"why_ok":"La fatigue augmente les défauts.","why_ko":"Mur et radio ne mesurent pas cela."}],"activity":{"type":"case","prompt":"Cas","story":"Sol mouillé, tamis abîmé, précipitation avant foire.","q":"Premier geste ?","choices":["Tu sécurises le sol et tu écartes l’outil abîmé avant d’accélérer","Tu caches l’outil","Tu ignores et tu cours"],"correct":0,"why_ok":"Personnes et produit d’abord.","why_ko":"Ignorer ou cacher aggrave."},"exercise":{"prompt":"Corrige un point ergonomique ou sécurité (hauteur, lumière, allée, rangement couteau). Photo mentale avant ou après et note écrite.","hint1":"Un seul point.","hint2":"Fais valider par une aide.","solution":"Exemple: cales sous table +20 min de confort sur la série; allée libérée."}}],"m11":[{"title":"Bases pour vendre ton aliment","body":["Vendre, c’est faire rencontrer une promesse claire et une personne réelle. Chez Baobab Bliss, ta promesse est simple: poudre de pain de singe, cent pour cent pulpe, rien d’ajouté. Tu la répètes sur le sachet, au marché, et dans ta façon de répondre aux questions.","Une promesse floue force la cliente à inventer la sienne. Le prix, le sachet, le lieu et le message doivent se tenir. Un beau discours avec un sachet qui ne se referme pas casse la confiance. Tu choisis un canal de démarrage modeste: un marché, un cercle de voisines, un dépôt-vente.","Pas dix canaux d’un coup. Tu écoutes ce qui fait acheter: confiance, usage clair, dose comprise. Tu notes les objections sans te fâcher. Chaque objection peut devenir une amélioration ou une phrase plus claire. Pour une mangue séchée future, le message changera.","Aujourd’hui, écris ta promesse baobab, ton canal, et le prix que ton coût de revient autorise. Choisis un seul canal pour les quinze premiers jours d’essai: un marché, une boutique amie, ou des commandes groupées. Mesure les rachats, pas seulement les compliments.","Une cliente qui revient vaut plus qu’une longue conversation sans second achat."],"prof":"Le marketing utile tient en quatre leviers: offre, prix, lieu, parole. Une promesse tenue bat une campagne brillante et fragile. Relis ta promesse à voix haute comme une cliente pressée. Si tu hésites, simplifie encore. Reste fidèle à ce que tu peux tenir chaque semaine sans mentir. Note une objection réelle entendue ce mois-ci sur le carnet de vente. Garde cette note près du sachet d’essai.","tip":"Écris ta promesse en une phrase dite en une respiration.","simple":"Comme recommander une bonne bouillie au marché: tu dis le contenu, le prix, le lieu, la régularité. Tu ne promets pas la lune. Les gens reviennent si la promesse ressemble au bol. Les gens reviennent si la promesse ressemble au bol qu’ils ont goûté.","plus":"Le marketing mix structure produit, prix, distribution, communication. Proposition de valeur: pour qui, quel usage, quelle différence honnête. Exemple (nombres inventés pour l’exercice): 25 sachets en deux semaines sur un canal; deux objections refermeture; tu corriges avant d’élargir. Tu testes un seul message par semaine pour voir ce qui fait revenir les clientes. Un script de trois réponses courtes évite les contradictions au marché. Le canal choisi doit supporter ton rythme réel de production, pas un rêve de volume. Tu suis le taux de rachat sur carnet avant un second canal. Pendant l’essai tu gèles un seul message et tu notes les objections exactes. Un canal trop tôt dilue la production sans apprendre assez. Tu transformes une objection entendue en une phrase de réponse écrite, testée le prochain jour de marché. Prolongement utile: une cliente qui rachète sans relance dit plus qu’un compliment isolé au marché. Tu places le rappel au seuil de la porte. Tu ajoutes un compteur de rachats suivi pendant sept jours avant d’élargir le canal.","expert":"Marketing alimentaire TPE: proposition de valeur, usage (dosage), preuve sensorielle, canal, prix cohérent avec le coût de revient. Mix: produit, prix, distribution, communication — sans slogans médicaux (Règl. (CE) 1924/2006). Exemple (nombres inventés pour l’exercice): script oral de trois phrases, prix affiché, trois questions/réponses. Pour Baobab Bliss: une cliente qui sait doser revient. La clarté d’usage est le premier argument. Une seule action commerciale notée par semaine, puis revue de ce qui a été vraiment dit. La proposition de valeur alimentaire doit rester loyale (Règl. (UE) 1169/2011) et hors promesses de santé non autorisées (Règl. (CE) 1924/2006). Le marketing TPE commence par l’usage réel (dosage, mélange) et la preuve sensorielle. Prix et coût de revient se parlent. Canal et message sont cohérents avec ton atelier. Exemple (nombres inventés pour l’exercice): trois phrases orales testées auprès de cinq personnes. Pour Baobab Bliss, une action commerciale notée par semaine + revue. Tu mesures ce qui a été compris, pas seulement ce qui a été dit. Tu testes le message d’usage sur une maquette réelle avant d’imprimer un stock. Une confusion de dosage coûte plus cher qu’une réimpression réfléchie. Archive les retours verbatim. Trois phrases d’usage testées avant impression évitent un stock d’étiquettes confuses.","quiz":[{"q":"Que doit être la promesse?","choices":["Claire et tenable","Floue","Médicale inventée"],"correct":0,"why_ok":"Clarté et tenue.","why_ko":"Fiction nuit."},{"q":"Canaux au démarrage?","choices":["Aucun","Un canal maîtrisé","Dix d’un coup"],"correct":1,"why_ok":"Maîtrise d’abord.","why_ko":"Dispersion nuit."},{"q":"Objection fréquente?","choices":["Insulter","L’ignorer","La noter et corriger"],"correct":2,"why_ok":"Elle guide.","why_ko":"Ignorer nuit."},{"q":"Prix d’abord calé sur?","choices":["Magie","Coût et réalité du canal","Rumeur seule"],"correct":1,"why_ok":"Le coût éclaire.","why_ko":"Rumeur trompe."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"L’onglet Vendre de l’application sert de guide, pas de magie.","truth":true,"why":"Outil."},{"t":"Il faut inventer des parts de marché pour avancer.","truth":false,"why":"Pas de chiffres inventés."},{"t":"Le message 100 pour cent pulpe doit rester clair.","truth":true,"why":"Positionnement."}]},"exercise":{"prompt":"Promesse, canal, prix, 3 questions ou réponses.","hint1":"Honnête.","hint2":"Cohérent étiquette.","solution":"Cent pour cent pulpe; marché; prix aligné coût."}},{"title":"Chaîne de valeur et fournisseurs","body":["La chaîne de valeur va du fruit à la cliente. Chez Baobab Bliss: gousses, transport, atelier, emballage, vente. Chaque maillon peut soutenir ou fragiliser la qualité. Tu dessines ces cases sur une page. Tu choisis tes fournisseurs avec des critères écrits: régularité, propreté, honnêteté sur l’origine, délai.","Un prix très bas avec des fruits douteux coûte plus cher ensuite. Tu notes les lots reçus. Un petit audit peut être une visite, des questions, un sac test. Tu restes claire et respectueuse. Tu gardes un plan B si un maillon casse.","Pour une mangue future, la saison pèsera plus. Aujourd’hui, carte baobab: trois maillons, critères, plan B pour les gousses. Tu dessines cinq cases: récolte, séchage, mouture, conditionnement, vente. Sous chaque case: fournisseur actuel et plan B. Grille qualité-délai-prix-transparence dans le carnet.","Une fois par trimestre tu appelles le plan B sans commande. Dessine cinq cases sur une page: récolte, transport, atelier, emballage, vente. Sous chaque case, écris le fournisseur actuel et un plan B. Garde une grille qualité, délai, prix et transparence dans le carnet d’achat.","Une fois par trimestre, contacte le plan B sans commander: tu vérifies qu’il existe encore. Date la page. Choisis une seule amélioration de maillon pour la semaine."],"prof":"Tu n’es pas seule dans la chaîne. Un atelier impeccable avec une matière sale reste fragile. Écris ce que tu attends. Documente les écarts sans humilier. Garde un plan B discret. Remercie la régularité: elle vaut de l’or silencieux pour ton calendrier. Contacte une source de secours ce mois-ci, même sans commande. Une grille écrite évite de choisir sous la pression du moment.","tip":"Écris trois critères fournisseur dans le carnet d’achat.","simple":"Comme choisir qui apporte le mil: propreté du grain, régularité, parole sur les délais. Le moins cher du jour n’est pas toujours le moins cher du mois. Le quotidien enseigne la double voie mieux qu’un discours long. Deux sources possibles, c’est déjà respirer au lavoir.","plus":"Cartographie des acteurs et des flux. Exemple (nombres inventés pour l’exercice): A plus cher de 5 % mais bien moins de lots douteux que B — tu mesures le coût réel. Audit: questions, visite, échantillon, décision. Tu notes chaque écart fournisseur avec date et photo mentale du lot. Un second fournisseur contacté une fois par trimestre garde le plan B vivant. Le bon de commande même manuscrit fixe quantité, date et prix annoncé. Tu contactes le plan B chaque trimestre. La grille reste visible dans le carnet d’achat. Un fournisseur unique confortable est un point unique de panne. Tu contactes le plan B une fois par trimestre même sans commande pour qu’il reste vivant. La grille qualité-délai-prix-transparence reste collée dans le carnet d’achat. Un fournisseur unique confortable devient un point unique de panne le jour où la matière manque. Tu gardes tickets et contacts dans la même pochette que la grille. Tu transformes un refus de livraison en une ligne d’audit fournisseur datée, avec score et plan B. Prolongement utile: un sac test payé avant la saison haute évite un refus sous pression.","expert":"Chaîne de valeur: amont (fruit, transport), atelier, aval (marché). Segmentation fournisseurs, dual sourcing, critères pondérés (propreté, ponctualité, trace). Traçabilité amont sur carnet (Règl. (CE) 178/2002 esprit « une étape avant / une après »). Exemple (nombres inventés pour l’exercice): score fournisseur baisse de 8 points → sac test avant commande suivante. Pour Baobab Bliss: audit blanc de réception (cinq gousses, défauts notés). Plan B contacté au calme avant la saison. La carte de chaîne se met à jour le jour où un maillon change. La dualité d’approvisionnement et la notation fournisseur réduisent la fragilité saisonnière. La traçabilité (esprit Règl. (CE) 178/2002) exige de savoir une étape avant et après. Un refus documenté à réception est une preuve, pas un conflit inutile. Exemple (nombres inventés pour l’exercice): cinq gousses inspectées, deux critères défaut, décision paiement différé. Pour Baobab Bliss, carnet fournisseur + plan B contacté hors crise. Tu mets à jour la carte de chaîne quand un transporteur change. Les critères pondérés restent visibles pour rester justes. Un tableau de score fournisseur partagé avec l’équipe évite les favoritismes involontaires. La pondération se revoit une fois par saison. La loyauté commerciale n’empêche pas l’exigence documentée. Le score fournisseur et le plan B se mettent à jour le jour où un maillon change.","quiz":[{"q":"Que cartographier?","choices":["Maillons fruit vers cliente","Logo seul","Radio"],"correct":0,"why_ok":"La carte montre les dépendances.","why_ko":"Logo insuffisant."},{"q":"Critères écrits?","choices":["Vexer","Pour choisir sans se mentir","Décor"],"correct":1,"why_ok":"Ils stabilisent.","why_ko":"Pas décor."},{"q":"Plan B?","choices":["Continuer si un maillon casse","Cacher","Menacer"],"correct":0,"why_ok":"Continuité.","why_ko":"Ni menace."},{"q":"Lot reçu?","choices":["Ligne au carnet","Pub","Rien"],"correct":0,"why_ok":"Traçabilité.","why_ko":"Silence nuit."}],"activity":{"type":"match","prompt":"Maillon","left":["Fruit","Transformation","Cliente"],"right":["Cahier des charges fournisseur","Procédé et hygiène","Usage et rachat"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche le lien métier.","hint2":"Élimine les paires absurdes.","solution":"Chaque élément a une seule bonne association."},"exercise":{"prompt":"Dessine chaîne 5 cases + critères + plan B.","hint1":"Une page.","hint2":"Factuel.","solution":"Gousses vers transport vers atelier vers marché; critères propreté; plan B."}},{"title":"Environnement et co-produits du baobab","body":["Les coques, les graines et les fibres ne sont pas seulement des déchets: ce sont des co-produits possibles. Chez Baobab Bliss, tu notes d’abord les volumes sortis par lot. Tu sépares proprement ce qui peut servir ailleurs de ce qui part vraiment au rebut.","Tu cherches des usages simples et locaux: compostage contrôlé, artisanat de coques, valorisation de graines si une filière claire existe près de toi. Tu n’inventes pas une usine de chimie. Tu évites de mélanger co-produits humides et zone emballage. Tu pèses coques et graines sur trois lots et tu écris le rendement pulpe sur la même page.","Sans pesée, tout discours sur les co-produits reste du vent. Une balance et une date suffisent pour commencer le suivi. Tu refuses de stocker les coques contre la table d’emballage. Un tas «temporaire» devient vite une habitude sale. Marque au sol la zone co-produits et explique-la à toute aide le premier jour.","Pour une mangue séchée future, les épluchures poseront d’autres questions d’eau et d’odeur. Aujourd’hui, choisis une seule idée d’usage testable pour les coques baobab et note qui pourrait la recevoir."],"prof":"L’environnement à ton échelle, ce sont des gestes mesurables. Les co-produits sont une chance et une responsabilité. N’annonce pas une filière avant un essai propre. Avance pas à pas, avec le même sérieux que pour la poudre. Dis seulement ce que tu fais vraiment. Une pesée datée sur trois lots ouvre déjà le sujet des co-produits. Pèse d’abord, décide ensuite, sans te précipiter.","tip":"Pèse les coques d’une journée pour voir le volume réel.","simple":"Comme cuisiner un poulet entier: chair, bouillon, et un destin choisi pour le reste, même si c’est un compost propre. Rien ne pourrit dans un coin par négligence. L’atelier du baobab se lit pareil, avec une balance et une page.","plus":"Cycle de vie simplifié: extraction, transformation, distribution, usage, fin de vie. Co-produits: graines, coques, fibres. Exemple (nombres inventés pour l’exercice): 10 kg fruits → 3 kg pulpe, 4 kg graines. Hiérarchie réduire-réemployer-recycler. Tu pèses coques et graines une fois par mois pour suivre les ratios réels. Tu refuses le greenwashing: tu communiques seulement les gestes vraiment tenus. Un coin déchets propre éloigné de la table d’emballage fait partie du plan au sol. Photo trimestrielle du flux des coques. Ratio déchets/poudre collé au dossier environnement. Aucune phrase marketing ne remplace ce geste. Tu photographies une fois par trimestre le flux des coques vers leur destination réelle. Le ratio kilos de déchets sur kilos de poudre reste l’indicateur collé au dossier environnement. Aucune phrase marketing ne remplace ce geste mesurable. Graines et fibres propres peuvent trouver un artisan partenaire sans promesse d’impact inventée. Tu transformes une pesée de coques en une idée d’usage testable, écrite avec un nom de personne contact. Prolongement utile: trois pesées de coques sur des lots différents valent mieux qu’une estimation orale.","expert":"Co-produits baobab: graines, coques, fibres. Hiérarchie: prévention des pertes, réemploi, valorisation matière, énergie, élimination maîtrisée. Analyse de cycle de vie (ISO 14040/44) en esprit: inventaire, impacts, interprétation — même qualitative. Exemple (nombres inventés pour l’exercice): 10 kg de gousses → masse graines et coques notée, destination écrite. Pour Baobab Bliss: peser pour connaître le vrai rendement. Une destination propre évite un coin qui se dégrade. Tu sépares les flux humides et secs. Pas de promesse environnementale non prouvée sur l’étiquette (loyauté, Règl. (UE) 1169/2011). Les co-produits ont un coût de non-gestion (odeur, nuisibles, perte de rendement perçu). Peser graines et coques rend le bilan matière réel. ISO 14040/44 structure l’idée d’inventaire et d’impacts même en version qualitative TPE. Tu évites les allégations environnementales floues sur l’étiquette. Pour Baobab Bliss, destination écrite pour chaque flux. Séparer humide/sec. Exemple (nombres inventés pour l’exercice): 10 kg gousses → masses partielles notées. Le rendement pulpe se calcule avec tes chiffres, jamais avec un pourcentage inventé présenté comme vrai. Tu peux suivre un indicateur simple de pertes (masse non valorisée / masse entrée). Exemple (nombres inventés pour l’exercice): 12 % non valorisés un mois, 8 % le suivant après destination graines. Tendance > chiffre isolé. Peser graines et coques donne le bilan matière réel, pas un pourcentage décoratif.","quiz":[{"q":"Coques d’abord?","choices":["Les laisser pourrir","Les gérer et mesurer","Les mettre dans la poudre"],"correct":1,"why_ok":"Gérer proprement.","why_ko":"Contaminer nuit."},{"q":"Cycle de vie?","choices":["Claim miracle","Avant et après le sachet","Ignorer emballage"],"correct":1,"why_ok":"Toute la chaîne.","why_ko":"Miracle faux."},{"q":"Avant une huile?","choices":["Valider process et débouché","Mélanger sans dire","Annoncer en grand"],"correct":0,"why_ok":"Essai sérieux.","why_ko":"Précipitation nuit."},{"q":"Indicateur?","choices":["Radio","Déchets par kilo de poudre","Logo"],"correct":1,"why_ok":"Ratio utile.","why_ko":"Logo non."}],"activity":{"type":"calc","prompt":"Co-produits d’un lot","fields":[{"id":"poudre","label":"Poudre obtenue (g)"},{"id":"graines","label":"Graines (g)"},{"id":"coques","label":"Coques (g)"}],"note":"Tes poids seulement. Sert à voir ce qui sort du lot.","tip":"Tes chiffres."},"exercise":{"prompt":"Inventaire sorties d’une journée + 1 action réduction.","hint1":"Pèse.","hint2":"Marque exemples.","solution":"3 kg pulpe, 4 kg graines; supprimer double emballage."}},{"title":"Responsabilité sociale simple","body":["La responsabilité sociale, ici, ce sont des gestes concrets: payer correctement une aide, tenir des horaires humains, respecter les voisins, et dire vrai sur le produit. Chez Baobab Bliss, tu écris cinq règles visibles près du lave-mains: lavage, cheveux, bijoux, blessures, visiteurs.","Tu traites toute personne qui t’aide avec clarté: tâche, durée, rémunération, pauses. Tu refuses le silence sur l’argent du travail. Tu notes les accords sur une page datée que vous signez toutes les deux. Tu écoutes le voisinage: bruits, odeurs, déchets.","Un atelier qui embête la rue ne grandit pas longtemps. Tu notes une plainte éventuelle et la correction le même jour sur le carnet. Tu formes brièvement avant le lot: cinq minutes sur une seule règle, pas un discours. Une aide qui comprend la règle la tient mieux qu’une affiche jamais lue.","Tu dates le briefing sur la page du jour. Pour une mangue future, les odeurs de séchage demanderont encore plus d’anticipation. Aujourd’hui, affiche les cinq règles et relis-les à voix haute avec ton aide avant le prochain lot. Tu gardes aussi une ligne sur le carnet pour les heures réellement travaillées.","Sans ce suivi, tu ne peux pas tenir une rémunération juste ni protéger ton propre temps."],"prof":"La responsabilité est une discipline de relation. Dis ce que tu fais. Fais ce que tu dis. Protège les corps et la vérité du sachet. Les cinq règles d’aujourd’hui comptent déjà. Relis-les chaque mois. Raye le théâtre. Garde ce qui est tenu vraiment. Relis tes cinq règles ce soir à voix haute près du lave-mains. Paie clairement et explique clairement.","tip":"Affiche cinq règles près du lave-mains.","simple":"Comme une cuisine familiale ouverte aux cousins: chacun sait où se laver, on ne ment pas sur les plats, on partage les tâches. L’ordre relationnel protège le repas. Les gestes visibles bâtissent la confiance mieux que les grandes phrases. Tout le monde voit si la cour reste propre.","plus":"Thèmes: travail décent, vérité produit, fournisseurs, ancrage local, environnement proche. Exemple (nombres inventés pour l’exercice): 8 heures payées, pause notée, zéro claim santé. Procédure de rappel simple. Formation éclair hygiène. Cinq règles affichées près du lave-mains battent un long discours jamais lu. Toute plainte cliente reçoit une ligne datée même si la réponse vient le lendemain. Tu révises les règles tous les trois mois et tu rays ce qui n’est plus tenu. Test à blanc annuel de la procédure de rappel. Cinq règles affichées > long texte non lu. Registre près du téléphone utile. Tu testes la procédure de rappel à blanc une fois par an: qui appelle qui, en combien de minutes, avec quel message. Cinq règles affichées près du lave-mains valent mieux qu’un long texte non lu. Le registre de rappel reste près du téléphone réellement utilisé. Tu paies à la date promise pour tenir la chaîne sociale visible. Tu transformes une règle d’hygiène en un briefing de cinq minutes daté avant le prochain lot. Prolongement utile: une aide qui reformule la règle à voix haute montre que le briefing a pris.","expert":"Responsabilité sociale TPE: règles d’équipe écrites (paiement, horaires, gestes de base, respect), sécurité simple, relations fournisseurs justes. ISO 26000 en esprit (guidance, non certificative). Exemple (nombres inventés pour l’exercice): une page, cinq règles, date de revue dans trois mois. Pour Baobab Bliss: une règle dite une fois s’oublie; écrite et revue, elle reste. Tu gardes court. La gouvernance simple (qui décide quoi) évite les malentendus le jour chargé. Une règle d’équipe écrite protège tout le monde: attentes claires, paiement, gestes d’hygiène de base. ISO 26000 offre un langage de responsabilité sans imposer une certification. La revue à date fixe évite l’oubli. Pour Baobab Bliss, une page suffit. Tu inclus qui décide en cas de lot douteux. Exemple (nombres inventés pour l’exercice): cinq règles, revue dans 90 jours. La clarté sociale réduit les erreurs humaines autant qu’un PRP technique. En cas de désaccord, la règle écrite tranche plus calmement qu’un débat sous pression de foire. Tu prévois aussi qui accueille une nouvelle aide et quels gestes sont montrés le premier jour. Une page de règles d’équipe avec date de revue réduit les malentendus le jour de foire. Tu prévois aussi le premier jour d’une nouvelle aide: qui montre les gestes, quels points d’hygiène sont non négociables, et où lire la règle écrite. Cette induction courte évite les écarts silencieux.","quiz":[{"q":"Par où commencer?","choices":["Personnes et vérité produit","Claim inventé","Médaille"],"correct":0,"why_ok":"Personnes d’abord.","why_ko":"Fiction non."},{"q":"Avant une aide?","choices":["Rémunération et règles","Radio seule","Rien"],"correct":0,"why_ok":"Clarifier.","why_ko":"Silence nuit."},{"q":"Lot douteux?","choices":["L’accepter en silence","Le refuser","Le mélanger"],"correct":1,"why_ok":"Qualité.","why_ko":"Cacher nuit."},{"q":"Procédure de rappel?","choices":["Décor","Agir vite et clairement","Faire peur"],"correct":1,"why_ok":"Préparer.","why_ko":"Pas décor."}],"activity":{"type":"case","prompt":"Cas","story":"Une aide n’a pas été payée à temps. Une étiquette promet trop.","q":"Que priorises-tu ?","choices":["Tu ignores","Tu régularises le paiement et tu corriges l’étiquette","Tu ajoutes une promesse médicale"],"correct":1,"why_ok":"Personnes et honnêteté d’abord.","why_ko":"Ignorer ou promettre trop casse la confiance."},"exercise":{"prompt":"5 règles Baobab Bliss lues par quelqu’un.","hint1":"Phrases courtes.","hint2":"Date.","solution":"Mains; étiquette vraie; heures payées; allées libres; plainte notée."}},{"title":"Conduire le projet sur douze à dix-huit mois","body":["Conduire le projet, c’est ordonner les chantiers sur douze à dix-huit mois sans tout faire le même jour. Chez Baobab Bliss, tu poses des jalons: procédé stable, étiquette claire, premiers essais de vente, revue des coûts, puis seulement extension éventuelle.","Tu dessines une frise simple: mois en colonnes, tâches en lignes. Tu marques ce qui bloque autre chose: sans diagramme fiable, le plan de maîtrise flotte; sans coûts, le prix ment. Tu revisites la frise chaque mois: fait, décalé, annulé.","Tu gardes une semaine vide avant un jalon public pour absorber les imprévus. Tu rayes sans culpabilité ce qui n’est plus utile. Tu entoures le chemin critique: les tâches dont le retard retarde tout. Tu refuses d’y coller des améliorations cosmétiques.","Une frise murale regardée bat un planning parfait oublié dans un tiroir. Pour une mangue future, tu gardes une ligne séparée afin de ne pas mélanger les calendriers. Aujourd’hui, place trois jalons baobab sur les trois prochains mois et entoure le chemin qui ne peut pas glisser.","Tu partages la frise avec toute aide une fois par mois: ce qui est fait, ce qui glisse, ce qui attend. Une frise secrète ne conduit personne."],"prof":"Conduire le projet, c’est accepter la limite du temps. Un Gantt simple bat une liste mentale. Le chemin critique te dit où regarder si tu glisses. Revue courte, décisions écrites. Courage calme: mieux vaut réduire le périmètre que tout laisser à moitié. Tu n’es pas en retard sur une fiction; tu pilotes un réel. Trois jalons clairs valent mieux que vingt envies sur la même frise.","tip":"Bloque trente minutes de revue projet tous les quinze jours.","simple":"Comme bâtir une case progressivement: fondations, murs, toit. Tu ne poses pas le toit avant les murs. L’ordre des chantiers évite de tout démonter ensuite. La frise au mur rappelle l’ordre aux jours pressés. Tu ne poses pas le toit avant les murs de la case.","plus":"Gantt: tâches, durées, enchaînements. Chemin critique: tâches sans marge. Exemple (nombres inventés pour l’exercice): étiquette bloque la vente; si étiquette glisse de 2 semaines, le lancement glisse aussi. Revue bihebdomadaire avec décisions. Le diagramme de Gantt artisanal tient sur une feuille: barres de semaines, jalons, responsable. Le chemin critique montre les tâches qui retardent tout le projet si elles glissent. Une revue toutes les deux semaines décide report, compression ou abandon d’une tâche. Date de lancement cible affichée au-dessus du Gantt. Tout retard sur le chemin critique décale cette date à l’encre. Tâche bloquée sans responsable = fantasme de planning. Tu affiches la date de lancement cible au-dessus du Gantt. Chaque retard sur le chemin critique décale cette date à l’encre, pas en silence. Une tâche bloquée porte un nom de responsable et une date de déblocage. Le planning fantôme disparaît dès que tu mets à jour après chaque revue courte. Tu transformes un glissement de frise en une décision datée: reporter, couper, ou garder le chemin critique. Prolongement utile: une frise collée au mur et revue le premier lundi du mois suffit pour piloter.","expert":"Conduite de projet: jalons, chemin critique (esprit Gantt), marges, revue. Un jalon a une définition de « fini » vérifiable. Exemple (nombres inventés pour l’exercice): trois jalons sur six mois — maquette étiquette, dix lots suivis, première revue clientes. Pour Baobab Bliss: un jalon raté est une information; tu replanifies avec une raison écrite. Tu refuses un plan plus large que tes enregistrements réels. Chemin critique: ce qui retarde tout le reste (souvent étiquette ou mesure de durée de vie). Le chemin critique relie jalons qui retardent tout le reste (souvent conformité étiquette, durée de vie, stock d’emballage). Un jalon a une définition de terminé (DoD) observable. Gantt simplifié: barres, dépendances, marges. Pour Baobab Bliss, trois jalons sur six mois battent une liste de vingt souhaits. Un jalon manqué déclenche replanification écrite. Exemple (nombres inventés pour l’exercice): étiquette maquette validée = jalon 1. Tu refuses un planning plus large que tes preuves. Chaque jalon produit un artefact (fichier maquette, carnet de dix lots, fiche revue). Pas d’artefact, pas de jalon tenu. Cette règle évite les «c’est presque fini» éternels. La conduite par jalons reprend l’esprit des référentiels de management de projet (ISO 21500 en guidance). Jalons: guidance ISO 21500 en esprit. Un jalon sans artefact observable (maquette, carnet, fiche) n’est pas un jalon tenu.","quiz":[{"q":"Sans calendrier?","choices":["Le goût s’améliore seul","Les intentions s’empilent sans fin","Tout va plus vite"],"correct":1,"why_ok":"Le calendrier termine.","why_ko":"Le flou traîne."},{"q":"Chemin critique?","choices":["Tâches radio","Tâches décoratives","Tâches qui retardent tout si elles glissent"],"correct":2,"why_ok":"Elles pilotent la fin.","why_ko":"Pas décor."},{"q":"Revue?","choices":["Effacer le plan","Seulement se plaindre","Fait, reporté, bloqué, décidé"],"correct":2,"why_ok":"Décider.","why_ko":"Plainte seule non."},{"q":"Si périmètre trop large?","choices":["Tout garder en silence","Abandonner sans note","Réduire plutôt que tout laisser à moitié"],"correct":2,"why_ok":"Réduire lucidement.","why_ko":"Silence nuit."}],"activity":{"type":"order","prompt":"Projet","steps":["Fixer l’objectif douze mois","Poser des jalons datés","Suivre chaque mois","Revoir sans dramatiser"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Fixer l’objectif douze mois, Poser des jalons datés, Suivre chaque mois, Revoir sans dramatiser"},"exercise":{"prompt":"Gantt 8 semaines, 6 tâches, 3 jalons, chemin critique entouré.","hint1":"Une feuille.","hint2":"Dates réelles.","solution":"Exemple: atelier vers étiquette vers coût vers canal; critique: étiquette avant canal."}},{"title":"Financer sans inventer de programmes","body":["Financer l’atelier, c’est trouver l’argent pour les stocks, les outils et le temps avant les ventes. Chez Baobab Bliss, tu commences par séparer l’argent du ménage et celui de l’atelier. Sans séparation, tu ne sais pas si l’activité tient. Tu listes les besoins: sachets, fruits, petite réparation, trésorerie de sécurité.","Tu listes les sources génériques possibles: fonds propres, aide familiale claire, crédit, avance sur commande. Tu n’inventes pas un programme public précis que tu n’as pas vérifié. Chaque source a un coût et une contrainte. Un crédit demande des échéances.","Une avance client demande une livraison tenue. Les fonds propres sont limités mais souples. Tu stress-testes: que se passe-t-il si les ventes baissent? Aujourd’hui, tableau simple: besoin, source envisageable, contrainte, date de décision. Aucun chiffre inventé présenté comme acquis. Tu sépares enveloppe maison et enveloppe atelier.","Stress-test: ventes −30 % environ sur deux mois. Sources génériques: apport, crédit court, avance client , sans inventer un programme nommé. Tu refuses une échéance qui casse le stock de sachets. Stress-test simple: imagine ventes plus basses d’environ un tiers pendant deux mois.","Tes échéances tiennent-elles encore? Si non, réduis le besoin ou allonge le délai avant de signer quoi que ce soit. Date ce calcul sur une page."],"prof":"L’argent clair protège les relations familiales et la survie de l’atelier. Nomme les besoins sans honte. Refuse les financements magiques non vérifiés. Un petit tableau honnête bat une grande histoire floue. Décide une source à explorer cette semaine, pas dix. Garde la prudence: mieux vaut grandir un peu plus lentement que de te briser sur une dette mal calée. Mieux vaut grandir un peu plus lentement que de te briser sur une dette mal calée.","tip":"Sépare cette semaine deux enveloppes: maison et atelier.","simple":"Comme préparer une fête: tu comptes d’abord ce que tu as, ce qu’il manque, et tu choisis d’emprunter une casserole plutôt que d’acheter toute la cuisine à crédit. La mesure évite lendemain difficile. La mesure évite un lendemain difficile après la fête.","plus":"Types génériques: fonds propres, crédit, avance client, éventuel soutien institutionnel non garanti. Exemple (nombres inventés pour l’exercice): besoin 80 000 FCFA stocks; fonds propres 50 000; reste à arbitrer. Tableau besoin-source-contrainte. Jamais de programme nommé inventé. Tu sépares argent du ménage et argent de l’atelier sur deux enveloppes ou comptes. Chaque type de financement (fonds propres, crédit, avance client) a un coût et une contrainte. Tu refuses d’inventer un programme public: tu décris seulement des familles génériques. Pas de mélange dépense maison / sachets. Avant échéance, simule deux mois plus faibles. La clarté des enveloppes protège stock et sommeil. Tu refuses de mélanger une dépense maison avec l’achat de sachets ou d’étiquettes. Avant toute échéance de crédit tu simules deux mois de ventes plus faibles d’environ trente pour cent. Sources décrites génériquement: apport personnel, crédit court, avance client. La clarté des enveloppes protège le stock et le sommeil. Tu transformes un besoin d’argent flou en une ligne emploi-ressource datée, avec coût du financement écrit. Prolongement utile: un stress-test sur papier avant signature évite une dette qui casse le stock.","expert":"Financement: besoins (stocks, outils, emballage), sources génériques (fonds propres, avance, crédit fournisseur, dispositifs locaux à vérifier sur place). Aucun programme inventé dans ce cours. Exemple (nombres inventés pour l’exercice): tableau besoin / source / contrainte / date pour trois lignes. Pour Baobab Bliss: liste avant recherche d’aide. Tu sépares ce qui fait tourner l’atelier de ce qui peut attendre. Tu vérifies toujours les conditions réelles auprès des guichets locaux. Le financement commence par une liste de besoins priorisés, pas par une chasse aux sigles. Tu vérifies sur place les dispositifs locaux sans les inventer dans ce cours. Fonds propres, crédit fournisseur, avance client sont des catégories génériques. Pour Baobab Bliss, tableau besoin/source/contrainte/date. Exemple (nombres inventés pour l’exercice): trois lignes stocks/sachets/balance. Tu sépares indispensable et souhaitable. Aucune subvention fantôme dans le dossier. Tu prepares une chemise avec pièces demandées typiques (identité, description activité, besoin chiffré daté) sans inventer le guichet. Quand tu trouves une source réelle, tu vérifies conditions et délais sur place. Aucun dispositif public n’est inventé ici; tu vérifies toujours sur place les conditions réelles. Le tableau besoin ou source ou contrainte ou date se remplit avant toute visite de guichet. Financement: aucun dispositif inventé; tu vérifies sur place. Lien Codex CXC 1-1969: documenter ce que tu finances réellement.","quiz":[{"q":"D’abord?","choices":["Séparer maison et atelier","Inventer un programme","Tout mélanger"],"correct":0,"why_ok":"Séparer éclaire.","why_ko":"Mélange trompe."},{"q":"Que cites-tu à côté de chaque source d’argent sur ton tableau ?","choices":["Rien, seulement le montant","Le type générique et le coût du financement","Un programme public inventé"],"correct":1,"why_ok":"Tu restes honnête sur la famille de source et son coût, sans inventer un programme nommé.","why_ko":"Inventer un programme ou omettre le coût rend le plan fragile."},{"q":"Crédit?","choices":["Stress-tester si ventes baissent","Cacher l’échéance","Signer les yeux fermés"],"correct":0,"why_ok":"Tester.","why_ko":"Aveuglement nuit."},{"q":"Avance client?","choices":["Livrer à la date promise","Disparaître","Prendre l’argent sans plan"],"correct":0,"why_ok":"Tenir la promesse.","why_ko":"Sinon confiance cassée."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"On liste les besoins avant d’inventer une aide.","truth":true,"why":"Méthode."},{"t":"On peut inventer une subvention dans le cours.","truth":false,"why":"Interdit d’inventer."},{"t":"Le budget d’essais déjà évoqué reste un ordre de grandeur à ajuster.","truth":true,"why":"Indicatif."}]},"exercise":{"prompt":"Tableau besoin ou source ou contrainte ou date pour 3 lignes.","hint1":"Marque exemples.","hint2":"Aucune invention de programme nommé.","solution":"Stocks ou fonds propres ou limite épargne ou cette semaine."}}],"cap":[{"title":"Diagramme de ton procédé","body":["Le dossier commence par un dessin clair de ton procédé Baobab Bliss. Tu poses les étapes depuis la gousse jusqu’au sachet fermé. Tu marques où tu contrôles. Tu marques où sortent les coques et les graines. Une étrangère doit comprendre le chemin en quelques minutes.","Tu sépares le flux baobab du futur séchage mangue. Sur la page baobab, pas de flèche de séchage chaud central: la pulpe est déjà sèche dans la gousse. Si tu ajoutes un finissage doux optionnel, tu l’étiquettes comme optionnel et rare.","Tu versions le diagramme: date, numéro, ce qui a changé. L’ancien dessin reste en archive. Quand un acheteur ou une formatrice demande « comment tu fais », tu sortes la version courante, pas un souvenir oral. Aujourd’hui, dessine six à huit cases, avec contrôles et déchets.","Fais relire. Corrige les flèches ambiguës. Tu ajoutes légende et frontière de système avant la version 1 datée. Tu sépares un futur séchage mangue. Chaque flèche porte matière et direction. Le schéma sert à discuter, pas à décorer. Chaque case correspond à un endroit réel de l’atelier Baobab Bliss."],"prof":"Le diagramme est la colonne vertébrale du dossier. S’il est flou, tout le reste flotte. Dessine le réel, pas le rêve. Montre les déchets. Montre les contrôles. Une page nette aujourd’hui t’évitera dix explications confuses plus tard. Garde une version datée et une copie de sauvegarde. Garde une version datée et une copie de sauvegarde du schéma. Tu termines le schéma par un geste daté: numéro de version et signature sur la page.","tip":"Fais relire le dessin par quelqu’un qui ne connaît pas ton atelier.","simple":"Comme expliquer le chemin de l’eau jusqu’à la jarre: tu montres chaque étape, y compris où tu renverses les eaux sales. Sans cela, personne ne comprend vraiment ton système. L’image du schéma mural fixe le parcours du fruit au sachet dans ta tête.","plus":"Le diagramme de flux process (PFD simplifié) et le schéma blocs sont des livrables classiques d’ingénierie alimentaire. Exemple (nombres inventés pour l’exercice): 7 blocs, 3 contrôles, 2 sorties de co-produits. Critères: lisibilité, exhaustivité des flux matière, points de contrôle visibles. Exemple (inventé): 7 blocs, 3 contrôles, 2 sorties de co-produits. Tu fais relire par une personne extérieure avant de figer la v1. Le diagramme de flux simplifié est un livrable classique. Exemple (nombres inventés pour l’exercice): sept blocs, trois contrôles, deux sorties de co-produits. Critères de qualité: lisibilité, exhaustivité des flux matière, points de contrôle visibles. Tu fais relire par une personne extérieure avant de figer la version 1. Tu archives la photo datée avec le numéro de version. Tu transformes un schéma flou en une version numérotée datée, avec légende et frontière du système. Prolongement utile: faire relire le schéma par une aide révèle les cases oubliées sans débat long.","expert":"Diagramme de flux: rectangles d’opération, losanges de décision, stocks, flux d’information. HACCP Codex (CXC 1-1969, rev.): description du produit et diagramme validé sur le terrain. Exemple (nombres inventés pour l’exercice): six cases du flux réel, étape lente entourée. Pour Baobab Bliss: si une associée comprend sans toi, c’est assez clair. Tu validates en marchant dans l’atelier, stylo en main. Sépare clairement baobab actuel et futur séchage mangue (autre fiche). Le diagramme validé sur le terrain est une exigence logique Codex (CXC 1-1969, Rév.): l’équipe vérifie chaque étape réellement pratiquée. Tu marques opérations, inspections, stocks, flux. Les étapes lentes ou critiques sont visibles. Pour Baobab Bliss, une associée doit comprendre sans toi. Sépare baobab actuel et futur séchage mangue. Exemple (nombres inventés pour l’exercice): six cases, une étape lente entourée. Tu dates la version du diagramme. Une photo de l’atelier annotée peut compléter le schéma. Tu numbers les versions (v1, v2) et tu retires les anciennes feuilles du mur pour éviter les divergences. Le diagramme vivant est celui collé et daté. Une revue après changement d’implantation est obligatoire. La version datée du diagramme au mur est la seule autorisée; les brouillons quittent le mur. Tu mets un numéro de version sur le diagramme et tu retires les anciennes feuilles pour qu’il n’existe qu’un schéma vivant. Après tout changement d’implantation, une revue terrain est obligatoire avant de reprendre la production.","quiz":[{"q":"Que séparer sur les pages?","choices":["Flux baobab et futur séchage mangue","Cacher les déchets","Tout mélanger"],"correct":0,"why_ok":"Séparer évite la confusion.","why_ko":"Mélanger nuit."},{"q":"La pulpe de baobab?","choices":["Jamais contrôlée","Déjà sèche dans la gousse","Toujours un séchage chaud central"],"correct":1,"why_ok":"Réalité baobab.","why_ko":"Faux procédé."},{"q":"Que portes-tu sur chaque version du diagramme de procédé ?","choices":["Uniquement un rappel oral","Une date et un numéro de version","Aucune trace écrite"],"correct":1,"why_ok":"Le diagramme se versionne comme tout document de maîtrise.","why_ko":"Sans version, on mélange d’anciens et de nouveaux schémas."},{"q":"Qui doit comprendre?","choices":["Seulement toi","Une personne extérieure en quelques minutes","Personne"],"correct":1,"why_ok":"Lisibilité externe.","why_ko":"Sinon dossier faible."}],"activity":{"type":"label","prompt":"Étapes baobab","labels":["Étape 1","Étape 2","Étape 3","Étape 4"],"correct":{"0":"Fruit","1":"Casser","2":"Séparer pulpe","3":"Tamiser"},"hint1":"De gauche à droite.","hint2":"Lis les mots déjà dessinés.","solution":"Fruit, casser, séparer pulpe, tamiser.","svg":"<svg viewBox=\"0 0 320 120\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<rect x=\"4\" y=\"30\" width=\"50\" height=\"50\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"29\" y=\"60\" text-anchor=\"middle\" font-size=\"10\">Fruit</text>\n<path d=\"M56 55h18\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"78\" y=\"30\" width=\"50\" height=\"50\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"103\" y=\"60\" text-anchor=\"middle\" font-size=\"10\">Casser</text>\n<path d=\"M130 55h18\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"152\" y=\"30\" width=\"50\" height=\"50\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"177\" y=\"55\" text-anchor=\"middle\" font-size=\"9\">Séparer</text>\n<text x=\"177\" y=\"68\" text-anchor=\"middle\" font-size=\"9\">pulpe</text>\n<path d=\"M204 55h18\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"226\" y=\"30\" width=\"50\" height=\"50\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"251\" y=\"60\" text-anchor=\"middle\" font-size=\"10\">Tamiser</text>\n</svg>"},"exercise":{"prompt":"Dessine procédé 6-8 cases + contrôles + déchets, date, relecture.","hint1":"Réel.","hint2":"Sépare mangue.","solution":"Gousse vers casse vers séparation vers tamis vers contrôle vers emballage; coques à part."}},{"title":"Plan de maîtrise pour ton atelier","body":["Le plan de maîtrise dit comment tu gardes le produit propre et maîtrisé. Chez Baobab Bliss, tu listes les points sensibles liés à ton procédé réel: corps étrangers, humidité, mauvaises pratiques d’hygiène, lots mélangés. Tu dis quoi surveiller, quand, et quoi faire si ça dérape.","Tu restes proportionnée: un micro-atelier n’écrit pas un roman. Une page vivante bat un classeur mort. Chaque surveillance a un responsable et un enregistrement simple. Tu relis le plan au diagramme de procédé. Un contrôle qui n’apparaît nulle part sur le dessin est souvent oublié.","Un dessin sans contrôle est un dessin incomplet pour le dossier. Aujourd’hui, écris cinq lignes de maîtrise baobab: points sensibles, surveillance, limite, action correctrice, enregistrement. Tu relis chaque ligne de surveillance à une case numérotée du diagramme. Tu limites le plan aux lignes tenables cette saison.","Une surveillance écrite non faite crée une fausse sécurité chez Baobab Bliss. Tu dates la version du plan de maîtrise. Une surveillance écrite non faite crée une fausse sécurité. Date la version du plan et range-la avec le diagramme. Choisis trois surveillances prioritaires pour Baobab Bliss: hygiène des mains avant emballage, contrôle visuel corps étrangers, humidité perçue ou mesure simple avant fermeture.","Écris pour chacune: quoi, quand, qui, limite, action si écart."],"prof":"La maîtrise n’est pas de la peur: c’est de la méthode. Nomme ce qui peut mal tourner dans ton vrai flux. Donne une réponse concrète. Enregistre. Relis après un incident. Le plan grandit avec ton atelier, version après version. Reste calme et précise. Mieux vaut cinq lignes tenues que vingt lignes décoratives. Tu termines le plan de maîtrise par un geste daté: trois surveillances tenables cette saison.","tip":"Relie chaque surveillance à une case du diagramme.","simple":"Comme surveiller la cuisson du tô: tu regardes la texture à un moment précis, tu sais quoi faire si c’est trop ferme, tu te souviens de ce que tu as fait. Sans mémoire, tu recommences les mêmes erreurs. L’image du garde-manger ordonné fixe l’idée de surveiller ce qui peut tourner.","plus":"Tu relis chaque ligne de surveillance à une case numérotée du diagramme de procédé. Tu planifies une revue courte à date fixe, même quinze minutes suffisent si elles sont régulières. Une ligne devenue impossible à surveiller se simplifie ou se retire plutôt que de rester décorative sur le papier. Les enregistrements réellement remplis sont la seule preuve utile devant une formatrice ou un acheteur exigeant. Tu limites le plan aux lignes tenables cette saison dans l’atelier. Une surveillance écrite et non faite crée une fausse sécurité plus gênante qu’une ligne absente. Après chaque revue tu dates la version du plan et tu archives l’ancienne feuille. Tu nommes qui signe chaque surveillance pour éviter les coches anonymes. Baobab Bliss avance avec un plan court tenu, pas avec un tableau encyclopédique abandonné. Tu coches aussi la date de la prochaine revue sur le calendrier mural de l’atelier. Tu vérifies une fois par mois qu’aucune ligne du plan n’est devenue impossible faute d’outil ou de personne.","expert":"Plan de maîtrise: PRP (prérequis d’hygiène, Règl. (CE) 852/2004) vs points critiques là où une surveillance évite un écart net. Codex CAC/RCP 1. Documentation proportionnée TPE. Gabarit: étape, point sensible, mesure, surveillance, limite, correction, enregistrement. Exemple (nombres inventés pour l’exercice): trois surveillances prioritaires; une sans responsable → tu ajoutes le nom. Pour Baobab Bliss: deux vigilances tenues valent mieux que dix fantômes. Lien étiquette: lot et date pour retirer si besoin. Exercice de rappel interne à blanc. PRP vs maîtrise spécifique: le Règl. (CE) 852/2004 pose l’hygiène de base; là où une surveillance évite un écart net, tu formalises limite et correction (esprit HACCP Codex). Documentation proportionnée TPE: mieux vaut deux vigilances tenues. Lien étiquette (lot, date) pour retrait. Exemple (nombres inventés pour l’exercice): trois surveillances, responsables nommés. Pour Baobab Bliss, exercice de rappel à blanc. Tu refuses un plan décoratif plus large que tes enregistrements. Les limites critiques ou opérationnelles s’écrivent avec unité et méthode d’observation. Une limite sans moyen de surveiller est inutile. Forme le rappel à blanc comme un exercice sans faute ni honte. Deux vigilances nommées et tenues valent mieux qu’un plan décoratif à dix lignes. Les limites s’écrivent avec unité et méthode d’observation. Une limite sans moyen de surveiller reste lettre morte. Le rappel à blanc se fait sans faute ni honte, seulement pour apprendre.","quiz":[{"q":"Un bon plan?","choices":["Absent","Vivant et proportionné","Roman jamais lu"],"correct":1,"why_ok":"Vivant.","why_ko":"Roman mort."},{"q":"Si ça dérape?","choices":["Ignorer","Action correctrice écrite","Cacher"],"correct":1,"why_ok":"Corriger.","why_ko":"Cacher nuit."},{"q":"Lien au diagramme?","choices":["Aucun lien","Chaque surveillance reliée à une case","Lien oral vague"],"correct":1,"why_ok":"Relier.","why_ko":"Flou fragile."},{"q":"Combien de lignes d’abord?","choices":["Vingt décoratives","Zéro","Cinq tenues"],"correct":2,"why_ok":"Cinq tenues.","why_ko":"Décor non."}],"activity":{"type":"order","prompt":"Plan de maîtrise","steps":["Lister les étapes","Repérer les vigilances","Écrire surveillance et correctif","Enregistrer sur le lot"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Lister les étapes, Repérer les vigilances, Écrire surveillance et correctif, Enregistrer sur le lot"},"exercise":{"prompt":"5 lignes points sensibles ou surveillance ou limite ou action ou enregistrement.","hint1":"Réel baobab.","hint2":"Relie au dessin.","solution":"Tamis: toile intacte; sinon remplacement + note lot."}},{"title":"Vérifier ton étiquette","body":["L’étiquette dit qui tu es et ce que contient le sachet. Chez Baobab Bliss, tu vérifies dénomination, quantité nette, nom et adresse de l’exploitante, lot, date de durabilité, conditions de conservation, et conseils d’usage simples. Tu ne charges pas l’étiquette de promesses inventées.","Tu fais le test à bout de bras: une amie lit-elle l’essentiel facilement? Tu corriges la taille des caractères et le contraste. Tu gardes la langue comprise par tes clientes. Tu relis l’étiquette au carnet de lots. Un numéro de lot orphelin ne sert à rien.","Un beau graphisme illisible non plus. Aujourd’hui, une liste de contrôle sur une épreuve d’étiquette réelle ou dessinée, avec relecture extérieure. Tu archives les anciennes épreuves après validation. Tu refais le test à bout de bras après correction de contraste. L’étiquette validée porte date et numéro de version dans le dossier.","Le jour de l’impression, tu confrontes le numéro de lot sur la feuille et celui du carnet avant de coller. Tu mets de côté toute ancienne épreuve pour ne pas la ressortir par erreur.","Fais relire l’étiquette par une personne extérieure à l’atelier: ce qu’elle ne comprend pas, la cliente ne le comprendra pas non plus. Corrige, puis reteste à bout de bras."],"prof":"L’étiquette est un contrat silencieux. Elle protège la cliente et te protège si tu restes exacte. Moins de phrases, plus de clarté. Fais relire. Corrige. Date la version validée. N’ajoute pas une mention « pour faire sérieux » si tu ne peux pas l’assumer. La sobriété honnête inspire plus confiance qu’un mur de texte. Tu termines la maquette par un geste daté: test à bout de bras après correction.","tip":"Fais le test à bout de bras avec une lectrice non initiée.","simple":"Comme l’écriteau d’un marché: on doit lire le produit et le prix sans coller le nez. Si on doit plisser les yeux, l’écriteau échoue même s’il est joli. Garde cette image quand tu règles la taille des lettres. L’image de l’écriteau du marché fixe l’idée d’une lecture facile à distance.","plus":"Mentions de base et lisibilité. Alignement avec les règles locales et, pour l’export un jour, avec les exigences du marché cible (plus loin). Exemple (nombres inventés pour l’exercice): 4 lectrices, 3 trouvent le lot trop petit → agrandir. Procédure de changement d’étiquette versionnée. Preuve photo sur sachet rempli, pas seulement maquette écran. L’impression réelle révèle contrastes et découpes. Anciennes maquettes archivées pour éviter un retour arrière. Tu inclus une preuve photo de l’étiquette sur sachet rempli, pas seulement la maquette écran. L’impression réelle révèle contrastes et découpes que l’écran cache. Après validation tu archives ou détruis les anciennes maquettes pour éviter un retour arrière accidentel. Test à bout de bras après chaque correction. Tu transformes une lecture à bout de bras en une correction de contraste datée sur la maquette. Prolongement utile: une lectrice extérieure qui plisse les yeux signale un contraste encore trop faible. Tu places le rappel contre le mur du stock. Tu ajoutes un test de lecture à bout de bras répété après chaque correction de contraste.","expert":"Étiquette: Règl. (UE) 1169/2011 (INCO) — dénominations, liste d’ingrédients, allergènes (annexe II), net, dates, conditions, responsable, lot, nutrition si requise. Loyauté des mentions. Burkina: règles locales de mise sur le marché à vérifier. Exemple (nombres inventés pour l’exercice): liste de contrôle sur vrai sachet, cases cochées au stylo. Pour Baobab Bliss: tu coches ce qui est imprimé, pas ce que tu « voulais » imprimer. Pas d’allégation de santé hors cadre 1924/2006. Maquette et script oral sans promesse médicale. liste de contrôle 1169/2011: dénomination, ingrédients, allergènes mis en évidence, quantité nette, dates, conditions de conservation, nom/adresse responsable, lot, nutrition si applicable, langue comprise. Loyauté: pas de mise en avant trompeuse. Allégations: 1924/2006. Pour Baobab Bliss, coche sur le vrai sachet. Exemple (nombres inventés pour l’exercice): écarts notés immédiatement. Règles burkinabè de mise sur le marché: à vérifier localement et à documenter. La maquette et le sachet imprimé doivent correspondre. Tu vérifies la cohérence net / portion / tableau nutritionnel si présent. Une incohérence visible détruit la confiance. Garde une liste de contrôle plastifiée près de la zone d’étiquetage. La liste de contrôle plastifiée près de l’étiquetage se coche sur le vrai sachet, stylo en main. Tu vérifies la cohérence entre quantité nette, portion et tableau nutritionnel s’il est présent. Une incohérence visible abîme la confiance plus vite qu’un défaut de design.","quiz":[{"q":"Test utile?","choices":["Aucun test","Test de prix seul","Lecture à bout de bras"],"correct":2,"why_ok":"Lisibilité.","why_ko":"Pas seulement prix."},{"q":"promesses inventées?","choices":["Oui pour vendre","Non","Seulement en petit"],"correct":1,"why_ok":"Exactitude.","why_ko":"Fiction nuit."},{"q":"Lot orphelin?","choices":["Idéal","Obligatoire sans carnet","Inutile"],"correct":2,"why_ok":"Relier au carnet.","why_ko":"Orphelin fragile."},{"q":"Que fais-tu des anciennes maquettes d’étiquette après validation ?","choices":["Tu les gardes seulement à l’oral","Tu les archives après validation","Tu les mélanges au stock d’impression"],"correct":1,"why_ok":"Archiver évite de réimprimer une maquette morte.","why_ko":"Mélanger ou rester à l’oral fait revenir d’anciennes erreurs."}],"activity":{"type":"match","prompt":"Mention","left":["Composition","Poids","Lot"],"right":["100 pour cent pulpe","Masse nette","Code pour tracer"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche le lien métier.","hint2":"Élimine les paires absurdes.","solution":"Chaque élément a une seule bonne association."},"exercise":{"prompt":"liste de contrôle étiquette + relecture par une amie + corrections.","hint1":"Bout de bras.","hint2":"Cohérence lot.","solution":"Dénomination, quantité, lot lisible, pas de claim inventé."}},{"title":"Plan de durée de vie","body":["La durée de vie dit jusqu’où tu assumes la qualité du sachet dans des conditions décrites. Chez Baobab Bliss, tu observes couleur, odeur, grain, fermeture, sur des sachets gardés à des dates différentes. Tu notes. Tu ne copies pas une date magique vue ailleurs sans observation.","Tu distinguishes ce que tu observes à l’atelier et ce qu’un laboratoire pourrait mesurer plus tard (humidité, activité d’eau). Tu restes honnête sur tes moyens. Une date trop longue inventée te expose. Tu relis durée de vie et emballage: un sachet mal fermé raccourcit tout.","Tu relis aussi au stockage: chaleur, soleil, humidité ambiante. Aujourd’hui, protocolesimple: 3 sachets, 3 dates de contrôle, critères d’observation, conclusion provisoire datée. Tu décris les conditions de stockage à côté de chaque observation. Tu restes prudente sur la date annoncée tant que les preuves sont courtes.","Une série à 30 jours en pièce chaude ≠ promesse de six mois. Baobab Bliss ancre la durée dans des observations datées. Décris les conditions de stockage à côté de chaque observation: pièce, chaleur ressentie, lumière. Une série à trente jours en pièce chaude ne vaut pas une promesse de six mois.","Ancre la durée dans des observations datées, puis annonce une durée plus courte que le dernier point sain."],"prof":"La durée de vie se gagne par l’observation, pas par l’optimisme. Décris les conditions. Observe. Décide une date prudente. Revois après de nouveaux lots. La prudence te protège plus qu’une promesse longue. Dis à la cliente comment stocker. Un mode de stockage clair allonge souvent la vie réelle mieux qu’un chiffre gonflé. Tu termines le plan de durée par un geste daté: durée provisoire plus courte que le dernier point sain.","tip":"Note les conditions de stockage à côté de chaque observation.","simple":"Comme garder du mil grillé dans un bocal: tu sais qu’ouvert et humide, ça tourne plus vite. Tu choisis une durée selon le bocal et la pièce, pas selon un rêve. L’image du pot de bouillie gardé trop longtemps fixe l’idée d’observer avant de promettre.","plus":"Tu sépares durée sensorielle, durée d’emballage et autres critères d’échec sur des colonnes distinctes du carnet. Un sachet qui fuit échoue même si le goût reste acceptable au jury interne. Tu décris les conditions de stockage à côté de chaque point de mesure: température ambiante, lumière, position du carton. Une série courte donne une durée provisoire encadrée, jamais une garantie marketing affichée trop tôt. Chez Baobab Bliss tu restes prudente: trente jours en pièce chaude ne justifient pas une promesse de six mois. Tu documents le lot et le type d’emballage pour chaque observation. Quand tu changes de film ou de sachet, tu recommences une mini-série plutôt que d’extrapoler l’ancienne. Tu ranges les sachets témoins dans une boîte datée, à l’écart des lots de vente. Tu refuses d’allonger la date annoncée sans nouvelle preuve écrite. Tu partages la durée provisoire avec l’aide qui vend pour qu’elle ne promette pas plus que le carnet.","expert":"Durée de vie: DDM vs DLC; essais de vieillissement réel et, si besoin, accéléré (température, humidité) avec prudence d’interprétation. Critères sensoriels, physico-chimiques (humidité, aw), microbiologiques (2073/2005 si pertinent). Exemple (nombres inventés pour l’exercice): sachet ouvert vs fermé, stockage réel Ouaga, trois critères sensoriels. Pour Baobab Bliss: tu observes, tu notes, tu décides; pas de durée magique. Protocole: lot, date d’ouverture, observations datées. Tu relis la durée affichée à des preuves que tu peux montrer. La durée de vie se prouve: protocoles sensoriels + physico-chimie (humidité, activité de l’eau) + microbiologie pertinente (2073/2005). DDM vs DLC selon le type de périssabilité. Essais accélérés s’interprètent avec prudence (mécanismes différents). Pour Baobab Bliss, stockage réel Ouaga, sachet ouvert/fermé. Exemple (nombres inventés pour l’exercice): trois critères sensoriels d’arrêt. Tu relis la date affichée à des observations datées. Pas de durée «parce que la voisine le fait». Tu distinguishes durée en sachet intact et après ouverture. Les clientes vivent les deux. Note température ambiante approximative de la pièce de stockage lors des observations (sans précision fantaisiste). Observations ouvertes et fermées se notent séparément pour la durée affichée. Tu distinguishes durée en sachet intact et durée après ouverture, car les clientes vivent les deux situations. Note aussi une indication qualitative du climat de stockage sans précision fantaisiste.","quiz":[{"q":"Base d’une date?","choices":["Copie magique","Observation dans des conditions décrites","Optimisme seul"],"correct":1,"why_ok":"Observer.","why_ko":"Magie fragile."},{"q":"Sachet mal fermé?","choices":["Raccourcit la vie","Sans effet","Améliore"],"correct":0,"why_ok":"Fermeture critique.","why_ko":"Sans effet faux."},{"q":"Moyens limités?","choices":["Cacher","Rester honnête sur ce que tu mesures","Inventer un labo"],"correct":1,"why_ok":"Honnêteté.","why_ko":"Fiction nuit."},{"q":"Après nouveaux lots?","choices":["Geler à jamais","Revoir la date","Effacer"],"correct":1,"why_ok":"Revoir.","why_ko":"Gel aveugle."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"Tu fixes des critères observables avant d’afficher une durée.","truth":true,"why":"Méthode."},{"t":"Tu peux inventer une durée longue pour vendre.","truth":false,"why":"Pas d’invention."},{"t":"Stockage et emballage influencent la durée.","truth":true,"why":"Leviers."}]},"exercise":{"prompt":"Protocole 3 sachets ou 3 dates ou grille ou conclusion provisoire.","hint1":"Conditions notées.","hint2":"Prudence.","solution":"Exemple: date prudente après observations 30 et 60 jours."}},{"title":"Fiche de coûts du dossier","body":["La fiche de coûts du dossier reprend ta structure de revient avec des chiffres d’exemple clairement marqués ou tes vrais tickets. Chez Baobab Bliss, tu montres variables, fixes, volume, coût complet, et un seuil de rentabilité. Une lectrice doit voir comment tu penses, pas seulement un prix final.","Tu annexes les sources: ticket, estimation, exemple inventé. Sans source, le chiffre est suspect. Tu dates la fiche. Tu recalcules si un poste bouge. Tu relis coût et prix de lancement: le prix couvre-t-il le coût complet au volume réaliste?","Si non, tu ajustes volume, coûts ou prix , pas le silence. Aujourd’hui, une page recto coûts + une phrase de décision prix. Tu annexes la source de chaque chiffre: ticket, estimation, ou exemple inventé. Si le volume réaliste change, tu recalcules la fiche le même jour.","Chez Baobab Bliss les coûts sans source rendent le dossier fragile face à une question simple. Annexe la source de chaque chiffre: ticket, estimation, ou mention d’exemple inventé pour l’exercice. Si le volume réaliste change, recalcule la fiche le même jour.","Sans source, le dossier devient fragile dès la première question simple. Ajoute une ligne main-d’œuvre si tu te verses une rémunération atelier, même modeste. Sinon le «bénéfice» mange un salaire invisible. Date la fiche et lie-la au prix de lancement choisi."],"prof":"La fiche coûts rend ton ambition comptable. Elle calme les rêves et protège la maison. Marque les exemples. Montre le seuil. Décide. Une page claire impressionne plus qu’un discours. Mets à jour quand le sachet ou le fruit change vraiment. Garde l’ancienne version en archive pour voir ta progression. Tu termines la fiche de coûts par un geste daté: source écrite sous chaque chiffre.","tip":"Écris « exemple » devant chaque chiffre non issu d’un ticket réel.","simple":"Comme compter le coût d’une fête: ingrédients, location, et nombre d’invités. Sans le nombre, le partage des frais fixes ment. Avec le nombre, tu vois si la caisse suffit. L’image du carnet de dépenses du marché fixe l’idée de sources sous chaque chiffre.","plus":"Tu annexes la source de chaque chiffre: ticket réel, estimation raisonnée, ou mention claire d’exemple inventé pour l’exercice. Tu ajoutes une ligne de sensibilité: que devient la marge si la matière monte de dix pour cent environ. Tu recalcules toute la fiche le jour où le volume réaliste change. Tu sépares clairement l’exercice pédagogique et les chiffres du mois réel pour ne pas tromper le dossier. Chez Baobab Bliss un coût sans source rend la fiche fragile face à une question simple. Tu entoures le coût complet unitaire avant de parler prix de vente. Tu refuses les décimales décoratives qui cachent une estimation grossière. Tu relis le seuil de rentabilité au nombre de sachets du mois pour rendre le calcul actionnable. Tu gardes la fiche à jour dans la même pochette que les tickets du mois. Tu refuses un prix sous le complet sauf stratégie écrite et datée, limitée dans le temps.","expert":"Fiche coûts du dossier: hypothèses datées, unités, sources (facture, estimation), cases inconnues visibles. Sensibilité: que se passe-t-il si la gousse monte de 10 % ? Exemple (nombres inventés pour l’exercice): matières, sachets, énergie estimée, temps; total indicatif clairement marqué exemple. Pour Baobab Bliss: date en haut. Dans trois mois tu mets à jour. Le dossier aime le réel, même incomplet. Tu refuses une fiction complète qui te ment. La fiche coûts du dossier expose hypothèses, unités, sources, sensibilités. Une hausse matière se lit directement si la grille est claire. Exemple (nombres inventés pour l’exercice): matières, sachets, énergie estimée, temps; total marqué comme exemple. Pour Baobab Bliss, date en tête, mise à jour trimestrielle. Cases inconnues visibles. Le dossier d’ingénieure préfère l’incomplet honnête à la fiction. Tu relis coût et prix sans bricolage d’étiquette. Une analyse de sensibilité à la main (trois scénarios matière) suffit souvent. Tu montres que tu comprends où le modèle casse. Cela vaut mieux qu’un tableau figé jamais relu. La fiche coûts du dossier s’aligne sur une exigence de transparence digne d’un mémoire d’ingénieure. Trois scénarios de hausse matière à la main montrent où le modèle de coût casse. Transparence des hypothèses; lien Règl. (UE) 1169/2011: pas de mention trompeuse issue d’un coût fantaisiste.","quiz":[{"q":"Devant un chiffre inventé?","choices":["L’effacer sans trace","Le présenter comme officiel","Écrire exemple"],"correct":2,"why_ok":"Marquer.","why_ko":"Faux officiel nuit."},{"q":"Seuil?","choices":["Couleur logo","Radio","Volume pour couvrir les fixes"],"correct":2,"why_ok":"Break-even.","why_ko":"Logo non."},{"q":"Si prix < coût complet?","choices":["Ajuster volume, coûts ou prix","Inventer un bénéfice","Se taire"],"correct":0,"why_ok":"Ajuster.","why_ko":"Silence nuit."},{"q":"Que dois-tu annexer à chaque chiffre de la fiche de coûts ?","choices":["Seulement le total final","Ticket, devis, ou mention d’exemple inventé","Rien, les chiffres parlent seuls"],"correct":1,"why_ok":"Chaque chiffre du dossier doit montrer d’où il vient.","why_ko":"Sans source, une lectrice ne peut pas faire confiance à la fiche."}],"activity":{"type":"calc","prompt":"Fiche dossier (TES chiffres)","fields":[{"id":"mat","label":"Matière (FCFA)"},{"id":"emb","label":"Emballage (FCFA)"},{"id":"temps","label":"Temps valorisé (FCFA)"},{"id":"autres","label":"Autres (FCFA)"}],"note":"Laisse vide ce que tu ne connais pas encore.","tip":"Honnêteté du dossier."},"exercise":{"prompt":"Page coûts + seuil + phrase décision prix.","hint1":"Marque exemples.","hint2":"Volume réaliste.","solution":"Complet environ327; prix 400; seuil 200; décision: tenir 400 au canal choisi."}},{"title":"Plan de lancement","body":["Le plan de lancement dit comment tu passes du dossier à la première vraie vague de ventes. Chez Baobab Bliss, tu choisis un canal, un volume d’essai, un budget d’essais, une date de revue, et des critères go ou pas encore.","Un lancement modeste maîtrisé bat une grande annonce vide. Tu prépares le stock, les étiquettes version validée, le discours oral, et le carnet de retours. Tu fixes qui fait quoi si tu as une aide. Tu évites de changer tamis, prix et sachet le même jour que le lancement.","Après la revue, tu décides: continuer, ajuster, ou pause. Tu écris la décision. Tu gardes les preuves (ventes, objections, défauts). Aujourd’hui, une page: canal, volume, budget d’essais, date de revue, critères, décision type. Tu gèles le message oral pendant l’essai.","Tu captures les verbatims avant la revue go ou pause. Les critères écrits à l’avance évitent de décider sous l’émotion du premier compliment. Baobab Bliss tranche sur des règles, pas sur l’enthousiasme du jour. Gèle le message oral pendant l’essai: une seule phrase claire.","Note les verbatims avant la revue go ou pause. Fixe un plafond de volume d’essai et tiens-le, même si l’enthousiasme monte. Après la revue, versionne le plan (v1, v2) avec la décision et la date."],"prof":"Lancer, c’est exposer ton travail au réel avec méthode. Choisis petit. Mesure. Décide. La dignité d’un lancement tient à la revue honnête, pas au bruit. Prépare le carnet de retours avant le premier sachet vendu. Si les critères ne sont pas là, pause sans honte. Tu construis pour douze à dix-huit mois, pas pour une soirée. Tu termines le plan de lancement par un geste daté: critères go ou pause figés avant le jour J.","tip":"Écris la date de la première revue avant de vendre le premier sachet d’essai.","simple":"Comme ouvrir une petite table au marché: tu prépares peu de portions, tu notes ce qui part, tu décides la semaine suivante. Tu n’ouvres pas dix tables le premier jour. L’image du premier étal testé un jour de pluie fixe l’idée d’un essai borné et revue.","plus":"Plan de lancement: objectifs SMART simples, volume, canal, budget, points à surveiller, revue. Exemple (nombres inventés pour l’exercice): 40 sachets, budget essais 10 000 FCFA, revue à 14 jours, critère go si ≥25 ventes et ≤3 plaintes majeures. Stop si critères absents. Prépare le message de pause autant que le go: dire quoi aux clientes, faire quoi des sachets restants, corriger quoi avant un second essai. Tu gèles le message oral pendant l’essai terrain et tu captures les verbatims avant la revue. Tu prépares le message de pause aussi soigneusement que le message de go: quoi dire aux clientes, quoi faire des sachets restants, quoi corriger avant un second essai. Les critères écrits tranchent, pas l’enthousiasme du jour. Tu transformes les verbatims du canal d’essai en une décision go ou pause écrite avant la fin de semaine. Prolongement utile: geler le message oral pendant l’essai rend les verbatims comparables d’un jour à l’autre.","expert":"Plan de lancement: canal, offre, prix, stock mini, critères go/no-go, date de revue, budget d’essais. Lien avec capstone: diagramme, maîtrise, étiquette, durée, coûts doivent être « assez prêts ». Exemple (nombres inventés pour l’exercice): foire locale, budget essais 15 000 FCFA (exemple), revue à J+14. Pour Baobab Bliss: une page suffit. Reculer la date si les critères go manquent. Un report calme bat une foire ratée. Tu ouvres d’abord aux canaux proches, puis tu élargis. Le plan de lancement synthétise le capstone: readiness du diagramme, de la maîtrise, de l’étiquette, de la durée, des coûts. Critères go/no-go écrits. Canal initial proche, budget d’essais, date de revue. Exemple (nombres inventés pour l’exercice): revue à J+14, budget essais 15 000 FCFA (exemple). Pour Baobab Bliss, une page. Reculer si go manquants. Tu documents ce qui sera appris (questions clientes) autant que ce qui sera vendu. Après le lancement, tu captures trois apprentissages écrits à la revue. Le capstone continue dans la vie réelle de Baobab Bliss. Clôture la version scolaire seulement quand les preuves minimales existent. Le plan de lancement clôture le capstone en reliant Codex (diagramme) et Règl. (UE) 1169/2011 (étiquette). Synthèse: Codex (diagramme) et Règl. La revue à J plus 14 capture trois apprentissages écrits avant d’élargir le canal. Synthèse Codex diagramme et Règlement (UE) 1169/2011 étiquette.","quiz":[{"q":"Meilleur démarrage?","choices":["Grande annonce vide","Aucun critère","Canal modeste maîtrisé"],"correct":2,"why_ok":"Modestie maîtrisée.","why_ko":"Annonce vide fragile."},{"q":"Avant le pr
