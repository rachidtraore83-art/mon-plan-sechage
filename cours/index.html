emier sachet?","choices":["Rien écrire","Changer tous les réglages","Date de revue et critères"],"correct":2,"why_ok":"Préparer la revue.","why_ko":"Chaos nuit."},{"q":"Si critères absents?","choices":["Forcer quand même","Pause ou ajuster","Effacer les chiffres"],"correct":1,"why_ok":"Respecter les critères.","why_ko":"Forcer nuit."},{"q":"Pendant l’essai?","choices":["Changer le discours chaque heure","Geler le message principal","Mentir sur le contenu"],"correct":1,"why_ok":"Stabiliser.","why_ko":"Mensonge nuit."}],"activity":{"type":"order","prompt":"Lancement","steps":["Choisir le canal de démarrage","Fixer le budget d’essais","Poser la date de revue","Décider l’étape suivante"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Choisir le canal de démarrage, Fixer le budget d’essais, Poser la date de revue, Décider l’étape suivante"},"exercise":{"prompt":"Page lancement: canal, volume, budget, revue, critères, décision type.","hint1":"Modestie.","hint2":"Critères avant.","solution":"40 sachets; revue J+14; go si ventes et plaintes sous seuil."}}]},"QBANK":[{"keys":["diplome","officiel","cti","ingenieur"],"q":"Ce cours donne-t-il un diplôme officiel ?","a":"Non. Ce parcours est une autoformation inspirée des programmes d’ingénieure agroalimentaire. Aucune école ni la commission des titres d’ingénieur ne délivre de diplôme ici. Les badges marquent seulement ta progression amicale.","mod":"m0","li":0,"example":"Quand une voisine à Ouagadougou te demande si tu « as ton diplôme d’ingénieure » après ce fichier, tu réponds calmement que tu te formes pour ton atelier Baobab Bliss, sans titre scolaire à coller sur le sachet.","next":"Écris en une phrase, dans ton carnet, ce que ce cours est et ce qu’il n’est pas, puis lis-la à voix haute.","alt":"Pense à un atelier de couture qui t’apprend des gestes solides sans te remettre un diplôme d’État: tu repars plus habile, pas titrée.","hint":"Demande-toi qui aurait le pouvoir de te remettre un vrai diplôme, et si ce fichier le possède."},{"keys":["duree","mois","rythme","calendrier"],"q":"Combien de temps dure le parcours proposé ?","a":"Le parcours est pensé sur environ 12 à 18 mois, selon le rythme que tu choisis. Ce n’est pas un contrat figé: tu peux ralentir ou accélérer. Une à trois leçons par semaine, plus un petit geste atelier, suffisent en général.","mod":"m0","li":2,"example":"En saison des pluies à Ouagadougou, tu peux garder une seule leçon courte le mardi et reporter le geste tamisage au dimanche, sans « rater » le parcours.","next":"Choisis 12 ou 18 mois sur l’écran d’accueil et colle une feuille au mur avec les trois phases.","alt":"Comme la saison des mangues: tu ne cueilles pas tout le verger le même jour, tu avances arbre après arbre.","hint":"Regarde si le cours parle d’années scolaires ou d’un intervalle souple en mois."},{"keys":["prof","banque","hors ligne","offline"],"q":"Ta prof est-elle une personne au téléphone ?","a":"Non. Ta prof est un guide écrit préparé dans le cours, toujours disponible hors ligne. Elle explique, donne des indices et répond grâce à une banque de questions. Elle ne téléphone pas et ne facture pas d’appel.","mod":"m0","li":3,"example":"Un soir sans réseau à Ouagadougou, tu tapes « humidité » dans la banque: la réponse s’ouvre dans le fichier, sans attendre un message vocal.","next":"Ouvre la banque une fois et tape un mot simple lié à ton lot du jour, par exemple « sachet ».","alt":"C’est comme un carnet de recettes déjà rempli: tu le consultes quand tu veux, sans appeler la voisine.","hint":"Cherche si le cours parle d’appel, ou plutôt d’un texte toujours dans le fichier."},{"keys":["ordre","lecon","quiz","exercice"],"q":"Dans quel ordre suivre une leçon ?","a":"Tu lis d’abord les cartes, puis tu fais le quiz, ensuite l’activité, enfin l’exercice terrain. Les volets « Pour aller plus loin » et « Niveau expert » restent optionnels. Tu peux les ouvrir plus tard sans bloquer ta semaine.","mod":"m0","li":1,"example":"Sur la leçon eau, tu lis les cartes le matin, tu fais le quiz, tu notes un lot Baobab Bliss dans le carnet l’après-midi, et tu laisses le niveau expert pour dimanche calme.","next":"Pour ta prochaine leçon, fais l’exercice le même jour que les cartes, même en cinq minutes.","alt":"Comme préparer du tô: tu ne sers pas la pâte avant d’avoir chauffé l’eau; ici tu n’attaques pas l’exercice avant cartes et quiz.","hint":"Repense à l’ordre cuisine: lire, vérifier, faire dans l’atelier."},{"keys":["phase","fondations","A"],"q":"Que contient la phase A ?","a":"La phase A pose les fondations. Tu y trouves la méthode d’étude, la composition du baobab, l’hygiène de base, puis la nutrition et l’étiquette honnête. Elle prépare le cœur atelier sans te précipiter vers la vente.","mod":"m0","li":0,"example":"Avant de parler emballage de ta poudre Baobab Bliss, tu passes d’abord par ces bases: tu sais pourquoi tu notes lot et date, et pourquoi tu n’inventes pas un chiffre sur le sachet.","next":"Sur ta feuille murale, entoure « phase A » et liste les quatre thèmes en mots courts.","alt":"C’est le socle d’une case en banco: sans fondations sèches, tu ne montes pas les murs le même jour.","hint":"La lettre A évoque le début: qu’est-ce qui doit être solide avant le procédé ?"},{"keys":["phase","B","atelier"],"q":"Que contient la phase B ?","a":"La phase B est le cœur atelier. Elle couvre le procédé et le séchage futur, l’emballage, la qualité au quotidien, puis les règles utiles pour ton canal et pour un éventuel regard européen. Tu mets les gestes en pratique après les fondations.","mod":"m0","li":2,"example":"Quand tu décideras comment fermer et ranger tes sachets de pain de singe, tu seras déjà dans cette phase: table propre, lot noté, emballage choisi avec méthode.","next":"Repère sur le calendrier du cours où commence la phase B et note le premier module concerné.","alt":"Après avoir appris à tenir l’aiguille, tu couds vraiment le pagne: la phase B, c’est cette couture utile.","hint":"Cherche le mot « atelier » dans le découpage des phases."},{"keys":["phase","C","marche","projet"],"q":"Que contient la phase C ?","a":"La phase C ouvre sur le marché: goût et améliorations, mesures, organisation et coûts, vente responsable, puis le projet final Atelier Baobab Bliss. Elle s’appuie sur tout ce que tu as construit avant.","mod":"m0","li":3,"example":"Le jour où une acheteuse de boutique te demande ton prix au sachet et ta durée de conservation, tu puiseras dans cette phase pour répondre sans improvisation hasardeuse.","next":"Crée dès cette semaine une pochette « questions clientes » pour les collecter avant la phase C.","alt":"C’est le moment où tu présentes le plat aux invités: la cuisine est déjà faite, tu soignes le service.","hint":"Quelle phase parle de vente et de projet final ?"},{"keys":["reviser","score","faible"],"q":"Comment réviser une leçon faible ?","a":"Tu rouvres la leçon où ton score quiz était bas. Tu refais seulement le quiz et l’activité, tu relis la carte simple, et tu notes en une ligne ce que tu confondais. Le niveau expert attend un jour plus calme.","mod":"m0","li":3,"example":"Si tu as confondu humidité et activité de l’eau sur la leçon eau, tu relis la carte simple le lendemain, tu refais les quatre questions, puis tu touches un lot Baobab Bliss ouvert et tu notes ce que tu sens.","next":"Après ton prochain quiz raté, écris une seule ligne « je confondais … » dans le carnet.","alt":"Comme reprendre un ourlet raté: tu ne refais pas tout le pagne, tu corriges la zone faible.","hint":"Réviser, est-ce tout relire, ou cibler quiz, activité et carte simple ?"},{"keys":["exemple","chiffre","invente"],"q":"Pourquoi certains nombres portent la mention Exemple ?","a":"Parce que ces nombres sont inventés pour t’entraîner à calculer. Ce ne sont ni les chiffres de ton lot, ni une norme à recopier sur l’étiquette. La mention « Exemple » te rappelle de ne pas les coller tels quels.","mod":"m0","li":0,"example":"Si un calcul du cours parle d’un poids de poudre « Exemple », tu ne recopies pas ce poids sur ton sachet Baobab Bliss: tu pèses ton vrai lot quand tu pourras.","next":"Sur ton brouillon d’étiquette, barre au crayon tout chiffre qui n’a pas encore de source claire.","alt":"Au marché, un prix écrit sur un tableau d’école pour un exercice n’est pas le prix réel de la tomate du jour.","hint":"Que signale le mot placé juste devant certains nombres du cours ?"},{"keys":["ethique","etiquette","inventer"],"q":"Puis-je inventer un chiffre sur mon étiquette ?","a":"Non. Sur l’étiquette tu n’inventes aucun chiffre. Tu laisses la case vide ou tu écris « à mesurer » jusqu’à un bulletin d’analyse fiable. L’honnêteté protège la confiance de tes clientes.","mod":"m0","li":4,"example":"Pour la vitamine C de ta poudre Baobab Bliss, tu prépares la ligne du tableau et tu la laisses en attente plutôt que d’écrire un taux entendu au marché.","next":"Sur le brouillon d’étiquette, écris clairement « à mesurer » là où un nutriment n’a pas encore de bulletin.","alt":"Si tu ne connais pas le prix d’un article au marché, tu ne cries pas un montant au hasard: tu vérifies d’abord.","hint":"Entre inventer et laisser vide, quelle attitude le cours choisit ?"},{"keys":["medical","guerir","promesse"],"q":"Puis-je promettre que la pulpe guérit ?","a":"Non. Baobab Bliss est un aliment: pulpe pure à diluer ou à cuisiner. Tu ne promets pas de guérir, soigner ou remplacer un avis de santé. Le cours refuse ces phrases sur le sachet comme dans les messages.","mod":"m0","li":0,"example":"Si une cliente au marché dit « ça guérit la fatigue », tu souris et tu recentres: « C’est de la pulpe de baobab, cent pour cent, à diluer dans l’eau ou à cuisiner. »","next":"Apprends une phrase courte de recentrage et répète-la jusqu’à ce qu’elle sonne naturelle.","alt":"Le mil nourrit; le médicament soigne sous conseil. On ne demande pas au mil de remplacer le médicament.","hint":"Le cours parle d’aliment ou de traitement quand il décrit ton sachet ?"},{"keys":["badge","officiel"],"q":"Les badges du cours sont-ils officiels ?","a":"Non. Les badges du cours marquent ta progression amicale dans l’autoformation. Ils ne valent pas un titre reconnu par une école ou une commission officielle. Tu peux t’en réjouir sans les coller comme preuve légale.","mod":"m0","li":0,"example":"Quand tu débloques un badge après le module hygiène, tu le notes dans ton carnet comme encouragement, pas comme tampon à montrer à une acheteuse de boutique.","next":"Dans le carnet, ajoute une ligne: badge marque la progression perso, pas un diplôme.","alt":"C’est comme une étoile dessinée sur un cahier d’école à la maison: ça motive, ça ne remplace pas un bulletin officiel.","hint":"Les badges sont-ils remis par une autorité scolaire, ou par le fichier lui-même ?"},{"keys":["carnet","lot","date"],"q":"Pourquoi tenir un carnet avec lot et date ?","a":"Le carnet avec lot et date relie chaque leçon à ton stock réel. Tu retrouves l’histoire d’un sachet, tu compares les lots, et tu prépares la qualité comme une responsable d’atelier. Sans date ni lot, les observations se perdent.","mod":"m0","li":1,"example":"Après avoir tamisé un bac de pain de singe, tu écris la date du jour et le numéro de lot avant de ranger: si une cliente revient la semaine suivante, tu sais de quel bac parlait ton stock.","next":"Dès la prochaine session, note date et numéro de lot avant de ranger la poudre.","alt":"Comme numéroter les bassines de dolo pour savoir laquelle a fermenté hier: sans marque, tout se ressemble.","hint":"Que pourrais-tu retrouver dans six mois si lot et date manquent ?"},{"keys":["je n'ai pas compris","simple"],"q":"À quoi sert « Je n’ai pas compris » ?","a":"Le bouton « Je n’ai pas compris » reformule la leçon avec une image du quotidien, plus simple. Il ne te juge pas et ne saute pas l’idée: il la dit autrement. Tu peux l’utiliser dès qu’une carte reste floue.","mod":"m0","li":1,"example":"Si la carte sur l’activité de l’eau te paraît abstraite, tu appuies sur ce bouton et tu relis l’image de l’éponge et du bol avant de retourner à ta poudre Baobab Bliss.","next":"Sur ta prochaine leçon, utilise une fois « Je n’ai pas compris » même si tu crois avoir à peu près saisi.","alt":"Demander son chemin deux fois au marché n’est pas une honte: ici, redemander une notion deux fois non plus.","hint":"Ce bouton ajoute-t-il une nouvelle leçon, ou reformule-t-il la même ?"},{"keys":["limites","labo","avocat"],"q":"Le cours remplace-t-il un laboratoire ?","a":"Non. Le cours t’aide à poser les bonnes questions et à organiser tes gestes. Il ne remplace ni un laboratoire, ni un avocat, ni une professionnelle de santé. Pour un contrôle officiel ou un export, tu t’appuieras sur des analyses et des interlocuteurs compétents.","mod":"m0","li":0,"example":"Avant d’envoyer un lot Baobab Bliss vers un salon qui exige un bulletin, tu contactes un labo: le cours t’a préparé le vocabulaire, pas le résultat chiffré.","next":"Crée une pochette vide « bulletins labo » pour le jour où tu feras un premier essai payé.","alt":"Un guide de couture t’apprend les points; il ne remplace pas la couturière qui ajuste la robe sur mesure.","hint":"Le fichier peut-il signer un bulletin d’analyse à ta place ?"},{"keys":["eau","activite","aw","humidite"],"q":"Quelle différence entre humidité et activité de l’eau ?","a":"L’humidité dit quelle masse d’eau se trouve dans le produit. L’activité de l’eau dit combien cette eau reste libre pour les microbes, les réactions chimiques ou le collage de la poudre. Les deux grandeurs se parlent, mais elles ne racontent pas la même chose.","mod":"m1","li":0,"example":"Deux lots Baobab Bliss peuvent sembler secs au toucher; celui qui a repris l’air humide de la saison des pluies formera des grumeaux plus vite, même si tu n’as pas encore pesé l’eau totale.","next":"Après ouverture d’un sachet, referme-le aussitôt et glisse-le dans une boîte sèche dédiée.","alt":"Une éponge et un bol peuvent « contenir » de l’eau: l’éponge la retient, le bol la laisse libre. L’activité de l’eau ressemble à cette liberté.","hint":"Poids d’eau d’un côté, liberté de cette eau de l’autre: lequel est l’humidité ?"},{"keys":["baobab","sechage","gousse","pulpe"],"q":"Dois-je sécher à chaud ma pulpe de baobab comme une mangue ?","a":"Non, pas par habitude. La pulpe est déjà naturellement sèche dans la gousse. Ton travail Baobab Bliss, c’est extraire, séparer, tamiser, puis garder la poudre sèche et propre jusqu’au sachet. Le séchage chaud agressif concerne surtout tes futurs fruits, pas ce geste-là.","mod":"m1","li":0,"example":"Tu ouvres des gousses, tu retires fibres et graines, tu tamises la pulpe: tu ne mets pas ce lot au four « comme une mangue », sauf si une mesure claire montre une humidité trop haute.","next":"Note dans le carnet: pour le baobab, contrôler le sec, pas chauffer par réflexe.","alt":"Le mil déjà sec au grenier ne se fait pas griller pour « finir »: on le protège de l’humidité. Ta pulpe suit la même logique.","hint":"La gousse livre-t-elle une pulpe déjà sèche, ou un fruit juteux à sécher ?"},{"keys":["grumeaux","humidite","reprise"],"q":"Que faire si la poudre forme des grumeaux après ouverture ?","a":"Tu notes le lot, tu refermes mieux, tu ranges au sec. Tu cherches une reprise d’humidité: sachet mal fermé, air de saison des pluies, boîte humide. Tu ne mélanges pas un lot douteux avec un lot sain.","mod":"m1","li":0,"example":"Un sachet Baobab Bliss ouvert depuis trois jours sur la table forme des boulettes: tu l’isoles, tu écris la date, tu ranges le reste dans une boîte sèche refermée.","next":"Vérifie ce soir comment tu refermes les sachets entamés et où tu les poses.","alt":"Le couscous oublié à l’air devient collant: on ne le verse pas dans le sac neuf pour « arranger ». On isole et on corrige le stockage.","hint":"Les grumeaux nouveaux pointent surtout vers quelle condition autour de la poudre ?"},{"keys":["isotherme","sorption","humidite","activite","eau","stockage","poudre"],"q":"À quoi sert une isotherme de sorption ?","a":"Une isotherme de sorption décrit, à température fixe, combien d’eau ta poudre garde selon que l’air laisse cette eau plus ou moins libre: on parle alors d’activité de l’eau. Au laboratoire, des modèles aident à lire cette courbe pour viser une zone de stockage plus stable. Ce n’est pas un chiffre magique: c’est une carte d’humidité pour comprendre ton atelier.","mod":"m1","li":0,"example":"Quand tu pourras faire mesurer un point de ta poudre Baobab Bliss, tu sauras si ton local de Ouaga pousse le lot vers une zone où la poudre colle plus facilement.","next":"Si tu as accès à un hygromètre de pièce, note l’humidité relative près du stock un matin et un après-midi.","alt":"Comme une carte qui relie la pluie dehors à l’état du linge étendu: elle ne lave pas le linge, elle explique pourquoi il sèche mal.","hint":"Cette courbe parle-t-elle du prix du sachet, ou du lien entre air et eau dans la poudre ?"},{"keys":["glucides","sucres","fibres"],"q":"De quoi la pulpe est-elle surtout riche ?","a":"La pulpe est surtout riche en glucides. On y trouve des sucres qui donnent une note sucrée, et des fibres, dont des substances pectiques. Les teneurs varient selon les études et selon ton lot: seul un dosage labo parle pour ton sachet.","mod":"m1","li":1,"example":"Quand tu dilues une cuillère de pain de singe dans l’eau, le goût un peu sucré et la texture légèrement liée viennent surtout de cette richesse en glucides et fibres.","next":"Note la dose de poudre et le volume d’eau de ta boisson test, avec la date.","alt":"Comme la farine dans une bouillie: ce qui « tient » et sucré domine souvent le profil, avant les matières grasses.","hint":"Entre graisses, glucides et protéines, que placent souvent les analyses en tête pour la pulpe ?"},{"keys":["pectine","texture","boisson"],"q":"Pourquoi ma boisson s’épaissit un peu ?","a":"Les fibres et la pectine de la pulpe lient légèrement le liquide. Ce n’est pas un défaut si tu restes sur cent pour cent pulpe. Tu ajustes la dose de poudre et l’eau, sans ajouter d’épaississant.","mod":"m1","li":1,"example":"Une cliente trouve ta boisson Baobab Bliss un peu « collante »: tu proposes moins de poudre pour la même tasse, tu notes le nouveau ratio, tu ne verses pas d’additif.","next":"Fais deux tasses côte à côte avec deux doses différentes et note laquelle reste agréable après cinq minutes.","alt":"La farine de mil dans la bouillie lie selon la quantité: trop, et la cuillère se dresse. Ta poudre joue un rôle voisin.","hint":"Quel composé de la pulpe aime lier un peu l’eau en boisson ?"},{"keys":["vitamine","C","ascorbique","lumiere"],"q":"Comment protéger la vitamine C de ma poudre ?","a":"Tu limites le temps d’ouverture, la lumière directe et un stockage très chaud. Tu refermes le sachet et tu le ranges à l’abri du soleil. Tu n’inventes pas un taux de vitamine C sur l’étiquette sans analyse.","mod":"m1","li":0,"example":"Tes sachets Baobab Bliss finis restent dans un carton opaque au fond de la pièce, pas sur le rebord de fenêtre en plein après-midi.","next":"Déplace aujourd’hui le stock fini loin du soleil direct et note le nouvel emplacement.","alt":"Le citron coupé oublié sur la table perd de sa vivacité: ta poudre ouverte longtemps à la chaleur et à la lumière fatigue aussi ses composés sensibles.","hint":"Quels trois ennemis reviennent pour l’acide ascorbique dans la leçon ?"},{"keys":["vitamine","chiffre","etiquette"],"q":"Puis-je coller un taux unique de vitamine C sur tous les sachets ?","a":"Non. Les teneurs en vitamine C varient beaucoup selon l’origine, la maturité, le stockage et la méthode de dosage. Tu attends un bulletin pour ton lot. La littérature donne des fourchettes, pas une étiquette unique.","mod":"m1","li":2,"example":"Tu refuses d’écrire le même taux sur tous les sachets Baobab Bliss « parce qu’une étude l’a dit »: ton arbre d’Ouagadougou n’est pas un laboratoire moyen d’un autre pays.","next":"Sur le brouillon d’étiquette, réserve une ligne vitamine C « en attente d’analyse ».","alt":"Comme afficher le même poids pour tous les paniers de tomates sans balance: pratique en apparence, trompeur en réalité.","hint":"Un seul chiffre peut-il représenter tous les lots et toutes les méthodes ?"},{"keys":["acide","pH","acidite"],"q":"Pourquoi le pain de singe est-il acidulé ?","a":"Le goût acidulé vient surtout d’acides organiques naturels: citrique, tartrique, malique, succinique, et aussi l’acide ascorbique. Le pH de la pulpe est bas dans plusieurs études. Deux lots peuvent goûter plus ou moins vifs selon l’arbre et la saison.","mod":"m1","li":3,"example":"Tu goûtes une pincée diluée de ton nouveau lot Baobab Bliss et tu notes « plus acide que le lot de mars »: tu ajustes le message à la cliente, pas la chimie inventée.","next":"Goûte une pincée diluée de chaque nouveau lot et note l’acidité perçue, par exemple de 1 à 5.","alt":"Le tamarin et le citron: tu reconnais l’acidité sans appareil. Le pH met juste un chiffre sur cette sensation pour comparer tes lots.","hint":"D’où vient la note acidulée si tu n’ajoutes aucun acide ?"},{"keys":["pH","moisissures","bacteries"],"q":"Un pH bas suffit-il à tout protéger ?","a":"Non. Un pH bas freine beaucoup de bactéries, mais des moisissures et certaines levures tolèrent mieux l’acidité. Tu combines acidité naturelle, basse disponibilité en eau, et gestes d’hygiène. L’un ne remplace pas les autres.","mod":"m1","li":3,"example":"Même avec une pulpe acidulée, tu laves la table et tu refermes les sachets Baobab Bliss: tu ne comptes pas sur le seul goût acide pour garder le lot net.","next":"Sur ta feuille murale, écris trois piliers: acidité, eau basse, propreté.","alt":"Une sauce bien acide ne dispense pas de laver la marmite: le goût aide, la propreté reste.","hint":"Qui tolère souvent mieux l’acidité: toutes les bactéries, ou aussi moisissures et levures ?"},{"keys":["titration","acidite","titrable"],"q":"pH et acidité titrable sont-ils la même chose ?","a":"Non. Le pH mesure l’intensité acide perçue sur une échelle. L’acidité titrable mesure la quantité d’acides. Deux lots peuvent différer sur l’un ou sur l’autre selon l’arbre et la saison.","mod":"m1","li":3,"example":"Deux lots Baobab Bliss peuvent donner une boisson aussi « vive » au papier pH, mais l’un demandera plus de soude en labo pour neutraliser: quantité et intensité ne racontent pas la même histoire.","next":"Dans le carnet, crée deux colonnes: « goût acide, par exemple de 1 à 5 » et « à mesurer au labo plus tard ».","alt":"Le piment fort et la quantité de piment dans la sauce: brûler fort n’est pas la même chose que beaucoup de piment pesé.","hint":"Intensité d’un côté, quantité de l’autre: lequel est le pH ?"},{"keys":["mineraux","potassium","calcium"],"q":"Quels minéraux reviennent souvent dans les analyses de pulpe ?","a":"Les études citent souvent le potassium et le calcium en tête, avec du magnésium et des oligoéléments comme le fer, le manganèse ou le cuivre en plus petites quantités. Les valeurs changent selon le sol, le climat et la méthode. Tu n’affirmes un minéral sur l’étiquette qu’avec analyse et règles adaptées.","mod":"m1","li":4,"example":"Si une cliente demande « il y a du calcium ? », tu dis que la littérature en décrit souvent dans la pulpe, et que tu feras analyser ton lot Baobab Bliss avant d’afficher un chiffre.","next":"Sur le brouillon d’étiquette, réserve une ligne « minéraux : en attente d’analyse ».","alt":"Le sel dans la sauce: une fois fondu tu ne le vois plus grain par grain, mais tu le sens. Les minéraux de la pulpe sont cachés ainsi; seul le labo les compte vraiment.","hint":"Quels deux minéraux reviennent le plus souvent en tête de liste dans les études ?"},{"keys":["cendres","labo"],"q":"Que mesurent les cendres au laboratoire ?","a":"Les cendres au laboratoire sont le résidu après incinération. Elles donnent une idée de la fraction minérale globale. Ce n’est pas un détail à inventer en atelier: c’est une mesure de laboratoire.","mod":"m1","li":0,"example":"Tu ne peux pas « estimer » les cendres de ton pain de singe à l’œil: tu priorises d’abord le tri du sable et des coques, puis un bulletin quand le budget labo le permettra.","next":"Ajoute dans ta liste labo future le mot « cendres » après humidité et hygiène.","alt":"Comme peser la cendre restante après un feu de bois pour savoir ce qui ne brûle pas: geste de labo, pas de cuisine improvisée.","hint":"Les cendres se voient-elles sur la table, ou se mesurent-elles après un protocole labo ?"},{"keys":["brunissement","couleur","maillard"],"q":"Pourquoi noter la couleur de chaque lot ?","a":"La couleur raconte le stockage, la matière et le tri. Une dérive peut signaler chaleur, humidité reprise ou fragments sombres de coque. Noter clair, moyen ou foncé à côté de la date t’aide à réagir tôt. Un témoin opaque daté rend la comparaison plus juste.","mod":"m1","li":5,"example":"Tu photographies chaque lot Baobab Bliss au même coin de la pièce, même lumière du matin, et tu gardes un fond de sachet témoin dans une boîte opaque datée.","next":"Photographie ton prochain lot au même endroit et note clair, moyen ou foncé.","alt":"Le riz trop grillé ne redevient pas blanc: une poudre trop brunie au stockage ne « guérit » pas non plus. On corrige le prochain lot.","hint":"Pourquoi un carnet de couleur sert-il avant même d’avoir un appareil de labo ?"},{"keys":["maillard","sucres","amines"],"q":"Qu’est-ce que la réaction de Maillard ?","a":"La réaction de Maillard est une famille de réactions entre sucres et composés aminés. Elle peut foncer la couleur sous certaines humidités et chaleurs. Sur ta pulpe déjà sèche, tu surveilles surtout un brunissement lent lié au stockage, pas une cuisson agressive.","mod":"m1","li":5,"example":"Un carton de sachets Baobab Bliss oublié près d’un mur qui chauffe l’après-midi peut brunir plus vite qu’un carton à l’ombre: tu notes et tu déplaces.","next":"Déplace tout stock fini éloigné d’un mur chaud et note la date du déplacement.","alt":"Le pain oublié trop près du feu fonce: la chaleur et un peu d’humidité fatiguent aussi la teinte de ta poudre.","hint":"Quels deux types de composés se rencontrent dans cette réaction de couleur ?"},{"keys":["lipides","graines","huile"],"q":"Où sont surtout les lipides du fruit de baobab ?","a":"Les lipides se concentrent surtout dans les graines. La pulpe en contient très peu. Pour une poudre pure et stable, tu sépares clairement pulpe et graines au tamisage.","mod":"m1","li":6,"example":"Si des fragments de graines broyées passent dans ta poudre Baobab Bliss, tu peux sentir plus tard une odeur fatiguée: tu resserres la maille du tamis et tu marques deux bassines.","next":"Prépare deux bassines marquées « pulpe » et « graines » avant la prochaine extraction.","alt":"Comme séparer le grain et la balle: chaque partie a son usage, les mélanger trouble le résultat.","hint":"La matière grasse du fruit vit-elle plutôt dans la pulpe ou dans les graines ?"},{"keys":["rance","oxydation","huile"],"q":"Qu’est-ce qui favorise le rance d’une huile de graines ?","a":"Le rance d’une huile de graines est favorisé par la chaleur, la lumière, l’oxygène et certains métaux. Le bon stockage reste la première barrière: sec, ombre, contenants propres. Un projet huile est un autre métier que le sachet de pulpe.","mod":"m1","li":2,"example":"Si tu gardes des graines pour une future huile, tu les ranges au sec, à l’abri du soleil, avec la date de récolte, loin de la zone où tu remplis les sachets Baobab Bliss.","next":"Si tu as des graines en attente, étiquette la date et déplace-les hors du soleil.","alt":"L’huile d’arachide oubliée au soleil prend une odeur fatiguée: les lipides des graines de baobab craignent la même exposition.","hint":"Cite au moins deux conditions qui poussent une huile vers le rance."},{"keys":["zones","pulpe","graines"],"q":"Pourquoi séparer zone pulpe et zone graines ?","a":"Séparer les zones évite mélanges, odeurs et oxydation croisée. Deux bassines marquées et un lavage dès qu’un outil change de zone protègent la promesse pulpe pure. Tu ne partages pas la même surface le même jour sans nettoyage.","mod":"m1","li":6,"example":"Le matin tu travailles la pulpe Baobab Bliss sur la table principale; les graines attendent dans une bassine marquée à l’écart, et la spatule change de zone seulement après lavage.","next":"Marque au marqueur deux bassines et décide quelle zone de table est « pulpe seulement ».","alt":"Comme ne pas couper l’oignon parfumé sur la planche du pain sans laver: les odeurs voyagent.","hint":"Que cherches-tu à empêcher en gardant pulpe et graines à distance ?"},{"keys":["composition","litterature","variabilite"],"q":"Pourquoi la composition publiée varie-t-elle autant ?","a":"Origine, saison, maturité, méthode de dosage et base de calcul (frais ou sec) changent les chiffres publiés. Les études donnent des fourchettes, pas une vérité unique pour Ouagadougou. Ton lot se mesure pour ton sachet.","mod":"m1","li":0,"example":"Tu lis une fourchette de fibres dans un article, puis tu retiens le mot « fourchette »: tu ne la recopies pas telle quelle sur l’étiquette Baobab Bliss.","next":"Dans le carnet, écris: littérature donne une fourchette; mon sachet attend mon bulletin.","alt":"Deux paniers de gombos du même marché peuvent peser et goûter différemment: la moyenne d’un livre ne remplace pas ta balance.","hint":"Pourquoi un chiffre lu dans une étude n’est-il pas automatiquement le tien ?"},{"keys":["100%","additif","promesse"],"q":"Puis-je ajouter un épaississant et garder « 100 % pulpe » ?","a":"Non. La promesse actuelle de Baobab Bliss exclut tout ajout. La texture un peu liée vient des fibres naturelles de la pulpe. Si tu ajoutes un épaississant, tu changes de produit et tu dois le nommer clairement.","mod":"m1","li":4,"example":"Pour une cliente qui veut une boisson plus épaisse, tu augmentes un peu la dose de poudre Baobab Bliss, tu ne verses pas de gélifiant en silence.","next":"Vérifie sur ta maquette que la liste d’ingrédients reste un seul mot: pulpe.","alt":"Dire « jus d’orange pur » tout en ajoutant du sucre cache le verre: la promesse et le contenu doivent se regarder en face.","hint":"Que dit exactement la promesse « cent pour cent pulpe, rien d’ajouté » ?"},{"keys":["microbes","bacteries","levures","moisissures"],"q":"Quelles familles de microbes dois-je connaître ?","a":"Tu retiens trois familles: bactéries, levures et moisissures. Chacune a des conditions préférées. Sur une poudre sèche et acide, beaucoup de bactéries sont freinées, mais les moisissures restent à surveiller si l’humidité revient.","mod":"m2","li":0,"example":"Avant chaque session Baobab Bliss, tu regardes ta table comme une étrangère et tu retires ce qui ouvrirait la porte à ces trois familles: poussière, fruit fendu, outil sale.","next":"Écris sur une feuille les trois familles et colle-la près de la table de travail.","alt":"Trois styles d’invités à la maison: ceux qui partent vite, ceux qui restent, ceux qui laissent des traces. Les microbes aussi. Tu choisis la maison qu’ils trouvent.","hint":"Combien de grandes familles le cours te demande de nommer ?"},{"keys":["portes","entree","contamination"],"q":"Quelles sont les portes d’entrée courantes ?","a":"Les portes d’entrée courantes sont les mains, les ustensiles, la poussière, une eau de lavage mal gérée, les insectes, les sachets sales et les fruits abîmés. Tu n’as pas besoin de voir les microbes pour fermer ces portes. Tu agis sur ce qui entre en contact avec la poudre.","mod":"m2","li":3,"example":"Un fruit fendu à l’ouverture de la gousse se retire avant extraction Baobab Bliss: ce geste coupe une porte d’entrée dès le début du lot.","next":"Choisis trois portes à corriger cette semaine et coche-les chaque soir.","alt":"Comme fermer les fenêtres quand la poussière du harmattan arrive: tu limites ce qui entre, tu ne chasses pas l’invisible à la main.","hint":"Liste ce qui touche vraiment ta poudre entre la gousse et le sachet."},{"keys":["piliers","croissance","temperature","temps"],"q":"Quels piliers font pousser les microbes ?","a":"Les piliers sont l’eau disponible, la nourriture, une température douce et le temps. Parfois l’oxygène compte aussi. Enlève un pilier et leur vie devient plus difficile. Sur ta poudre, tu coupes surtout l’eau et tu gères le temps d’ouverture.","mod":"m2","li":1,"example":"Une caisse de sachets Baobab Bliss collée à un mur ouest qui chauffe l’après-midi devient un mauvais coin: tu la déplaces à l’ombre, tu casses le pilier chaleur.","next":"Inscris « premier entré, premier sorti » sur ta caisse de stock et déplace toute caisse au soleil.","alt":"Le linge humide en boule dans un coin devient vite une mauvaise surprise. Le même linge étendu au sec reste net plus longtemps.","hint":"Si tu enlèves l’eau disponible, que se passe-t-il pour la pousse ?"},{"keys":["boisson","marche","jarre"],"q":"Comment gérer une jarre de dégustation au marché ?","a":"Tu utilises un récipient propre, tu prépares, tu sers vite à l’ombre, puis tu vides et tu laves en fin de marché. Tu ne laisses pas une jarre ouverte toute la journée au soleil. De petits volumes renouvelés valent mieux qu’une grande jarre unique qui attend.","mod":"m2","li":0,"example":"Au marché de Ouaga, tu arrives avec deux petites jarres propres pour la dégustation Baobab Bliss: tu sers l’une, tu gardes l’autre au frais relatif, tu renouvelles plutôt que de faire tiédir un grand volume.","next":"Pour ton prochain marché, prévois des volumes petits et un plan de lavage de fin de journée.","alt":"Le tô laissé couvert refroidit autrement que le tô découvert: le temps et la chaleur jouent partout, y compris sur une jarre sucrée.","hint":"Que gères-tu surtout sur une boisson de dégustation: le temps et l’ombre, ou l’attente au soleil ?"},{"keys":["fifo","stock","rotation"],"q":"Que veut dire premier entré, premier sorti ?","a":"Premier entré, premier sorti veut dire que tu vends d’abord les lots les plus anciens encore bons. Cela évite les coins oubliés au fond de la caisse. Tu rotates le stock avec méthode, pas au hasard de la main.","mod":"m2","li":1,"example":"Les sachets Baobab Bliss du lot de la semaine dernière restent devant; le nouveau lot se place derrière, clairement étiqueté.","next":"Réorganise une caisse aujourd’hui selon cette règle et marque les dates visibles.","alt":"Comme servir d’abord le bol de sauce préparé hier avant d’ouvrir la casserole du jour: on évite ce qui dort au fond.","hint":"Lequel sors-tu en premier: le lot le plus vieux encore bon, ou le tout dernier arrivé ?"},{"keys":["moisissure","tache","isoler"],"q":"Que faire si je vois une tache de moisissure ?","a":"Tu isoles le lot, tu ne le dilues pas dans un grand sac, tu notes la date et tu prends une photo si tu peux. Tu appliques ta règle écrite à l’avance. La décision à froid est plus juste qu’une improvisation le jour même.","mod":"m2","li":2,"example":"Une tache verdâtre apparaît sur un coin de bac Baobab Bliss: tu retires ce bac de la vente, tu écris l’heure, tu ne verses pas le reste « pour sauver ».","next":"Ajoute dans ton carnet une ligne « règle moisissure » signée de ta main avant le prochain incident.","alt":"Une mangue pourrie au fond du panier abîme les autres si tu la laisses. Un coin de poudre moisi joue le même rôle dans un grand bac.","hint":"Diluer ou isoler: que choisit la règle du cours ?"},{"keys":["aflatoxine","mycotoxine","labo"],"q":"Comment mesure-t-on les aflatoxines ?","a":"Les aflatoxines se mesurent en laboratoire avec des méthodes adaptées. On ne les voit pas comme du sucre sur la table. Ce sont des poisons naturels produits par certaines moisissures. Pour un export futur, les teneurs maximales se lisent dans les annexes selon la catégorie exacte du produit, avec le labo.","mod":"m2","li":6,"example":"Si un acheteur européen demande un jour un contrôle aflatoxines sur ton pain de singe, tu ne « testes » pas au soleil du matin: tu passes par un labo et tu ranges le bulletin avec le numéro de lot.","next":"Écris dans la pochette labo future le mot « aflatoxines: méthode et unité à demander ».","alt":"Comme peser de l’or fin: l’œil ne suffit pas, il faut l’outil adapté et une unité claire.","hint":"Peux-tu conclure à l’œil nu, ou faut-il un protocole de laboratoire ?"},{"keys":["diluer","lot","moisi"],"q":"Puis-je diluer un lot moisi pour sauver le stock ?","a":"Non. Diluer un lot moisi dans un grand sac étend le problème et casse la confiance. Tu isoles et tu décides clairement selon ta règle écrite. Sauver le volume n’est pas une méthode.","mod":"m2","li":1,"example":"Face à un bac Baobab Bliss douteux, tu résistes à l’idée de le mélanger « un peu » au stock sain: tu perds moins en retirant qu’en étendant.","next":"Relis ta règle moisissure à voix haute une fois, pour qu’elle soit prête avant l’urgence.","alt":"Verser de l’eau sale dans une jarre d’eau claire pour « arranger le niveau »: tout le volume en pâtit.","hint":"Le cours accepte-t-il le mélange pour sauver, ou l’isolation ?"},{"keys":["pathogene","poudre","survie"],"q":"Un pathogène peut-il survivre dans une poudre sèche ?","a":"Oui. Certains pathogènes peuvent survivre longtemps au sec, puis reprendre quand la poudre retrouve un milieu humide, par exemple une boisson ou une sauce. Cela ne dit pas que ta pulpe est forcément contaminée. Cela dit que l’hygiène compte même sur un produit qui paraît sec.","mod":"m2","li":5,"example":"Tu laves les mains et tu gardes la table nette avant de remplir les sachets Baobab Bliss, précisément parce que la cliente diluera la poudre dans l’eau chez elle.","next":"Affiche près du point d’eau: « Mains lavées avant chaque session et après chaque pause. »","alt":"Une graine sèche peut attendre la pluie pour germer. Certains microbes attendent aussi un verre d’eau pour se remettre en marche.","hint":"Le sec tue-t-il toujours, ou permet-il parfois une longue attente ?"},{"keys":["mains","lavage","argent"],"q":"Quand me laver les mains ?","a":"Tu te laves les mains avant de commencer, après les toilettes, après avoir touché l’argent du marché, après t’être mouchée, après avoir manipulé des déchets, et à chaque reprise de session. Eau claire, savon, toutes les faces, puis séchage propre.","mod":"m2","li":0,"example":"Au retour d’une vente où tu as rendu la monnaie, tu te laves avant de reprendre le remplissage des sachets Baobab Bliss.","next":"Place savon et essuie-mains propres avant de sortir la poudre demain matin.","alt":"Avant de pétrir la pâte à beignets pour la famille, tu te laves les mains. Ici c’est la même politesse, offerte à des clientes que tu ne verras peut-être pas.","hint":"Après l’argent du marché, que fais-tu avant de toucher la poudre ?"},{"keys":["animaux","chat","atelier"],"q":"Les animaux peuvent-ils entrer dans la zone de production ?","a":"Non. Les animaux restent hors de la zone de production. C’est une porte d’entrée majeure que tu fermes clairement. La règle se décide calmement, avant le rush.","mod":"m2","li":0,"example":"Le chat de la cour n’a plus accès à la table où tu conditionnes Baobab Bliss: tu fermes la porte de la pièce pendant les sessions.","next":"Vérifie aujourd’hui comment tu empêches chiens, chats ou volailles d’approcher la table.","alt":"On ne laisse pas les chèvres dans le grenier à mil: même évidence pour ta zone de poudre.","hint":"Un animal sur la table ouvre-t-il ou ferme-t-il une porte d’entrée ?"},{"keys":["nettoyer","desinfecter","ordre"],"q":"Dans quel ordre nettoyer et désinfecter ?","a":"Tu débarrasses d’abord, tu laves avec de l’eau et un détergent adapté au contact alimentaire, tu rinces, tu laisses sécher, puis tu désinfectes si tu utilises un désinfectant autorisé, avec un nouveau rinçage si la notice l’exige, puis tu sèches. Désinfecter sur une table encore sale sert peu.","mod":"m2","li":4,"example":"Après une session Baobab Bliss, tu enlèves la farine de poudre des coins de table avant tout produit désinfectant: tu suis l’ordre, pas la précipitation.","next":"Marque au marqueur « sale » et « propre » sur deux bassines de lavage d’outils.","alt":"Laver une marmite collée: tu ne verses pas le produit fort sur la croûte sèche d’abord. Tu fais tremper, tu grattes, tu rinces. Puis seulement tu désinfectes si besoin.","hint":"Nettoyer et désinfecter: lequel vient en premier ?"},{"keys":["torchon","recontamination"],"q":"Pourquoi un torchon douteux pose problème ?","a":"Un torchon douteux peut remettre des microbes sur une surface que tu viens de laver. Il déplace parfois la poussière au lieu de l’enlever. Tu préfères un séchage à l’air protégé ou un essuie vraiment propre et souvent lavé.","mod":"m2","li":0,"example":"Au lieu d’essuyer la bassine Baobab Bliss avec le même chiffon de la matinée, tu la laisses sécher à l’envers sur une grille propre.","next":"Si tu n’as qu’un chiffon, lave-le à fond entre zone sale et zone propre, ou passe au séchage à l’air.","alt":"Passer une jupe poussiéreuse sur une table fraîchement lavée: tu « sèches », mais tu salis à nouveau.","hint":"Le torchon douteux enlève-t-il toujours, ou peut-il aussi redonner ?"},{"keys":["plan","nettoyage","controle"],"q":"Que doit contenir mon plan de nettoyage ?","a":"Ton plan dit qui fait quoi, quand, avec quel produit, avant et après chaque session, plus un grand nettoyage hebdomadaire des coins. Tu écris la fréquence et tu prévois un savon de réserve. Un protocole affiché sans moyen devient une décoration.","mod":"m2","li":0,"example":"Tu notes: avant session, après session, et chaque dimanche pieds de table, jointures et dessous de caisse où la farine Baobab Bliss s’accumule.","next":"Rédige sur une page qui lave quoi avant la prochaine session, avec ton nom.","alt":"Comme un planning de lessive familiale: jours, tâches, responsable. Sans écrit, chacun croit que l’autre a fait.","hint":"Un plan utile répond-il au moins à qui, quand et avec quoi ?"},{"keys":["hygiene","personnelle","plaie"],"q":"Que faire d’une plaie sur la ligne ?","a":"Tu couvres la plaie proprement. Si elle coule, tu changes de poste pour ne pas approcher la poudre. L’hygiène personnelle est une barrière technique, pas une leçon de morale.","mod":"m2","li":5,"example":"Une coupure au doigt pendant le conditionnement Baobab Bliss: tu poses un pansement propre et tu passes au marquage des lots plutôt qu’au contact direct avec la poudre.","next":"Range une petite boîte de pansements propres près de la zone de travail.","alt":"Quand tu coupes des oignons avec un doigt blessé, tu protèges la plaie avant de continuer: même geste de respect pour le sachet.","hint":"Plaie qui coule et ligne de poudre: que changes-tu en premier ?"},{"keys":["aide","famille","regles"],"q":"Une aide familiale suit-elle les mêmes règles ?","a":"Oui. Une aide familiale suit les mêmes règles. La poudre ne distingue pas qui la touche. Une seule personne pressée peut annuler une matinée soignée. Tu montres les gestes comme une recette, lentement, une fois.","mod":"m2","li":2,"example":"Ta nièce qui t’aide à remplir les sachets Baobab Bliss se lave les mains et attache ses cheveux comme toi, sans exception « parce que c’est la famille ».","next":"Montre le lavage des mains une fois cette semaine devant ton aide, jusqu’à ce que le geste soit clair.","alt":"Dans une cuisine partagée, la règle du feu vaut pour toutes: la parenté ne change pas la brûlure de la casserole.","hint":"Les règles changent-elles selon le lien de famille, ou selon le contact avec la poudre ?"},{"keys":["critere","microbiologique","n","c","m"],"q":"Que signifie n dans un plan d’échantillonnage ?","a":"Dans un plan d’échantillonnage, la lettre n désigne le nombre d’unités prélevées. Un seul pot ne raconte pas tout un lot hétérogène. Les lettres c, m et M complètent le plan: combien peuvent se situer entre deux seuils, et quels sont ces seuils.","mod":"m2","li":6,"example":"Quand tu enverras un jour plusieurs sachets Baobab Bliss au labo, tu demandera combien d’unités prélever: c’est parler le langage de n.","next":"Dans le carnet, écris: la lettre n désigne le nombre d’unités prélevées.","alt":"Pour juger un panier de tomates, tu n’en regardes pas qu’une seule au fond. Tu en observes plusieurs. L’échantillonnage, c’est cette sagesse mise en chiffres.","hint":"n compte-t-il des idées, ou des unités vraiment prélevées ?"},{"keys":["bulletin","lot","trace"],"q":"Que garder avec un bulletin d’analyse ?","a":"Tu gardes le bulletin avec le numéro de lot, la date, l’unité et la méthode. Sans lien au lot, le chiffre flotte. Tu ranges le tout dans une pochette dédiée. Un beau résultat éparpillé dans des messages sert peu.","mod":"m2","li":6,"example":"Le premier bulletin Baobab Bliss ira dans la pochette avec le code du lot correspondant, pas dans un fil WhatsApp perdu.","next":"Crée une pochette « bulletins labo » dès maintenant, même vide.","alt":"Un reçu de marché sans date ni nom du vendeur: tu ne sais plus à quoi il sert. Pareil pour un bulletin orphelin.","hint":"Quel identifiant doit voyager avec chaque bulletin ?"},{"keys":["seuils","europe","inventer"],"q":"Puis-je inventer mes seuils microbiologiques « au feeling » ?","a":"Non. Tu n’inventes pas des seuils microbiologiques selon ton ressenti du jour. Tu lis ceux qui s’appliquent à ta denrée ou tu te fais conseiller par un laboratoire. Le langage d’ingénieure évite le pot magique unique.","mod":"m2","li":6,"example":"Pour Baobab Bliss débutante, tu commences par aspect, odeur et humidité ressentie, et tu planifies des analyses quand le volume ou le canal le demandent, avec des seuils lus, pas inventés.","next":"Note dans le carnet: les seuils se lisent ou se font conseiller, jamais inventés.","alt":"Fixer soi-même la vitesse maximale sur la route sans panneau: pratique pour soi, inutile pour être en règle.","hint":"D’où viennent les seuils: du ressenti, ou d’un texte et d’un conseil labo ?"},{"keys":["2073","hygiene","procede"],"q":"À quoi servent les critères d’hygiène des procédés ?","a":"Les critères d’hygiène des procédés servent à vérifier en cours de fabrication que ton procédé reste maîtrisé. Ils s’appuient souvent sur des indicateurs choisis, avec un plan qui précise n, c, m et M. Ils ne remplacent pas les barrières quotidiennes: mains, surfaces, stock sec.","mod":"m2","li":5,"example":"Quand ton volume Baobab Bliss grandira, un labo pourra t’aider à choisir un indicateur de procédé adapté, pendant que tu continues le lavage et la rotation des lots.","next":"Relis la carte sur n, c, m, M et note une phrase: « procédé maîtrisé se vérifie, il ne se devine pas ».","alt":"Contrôler la cuisson du riz à mi-feuillet: tu vérifies le procédé avant le service, tu ne goûtes pas seulement à la fin.","hint":"Ces critères regardent-ils surtout le procédé en cours, ou seulement la pub du sachet ?"},{"keys":["nutrition","medical","aliment"],"q":"Puis-je présenter Baobab Bliss comme un traitement ?","a":"Non. Baobab Bliss est un aliment. Tu parles goût, usage et composition honnête. Tu ne le présentes pas comme un traitement. Pour une question de santé, tu renvoies vers une professionnelle.","mod":"m3","li":5,"example":"Sur la face avant de ta maquette, tu gardes « pulpe de baobab, cent pour cent » et tu retires toute phrase qui sonne comme un soin.","next":"Apprends une phrase courte de recentrage et répète-la jusqu’à ce qu’elle soit naturelle.","alt":"Chacun sa place au repas: le mil nourrit, le médicament soigne sous conseil, la pulpe reste dans la famille des aliments.","hint":"Aliment ou traitement: lequel le cours autorise sur le sachet ?"},{"keys":["script","cliente","promesse"],"q":"Que dire si une cliente insiste sur un effet corps ?","a":"Tu recentres avec calme: c’est de la pulpe pure, à diluer ou à cuisiner. Si elle insiste sur un effet corps ou une maladie, tu renvoies vers une professionnelle de santé. Ton rôle, c’est l’aliment net, pas le diagnostic.","mod":"m3","li":4,"example":"Au marché, une cliente presse pour un effet « énergie miracle »: tu souris, tu redis l’usage en boisson, tu gardes tes trois phrases préparées.","next":"Écris tes trois phrases de recentrage sur une carte et entraîne-toi devant un miroir.","alt":"Quand on te tire hors du sujet au marché, tu ramènes la conversation au produit dans la main: même réflexe ici.","hint":"Que remets-tu au centre avant toute promesse corps ?"},{"keys":["declaration","nutritionnelle","tableau"],"q":"Puis-je remplir le tableau nutritionnel sans analyse ?","a":"Non. Sans analyse, tu ne remplis pas le tableau avec des chiffres inventés. Tu prépares la structure vide et tu laisses « à mesurer » jusqu’au bulletin. La littérature donne des ordres de grandeur, pas ton étiquette finale.","mod":"m3","li":1,"example":"Sur papier, tu dessines les lignes énergie, glucides, fibres, protéines, sel pour Baobab Bliss, colonnes pour 100 grammes et pour ta portion, cases encore vides.","next":"Fais ce tableau brouillon aujourd’hui avec la mention « à mesurer » partout.","alt":"Le bulletin de notes à l’école: tu n’inventes pas une moyenne. Tu attends les vraies notes. Le tableau nutritionnel attend de vraies mesures.","hint":"Structure vide ou chiffres fantaisie: que choisit l’honnêteté ?"},{"keys":["portion","cuillere","peser"],"q":"Pourquoi peser ma portion typique ?","a":"Tu pèses ta portion typique pour que la colonne « par portion » ait un sens réel quand les analyses arriveront. Une cuillère « au ressenti » devient un poids en grammes. La cliente pourra alors comparer juste.","mod":"m3","li":1,"example":"Tu prends la cuillère que tu recommandes pour Baobab Bliss, tu la remplis comme pour une cliente, tu la poses sur une balance quand tu en as une, tu notes le gramme.","next":"Décide dès maintenant le poids de ta portion typique: pèse-la une fois et écris-le dans le carnet.","alt":"Dire « une poignée » sans jamais la peser, c’est comme vendre au tas sans mesure: chacun imagine autre chose.","hint":"Pourquoi la colonne portion a besoin d’un poids vrai ?"},{"keys":["mentions","obligatoires","sachet"],"q":"Quelles mentions de base viser sur un sachet ?","a":"Tu vises au moins: dénomination, liste des ingrédients (ici un seul: pulpe), quantité nette, nom et adresse de l’exploitante, numéro de lot, date de durabilité minimale, conseils de conservation et d’usage. Sous le règlement européen 1169 de 2011, le nom et l’adresse sont obligatoires. La nutrition s’ajoute quand tu as les chiffres. La lisibilité compte autant que la liste.","mod":"m3","li":2,"example":"Ta épreuve d’étiquette Baobab Bliss place le nom du produit, la quantité nette, ton nom et ton adresse bien visibles; lot et date de durabilité restent lisibles à bout de bras.","next":"Fais une épreuve A4 pliée façon sachet et teste-la à bout de bras: dénomination, poids, adresse, lot, date.","alt":"Une lettre sans adresse n’arrive pas. Un sachet sans nom lisible laisse la cliente seule si elle a une question.","hint":"Quelles infos permettent de savoir ce qu’on achète et à qui parler ?"},{"keys":["lisibilite","maquette","test"],"q":"Comment tester la lisibilité ?","a":"Tu montres la maquette à quelqu’un qui ne connaît pas le produit et tu chronomètres environ dix secondes. Ce qu’elle ne trouve pas doit être mieux placé. Tu corriges contraste, taille et position avant d’imprimer.","mod":"m3","li":2,"example":"Tu tends ta maquette Baobab Bliss à une amie: si elle ne trouve pas le lot en dix secondes, tu grossis la police ou tu changes l’emplacement.","next":"Fais le test des dix secondes avec deux personnes cette semaine.","alt":"Comme vérifier qu’un panneau de boutique se lit depuis la rue: si personne ne trouve le nom, on le place autrement.","hint":"Qui doit réussir à trouver l’essentiel vite: toi qui as tout écrit, ou une lectrice neuve ?"},{"keys":["lot","tracabilite"],"q":"À quoi sert le numéro de lot ?","a":"Le numéro de lot sert à retrouver l’histoire du produit en amont et en aval si besoin. Sans lot, un bulletin de laboratoire perd une bonne partie de sa valeur. Tu l’écris dès la session et tu le portes jusqu’au sachet.","mod":"m3","li":0,"example":"Le lot du mardi matin Baobab Bliss suit le bac, le carnet et le sachet: si une question revient, tu retrouves la session.","next":"Choisis un format simple de numéro de lot et utilise-le sur ton prochain conditionnement.","alt":"Numéroter les sacs de mil au grenier: sans numéro, tu ne sais plus lequel a pris l’humidité en premier.","hint":"Que perd un bulletin labo s’il n’a pas de lot lié ?"},{"keys":["allergenes","liste","baobab"],"q":"Le baobab est-il un allergène majeur listé en Europe ?","a":"La pulpe de baobab seule n’appartient pas à la liste classique des quatorze groupes majeurs européens. En revanche, tu surveilles les croisements si tu manipules au même endroit arachides, lait, fruits à coque ou sésame. Tu gères d’abord la séparation, ensuite une phrase honnête si un croisement réel demeure.","mod":"m3","li":3,"example":"Si le beurre d’arachide familial passe sur ta table le soir, le baobab Baobab Bliss se conditionne le matin, après un vrai nettoyage.","next":"Liste sur une feuille tous les autres aliments qui passent dans le même local.","alt":"Sur une planche à découper, l’odeur d’un poisson reste parfois. Les allergènes aussi « restent » sur outils et tables. On lave pour vraiment changer de chapitre.","hint":"La pulpe seule est-elle dans la liste des majeurs, ou faut-il regarder surtout les croisements ?"},{"keys":["croisement","arachide","nettoyage"],"q":"Que faire si j’ai écrasé des arachides sur la même table ?","a":"Tu nettoies à fond avant de reprendre le baobab, ou tu reports la session. La phrase d’étiquette ne remplace pas le lavage. Séparation dans le temps, outils propres, table vraiment nette: les gestes viennent avant les mots.","mod":"m3","li":3,"example":"Après avoir écrasé des arachides pour la cuisine familiale sur la table, tu ne remplis pas les sachets Baobab Bliss le même après-midi sans lavage complet.","next":"Si d’autres allergènes existent chez toi, décide un créneau « baobab seul » dans la semaine.","alt":"Changer d’huile dans une poêle sans la laver: le goût précédent reste. Ici le lavage change vraiment de chapitre.","hint":"Entre écrire « peut contenir » et laver pour de vrai, que fais-tu d’abord ?"},{"keys":["peut contenir","hasard"],"q":"Puis-je écrire « peut contenir » au hasard ?","a":"Non. Tu n’écris pas « peut contenir » au hasard pour te protéger sans geste derrière. Cette phrase doit reposer sur un croisement réel encore possible. D’abord séparation et nettoyage, ensuite formulation honnête et précise.","mod":"m3","li":0,"example":"Si aucun autre allergène n’entre dans ton espace Baobab Bliss, tu dis simplement la vérité: un seul ingrédient, pulpe de baobab.","next":"Fais le tour du local une fois et mets à jour ta liste d’aliments présents.","alt":"Mettre « fragile » sur toutes les caisses sans rien de cassable: le mot s’use et plus personne ne le croit.","hint":"« Peut contenir » sans croisement réel: honnête ou hasardeux ?"},{"keys":["allegation","riche","vitamine"],"q":"Puis-je écrire « riche en vitamine C » sans dossier ?","a":"Non. « Riche en vitamine C » demande analyse, seuils et conditions d’allégation. Sans dossier, tu retires la phrase. Tu peux garder la vérité simple: cent pour cent pulpe, usage, goût.","mod":"m3","li":1,"example":"Tu barres sur la maquette Baobab Bliss tout « riche en… » tant que le bulletin et les conditions ne sont pas là.","next":"Colle près de la zone d’emballage la liste « je garde ou je retire » et mets à jour les phrases douteuses.","alt":"Au marché, promettre des tomates « riches en tout » sans mesure fait sourire. Mieux vaut une description sobre qui ramène la cliente.","hint":"Que manque-t-il avant d’écrire « riche en » ?"},{"keys":["allegation","sante","autorisation"],"q":"Les allégations de santé sont-elles libres ?","a":"Non. Là où le droit européen s’applique, les allégations de santé suivent des listes et des autorisations. Partout, tu restes sage: composition et usage plutôt qu’effets sur le corps. Si tu ne peux pas expliquer une phrase calmement, tu la retires.","mod":"m3","li":4,"example":"« Remède miracle pour le corps » sort de ta liste WhatsApp Baobab Bliss; « à diluer dans l’eau froide » reste.","next":"Joue cinq minutes au jeu « je garde ou je retire » avec trois phrases de ton brouillon.","alt":"Des tomates « qui guérissent la vue » font sourire. Des phrases sobres font revenir. Choisis le second commerce.","hint":"Effet sur l’organisme: libre partout, ou encadré et délicat ?"},{"keys":["reseaux","sociaux","promesse"],"q":"Sur WhatsApp, puis-je promettre un miracle ?","a":"Non. Sur WhatsApp comme sur le sachet, tu ne promets pas de miracle. Une promesse liée au produit doit rester aussi sage que l’étiquette. Les publicités orales au marché suivent la même sobriété.","mod":"m3","li":0,"example":"Un message Baobab Bliss qui partait vers « miracle santé » est réécrit: pulpe pure, usage, prix, disponibilité.","next":"Relis tes trois derniers messages de vente et barre toute promesse d’effet corps.","alt":"Ce que tu cries au marché reste collé à ta réputation: même pour un message tapé du pouce.","hint":"WhatsApp change-t-il les règles de sobriété, ou les mêmes s’appliquent-elles ?"},{"keys":["maquette","version","analyse"],"q":"Que change une analyse dans ma maquette ?","a":"Quand l’analyse arrive, tu remplis les cases nutritionnelles de la maquette. Tu ne changes pas la promesse cent pour cent pulpe. Tu numérotes la version et tu archives une photo datée.","mod":"m3","li":0,"example":"La maquette Baobab Bliss passe de « valeurs en cours de mesure » à un tableau rempli, toujours avec la même promesse d’ingrédient unique.","next":"Numérote ta maquette actuelle (par exemple première version) et photographie-la datée dans le carnet.","alt":"Remplir les cases d’un formulaire quand les pièces arrivent: le titre du formulaire, lui, ne change pas.","hint":"Qu’est-ce qui se remplit, et qu’est-ce qui reste stable ?"},{"keys":["imprimer","avant","validation"],"q":"Quand imprimer en nombre ?","a":"Tu imprimes en nombre seulement après une maquette corrigée, testée en lisibilité, sans allégation hasardeuse, avec les mentions de base en place. Épingler avant de coudre évite les cartons inutiles.","mod":"m3","li":2,"example":"Tu attends d’avoir fait le test des dix secondes et d’avoir barré les phrases douteuses avant de commander une pile d’étiquettes Baobab Bliss.","next":"Écris une action concrète pour les sept prochains jours: relecture, photo d’archive, ou correction de police.","alt":"Coudre un pagne: tu épingles d’abord, tu essaies, tu corriges, tu couds. La maquette, c’est l’étape des épingles pour ton sachet.","hint":"Imprimer d’abord ou valider la maquette d’abord ?"},{"keys":["procédé","baobab","pulpe","sèche"],"q":"La pulpe de baobab est-elle déjà sèche dans la gousse ?","a":"Oui. Dans la gousse mûre, la pulpe de pain de singe arrive déjà sèche, pas juteuse comme une mangue. Ton travail Baobab Bliss, c’est surtout choisir les fruits, séparer, broyer, tamiser, contrôler, puis emballer au sec. Chauffer sans besoin fatigue le goût et la couleur.","mod":"m4","li":0,"example":"Tu casses une gousse saine reçue ce matin à Ouagadougou : la pulpe se détache en morceaux friables, sans jus qui coule. Tu la mets directement vers le tamis, sans cycle de claies comme pour une mangue.","next":"Dessine sur une page datée ta ligne réelle en six cases : réception, cassage, séparation, tamis, contrôle, sachet.","alt":"Imagine des biscuits déjà croustillants que tu tries et mets en boîte, à côté de mangues fraîches à sécher longtemps. Le pain de singe ressemble aux biscuits ; la mangue, au fruit encore plein d’eau.","hint":"Compare dans ta tête un fruit qui coule et un fruit dont la chair est déjà friable."},{"keys":["finition","douce","quand"],"q":"Quand faire une finition douce sur le baobab ?","a":"Seulement si, après le tamis, l’humidité ou l’activité de l’eau restent hors de ta cible. Ce n’est pas un geste automatique. Tu observes d’abord : grumeaux, collage, reprise de poids dans un sachet mal fermé. Puis tu décides d’un séchage léger et court, en couche fine.","mod":"m4","li":3,"example":"Après le tamis d’un lot du jour, la poudre forme des petits paquets entre tes doigts. Tu étends une couche fine sous un air un peu chaud, tu surveilles, puis tu arrêtes dès que la poudre redevient libre.","next":"Note sur la fiche du prochain lot : toucher après tamis, décision oui ou non pour la finition, durée et aspect final.","alt":"C’est comme le linge presque sec : tu ne le remets pas sous le soleil « pour faire sérieux » s’il est déjà prêt. Tu ne le traites encore un peu que s’il reste humide au pli.","hint":"Demande-toi si tu as un vrai signe hors cible, ou seulement l’habitude de chauffer."},{"keys":["bilan","matière","rendement"],"q":"Comment calcule-t-on un rendement poudre sur fruit ?","a":"Tu divises la masse de poudre fine obtenue par la masse de fruits entrés. Le résultat, multiplié par cent, donne le rendement en pour cent. Sur baobab, ce chiffre raconte surtout coques, graines, fibres et refus de tamis, pas une grosse perte d’eau.","mod":"m4","li":1,"example":"Par exemple, tu reçois 20 kilogrammes de fruits et tu sors 6,5 kilogrammes de poudre fine après tamis. Le rendement sur fruit vaut alors 32,5 pour cent. Tu le notes à côté du rendement sur pulpe brute.","next":"Pèse un petit lot de bout en bout cette semaine et calcule les deux rendements : sur fruit et sur pulpe.","alt":"Quand tu prépares du tô, tu vois le mil entrer et la pâte sortir. Ce qui manque sur la balance, ce sont les pertes sur le chemin. Le rendement poudre sur fruit suit la même idée avec des cases nommées.","hint":"Quel poids mets-tu au numérateur, et quel poids à l’arrivée des fruits ?"},{"keys":["opération","unitaire"],"q":"Qu’est-ce qu’une opération unitaire chez toi ?","a":"C’est un geste technique clairement nommé : recevoir, casser, séparer, broyer, tamiser, doser, souder. Chez toi, tu enchaînes ces gestes comme une petite usine familiale. Les nommer t’aide à mesurer le temps, le poids et les pertes, et à expliquer le travail à une aide qui débute.","mod":"m4","li":0,"example":"Tu écris sur le mur de l’atelier six mots seulement. Quand ta nièce vient aider, tu lui montres « tamiser » comme une étape à part, avec sa brosse et son carnet, pas un mélange flou de tout le matin.","next":"Liste aujourd’hui tes opérations unitaires réelles dans l’ordre, avec une case poids ou durée à côté de chacune.","alt":"Pense à une chaîne de préparation du riz pour une fête : laver, trier, cuire, servir. Chaque geste a un nom. Ton atelier baobab mérite les mêmes noms clairs.","hint":"Peux-tu dire à voix haute chaque geste sans dire seulement « je fais la poudre » ?"},{"keys":["tamis","granulométrie"],"q":"À quoi sert le tamis ?","a":"Le tamis classe les particules. Ce qui passe devient ta coupe fine pour Baobab Bliss. Ce qui reste peut être rebrouyé une fois ou réservé à un autre usage familial. Une toile trop large laisse des grains ; une toile trop fine baisse le débit et augmente les refus.","mod":"m4","li":2,"example":"Une cliente dit que la poudre « gratte » en bouche. Tu regardes d’abord la toile utilisée ce jour-là et le refus resté dessus, avant de toucher à l’étiquette.","next":"Photographie ta toile de tamis à côté d’une pièce et range la photo dans le carnet du lot.","alt":"C’est comme tamiser la farine pour une pâte à crêpes un soir de fête : trop grossier, tu sens les grains sous la langue ; trop fin et trop longtemps, tu perds du temps pour un gain faible.","hint":"Que devient ce qui passe, et que devient ce qui reste ?"},{"keys":["broyage","chaleur"],"q":"Pourquoi éviter un broyage trop long ?","a":"Un broyage trop long chauffe la poudre et crée trop de poussières qui collent partout. Tu fatigues aussi arômes et texture. Cherche un réglage qui donne une poudre agréable à boire sans que la matière chauffe dans tes mains.","mod":"m4","li":0,"example":"Tu touches le bol juste après un broyage prolongé : la poudre est tiède et un nuage fin s’est posé sur la table. Au lot suivant, tu raccourcis le temps et tu retrouves une poudre plus fraîche au nez.","next":"Sur le prochain lot, chronomètre le broyage et note la sensation de chaleur au toucher juste après.","alt":"Comme moudre trop longtemps du mil au pilon : tu obtiens de la farine, mais tu échauffes et tu fatigues les bras pour un gain faible une fois la texture déjà bonne.","hint":"Qu’est-ce qui change dans tes mains et dans l’air autour du bol si tu continues trop longtemps ?"},{"keys":["refroidir","emballer"],"q":"Pourquoi refroidir avant d’emballer ?","a":"Une poudre encore chaude enfermée dans un sachet peut créer de la condensation interne. Cette eau revenu sur les particules favorise le collage et défait le bénéfice du tamis ou d’une finition. Laisse la poudre rejoindre la température de la pièce avant de souder.","mod":"m4","li":3,"example":"Tu remplis trop vite après une finition douce : le lendemain, des grumeaux collent au fond du sachet alors que la même poudre, refroidie une heure dans un bac propre, reste libre.","next":"Ajoute sur ta fiche lot une case « température proche de la pièce avant soudure » et coche-la à chaque série.","alt":"Comme du linge encore tiède plié dans un sac plastique : il ressort humide. Si tu attends qu’il soit frais, il reste agréable. Ta poudre aime la même patience.","hint":"Que devient la vapeur quand tu fermes un contenant encore chaud ?"},{"keys":["séchage","mangue","futur"],"q":"Le séchage air chaud en couche fine concerne-t-il le pain de singe de base ?","a":"Non pour le procédé de base du pain de singe. Le séchage à l’air chaud en couche fine concerne surtout tes futurs fruits riches en eau : mangue, tomate, oignon, feuilles. Garde deux pages de carnet séparées pour ne pas coller un barème mangue sur le baobab.","mod":"m4","li":4,"example":"Tu lis un guide qui parle de claies et de plusieurs heures d’air chaud. Tu le ranges dans la page « futurs fruits », pas sur la ligne Baobab Bliss du jour où tu ne fais que séparer et tamiser.","next":"Ouvre une page « futurs fruits » et une page « pain de singe », avec quatre titres sur chacune : produit, geste, durée, poids.","alt":"Deux métiers voisins sur la même table de cuisine : trier des biscuits déjà secs, ou faire sécher des mangues longtemps. Les outils et les durées ne se copient pas.","hint":"Ce guide parle-t-il d’un fruit juteux ou d’une pulpe déjà sèche ?"},{"keys":["courbe","séchage","MR"],"q":"Que représente MR dans une courbe de séchage ?","a":"MR désigne le rapport d’humidité. Il suit le progrès du séchage entre l’état initial et l’équilibre. On l’utilise surtout pour comparer des essais sur fruits juteux, pas pour remplacer ton chronomètre et ta balance sur le terrain.","mod":"m4","li":3,"example":"Pour un futur essai mangue, tu notes le poids d’un plateau au début, puis à plusieurs heures. En transformant ces poids en rapport d’humidité, tu compares deux épaisseurs sur la même courbe.","next":"Sur la page « futurs fruits », écris en une ligne ce que MR raconte, avec les mots « initial » et « équilibre ».","alt":"C’est comme marquer sur une corde à linge où en est le séchage : pas encore, à mi-chemin, presque prêt. Le rapport d’humidité met des nombres sur cette progression.","hint":"Entre quel état de départ et quel état d’arrivée ce rapport se place-t-il ?"},{"keys":["page","modèle"],"q":"Quel modèle empirique est souvent cité pour mangue ou oignon ?","a":"Dans beaucoup d’études de séchage en couche mince, le modèle de Page apparaît souvent comme un bon ajustement pour mangue ou oignon. Il relie le rapport d’humidité au temps avec deux constantes à calibrer sur tes essais. Tu t’en sers pour comparer des courbes, pas pour inventer une durée sans mesure.","mod":"m4","li":4,"example":"Tu as deux essais mangue à la même température mais à deux épaisseurs. Tu traces MR en fonction du temps et tu vois lequel des modèles simples colle le mieux à tes points notés au carnet.","next":"Recopie dans le carnet « futurs fruits » le nom du modèle de Page et rappelle-toi qu’il se calibre sur tes propres poids.","alt":"Comme choisir une règle pour décrire comment le mil sèche au soleil : tu gardes la formule qui suit le mieux tes observations, pas celle qui sonne savante sans données.","hint":"Quel nom de modèle revient souvent quand on ajuste une courbe MR contre le temps ?"},{"keys":["diffusivité","fick"],"q":"À quoi sert la diffusivité effective Deff ?","a":"La diffusivité effective, souvent notée Deff, quantifie la vitesse apparente de migration de l’eau dans le produit. On l’estime parfois via la pente du logarithme de MR en régime diffusif. Elle aide à comparer des essais ; elle ne remplace pas le chronomètre et le plateau témoin.","mod":"m4","li":3,"example":"Deux tranches de mangue d’épaisseurs différentes mettent des temps très différents à perdre la même eau. Tu retiens que l’eau met plus longtemps à sortir du cœur épais, idée que Deff résume en un chiffre d’essai.","next":"Écris à côté de Deff : « vitesse apparente de l’eau dans le produit » et « utile pour comparer ».","alt":"Pense à l’eau qui doit sortir du centre d’une boule de pâte : plus le chemin est long et dense, plus c’est lent. Deff résume cette lenteur apparente.","hint":"Cette grandeur parle-t-elle de la migration de l’eau, ou seulement de la température de l’air ?"},{"keys":["séchoir","solaire","électrique"],"q":"Solaire ou électrique : que compares-tu d’abord ?","a":"Tu compares d’abord le principe : source de chaleur, stabilité de température, dépendance au ciel, nettoyage, possibilité de mesurer. Cette leçon ne compare pas les prix. Pour le baobab déjà sec, tu vérifies aussi si tu as vraiment besoin d’un séchoir.","mod":"m4","li":5,"example":"Quelqu’un te conseille un appareil. Tu demandes : est-ce pour mangue future ou pour pain de singe ? Puis tu listes stabilité, nettoyage et comment tu mesuras le produit, avant toute décision.","next":"Écris trois questions que tu poseras avant tout essai de séchoir pour un fruit juteux.","alt":"Le solaire ressemble au linge dehors : fort les jours clairs, plus lent sous les nuages. L’électrique ressemble à un fer réglable : plus prévisible, branché sur le courant. Tu compares d’abord ces comportements.","hint":"Avant l’argent, quels principes de fonctionnement mets-tu côte à côte ?"},{"keys":["collage","caking","tg"],"q":"Pourquoi une poudre colle-t-elle parfois ?","a":"Souvent parce que l’eau disponible et la température rapprochent la matrice sucrée de sa zone de ramollissement. Une soudure faible, un film trop ouvert ou un emballage trop chaud aggravent le collage. Tu corriges d’abord process et conditionnement.","mod":"m4","li":3,"example":"Un sachet du stock de saison des pluies montre des blocs durs. Tu vérifies la soudure, tu pèses un sachet témoin, et tu te rappelles si la poudre était encore tiède à la fermeture.","next":"Fais couler une petite dose dans un verre et note si elle s’écoule librement ou forme un pont.","alt":"Pense au sucre en poudre un jour d’air humide à Ouagadougou : il forme des blocs dans la boîte. Au sec, il coule. Ta pulpe joue le même jeu avec l’air de la pièce.","hint":"Quels trois postes regardes-tu avant de changer de fruit : soudure, film, ou emballage trop chaud ?"},{"keys":["claie","épaisseur"],"q":"Que se passe-t-il si la couche sur claie est trop épaisse ?","a":"Le centre sèche beaucoup plus lentement que la surface. Le produit peut paraître prêt dehors et rester humide dedans. Sur claie, une seule couche régulière et une épaisseur maîtrisée évitent ce piège pour tes futurs fruits.","mod":"m4","li":0,"example":"Sur un essai mangue, le dessus des tranches semble croustillant alors que tu casses une tranche et trouves encore un cœur souple. Tu diminues l’épaisseur au prochain plateau.","next":"Sur la page « futurs fruits », note l’épaisseur visée et l’aspect du centre après un premier essai.","alt":"Comme faire sécher du linge épais dehors : le bord sèche avant le cœur. Si tu entasses trop, le milieu reste humide alors que le dessus paraît prêt.","hint":"Où l’eau met-elle le plus longtemps à sortir : en surface ou au centre ?"},{"keys":["carnet","deux"],"q":"Pourquoi deux pages de carnet procédé ?","a":"Une page pour le pain de singe : séparation, tamis, emballage au sec. Une autre pour les futurs séchages à l’air chaud avec claies. Séparer les pages évite de copier un barème mangue sur le baobab déjà sec.","mod":"m4","li":2,"example":"Tu entends « séchage » dans une conversation de marché. Tu ouvres la bonne page du carnet avant de noter le conseil, selon que l’on parle de mangue ou de pain de singe.","next":"Trace aujourd’hui les deux pages avec leurs titres et date chacune.","alt":"Deux cahiers d’école pour deux matières : tu ne mélanges pas les devoirs. Ici, deux pages pour deux métiers voisins mais distincts.","hint":"Quel mal arrive si un temps de mangue glisse sur un lot de baobab ?"},{"keys":["coques","rendement"],"q":"Qu’est-ce qui fait surtout baisser le rendement baobab ?","a":"Ce sont surtout les coques, graines et fibres écartées, plus les refus de tamis. L’évaporation massive d’eau n’est pas le cœur du bilan baobab, contrairement aux fruits juteux. Ton rendement raconte donc la qualité de la séparation et du tamis.","mod":"m4","li":0,"example":"Sur un lot, tu pèses beaucoup de coques et de graines à part, et peu de différence de poids entre pulpe avant et après un court repos. Tu comprends que le rendement a baissé surtout à la séparation.","next":"Sur le prochain lot, pèse séparément coques, graines et fibres, refus de tamis, et poudre fine.","alt":"Quand tu épluches des arachides, le poids utile baisse surtout à cause des coques, pas parce que l’eau s’envole. Le baobab suit une logique proche.","hint":"Sur baobab, qu’est-ce qui pèse le plus dans les sorties non poudre : l’eau partie, ou les coques et graines ?"},{"keys":["ventilation","séchoir"],"q":"Pourquoi la circulation d’air compte dans un séchoir ?","a":"Sans mouvement d’air, la vapeur stagne autour du produit et le séchage ralentit, même si l’air est chaud. La circulation emporte l’humidité loin des claies. Claies propres, une seule couche et un espace pour la vapeur aident autant que la chaleur.","mod":"m4","li":4,"example":"Tu fermes trop un petit séchoir d’essai sans laisser l’air circuler : les tranches du milieu restent molles plus longtemps que celles du bord exposé au flux.","next":"Pour un futur essai, note si l’air bouge vraiment entre les claies, pas seulement si le boîtier est chaud.","alt":"Comme une pièce sans fenêtre où sèche du linge : la chaleur seule ne suffit pas si la buée reste coincée. Il faut renouveler l’air.","hint":"Que devient la vapeur si elle ne peut pas s’éloigner du produit ?"},{"keys":["barrière","vapeur"],"q":"Quel transfert menace surtout ta poudre en saison humide ?","a":"En saison humide, c’est surtout la vapeur d’eau qui entre par un film faible ou une soudure mauvaise. Elle alourdit la poudre et favorise le collage. Freiner cette reprise protège tout le travail de séparation et de tamis.","mod":"m5","li":5,"example":"Deux sachets du même lot : l’un bien soudé reste libre au toucher après plusieurs jours orageux ; l’autre, mal fermé, prend du poids et forme des grumeaux.","next":"Lance un mini essai : même poudre, un sachet bien soudé et un sachet mal fermé, compare le toucher après deux jours.","alt":"Comme le mil mal protégé pendant les pluies : l’air humide s’invite et le grain change. Ta poudre craint le même invité.","hint":"Quel flux traverse un film faible avant la lumière ou les odeurs, en saison des pluies ?"},{"keys":["wvtr","film"],"q":"Que dit un WVTR de film ?","a":"WVTR désigne le taux de transmission de la vapeur d’eau. C’est une mesure de la masse de vapeur qui traverse une surface de film par jour, dans des conditions de test. Plus ce taux est bas, plus la barrière vapeur est forte, toutes choses égales.","mod":"m5","li":0,"example":"Un vendeur te montre deux films. Sur l’un, la fiche indique un WVTR plus bas. Tu le gardes comme candidat pour Baobab Bliss, puis tu confirmes par un essai de reprise de poids chez toi.","next":"Si tu as une fiche film, copie le WVTR avec ses conditions de test ; sinon écris « inconnu, à tester ».","alt":"Comme lire sur un manteau s’il rebute vraiment la pluie, pas seulement s’il est épais. Le WVTR parle de cette capacité pour le film.","hint":"Ce chiffre parle-t-il de la vapeur d’eau qui traverse le film, ou du dessin imprimé ?"},{"keys":["oxygène","arômes"],"q":"Pourquoi freiner aussi l’oxygène ?","a":"L’oxygène fatigue arômes et vitamine C au fil du temps. Une barrière à l’oxygène, une barrière à la vapeur et une bonne soudure travaillent ensemble. Pour ta poudre, freiner la vapeur d’eau et la lumière reste souvent prioritaire, sans oublier l’air.","mod":"m5","li":0,"example":"Tu compares un sachet opaque bien fermé et un sachet très ouvert à l’air après plusieurs semaines : le second perd plus vite le nez frais de la pulpe, même si le poids a peu bougé.","next":"Sur ta liste « rôles du sachet », ajoute une ligne : freiner humidité, lumière et, autant que possible, oxygène.","alt":"Comme une boîte d’épices mal fermée : l’air du jour use le parfum. Fermer vraiment protège ce que tu as préparé avec soin.","hint":"Outre l’eau, quel gaz de l’air peut fatiguer arômes et vitamine C ?"},{"keys":["contact","alimentaire"],"q":"Que demander au vendeur de film ?","a":"Demande une confirmation claire que le matériau est destiné au contact alimentaire, idéalement écrite, avec le type d’aliment et la température d’usage. Garde facture et nom du matériau dans ton classeur. Si le vendeur refuse toute information, cherche ailleurs.","mod":"m5","li":2,"example":"Au marché des emballages, un vendeur dit seulement « c’est bon ». Tu notes « inconnu » et tu reportes l’achat jusqu’à obtenir un écrit, ou tu compares avec un autre fournisseur.","next":"Prépare trois questions écrites pour le prochain vendeur : contact alimentaire, preuve, conditions d’usage.","alt":"Tu ne sers pas le tô dans le seau du savon, même rincé à la hâte. Même idée : tu exiges un contenant pensé pour l’aliment, pas un slogan.","hint":"Quelle preuve simple veux-tu repartir avec, au-delà de la parole du vendeur ?"},{"keys":["soudure","bord"],"q":"Que faire avant de souder ?","a":"Écarte la poudre du bord de soudure. Un grain coincé empêche une fermeture hermétique et crée une micro-fuite qui court-circuite le meilleur film. Remplis en zone aussi sèche que possible, sans souffler avec la bouche dans le sachet.","mod":"m5","li":3,"example":"Tu vois un trait blanc de poudre sur la zone à souder. Tu essuies avec un torchon propre dédié, puis tu soudes. Le sachet résiste au tirage, contrairement à ceux « farinés » du matin.","next":"Avant la prochaine série, fais cinq sachets vides d’essai et tire dessus, puis vérifie que les bords à souder sont propres.","alt":"Comme fermer une bassine de sauce arachide : s’il reste un grain sous le couvercle, l’air passe. La zone de soudure a besoin du même soin.","hint":"Qu’est-ce qui bloque la fusion propre du film sur la ligne de soudure ?"},{"keys":["soudure","réglage"],"q":"Quels paramètres règles-tu sur une soudeuse ?","a":"Tu règles chaleur, temps et pression. Trop faible, la soudure se pèle facilement. Trop fort, le film se fragilise. Note le réglage qui marche sur ton film, après des essais sur sachets vides.","mod":"m5","li":0,"example":"Tu montes un peu le temps de pince sur du vide jusqu’à ce que le bord résiste au tirage sans brûler. Tu écris ces trois paramètres sur la fiche machine du jour.","next":"Sur une feuille collée près de la pince, note chaleur, temps et pression validés pour le film actuel.","alt":"Comme régler la couture d’une machine à coudre : trop lâche ça s’ouvre, trop tendu ça casse le tissu. Tu cherch
