t cacher des sachets très irréguliers. Tu notes aussi n, le nombre de valeurs. Ainsi tu sais si le lot est réellement régulier ou seulement « bon en moyenne ».","mod":"m9","li":1,"example":"Deux lots Baobab Bliss ont la même moyenne de 500 g. Le premier s’étend de 498 à 502, le second de 470 à 530. Tu traites le second: fermeture ou geste de remplissage à revoir.","next":"Sur ta prochaine série de poids, calcule moyenne et étendue et écris les deux sur la même ligne.","alt":"Deux classes avec la même moyenne d’âge: l’une presque du même âge, l’autre mélange enfants et grands. Le milieu ne suffit pas.","hint":"Si tous les sachets étaient très différents mais se compensaient, que verrais-tu encore ?"},{"keys":["composite","prélèvement"],"q":"Qu’est-ce qu’un échantillon composite ?","a":"Un échantillon composite réunit plusieurs petites prises venues de différents endroits du lot, puis mélangées pour parler du tout. Il évite de juger seulement le dessus du bac. Tu notes combien de prises, où, et sur quel lot. La règle reste écrite pour que le geste soit reproductible.","mod":"m9","li":0,"example":"Tu prends une cuillère devant, une au milieu, une vers le fond du bac de poudre, tu mélanges dans un bol propre, puis tu goûtes et tu pèses à partir de ce mélange. Tu écris « composite 3 prises, lot 16 ».","next":"Écris une règle composite pour ton bac: nombre de prises et endroits, puis applique-la une fois.","alt":"Pour juger une jarre de farine, on ne se fie pas à la croûte du dessus: on mélange un peu de plusieurs profondeurs.","hint":"D’où viennent les poignées si tu veux que l’échantillon ressemble au lot entier ?"},{"keys":["shewhart","limites"],"q":"À quoi servent les limites sur une carte de suivi ?","a":"Les limites marquent une zone où le procédé te paraît habituel. Elles t’aident à voir un point hors série sans réagir à chaque micro-bruit. Avant d’agir, tu vérifies mesure, échantillon et événement d’atelier. Quand plusieurs points sortent d’affilée, tu ouvres alors une fiche d’action.","mod":"m9","li":0,"example":"Sur ta carte de masse moyenne, tu traces une bande habituelle autour de tes jours calmes. Un point sort: tare oubliée. Tu corriges la tare, tu notes, tu ne changes pas le tamis.","next":"Sur ta page de suivi, trace deux lignes simples de zone habituelle à partir de tes derniers jours stables.","alt":"Le niveau d’eau du canari: trop bas ou trop haut par rapport aux marques du bord, on regarde pourquoi avant de tout vider.","hint":"Sans lignes de zone, comment distinguer un vrai saut d’un petit bruit de mesure ?"},{"keys":["flux","avant"],"q":"Que signifie faire avancer le produit en flux avant ?","a":"Cela signifie que le produit circule du plus brut vers le plus avancé sans retour vers le sale. Chaque poste pousse vers le suivant. Tu évites les croisements entre déchets et sachets prêts. Moins de pas inutiles, moins d’occasions de poser un ustensile au mauvais endroit.","mod":"m10","li":0,"example":"Les gousses arrivent près de la porte, la poudre avance vers le fond de la pièce où tu emballes, les coques sortent par un autre bac. Tu ne ramènes jamais un sachet ouvert vers la table de casse.","next":"Marque au sol ou par une bassine de couleur la frontière entre zone casse et zone emballage.","alt":"Le linge sale n’entre pas dans l’armoire du linge propre: le chemin a un sens.","hint":"Sur ton trajet réel, le produit revient-il un jour vers une zone plus sale ?"},{"keys":["fifo","date"],"q":"Comment appliquer le premier entré premier sorti ?","a":"Tu dates et numérotés chaque bac. Tu places le plus ancien de façon accessible. Tu sors ce bac-là en premier. Une aide lit la date à voix haute avant de servir. Pour ce qui expire plus tôt, tu priorises la date d’expiration. Tu comptes pour que le plan de production reste vrai.","mod":"m10","li":2,"example":"Le bac lot 8 ouvert mardi est devant; le bac lot 9 reçu jeudi est derrière. Avant d’emplir, tu fais lire « lot 8 mardi ». Tu ne croises pas.","next":"Range physiquement tes bacs pour que le plus ancien soit le plus facile à atteindre, puis teste une sortie.","alt":"Dans le frigo familial, le bol d’hier passe devant le bol du jour: on mange d’abord ce qui est arrivé avant.","hint":"Le bac le plus ancien est-il vraiment le plus facile à saisir sans déplacer les autres ?"},{"keys":["cout","vide"],"q":"Que faire des cases de coûts encore inconnues ?","a":"Tu les laisses visibles et tu les marques comme inconnues ou comme exemples à compléter. Tu ne inventes pas un bénéfice pour remplir le vide. Tu cherches un ticket, une estimation honnête, ou tu reports la décision prix. Une case vide assumée vaut mieux qu’un chiffre maquillé.","mod":"m10","li":3,"example":"La ligne transport est encore floue. Tu écris « estimation à confirmer » et tu entoures la case. Tu ne fixes pas le prix définitif du sachet tant que cette ligne n’a pas de source.","next":"Sur ta fiche, marque clairement chaque case inconnue et choisis une case à documenter cette semaine avec un ticket ou une estimation datée.","alt":"Sur une liste de courses, mieux vaut un blanc « prix tomate à voir » qu’un faux total qui rassure.","hint":"As-tu nommé les trous, ou as-tu collé un chiffre pour faire joli ?"},{"keys":["graines","coques"],"q":"Que faire des graines et coques de baobab ?","a":"Tu les sépares proprement, tu les pèses par lot, et tu cherches un usage simple et local: compostage contrôlé, artisanat de coques, filière de graines s’il en existe une près de toi. Tu refuses de les stocker contre la table d’emballage. Sans pesée, tout discours sur les co-produits reste du vent.","mod":"m11","li":2,"example":"Après le lot 20 tu pèses les coques et les graines. Les fibres vont au compost du voisin. Les coques propres partent chez un artisan du quartier. Rien ne reste collé à la table des sachets.","next":"Choisis une seule idée d’usage testable pour les coques et note qui pourrait les recevoir.","alt":"Les noyaux de mangue bien séparés peuvent servir ailleurs; mélangés à la salade, ils ne font que gêner.","hint":"As-tu un endroit nommé pour les coques, distinct de l’emballage ?"},{"keys":["jalon","projet"],"q":"Qu’est-ce qu’un jalon dans ton projet ?","a":"Un jalon est une étape visible qui marque un progrès sur la frise des douze à dix-huit mois: procédé stable, étiquette claire, premiers essais de vente, revue des coûts. Il sert de rendez-vous pour décider. Tu gardes une semaine tampon avant un jalon public. Tu rays ce qui n’est plus utile.","mod":"m11","li":4,"example":"« Étiquette validée avant fin novembre » est un jalon. Sans lui, tu ne lances pas l’essai de vente de décembre. Tu entoures cette ligne sur la frise murale.","next":"Nomme trois jalons sur les trois prochains mois et écris sous chacun ce qu’il bloque s’il glisse.","alt":"Le jour où le toit est posé dans une construction: on voit que l’étape compte, et on organise la suite autour.","hint":"Quelle étape, si elle manque, empêche vraiment la suivante ?"},{"keys":["etiquette","pulpe"],"q":"Que doit dire clairement l’étiquette Baobab Bliss ?","a":"Sur l’étiquette Baobab Bliss, tu mets au minimum la dénomination (pulpe de baobab en poudre), la composition honnête (cent pour cent pulpe, rien d’ajouté, seulement si c’est vrai), la quantité nette, le nom et l’adresse de l’exploitante, le numéro de lot, la date de durabilité minimale (« à consommer de préférence avant »), les conditions de conservation, et des conseils d’usage simples. Sous le règlement européen 1169 de 2011, le nom et l’adresse de l’exploitante sont obligatoires, pas optionnels. Tu n’ajoutes aucune promesse médicale ni aucune phrase inventée sur la santé.","mod":"cap","li":2,"example":"Sur ton sachet on lit, par exemple: pain de singe, cent pour cent pulpe, poids net, ton nom et ton adresse à Ouagadougou, lot 22, « à consommer de préférence avant » suivi d’une date réelle, « conserver au sec », « une petite cuillère pour un bol ». Une amie lit l’essentiel à bout de bras sans plisser les yeux.","next":"Coche sur une liste de contrôle: dénomination, composition, poids, nom et adresse, lot, date de durabilité, conservation, usage; corrige ce qui manque sur ton épreuve d’étiquette.","alt":"Un sac de mil sans poids ni origine laisse l’acheteur inventer l’histoire: la clarté évite cela.","hint":"Quels éléments une cliente doit-elle trouver sans te téléphoner, y compris qui tu es et jusqu’à quand consommer ?"},{"keys":["duree","critere"],"q":"Avant d’afficher une durée de vie, que fixer ?","a":"Tu fixes d’abord un protocole d’observation: combien de sachets, quelles dates de contrôle, quels critères (couleur, odeur, grain, fermeture), et dans quelles conditions de stockage. Tu restes prudente: tu annonces une durée plus courte que le dernier point sain. Tu relies la durée à l’emballage réel.","mod":"cap","li":3,"example":"Avant toute date sur l’étiquette, tu as trois sachets, contrôles à 10, 20 et 30 jours, critères écrits, pièce décrite. Seulement ensuite tu proposes une durée provisoire datée.","next":"Écris le protocole (3 sachets, 3 dates, critères, conditions) avant d’imprimer une durée sur un sachet.","alt":"Avant de promettre que le tô se garde, on convient comment on le regardera le lendemain et le surlendemain.","hint":"La durée affichée s’appuie sur quelles observations déjà faites ?"},{"keys":["lancement","canal"],"q":"Par quoi commencer un lancement prudent ?","a":"Tu commences par un canal unique, un volume d’essai plafonné, un message oral gelé, des étiquettes version validée, et une date de revue avec critères écrits. Tu prépares le carnet de retours. Tu évites de tout changer le jour J. Après la revue tu décides continuer, ajuster ou pause.","mod":"cap","li":5,"example":"Premier lancement Baobab Bliss: un seul marché, trente sachets maximum, une phrase orale, revue dans quinze jours sur les rachats et les objections notées.","next":"Remplis la page de lancement: canal, volume plafond, phrase, date de revue, critères continuer ou pause.","alt":"On n’invite pas tout le quartier le premier jour d’un nouveau plat: on teste d’abord avec un cercle serré.","hint":"Quel est le plus petit cadre où tu peux apprendre sans te disperser ?"},{"keys":["lecon","passe","quel","ordre","utile","cartes","quiz","activite","exercice","abord","ensuite","expert"],"q":"Quel ordre est le plus utile dans une leçon ?","a":"L’ordre le plus utile est: cartes, quiz, activité, puis exercice atelier. Tu construis d’abord le sens, tu vérifies, puis tu appliques. Les volets expert restent pour plus tard si tu manques de temps.","example":"Pour la leçon sur le pH, tu lis les cartes, tu réponds aux quatre questions, tu goûtes une pincée diluée de ton lot du jour, et tu notes acidité de 1 à 5 dans le carnet.","next":"Coche mentalement les quatre étapes avant d’ouvrir ta prochaine leçon.","alt":"Une recette de beignets se lit, se mesure, se goûte: une leçon se lit, se quizze, se fait dans l’atelier.","hint":"Par quoi commence le circuit décrit dans « Comment une leçon se passe » ?","mod":"m0","li":1},{"keys":["calendrier","mois","signifie","phase","parcours","fondations","methode","composition","hygiene","etiquette","uniquement","vente"],"q":"Que signifie la phase A du parcours ?","a":"La phase A signifie les fondations du parcours. Elle regroupe méthode, composition, hygiène et étiquette honnête. Elle vient avant le cœur atelier et avant la vente détaillée.","example":"Tu n’imprimes pas encore cent sachets Baobab Bliss pendant la phase A: tu apprends d’abord quoi écrire et quoi taire sur la maquette.","next":"Écris sur ta feuille murale: phase A, fondations, sous les mois 1 à 3 approximatifs.","alt":"Avant de peindre une pièce, tu prépares les murs: la phase A prépare le terrain de ton atelier.","hint":"Phase A est-elle surtout vente, ou plutôt bases avant l’atelier ?","mod":"m0","li":2},{"keys":["calendrier","mois","heures","affichees","module","ordres","grandeur","organiser","contrat","ecole","obligatoire","temps"],"q":"Les heures affichées par module sont…","a":"Les heures affichées par module sont des ordres de grandeur pour t’organiser. Ce n’est ni un contrat d’école ni un chronomètre obligatoire. Ta vie de fondatrice prime: tu avances quand tu peux.","example":"Si le module hygiène affiche une charge indicative et que tu as un gros marché le samedi, tu étales les leçons sur deux semaines sans culpabilité.","next":"Bloque deux créneaux courts cette semaine: un lecture-quiz, un geste atelier.","alt":"Comme estimer le temps d’un trajet en taxi à Ouaga: utile pour prévoir, jamais exact à la minute.","hint":"Ces heures ressemblent-elles à une promesse stricte, ou à une estimation ?","mod":"m0","li":2},{"keys":["demander","prof","reviser","guide","ecrit","hors","ligne","cours","enseignante","joignable","appel","chaque"],"q":"Ta prof est…","a":"Ta prof est un guide écrit hors ligne dans le cours. Elle vit dans le fichier, sans appel ni honoraires. Elle t’explique, te donne des indices et cherche dans une banque préparée.","example":"Pendant que tu remplis des sachets Baobab Bliss, tu peux poser « lot » à la banque entre deux scellages, sans quitter l’atelier ni chercher une connexion.","next":"Teste une question courte à la prof, par exemple « carnet », et lis toute la réponse avant de reprendre le travail.","alt":"C’est un panneau indicateur fixe au carrefour: toujours là, même quand le téléphone n’a plus de crédit.","hint":"Vit-elle dans un appel, ou dans le fichier du cours ?","mod":"m0","li":3},{"keys":["ethique","sources","limites","faire","encore","analyse","labo","nutriment","laisser","vide","ecrire","mesurer"],"q":"Que faire si tu n’as pas encore d’analyse labo pour un nutriment ?","a":"Tu laisses la case vide ou tu écris « à mesurer ». Tu n’inventes pas un taux pour faire joli. L’honnêteté prime jusqu’au bulletin d’analyse.","example":"Sur ta maquette Baobab Bliss, la ligne potassium reste marquée « à mesurer » tant que le labo n’a pas rendu ton lot.","next":"Parcours ton brouillon d’étiquette et remplace tout chiffre douteux par « à mesurer ».","alt":"Comme laisser vide la case d’un formulaire administratif quand tu n’as pas encore la pièce: mieux vaut vide que faux.","hint":"Que préfère le cours: un chiffre inventé ou une case en attente ?","mod":"m0","li":4},{"keys":["ethique","sources","limites","peux","promettre","sachet","pulpe","guerit","maladie","cours","interdit","promesses"],"q":"Peux-tu promettre sur le sachet que la pulpe guérit une maladie ?","a":"Non. Tu ne promets sur le sachet aucune guérison ni effet médical. Baobab Bliss reste un aliment décrit avec sobriété: composition, usage, goût. Le cours interdit ces promesses.","example":"Sur WhatsApp, si quelqu’un te pousse à écrire « guérit la toux », tu refuses et tu renvoies vers une professionnelle de santé, tout en gardant ta phrase sur la pulpe pure.","next":"Barre au crayon toute phrase de ta maquette qui promet un effet sur le corps.","alt":"Promettre que des tomates « guérissent la vue » ferait sourire ou fâcher: mieux vaut dire tomates du jardin.","hint":"Le sachet parle-t-il d’aliment, ou de traitement ?","mod":"m0","li":4},{"keys":["ethique","sources","limites","sert","mention","exemple","devant","certains","nombres","cours","signaler","nombre"],"q":"À quoi sert la mention « Exemple » devant certains nombres du cours ?","a":"La mention « Exemple » signale un nombre inventé pour t’entraîner à calculer. Elle évite de confondre l’exercice avec les mesures de ton vrai lot. Tu t’exerces sans recopier ces chiffres sur l’étiquette.","example":"Un exercice te fait convertir un poids « Exemple » de poudre en portions: tu apprends le calcul, puis tu pèses ta cuillère réelle Baobab Bliss à part.","next":"Quand tu vois « Exemple » dans une leçon, note à côté « pas mon lot » dans le carnet.","alt":"Un dessin de billet pour apprendre à compter n’est pas de l’argent vrai: même idée pour ces nombres.","hint":"Cette mention sert-elle à décorer, ou à prévenir un mélange avec tes mesures ?","mod":"m0","li":4},{"keys":["glucides","fibres","pectine","quel","type","compose","domine","souvent","pulpe","baobab","matieres","grasses"],"q":"Quel type de composé domine souvent la pulpe de baobab ?","a":"Les analyses placent souvent les glucides en tête pour la pulpe de baobab. Sucres et fibres dominent le profil, loin devant les matières grasses. Ton lot précis se confirme au laboratoire.","example":"Quand tu présentes Baobab Bliss, tu peux dire que la pulpe est surtout connue pour ses glucides et fibres, sans inventer un pourcentage sur le sachet.","next":"Relis la carte glucides et entoure le mot qui domine le profil.","alt":"Dans un plat de riz sauce, le riz porte souvent le volume: ici les glucides portent souvent le profil de la pulpe.","hint":"Quel grand groupe de nutriments arrive le plus souvent en première place ?","mod":"m1","li":1},{"keys":["glucides","fibres","pectine","boisson","peut","lier","peu","texture","additif","remplacer","entierement","emballage"],"q":"La pectine dans ta boisson peut…","a":"La pectine, fibre soluble, peut lier un peu la texture de ta boisson. Elle n’est pas un additif que tu verses: elle est déjà dans la pulpe. Tu restes sur cent pour cent pulpe en ajustant seulement dose et eau.","example":"Après quelques minutes, ta tasse de pain de singe épaissit légèrement: tu reconnais le travail des fibres, tu notes le ratio qui plaît.","next":"Prépare une boisson test et observe la texture après trois minutes sans rien ajouter.","alt":"La farine de pois chiche et la farine de mil ne lient pas l’eau pareil: les fibres du baobab ont leur propre manière, à apprivoiser par essais notés.","hint":"La pectine vient-elle d’un sachet d’additif, ou de la pulpe elle-même ?","mod":"m1","li":1},{"keys":["vitamine","degradation","coller","taux","unique","sachets","parce","teneurs","varient","selon","lots","methodes"],"q":"Pourquoi ne pas coller un taux unique de vitamine C sur tous tes sachets ?","a":"Parce que les teneurs varient selon les lots et les méthodes. La littérature montre une forte variabilité. Le laboratoire tranche pour ton lot; un taux unique collé partout serait trompeur.","example":"Tu prépares la structure du tableau nutritionnel Baobab Bliss et tu laisses la case vitamine C vide jusqu’au bulletin, même si une amie cite un chiffre entendu à la radio.","next":"Refuse poliment d’improviser un taux sur WhatsApp cette semaine: garde la phrase « en attente d’analyse ».","alt":"Afficher la même note scolaire pour toute la classe sans copie: simple, mais injuste. Pareil pour un taux unique inventé.","hint":"Pourquoi « unique » et « tous les sachets » ne vont pas bien ensemble ici ?","mod":"m1","li":2},{"keys":["vitamine","degradation","quels","facteurs","fatiguent","surtout","chaleur","prolongee","lumiere","oxygene","simple","fait"],"q":"Quels facteurs fatiguent surtout la vitamine C ?","a":"La vitamine C (acide ascorbique) craint surtout la chaleur prolongée, la lumière et l’oxygène. Un emballage qui laisse passer l’air et la lumière fatigue aussi le composé pendant un stockage long. Tu limites ouverture, soleil et chaleur.","example":"Tu conditionnes vite après le tamisage Baobab Bliss et tu évites de laisser la bassine ouverte toute l’après-midi sous le toit chaud.","next":"Chronomètre aujourd’hui combien de temps ta poudre reste à l’air libre pendant une session, puis réduis ce temps.","alt":"Le thé oublié au soleil perd son caractère: ta poudre au soleil fatigue aussi ce qu’elle a de plus fragile.","hint":"Nomme trois facteurs de fatigue cités pour la vitamine C.","mod":"m1","li":2},{"keys":["acides","organiques","gout","acidule","pain","singe","vient","surtout","naturels","pulpe","plastique","sachet"],"q":"Le goût acidulé du pain de singe vient surtout…","a":"Le goût acidulé du pain de singe vient surtout des acides organiques naturels de la pulpe. Citrique, tartrique, malique et d’autres y contribuent. Ce n’est pas le goût du plastique du sachet ni un acide ajouté.","example":"Tu expliques à une cliente que l’acidité est naturelle au fruit, et tu proposes une dilution plus grande si elle la trouve trop vive, sans sucre ajouté si tu gardes la ligne pure en sachet.","next":"Note dans le carnet le mot « acides naturels » à côté de ton prochain lot dégusté.","alt":"Le jus de tamarin et le jus de citron: deux acidités, deux souvenirs. Tes lots de baobab auront aussi leur signature; le carnet la capture.","hint":"L’acidité vient-elle d’un ajout, ou du fruit lui-même ?","mod":"m1","li":3},{"keys":["mineraux","pulpe","quel","mineral","souvent","abondant","analyses","potassium","calcium","alimentaire","fluor","ajoute"],"q":"Quel minéral est souvent abondant dans les analyses de pulpe ?","a":"Le potassium revient souvent comme minéral abondant dans les analyses de pulpe, et le calcium est fréquemment cité aussi. Les oligoéléments apparaissent en plus petites quantités. Aucun taux n’est affiché sans analyse adaptée.","example":"Tu gardes la phrase « souvent décrit dans les études » pour le potassium, et tu attends le bulletin Baobab Bliss avant toute ligne chiffrée.","next":"Sur la maquette, n’écris aucun nom de minéral en gros caractères tant que le bulletin n’est pas là.","alt":"Comme savoir qu’un sol « porte bien le maïs » sans connaître encore le rendement exact de ton champ: tendance, pas chiffre de sachet.","hint":"Quel minéral est souvent en tête des tableaux publiés pour la pulpe ?","mod":"m1","li":4},{"keys":["mineraux","pulpe","peux","afficher","taux","fer","invente","faire","joli","seulement","analyse","regles"],"q":"Peux-tu afficher un taux de fer inventé pour « faire joli » ?","a":"Non. Tu n’affiches un taux de fer inventé pour « faire joli ». Seulement après analyse et selon les règles d’étiquetage qui s’appliquent à ton canal. L’honnêteté et la conformité passent avant la décoration.","example":"Une maquette Baobab Bliss avec un fer fantaisiste part à la poubelle du crayon: tu remets « à mesurer ».","next":"Relis ta maquette et efface tout taux minéral sans source écrite.","alt":"Ajouter des kilos inventés sur une balance de marché pour séduire: ça se voit vite et ça casse la confiance.","hint":"Un chiffre joli sans bulletin, est-ce autorisé par l’éthique du cours ?","mod":"m1","li":4},{"keys":["brunissement","reactions","couleur","pulpe","baobab","deja","seche","surveilles","surtout","stockage","reprise","humidite"],"q":"Sur la pulpe de baobab déjà sèche, tu surveilles surtout…","a":"Sur la pulpe déjà sèche, tu surveilles surtout le stockage, la reprise d’humidité et les fragments sombres de coque. Le brunissement enzymatique des fruits encore humides est un autre sujet, pour tes futurs séchages. Le tri et le tamisage gardent une teinte plus régulière.","example":"Avant le tamisage fin, tu retires les morceaux de coque sombre de ton bac Baobab Bliss: la couleur du lot reste plus homogène.","next":"Prévois un temps de tri écrit dans ton prochain calcul de session.","alt":"Enlever les cailloux du riz avant de cuire: geste simple qui change l’assiette. Ici, enlever les fragments sombres change la teinte.","hint":"Pour une poudre déjà sèche, où se joue surtout le brunissement lent ?","mod":"m1","li":5},{"keys":["brunissement","reactions","couleur","reaction","maillard","implique","surtout","sucres","composes","amines","certaines","conditions"],"q":"La réaction de Maillard implique surtout…","a":"La réaction de Maillard implique surtout des sucres et des composés aminés, sous certaines conditions d’humidité et de chaleur. Elle peut foncer la couleur au fil du stockage. Tu la limites en gardant la poudre sèche, fraîche relative et à l’abri.","example":"Tu compares dans un mois un sachet témoin opaque Baobab Bliss et un sachet resté au chaud: si le second a foncé, tu corriges emballage et local avant de blâmer tout le fruit.","next":"Garde un petit fond de sachet témoin de ton prochain lot dans une boîte opaque datée.","alt":"Sucre et protéines qui « se parlent » à la chaleur: image simple pour retenir qui participe à cette famille de réactions.","hint":"Quels partenaires chimiques sont cités pour Maillard ?","mod":"m1","li":5},{"keys":["lipides","oxydation","graines","huiles","trouvent","surtout","fruit","baobab","pulpe","tres","grande","quantite"],"q":"Où se trouvent surtout les lipides du fruit de baobab ?","a":"Les lipides du fruit de baobab se trouvent surtout dans les graines. La pulpe en contient très peu. Séparer les deux protège le profil stable de ta poudre.","example":"Tu vends aujourd’hui la pulpe Baobab Bliss; l’huile de graines, si un jour tu la presses, aura une autre étiquette et un autre plan de stockage.","next":"Vérifie qu’aucun tas de graines broyées ne reste sur la table de conditionnement.","alt":"Le noyau de la mangue n’est pas la chair: chaque partie du fruit a sa richesse. Ici l’huile vit surtout dans la graine.","hint":"Où cherches-tu l’huile si tu ouvres le fruit dans ta tête ?","mod":"m1","li":6},{"keys":["lipides","oxydation","graines","huiles","favorise","rance","chaleur","lumiere","oxygene","certains","metaux","sachet"],"q":"Qu’est-ce qui favorise le rance ?","a":"Le rance est favorisé par la chaleur, la lumière, l’oxygène et certains métaux. Pour les graines ou une future huile, tu stockes au sec, à l’ombre, dans des contenants propres. Pour la pulpe presque sans gras, tu évites surtout le mélange avec des fragments de graines.","example":"Une odeur « bizarre » sur un sachet te fait enquêter: graines passées au tamis, chaleur du local, sachet percé. Tu notes avant de décider.","next":"Sens ton stock de graines s’il existe; s’il sent la fatigue, isole-le et note la date.","alt":"L’arachide grillée sent bon; l’arachide rance sent la fatigue. Apprends ce contraste pour juger tes graines stockées.","hint":"Quels leviers d’oxydation la leçon aligne-t-elle ?","mod":"m1","li":6},{"keys":["fait","pousser","microbes","quels","piliers","favorisent","surtout","pousse","microbienne","eau","disponible","nourriture"],"q":"Quels piliers favorisent surtout la pousse microbienne ?","a":"Les piliers qui favorisent surtout la pousse sont l’eau disponible, la nourriture, une température douce et le temps. Sur la poudre, tu vises l’eau basse et un temps d’ouverture court. Sur une dégustation, tu vises le temps et l’ombre.","example":"Tu te dis aujourd’hui: « mon pilier Baobab Bliss, c’est l’eau »: tu refermes chaque sachet et tu ranges la boîte sèche avant de passer à autre chose.","next":"Choisis un seul pilier pour aujourd’hui et écris le geste qui le tient.","alt":"Quatre pieds d’un tabouret: enlèves-en un, l’assise penche. Enlève un pilier microbien, leur confort baisse.","hint":"Sans eau disponible, la pousse reste-t-elle facile ?","mod":"m2","li":1},{"keys":["moisissures","mycotoxines","faire","lot","moisissure","visible","isoler","appliquer","regle","ecrite","diluer","grand"],"q":"Que faire d’un lot avec moisissure visible ?","a":"Tu isoles le lot avec moisissure visible et tu appliques ta règle écrite. Tu ne dilues pas dans un grand sac. Tu notes, tu photographies si possible, tu retires de la vente le temps de décider.","example":"Un coin moisi dans un bac Baobab Bliss déclenche ta règle déjà signée: isolation immédiate, pas de débat improvisé devant l’aide.","next":"Si ta règle moisissure n’est pas encore écrite, rédige-la en trois lignes ce soir.","alt":"Retirer la mangue pourrie du panier, pas la couper en morceaux pour « partager le problème ».","hint":"Visible et moisi: premier geste, isoler ou mélanger ?","mod":"m2","li":2},{"keys":["moisissures","mycotoxines","aflatoxines","toxines","certaines","mesurees","labo","disparaissent","toujours","simple","soleil","matin"],"q":"Les aflatoxines…","a":"Les aflatoxines sont des toxines produites par certaines moisissures. Elles se mesurent en laboratoire. Elles ne disparaissent pas toujours avec un simple soleil du matin, et on ne les voit pas comme du sucre. Le tri, la sécheresse et l’isolation des lots suspects restent tes gestes d’atelier.","example":"Tu refuses l’idée qu’« un coup de soleil » a tout réglé sur un lot Baobab Bliss douteux: tu isoles et tu gardes le labo pour le jour où le canal l’exigera.","next":"Ajoute sur ta règle moisissure: « pas de magie solaire; isolation d’abord ».","alt":"Une tache d’huile sur un pagne ne part pas toujours au soleil: certaines choses demandent le bon lavage, ici le bon labo.","hint":"Les aflatoxines se jugent à l’œil, au soleil, ou au protocole labo ?","mod":"m2","li":2},{"keys":["pathogenes","poudres","seches","certains","peuvent","survivre","sec","puis","reprendre","milieu","humide","meurent"],"q":"Certains pathogènes dans les poudres…","a":"Certains pathogènes dans les poudres peuvent survivre au sec, puis reprendre dans un milieu humide. Ils ne meurent pas tous simplement parce que le produit paraît sec. D’où l’hygiène des mains, des surfaces et des sachets avant la rencontre avec l’eau de la cliente.","example":"Tu conditionnes Baobab Bliss avec des sachets propres et des mains lavées, en pensant au verre d’eau où la cliente diluera la poudre.","next":"Vérifie que les sachets vides sont rangés fermés, à l’abri de la poussière.","alt":"Une braise sous la cendre peut attendre: le sec cache parfois une vie qui repart au contact de l’air et du combustible. Image simple pour l’attente au sec.","hint":"Survie au sec puis reprise: que se passe-t-il quand l’eau revient ?","mod":"m2","li":3},{"keys":["pathogenes","poudres","seches","savoir","pathogene","present","passes","laboratoire","plan","goutes","pincee","test"],"q":"Pour savoir si un pathogène est présent, tu…","a":"Pour savoir si un pathogène est présent, tu passes par un laboratoire et un plan d’échantillonnage. Tu ne goûtes pas pour trancher. Tu préviens, tu traces, tu fais analyser quand le volume ou le canal le demandent.","example":"Avant un salon où l’acheteur exige une preuve, tu planifies avec un labo le prélèvement de plusieurs unités Baobab Bliss, pas une pincée « pour voir ».","next":"Écris dans la pochette labo: « pathogènes: plan et méthode, pas dégustation ».","alt":"On ne juge pas la pureté de l’eau d’un puits en la goûtant seulement: on s’appuie sur un contrôle adapté.","hint":"Le goût tranche-t-il un pathogène, ou le labo ?","mod":"m2","li":3},{"keys":["pathogenes","poudres","seches","quel","geste","reduit","porte","entree","frequente","laver","mains","session"],"q":"Quel geste réduit une porte d’entrée fréquente ?","a":"Laver les mains avant la session et après les pauses réduit une porte d’entrée fréquente. C’est une barrière simple et forte. Tu la montres à ton aide jusqu’à ce que le geste soit automatique.","example":"Après une pause thé, tu te relaves avant de reprendre le scellage des sachets Baobab Bliss, même si « ça va vite ».","next":"Chronomètre un lavage complet une fois: toutes les faces, entre les doigts, sous les ongles.","alt":"Essuyer ses pieds avant d’entrer dans une pièce propre: petit rite, grand effet sur ce qui suit.","hint":"Quelle porte d’entrée les mains ouvertes en permanence laissent-elles ?","mod":"m2","li":3},{"keys":["nettoyer","desinfecter","table","encore","sale","sert","peu","parce","salete","protege","microbes","desinfectant"],"q":"Pourquoi désinfecter sur une table encore sale sert peu ?","a":"Désinfecter sur une table encore sale sert peu parce que la saleté protège les microbes. Le désinfectant atteint mal sa cible. Tu enlèves d’abord la matière, tu laves, tu rinces, tu sèches, puis tu désinfectes selon la notice.","example":"La farine de poudre Baobab Bliss collée aux jointures doit partir au lavage avant tout produit désinfectant.","next":"Fais une ronde des coins de table et gratte ce qui est collé avant la prochaine désinfection.","alt":"Parfumer une chemise encore pleine de terre: l’odeur masque, la saleté reste. Ici la chimie sur la croûte ne remplace pas le grattage.","hint":"Que fait la saleté au désinfectant: elle aide, ou elle protège les microbes ?","mod":"m2","li":4},{"keys":["nettoyer","desinfecter","quel","ordre","sage","rincer","secher","puis","selon","notice","abord","croute"],"q":"Quel ordre est le plus sage ?","a":"L’ordre le plus sage est: débarrasser, laver, rincer, sécher, puis désinfecter selon la notice, avec rinçage si exigé, puis sécher encore. Propre d’abord, chimie ensuite. Inverser laisse de la saleté qui protège les microbes.","example":"Tu affiches près de l’évier Baobab Bliss une liste courte dans cet ordre, pour ne pas improviser quand tu es pressée.","next":"Écris l’ordre en cinq mots sur un papier scotché près du point d’eau.","alt":"On ne vernit pas un meuble plein de poussière: on dépoussière, puis on vernit. Même logique sur ta table.","hint":"Où places-tu le désinfectant dans la séquence: au début ou vers la fin ?","mod":"m2","li":4},{"keys":["nettoyer","desinfecter","torchon","douteux","secher","peut","recontaminer","surface","remplace","lavage","mains","garantit"],"q":"Un torchon douteux pour « sécher »…","a":"Un torchon douteux pour « sécher » peut recontaminer la surface. Il ne remplace pas un lavage correct. Tu choisis un essuie propre souvent lavé, ou un séchage à l’air protégé.","example":"Après avoir rincé la spatule Baobab Bliss, tu la laisses sécher sur une grille plutôt que de la frotter avec un chiffon gris.","next":"Lave aujourd’hui tous les chiffons de la zone et marque ceux qui sont dédiés au propre.","alt":"Sécher un verre avec un pagne sorti du panier à linge sale: le verre brille un instant, puis garde ce qu’il a reçu.","hint":"Sécher avec un torchon douteux termine-t-il le nettoyage, ou peut-il le défaire ?","mod":"m2","li":4},{"keys":["hygiene","personnelle","avoir","touche","argent","marche","reprendre","poudre","laves","mains","selon","protocole"],"q":"Après avoir touché l’argent au marché, avant de reprendre la poudre, tu…","a":"Après avoir touché l’argent au marché, avant de reprendre la poudre, tu te laves les mains selon le protocole. L’argent est une surface très manipulée. Ce geste ferme une porte d’entrée concrète.","example":"Tu reviens de la table de vente avec la monnaie dans la poche: tu te laves, puis seulement tu ouvres le bac Baobab Bliss.","next":"Prévois un point d’eau ou une cuvette savonneuse accessible entre la zone monnaie et la zone poudre.","alt":"Après avoir compté des billets poussiéreux, tu ne plonges pas les doigts dans le plat familial sans passer au savon.","hint":"Argent puis poudre: que inserts-tu entre les deux ?","mod":"m2","li":5},{"keys":["declaration","nutritionnelle","bulletin","analyse","laisses","cases","mesurer","plutot","inventer","remplis","chiffres","jolis"],"q":"Sans bulletin d’analyse, tu…","a":"Sans bulletin d’analyse, tu laisses les cases « à mesurer » plutôt que d’inventer. L’honnêteté passe avant un tableau joli. Tu prépares la structure et tu attends les vraies mesures.","example":"Ton brouillon Baobab Bliss montre des cases vides datées: déjà plus professionnel qu’un chiffre fantaisie.","next":"Daté aujourd’hui ton tableau vide et range-le avec la maquette.","alt":"Laisser une case de formulaire vide en attendant la pièce: mieux vaut vide que faux.","hint":"Sans bulletin, remplis-tu ou attends-tu ?","mod":"m3","li":1},{"keys":["mentions","obligatoires","sachet","parmi","elements","lequel","fait","partie","base","denomination","quantite","nette"],"q":"Parmi ces éléments, lequel fait partie des mentions de base ?","a":"Parmi les mentions de base figurent la dénomination, la quantité nette et l’identité de l’exploitante (nom et adresse), avec lot, date de durabilité, conservation et usage. Ces éléments disent ce qu’on achète et à qui parler. La lisibilité les accompagne.","example":"Sur ton sachet remis en main propre Baobab Bliss, la cliente trouve le nom du produit, le poids net, ton nom et ton adresse, le lot et la date de durabilité.","next":"Coche sur ton épreuve d’étiquette: dénomination, quantité nette, nom et adresse, lot, date, conservation.","alt":"Une boîte sans nom sur l’étagère: personne ne sait ce qu’elle contient ni à qui la rendre.","hint":"Quels éléments identifient le produit et l’exploitante ?","mod":"m3","li":2},{"keys":["allergenes","traces","pulpe","baobab","seule","majeurs","listes","europe","doit","toujours","etre","ecrite"],"q":"La pulpe de baobab seule…","a":"La pulpe de baobab seule n’est pas l’un des allergènes majeurs listés en Europe. Elle n’a pas à être mise en évidence comme tel sur ce seul fondement. Tu restes vigilante sur d’autres aliments présents dans le local.","example":"Ton sachet Baobab Bliss à un seul ingrédient n’ajoute pas une ligne d’allergène majeur inventée; tu surveilles plutôt arachides ou lait s’ils existent chez toi.","next":"Si tu ne manipules aucun autre allergène, écris-le clairement dans le carnet pour t’en souvenir.","alt":"Pas besoin d’écrire « contient du poisson » sur un sachet de mil pur: on nomme ce qui est vrai.","hint":"La pulpe seule figure-t-elle dans les quatorze groupes majeurs ?","mod":"m3","li":3},{"keys":["allergenes","traces","faire","abord","cas","autres","local","separer","temps","nettoyer","vrai","melanger"],"q":"Que faire d’abord en cas d’autres allergènes dans le local ?","a":"Tu sépares d’abord dans le temps et tu nettoies pour de vrai. Tu ne mélanges pas les sessions. La phrase d’étiquette vient après les gestes, jamais à leur place. Une affiche interne des majeurs peut t’aider si tu manipules plusieurs aliments.","example":"Baobab le matin, autres aliments le soir, lavage complet entre les deux: voilà ton premier plan si le local est partagé.","next":"Décide par écrit les horaires baobab et les horaires autres aliments pour la semaine.","alt":"Changer de chapitre dans un cahier: tu tournes la page et tu n’écris pas les deux leçons l’une sur l’autre.","hint":"Gestes de séparation d’abord, ou phrase « peut contenir » d’abord ?","mod":"m3","li":3},{"keys":["allegations","dis","riche","vitamine","analyse","seuil","ecrit","seulement","gros","caracteres","gout","acide"],"q":"« Riche en vitamine C » sans analyse ni seuil…","a":"« Riche en vitamine C » sans analyse ni seuil ne s’écrit pas. Il faut une base analytique et les conditions d’allégation. Tu retires la phrase et tu gardes composition et usage.","example":"Sur WhatsApp comme sur le sachet Baobab Bliss, tu n’utilises pas « riche en vitamine C » tant que le dossier n’existe pas.","next":"Barre cette formulation partout où elle apparaît encore dans tes brouillons.","alt":"Mettre « or » sur un bijou sans contrôle: le mot impressionne, la confiance tombe vite.","hint":"Sans analyse ni seuil, la phrase se garde ou se retire ?","mod":"m3","li":4},{"keys":["allegations","dis","quelle","phrase","sure","ici","pulpe","baobab","100","diluer","eau","boost"],"q":"Quelle phrase est la plus sûre ici ?","a":"Une phrase sage ici décrit la composition et l’usage: pulpe de baobab cent pour cent, à diluer dans l’eau. Tu évites les effets sur le corps et les slogans miracles inventés. Si tu ne peux pas l’expliquer calmement, tu la retires.","example":"Tu compares deux slogans Baobab Bliss: tu gardes « pulpe pure à diluer », tu retires « remède miracle pour le corps ».","next":"Écris trois phrases candidates et marque garde ou retire pour chacune.","alt":"Dire « riz du champ, à cuire à l’eau » reste clair. Dire « riz qui transforme la vie » dépasse le produit.","hint":"Composition et usage, ou effet miracle: laquelle reste défendable ?","mod":"m3","li":4},{"keys":["maquette","complete","baobab","bliss","faire","cases","nutritionnelles","analyse","laisser","attente","plutot","inventer"],"q":"Que faire des cases nutritionnelles avant analyse ?","a":"Avant analyse, tu laisses les cases nutritionnelles en attente plutôt que d’inventer. Tu peux écrire « valeurs en cours de mesure » si tu ne publies pas encore de chiffres. La promesse cent pour cent pulpe, elle, reste.","example":"La face arrière de ta maquette Baobab Bliss porte cette mention d’attente, propre et datée, en attendant le bulletin.","next":"Ajoute la mention d’attente sur ta première épreuve d’étiquette si les cases sont encore vides.","alt":"Un menu qui dit « prix du jour » plutôt qu’un faux prix: l’attente honnête se lit mieux.","hint":"Inventer ou attendre: que préfère le module maquette ?","mod":"m3","li":5},{"keys":["maquette","complete","baobab","bliss","test","dix","secondes","sert","verifier","essentiel","trouve","vite"],"q":"Le test des dix secondes sert à…","a":"Le test des dix secondes sert à vérifier que l’essentiel se trouve vite. Une lectrice neuve doit repérer le nom, la quantité, le lot ou le contact sans fouiller. Tu corriges ensuite placement et contraste.","example":"Deux voisines testent ta maquette Baobab Bliss: si le lot reste invisible, tu le montes plus haut avant toute impression.","next":"Chronomètre un vrai test avec une personne hors du projet cette semaine.","alt":"Chercher le prix sur une boutique encombrée: si tu mets trop longtemps, l’affichage est à revoir.","hint":"Que mesures-tu en dix secondes: la beauté du dessin, ou la vitesse à trouver l’essentiel ?","mod":"m3","li":5},{"keys":["maquette","complete","baobab","bliss","promesse","100","pulpe","reste","stable","meme","tableau","remplit"],"q":"La promesse 100 % pulpe…","a":"La promesse cent pour cent pulpe reste stable même quand le tableau nutritionnel se remplit. Tu changes les cases chiffrées, pas l’ingrédient unique. Numéroter les versions de maquette garde la mémoire de ce qui était imprimé.","example":"Après le bulletin, Baobab Bliss affiche enfin des valeurs pour 100 grammes, toujours avec un seul ingrédient déclaré.","next":"Écris explicitement sur la maquette: « promesse pulpe: inchangée après analyse ».","alt":"Remplir le bulletin scolaire ne change pas le nom de l’élève: ici le tableau se remplit, la promesse d’ingrédient reste.","hint":"Quand les chiffres arrivent, que reste-t-il immobile ?","mod":"m3","li":5},{"keys":["sechoir","solaire","electrique","principes","cherchent","surtout","air","capable","emporter","eau","fruits","juteux"],"q":"Solaire et électrique cherchent surtout :","a":"Les deux cherchent un air plus chaud et plus capable d’emporter l’eau des fruits juteux. Solaire et électrique chauffent et renouvellent l’air. Tu mesures le produit, pas seulement le boîtier.","example":"Pour un futur essai mangue, tu compares un après-midi solaire clair et une séance électrique le soir : dans les deux cas tu pèses le plateau, tu ne juges pas seulement si l’appareil « marche ».","next":"Écris en une ligne : « même but : air capable d’emporter l’eau » sur la page séchoirs.","alt":"Deux cuisinières différentes pour faire évaporer une sauce : bois ou gaz, le but reste de faire partir l’eau. Ici le but est le même pour l’air du séchoir.","hint":"Quel résultat commun solaire et électrique cherchent-ils pour tes futurs fruits ?","mod":"m4","li":5},{"keys":["sechoir","solaire","electrique","principes","depend","surtout","ciel","heure","saison","seul","numero","lot"],"q":"Le séchoir solaire dépend surtout :","a":"Le séchoir solaire dépend surtout du ciel, de l’heure et de la saison. L’énergie est variable. Tu apprends à démarrer tôt, à protéger de la poussière et de la pluie, à finir parfois le lendemain.","example":"Un jour nuageux allonge ton essai mangue. Tu notes « ciel couvert » sur la fiche au lieu de croire que le plateau a échoué.","next":"Liste trois conditions de ciel à noter sur chaque essai solaire futur.","alt":"Comme le linge dehors : efficace les jours clairs, plus lent sous les nuages. Le ciel mène le rythme.","hint":"Quelles trois choses du temps rendent le solaire variable ?","mod":"m4","li":5},{"keys":["refroidissement","collage","ecoulement","poudre","emballer","encore","chaude","favorise","condensation","tard","effacement","numero"],"q":"Emballer une poudre encore bien chaude favorise :","a":"Emballer une poudre encore bien chaude favorise la condensation et, plus tard, le collage. La vapeur se dépose et plastifie la surface des particules. Le temps de pause avant soudure est un poste de maîtrise.","example":"Pressée de finir, tu soudes encore tiède. Une semaine plus tard, le sachet montre des grumeaux alors qu’un sachet du même lot refroidi reste libre.","next":"Interdis-toi verbalement de souder tant que la poudre chauffe encore les doigts ; note la pause sur la fiche.","alt":"Comme enfermer du tô brûlant : la buée revient. La poudre chaude dans le sachet suit la même physique simple.","hint":"Quel phénomène d’eau apparaît sur les parois quand tu fermes trop tôt ?","mod":"m4","li":6},{"keys":["refroidissement","collage","ecoulement","poudre","surtout","lie","eau","disponible","temperature","autour","matrice","sucree"],"q":"Le collage est surtout lié à :","a":"Le collage est surtout lié à l’eau disponible et à la température autour de la matrice sucrée. Quand on s’approche de la zone de ramollissement, les particules s’agglomèrent. Film, soudure et refroidissement comptent autant que le fruit.","example":"En fin de saison humide, un lot emballé trop chaud colle. Tu corriges refroidissement et soudure avant de changer de fournisseur de fruits.","next":"Sur un sachet collé du stock, note trois causes possibles : eau, chaleur d’emballage, soudure.","alt":"Le sucre en poudre par jour humide forme des blocs ; au sec il coule. Même jeu pour ta pulpe avec l’air de la pièce.","hint":"Quelles deux conditions rapprochent la matrice sucrée de son ramollissement ?","mod":"m4","li":6},{"keys":["refroidissement","collage","ecoulement","poudre","travailler","petites","quantites","tamiser","refroidir","emballer","longue","pause"],"q":"Pourquoi travailler par petites quantités ?","a":"Pour tamiser, refroidir et emballer sans longue pause ouverte. Moins d’exposition à l’air humide de la pièce. Tu portionnes en bols que tu emballes dans l’heure plutôt qu’un grand bassin toute la journée.","example":"Au lieu d’un grand bac ouvert jusqu’au soir, tu prépares trois petits bols : tamis, pause courte, sachet. La poudre reste plus libre.","next":"Pour la prochaine série, limite la quantité ouverte sur table à ce que tu emballes dans l’heure.","alt":"Comme ne laisser la farine en tas ouvert que le temps de la recette, pas toute l’après-midi sous le ventilateur humide.","hint":"Que gagnes-tu si la poudre reste moins longtemps à l’air libre de l’atelier ?","mod":"m4","li":6},{"keys":["choisir","souder","sachet","baobab","bliss","remplir","poudre","regles","soudure","sachets","vides","oublies"],"q":"Avant de remplir la poudre, tu :","a":"Tu règles la soudure sur des sachets vides. Tu valides le réglage sans gaspiller la poudre précieuse. Ensuite seulement tu doses la série.","example":"Le matin, cinq sachets vides, tirage sur les bords, ajustement du temps de pince. Puis tu commences le remplissage Baobab Bliss.","next":"Fais cinq sachets vides d’essai avant le premier lot du jour et coche-le sur la liste de contrôle.","alt":"Comme essayer la couture sur un coupon avant de couper le beau pagne. Tu règles l’outil d’abord.","hint":"Sur quoi testes-tu chaleur, temps et pression avant de remplir ?","mod":"m5","li":3},{"keys":["choisir","souder","sachet","baobab","bliss","soudure","farinee","poudre","peut","laisser","canal","air"],"q":"Une soudure farinée de poudre :","a":"Une soudure farinée de poudre peut laisser un canal d’air. La poudre empêche la fusion propre du film. Essuyer la zone avant de souder évite cette fuite annoncée.","example":"Tu tires sur un sachet : il s’ouvre sur un trait blanc. Tu écartes ce sachet, tu nettoies les bords des suivants, et tu notes le motif « farinée ».","next":"Ajoute le motif « soudure farinée » sur ta feuille de comptage des écarts.","alt":"Comme scotcher deux papiers avec de la farine au milieu : ça ne tient pas. La ligne doit être nette.","hint":"Que crée la poudre coincée dans le joint comme chemin pour l’air ?","mod":"m5","li":3},{"keys":["reprise","humidite","stock","stocker","cartons","sec","sureleves","hors","soleil","direct","contre","mur"],"q":"Où stocker les cartons ?","a":"Au sec, surélevés, hors soleil direct, loin des murs humides et des animaux. Tu limites reprise d’eau et chaleur. Écris la date sur le carton pour la rotation.","example":"Les cartons Baobab Bliss reposent sur une palette artisanale dans le coin le plus sec, à l’ombre, avec le plus ancien devant.","next":"Visite ton coin stock aujourd’hui et corrige un point : sol, soleil ou mur humide.","alt":"Comme le sac de mil sur des briques plutôt qu’à même le sol de saison des pluies. Même réflexe pour tes cartons.","hint":"Quels trois ennemis du lieu évites-tu pour les cartons : humidité du sol, soleil, mur qui suinte ?","mod":"m5","li":4},{"keys":["reprise","humidite","stock","signifie","premier","sorti","lots","anciens","partent","nouveaux","melange","toutes"],"q":"Que signifie premier entré, premier sorti ?","a":"Cela signifie que les lots anciens partent avant les nouveaux. Tu écris la date sur le carton et tu places l’ancien devant. Mélanger les dates, c’est perdre la traçabilité.","example":"Une commande arrive. Tu prends d’abord le carton daté de la semaine dernière, pas celui produit hier, même s’il est plus près de la porte.","next":"Range le stock pour que la date la plus ancienne soit la plus accessible à l’ouverture.","alt":"Comme utiliser d’abord le mil de la jarre ouverte avant d’ouvrir la jarre neuve. L’ordre protège la maison.","hint":"Lequel des deux lots sors-tu en premier : le plus ancien ou le plus récent ?","mod":"m5","li":4},{"keys":["etapes","vue","ensemble","cinq","premieres","servent","surtout","preparer","terrain","analyse","detaillee","remplacer"],"q":"Les cinq premières étapes servent surtout à :","a":"Les cinq premières étapes servent surtout à préparer le terrain avant l’analyse détaillée. Équipe, description du produit, usage prévu, diagramme de flux et confirmation sur place viennent avant les principes. Elles ne remplacent pas les contrôles et ne décorent pas le mur.","example":"Avant d’analyser les points sensibles de ta ligne baobab, tu as déjà décrit la poudre, l’usage boisson ou cuisine, et tu as marché le flux jusqu’au stock.","next":"Coche sur ta liste ce qui est déjà prêt parmi ces cinq préparatifs.","alt":"Comme installer la table et le menu avant de contrôler la cuisson le jour de la fête: le cadre d’abord.","hint":"Prépare le terrain avec tes prérequis: cela ne remplace pas la surveillance du lot.","mod":"m6","li":2},{"keys":["points","critiques","baobab","mangue","declare","critique","rien","vraiment","priorise","parfait","peut","supprimer"],"q":"Si tout est déclaré critique :","a":"Si tout est déclaré critique, plus rien n’est vraiment priorisé. Tu disperses ton énergie et tu abandonnes la surveillance. Peu de points vraiment tenus protègent mieux qu’une longue liste décorative.","example":"Une amie te pousse à écrire, par exemple, vingt points critiques: tu réponds que tu en gardes deux surveillables, soudure et éventuellement humidité, avec fiches réelles.","next":"Compte tes points baptisés critiques: s’ils dépassent deux ou trois, tranche aujourd’hui.","alt":"Comme mettre un gardien devant chaque tiroir de la maison: plus personne ne garde vraiment la porte de la rue.","hint":"Si tout est critique, plus rien ne l’est: priorise vraiment.","mod":"m6","li":3},{"keys":["points","critiques","baobab","mangue","artisanal","candidat","frequent","integrite","soudure","couleur","logo","seule"],"q":"Pour baobab artisanal, un candidat fréquent est :","a":"Pour le baobab artisanal, un candidat fréquent de point critique est l’intégrité de la soudure. Elle protège après le process contre la reprise d’humidité. La couleur du logo ou le prénom du voisin ne sont pas des points critiques.","example":"Tu surveilles chaque soudure au regard et tu fais un essai de traction en début de série, avec correction écrite si un canal apparaît.","next":"Rédige la fiche soudure: limite, surveillance, correction, enregistrement.","alt":"Comme vérifier que le couvercle de la jarre d’huile est bien vissé avant de la ranger: l’étanchéité garde le contenu.","hint":"Cherche l’étape qui, si elle rate, laisse l’humidité revenir dans le sachet.","mod":"m6","li":3},{"keys":["points","critiques","baobab","mangue","future","souvent","critique","sechage","jusqu","cible","humidite","rangement"],"q":"Pour la mangue future, souvent critique :","a":"Pour une future mangue séchée, le séchage jusqu’à la cible d’humidité est souvent critique. Sous-sécher laisse trop d’eau disponible pour les moisissures. Tu ne copies pas les points du baobab sur la mangue sans nouvelle analyse.","example":"Quand tu imagines la fiche mangue, tu prévois un suivi de fin de cycle de séchage distinct de la fiche soudure du pain de singe.","next":"Note sur une feuille séparée « mangue future: recalculer les points critiques », sans mélanger avec Baobab Bliss.","alt":"Comme ne pas cuire le riz avec le même temps que le haricot: chaque aliment a son point de maîtrise.","hint":"Change de process, recalcule les points; les fiches restent séparées.","mod":"m6","li":3},{"keys":["referentiels","qualite","vue","vendre","aujourd","hui","ouaga","dois","abord","plan","quotidien","reel"],"q":"Pour vendre aujourd’hui à Ouaga, tu dois d’abord :","a":"Pour vendre aujourd’hui à Ouaga, tu dois d’abord un plan quotidien réel: hygiène, lots, liste de contrôle, étiquetage loyal. Un mur de certificats vides ou l’ignorance de toute hygiène ne construisent rien. Les référentiels viennent ensuite si le canal les demande.","example":"Tu ouvres le marché avec des sachets codés, une liste de contrôle cochée et une dénomination claire, sans attendre un audit payant.","next":"Vérifie que ta liste de contrôle du jour est affichée et utilisable demain matin.","alt":"Comme ouvrir une petite boutique avec des comptes clairs avant d’acheter une enseigne lumineuse coûteuse.","hint":"Commence par le réel de ton atelier, avant le décor d’un audit payant.","mod":"m6","li":6},{"keys":["preparer","dossier","export","stress","construit","piece","temps","veille","depart","seulement","inventant","rapports"],"q":"Un dossier export se construit :","a":"Le dossier pour l’export se bâtit progressivement, pièce après pièce, jamais la veille du départ et jamais avec des rapports inventés. Chaque ajout, devis de labo ou modèle de fiche lot, te rapproche. Tu suis ton rythme sur une période de, par exemple, douze à dix-huit mois.","example":"Ce mois-ci tu ajoutes le schéma de fabrication; le mois suivant un devis d’analyse; tu coches la liste de contrôle sans dramatiser les cases encore vides.","next":"Coche honnêtement huit cases export, par exemple: fait, en cours ou plus tard.","alt":"Comme rassembler les pièces d’un dossier scolaire sur plusieurs semaines: une photocopie après l’autre.","hint":"Avance pièce après pièce, avec sincérité: pas d’improvisation ni de rapport inventé.","mod":"m7","li":5},{"keys":["preparer","dossier","export","stress","importateur","sert","souvent","clarifier","exigences","pays","arrivee","remplacer"],"q":"L’importateur sert souvent à :","a":"L’importateur sert souvent à clarifier les exigences du pays d’arrivée. Il aide sur analyses, langue de l’étiquette et formalités. Il ne remplace pas ton hygiène locale et n’écrit pas tes recettes secrètes.","example":"Tu lui poses d’abord les questions de catégorie contaminants et d’étiquetage langue cible, tu gardes ses réponses datées dans le dossier.","next":"Prépare une courte liste de questions pour un futur importateur et range-la dans la pochette.","alt":"Comme un agent de gare qui indique le bon quai: il oriente, tu portes toujours ton bagage.","hint":"L’importateur clarifie les exigences du marché d’arrivée: il ne remplace pas ton atelier.","mod":"m7","li":5},{"keys":["preparer","dossier","export","stress","vends","seulement","ouaga","peut","avancer","pression","inutile","connaitre"],"q":"Si tu vends seulement à Ouaga, le dossier export :","a":"Si tu vends seulement à Ouaga, le dossier export peut avancer sans pression. C’est la colonne de droite: utile à connaître, pas obligatoire demain. Tu y travailles quand tu as de l’énergie, sans culpabilité.","example":"Tu glisses une pièce par mois dans la pochette export pendant que ton quotidien Ouaga reste la priorité du badge du module.","next":"Décide d’une seule petite pièce export à ajouter ce mois-ci, ou note « plus tard » sans stress.","alt":"Comme garder une valise préparée pour un voyage éventuel tout en vivant normalement à la maison.","hint":"Ni urgence artificielle ni ignorance: colonne de droite utile.","mod":"m7","li":5},{"keys":["sens","trompe","gouter","toujours","meme","endroit","calme","limiter","biais","lumiere","odeur","bruit"],"q":"Pourquoi goûter toujours au même endroit calme ?","a":"Parce que le cadre change ce que les sens croient percevoir. Lumière, odeurs de pièce, bruit et fatigue faussent couleur et odeur. Un endroit calme et stable rend les séances comparables d’une semaine à l’autre. Tu notes aussi l’heure et ce que tu as mangé juste avant.","example":"Tu goûtes toujours tôt sur la petite table de la véranda, même cuillère propre, même heure approximative. Un jour de pluie bruyante tu attends que ça se calme plutôt que de juger dans le salon plein d’odeurs de cuisine.","next":"Fixe par écrit l’endroit et la plage horaire de tes dégustations de la semaine.","alt":"Peser le mil tantôt sur un tapis mouvant, tantôt sur une table stable: les chiffres ne se parlent plus.","hint":"Qu’est-ce qui bouge autour de toi quand deux séances ne se ressemblent pas ?","mod":"m8","li":0},{"keys":["classer","noter","plaisir","mesure","surtout","note","neuf","appreciation","detection","intrus","duree","sechage"],"q":"Que mesure surtout une note de plaisir de un à neuf ?","a":"Elle mesure surtout le degré d’appréciation, pas la détection d’une différence cachée. Tu poses une question nette: pour quel usage, sur quelle échelle. Tu laisses des égalités possibles. Tu ramasses les feuilles avant la discussion de groupe pour ne pas influencer.","example":"Tu demandes: « pour la bouillie du soir, de un à neuf ». Deux personnes mettent sept, une met neuf. Tu as un plaisir chiffré pour cet usage précis, pas un score d’intrus.","next":"Écris la question d’usage exacte au-dessus de ta prochaine échelle un à neuf.","alt":"Dire « j’aime ce pagne à huit » parle du cœur, pas du fait qu’il soit tissé autrement qu’un autre.","hint":"Sur cette feuille, cherches-tu l’intrus ou l’envie de reprendre ?","mod":"m8","li":2},{"keys":["monter","petit","jury","compte","autant","nombre","personnes","qualite","consignes","silence","couleur","chaises"],"q":"Qu’est-ce qui compte autant que le nombre de personnes ?","a":"La qualité d’écoute, la compréhension de la consigne, et l’état des sens comptent autant que le nombre. Six personnes calmes et sans rhume servent mieux qu’une foule distraite. Tu prépares salle, verres, eau, codes et feuilles. Tu limites le nombre d’échantillons pour ne pas fatiguer nez et bouche.","example":"Tu refuses d’ajouter quatre produits de plus « pour en profiter ». Avec trois sachets et huit personnes concentrées, tu obtiens des feuilles lisibles et un dépouillement le soir même.","next":"Sur ta liste de contrôle de séance, ajoute « consigne comprise » et « nez libre » à côté du nombre de juges.","alt":"À une réunion de quartier, dix personnes qui écoutent pèsent plus que trente qui discutent entre elles.","hint":"Si tu doubles le nombre mais perds le silence, que gagnes-tu vraiment ?","mod":"m8","li":3},{"keys":["monter","petit","jury","produits","servir","souvent","premiere","seance","trois","quatre","limiter","fatigue"],"q":"Combien de produits servir souvent en première séance ?","a":"Trois à quatre produits suffisent souvent pour une première séance. Trop d’échantillons fatiguent la bouche et le nez. Tu chronomètres un rythme calme. Tu remercies, tu ramasses, tu calcules le soir même. Une séance trop chargée perd en clarté ce qu’elle gagne en quantité.","example":"Première séance Baobab Bliss: trois sachets seulement, codes tirés, eau claire. Les juges restent attentives jusqu’au bout. Tu dépouilles avant le dîner.","next":"Pour ta prochaine première séance, plafonne à quatre produits et écris ce plafond en haut de la page.","alt":"Servir douze sauces d’un coup à des invités fatigués: après la quatrième, plus personne ne distingue vraiment.","hint":"À partir de combien de goûts ton propre nez commence-t-il à se fatiguer ?","mod":"m8","li":3},{"keys":["ecouter","clientes","terrain","notes","priorite","phrase","cliente","mots","exacts","belle","reformulation","publicite"],"q":"Que notes-tu en priorité après une phrase de cliente ?","a":"Tu notes d’abord les mots exacts, pas ta traduction élégante. La phrase brute te permettra plus tard de relier le retour au grain du tamis, à la fermeture, ou à une attente différente. Tu dates. Tu sépares ensuite le fait et ta conclusion possible.","example":"Une cliente dit « ça coince entre les dents ». Tu écris cette phrase telle quelle. Le soir seulement tu ajoutes: « piste: grain du tamis » comme conclusion séparée.","next":"Au prochain marché, écris trois phrases brutes sans les reformuler, puis une seule priorité pour la semaine.","alt":"Si un enfant dit « ça pique », on écrit « ça pique », pas « sensation inconfortable »: les mots vrais guident mieux.","hint":"Sur ta page, lis-tu encore la voix de la cliente, ou seulement ton résumé ?","mod":"m8","li":4},{"keys":["ecouter","clientes","terrain","separer","fait","conclusion","dates","deux","marques","clairement","observe","decides"],"q":"Comment séparer fait et conclusion ?","a":"Tu écris d’abord ce qui a été dit ou vu, avec le nombre de personnes si tu l’as. Ensuite, sur une autre ligne, tu proposes une conclusion possible et tu dates les deux. Tu ne changes pas toute la ligne pour un seul commentaire isolé. Le fait reste même si tu revises la conclusion plus tard.","example":"Fait: trois personnes ont dit que le sachet est difficile à refermer. Conclusion possible: essayer un double pli la semaine prochaine. Tu dates les deux lignes sur le carnet Baobab Bliss.","next":"Sur une page, trace deux titres « fait » et « conclusion » et remplis-les une fois après le marché.","alt":"« Il a plu » est un fait; « donc n’ouvrons pas l’étal » est une conclusion: on peut discuter la seconde sans nier la première.","hint":"Peux-tu barrer ta conclusion sans effacer ce que les clientes ont réellement dit ?","mod":"m8","li":4},{"keys":["ecouter","clientes","terrain","questions","ouvertes","aident","aimes","parce","elles","reduisent","politesse","automatique"],"q":"Pourquoi les questions ouvertes aident plus que « tu aimes »?","a":"Une question ouverte laisse parler l’usage, la dose, le moment, les freins. « Tu aimes » pousse vers oui ou non et ferme souvent la suite. Les mots qui viennent ensuite te donnent des pistes d’atelier. Tu poses peu de questions et tu écoutes.","example":"Au lieu de « tu aimes? », tu demandes « tu la mets où, cette poudre? ». La cliente parle de la bouillie du petit et du sachet qui s’ouvre mal. Tu repars avec deux pistes concrètes.","next":"Remplace une fois « tu aimes » par une question ouverte unique et note les réponses brutes.","alt":"Demander « comment tu as trouvé la route » ouvre plus que « la route était bonne? »: on entend les nids-de-poule.","hint":"Ta question laisse-t-elle de la place pour une phrase entière, ou seulement oui et non ?","mod":"m8","li":4},{"keys":["transformer","gouts","decisions","doit","citer","decision","fin","seance","chiffre","verbatim","porte","prenom"],"q":"Que doit citer une décision de fin de séance ?","a":"Elle doit citer le chiffre ou la phrase exacte qui la porte. Sans citation, ce n’est qu’une impression. Tu écris garder, ajuster, changer, reporter ou tester encore, avec la date. Tu classes la suite: immédiat, sous quinze jours, ou surveillance seulement.","example":"Décision: « ajuster le tamis; preuve: six personnes sur huit ont dit grain trop gros; 31 octobre ». Action sous quinze jours cochée.","next":"Termine ta prochaine séance par une décision qui cite une preuve, avant de ranger les verres.","alt":"Décider de racheter du tissu « parce que trois clientes l’ont touché » cite une preuve; « parce que j’ai aimé » reste une humeur.","hint":"Si on te demande pourquoi dans trois mois, quel chiffre ou quelle phrase monteras-tu ?","mod":"m8","li":5},{"keys":["transformer","gouts","decisions","sert","seuil","fixe","seance","eviter","bouger","seulement","selon","humeur"],"q":"À quoi sert un seuil fixé avant la séance ?","a":"Le seuil évite de bouger au gré de l’humeur du soir. Tu décides avant, par exemple, sous quelle proportion de détection tu ne changes pas le tamis cette semaine. Tu peux réviser un seuil plus tard, mais tu dates la révision. Ainsi la décision reste disciplinée.","example":"Avant le triangle tu écris: « si moins de la moitié trouve l’intrus, je ne change pas le tamis cette semaine ». Le soir le score est juste au-dessus du hasard: tu tiens le seuil et tu ne changes pas.","next":"Écris un seuil simple avant ta prochaine séance et lis-le à voix haute avant d’accueillir le jury.","alt":"Fixer avant la foire « je m’arrête à telle dépense » évite de tout vider parce que l’ambiance monte.","hint":"As-tu déjà écrit la règle de décision avant d’entendre les résultats ?","mod":"m8","li":5},{"keys":["transformer","gouts","decisions","faire","preuve","faible","enjeu","moyen","retester","plutot","changer","standard"],"q":"Que faire si la preuve est faible et l’enjeu moyen ?","a":"Tu classes plutôt en surveillance ou en nouveau test, pas en grand changement d’atelier ou de marque. Tu dates la prudence. Tu distingues décision locale rapide et décision de marché qui demande d’autres preuves. Tu n’annonces pas une révolution pour un essai de huit personnes.","example":"Le jury hésite entre deux fermetures. L’enjeu est moyen. Tu décides: surveiller deux marchés, noter les plaintes, retester dans quinze jours. Pas de nouveau sachet annoncé partout.","next":"Sur ta page décisions, ajoute une case « surveillance seulement » et utilise-la une fois si la preuve est mince.","alt":"Si le ciel est juste un peu gris, on n’annule pas toute la cérémonie: on surveille et on garde un plan simple.","hint":"Le geste que tu envisages est-il proportionné à la solidité de la preuve ?","mod":"m8","li":5},{"keys":["mesurer","incertitude","doit","porter","mesure","utile","chiffre","unite","outil","seulement","rond","dessin"],"q":"Que doit porter une mesure utile ?","a":"Pour servir vraiment, un chiffre voyage avec son unité et le nom de l’outil. Tu ajoutes souvent lot, date et heure pour pouvoir relire. Sans cela, un nombre seul sur un bout de papier se perd et ne convainc personne. Tu documentes, tu ne maquilles pas.","example":"Tu écris « 502 g, balance cuisine, lot 19, 10 h 15 ». Une semaine plus tard tu compares sans deviner quelle balance c’était.","next":"Sur ta prochaine pesée, force-toi à écrire chiffre, unité, outil, lot et heure avant de ranger la balance.","alt":"Dire « trois » sans dire trois quoi ni avec quel bol, ça ne sert pas à refaire la sauce demain.","hint":"Quels trois piliers rendent le chiffre encore clair sans toi ?","mod":"m9","li":0},{"keys":["echantillonner","tromper","regle","echantillonnage","ecrite","limiter","biais","attrape","devant","remplacer","pesee","decorer"],"q":"Pourquoi une règle d’échantillonnage écrite ?","a":"Sans règle écrite, tu tends à prendre ce qui est devant, souvent le plus beau ou le plus accessible. La règle fixe combien, où, quand et qui. Elle aligne deux personnes qui prélèvent. Elle rend les contrôles comparables d’une semaine à l’autre.","example":"Ta règle dit: quatre sachets, un par zone du carton, le matin, par Olga ou Aïcha formée. Le jeudi, Aïcha prélève seule et le carnet reste cohérent.","next":"Écris et signe avec ton aide une règle d’échantillonnage d’une dizaine de mots essentiels.","alt":"Sans règle pour puiser l’eau au puits, chacun ramène une calebasse différente et on discute pour rien.","hint":"Deux personnes reliraient-elles la même façon de prélever sur ta page ?","mod":"m9","li":2},{"keys":["echantillonner","tromper","points","surveiller","prelevement","seul","dessus","bac","representer","fond","lot","ameliorer"],"q":"Que points à surveiller le prélèvement du seul dessus de bac ?","a":"Prélever seulement le dessus rate ce qui est au fond: grain, humidité perçue ou petits corps étrangers peuvent différer. L’échantillon ne ressemble plus au lot. Tu mélanges d’abord si c’est possible et sûr, ou tu prends à plusieurs profondeurs. Tu notes le geste.","example":"Le dessus du bac de poudre paraît plus fin après le transport. Tu prends aussi au milieu et vers le fond, tu mélanges, puis tu contrôles. Le carnet dit « pas seulement surface ».","next":"Sur un bac ouvert, pratique un prélèvement à trois profondeurs et note-le une fois.","alt":"Goûter uniquement la mousse du lait caillé, c’est ignorer ce qui repose au fond du bol.","hint":"Le dessus de ton bac raconte-t-il vraiment tout le lot ?","mod":"m9","li":2},{"keys":["comparer","deux","lots","faire","sortir","balance","ecrire","question","comparaison","phrase","effacer","lot"],"q":"Que faire avant de sortir la balance pour comparer ?","a":"Tu formules d’abord une question nette et tu fixes le critère. Tu t’assures que la méthode sera la même des deux côtés: même balance, même règle d’échantillonnage, même moment si possible. Ensuite seulement tu pèses. Un test ne sauve pas des données mal prises.","example":"Avant de peser lots 21 et 22, tu écris: « les masses moyennes se ressemblent-elles? » Critère: masse. Méthode: cinq sachets, même balance, matin. Puis tu sors la balance.","next":"Écris la question et le critère de ta prochaine comparaison avant d’allumer ou de sortir la balance.","alt":"Avant de comparer deux paniers au marché, on dit d’abord « on compare le poids ou la fraîcheur? ».","hint":"La question tient-elle en une ligne avant que le premier sachet touche le plateau ?","mod":"m9","li":3},{"keys":["comparer","deux","lots","garder","meme","methode","surtout","conditions","mesure","aller","vite","noter"],"q":"Pourquoi garder la même méthode sur les deux lots ?","a":"Sinon tu compares aussi tes conditions de mesure, pas seulement les lots. Une balance différente, une autre heure ou une autre règle d’échantillonnage mélangent les causes. La conclusion devient floue. La même méthode rend l’écart plus lisible.","example":"Tu avais pesé le lot du lundi le soir et celui du jeudi le matin sur une autre balance. Tu recommences les deux le même matin, même outil, avant de conclure.","next":"Vérifie sur ta prochaine comparaison que balance, règle et moment sont alignés; note-le en tête de page.","alt":"Comparer la longueur de deux pagnes avec deux mètres différents, c’est discuter de l’outil autant que du tissu.","hint":"Qu’est-ce qui bouge encore entre tes deux séries, à part le numéro de lot ?","mod":"m9","li":3},{"keys":["essais","planifies","eviter","changer","trois","choses","fois","parce","sauras","joue","trop","beau"],"q":"Pourquoi éviter de changer trois choses à la fois ?","a":"Parce que tu ne sauras pas ce qui a joué. Un essai planifié isole un facteur, ou un petit ensemble choisi à l’avance. Sinon le succès ou l’échec reste une anecdote. Tu veux pouvoir décider et archiver clairement.","example":"Tu veux tester le double pli. Tu laisses tamis et étiquette inchangés. Après deux marchés tu sais que les plaintes de refermeture ont baissé grâce au pli, pas à autre chose.","next":"Sur ton prochain essai, raye explicitement les facteurs que tu refuses de bouger.","alt":"Changer épices, feu et marmite le même jour: impossible de dire pourquoi le plat a changé.","hint":"Si le résultat est bon, sauras-tu nommer la seule chose à garder ?","mod":"m9","li":4},{"keys":["essais","planifies","contient","plan","ecrit","minimal","facteur","niveaux","critere","dates","seulement","dessin"],"q":"Que contient un plan écrit minimal ?","a":"Il contient le facteur étudié, les niveaux, combien de sachets ou d’essais, comment tu mesures le succès, la date de début et de fin, et une grille pour les résultats. Tu ajoutes l’ordre des essais si tu le tires au sort. La conclusion datée clôt le plan.","example":"Plan minimal: facteur type de pli; niveaux simple ou double; vingt sachets chacun; succès plaintes au marché; du 1er au 15; grille collée; conclusion le 16.","next":"Remplis un plan minimal sur une page avant de produire le premier sachet d’essai.","alt":"Même pour teindre deux foulards, on note couleur, durée, soleil, et ce qu’on jugera réussi.","hint":"Quels titres minimum transformeraient ton idée en page relisible ?","mod":"m9","li":4},{"keys":["suivre","chiffre","temps","regarder","dernier","point","tendance","plusieurs","jours","seulement","rumeur","marche"],"q":"Que regarder en plus du dernier point ?","a":"Tu regardes la tendance sur plusieurs jours, pas seulement le dernier point. Un jour anormal s’interprète avec mesure, échantillon et événement d’atelier. Des limites simples aident. Le but est la stabilité utile, pas l’agitation à chaque micro-bruit.","example":"Le dernier point de reprises au tamis est haut. Sur dix jours, c’est le seul pic, le jour où une aide débutait. Tu notes et tu surveilles; tu ne changes pas le tamis ce soir.","next":"Sur ta carte, relis les dix derniers points avant de décider quoi que ce soit sur le dernier.","alt":"Un seul jour de mauvaise vente ne dit pas la saison: on regarde la semaine et le mois.","hint":"Le dernier point est-il un sommet isolé ou la suite d’une pente ?","mod":"m9","li":5},{"keys":["suivre","chiffre","temps","reagir","jour","anormal","verifier","mesure","echantillon","evenement","atelier","effacer"],"q":"Avant de réagir à un jour anormal ?","a":"Tu demandes: la mesure a-t-elle changé? L’échantillon est-il comparable? Un événement d’atelier explique-t-il le saut? Parfois tu corriges une tare oubliée. Parfois tu notes un point hors série et tu enquêtes. Tu dates. Tu n’agites pas tout le procédé au premier pic.","example":"Masse moyenne bizarre un mardi. Tu vérifies la tare: oubliée. Tu recalcules, tu annotes la carte, tu continues. Pas de nouveau réglage de remplissage ce jour-là.","next":"Colle près de ta carte trois questions: mesure? échantillon? événement? et lis-les avant toute réaction.","alt":"Avant de crier à la fuite sur une jarre basse, on regarde s’il y a eu fête la veille.","hint":"As-tu vérifié l’outil et le contexte avant de toucher au geste de production ?","mod":"m9","li":5},{"keys":["planifier","production","doit","inclure","plan","honnete","nettoyage","pauses","aucune","duree","seulement","gestes"],"q":"Que doit inclure un plan honnête ?","a":"Un plan honnête inclut le travail utile et aussi les pauses, le nettoyage, et ton énergie réelle. Il s’appuie sur commandes ou ventes prévues, stock de sachets vides et pulpe disponible. Des créneaux courts et tenables valent mieux qu’une journée héroïque impossible. Tu partages le plan la veille.","example":"Ta semaine montre cassage, tamis, emballage, marché, et deux demi-journées marquées lavage et repos. Tu n’as pas prétendu produire trente sachets en trois heures.","next":"Ajoute explicitement lavage et pause sur ton plan de semaine actuel, puis relis-le à ton aide.","alt":"Un voyage planifié sans temps pour manger ni réparer la moto n’est pas un vrai plan.","hint":"Où sont le ménage et le souffle sur ta page de semaine ?","mod":"m10","li":1},{"keys":["planifier","production","goulot","poste","lent","limite","flux","radio","bel","outil"],"q":"Qu’est-ce qu’un goulot ?","a":"Un goulot est le poste trop lent qui retient tout le flux. Même si le reste va vite, la sortie attend ce poste. Tu l’identifies en regardant où le travail s’accumule. Tu ajustes le plan ou tu renforces ce poste avant d’empiler ailleurs.","example":"Chez toi le tamis retient: les gousses cassées s’accumulent pendant que l’emballage attend. Tu avances une heure de plus au tamis mardi, plutôt que d’ouvrir plus de gousses.","next":"Entoure sur ton plan le poste où le travail s’accumule le plus cette semaine.","alt":"Dans une file au puits, si une seule corde est lente, toute la cour attend: c’est le goulot.","hint":"Où vois-tu des piles qui grandissent pendant qu’un autre poste reste les bras ballants ?","mod":"m10","li":1},{"keys":["planifier","production","charge","depasse","temps","utile","reduire","lot","etaler","bacler","lavage","inventer"],"q":"Si la charge dépasse le temps utile ?","a":"Tu ajustes: tu réduis la charge, tu allonges le délai, ou tu déplaces une tâche. Tu ne mens pas en gardant un plan impossible. Le rythme à tenir se voit quand tu divises la charge par les heures utiles réelles. Tu respectes nettoyage et pauses dans le calcul.","example":"Trente sachets et trois heures utiles: tu vois que c’est trop serré. Tu passes à vingt sachets pour ce marché ou tu ajoutes une demi-journée, écrit sur le plan.","next":"Calcule une fois charge contre heures utiles pour l’échéance à venir et corrige le plan si ça dépasse.","alt":"Si le sac de mil est trop lourd pour la distance avant la nuit, on partage le sac ou on part plus tôt.","hint":"Ton plan tient-il sans sacrifier lavage et pause ?","mod":"m10","li":1},{"keys":["stocks","premier","sorti","signifie","sortir","abord","lot","arrive","tot","joli","jamais","noter"],"q":"Que signifie premier entré, premier sorti ?","a":"Cela signifie que tu sors d’abord ce qui est entré en premier. Chaque bac porte date et lot. La règle évite les vieux fonds oubliés au fond du placard. Si l’expiration prime, tu sors d’abord ce qui expire le plus tôt. Tu comptes régulièrement.","example":"Sacs d’étiquettes reçus en septembre devant ceux d’octobre. Tu finis septembre avant d’ouvrir octobre, même si le paquet neuf est plus joli.","next":"Vérifie un placard baobab aujourd’hui et place l’entrée la plus ancienne devant.","alt":"Au grenier, le sac de mil de la première récolte se consomme avant le sac rentré hier.","hint":"Le plus ancien est-il devant, ou caché derrière le plus récent ?","mod":"m10","li":2},{"keys":["structure","cout","revient","surtout","couts","variables","ceux","bougent","quantite","produite","existent","jamais"],"q":"Que sont surtout les coûts variables ?","a":"Ce sont les coûts qui bougent avec la quantité produite: pulpe, sachets, étiquettes, une partie du transport. Tu les additionnes d’abord par sachet. Les coûts fixes restent même si tu produis peu. Séparer les deux guide un prix réaliste.","example":"Pour chaque sachet Baobab Bliss tu comptes pulpe, kraft et étiquette comme variables. Le loyer d’espace du mois reste du côté fixe à répartir sur le volume prévu.","next":"Liste sur ta fiche trois coûts clairement variables et un coût plutôt fixe, avec la mention exemple si besoin.","alt":"Plus tu fais de beignets, plus tu uses d’huile et de farine: ce sont les variables de la poêle.","hint":"Si demain tu produis zéro sachet, quels coûts continuent quand même ?","mod":"m10","li":3},{"keys":["entretenir","materiel","privilegier","quotidien","entretien","routine","panne","cacher","outil","casse","attendre"],"q":"Que privilégier au quotidien ?","a":"Tu privilégies l’entretien de routine: laver, sécher, vérifier, ranger, avant la réparation d’urgence. Un geste régulier sur les outils critiques évite la panne le jour du marché. Tu coches sur une fiche: dernière vérification, prochain contrôle. Celle qui t’aide connaît aussi le geste de fin de journée.","example":"Chaque soir de production tu essuies le plateau de la balance, tu regardes la toile du tamis, tu laisses sécher les bassines. Vendredi tout est prêt pour samedi sans course aux pièces.","next":"Choisis un geste de routine pour un outil critique et fais-le ce soir, puis coche la fiche.","alt":"Balayer la cour chaque jour évite d’avoir à tout creuser le jour où les invités arrivent.","hint":"As-tu un geste court prévu ce soir, ou seulement l’espoir que rien ne casse ?","mod":"m10","li":4},{"keys":["entretenir","materiel","met","fiche","outil","dernier","controle","prochain","prix","concurrent","seulement","
