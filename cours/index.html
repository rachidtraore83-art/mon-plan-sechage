eulement si tu as une question de précision, pas pour te justifier. Sur le terrain, tu écoutes plus que tu ne défends. Note les mots exacts de la cliente. Une objection sur la fermeture du sachet vaut une heure de débat interne.","tip":"Après chaque vente test, écris trois mots bruts de la cliente avant de ranger la caisse.","simple":"Comme écouter une voisine raconter pourquoi sa sauce a raté: tu notes ce qu’elle a vraiment dit sur le sel ou le feu, tu ne réécris pas l’histoire pour te rassurer. Les mots bruts guident la correction en cuisine le lendemain matin.","plus":"Les études qualitatives de terrain (entretiens courts, observation d’usage) complètent les tests sensoriels contrôlés. On cherche des verbatims, des contextes d’usage, des freins (ouverture du sachet, dosage, conservation après ouverture). Une grille simple aide: qui, où, avec quoi, quel problème, quelle émotion, quelle suggestion. Exemple (nombres inventés pour l’exercice): sur dix acheteuses interrogées au marché, six mentionnent la difficulté à refermer, deux parlent d’acidité trop vive, une parle du prix. Priorisation: tu traites d’abord ce qui touche la sécurité et la conservation, puis ce qui bloque l’usage quotidien, puis les souhaits de variante. Biais de politesse: beaucoup diront « c’est bien » pour ne pas vexer. Les questions ouvertes (« raconte la dernière fois où tu as utilisé la poudre ») donnent plus que « tu aimes? ». Tu limites le temps: cinq à sept minutes par personne au marché suffisent souvent. Tu remercies. Tu ne vends pas pendant l’écoute pure. Tu peux aussi observer sans parler: regarder comment la personne ouvre le sachet, dose la poudre, referme. L’observation complète souvent l’entretien. Une photo autorisée du pli du sachet après usage en dit long.","expert":"Recherche consommateur qualitative vs quantitative. Entretien court sur le marché: questions ouvertes, reformulation, séparation « dit » / « ferait ». Biais de désirabilité sociale: la cliente dit ce qu’elle croit poli. Observation d’usage (dosage, mélange) complète le discours. Exemple (nombres inventés pour l’exercice): dix entretiens, trois thèmes récurrents; tu priorises un seul changement d’étiquette. Pour Baobab Bliss: tu notes le canal (foire, voisinage, boutique) car le contexte change la réponse. Tu évites les questions fermées « c’est bien ? ». Une grille à deux colonnes (verbatim / décision possible) transforme l’écoute en action. Tu dates chaque fiche. L’écoute terrain complète le labo sensoriell: elle capture le contexte d’usage (eau disponible, sucre ajouté, partage familial). Les guides d’entretien qualitatif insistent sur les questions ouvertes et la reformulation. Tu sépares verbatim et interprétation sur deux colonnes pour ne pas coller ton désir sur la phrase de la cliente. Dix entretiens bien menés battent cinquante «c’est bien?» précipités. Tu notes le lieu et le canal: une réponse en foire n’égale pas une réponse en voisinage. Pour l’étiquette, tu montres une maquette réelle, pas une description orale. Le livrable ingénieur est une décision priorisée (un changement), un critère de succès et une date de revue. Cadre: méthodes qualitatives d’écoute compatibles avec ISO 20252 (études de marché) en esprit TPE. Cadre écoute: esprit ISO 20252 adapté TPE. Une grille verbatim ou décision transforme l’écoute foire en changement d’étiquette unique.","quiz":[{"q":"Que notes-tu en priorité après une phrase de cliente?","choices":["Une publicité","Les mots exacts, avant ta belle reformulation","Le prénom de ton fournisseur"],"correct":1,"why_ok":"Les mots bruts gardent l’information. La reformulation peut l’adoucir à tort.","why_ko":"Publicité et fournisseur ne remplacent pas l’écoute."},{"q":"Comment séparer fait et conclusion?","choices":["Tu dates les deux et tu marques clairement ce qui est observé et ce que tu décides","Tu mélanges tout dans une seule phrase vague","Tu n’écris rien"],"correct":0,"why_ok":"Séparer fait et décision rend le carnet relisible.","why_ko":"Le flou ou l’absence de note empêchent d’apprendre."},{"q":"Pourquoi les questions ouvertes aident plus que « tu aimes »?","choices":["Parce qu’elles réduisent la politesse automatique et racontent l’usage","Parce qu’elles sont plus longues à lire à la radio","Parce qu’elles remplacent la balance"],"correct":0,"why_ok":"L’usage réel apparaît mieux avec une question ouverte.","why_ko":"Ce n’est ni un exercice radio ni une pesée."},{"q":"Que faire d’un seul commentaire isolé non lié à la sécurité?","choices":["Le noter sans bouleverser toute la ligne tout de suite","Changer immédiatement toute la recette","L’ignorer à jamais sans trace"],"correct":0,"why_ok":"Tu traces, tu cherches la répétition, tu priorises.","why_ko":"Ni réaction panique ni oubli total."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"Une dégustation gratuite compte comme une vente.","truth":false,"why":"Goûter et payer sont distincts."},{"t":"Les questions d’usage aident plus que les compliments.","truth":true,"why":"Faits avant validation."},{"t":"Tu peux noter le canal avec le retour.","truth":true,"why":"Contexte utile."}]},"exercise":{"prompt":"Interroge trois personnes ayant goûté ou acheté Baobab Bliss. Écris pour chacune un verbatim, un usage, un frein. Tire une priorité d’action.","hint1":"Cinq minutes par personne suffisent.","hint2":"Question utile: « raconte la dernière fois où tu as utilisé la poudre ».","solution":"Exemple: trois verbatims sur la refermeture; priorité: tester un double pli cette semaine et revérifier au marché."}},{"title":"Transformer les goûts en décisions","body":["Goûter sans décider gaspille le temps du jury. Chez Baobab Bliss, chaque séance se termine par une décision écrite: garder, ajuster le tamis, changer la fermeture, reporter, ou tester encore. La décision cite le chiffre ou le verbatim qui la porte. Sans citation, ce n’est qu’une impression.","Tu fixes un seuil avant la séance quand c’est possible. Exemple: « si moins de la moitié du petit jury trouve une différence, je ne change pas le tamis cette semaine ». Le seuil évite de bouger au gré de l’humeur du soir. Tu peux réviser un seuil plus tard, mais tu dates la révision.","Tu distingues décision d’atelier et décision de marché. Changer un pli de sachet est souvent local et rapide. Changer le positionnement du produit demande d’autres preuves. Tu n’annonces pas une révolution de marque pour un essai de huit personnes.","Tu classes les suites: action immédiate, action sous quinze jours, surveillance seulement. Pour une future mangue séchée, tu ouvriras une ligne de décisions séparée. Le carnet baobab reste lisible. Une page « décisions » datée devient ta mémoire d’ingénieure de terrain."],"prof":"La fin d’une séance sensorielle est un moment de courage calme. Tu écris ce que tu vas faire, pas seulement ce que tu as senti. Une décision modeste et tenue bat une grande intention oubliée. Relie toujours décision, preuve et date. C’est ainsi que le goût devient pilotage. Les goûts deviennent décisions seulement s’ils sont datés et liés à un changement de procédé ou de message. Sinon ce ne sont que des impressions. Garde trois décisions maximum par mois.","tip":"Avant de ranger les verres, écris la décision du jour en une phrase sur le carnet.","simple":"Comme après avoir goûté la sauce: tu décides d’ajouter un peu d’eau maintenant, de laisser mijoter, ou de garder la recette. Tu ne te contentes pas de dire « c’était intéressant ». La cuisine avance par décisions datées. Comme régler le sel dans la sauce: tu goûtes, tu notes, tu changes une seule chose, tu re-goûtes. Plusieurs changements d’un coup brouillent la lecture.","plus":"Un tableau de décision simple comporte: date, objectif de séance, méthode (triangle, notes, terrain), n, résultat clé, décision, responsable, date de vérification. Les décisions typiques en petite production alimentaire: ajuster une opération unitaire (tamis), corriger un emballage, former une aide au protocole, lancer un nouvel essai, arrêter une variante. Exemple (nombres inventés pour l’exercice): triangle n égale 12, neuf bonnes réponses, différence détectée entre deux tamis; notes hédoniques favorables au tamis fin; décision: passer le tamis fin en standard atelier dès lundi, vérifier au marché dans dix jours. Garde une règle anti-zigzag: tu ne reviens pas sur une décision avant la date de vérification, sauf problème de sécurité alimentaire. Communique la décision à toute personne qui touche le lot. Une décision restée dans ta tête seule ne change pas le produit. Archive une photo de la page décisions dans ton export de sauvegarde du cours ou ton carnet papier scanné.","expert":"Décision: relier données sensorielles et choix process (tamis, dilution, message d’usage). Matrice simple: constat, cause plausible, action, critère de succès, date de revue. Tu ne changes pas trois paramètres à la fois. Exemple (nombres inventés pour l’exercice): notes hédoniques baissent de 7 à 5 après un nouveau lot; tu testes d’abord le tamis, pas l’emballage et le message ensemble. Pour Baobab Bliss: une phrase de décision écrite bat dix avis oraux. Tu archives le lien « test → action → nouveau test ». La boucle courte (une semaine) évite l’accumulation de doutes. Tu gardes le calme: un mauvais score est une information, pas un verdict sur ton travail. La boucle décisionnelle sensorielle ressemble à un PDCA court: planifier le test, faire, comparer à la règle écrite, ajuster un seul levier. Tu gardes une matrice constat/cause plausible/action/critère/date. Changer tamis, message et prix ensemble rend toute attribution impossible. Quand le score baisse, tu vérifies d’abord la fidélité du protocole (même jury, même ordre de présentation). Exemple (nombres inventés pour l’exercice): note moyenne 7,1 puis 5,4 après un nouveau lot de gousses; tu testes le lot (triangle) avant de réécrire l’étiquette. L’archivage du lien test→action→re-test constitue la mémoire technique de Baobab Bliss. La boucle PDCA reste le socle ISO 9001 (esprit amélioration) appliqué au sensoriel atelier. Amélioration: esprit PDCA / ISO 9001 appliqué au sensoriel. La matrice constat ou action ou date de revue ferme la boucle sensorielle sans disperser les leviers. Amélioration: esprit PDCA et ISO 9001 appliqué au sensoriel.","quiz":[{"q":"Que doit citer une décision de fin de séance?","choices":["Le chiffre ou le verbatim qui la porte","Le prénom d’une chanteuse","Une citation célèbre inventée"],"correct":0,"why_ok":"La preuve ancre la décision.","why_ko":"Les ornements ne pilotent pas l’atelier."},{"q":"À quoi sert un seuil fixé avant la séance?","choices":["À éviter de bouger seulement selon l’humeur du soir","À décorer le mur","À remplacer le rinçage"],"correct":0,"why_ok":"Le seuil préécrit discipline la décision.","why_ko":"Ce n’est ni déco ni hygiène de bouche."},{"q":"Que faire si la preuve est faible et l’enjeu moyen?","choices":["Changer toute la ligne immédiatement","Retester plutôt que changer tout le standard","Effacer le carnet"],"correct":1,"why_ok":"Preuve faible oriente vers un nouvel essai.","why_ko":"Ni révolution immédiate ni oubli."},{"q":"Pourquoi tenir un journal des changements de paramètres?","choices":["Pour cacher les essais","Pour remplir des pages sans lire","Pour comprendre plus tard pourquoi un lot a bougé"],"correct":2,"why_ok":"Le journal rend l’historique relisible.","why_ko":"Le journal sert la mémoire process, pas le remplissage."}],"activity":{"type":"calc","prompt":"Moyenne de plaisir","fields":[{"id":"n1","label":"Note 1"},{"id":"n2","label":"Note 2"},{"id":"n3","label":"Note 3"},{"id":"n4","label":"Note 4"},{"id":"n5","label":"Note 5"}],"note":"Additionne puis divise par le nombre de notes. Ignore les vides.","tip":"Tes notes de séance."},"exercise":{"prompt":"Crée ta page « décisions sensorielles »: trois lignes modèles (date, preuve, décision, vérification). Remplis-en une avec un vrai petit essai Baobab Bliss.","hint1":"Une phrase de décision suffit.","hint2":"Ajoute une date de vérification.","solution":"Exemple: 31 oct., triangle 9/12, passage tamis fin, vérification marché dans 10 jours."}}],"m9":[{"title":"Mesurer et l’incertitude","body":["Une mesure utile porte trois choses: le chiffre, l’unité, et l’outil. Chez Baobab Bliss, tu notes le modèle de la balance et l’heure à côté du poids du sachet. Sans cela, tu ne pourras pas relire ni comparer la semaine suivante. Un chiffre seul sur un bout de papier se perd vite et ne convainc personne.","L’incertitude n’est pas une faute: c’est la marge honnête autour du résultat. Deux pesées du même sachet qui diffèrent d’un gramme te disent déjà quelque chose sur ta balance et sur ton geste. Tu gardes les deux valeurs. Tu n’effaces pas celle qui te dérange. Tu cherches plutôt la cause.","Trois pesées du même objet, notées avec lot et date, valent mieux qu’un seul chiffre trop beau. Tu documentes, tu ne maquilles pas. Si l’écart entre pesées est grand, tu nettoies le plateau, tu vérifies le niveau de la table, tu recommences. Parfois l’outil demande un contrôle avec des masses connues.","Si un jour tu séches mangue ou tomate, tu recopies la même discipline sur une page séparée: outil, unité, lot, date. La méthode reste. Le produit change. Aujourd’hui, pèse trois fois le même sachet Baobab Bliss et écris les trois valeurs côte à côte avant toute moyenne."],"prof":"Mesurer, c’est raconter une histoire vérifiable: quoi, avec quoi, quand, dans quelles conditions. L’incertitude rappelle que tout chiffre a une épaisseur. Chez toi, cette épaisseur se voit souvent en répétant la pesée. Garde le calme: mieux vaut trois chiffres honnêtes qu’un seul chiffre trop lisse. La confiance naît de la méthode, pas du vernis. Répète les gestes avant de changer d’outil.","tip":"Écris toujours l’unité juste après le nombre, sans l’oublier.","simple":"Comme partager de l’eau avec une tasse: si tu remplis un peu plus haut une fois et un peu plus bas la suivante, tu vois l’incertitude de ton geste. Tu n’accuses pas la tasse trop vite; tu répètes calmement et tu regardes l’écart entre les essais.","plus":"En métrologie, on distingue justesse (proximité de la valeur de référence) et fidélité (rapprochement des répétitions entre elles). La résolution de l’instrument, par exemple un gramme, n’est pas l’incertitude totale: le geste, le courant d’air, la température de la pièce et l’état d’étalonnage comptent aussi. Un contrôle simple consiste à peser des masses de référence ou un objet stable connu, à différents moments de la journée, puis à noter l’écart. Exemple (nombres inventés pour l’exercice): trois pesées 502 g, 500 g, 501 g pour un même sachet. L’étendue vaut 2 g. Tu obtiens une idée concrète de la répétabilité de la séance. Tu sépares erreur grossière (mal lire l’affichage), erreur systématique (balance toujours un peu haute) et erreur aléatoire (petit bruit d’un essai à l’autre). Pour la poudre, tu tares le contenant, tu attends la stabilité de l’affichage, tu protèges du vent d’un ventilateur. Tu tiens une fiche instrument: identité, dernière vérification, remarques, décision d’emploi ou de retrait temporaire. Tu peux aussi noter l’incertitude perçue en words simples: « plus ou moins 2 g aujourd’hui ». Cette phrase honnête aide une aide éventuelle à comprendre la mesure.","expert":"Métrologie de base: mesurande, unité, incertitude-type, facteur d’élargissement (souvent k=2 pour ~95 % si normalité approximative). Guide ISO/IEC 98-3 (GUM). Erreurs systématiques (tare oubliée, dérive) vs aléatoires. Pour une balance d’atelier: vérification avec masses connues, niveau, zéro. Exemple (nombres inventés pour l’exercice): trois pesées 99,8 g, 100,1 g, 100,0 g; étendue 0,3 g. Pour Baobab Bliss: tu notes l’outil (quelle balance) sur la feuille de lot. Une mesure sans outil ni date ne se discute pas demain. Tu sépares précision (serré) et justesse (proche de la référence). Un protocole d’une page suffit: quoi, avec quoi, combien de fois, critère d’acceptation. L’incertitude n’est pas une faiblesse: c’est une propriété de la mesure. Tu distinguishes erreur (écart ponctuel) et incertitude (dispersion raisonnablement attribuable). Une balance non mise à niveau crée un biais; des courants d’air créent du bruit. Le GUM propose de combiner incertitudes-types; en atelier, tu commences par répéter, documenter l’outil et coller une masse de contrôle. Pour Baobab Bliss, une fiche «contrôle balance» (date, masse, écart) suffit à professionnaliser le geste. Tu refuses de comparer deux lots pesés sur deux instruments non recoupés. La métrologie de base est le sous-sol de toute statistique ultérieure. Tu relies chaque chiffre à une décision atelier possible: accepter, reprendre le geste, ou faire vérifier l’instrument. Sans ce lien, la métrologie reste décorative. Baobab Bliss gagne à traiter la balance comme un équipement critique de libération. Référence: ISO/IEC Guide 98-3 (GUM). La fiche contrôle balance (masse connue, écart, date) professionnalise chaque libération de lot. Référence: ISO 3534 et ISO/IEC Guide 98-3 (GUM) pour l’incertitude.","quiz":[{"q":"Que doit porter une mesure utile?","choices":["Chiffre, unité et outil","Seulement un chiffre rond","Seulement un dessin"],"correct":0,"why_ok":"Sans unité et outil, le chiffre est difficile à relire.","why_ko":"Un chiffre seul ou un dessin ne remplacent pas une mesure complète."},{"q":"Que montrent deux pesées qui diffèrent d’un gramme?","choices":["Que tu dois inventer la moyenne idéale","Une information sur l’outil et le geste","Que la poudre est interdite"],"correct":1,"why_ok":"L’écart renseigne sur la répétabilité.","why_ko":"On n’invente pas et on n’interdit pas pour un gramme d’écart."},{"q":"Pourquoi garder les trois pesées plutôt qu’une seule trop belle?","choices":["Parce que la dispersion fait partie de l’information","Parce que le carnet aime le remplissage","Parce que la cliente le demande toujours"],"correct":0,"why_ok":"La dispersion parle de la qualité de mesure.","why_ko":"Ce n’est ni du remplissage gratuit ni une exigence client systématique."},{"q":"Que faire si l’écart entre pesées est grand?","choices":["Changer le nom du produit","Vérifier plateau et niveau, puis recommencer","Effacer les valeurs gênantes"],"correct":1,"why_ok":"Tu cherches la cause et tu remeasures.","why_ko":"Effacer ou renommer ne corrige pas la mesure."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"Il faut noter l’outil à côté de la mesure.","truth":true,"why":"Traçabilité."},{"t":"Inventer un chiffre est acceptable en urgence.","truth":false,"why":"Honnêteté."},{"t":"Répéter une pesée aide à voir la variation.","truth":true,"why":"Fidélité."}]},"exercise":{"prompt":"Pèse trois fois le même sachet Baobab Bliss. Note outil, heure, trois valeurs, étendue (plus grande moins plus petite).","hint1":"Pose le sachet au même endroit du plateau à chaque fois.","hint2":"Calcule l’étendue après les trois essais.","solution":"Exemple: 501 g, 500 g, 502 g, étendue 2 g, balance de cuisine, 9 h 30."}},{"title":"Moyenne et écart","body":["La moyenne résume un nuage de chiffres en un seul centre. Chez Baobab Bliss, si tu pèses cinq sachets et que tu obtiens des poids voisins, la moyenne te donne le niveau général. Elle ne dit pas si les sachets sont tous proches ou très dispersés. Pour cela, tu regardes aussi l’écart.","L’écart-type, ou plus simplement l’étendue au début, montre la dispersion. Une moyenne de 500 g avec des sachets entre 498 et 502 n’est pas la même histoire qu’une moyenne de 500 g avec des sachets entre 470 et 530. Tu écris toujours moyenne et dispersion ensemble.","Tu calcules à la main sur de petits effectifs pour comprendre. Plus tard, un tableur pourra t’aider, mais tu dois savoir ce que le chiffre signifie. Tu notes n, le nombre de valeurs. Une moyenne sur trois sachets n’a pas le même poids qu’une moyenne sur trente.","Pour un futur séchage de mangue, tu pourras suivre la moyenne d’humidité d’un lot et son écart. Aujourd’hui reste sur la poudre: prends cinq poids de sachets du même lot et calcule moyenne et étendue avant de parler de « lot régulier »."],"prof":"La moyenne attire l’œil; la dispersion dit la vérité du lot. Deux ateliers peuvent afficher la même moyenne et vivre deux réalités très différentes. Habitue-toi à écrire les deux chiffres côte à côte. Ajoute n. Avec ces trois éléments, tu commences à parler comme une ingénieure de production. Si quelqu’un te donne une moyenne sans n, repose la question. Garde une trace datée.","tip":"À côté de chaque moyenne, écris n et l’étendue ou l’écart-type.","simple":"Comme la note moyenne de la classe: une moyenne de douze avec tout le monde entre onze et treize n’est pas la même classe qu’une moyenne de douze avec des notes de quatre et de vingt. Le centre sans l’écart trompe.","plus":"La moyenne arithmétique x̄ est la somme des observations divisée par n. L’étendue R égale xmax moins xmin est un indicateur simple de dispersion pour de tout petits échantillons. L’écart-type expérimental s mesure la dispersion autour de la moyenne; la variance est s au carré. L’erreur-type de la moyenne vaut s divisée par la racine de n: elle diminue quand n augmente, ce qui reflète une moyenne mieux précisée. Exemple (nombres inventés pour l’exercice): poids 498, 500, 501, 499, 502 g. Somme 2500; moyenne 500 g; étendue 4 g. Tu commentes: niveau centré sur 500 g, dispersion faible sur ce mini-échantillon. Note pédagogique: enlever une valeur extrême sans règle écrite fausse le récit. Si tu exclus un point, tu documentes pourquoi (erreur grossière prouvée, sachet tombé, etc.). En production alimentaire artisanale, afficher moyenne et dispersion sur le carnet de lot crée une mémoire comparable d’une semaine à l’autre. Tu peux aussi calculer rapidement la médiane: elle résiste mieux à une valeur aberrante isolée. Exemple (nombres inventés pour l’exercice): 470, 500, 501, 499, 502 — la moyenne plonge à cause de 470, la médiane reste près de 500. Tu enquêtes sur le 470 avant de le fondre dans un résumé. Affiche sur le carnet la formule de la moyenne en toutes lettres une fois, puis applique-la sans la magie du tableur pendant une semaine.","expert":"Stat descriptive: moyenne, médiane, étendue, écart-type (s), coefficient de variation. La moyenne seule cache la dispersion. Pour petits n, la médiane et l’étendue sont plus honnêtes qu’une variance fragile. Exemple (nombres inventés pour l’exercice): masses 490, 500, 510, 500, 480 g; moyenne 496 g, étendue 30 g. Pour Baobab Bliss: cinq sachets du même lot te donnent déjà une lecture de régularité de remplissage. Tu traces un point par sachet avant de parler. Un écart large oriente d’abord vers le geste et la balance, pas vers la cliente. Tu documentes n et la méthode de prélèvement à côté du chiffre. Dispersion et tendance centrale racontent deux histoires. Un remplissage juste en moyenne mais très dispersé crée des sachets hors cible et des clientes déçues. L’écart-type empirique s = √(Σ(xi−x̄)²/(n−1)) pour un échantillon. Avec n petit, tu privilégies étendue et inspection visuelle du point par sachet. Exemple (nombres inventés pour l’exercice): cinq masses, étendue 30 g → tu stabilises le geste avant d’imprimer une nouvelle étiquette. Tu notes n sur chaque résumé. Sans n, le chiffre est orphelin. Le coefficient de variation (s/x̄) permet de comparer des grandeurs d’échelles différentes, avec prudence. Tu traces aussi un histogramme mental: beaucoup de points au centre, ou une traîne d’un côté. Une distribution asymétrique invite à regarder les sachets extrêmes un par un. Cette lecture visuelle précède les formules. Référence pratique: ISO 3534 (vocabulaire statistique) en esprit pour moyenne et dispersion. Cinq sachets pointés sur une ligne suffisent pour voir si le remplissage dérive.","quiz":[{"q":"Que manque-t-il si tu n’écris que la moyenne?","choices":["La dispersion et souvent n","Le prénom du fournisseur","La couleur du mur"],"correct":0,"why_ok":"Sans dispersion et n, la moyenne est pauvre.","why_ko":"Mur et prénom ne complètent pas une statistique de lot."},{"q":"Que montre surtout l’étendue?","choices":["La date de péremption","Le goût préféré","L’écart entre la plus petite et la plus grande valeur"],"correct":2,"why_ok":"L’étendue mesure une dispersion simple.","why_ko":"Ce n’est ni un test de goût ni une date."},{"q":"Que devient l’erreur-type si n augmente (s stable)?","choices":["Elle diminue","Elle explose toujours","Elle ignore n"],"correct":0,"why_ok":"SEM diminue comme 1 sur racine de n.","why_ko":"n compte dans la précision de la moyenne."},{"q":"Un intervalle de confiance sur la moyenne dit surtout…","choices":["Où se trouve plausible la moyenne du procédé","Le prix de vente","Exactement le poids de chaque sachet futur"],"correct":0,"why_ok":"L’IC cible la moyenne, pas chaque individu ni le prix.","why_ko":"Ne confonds pas moyenne, individu et tarif."}],"activity":{"type":"calc","prompt":"Cinq poids","fields":[{"id":"a","label":"Poids 1 (g)"},{"id":"b","label":"Poids 2 (g)"},{"id":"c","label":"Poids 3 (g)"},{"id":"d","label":"Poids 4 (g)"},{"id":"e","label":"Poids 5 (g)"}],"note":"Moyenne égale somme sur 5. Note min et max.","tip":"Tes poids."},"exercise":{"prompt":"Prends cinq poids de sachets du même lot. Calcule moyenne et étendue. Écris une phrase de commentaire.","hint1":"Garde l’unité.","hint2":"Mentionne n égale 5.","solution":"Exemple: n égale 5, moyenne 500 g, étendue 4 g: lot concentré sur cet échantillon."}},{"title":"Échantillonner sans se tromper","body":["Échantillonner, c’est choisir une petite part pour parler d’un tout. Chez Baobab Bliss, tu ne peux pas goûter ni peser chaque grain de chaque lot. Tu prends des sachets ou des poignées selon une règle écrite. Sans règle, tu tends à prendre ce qui est devant toi, souvent le plus beau ou le plus accessible.","Un bon échantillon ressemble au lot. Si tu ne prends que le dessus du bac, tu rates ce qui est au fond. Tu mélanges d’abord si c’est possible et sûr. Tu prends à plusieurs endroits. Tu notes combien tu as pris et sur quel lot numéroté.","La taille compte. Trop petit, ton chiffre saute d’un jour à l’autre. Trop grand pour ton temps, tu abandonnes la méthode. Tu cherches un compromis réaliste: assez pour voir une tendance, compatible avec ta journée de travail.","Pour une future mangue séchée, tu échantillonneras plateaux ou clayettes selon un plan, pas selon l’humeur. Aujourd’hui, écris ta règle baobab: combien de sachets, où, quand, pour quel contrôle. Écris aussi qui prélève. Deux personnes peuvent prélever différemment. Une brève démonstration commune aligne les gestes avant la campagne de contrôle."],"prof":"L’échantillon est un pont entre le lot entier et ta décision. Un pont bancal donne de belles analyses sur une réalité mal vue. Avant de calculer, demande: cet échantillon représente-t-il vraiment ce que je veux juger? Cette question simple évite des conclusions savantes mais fausses. Garde une trace datée. Garde une trace datée. Garde une trace datée. Garde une trace datée.","tip":"Écris la règle d’échantillonnage sur la même page que le résultat.","simple":"Comme goûter une marmite de sauce: si tu ne prends qu’à la surface, tu rates le fond plus concentré. Tu remues d’abord, puis tu goûtes au milieu. L’idée est la même pour un bac de poudre. Comme goûter la marmite: si tu ne prends que le dessus, tu rates le fond. L’échantillon doit parler de toute la cuisson.","plus":"Plans simples: échantillonnage aléatoire simple, échantillonnage systématique (un sachet tous les k), échantillonnage stratifié (début, milieu, fin de production). En contrôle de réception, des plans attributifs existent (normes du type ISO 2859) avec niveaux de qualité acceptables; en très petite structure, tu peux t’en inspirer sans tout copier. Exemple (nombres inventés pour l’exercice): lot de 60 sachets; tu tires 6 numéros au sort; tu contrôles masse et aspect. Biais classiques: choisir les sachets les plus beaux pour « faire joli », n’échantillonner que le lundi matin, changer de règle selon le résultat espéré. Taille: plus la décision est grave (sécurité, gros client), plus n doit monter ou plus le contrôle doit être fréquent. Documente: population (lot), cadre d’échantillonnage, méthode, n, date, opérateur. Si une analyse coûte cher, un échantillon composite bien fait évite de multiplier les frais inutiles tout en gardant une vision du lot. Échantillonner, c’est donner à chaque unité une chance connue d’être tirée. Un bac entier pris parce qu’il était devant biaise. Tu définis la population (lot), la taille n, et la méthode (aléatoire, systématique, stratifiée).","expert":"Échantillonnage: estimateur, biais, variance. Pour une proportion, erreur-type approx. √(p(1−p)/n). Pour une moyenne, √(σ²/n) en tirage aléatoire simple. Correction population finie (1−n/N) si n non négligeable. Plans d’échantillonnage microbiologiques: Règlement (CE) 2073/2005 (n, c, m, M). Contaminants: plans souvent plus lourds, à suivre avec le labo. Exemple (nombres inventés pour l’exercice): n=40 sachets, 3 sous 495 g → p̂=0,075. Pour Baobab Bliss: tu mélanges avant de prélever; tu évites le seul dessus du bac. Procédure d’une page: qui, où, combien, exclusions. Homogénéité du lot guide le plan spatial. Un plan d’échantillonnage répond à une question de décision (libérer, refuser, investiguer). Le Règlement (CE) 2073/2005 fixe des plans microbiologiques (n, c, m, M) selon le couple aliment/micro-organisme. Pour contaminants chimiques, le Règlement (UE) 2023/915 et les plans associés demandent souvent plus de rigueur d’échantillonnage que «un pot au hasard». Tu distinguishes prélèvement spatial (plusieurs zones du bac) et temporel (plusieurs moments). Pour Baobab Bliss, même un plan maison écrit (cinq sachets, positions notées) bat l’intuition. Tu archives le mode de tirage avec le résultat labo ou atelier. Quand tu envoies un échantillon au laboratoire, tu demandes la méthode et la limite de quantification, et tu gardes le bulletin avec le numéro de lot. Un résultat orphelin ne sert plus six mois plus tard. La procédure d’une page (qui, où, combien) voyage avec le bulletin de labo.","quiz":[{"q":"Pourquoi une règle d’échantillonnage écrite?","choices":["Pour remplacer la pesée","Pour limiter le biais du « j’attrape ce qui est devant »","Pour décorer le mur"],"correct":1,"why_ok":"La règle réduit le biais de commodité.","why_ko":"Ce n’est ni déco ni substitut de balance."},{"q":"Que points à surveiller le prélèvement du seul dessus de bac?","choices":["De mal représenter le fond du lot","D’améliorer magiquement le goût","De dater le sachet"],"correct":0,"why_ok":"Le dessus peut différer du fond.","why_ko":"Le lieu de prélèvement ne soigne ni goût ni date."},{"q":"Que documenter avec le résultat?","choices":["Seulement un smiley","Population, méthode, n, date","Seulement le prénom d’une chanson"],"correct":1,"why_ok":"Le contexte rend le chiffre interprétable.","why_ko":"Les ornements ne remplacent pas le plan."},{"q":"Si la décision est grave, que faire souvent?","choices":["Supprimer toute mesure","Augmenter n ou la fréquence de contrôle","Inventer un beau pourcentage"],"correct":1,"why_ok":"Plus d’enjeu, plus d’effort de preuve.","why_ko":"Ni suppression ni invention."}],"activity":{"type":"order","prompt":"Prélèvement","steps":["Choisir le lot","Prendre plusieurs points","Mélanger en composite","Noter quantités et contenants"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Choisir le lot, Prendre plusieurs points, Mélanger en composite, Noter quantités et contenants"},"exercise":{"prompt":"Écris ta règle baobab pour contrôler la masse: taille de lot typique, n, comment tu tires, que tu fais si hors cible.","hint1":"Une demi-page suffit.","hint2":"Prévois le cas d’un sachet abîmé.","solution":"Exemple: lot 40 sachets, n égale 5 tirés au sort, si 2 hors tolérance alors contrôle renforcé du lot."}},{"title":"Comparer deux lots","body":["Comparer deux lots, c’est répondre à une question nette: ces deux journées de production se ressemblent-elles sur le critère choisi? Chez Baobab Bliss, tu peux comparer la masse moyenne des sachets, ou le grain perçu, ou le taux de sachets mal fermés. Une question floue donne une comparaison floue.","Tu collectes les deux séries avec la même méthode. Même balance, même règle d’échantillonnage, même moment de la journée si possible. Sinon tu compares aussi tes conditions de mesure, pas seulement les lots.","Tu regardes d’abord les graphiques simples: points, moyennes, dispersions. Ensuite seulement tu utilises un test. Un test ne sauve pas des données mal prises. Il organise une décision face au hasard d’échantillonnage.","Tu écris la conclusion en langage clair: « pas de différence détectée sur la masse moyenne à ce seuil » ou « le lot B est plus dispersé ». Tu dates. Pour une mangue séchée future, la même discipline vaut sur humidité ou couleur. Si tu compares un lot du lundi et un lot du jeudi, note aussi la météo d’atelier et la fatigue. Parfois l’écart vient du contexte, pas de la formule produit."],"prof":"Comparer n’est pas couronner un lot préféré. C’est mesurer un écart relatif à une question. Si tu changes trois choses à la fois entre deux lots, tu ne sauras pas quoi conclure. Une seule différence volontaire à la fois, quand tu peux. Le reste est confusion. Garde une trace datée. Garde une trace datée. Garde une trace datée. Garde une trace datée.","tip":"Formule la question de comparaison en une phrase avant de sortir la balance.","simple":"Comme comparer deux marmites de tô: tu utilises la même louche et le même bol pour goûter, sinon tu compares tes outils plus que tes marmites. Même geste, ensuite jugement. Comme comparer deux paniers de tomates: regarder seulement la plus belle de chaque panier trompe. Il faut plusieurs fruits et leur variété de calibre.","plus":"Pour deux moyennes sur petites séries, le test t de Student pour échantillons indépendants (variances proches) ou la version de Welch si les variances diffèrent. Pour données appariées (même sachet avant/après une opération), le t apparié sur les différences. Pour des proportions (part de défauts), on compare avec un test adapté aux effectifs. Exemple (nombres inventés pour l’exercice): lot A moyenne 500 g s égale 2,5 n égale 12; lot B moyenne 496 g s égale 2,8 n égale 12. L’écart de moyennes vaut 4 g; un t dira s’il est difficilement explicable par le seul hasard d’échantillonnage. Seuil alpha souvent 0,05: ce n’est pas une loi morale, c’est une convention à déclarer. « Non significatif » ne signifie pas « strictement identique »: cela signifie que tu n’as pas détecté d’écart à ce plan. Avant tout test, trace côte à côte les deux boîtes à moustaches mentales: centres et dispersions. Le test confirme ou nuance ce que l’œil a vu.","expert":"Comparer deux lots: même protocole, une différence à la fois, critères écrits avant le test. Tests: t de Student si hypothèses raisonnables; sinon Mann-Whitney; pour appariés, Wilcoxon. L’essentiel en TPE: taille d’effet visible et répétabilité, plus qu’une p-value isolée. Exemple (nombres inventés pour l’exercice): lot A moyenne 500 g (étendue 8 g), lot B 497 g (étendue 25 g). Pour Baobab Bliss: tu écris ce qui était égal (même tamis, même journée) et ce qui différait. Une conclusion prudente: « B plus dispersé, je stabilise le remplissage avant de changer l’étiquette ». Tu refuses le « tout a changé ». La comparaison de lots est une mini-étude: hypothèse écrite, variable unique, critères d’effet pratique (pas seulement statistique). Un écart de 2 g sur la moyenne peut être sans importance si l’étendue reste dans ta tolérance atelier; l’inverse aussi. Tu reports toujours la dispersion. Les tests t/Mann-Whitney sont des outils; le jugement d’ingénieure porte sur la taille d’effet et la répétabilité. Pour Baobab Bliss, une feuille «A vs B» avec ce qui était égal et différent évite la réécriture mythique de l’histoire du lot. Tu conclus par une action unique et une date de re-mesure. Tu peux aussi comparer par paires appariées (même jour, même opératrice) pour réduire le bruit. L’appariement est un outil d’ingénieure autant qu’un test statistique. Documente le schéma d’appariement sur la feuille. Pour un cadre formel de comparaison, l’esprit des tests décrits dans les manuels ISO de statistique appliquée suffit en TPE documentée. Cadre: statistiques appliquées (esprit ISO 3534) pour comparer deux échantillons documentés. Cadre: esprit ISO 3534 pour comparer deux lots documentés. La feuille A contre B écrit ce qui était égal avant de conclure sur un écart. Cadre comparaison: esprit ISO 3534 pour deux lots documentés.","quiz":[{"q":"Que faire avant de sortir la balance pour comparer?","choices":["Écrire la question de comparaison en une phrase","Effacer le lot A","Changer trois réglages à la fois"],"correct":0,"why_ok":"La question nette guide le plan.","why_ko":"Multiplier les changements ou effacer n’aide pas."},{"q":"Pourquoi garder la même méthode sur les deux lots?","choices":["Pour aller plus vite sans noter","Pour plaire au jury","Pour ne pas comparer surtout tes conditions de mesure"],"correct":2,"why_ok":"Sinon l’écart vient de la mesure.","why_ko":"Vitesse ou séduction ne justifient pas le biais."},{"q":"« Non significatif » veut dire surtout…","choices":["Pas de différence détectée avec ce plan","Preuve absolue que tout est identique","Obligation de jeter les deux lots"],"correct":0,"why_ok":"C’est une non-détection, pas une identité absolue.","why_ko":"Ni certitude totale ni rejet automatique."},{"q":"Que regarder en plus du t?","choices":["Seulement le smiley du tableur","La météo","La taille d’effet et l’intérêt pratique"],"correct":2,"why_ok":"Significatif n’égale pas utile pour l’atelier.","why_ko":"Smiley et météo ne tranchent pas."}],"activity":{"type":"case","prompt":"Cas","story":"Matin et soir, balance différente, écart d’humidité.","q":"Que fais-tu ?","choices":["Tu publies que le soir est meilleur","Tu jettes le matin","Tu alignes l’outil et tu recommences"],"correct":2,"why_ok":"Protocole d’abord.","why_ko":"Publier sur outil différent trompe."},"exercise":{"prompt":"Choisis un critère (masse ou grain). Collecte 8 valeurs sur deux lots. Calcule les deux moyennes et dis si l’écart te paraît pratique, même avant un test.","hint1":"Même balance.","hint2":"Écris aussi les deux étendues.","solution":"Exemple: 500 contre 497 g, étendues proches: écart petit; tu décides si 3 g comptent pour toi."}},{"title":"Essais planifiés","body":["Un essai planifié change une chose à la fois, ou un petit ensemble de choses choisi à l’avance. Chez Baobab Bliss, tu veux savoir si le double pli du sachet réduit les plaintes de refermeture. Tu ne changes pas en même temps le tamis, l’étiquette et l’heure de production. Sinon tu ne sauras pas ce qui a joué.","Tu écris le plan avant: facteur étudié, niveaux (par exemple pli simple versus double), combien de sachets, comment tu mesures le succès, date de début et de fin. Tu tires au sort l’ordre des essais quand tu peux, pour ne pas confondre avec un effet jour.","Tu recueilles les résultats sur une grille. Tu compares. Tu décides. Tu archives. Un essai sans grille redevient anecdote. Un essai avec grille devient apprentissage d’atelier.","Plus tard, pour sécher de la mangue, tu pourras planifier température et durée comme facteurs. Aujourd’hui reste simple: un facteur, deux niveaux, un critère lisible, une conclusion datée sur le carnet Baobab Bliss. Tu dates chaque page et tu gardes le calme face au chiffre.","Tu colles la table des signes 2^2 dans le carnet avant de lire une interaction. Décision archivée à côté."],"prof":"Planifier un essai, c’est refuser le bricolage silencieux. Tu te donnes le droit d’apprendre clairement. Moins de facteurs à la fois, plus de vérité. Écris le plan avant le premier sachet. La discipline du avant protège l’interprétation du après. Garde le critère de succès visible sur la grille. Garde une trace datée. Garde une trace datée. Garde une trace datée.","tip":"Une seule phrase « je change X, je mesure Y » avant tout essai.","simple":"Comme tester deux façons de refermer une bassine d’eau savonneuse: tu changes seulement le couvercle, pas en même temps l’eau, le savon et la bassine. Sinon tu ne sais plus ce qui a arrêté les éclaboussures. Comme essayer deux recettes de tô: tu changes une chose à la fois, tu notes qui mange quoi, tu décides ensuite. Comme deux recettes de tô jugées le même soir: une variable à la fois, sinon tu ne sais plus ce qui a compté.","plus":"Le plan d’expérience élémentaire oppose un facteur à deux niveaux (A versus B) avec répétitions. On peut ensuite monter vers des plans factoriels à deux niveaux (2^k) pour étudier plusieurs facteurs et leurs interactions. Exemple (nombres inventés pour l’exercice): facteur fermeture (simple/double), critère égale nombre de mentions « mal refermé » sur 20 clientes; simple 8 mentions, double 2 mentions. Signal fort en faveur du double pli pour cette vague. Randomisation et répétition réduisent la confusion avec un effet jour ou un effet opérateur. Bloquer un facteur gênant (par exemple matin/après-midi) aide si tu ne peux pas le supprimer. Document de plan: objectif, facteurs, niveaux, n, randomisation, critère, responsable, règles d’arrêt. Garde les essais courts que tu finis. Un plan élégant abandonné à mi-chemin apprend moins qu’un plan simple terminé et décidé. Tu construis à la main la table des signes d’un 2^2 avant de parler d’interaction. Tu archives la table avec la décision. L’humidité du jour se note en marge.","expert":"Plans d’expérience simples: un facteur à la fois, puis factoriel 2² si tu es à l’aise. Randomisation de l’ordre, répétitions. Tableau à quatre cases pour deux facteurs à deux niveaux. Exemple (nombres inventés pour l’exercice): facteur tamis (fin/gros) × temps de repos (0/30 min); tu notes un score hédonique par case. Pour Baobab Bliss: dessine le tableau avant de toucher le produit. L’ordre tiré au sort se note sur la feuille. Tu changes un seul réglage entre deux lots de validation. Un essai sans case vide remplie n’est pas fini: tu termines le tableau avant de conclure. Un plan d’expérience élémentaire force la clarté: facteurs, niveaux, réponse, randomisation. Le factoriel 2² estime effets principaux et interaction. Sans randomisation, un effet de jour se déguise en effet de facteur. Tu prépares toutes les cases avant de commencer. Exemple (nombres inventés pour l’exercice): tamis fin/gros × repos 0/30 min, réponse = note hédonique moyenne de trois juges. Pour Baobab Bliss, ce tableau évite le «j’ai l’impression que». Tu documents les lots sources. Une interaction significative (esprit) te dit que l’effet du tamis dépend du repos: information précieuse pour le mode opératoire. Après l’essai, tu écris la règle de conduite retenue en une phrase opérationnelle («si repos 30 min alors…»). Sans règle écrite, l’essai retombe dans l’oubli. Range la feuille avec le numéro d’essai. Les plans factoriels élémentaires sont décrits dans les ouvrages de plans d’expérience (esprit ISO 3534-3). Le tableau factoriel se remplit entièrement avant la phrase de règle opérationnelle.","quiz":[{"q":"Pourquoi éviter de changer trois choses à la fois?","choices":["Parce que c’est trop beau","Parce que la balance refuse","Parce que tu ne sauras pas ce qui a joué"],"correct":2,"why_ok":"Un seul changement volontaire clarifie la cause.","why_ko":"Ni esthétique ni caprice d’instrument."},{"q":"Que contient un plan écrit minimal?","choices":["Seulement un dessin sans chiffres","Facteur, niveaux, critère, n, dates","Seulement une envie vague"],"correct":1,"why_ok":"Le plan fixe le contrat de l’essai.","why_ko":"L’envie vague ne guide pas."},{"q":"À quoi sert la randomisation?","choices":["À limiter la confusion avec un effet jour","À remplacer le critère","À décorer le tableau"],"correct":0,"why_ok":"Elle mélange l’ordre pour réduire les biais temporels.","why_ko":"Pas de décor ni de substitut au critère."},{"q":"Que montre une interaction dans un plan à deux facteurs?","choices":["Que les facteurs n’existent pas","Que l’effet d’un facteur dépend du niveau de l’autre","Que n est inutile"],"correct":1,"why_ok":"L’interaction dit que les effets ne s’additionnent pas simplement.","why_ko":"Les facteurs existent et n compte toujours."}],"activity":{"type":"match","prompt":"Facteur","left":["Tamis","Temps d’attente","Température future"],"right":["Fin ou gros","Juste après ou plus tard","Basse ou haute"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche le lien métier.","hint2":"Élimine les paires absurdes.","solution":"Chaque élément a une seule bonne association."},"exercise":{"prompt":"Écris un mini-plan: double pli versus pli simple, critère client, n, durée, comment tu décides.","hint1":"Une page.","hint2":"Fixe le critère avant.","solution":"Exemple: 2×20 sachets, mentions refermeture sur 15 clientes, 10 jours, seuil: moitié moins de mentions."}},{"title":"Suivre un chiffre dans le temps","body":["Un chiffre suivi chaque jour devient un pilote. Chez Baobab Bliss, tu peux suivre la masse moyenne d’un échantillon de sachets, ou le nombre de reprises au tamis, ou les plaintes de la semaine. Tu poses le chiffre sur un axe temps. Tu regardes la tendance, pas seulement le dernier point.","Un jour anormal arrive. Avant de paniquer, tu demandes: la mesure a-t-elle changé? L’échantillon est-il comparable? Un événement atelier explique-t-il le saut? Parfois tu notes un point hors série et tu enquêtes. Parfois tu corriges juste une tare oubliée. Des limites simples t’aident: une zone où le procédé te paraît habituel.","Si plusieurs points sortent, tu réagis. Tu évites de réagir à chaque micro-bruit. Le but est la stabilité utile, pas l’agitation. Pour une future ligne de séchage, tu suivras peut-être humidité moyenne par fournée. Aujourd’hui, choisis un seul indicateur baobab et suis-le dix jours ouvrés d’affilée sur une page.","Tu dates chaque page de carte et tu restes calme face à un point inhabituel: d’abord vérifier mesure et tare, ensuite ouvrir une fiche d’action. Tu reformules l’idée en une consigne courte affichée près du poste utile, près de carnet rouge."],"prof":"Le suivi dans le temps transforme des notes isolées en récit de procédé. Tu apprends le rythme normal de ton atelier. Sans ce rythme, chaque écart paraît une crise. Avec ce rythme, tu distingués bruit et vrai changement. Patience et régularité valent mieux qu’un bel outil abandonné après trois jours. Garde une trace datée. Garde une trace datée. Garde une trace datée.","tip":"Choisis un seul indicateur pour les dix prochains jours et note-le à heure fixe.","simple":"Comme suivre la cuisson du tô: tu regardes la casserole plusieurs fois, tu connais l’aspect habituel, tu réagis quand la texture sort de ton habitude, pas à chaque petite bulle. Le temps t’apprend le normal. Comme suivre la hauteur de l’eau du canari chaque matin: une seule mesure ne dit pas la tendance; la série sur la semaine oui.","plus":"Les cartes de contrôle (Shewhart) placent une moyenne centrale et des limites calculées à partir de la variabilité interne du procédé. Carte X-bar et R: on prélève des sous-groupes (par exemple 3 à 5 sachets), on trace la moyenne du sous-groupe et son étendue. Exemple (nombres inventés pour l’exercice): sous-groupes de 4, moyenne globale 500 g, étendue moyenne 3 g; on construit des limites et on surveille. Règles de réaction courantes: un point hors limites, plusieurs points d’un même côté de la moyenne, tendance claire. On distingue causes communes (bruit habituel) et causes spéciales (événement assignable). Le suivi manuel sur papier est déjà puissant si tu es régulière. Indicateur choisi: lié à une décision (ajuster, enquêter, laisser). Une revue de dix minutes chaque semaine sur le graphique évite d’empiler des points morts sans lecture. Tu figes la taille de sous-groupe comme une recette versionnée. Dix minutes par semaine pour relire. Une règle déclenchée ouvre une fiche date-hypothèse-action-vérification.","expert":"Cartes de suivi: moyenne et étendue (Xbarre-R) en esprit, même sans logiciel. Règles de sortie simples: point hors limite, série d’un même côté, tendance monotone. Exemple (nombres inventés pour l’exercice): dix lots, moyennes de masse utile; un point à 470 g alors que la bande usuelle est 490–510. Pour Baobab Bliss: choisis un indicateur mesurable chaque lot (masse, humidité tactile, score jury). La constance du suivi bat la sophistication. Tu dates et tu notes l’action corrective à côté du point anormal. Le carnet devient un tableau de bord simple, pas un tiroir mort. Le suivi dans le temps détecte dérives avant la plainte cliente. Les règles de Shewhart (points hors limites, dérives) se traduisent en atelier par des seuils simples choisis sur ton historique. Tu choisis un indicateur que tu peux mesurer sans te décourager. Exemple (nombres inventés pour l’exercice): masse nette moyenne par lot sur 12 lots; un point à 470 g hors bande usuelle 490–510 déclenche vérification balance + recalibrage geste. Pour Baobab Bliss, le carnet daté + une action écrite à côté du point anormal vaut un logiciel absent. La constance du suivi crée la confiance. Tu revois la bande usuelle tous les trimestres: si le process s’améliore, la bande peut se resserrer. Une bande figée trop large endort la vigilance. Baobab Bliss fait de cette revue un rituel court. Un point hors bande déclenche vérification instrument puis geste, dans cet ordre.","quiz":[{"q":"Que regarder en plus du dernier point?","choices":["La tendance sur plusieurs jours","Seulement la rumeur du marché","Seulement la couleur du stylo"],"correct":0,"why_ok":"La tendance raconte le procédé.","why_ko":"Rumeur et stylo ne pilotent pas."},{"q":"Avant de réagir à un jour anormal?","choices":["Vérifier mesure, échantillon et événement atelier","Effacer le point","Changer tous les réglages tout de suite"],"correct":0,"why_ok":"Enquêter évite l’agitation inutile.","why_ko":"Ni panique globale ni effacement."},{"q":"Que séparent les cartes de contrôle?","choices":["Publicité et prix","Couleurs préférées","Bruit habituel et cause spéciale probable"],"correct":2,"why_ok":"Elles aident à voir les signaux hors bruit.","why_ko":"Pas un outil marketing direct."},{"q":"Combien d’indicateurs suivre d’abord?","choices":["Vingt d’un coup abandonnés","Un seul tenu régulièrement","Aucun"],"correct":1,"why_ok":"La régularité bat la liste interminable.","why_ko":"Trop ou rien échoue."}],"activity":{"type":"order","prompt":"Carte simple","steps":["Choisir un indicateur","Noter chaque lot","Tracer moyenne et limites","Réagir aux sorties avec recherche de cause"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Choisir un indicateur, Noter chaque lot, Tracer moyenne et limites, Réagir aux sorties avec recherche de cause"},"exercise":{"prompt":"Choisis un indicateur Baobab Bliss. Suis-le 10 jours. Trace les points. Entoure un jour anormal s’il existe et écris l’enquête.","hint1":"Heure fixe.","hint2":"Une page graphique suffit.","solution":"Exemple: masse moyenne 5 sachets; jour 7 bas; cause: tare oubliée; correction écrite."}}],"m10":[{"title":"Disposer l’atelier en flux avant","body":["L’atelier bien disposé fait circuler le produit du plus brut vers le plus avancé sans retour vers le sale. Chez Baobab Bliss, tu imagines les gousses entrer d’un côté et les sachets fermés sortir de l’autre. Entre les deux se trouvent la casse, la séparation, le tamis, le contrôle et l’emballage.","Tu refuses de croiser la poubelle de coques et la table des sachets prêts. Tu dessines le plan réel de ta pièce, pas un plan de magazine. Tu traces des flèches pour le produit et d’autres pour les déchets. Tu marques l’endroit où tu te laves les mains.","Si deux gestes se marchent dessus, tu notes le conflit sur la page. Un conflit non écrit revient chaque semaine comme une pierre dans la chaussure. Même dans une petite pièce, tu peux séparer par couleurs de bassines, par horaires, ou par un simple repère au sol.","L’essentiel est qu’une aide comprenne le chemin en une minute. Moins de pas inutiles, moins de fatigue, moins d’occasions de poser un ustensile au mauvais endroit. Pour une future mangue séchée, tu ajouteras une zone de chaleur clairement à part.","Aujourd’hui, dessine seulement le flux baobab réel et entoure l’endroit où tu fais le plus de détours. Demain tu déplaces un seul meuble, pas toute la maison."],"prof":"Le plan au sol est un outil d’ingénieure autant que la balance. Chaque pas inutile fatigue et mélange les zones. Dessine d’abord ce qui existe vraiment. Améliore ensuite une seule circulation. Un atelier lisible protège la propreté mieux qu’un long discours. Fais relire le dessin par une personne qui t’aide parfois: elle verra des croisements que tu ne vois plus.","tip":"Colle le plan daté près de l’entrée d’atelier pendant un mois.","simple":"Comme ranger une cuisine pour le tô: légumes d’un côté, marmite au centre, assiettes propres loin des épluchures. Personne ne pose la louche dans la bassine d’épluchures. L’atelier suit la même idée de chemin clair et respecté. Garde les épluchures loin des assiettes jusqu’à la fin.","plus":"Le principe de marche en avant limite les contaminations croisées. On sépare zones sales et zones propres, flux des personnes et flux du produit, déchets et emballages finis. Exemple (nombres inventés pour l’exercice): 42 pas entre tamis et table d’emballage aujourd’hui; après déplacement de la table, 18 pas. Moins de fatigue, moins d’erreurs de pose. Outils: plan coté, tracé des déplacements, liste des croisements critiques. Critères: distance, croisements, accès au lavage des mains, éclairage du contrôle, stockage des sachets fermés au sec. Tu revisites le plan à chaque ajout de matériel, avec une nouvelle date. Une matrice de proximité note ce qui doit être proche et ce qui doit rester loin: emballage fini loin du cassage des gousses, balance près du conditionnement. Tu mesures aussi le temps de traversée d’une poignée de pulpe jusqu’au sachet fermé: ce temps révèle les files d’attente cachées. Tu ranges les outils de nettoyage hors du flux produit et tu marques au sol le chemin des déchets. Une aide doit pouvoir expliquer le parcours en trente secondes sans hésiter. Si elle hésite, le plan est encore trop abstrait pour la journée de production.","expert":"Implantation: flux avant (produit avance, pas de retour vers le sale), séparation zones, allées, hauteur des plans de travail. 5S / rangement visuel. Principes d’ergonomie ISO 11228 (manutention) en esprit: charges, fréquences, postures. Exemple (nombres inventés pour l’exercice): tu mesures 8 m de parcours inutiles par lot; tu rapproche le tamis du bac propre. Pour Baobab Bliss: plan au mur lisible en trente secondes. Toute aide nouvelle le lit avant de toucher un fruit. Tu colles les sens du flux (entrée gousses → sortie sachets) avec des flèches claires, sans jargon. Le flux avant réduit les croisements sale/propre, principe central des guides d’hygiène (esprit PRP du Règl. (CE) 852/2004). Tu dessines zones et sens de circulation. Les allées libres diminuent chutes et confusions de bacs. L’ergonomie (ISO 11228 en esprit) regarde charges, fréquences, hauteurs. Un plan illisible n’existe pas: tu testes avec une aide nouvelle. Pour Baobab Bliss, coller le plan à l’entrée et le réviser après chaque changement d’implantation. Tu mesures parfois le parcours (pas, mètres) pour rendre visible le gaspillage de déplacement. Le rangement visuel (places marquées) raccourcit les recherches d’outils. Tu validates le plan en marchant le parcours d’un lot réel chronomètre en poche. Les détours apparaissent. Chaque détour évité est du temps et de la sérénité gagnés pour la qualité. Le plan collé à l’entrée se reteste avec chaque nouvelle aide en trente secondes.","quiz":[{"q":"Que cherche le flux avant?","choices":["Mélanger déchets et sachets","Augmenter le bruit","Éviter les retours du sale vers le propre"],"correct":2,"why_ok":"Le flux avant protège la propreté.","why_ko":"Mélanger sale et propre nuit."},{"q":"Par quoi commencer?","choices":["Dix meubles achetés au hasard","Effacer les zones","Le plan réel de la pièce"],"correct":2,"why_ok":"Le réel guide l’amélioration.","why_ko":"Acheter sans plan n’aide pas."},{"q":"Pourquoi compter les pas?","choices":["Pour voir détours et fatigue","Pour remplacer le lavage des mains","Pour fixer le prix"],"correct":0,"why_ok":"Le tracé rend les détours visibles.","why_ko":"Ce n’est ni hygiène ni tarif."},{"q":"Que faire d’un croisement critique?","choices":["L’ignorer","Monter le volume de la radio","L’écrire puis corriger"],"correct":2,"why_ok":"Un conflit écrit devient traitable.","why_ko":"Ignorer échoue."}],"activity":{"type":"label","prompt":"Repère les zones","labels":["Zone 1","Zone 2","Zone 3","Zone 4"],"correct":{"0":"Entrée","1":"Travail propre","2":"Emballage","3":"Sortie"},"hint1":"De gauche à droite.","hint2":"Lis les mots déjà dessinés.","solution":"Entrée, travail propre, emballage, sortie.","svg":"<svg viewBox=\"0 0 300 130\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<rect x=\"10\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/><text x=\"37\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Récept.</text>\n<path d=\"M65 60h20\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"85\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/><text x=\"112\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Process</text>\n<path d=\"M140 60h20\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"160\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#fff8e8\" stroke=\"#0071e3\"/><text x=\"187\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Critique</text>\n<path d=\"M215 60h20\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<rect x=\"235\" y=\"40\" width=\"55\" height=\"40\" rx=\"6\" fill=\"#e8ffe8\" stroke=\"#0071e3\"/><text x=\"262\" y=\"65\" text-anchor=\"middle\" font-size=\"9\">Expéd.</text>\n</svg>"},"exercise":{"prompt":"Dessine ton atelier baobab avec flèches produit et déchets. Entoure un croisement et propose un déplacement.","hint1":"Une page.","hint2":"Fais relire.","solution":"Exemple: table d’emballage loin des coques; sortie sachets sans retour."}},{"title":"Planifier la production","body":["Planifier, c’est décider quoi faire quel jour avant que le désordre ne décide à ta place. Chez Baobab Bliss, tu regardes les commandes ou les ventes prévues, le stock de sachets vides, la pulpe disponible, et ton énergie réelle. Tu écris un petit plan de semaine: jours de cassage, jours de tamis et contrôle, jours d’emballage, jour de marché.","Tu respectes aussi les temps de pause et de nettoyage. Un plan qui oublie le lavage est un plan qui ment. Tu bloques des créneaux courts et tenables plutôt qu’une journée héroïque impossible. Le takt, en langage simple, c’est le rythme à tenir pour livrer à temps.","Si tu dois préparer trente sachets avant samedi et que tu as six heures utiles, tu vois le rythme moyen. Tu ajustes le plan si un poste est trop lent. Pour une future mangue, tu planifieras aussi le temps de séchage qui n’attend pas.","Aujourd’hui, écris ta semaine baobab en cases d’une demi-journée et entoure le jour le plus chargé. Tu partages le plan avec toute aide la veille, pour éviter les surprises du matin."],"prof":"Un plan de production artisanal tient sur une page. Il dit la vérité sur le temps de nettoyage et sur ta fatigue. Mieux vaut sous-promettre et tenir que surcharger et bâcler la propreté. Relis le plan chaque dimanche soir. Barre ce qui est fait. Décale ce qui doit l’être sans culpabilité inutile, mais sans te mentir. Barre ce qui est fait sans dramatiser les reports réalistes.","tip":"Bloque explicitement une case nettoyage dans chaque demi-journée de production.","simple":"Comme préparer un grand repas de fête: tu épluches la veille, tu cuis le matin, tu dresses juste avant. Tu ne commences pas la sauce pendant que les invités poussent déjà la porte. L’ordre dans le temps sauve la qualité.","plus":"La planification relie demande, capacité et stocks. On estime la charge de travail par opération (casse, tamis, emballage) en minutes. Exemple (nombres inventés pour l’exercice): 40 gousses à 3 minutes de cassage effectif, soit 120 minutes; tamis 60 minutes; emballage 90 minutes; nettoyage 45 minutes. Total 315 minutes. Si tu n’as que 240 minutes utiles, tu réduis le lot ou tu étales sur deux jours. Outils simples: tableau hebdomadaire, liste de priorités, file d’attente des lots. Indicateurs: retards, heures de nettoyage réellement faites, ruptures de sachets vides. Tu distinguishes charge ferme (commandes promises) et charge souple (stock d’avance). La ferme passe d’abord. Un goulot (poste le plus lent) dicte le rythme réel: accélérer ailleurs ne finit pas plus de sachets. Tu bloques aussi un créneau nettoyage non négociable dans la grille du jour: sans lui, le plan ment. Note la taille de lot choisie et pourquoi: trop petit multiplie les démarrages; trop grand allonge l’attente et charge le stock. Une page hebdomadaire avec trois colonnes (prévu, fait, écart) suffit pour apprendre ta vraie capacité.","expert":"Planification: takt (rythme de la demande), goulot, taille de lot, file d’attente. Ordonnancement simple: dates promises, FIFO sur les commandes, marge de sécurité. Exemple (nombres inventés pour l’exercice): demande 40 sachets/semaine, capacité tamis 15/heure; tu dimensionnes les plages. Pour Baobab Bliss: le mercredi tu regardes le plan et tu ajustes si le tamis est le goulot. Tu ne rajoutes pas de fruits en amont sans raison. Un plan raté un jour se réécrit le lendemain: il vit, ce n’est pas une punition. Planifier, c’est aligner capacité et promesse. Le goulot détermine le débit; surcharger l’amont ne fait qu’allonger les files et la qualité en pâtit. Tu listes les opérations chronophages (tamis, soudure, étiquetage). Exemple (nombres inventés pour l’exercice): soudure 40 sachets/heure, demande 120/semaine → plages dédiées. Pour Baobab Bliss, une revue hebdomadaire courte ajuste le plan. Tu laisses une marge pour les imprévus (visite, panne mineure). L’ordonnancement honnête (dates réalistes) protège ta réputation autant que ton stock. Un tableau de charge hebdomadaire (jours × opérations) rend les conflits visibles. Si deux opérations goulot tombent le même matin, tu décale. La planification est un geste de maîtrise, pas de paperasse. Lien: logique de flux et capacité (esprit lean / organisation de production), sans outil propriétaire. Organisation de production: logique de goulot et capacité. La revue du mercredi déplace le goulot avant d’ajouter des fruits en amont. Organisation: logique de goulot; lien Règl. (CE) 852/2004 sur la maîtrise de l’environnement de travail.","quiz":[{"q":"Que doit inclure un plan honnête?","choices":["Aucune durée","Seulement les gestes nobles","Le nettoyage et les pauses"],"correct":2,"why_ok":"Sans nettoyage le plan ment.","why_ko":"Les gestes seuls ne suffisent pas."},{"q":"Qu’est-ce qu’un goulot?","choices":["La radio","Le plus bel outil","Le poste le plus lent qui limite le flux"],"correct":2,"why_ok":"Le goulot dicte le rythme.","why_ko":"Ce n’est ni esthétique ni divertissement."},{"q":"Si la charge dépasse le temps utile?","choices":["Réduire le lot ou étaler","Bâcler le lavage","Inventer des heures"],"correct":0,"why_ok":"Tu ajustes la charge.","why_ko":"Ni bâcle ni fiction."},{"q":"À quoi sert le rythme moyen de livraison?","choices":["À voir si la capacité suffit avant samedi","À remplacer la balance","À choisir la couleur du sachet"],"correct":0,"why_ok":"Il relie demande et temps.","why_ko":"Pas un outil déco ou de pesée."}],"activity":{"type":"order","prompt":"Plan de semaine","steps":["Lister les lots voulus","Estimer le temps par étape","Repérer le goulot","Laisser une marge"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Lister les lots voulus, Estimer le temps par étape, Repérer le goulot, Laisser une marge"},"exercise":{"prompt":"Fais le plan de ta prochaine semaine Baobab Bliss en demi-journées avec une case nettoyage.","hint1":"Reste réaliste.","hint2":"Entoure le goulot probable.","solution":"Exemple: mar cassage, mer tamis, jeu emballage, ven marché; nettoyage chaque fin de demi-journée."}},{"title":"Stocks et premier entré premier sorti","body":["Les stocks sont de la poudre, des sachets vides, des étiquettes, parfois des fruits. Chez Baobab Bliss, chaque bac porte une date et un numéro de lot. Tu sors d’abord ce qui est entré en premier. C’est la règle du premier entré, premier sorti.","Elle évite les vieux fonds oubliés au fond du placard. Pour ce qui a une date limite plus courte, tu sors d’abord ce qui expire le plus tôt, même si c’est arrivé après. On parle alors de premier expiré, premier sorti.","Sur la poudre bien sèche, la discipline de lot reste essentielle pour retrouver un souci éventuel. Tu comptes régulièrement. Un stock imaginaire fait mentir le plan de production. Tu notes les seuils: en dessous de tant de sachets vides, tu rachètes.","Au-dessus d’un certain volume de poudre ouverte trop longtemps, tu traites le sujet tout de suite. Pour une mangue séchée future, les dates seront souvent plus sensibles. Aujourd’hui, étiquette trois bacs baobab avec lot et date, et pratique une sortie dans le bon ordre sous les yeux d’une aide.","Tu dates chaque bac ouvert et tu limites le temps d’ouverture sur la fiche. Une aide lit la date à voix haute avant de servir. Cette discipline évite les vieux fonds oubliés. Tu dates la fiche de stock et tu pratiques une sortie dans le bon ordre sous les yeux d’une aide."],"prof":"Le stock est un silence qui coûte. Trop peu, tu t’arrêtes. Trop, tu perds de la place et de la fraîcheur d’organisation. La règle d’ordre de sortie est une hygiène de mémoire. Forme toute aide à lire la date avant de plonger la main. Une étiquette illisible égale un stock aveugle. Fais-toi observer une sortie de bac cette semaine. Une étiquette de bac lisible bat une mémoire orale du stock.","tip":"Avant chaque emballage, lis à voix haute le lot que tu sors.","simple":"Comme le mil dans les jarres: tu finis la jarre ouverte avant d’en ouvrir une nouvelle, sauf si la nouvelle points à surveiller de se gâter plus vite. L’ordre de sortie protège ce que tu as déjà préparé. Cette comparaison de maison t’aide à retenir le geste atelier.","plus":"FIFO (premier entré premier sorti) et FEFO (premier expiré premier sorti) organisent les flux de stock. On combine inventaire périodique et inventaire tournant sur les articles critiques. Exemple (nombres inventés pour l’exercice): 120 sachets vides en stock, consommation 40 par semaine, délai de réassort 2 semaines: seuil de commande vers 80. Indicateurs: taux de rupture, âge moyen du stock, écart inventaire. Traçabilité: chaque sortie cite le lot. Un rappel produit devient possible. Classe A/B/C: tu surveilles plus souvent ce qui est cher ou critique pour la continuité (sachets, lots ouverts). Un bac sans date est traité comme un suspect: tu le contrôles avant de l’utiliser. Un bac témoin pour les sachets vides rend le réassort visible sans discours. Audit blanc mensuel: cinq articles tirés au sort, cohérence lot-fiche-emplacement. Bac sans date = suspect. Aide formée à lire les dates avant sortie; une erreur FEFO coûte un lot. Bac sans date = suspect.","expert":"Stocks: FIFO (premier entré, premier sorti) et FEFO (premier expiré, premier sorti) quand une date de durabilité compte. Rotation, inventaire tournant, précision des emplacements. Exemple (nombres inventés pour l’exercice): trois bacs datés J-10, J-3, J0; tu sers J-10 d’abord. Pour Baobab Bliss: dates visibles de loin. Sans date, la rotation devient une dispute; avec date, un geste simple. Tu sépares clairement « en cours », « libre », « bloqué ». Un inventaire court et régulier bat un inventaire annuel panique. FIFO/FEFO relient logistique et sécurité/loyauté du produit. Une date illisible casse la règle. Les inventaires tournants détectent écarts tôt. Tu sépares physiquement les zones libre / quarantaine / rebut. Exemple (nombres inventés pour l’exercice): bac J-10 servi avant J0; un bac sans date est bloqué jusqu’à clarification. Pour Baobab Bliss, marques à distance de lecture. La rotation n’est pas une préférence personnelle: c’est une procédure. Tu notes les écarts d’inventaire et tu cherches la cause (casse, oubli, double sortie). Les indicateurs simples (jours de stock, taux de rupture, écarts d’inventaire) se notent sans logiciel. Choisis-en un seul au début. La régularité de la mesure compte plus que la précision ostentatoire. FIFO/FEFO rejoignent la traçabilité loyale (esprit Règl. (CE) 178/2002) et la rotation des stocks. Traçabilité et rotation: esprit Règl. (CE) 178/2002. Un bac sans date lisible reste bloqué jusqu’à clarification, sans exception de confort. Traçabilité: esprit Règlement (CE) 178/2002.","quiz":[{"q":"Que signifie premier entré, premier sorti?","choices":["Sortir d’abord le lot arrivé le plus tôt","Sortir le plus joli","Ne jamais noter les dates"],"correct":0,"why_ok":"FIFO suit l’ordre d’entrée.","why_ko":"Ni esthétique ni oubli des dates."},{"q":"Quand préférer premier expiré, premier sorti?","choices":["Quand le bac est trop beau","Quand tu es pressée sans lire","Quand une date limite plus courte l’exige"],"correct":2,"why_ok":"FEFO suit la date d’échéance.","why_ko":"La précipitation n’est pas une règle."},{"q":"Pourquoi un seuil de réassort?","choices":["Pour commander avant la rupture","Pour remplacer le lavage","Pour décorer le carnet"],"correct":0,"why_ok":"Le seuil protège la continuité.","why_ko":"Pas un outil déco ou d’hygiène."},{"q":"Que faire d’un bac sans date?","choices":["Le vendre en premier toujours","S’en servir en silence","Le contrôler avant usage"],"correct":2,"why_ok":"Sans date, tu enquêtes.","why_ko":"Ni silence ni vente automatique."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"On sort d’abord le lot le plus ancien daté.","truth":true,"why":"Premier entré premier sorti."},{"t":"On peut laisser un vieux lot au fond sans date.","truth":false,"why":"Il faut dater et tourner."},{"t":"Un inventaire rapide aide à voir ce qui dort.","truth":true,"why":"Visibilité."}]},"exercise":{"prompt":"Étiquette trois bacs (poudre ou emballages) avec lot et date. Fais sortir dans le bon ordre et note le geste.","hint1":"Lis à voix haute.","hint2":"Une aide observe.","solution":"Exemple: P10 sorti avant P12; sachets vides réassort commandé au seuil 80."}},{"title":"Structure du coût de revient","body":["Le coût de revient dit ce que te coûte vraiment un sachet avant le profit. Chez Baobab Bliss, tu sépares ce qui varie avec la quantité (pulpe, sachets, étiquettes, une partie du transport) et ce qui reste même si tu produis peu (une partie du loyer d’espace, outils déjà achetés amortis dans le temps, certaines charges fixes).","Tu additionnes d’abord les coûts variables par sachet. Tu répartis ensuite une part raisonnable des coûts fixes sur le volume prévu du mois. Le total guide ton prix. Un prix calé seulement sur la voisine ignore ta réalité. Tu marques clairement les exemples chiffrés comme exemples.","Tu n’inventes pas un bénéfice. Tu peux découvrir que tu vends trop juste. Mieux vaut le voir sur une feuille que dans une mauvaise surprise de fin de mois. Pour une mangue séchée, l’énergie de séchage entrera dans les variables.","Aujourd’hui, bâtis la feuille baobab: variables par sachet, fixes du mois, volume prévu, coût complet estimé. Tu marques chaque chiffre d’exercice comme exemple. Tu entoures le seuil sur la fiche après chaque recalcul. Tu dates la fiche de coûts et tu entoures le seuil de rentabilité.","Une aide doit pouvoir dire le coût complet d’un sachet en une phrase. Tu dates la fiche de revient et tu entoures le seuil avant de parler prix."],"prof":"Le coût de revient n’est pas une punition: c’est une lampe. Elle montre où part l’argent. Sépare variables et fixes avant de parler de prix. Relance le calcul quand un poste change vraiment. Une feuille mensuelle simple bat un souvenir flou. Garde les exemples inventés bien étiquetés pour ne pas te tromper toi-même. Une fiche de coûts datée bat une estimation dite «dans la tête».","tip":"Écris « exemple » devant chaque chiffre d’exercice non issu de tes vrais tickets.","simple":"Comme calculer le coût d’un plat pour une fête: tu comptes les ingrédients qui changent avec le nombre d’invités, puis tu partages le prix du combustible et de la location de marmites sur le nombre de plats. Sans ce partage, tu te crois riche à tort.","plus":"Coût variable unitaire plus coût fixe réparti égale coût complet estimé. Seuil de rentabilité: charges fixes divisées par la marge sur coût variable unitaire. Exemple (nombres inventés pour l’exercice): variable 180 FCFA par sachet, prix 400 FCFA, marge 220 FCFA; fixes mensuelles 44 000 FCFA; seuil 200 sachets. En dessous, tu ne couvres pas les fixes. Marges: sur variable, sur coût complet. Tableau: poste, montant, variable ou fixe, source du chiffre. Coûts cachés: casse, reprises, transports non notés, temps de nettoyage si tu te salarises un jour. Ne mélange pas trésorerie (cash du mois) et coût de revient (ressources consommées). La feuille de coût se met à jour dès qu’un poste change vraiment. Variables et fixes en deux colonnes avant le seuil. Chiffres d’exercice marqués comme exemples inventés. Si un poste variable bouge d’≈10 %, tu refais le calcul le jour même. Tu transformes le coût complet du jour en une décision de prix datée sur le prochain lot Baobab Bliss, puis tu notes l’écart réel.","expert":"Coûts: coût variable vs coût complet; seuil de rentabilité = charges fixes / (prix − coût variable unitaire). Coût de revient atelier = matières + emballage + énergie estimée + main-d’œuvre + part des frais. Exemple (nombres inventés pour l’exercice): variable 300, complet environ 327, prix 400, seuil 200 unités si fixes 20 000. Pour Baobab Bliss: grille datée, cases vides assumées. Tu n’inventes pas un chiffre pour faire joli. Ce mois-ci matières et emballage; le mois prochain, une estimation de ton temps. La date en tête de fiche dit de quelle époque parlent les nombres. Le coût de revient éclaire le prix et les arbitrages (emballage plus barrière vs coût). Charges fixes et variables se comportent différemment quand le volume change; d’où le seuil de rentabilité. Tu documents les hypothèses (FCFA/kWh estimé, rendement). Exemple (nombres inventés pour l’exercice): variable 300, fixe allouées 27, prix 400. Pour Baobab Bliss, cases vides visibles > fiction. Une mise à jour trimestrielle datée garde le dossier vivant. Tu sépares coût de décision (pertinent) et coût comptable complet si tu n’as pas toutes les données. Tu relis le coût au prix public sans précipitation: une marge trop fine casse au premier imprévu. Exemple (nombres inventés pour l’exercice): marge unitaire 73 FCFA avant imprévus. Tu notes ce que tu ignores encore. Le seuil de rentabilité est un outil classique de contrôle de gestion alimentaire TPE. Outil: seuil de rentabilité de contrôle de gestion TPE. La grille de coûts datée laisse les cases inconnues visibles plutôt que peuplées de fiction. Outil: seuil de rentabilité; cohérence avec une lecture loyale des coûts avant prix (esprit Règl. (UE) 1169/2011 sur les informations loyales).","quiz":[{"q":"Que sont surtout les coûts variables?","choices":["Ceux qui bougent avec la quantité produite","Ceux qui n’existent jamais","Ceux qu’on cache toujours"],"correct":0,"why_ok":"Variables liés au volume.","why_ko":"Ils existent et se notent."},{"q":"Que montre le seuil de rentabilité?","choices":["La couleur du logo","Le volume pour couvrir les fixes","La recette du tô"],"correct":1,"why_ok":"C’est le volume de couverture.","why_ko":"Ni logo ni cuisine."},{"q":"Pourquoi séparer fixes et variables?","choices":["Pour comprendre prix et volume","Pour remplacer les ventes","Pour embrouiller le carnet"],"correct":0,"why_ok":"La séparation éclaire les décisions.","why_ko":"Pas un outil de confusion."},{"q":"Que faire des chiffres d’exercice?","choices":["Les effacer","Les présenter comme ta comptabilité officielle","Les marquer comme exemples"],"correct":2,"why_ok":"La transparence évite le mensonge à soi.","why_ko":"Ni faux officiel ni oubli."}],"activity":{"type":"calc","prompt":"Coût (TES chiffres)","fields":[{"id":"mat","label":"Matière (FCFA)"},{"id":"emb","label":"Emballage (FCFA)"},{"id":"mo","label":"Main d’œuvre (FCFA)"},{"id":"autres","label":"Autres (FCFA)"}],"note":"Additionne seulement les champs connus. Laisse vide le reste.","tip":"Pas de prix inventés."},"exercise":{"prompt":"Construis ta feuille: 5 postes variables, 3 fixes, volume prévu, coût complet exemple.","hint1":"Marque Exemple.","hint2":"Calcule aussi un seuil.","solution":"Exemple: variable 180, fixes 44000, volume 300, coût complet environ327, seuil 200 à prix 400."}},{"title":"Entretenir le matériel","body":["Le matériel bien entretenu tombe moins en panne le jour du marché. Chez Baobab Bliss, tu listes ce que tu utilises vraiment: bassines, tamis, balance, scelleuse ou pince, couteaux, tables. Pour chaque objet, tu notes un geste simple: laver, sécher, vérifier, ranger.","La maintenance commence par ce geste régulier, pas par une grande théorie. Tu distinguishes l’entretien de routine et la réparation quand c’est déjà cassé. La routine est préventive: tu huiles ce qui doit l’être selon le fabricant, tu remplaces une pièce usée avant la rupture, tu contrôles la tare de la balance.","La réparation d’urgence reste possible, mais elle coûte souvent plus cher en temps. Tu tiens une petite fiche par outil critique: dernière vérification, prochain contrôle, remarque. Si tu empruntes un outil, tu le rends propre. Si une aide utilise le tamis, elle connaît le geste de fin de journée.","Pour un futur séchoir, le calendrier d’entretien sera plus strict. Aujourd’hui, crée trois fiches baobab (balance, tamis, table) et coche un premier contrôle réel. Tu dates la fiche d’entretien du jour sur le carnet outils. Tu classes les outils en critique, utile ou confort.","Balance et tamis de production sont critiques. Toile de rechange et tournevis dans une boîte étiquetée. Après entretien: signature, date, prochain contrôle. Baobab Bliss avance quand la machine ne surprend pas le jour du marché."],"prof":"La maintenance préventive est un cadeau à ta future toi. Dix minutes après la production évitent une heure de panique avant le marché. Écris les gestes, ne les garde pas seulement en tête. Un outil critique sans fiche est un points à surveiller pour le plan de la semaine. Reste calme: mieux vaut un contrôle simple tenu qu’un classeur trop beau abandonné.","tip":"Après chaque production, coche le nettoyage des trois outils critiques avant d’éteindre la lumière.","simple":"Comme entretenir une marmite préférée: tu la laves, tu la sèches, tu regardes le fond avant qu’il ne perce. Tu n’attends pas le jour de la grande fête pour découvrir le trou. L’atelier mérite la même vigilance douce. Cette image de maison fixe l’idée dans ta tête.","plus":"Maintenance préventive versus corrective: la première suit un calendrier ou un compteur d’usage; la seconde réagit à la panne. Exemple (nombres inventés pour l’exercice): balance vérifiée chaque lundi avec masse de 500 g; écart toléré 2 g; au-delà, retrait jusqu’à réglage. Gamme opératoire courte: nettoyer, inspecter, resserrer, lubrifier si besoin, enregistrer. Pièces de rechange critiques en petit stock (joints, tamis de rechange). Indicateur: nombre de pannes le jour J ve
