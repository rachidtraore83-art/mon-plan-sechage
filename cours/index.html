n de l’école quand on déménage: l’ancien trajet ne suffit plus.","hint":"Revoyez après tout changement: nouveau film, nouvel aide, nouveau local."},{"keys":["code","lot","format"],"q":"Quel format de code lot suffit au début ?","a":"Au début, un format simple suffit: date plus une lettre de série, par exemple. Le code doit être lisible sur le sachet et identique dans le carnet. Évite les codes inventés à la volée ou illisibles après frottement.","mod":"m6","li":5,"example":"Tu écris sur chaque sachet du mardi un code du type date du jour suivi de A, tu colles le même format près de la pince, et tu le recopies sur la fiche lot.","next":"Imprime ou écris le format du code lot et colle-le près de la pince à souder.","alt":"Comme numéroter les cahiers des enfants avec la date et une lettre: simple, stable, compris par tous.","hint":"Le code doit rester lisible, stable, et jumeau entre le carnet et le sachet."},{"keys":["feuille","route","certification"],"q":"Quelle feuille de route raisonnable vers une certification ?","a":"Une feuille de route raisonnable étale les efforts: d’abord un plan artisanal stable, puis mesures de labo et traçabilité robuste, puis étude de certification seulement si un client finance. Promettre tout pour demain matin casse le projet.","mod":"m6","li":0,"example":"Tu notes, par exemple, année 1 liste de contrôle et lots, année 2 devis labo et norme lue, année 3 et plus certification si la demande est réelle.","next":"Remplis une page en trois colonnes, par exemple: déjà fait, ce mois-ci, plus tard, sans promesse irréaliste.","alt":"Comme construire une maison pièce par pièce selon le budget: le toit vient quand les murs tiennent.","hint":"Avance par maturité progressive: la lenteur intelligente gagne sur la précipitation."},{"keys":["corps","étrangers","poudre"],"q":"Pourquoi les corps étrangers sont-ils souvent prioritaires en poudre ?","a":"En poudre artisanale, les corps étrangers se voient et se sentent vite: éclat de coque, cheveu, fibre. Ils dominent souvent avec la maîtrise de l’humidité. Tu les traites par inspection, plateau clair et tamis en bon état.","mod":"m6","li":0,"example":"Après le tamis, tu étales une portion sur un plateau blanc: un éclat de coque apparaît tout de suite et tu retires le plateau concerné.","next":"Ajoute sur ta feuille des points sensibles une ligne « corps étrangers au tamis » avec le geste plateau blanc.","alt":"Comme enlever les cailloux du riz avant de cuire: ce qui est dur et visible sort avant le service.","hint":"Les physiques comptent beaucoup en poudre, pas seulement les microbes."},{"keys":["équipe","seule"],"q":"Peut-on suivre la logique des douze étapes en travaillant seule ?","a":"Oui, tu peux suivre la logique des douze étapes en travaillant seule. Tu joues plusieurs rôles sur le papier et tu notes tes décisions. Ce qui compte, c’est de ne pas sauter l’étape du flux réel confirmé sur place.","mod":"m6","li":2,"example":"Seule le mercredi, tu décris le produit, tu dessines le flux, tu le marches, tu listes, par exemple, trois points sensibles: l’équipe sur le papier, c’est toi qui dates.","next":"Coche sur la liste des douze étapes ce que tu as déjà fait seule, sans attendre une grande équipe.","alt":"Comme tenir le cahier de comptes du foyer seule: tu es à la fois qui décide et qui écrit, tant que c’est clair.","hint":"Même seule, tu restes « l’équipe » si tu documentes."},{"keys":["écart","soir"],"q":"Que noter le soir s’il n’y a eu aucun écart ?","a":"S’il n’y a eu aucun écart, tu notes quand même « aucun » le soir. Le silence non écrit n’aide pas la revue mensuelle. Tu clôtures le lot, tu ranges le stock, tu sors les déchets, tu laisses le carnet à jour.","mod":"m6","li":4,"example":"En fin de journée sans incident, tu écris la date, le code lot, « aucun écart », ton initiale: la fiche existe pour la revue.","next":"Ce soir de production, ne pars pas sans une ligne d’écart, même « aucun ».","alt":"Comme dire « rien à signaler » à la fin d’une garde: l’absence d’incident est une information, pas un vide.","hint":"Les écarts non écrits n’existent pas pour l’amélioration: note-les."},{"keys":["iso","inspirer"],"q":"Peut-on s’inspirer d’une norme de management sans être certifiée ?","a":"Oui, tu peux t’inspirer d’une norme de management sans être certifiée. Tu prends un chapitre, tu en tires, par exemple, trois gestes atelier possibles, tu avances. La certification formelle attend une demande client et un budget clair.","mod":"m6","li":0,"example":"Tu lis l’idée de revue et tu instaurés une relecture mensuelle des écarts, sans payer un organisme certificateur.","next":"Lis un seul chapitre utile ce mois-ci et écris, par exemple, trois gestes concrets pour ton atelier.","alt":"Comme emprunter des idées de rangement chez une voisine organisée sans peindre ta maison exactement comme la sienne.","hint":"Garde l’esprit de maîtrise d’abord; le certificat viendra plus tard si tu en as besoin."},{"keys":["limites","mesurables"],"q":"Que faire si une limite n’est pas mesurable avec tes moyens ?","a":"Si une limite n’est pas mesurable avec tes moyens, tu changes la limite ou tu changes le point. Une limite vague n’arrête rien. Tu choisis une observation claire que toi et une aide jugez pareil.","mod":"m6","li":1,"example":"Au lieu d’écrire « humidité correcte » sans outil, tu écris « soudure continue sans canal, traction tenue » que tu peux juger à chaque sachet.","next":"Relis tes limites actuelles et remplace toute phrase floue par une observation tenable.","alt":"Comme remplacer « cuire assez » par « le grain s’écrase entre les doigts »: tu donnes un critère partagé.","hint":"Si tu ne peux pas mesurer, change la limite ou le point."},{"keys":["colonnes","local","export"],"q":"Comment organiser les règles sans se noyer ?","a":"Pour organiser les règles sans te noyer, tu fais deux colonnes: obligatoire pour ton canal actuel, et plus tard si tu exportes. Tu mets une date de revue. Tu remplis d’abord la colonne de gauche.","mod":"m7","li":0,"example":"Colonne gauche: dénomination, poids, lot, hygiène, contact. Colonne droite: analyses contaminants, étiquetage cible, matériaux contact documentés. Revue notée dans trois mois.","next":"Remplis les deux colonnes avec au moins cinq lignes chacune, par exemple, et une date de revue.","alt":"Comme séparer les courses du jour et la liste du grand voyage: tu fais le marché ce soir, tu prépares la valise sans panique.","hint":"Deux colonnes sur une page calment plus qu’un long discours."},{"keys":["norme","baobab","catalogue"],"q":"Que confirme le catalogue de normalisation burkinabè sur le baobab ?","a":"Le catalogue de normalisation burkinabè confirme qu’une norme de spécifications existe pour la pulpe du fruit de baobab. Il donne le titre et la pagination. Les seuils exacts se lisent dans le texte acquis auprès de l’organisme, pas dans le catalogue seul.","mod":"m7","li":1,"example":"Tu budgets l’achat ou la consultation de la norme dans ton enveloppe qualité et tu surligneras ensuite ce qui touche la poudre emballée.","next":"Écris sur une carte le titre exact et range-la dans le carnet.","alt":"Comme connaître le titre d’un arrêté affiché à la mairie avant d’en photocopier chaque article au guichet.","hint":"Existence et titre d’abord; détail des seuils après lecture du texte."},{"keys":["paquet","hygiène","esprit"],"q":"Quel esprit retenir du paquet hygiène pour ton atelier ?","a":"De l’esprit du paquet hygiène, tu retiens trois mots: responsabilité, proportionnalité, preuve. Tu maîtrises, tu traces, tu peux montrer ce que tu fais. Ton carnet est la preuve; ton lave-mains est la proportionnalité vécue.","mod":"m7","li":2,"example":"Tu relies chaque case de la liste de contrôle du matin à l’idée « maîtrise et preuve »: si une case ne sert qu’à remplir le papier, tu la remplaces.","next":"Reformule en une phrase l’esprit du paquet hygiène pour ton atelier.","alt":"Les règles de la cantine scolaire: chacun responsable de sa propreté, on écrit les contrôles utiles, on ne noie pas une petite cantine sous les piles d’un grand hôpital.","hint":"Tu n’as pas à devenir juriste: trois mots suffisent."},{"keys":["contaminants","annexe","catégorie"],"q":"Que faire si le baobab n’est pas nommé dans une annexe de contaminants ?","a":"Si le baobab n’est pas nommé dans une annexe, tu cherches la catégorie la plus proche, tu notes l’hypothèse, et tu fais confirmer par l’importateur ou une autorité avant d’exporter. Tu n’inventes pas une ligne produit. Tu n’affiches pas un seuil inventé.","mod":"m7","li":3,"example":"Tu écris « hypothèse fruits séchés prêts consommateur, à confirmer pour baobab » sur une fiche datée, avec la question posée au partenaire.","next":"Simule une lecture d’annexe: catégorie candidate, teneurs d’après la leçon expert, mention « à confirmer ».","alt":"Comme chercher la bonne file à la banque quand ton cas n’a pas de guichet dédié: tu demandes confirmation avant de t’engager.","hint":"Prends une catégorie proche et confirme: tu n’inventes pas le chiffre."},{"keys":["étiquetage","loyal","cent"],"q":"Qu’exige la promesse « 100 pour cent pulpe » ?","a":"La promesse « 100 pour cent pulpe » exige qu’il n’y ait vraiment aucun ajout. C’est une allégation de composition: si tu ajoutes quoi que ce soit, tu changes la phrase. Tu la gardes seulement si elle est vraie à chaque lot.","mod":"m7","li":4,"example":"Tu vérifies avant conditionnement qu’aucune autre poudre n’est entrée dans le bac: la phrase sur le sachet reste honnête.","next":"Relis ton étiquette et coche si la promesse de composition est encore exacte aujourd’hui.","alt":"Comme dire « riz nature » seulement s’il n’y a vraiment pas d’huile ni d’épice ajoutées dans la marmite.","hint":"Demande-toi si la composition est vraiment vraie à chaque lot, pas seulement jolie sur le sachet."},{"keys":["allégation","santé"],"q":"Peut-on écrire qu’un sachet « soigne » sur l’étiquette ?","a":"Non, tu n’écris pas qu’un sachet « soigne » ou « guérit » sur l’étiquette. Ces mentions médicales n’ont pas leur place sur une denrée. Tu parles de goût, d’usage en cuisine, de composition. Tu laisses la médecine aux médecins.","mod":"m7","li":4,"example":"Une amie te suggère d’écrire « bon pour la forme »: tu rays la phrase et tu gardes « pulpe de baobab en poudre, usage boisson ou cuisine ».","next":"Fais lire ton étiquette à une voisine: si une phrase sonne miracle, tu la rayes.","alt":"Comme présenter un plat sans promettre qu’il remplace le dispensaire: tu restes dans la cuisine, pas dans le cabinet.","hint":"Si ça sonne miracle, ce n’est pas une mention loyale."},{"keys":["dossier","export","pièces"],"q":"Comment construire un dossier export ?","a":"Un dossier export se construit pièce par pièce dans le temps: identité produit, schéma de fabrication, analyses, traçabilité, emballage contact alimentaire, étiquette cible, contacts. Tu n’improvises pas la veille. Une liste de contrôle datée suffit pour démarrer la conversation.","mod":"m7","li":5,"example":"Tu crées une pochette avec, par exemple, huit cases: produit, process, labo, lots, emballage, étiquette, contacts, partenaire, et tu coches fait, en cours ou plus tard.","next":"Crée la pochette « export un jour » et glisse-y une liste de contrôle vide à remplir honnêtement.","alt":"Comme préparer un voyage longtemps à l’avance: tu fais la liste des affaires sans paniquer, tu coches quand tu peux.","hint":"Progression sur par exemple douze à dix-huit mois, pas un roman écrit la veille."},{"keys":["aflatoxines","fruits","séchés"],"q":"Que retenir des teneurs aflatoxines pour fruits séchés prêts consommateur (cadre européen) ?","a":"Dans le cadre européen étudié en leçon, les teneurs aflatoxines pour fruits séchés prêts à consommer sont plus basses que pour ceux encore à trier. Le baobab n’étant pas toujours nommé, tu traites ces chiffres comme une référence de catégorie à confirmer, sans les coller sur l’étiquette grand public.","mod":"m7","li":0,"example":"Tu copies sur une fiche d’étude les teneurs de la leçon expert pour fruits séchés consommateur, tu ajoutes « hypothèse pour baobab, à confirmer », et tu ranges la fiche dans la pochette export.","next":"Écris sur une demi-page la catégorie candidate et la mention « à confirmer pour baobab », sans autre chiffre inventé.","alt":"Comme retenir le prix affiché d’une classe scolaire voisine sans l’appliquer aveuglément à ton enfant: tu notes, tu confirmes au bon guichet.","hint":"Lignes distinctes selon le stade du produit; confirmation avant usage."},{"keys":["traçabilité","européenne"],"q":"Que demande l’esprit de la traçabilité dans le droit alimentaire européen ?","a":"L’esprit de la traçabilité dans le droit alimentaire européen demande de pouvoir identifier les fournisseurs et, le cas échéant, les entreprises auxquelles tu as fourni les produits. Tu mets l’information à disposition des autorités sur demande. En pratique: registres amont et aval tenus.","mod":"m7","li":2,"example":"Ton carnet lie le fournisseur des gousses, le code sur le sachet et la boutique livrée: tu peux répondre en quelques minutes si on te demande le fil d’un lot.","next":"Chronomètre le temps pour retrouver la fiche d’un sachet au hasard; si tu dépasses, par exemple, dix minutes, simplifie le classement.","alt":"Comme le registre d’entrée et de sortie d’une bibliothèque de quartier: qui a donné le livre, à qui il est parti.","hint":"Fais un pas en amont et un pas en aval, avec l’information disponible."},{"keys":["importateur","rôle"],"q":"Quel rôle joue souvent l’importateur ?","a":"L’importateur clarifie souvent les exigences du pays d’arrivée: analyses, étiquetage, catégorie, formalités. Tu travailles avec lui par questions écrites. Il ne remplace pas ton hygiène locale et n’écrit pas tes recettes.","mod":"m7","li":2,"example":"Avant tout envoi d’échantillon, tu lui demandes par écrit la liste des pièces attendues et tu coches ta pochette en conséquence.","next":"Ajoute dans la pochette export une page « réponses écrites du partenaire » même encore vide.","alt":"Comme un cousin qui vit déjà dans la ville d’arrivée: il te dit quelles portes frapper, toi tu prépares tes papiers.","hint":"Clarifier le marché cible, pas faire le ménage à ta place."},{"keys":["acquérir","norme"],"q":"Que faire des seuils exacts avant d’avoir le texte de la norme ?","a":"Avant d’avoir le texte de la norme, tu n’inventes pas les seuils exacts sur l’étiquette. Tu dénommes honnêtement, tu tiens hygiène et lots, tu prépares l’acquisition du texte. Savoir le titre exact et prévoir de l’acquérir, c’est déjà professionnel.","mod":"m7","li":1,"example":"Tu refuses d’écrire un pourcentage d’humidité « officiel » entendu au marché; tu attends la lecture du texte ABNORM.","next":"Budgette l’achat ou la consultation de la norme dans ton enveloppe qualité cette saison.","alt":"Comme ne pas afficher les notes de passage d’un examen dont tu n’as pas encore le barème officiel.","hint":"N’invente aucun chiffre: garde le titre exact et un plan d’acquisition."},{"keys":["flexibilité","petites"],"q":"La flexibilité pour petites structures veut-elle dire zéro hygiène ?","a":"Non, la flexibilité pour les petites structures ne veut pas dire zéro hygiène. Elle veut dire maîtrise réelle et documents proportionnés à la taille. On ne demande pas le même volume de papier qu’à une usine, mais on demande des gestes tenus et des preuves utiles.","mod":"m7","li":2,"example":"Tu tiens, par exemple, douze cases de liste de contrôle et deux points surveillés plutôt qu’un classeur de cent pages jamais ouvert.","next":"Barre sur ta liste de contrôle toute case qui ne change rien au produit, et garde celles que tu coches vraiment.","alt":"Comme une petite cantine qui note l’essentiel sans copier le classeur d’un hôpital, tout en refusant la saleté.","hint":"Reste proportionnée: vise une maîtrise réelle, pas une absence de maîtrise."},{"keys":["version","étiquette"],"q":"Pourquoi numéroter les versions d’étiquette ?","a":"Numéroter les versions d’étiquette évite de mélanger d’anciennes mentions avec les nouvelles. Tu notes première version, deuxième version, date, tu archives le bon à tirer, et tu mets de côté les stocks obsolètes. Une modification d’étiquette devient un nouveau numéro de version.","mod":"m7","li":4,"example":"Tu changes le poids net affiché: tu crées la version suivante datée, tu retires les anciennes étiquettes du tiroir, tu archives les deux modèles.","next":"Photographie ton étiquette actuelle, note « version en cours » et la date sur le dos de la photo ou sur une fiche.","alt":"Comme numéroter les édition d’un faire-part de mariage: tu sais laquelle a vraiment été distribuée.","hint":"Sans numéro de version, les vieux stocks d’étiquettes trompent la cliente."},{"keys":["rapport","analyse","lot"],"q":"Que faire d’un rapport d’analyse sans nom de lot ?","a":"Un rapport d’analyse sans nom de lot, tu le refuses ou tu le renvoies au labo pour correction avant classement. Sans lien de lot, tu ne peux pas relier le résultat à tes sachets. L’étiquette d’échantillon et le bulletin doivent porter le même code.","mod":"m7","li":4,"example":"Le labo te rend un papier « poudre baobab » sans code: tu rappelles, tu demandes la correction, tu ne ranges rien dans les fiches lot tant que le code manque.","next":"Écris la règle « pas de classement sans nom de lot » et colle-la dans la pochette labo.","alt":"Comme un reçu de pharmacie sans le nom du médicament: tu ne peux pas l’utiliser, tu retournes au comptoir.","hint":"Le beau tampon ne remplace pas le code lot sur le sachet et dans le carnet."},{"keys":["carte","réglementaire","revue"],"q":"À quelle fréquence relire ta carte réglementaire au début ?","a":"Au début, tu relis ta carte réglementaire environ tous les trois mois, ou quand ton canal change. Tu dates chaque modification. Une carte sans dates devient une légende. Quatre yeux, avec Rachid par exemple, voient mieux les trous.","mod":"m7","li":1,"example":"Tu poses une alarme calendrier dans trois mois pour rouvrir les deux colonnes actuel et export et noter ce qui a bougé.","next":"Inscris aujourd’hui la prochaine date de revue sur ta carte réglementaire.","alt":"Comme revoir le loyer et les règles de la cour à chaque saison: tu ne laisses pas le papier dormir un an entier.","hint":"Pose une revue trimestrielle au début, avec toujours une date écrite."},{"keys":["uemoa","responsabilité"],"q":"Quel principe régional retenir pour l’opératrice alimentaire ?","a":"Le principe régional à retenir pour l’opératrice alimentaire est la responsabilité: tu mets sur le marché un produit sûr et loyal. Les textes de l’union économique le rappellent. Toi, tu retiens le geste: savoir ce qui s’applique à ton sachet et pouvoir le montrer.","mod":"m7","li":4,"example":"Sur ta carte, tu entoures « responsabilité d’opératrice » et tu relies ce mot à ton carnet de lots et à ton étiquette honnête.","next":"Écris en une phrase ce que « responsabilité d’opératrice » veut dire pour ton atelier cette semaine.","alt":"Comme la mère qui sert le repas aux voisins: elle assume ce qui sort de sa cuisine.","hint":"Responsabilité claire, pas hasard ni copie d’une marque étrangère."},{"keys":["biais","code","lot"],"q":"Pourquoi cacher les codes en dégustation ?","a":"Tu caches les codes pour que la personne ne juge pas selon l’idée qu’elle se fait du lot. Si elle voit « lot A » ou un nom qu’elle aime déjà, sa bouche suit souvent cette idée. Trois chiffres tirés au sort laissent le goût et l’odeur parler seuls. Tu gardes la clé des codes à part, et tu ne la montres qu’après les feuilles ramassées.","mod":"m8","li":1,"example":"Tu compares deux jours de tamisage de pain de singe. Sur la table tu poses trois verres codés, par exemple 274, 519 et 836. Personne ne sait lequel vient du nouveau lot.","next":"Prépare une petite enveloppe « clé des codes » pour ta prochaine dégustation et écris-y les trois numéros avant d’appeler qui que ce soit.","alt":"C’est comme cacher le prix sur trois pagnes avant de demander lequel plaît: sinon on choisit souvent le plus cher ou le plus connu, pas celui qui tombe vraiment bien.","hint":"Pense à ce qui change dans la bouche quand on te dit « c’est le nouveau » avant même de goûter."},{"keys":["odeur","piece"],"q":"Une pièce odorante convient-elle ?","a":"Non, une pièce qui sent fort fausse le nez et donc le jugement. Une odeur de cuisine, d’encens ou de produit ménager se colle à la poudre. Tu choisis un endroit calme, aéré, sans parfum collé aux murs. Tu notes aussi la lumière et l’heure, car elles changent ce que l’œil et le nez croient sentir.","mod":"m8","li":0,"example":"Un jour de sauce arachide qui mijote dans la pièce d’à côté, tu reportes la dégustation de trois sachets Baobab Bliss. Tu ouvres plutôt la véranda tôt le matin, fenêtres ouvertes une demi-heure, table essuyée, puis tu goûtes.","next":"Choisis dès maintenant l’endroit exact où tu goûteras cette semaine et écris-le en haut de la page du carnet.","alt":"Goûter dans une pièce qui sent le savon, c’est comme essayer de reconnaître une fleur près d’un feu de braise: le nez est déjà occupé.","hint":"Ferme les yeux une seconde dans la pièce: qu’est-ce que ton nez remarque avant même d’ouvrir un sachet ?"},{"keys":["triangle","intrus"],"q":"À quoi sert le test du triangle ?","a":"Le test du triangle sert à chercher une différence, pas une préférence. Tu prépares trois verres: deux identiques, un différent. La personne doit dire lequel est l’intrus. Tu comptes ensuite combien de bonnes réponses tu obtiens, et tu compares ce nombre au hasard. Ainsi tu sais si la différence se sent vraiment pour ce jury-là.","mod":"m8","li":1,"example":"Tu te demandes si le lot tamisé deux fois se distingue du lot tamisé une fois. Tu sers deux verres du simple tamis et un verre du double. Tu demandes seulement: lequel est l’intrus? Tu ne demandes pas encore lequel plaît.","next":"Écris sur une feuille la question exacte du triangle pour ton prochain essai: deux lots nommés, un seul critère à comparer.","alt":"Trois tasses de tô, deux de la même marmite et une d’une autre: on cherche laquelle sort du lot, pas encore laquelle on servirait aux invités.","hint":"La consigne tient en peu de mots: on cherche l’intrus, rien d’autre sur cette feuille."},{"keys":["hasard","trois"],"q":"Quelle chance de trouver l’intrus au hasard ?","a":"Une personne seule a une chance sur trois de trouver l’intrus en devinant. Il y a trois verres, un seul est différent. Sans ce repère, un score « assez bon » ne veut rien dire. Tu compares toujours le nombre de bonnes réponses au hasard avant de conclure.","mod":"m8","li":1,"example":"Sur neuf personnes qui goûtent ta poudre, trois bonnes réponses au hasard seraient déjà attendues. Si tu n’en as que quatre, tu restes prudente: la différence entre tes deux lots de pain de singe n’est peut-être pas claire pour ce jury.","next":"Sur ton carnet, écris la phrase: « hasard: une chance sur trois » à côté de la case où tu noteras les scores du prochain triangle.","alt":"Comme tirer une pierre parmi trois poteries retournées: sans regarder, tu as une chance sur trois de tomber sur la bonne.","hint":"Combien de verres y a-t-il, et combien d’intrus ?"},{"keys":["hedonique","plaisir","note"],"q":"Que mesure une échelle de plaisir ?","a":"Une échelle de plaisir mesure le degré d’appréciation, du très désagréable au très agréable. Ce n’est plus le test de l’intrus. Tu poses une question nette, tu changes de feuille, puis tu laisses noter sans commentaire. Les notes permettent des égalités et des moyennes, avec leurs limites sur un tout petit groupe.","mod":"m8","li":2,"example":"Après le triangle, tu sers à nouveau deux sachets de pain de singe et tu demandes: note de un à neuf pour le tô du matin. Une voisine met huit au grain fin et six au grain plus grossier. Tu écris la question exacte en haut de la feuille.","next":"Choisis une seule question de plaisir pour ta prochaine séance et écris-la telle quelle sur une feuille neuve.","alt":"C’est comme demander à quelle hauteur on aime le piment dans la sauce: on ne cherche pas l’intrus, on dit combien ça plaît.","hint":"Sur cette feuille, cherches-tu une différence cachée, ou un degré d’envie de reprendre ?"},{"keys":["classement","ordre"],"q":"À quoi sert un classement de trois verres ?","a":"Classer trois verres, c’est les mettre du moins aimé au plus aimé. Cela force un ordre même si deux produits se valent presque. Tu apprends lequel sort en tête pour ce jury, sans encore parler de notes chiffrées. Tu gardes cette feuille séparée du test de l’intrus.","mod":"m8","li":1,"example":"Tu poses trois sachets de Baobab Bliss: un du début de semaine, un du milieu, un du vendredi. Chaque personne range les trois du moins au plus aimé pour la bouillie du soir. Tu ramasses les feuilles avant toute discussion.","next":"Prépare trois codes et une consigne unique de classement pour une mini-séance avec deux personnes de confiance.","alt":"Ranger trois pagnes du moins joli au plus joli sur la table du marché: on obtient un ordre clair, même si deux se ressemblent.","hint":"Ici on range, on ne donne pas encore de chiffre."},{"keys":["jury","regles"],"q":"Qu’est-ce qu’un petit jury utile ?","a":"Un petit jury utile, ce sont par exemple six à douze personnes attentives qui acceptent le silence, comprennent la consigne, et n’ont pas le rhume ce jour-là. Une foule distraite donne du bruit, pas une preuve. Tu expliques le but en deux minutes, tu sers peu d’échantillons, et tu dépouilles le soir même.","mod":"m8","li":3,"example":"Pour juger le grain de ta poudre, tu invites huit voisines un samedi matin. Table propre, eau claire, quatre sachets tout au plus. Tu remercies, tu ramasses les feuilles, tu calcules avant le déjeuner.","next":"Liste six à huit noms possibles pour un jury baobab et coche celles que tu peux appeler cette semaine.","alt":"Mieux vaut huit oreilles qui écoutent vraiment qu’une cour pleine où tout le monde parle en même temps.","hint":"Le nombre compte moins que le calme et la compréhension de la consigne."},{"keys":["rhume","juge"],"q":"Que faire si une juge est enrhumée ?","a":"Tu la remercies et tu la reportes à un autre jour. Un nez bouché lit mal les odeurs et fausse le grain perçu en bouche. Ce n’est pas un manque de volonté: les sens sont simplement brouillés. Tu notes sur la feuille du jour qui était absente et pourquoi, sans dramatiser.","mod":"m8","li":0,"example":"Aminata arrive pour goûter ta poudre mais tousse depuis la veille. Tu lui sers plutôt un verre d’eau, tu gardes sa place pour la semaine suivante, et tu continues avec les six autres personnes présentes.","next":"Ajoute une ligne sur ta liste d’ouverture de séance: « nez libre? » avant de distribuer les verres.","alt":"Comme demander à quelqu’un enrhumé de reconnaître le thym dans la sauce: le nez ne peut pas rendre service ce jour-là.","hint":"Quel sens porte surtout l’odeur de ta poudre, et que devient-il avec un rhume ?"},{"keys":["cliente","usage","whatsapp"],"q":"Que demander d’abord à une cliente ?","a":"Tu commences par une question ouverte sur l’usage: dans quelle préparation, pour qui, à quel moment. Tu laisses parler avant de demander une note ou une préférence. Les mots bruts de la cliente valent souvent plus qu’un simple « j’aime ». Tu notes la phrase exacte, pas ta version polie.","mod":"m8","li":2,"example":"Au marché d’Ouagadougou, tu tends un peu de pain de singe et tu demandes: « tu la mets où, cette poudre, chez toi? ». Une cliente répond: « dans la bouillie du petit le matin ». Tu écris cette phrase telle quelle le soir.","next":"Choisis une seule question ouverte pour le prochain marché et pose-la à trois personnes sans les interrompre.","alt":"Avant de demander si la sauce plaît, on demande d’abord avec quoi elle a mangé le tô: le contexte éclaire le jugement.","hint":"Commence par le « où et comment tu t’en sers », pas par « tu aimes? »."},{"keys":["gouté","acheté"],"q":"Pourquoi séparer « a goûté » et « a acheté » ?","a":"Goûter et acheter ne disent pas la même chose. Une personne peut trouver la poudre agréable et ne pas ouvrir le porte-monnaie ce jour-là. Une autre achète par confiance ou par habitude. Tu notes les deux colonnes à part: ainsi tu vois si le plaisir se transforme en vente, ou s’il reste un compliment sans suite.","mod":"m8","li":4,"example":"Après une dégustation devant ton étal, par exemple cinq femmes disent que le grain est bon; deux seulement repartent avec un sachet Baobab Bliss. Tu écris l’écart entre compliment et achat.","next":"Sur ton carnet de marché, trace deux colonnes: goûté et acheté, et remplis-les samedi prochain.","alt":"On peut dire qu’un pagne est beau sans le prendre: le compliment et l’achat vivent sur deux lignes différentes du carnet.","hint":"Sur ta page, ces deux gestes ont-ils la même case, ou deux cases ?"},{"keys":["decision","garder","ajuster"],"q":"Que écrire après une dégustation ?","a":"Tu écris une décision datée qui cite le chiffre ou la phrase qui la porte: garder, ajuster le tamis, changer la fermeture, reporter, ou tester encore. Sans citation, ce n’est qu’une impression du soir. Tu classes aussi la suite: action immédiate, action sous quinze jours, ou surveillance seulement.","mod":"m8","li":5,"example":"Huit personnes sur dix ont trouvé l’intrus entre ton double tamis et ton tamis simple. Tu écris: « 31 octobre, je garde le double tamis pour le prochain lot; preuve: 8 sur 10 au triangle ».","next":"Après ta prochaine séance, termine par une phrase de décision avec date et preuve avant de ranger les verres.","alt":"Comme noter après le marché: « je rachète ce tissu parce que trois clientes l’ont touché deux fois », pas seulement « il m’a plu ».","hint":"Ta dernière ligne doit pouvoir se relire dans trois mois et encore tenir debout."},{"keys":["message","dose"],"q":"Un frein de dose floue se règle souvent comment ?","a":"Souvent en rendant la dose visible et simple: une cuillère type, un trait sur le sachet, ou une phrase d’usage claire. Quand la cliente ne sait pas « combien mettre », elle hésite à racheter. Tu écoutes les mots exacts sur la dose, puis tu corriges l’étiquette ou le discours oral, pas toute la recette d’un coup.","mod":"m8","li":0,"example":"Deux clientes disent « je ne sais jamais combien pour la bouillie ». Tu ajoutes sur le sachet Baobab Bliss: « une petite cuillère pour un bol ». Au marché suivant tu répètes la même phrase à voix haute.","next":"Écoute trois clientes sur la dose cette semaine et choisis une seule phrase d’usage à écrire sur le prochain sachet.","alt":"C’est comme vendre du soumbala sans dire « une noix pour la marmite »: l’hésitation vient souvent du combien, pas du goût.","hint":"Qu’est-ce qui bloque au moment de servir, avant même le plaisir en bouche ?"},{"keys":["mesurer","methode"],"q":"Que retenir de « Mesurer et l’incertitude » ?","a":"Une mesure utile porte le chiffre, l’unité et l’outil. L’incertitude est la marge honnête autour du résultat, pas une faute à cacher. Tu gardes les pesées qui te dérangent et tu cherches la cause. Trois valeurs notées avec lot et date valent mieux qu’un seul chiffre trop beau.","mod":"m9","li":0,"example":"Tu pèses trois fois le même sachet de pain de singe: 502 g, 501 g, 503 g. Tu notes le modèle de la balance et l’heure. L’écart d’un gramme te parle de ton geste et de l’outil, tu n’effaces rien.","next":"Pèse aujourd’hui trois fois le même sachet Baobab Bliss et écris les trois valeurs côte à côte avant toute moyenne.","alt":"Mesurer sans unité ni outil nommé, c’est comme dire « un peu de mil » sans montrer le bol: personne ne peut recommencer demain.","hint":"Quelles trois informations rendent un chiffre encore lisible la semaine suivante ?"},{"keys":["mesurer","carnet"],"q":"Que noter pour « Mesurer et l’incertitude » ?","a":"Tu notes le chiffre, l’unité, le modèle de l’outil, l’heure, le lot et la date. Si tu fais plusieurs pesées, tu les gardes toutes. Tu ajoutes une courte remarque si le plateau était sale ou si la table tremblait. Ainsi tu peux relire et comparer sans inventer le contexte.","mod":"m9","li":1,"example":"Sur la page du lot 12, tu écris: balance cuisine, 14 h 10, sachet 487 g puis 486 g puis 487 g, plateau essuyé entre deux. Une aide pourra reprendre la même méthode demain.","next":"Ajoute sur ton carnet une ligne type: chiffre, unité, outil, heure, lot, et utilise-la dès la prochaine pesée.","alt":"Comme noter la quantité de farine avec le bol utilisé et l’heure: sans cela, la prochaine fournée ne sait plus quoi recopier.","hint":"Si tu perds le papier demain, que devra-t-il encore contenir pour rester utile ?"},{"keys":["moyenne","methode"],"q":"Que retenir de « Moyenne et écart » ?","a":"La moyenne donne le centre d’un nuage de chiffres. L’écart, ou au début l’étendue, montre si les valeurs sont serrées ou dispersées. Une même moyenne peut cacher un lot très régulier ou un lot qui saute. Tu écris toujours moyenne et dispersion ensemble, avec le nombre de valeurs.","mod":"m9","li":1,"example":"Cinq sachets Baobab Bliss pèsent autour de 500 g: de 498 à 502. Un autre jour la moyenne est encore 500 g mais les poids vont de 470 à 530. Tu sais que le second lot n’est pas « pareil » malgré la même moyenne.","next":"Prends cinq poids du même lot et calcule moyenne et étendue avant de dire que le lot est régulier.","alt":"Deux files d’attente de même longueur moyenne: l’une où chacun attend presque pareil, l’autre où certains restent très longtemps. Le centre seul ne raconte pas l’histoire.","hint":"Que manque-t-il si tu ne gardes que le chiffre du milieu ?"},{"keys":["moyenne","carnet"],"q":"Que noter pour « Moyenne et écart » ?","a":"Tu notes chaque valeur, le nombre n, la moyenne, et la dispersion (étendue ou écart-type). Tu dates la page et tu nommes le lot. Sur de petits effectifs tu calcules à la main pour comprendre ce que le chiffre signifie. Plus tard un tableur pourra aider, mais le sens reste le tien.","mod":"m9","li":1,"example":"Lot 18, cinq sachets: 495, 500, 502, 498, 505. Tu écris n cinq, moyenne 500, étendue 10 g, date du jour. Tu ranges la page avec les autres contrôles de masse.","next":"Crée sur une page vierge les colonnes: valeurs, n, moyenne, étendue, lot, date, et remplis-les une fois cette semaine.","alt":"Comme compter les bols de mil vendus: tu gardes la liste, le total, et l’écart entre le plus petit et le plus grand jour.","hint":"Quels titres de colonnes te permettraient de recalculer sans retéléphoner à ta mémoire ?"},{"keys":["échantillonner","methode"],"q":"Que retenir de « Échantillonner sans se tromper » ?","a":"Échantillonner, c’est choisir une petite part pour parler d’un tout, selon une règle écrite. Sans règle, tu prends souvent ce qui est devant, le plus beau ou le plus accessible. Un bon échantillon ressemble au lot: plusieurs endroits, pas seulement le dessus du bac. Tu notes combien, où, quand, et qui prélève.","mod":"m9","li":2,"example":"Pour contrôler le grain, tu ne prends pas seulement la poignée du dessus du bac de poudre. Tu mélanges doucement, tu prends un peu devant, au milieu et vers le fond, et tu écris: six poignées, lot 7, Olga.","next":"Écris ta règle baobab: combien de sachets ou de poignées, où, quand, qui, pour quel contrôle.","alt":"Goûter la sauce en ne plongeant la cuillère qu’à la surface, c’est rater ce qui est au fond de la marmite.","hint":"Si tu ne prends que ce qui est sous la main, à quoi ressemble vraiment ton « échantillon » ?"},{"keys":["échantillonner","carnet"],"q":"Que noter pour « Échantillonner sans se tromper » ?","a":"Tu notes la règle: combien prélever, à quels endroits, à quel moment, sur quel lot numéroté, et qui prélève. Tu ajoutes si tu as mélangé avant. Deux personnes peuvent prélever différemment: une brève démonstration commune aligne les gestes. La taille reste un compromis entre tendance visible et temps réel.","mod":"m9","li":2,"example":"Sur la fiche lot 9 tu écris: 4 sachets tirés (1 début de carton, 2 milieu, 1 fin), prélèvement à 9 h par Aïcha, après un léger mélange du bac ouvert. Tu gardes la même fiche pour le contrôle du jeudi.","next":"Fais une démonstration de prélèvement avec ton aide et signez toutes les deux la règle écrite.","alt":"Comme convenir qui puise l’eau au grand jarre et à quelle profondeur: sans accord, chacun ramène une histoire différente.","hint":"Quels mots sur la page permettraient à une autre personne de refaire exactement le même prélèvement ?"},{"keys":["comparer","methode"],"q":"Que retenir de « Comparer deux lots » ?","a":"Comparer deux lots, c’est répondre à une question nette sur un critère choisi, avec la même méthode des deux côtés. Même balance, même règle d’échantillonnage, même moment si possible. Tu regardes d’abord moyennes et dispersions. Tu écris une conclusion claire et datée, sans sauver de mauvaises données par un test.","mod":"m9","li":3,"example":"Tu compares la masse moyenne des sachets du lundi et du jeudi. Même balance, cinq sachets chaque jour, même heure. Tu conclus: « pas de différence nette sur la moyenne; le jeudi est un peu plus dispersé ». Tu notes aussi la chaleur d’atelier.","next":"Formule en une phrase la question de comparaison pour tes deux prochains lots, avec le critère exact.","alt":"Comparer deux journées de marché sans compter de la même façon, c’est discuter dans le vide: le critère doit être le même des deux côtés.","hint":"As-tu une question en une ligne, et la même façon de mesurer partout ?"},{"keys":["comparer","carnet"],"q":"Que noter pour « Comparer deux lots » ?","a":"Tu notes la question, le critère, la méthode commune, les deux séries de valeurs, les moyennes, les dispersions, la date, et la conclusion en langage clair. Tu ajoutes le contexte atelier s’il peut expliquer un écart: météo, fatigue, changement d’aide. Tu dates la page et tu la ranges avec les lots concernés.","mod":"m9","li":3,"example":"Page comparée lots 14 et 15: critère masse, cinq sachets chaque, moyennes 500 et 498, étendues 8 et 22. Conclusion: « lot 15 plus dispersé; vérifier la fermeture ». Contexte: vent fort, porte ouverte.","next":"Prépare une page type « comparaison » avec ces titres de lignes et remplis-la une fois sur deux lots réels.","alt":"Comme deux listes de dépenses du mois: mêmes colonnes, mêmes règles, puis une phrase qui dit ce qui change vraiment.","hint":"Que devra lire ton aide dans six semaines pour comprendre la décision sans te téléphoner ?"},{"keys":["essais","methode"],"q":"Que retenir de « Essais planifiés » ?","a":"Un essai planifié change une chose à la fois, ou un petit ensemble choisi à l’avance. Tu écris le plan avant: facteur, niveaux, combien de sachets, comment tu mesures le succès, dates. Tu recueilles sur une grille, tu compares, tu décides, tu archives. Sans grille, l’essai redevient anecdote.","mod":"m9","li":4,"example":"Tu veux savoir si le double pli réduit les plaintes de refermeture. Tu ne changes ni le tamis ni l’étiquette ce jour-là. Vingt sachets en pli simple, vingt en double pli, même lot de poudre. Tu comptes les retours « sachet difficile » sur deux marchés.","next":"Écris un mini-plan pour un seul facteur baobab: deux niveaux, un critère, une date de début et de fin.","alt":"Si tu changes la recette du tô, le feu et la marmite le même matin, tu ne sauras jamais ce qui a rendu le plat meilleur.","hint":"Combien de choses bougent en même temps dans ton essai d’aujourd’hui ?"},{"keys":["essais","carnet"],"q":"Que noter pour « Essais planifiés » ?","a":"Tu notes le facteur étudié, les niveaux, la taille de chaque bras, le critère de succès, l’ordre des essais, les résultats sur une grille, et la conclusion datée. Tu tires au sort l’ordre quand tu peux, pour ne pas confondre avec un effet jour. Tu ranges la grille avec le carnet de lot.","mod":"m9","li":4,"example":"Grille « pli sachet »: facteur type de pli; niveaux simple ou double; vingt sachets chacun; critère nombre de plaintes au marché; conclusion du 28 octobre collée à côté.","next":"Dessine la grille vide de ton prochain essai avant de produire le premier sachet d’essai.","alt":"Comme un carnet de teinture: quelle couleur, combien de pièces, quel soleil, quel résultat, quelle date.","hint":"Quels titres de colonnes transformeraient ton essai en apprentissage relisible ?"},{"keys":["suivre","methode"],"q":"Que retenir de « Suivre un chiffre dans le temps » ?","a":"Un chiffre suivi chaque jour devient un pilote. Tu poses le point sur un axe temps et tu regardes la tendance, pas seulement le dernier jour. Avant de réagir à un jour anormal, tu vérifies la mesure, l’échantillon et un éventuel événement d’atelier. Des limites simples marquent la zone habituelle.","mod":"m9","li":5,"example":"Tu suis dix jours la masse moyenne de cinq sachets Baobab Bliss. Le jour 7 saute: tu découvres une tare oubliée, tu corriges, tu notes le point hors série sans changer tout le procédé.","next":"Choisis un seul indicateur baobab et suis-le dix jours ouvrés sur une page datée.","alt":"Regarder la jarre d’eau chaque soir: un jour bas peut dire fuite, ou simplement plus d’invités. On vérifie avant de crier.","hint":"Face à un point bizarre, que vérifies-tu avant de toucher au procédé ?"},{"keys":["suivre","carnet"],"q":"Que noter pour « Suivre un chiffre dans le temps » ?","a":"Tu notes la date, la valeur, l’échantillon (n), l’outil, et une remarque courte s’il y a un événement. Tu traces des limites simples de zone habituelle. Si plusieurs points sortent, tu ouvres une fiche d’action. Tu dates chaque page de carte et tu restes calme face au premier point inhabituel.","mod":"m9","li":5,"example":"Carte « reprises au tamis »: 1 nov 2, 2 nov 2, 3 nov 5 (aide nouvelle), 4 nov 2. Tu entoures le 5, tu notes la cause, tu ne changes pas le tamis ce soir-là.","next":"Prépare la page de carte avec colonnes date, valeur, n, remarque, et commence demain matin.","alt":"Comme le cahier de la boutique: chiffre du jour, petite note « pluie » ou « fête », puis on lit la semaine entière.","hint":"Que manque-t-il sur une carte qui n’a que des points sans date ni remarque ?"},{"keys":["disposer","atelier"],"q":"Idée clé de « Disposer l’atelier en flux avant » ?","a":"Le produit avance du plus brut vers le plus avancé sans retour vers le sale. Les gousses entrent d’un côté, les sachets fermés sortent de l’autre. Tu refuses de croiser poubelle de coques et table des sachets prêts. Même dans une petite pièce, couleurs de bassines, horaires ou repères au sol aident.","mod":"m10","li":0,"example":"Dans ta pièce à Ouagadougou, tu places la casse près de la porte d’entrée, le tamis au centre, l’emballage près de la sortie vers le placard propre. Les coques partent dans une bassine d’une autre couleur, jamais sur la table d’emballage.","next":"Dessine le flux baobab réel de ta pièce et entoure l’endroit où tu fais le plus de détours.","alt":"Comme une cuisine où les légumes sales n’arrivent jamais sur la planche du riz déjà cuit: le chemin évite les retours.","hint":"Si une aide découvre l’atelier en une minute, voit-elle clairement d’où part le produit et où il finit ?"},{"keys":["disposer","geste"],"q":"Astuce « Disposer l’atelier en flux avant » ?","a":"Dessine le plan réel, pas un plan de magazine. Trace des flèches produit et des flèches déchets. Marque le lave-mains. Note chaque conflit de gestes sur la page. Demain tu déplaces un seul meuble, pas toute la maison. L’essentiel: une aide comprend le chemin sans long discours.","mod":"m10","li":0,"example":"Tu remarques que tu reviens trois fois vers le bac de coques en traversant la table des sachets. Tu déplaces seulement ce bac près de la fenêtre de casse. Le lendemain tu comptes les pas: le détour a disparu.","next":"Déplace un seul objet qui crée un croisement sale et propre, puis note le avant et après sur le carnet.","alt":"Ranger le marché en commençant par une seule table mal placée, pas en rebâtir toute l’allée d’un coup.","hint":"Quel unique déplacement supprimerait ton plus grand croisement cette semaine ?"},{"keys":["planifie","atelier"],"q":"Idée clé de « Planifier la production » ?","a":"Planifier, c’est décider quoi faire quel jour avant que le désordre ne décide à ta place. Tu regardes commandes ou ventes prévues, stock de sachets vides, pulpe disponible, et ton énergie réelle. Tu respectes pauses et nettoyage: un plan qui oublie le lavage ment. Tu bloques des créneaux courts et tenables.","mod":"m10","li":0,"example":"Pour la semaine avant le marché de samedi, tu écris: lundi cassage, mardi tamis et contrôle, mercredi emballage, vendredi étiquettes et sac de route. Tu laisses jeudi plus léger pour le ménage d’atelier.","next":"Écris ta semaine baobab en cases d’une demi-journée et entoure le jour le plus chargé.","alt":"Partir au marché sans savoir quels pagnes sortir, c’est laisser la file décider à ta place: un petit plan du soir d’avant change tout.","hint":"Qui décide ton jeudi matin si tu n’as rien écrit la veille: toi, ou les urgences ?"},{"keys":["planifie","geste"],"q":"Astuce « Planifier la production » ?","a":"Partage le plan avec toute aide la veille pour éviter les surprises du matin. Si un poste est trop lent, ajuste plutôt que d’empiler une journée héroïque. Le rythme à tenir pour livrer à temps se calcule simplement: charge à faire divisée par le temps utile réel. Garde le nettoyage dans les cases.","mod":"m10","li":1,"example":"Tu dois trente sachets avant samedi et tu as six heures utiles. Tu vises environ cinq sachets par heure de vrai travail, pauses comprises. Mardi soir tu vois que le tamis traîne: tu avances une heure d’emballage à mercredi matin.","next":"Calcule une fois charge et heures utiles pour ta prochaine échéance de marché, puis ajuste une case du plan.","alt":"Comme préparer un baptême: on répartit les tâches la veille, sinon tout le monde court le matin sans se croiser utilement.","hint":"Le plan a-t-il été lu à voix haute par celle qui t’aide, ou dort-il dans ta tête seule ?"},{"keys":["stocks_e","atelier"],"q":"Idée clé de « Stocks et premier entré premier sorti » ?","a":"Chaque bac porte une date et un numéro de lot. Tu sors d’abord ce qui est entré en premier. Cette règle évite les vieux fonds oubliés. Si quelque chose expire plus tôt, tu sors d’abord ce qui expire le plus tôt, même arrivé après. Tu comptes régulièrement: un stock imaginaire fait mentir le plan.","mod":"m10","li":2,"example":"Deux cartons de sachets vides: un ouvert la semaine dernière, un reçu hier. Tu finis d’abord le carton de la semaine dernière avant d’ouvrir le neuf. Tu notes le seuil: en dessous de vingt sachets vides, tu rachètes.","next":"Étiquette trois bacs baobab avec lot et date, puis pratique une sortie dans le bon ordre sous les yeux d’une aide.","alt":"Au grenier à mil, on ne laisse pas le vieux sac pourrir derrière le nouveau: on tire d’abord ce qui est arrivé en premier.","hint":"Quand deux bacs sont là, lequel s’ouvre en premier selon la règle du cours ?"},{"keys":["stocks_e","geste"],"q":"Astuce « Stocks et premier entré premier sorti » ?","a":"Fais lire la date à voix haute par une aide avant de servir. Date chaque bac ouvert et limite le temps d’ouverture sur la fiche. Pour la poudre bien sèche, la discipline de lot reste essentielle pour retrouver un souci. Au-dessus d’un certain volume ouvert trop longtemps, tu traites le sujet tout de suite.","mod":"m10","li":2,"example":"Avant d’emplir vingt sachets, Aïcha lit: « bac lot 11, ouvert lundi ». Tu confirmes. Le bac plus récent lot 12 reste fermé derrière. Sur la fiche tu as écrit: refermer le bac dans l’heure.","next":"Ajoute sur ta fiche de stock la ligne « lu à voix haute » et coche-la à la prochaine sortie.","alt":"Comme annoncer la date du yaourt avant de le servir aux enfants: la voix haute évite l’oubli poli.","hint":"Qui dit la date avant que la main plonge dans le bac ?"},{"keys":["structur","atelier"],"q":"Idée clé de « Structure du coût de revient » ?","a":"Le coût de revient dit ce que te coûte vraiment un sachet avant le profit. Tu sépares coûts variables (pulpe, sachets, étiquettes, une part du transport) et coûts fixes (espace, outils amortis, certaines charges). Tu additionnes les variables par sachet, puis une part raisonnable des fixes selon le volume du mois. Tu marques les exemples chiffrés comme exemples.","mod":"m10","li":3,"example":"Sur ta feuille Baobab Bliss tu listes pulpe, sachet kraft, étiquette comme variables. Tu ajoutes une part du mois pour l’espace atelier. Tu vois un coût complet estimé avant de parler prix au marché.","next":"Bâtis la feuille: variables par sachet, fixes du mois, volume prévu, coût complet estimé, chaque chiffre d’exercice marqué comme exemple.","alt":"Vendre des beignets en ne comptant que la farine, sans le bois ni le loyer du coin, c’est se surprendre à la fin du mois.","hint":"Qu’est-ce qui bouge quand tu produis plus, et qu’est-ce qui reste même les semaines calmes ?"},{"keys":["structur","geste"],"q":"Astuce « Structure du coût de revient » ?","a":"Entoure le seuil de rentabilité après chaque recalcul et date la fiche. Une aide doit pouvoir dire le coût complet d’un sachet en une phrase. Tu n’inventes pas un bénéfice. Si tu vends trop juste, mieux vaut le voir sur la feuille. Quand un poste change, tu recalcules le même jour.","mod":"m10","li":3,"example":"Après une hausse du prix des sachets vides, tu mets à jour la ligne variable, tu dates, tu entoures le nouveau seuil. Tu dis à ton aide: « aujourd’hui le sachet complet me revient à tant, en exemple sur cette feuille ».","next":"Recalcule une ligne de ta fiche avec un ticket réel ou un exemple clairement marqué, puis entoure le seuil.","alt":"Comme refaire le compte de la sauce quand l’huile a augmenté: on met à jour le jour même, pas « plus tard ».","hint":"Le seuil est-il visible d’un coup d’œil sur ta fiche, ou perdu dans les lignes ?"},{"keys":["entreten","atelier"],"q":"Idée clé de « Entretenir le matériel » ?","a":"Le matériel bien entretenu tombe moins en panne le jour du marché. Tu listes ce que tu utilises vraiment et, pour chaque objet, un geste simple: laver, sécher, vérifier, ranger. La routine préventive précède la réparation d’urgence. Tu tiens une petite fiche par outil critique: dernière vérification, prochain contrôle, remarque.","mod":"m10","li":4,"example":"Balance, tamis et table ont chacun une fiche. Vendredi tu coches: plateau essuyé, tare vérifiée, toile du tamis intacte, table sèche. Le samedi marché commence sans surprise d’outil.","next":"Crée trois fiches baobab (balance, tamis, table) et coche un premier contrôle réel aujourd’hui.","alt":"Entretenir la bicyclette avant la longue route, plutôt que de réparer la chaîne au bord du chemin le jour de la foire.","hint":"Quels trois objets, s’ils lâchent samedi matin, bloquent toute ta vente ?"},{"keys":["entreten","geste"],"q":"Astuce « Entretenir le matériel » ?","a":"Classe les outils en critique, utile ou confort. Balance et tamis de production sont critiques. Garde toile de rechange et tournevis dans une boîte étiquetée. Après entretien: signature, date, prochain contrôle. Si tu empruntes un outil, tu le rends propre. Toute aide connaît le geste de fin de journée.","mod":"m10","li":4,"example":"Tu ranges une toile de tamis neuve dans une boîte marquée « rechange ». Après le contrôle du soir, tu signes la fiche tamis avec la date et le prochain contrôle dans quinze jours.","next":"Étiquette une boîte de rechange pour un outil critique et note le prochain contrôle sur sa fiche.","alt":"Comme garder une ampoule de rechange près de l’étal: le jour où ça grille, tu ne fermes pas la boutique.","hint":"As-tu déjà nommé à voix haute ce qui est critique, utile, ou seulement confort ?"},{"keys":["travaill","atelier"],"q":"Idée clé de « Travailler bien dans l’atelier » ?","a":"Travailler bien, c’est protéger ton corps et ton produit en même temps. Tu règles la hauteur de table, tu portes des chaussures stables, tu gardes les allées libres, tu te laves les mains aux bons moments. La fatigue crée des oublis d’étiquette et des chutes. Tu découpes les journées trop longues et tu expliques les gestes sûrs à toute aide.","mod":"m10","li":5,"example":"Après deux heures penchée sur l’emballage, tu remontes la table sur des cales. Les épaules descendent, tu finis les sachets sans précipiter le numéro de lot. Tu notes le changement sur la liste d’ouverture.","next":"Corrige un seul point ergonomique baobab (hauteur, lumière ou allée) et note le avant ou après.","alt":"Porter une bassine d’eau avec le dos rond toute la matinée finit par faire mal: on règle la hauteur et on se relaie.","hint":"Quel geste du corps te fatigue le plus avant que l’erreur de lot n’arrive ?"},{"keys":["travaill","geste"],"q":"Astuce « Travailler bien dans l’atelier » ?","a":"Écris le point ergonomique choisi sur la liste d’ouverture. Place le lave-mains sur le chemin d’entrée. Garde un registre simple des presque-accidents relu chaque mois avec une action fermée. Range les couteaux. N’improvise pas un branchement électrique douteux pour aller plus vite.","mod":"m10","li":5,"example":"Tu ajoutes « allée libre » sur la liste du matin. Une fois tu trouves un carton de coques au milieu du passage: tu le ranges avant d’ouvrir le lot, et tu notes l’incident évité sur le registre du mois.","next":"Ajoute une ligne « allée libre » ou « hauteur table » à ta liste d’ouverture et coche-la demain.","alt":"Comme dégager le passage de la cour avant que les enfants courent: une minute le matin évite la chute.","hint":"Ta liste du matin parle-t-elle du corps et du passage, ou seulement du produit ?"},{"keys":["bases_po","vendre"],"q":"Idée clé de « Bases pour vendre ton aliment » ?","a":"Vendre, c’est faire rencontrer une promesse claire et une personne réelle. Ta promesse Baobab Bliss est simple: poudre de pain de singe, cent pour cent pulpe, rien d’ajouté. Prix, sachet, lieu et message doivent se tenir. Tu choisis un canal de démarrage modeste, pas dix d’un coup. Tu mesures les rachats, pas seulement les compliments.","mod":"m11","li":0,"example":"Tu répètes au marché: « cent pour cent pulpe, rien d’ajouté ». Le sachet se referme correctement. Tu vends d’abord sur un seul marché de quartier pendant quinze jours et tu notes qui revient.","next":"Écris ta promesse baobab, ton canal unique pour quinze jours, et le prix que ton coût de revient autorise.","alt":"Une marchande qui dit une chose et en montre une autre perd la file: la promesse et le sachet doivent se ressembler.","hint":"En une phrase, que promets-tu, et sur quel seul canal vas-tu le tenir d’abord ?"},{"keys":["bases_po","geste"],"q":"Astuce « Bases pour vendre ton aliment » ?","a":"Choisis un seul canal pour les quinze premiers jours d’essai: un marché, une boutique amie, ou des commandes groupées. Note les objections sans te fâcher: chacune peut devenir une amélioration ou une phrase plus claire. Une cliente qui revient vaut plus qu’une longue conversation sans second achat.","mod":"m11","li":0,"example":"Une cliente dit « je ne vois pas la dose ». Tu ne te vexes pas. Tu ajoutes la phrase sur le sachet et tu la répètes oralement. La semaine suivante elle rachète.","next":"Note trois objections entendues et transforme-en une en phrase plus claire pour le prochain marché.","alt":"Au marché aux légumes, on écoute « c’est trop gros pour ma famille » et on propose la plus petite botte: l’objection devient service.","hint":"Parmi les mots qui freinent l’achat, lequel peux-tu clarifier sans changer tout le produit ?"},{"keys":["chaîne_d","vendre"],"q":"Idée clé de « Chaîne de valeur et fournisseurs » ?","a":"La chaîne va du fruit à la cliente: gousses, transport, atelier, emballage, vente. Chaque maillon peut soutenir ou fragiliser la qualité. Tu choisis les fournisseurs avec des critères écrits: régularité, propreté, honnêteté sur l’origine, délai. Tu gardes un plan B si un maillon casse. Un prix très bas avec des fruits douteux coûte plus cher ensuite.","mod":"m11","li":1,"example":"Tu dessines cinq cases: récolte, transport, atelier, emballage, vente. Sous les gousses tu notes ton fournisseur actuel et une cousine à Koudougou comme plan B. Une fois ce trimestre tu l’appelles sans commander.","next":"Dessine tes cases de chaîne baobab et écris sous chacune le fournisseur actuel et un plan B.","alt":"Si le seul vendeur de piment de ton marché tombe malade, tu es bloquée: avoir un second nom change la semaine.","hint":"Pour les gousses, as-tu un autre nom que ton fournisseur actuel, écrit quelque part ?"},{"keys":["chaîne_d","geste"],"q":"Astuce « Chaîne de valeur et fournisseurs » ?","a":"Garde une grille qualité, délai, prix et transparence dans le carnet d’achat. Une fois par trimestre, contacte le plan B sans commander pour vérifier qu’il existe encore. Date la page. Choisis une seule amélioration de maillon pour la semaine. Un petit audit peut être une visite, des questions, un sac test.","mod":"m11","li":1,"example":"Tu reçois un sac test de gousses du plan B. Tu notes propreté, délai annoncé, clarté sur le village d’origine. Tu dates la page. Cette semaine tu améliores seulement le transport: coussin propre sous les sacs.","next":"Appelle ou visite une fois ton plan B sans passer commande, et date la prise de contact.","alt":"Comme revoir de temps en temps l’autre couturière du quartier, même sans commande: tu sais qu’elle est encore là.","hint":"Ta grille d’achat porte-t-elle quatre mots: qualité, délai, prix, transparence ?"},{"keys":["environn","vendre"],"q":"Idée clé de « Environnement et co-produits du baobab » ?","a":"Les coques, les graines et les fibres sont des co-produits possibles, pas seulement des rebuts. Tu notes d’abord les volumes sortis par lot. Tu sépares proprement ce qui peut servir ailleurs de ce qui part vraiment. Tu cherches des usages simples et locaux. Tu n’inventes pas une usine. Tu évites de mélanger co-produits et zone emballage.","mod":"m11","li":2,"example":"Sur trois lots tu pèses coques et graines et tu écris le rendement pulpe sur la même page. Tu marques au sol une zone co-produits loin de la table d’emballage. Tu explores le compostage contrôlé des fibres avec un voisin potager.","next":"Pèse coques et graines sur un lot cette semaine et écris le rendement pulpe à côté.","alt":"Les peaux d’oignon ne sont pas forcément des ordures: bien séparées, elles rejoignent le compost du jardin sans salir la cuisine.","hint":"As-tu déjà un chiffre de coques par lot, ou seulement une impression de « beaucoup » ?"},{"keys":["environn","geste"],"q":"Astuce « Environnement et co-produits du baobab » ?","a":"Refuse de stocker les coques contre la table d’emballage. Un tas dit temporaire devient vite une habitude sale. Marque au sol la zone co-produits et explique-la à toute aide le premier jour. Choisis une seule idée d’usage testable pour les coques et note qui pourrait la recevoir.","mod":"m11","li":2,"example":"Tu traces un carré au sol près de la porte arrière: « coques ». Tu dis à Aïcha dès son premier jour: rien de ce bac ne traverse la table des sachets. Tu notes le nom d’un artisan du quartier qui reprend parfois les coques décoratives.","next":"Marque la zone co-produits au sol et explique-la une fois à voix haute à ton aide.","alt":"Séparer le seau des épluchures du plateau du repas: une marque claire évite le mélange machinal.","hint":"Où poseras-tu la prochaine coque dans cinq secondes: près des sachets, ou dans une zone nommée ?"},{"keys":["responsa","vendre"],"q":"Idée clé de « Responsabilité sociale simple » ?","a":"Ici, ce sont des gestes concrets: payer correctement une aide, tenir des horaires humains, respecter les voisins, et dire vrai sur le produit. Tu écris cinq règles visibles près du lave-mains: lavage, cheveux, bijoux, blessures, visiteurs. Tu notes les accords de travail sur une page datée. Tu écoutes bruits, odeurs et déchets côté rue.","mod":"m11","li":3,"example":"Avant le lot du vendredi tu relis à voix haute les cinq règles avec ton aide. Sur une page vous avez écrit tâche, durée, rémunération et pauses, avec la date et vos deux signatures.","next":"Affiche les cinq règles près du lave-mains et relis-les à voix haute avant le prochain lot.","alt":"Une entente claire sur le travail du jour, dite avant de commencer, évite la rancœur du soir comme dans toute petite équipe de cour.","hint":"Les règles sont-elles visibles là où les mains se lavent, ou seulement dans ta tête ?"},{"keys":["responsa","geste"],"q":"Astuce « Responsabilité sociale simple » ?","a":"Forme brièvement avant le lot: cinq minutes sur une seule règle, pas un discours. Date le briefing sur la page du jour. Garde une ligne pour les heures réellement travaillées: sans ce suivi tu ne tiens ni rémunération juste ni ton propre temps. Note une plainte de voisinage et la correction le même jour.","mod":"m11","li":3,"example":"Ce matin tu prends cinq minutes seulement sur « bijoux retirés ». Tu dates le briefing. Le soir tu notes quatre heures réellement faites. Un voisin a signalé des coques près du caniveau: tu ramasses le jour même et tu l’écris.","next":"Choisis une seule règle pour le briefing de demain et date-la sur la page du jour après l’avoir dite.","alt":"Mieux vaut un rappel court avant la corvée d’eau qu’un long sermon après que les jarres ont débordé.","hint":"Combien de règles veux-tu vraiment tenir dans les cinq minutes avant le lot ?"},{"keys":["conduire","vendre"],"q":"Idée clé de « Conduire le projet sur douze à dix-huit mois » ?","a":"Conduire le projet, c’est ordonner les chantiers sur douze à dix-huit mois sans tout faire le même jour. Tu poses des jalons: procédé stable, étiquette claire, premiers essais de vente, revue des coûts, puis seulement une extension éventuelle. Tu dessines une frise: mois en colonnes, tâches en lignes. Tu revisites chaque mois: fait, décalé, annulé.","mod":"m11","li":4,"example":"Sur ta frise Baobab Bliss, novembre porte « étiquette validée », décembre « dix ventes d’essai », janvier « revue des coûts ». Tu entoures le chemin qui ne peut pas glisser: sans étiquette claire, pas de vrai essai de vente.","next":"Place trois jalons baobab sur les trois prochains mois et entoure le chemin qui ne peut pas glisser.","alt":"Construire une maison pièce par pièce selon les saisons, plutôt que de vouloir toit, murs et puits le même après-midi.","hint":"Quelles trois dates visibles sur un mur diraient l’ordre de tes chantiers ?"},{"keys":["conduire","geste"],"q":"Astuce « Conduire le projet sur douze à dix-huit mois » ?","a":"Garde une semaine vide avant un jalon public pour absorber les imprévus. Raye sans culpabilité ce qui n’est plus utile. Entoure le chemin critique: les tâches dont le retard retarde tout. Partage la frise avec toute aide une fois par mois. Une frise murale regardée bat un planning parfait oublié dans un tiroir.","mod":"m11","li":4,"example":"Avant le premier marché annoncé, tu laisses une semaine tampon. Tu rays « nouveau logo » qui n’aide pas la vente. Tu montres la frise à Aïcha: ce qui est fait, ce qui glisse, ce qui attend.","next":"Affiche la frise où tu la vois chaque jour et prévois une semaine tampon avant ton prochain jalon public.","alt":"Laisser une journée libre avant une fête de famille évite de tout finir dans la panique de la veille.","hint":"Ta frise est-elle sur un mur regardé, ou dans un cahier fermé ?"},{"keys":["financer","vendre"],"q":"Idée clé de « Financer sans inventer de programmes » ?","a":"Tu commences par séparer l’argent du ménage et celui de l’atelier. Tu listes les besoins: sachets, fruits, petite réparation, trésorerie de sécurité. Tu listes des sources génériques: fonds propres, aide familiale claire, crédit, avance sur commande. Tu n’inventes pas un programme public non vérifié. Chaque source a un coût et une contrainte.","mod":"m11","li":5,"example":"Deux enveloppes nommées: maison et atelier. Sur le tableau: besoin « 200 sachets vides », source envisageable « fonds propres », contrainte « ne pas toucher à l’école des enfants », date de décision samedi.","next":"Fais un tableau: besoin, source envisageable, contrainte, date de décision, sans chiffre inventé présenté comme acquis.","alt":"Mélanger la caisse du thé de la maison et celle de la boutique, c’est ne plus savoir si la boutique tient vraiment.","hint":"Peux-tu toucher l’argent atelier sans ouvrir l’enveloppe maison ?"},{"keys":["financer","geste"],"q":"Astuce « Financer sans inventer de programmes » ?","a":"Fais un épreuve de ventes basses simple: imagine des ventes plus basses d’environ un tiers pendant deux mois. Tes échéances tiennent-elles encore? Si non, réduis le besoin ou allonge le délai avant de signer. Refuse une échéance qui casse le stock de sachets. Date ce calcul sur une page.","mod":"m11","li":5,"example":"Tu envisages un petit crédit pour une balance. Au épreuve de ventes basses, les ventes basses rendent l’échéance trop lourde. Tu reportes le crédit et tu continues avec la balance actuelle en notant la date du calcul.","next":"Écris une page de épreuve de ventes basses pour un besoin réel de l’atelier et date ta conclusion.","alt":"Avant d’emprunter pour une fête, on imagine un mois sans invités payants: si ça casse le grenier, on réduit la fête.","hint":"Si les ventes baissent nettement deux mois, quelle échéance casse en premier ?"},{"keys":["diagramm","dossier"],"q":"But de « Diagramme de ton procédé » ?","a":"Le dossier commence par un dessin clair de ton procédé réel, de la gousse au sachet fermé. Tu marques où tu contrôles et où sortent coques et graines. Une personne extérieure doit comprendre le chemin en quelques minutes. Tu versions le diagramme: date, numéro, ce qui a changé. L’ancien dessin reste en archive.","mod":"cap","li":0,"example":"Tu dessines huit cases Baobab Bliss: réception des gousses, casse, séparation, tamis, contrôle, remplissage, fermeture, stockage. Une flèche part vers le bac à coques. Tu dates « version 1 » et tu fais relire à une amie.","next":"Dessine six à huit cases avec contrôles et déchets, puis fais relire et corrige les flèches ambiguës.","alt":"Expliquer le chemin de l’eau du puits à la jarre avec des cases simples: n’importe quelle voisine suit sans long discours.","hint":"Une étrangère comprend-elle ton dessin en quelques minutes sans que tu parles ?"},{"keys":["diagramm","geste"],"q":"Astuce « Diagramme de ton procédé » ?","a":"Sépare le flux baobab d’un futur séchage mangue. Sur la page baobab, pas de flèche de séchage chaud central: la pulpe est déjà sèche dans la gousse. Si tu ajoutes un finissage doux optionnel, tu l’étiquettes comme optionnel et rare. Ajoute légende et frontière de système avant la version 1 datée. Chaque flèche porte matière et direction.","mod":"cap","li":0,"example":"Tu ouvres une page « mangue plus tard » à part. Sur la page baobab tu écris en légende: coques, graines, poudre. Un petit encadré dit « finissage doux: rare, optionnel ». Tu dates la version 1.","next":"Ajoute légende et frontière de système sur ton dessin, puis date la version 1.","alt":"Ne pas dessiner la route de Ouaga et celle de Bobo sur le même croquis sans légende: on se perd tout de suite.","hint":"Ta page baobab porte-t-elle encore une flèche de séchage chaud qui n’existe pas chez toi ?"},{"keys":["plan_de_","dossier"],"q":"But de « Plan de maîtrise pour ton atelier » ?","a":"Le plan de maîtrise dit comment tu gardes le produit propre et maîtrisé. Tu listes les points sensibles de ton procédé réel: corps étrangers, humidité, mauvaises pratiques d’hygiène, lots mélangés. Tu dis quoi surveiller, quand, et quoi faire si ça dérape. Une page vivante bat un classeur mort. Chaque surveillance a un responsable et un enregistrement simple.","mod":"cap","li":1,"example":"Cinq lignes Baobab Bliss: mains avant emballage, contrôle visuel des corps étrangers, humidité perçue avant fermeture, identification des lots, zone coques séparée. Pour chacune: qui, quand, limite, action, enregistrement.","next":"Écris cinq lignes de maîtrise: points sensibles, surveillance, limite, action correctrice, enregistrement.","alt":"Comme les règles simples avant de préparer une grande marmite pour une fête: qui lave, qui goûte, qui surveille le feu, écrites et tenues.","hint":"Chaque surveillance de ta page est-elle reliée à une case réelle du diagramme ?"},{"keys":["plan_de_","geste"],"q":"Astuce « Plan de maîtrise pour ton atelier » ?","a":"Relis chaque ligne de surveillance à une case numérotée du diagramme. Limite le plan aux lignes tenables cette saison. Une surveillance écrite non faite crée une fausse sécurité. Date la version du plan et range-la avec le diagramme. Choisis d’abord trois surveillances prioritaires et tiens-les vraiment.","mod":"cap","li":1,"example":"Tu entoures trois priorités: lavage des mains avant emballage, contrôle visuel, fermeture du sachet après un contrôle simple. Tu dates le plan. Tu coches réellement ces trois points sur le lot de jeudi.","next":"Choisis trois surveillances prioritaires, écris quoi quand qui limite action, et tiens-les sur le prochain lot.","alt":"Mieux vaut trois règles de cour vraiment tenues que vingt affiches que personne ne regarde.","hint":"Combien de lignes de ton plan as-tu réellement cochées sur le dernier lot ?"},{"keys":["vérifier","dossier"],"q":"But de « Vérifier ton étiquette » ?","a":"L’étiquette dit qui tu es et ce que contient le sachet. Tu vérifies dénomination, quantité nette, nom et adresse de l’exploitante, lot, date de durabilité, conditions de conservation, et conseils d’usage simples. Tu ne charges pas l’étiquette de phrases inventées sur la santé. Tu fais le test à bout de bras: une amie lit-elle l’essentiel facilement? Tu relies le numéro de lot au carnet.","mod":"cap","li":2,"example":"Sur ton épreuve Baobab Bliss tu lis: pain de singe, cent pour cent pulpe, poids net, ton nom et ton adresse, lot, date de durabilité, « conserver au sec », phrase d’usage. Une amie à bout de bras peine sur le lot: tu agrandis les caractères et tu retestes.","next":"Fais une liste de contrôle sur ton épreuve d’étiquette et demande une relecture extérieure à bout de bras.","alt":"Un panneau de boutique illisible de loin ne sert personne, même s’il est joli de près.","hint":"À bout de bras, quels trois mots restent lisibles sur ton sachet ?"},{"keys":["vérifier","geste"],"q":"Astuce « Vérifier ton étiquette » ?","a":"Archive les anciennes épreuves après validation pour éviter de réimprimer une version morte. L’étiquette validée porte date et numéro de version dans le dossier. Vérifie la cohérence lot et imprimante le jour d’impression. Corrige contraste et taille, puis reteste à bout de bras. Ce qu’une personne extérieure ne comprend pas, la cliente non plus.","mod":"cap","li":2,"example":"Tu ranges la première épreuve barrée dans une pochette « archives ». La deuxième épreuve datée part à l’impression. Le matin tu confrontes le numéro de lot imprimé et la page du carnet avant de coller.","next":"Date et numérote la version d’étiquette validée, archive l’ancienne, et vérifie lot et imprimante le jour J.","alt":"Garder le vieux carton de prix sous le comptoir, c’est risquer de le ressortir par erreur le jour de foule.","hint":"La version affichée dans le dossier et celle sur la table d’impression sont-elles la même ?"},{"keys":["plan_de_","dossier"],"q":"But de « Plan de durée de vie » ?","a":"La durée de vie dit jusqu’où tu assumes la qualité du sachet dans des conditions décrites. Tu observes couleur, odeur, grain, fermeture sur des sachets gardés à des dates différentes. Tu ne copies pas une date vue ailleurs sans observation. Tu restes honnête sur tes moyens. Un sachet mal fermé raccourcit tout. La chaleur et le soleil aussi.","mod":"cap","li":3,"example":"Tu gardes trois sachets Baobab Bliss dans la pièce d’atelier. Tu ouvres à 10, 20 et 30 jours: tu notes couleur, odeur, grain, état de la fermeture, et les conditions de la pièce. Tu dates une conclusion provisoire.","next":"Lance un protocole simple: 3 sachets, 3 dates de contrôle, critères d’observation, conclusion provisoire datée.","alt":"Annoncer qu’un tô « se garde trois jours » sans jamais l’avoir regardé le troisième jour, c’est parler dans le vide.","hint":"Sur quoi t’appuies-tu pour la durée: une observation datée, ou une date entendue ailleurs ?"},{"keys":["plan_de_","geste"],"q":"Astuce « Plan de durée de vie » ?","a":"Décris les conditions de stockage à côté de chaque observation: pièce, chaleur ressentie, lumière. Une série à trente jours en pièce chaude ne vaut pas une promesse de six mois. Ancre la durée dans des observations datées, puis annonce une durée plus courte que le dernier point sain. Relis durée de vie et emballage ensemble.","mod":"cap","li":3,"example":"À 30 jours en pièce chaude sans soleil direct, odeur et grain restent bons. Tu annonces pour l’instant une durée plus courte que ce point, clairement liée à « sachet bien fermé, à l’abri du soleil », et tu dates la prudence.","next":"À côté de ta prochaine observation, écris pièce, chaleur ressentie et lumière avant de conclure.","alt":"Du mil gardé au frais sous le lit et le même mil au soleil du seuil ne racontent pas la même durée.","hint":"As-tu décrit où vivait le sachet, ou seulement le jour où tu l’as ouvert ?"},{"keys":["fiche_de","dossier"],"q":"But de « Fiche de coûts du dossier » ?","a":"La fiche reprend ta structure de revient avec des chiffres d’exemple clairement marqués ou tes vrais tickets. Tu montres variables, fixes, volume, coût complet, et un seuil de rentabilité. Une lectrice doit voir comment tu penses, pas seulement un prix final. Tu annexes la source de chaque chiffre. Tu dates. Tu relies coût et prix de lancement.","mod":"cap","li":4,"example":"Page recto Baobab Bliss: variables, fixes, volume prévu, coût complet, seuil entouré. Chaque ligne dit « ticket », « estimation » ou « exemple d’exercice ». Une phrase sous la page: « prix de lancement choisi parce qu’il couvre le coût au volume réaliste ».","next":"Prépare une page recto coûts plus une phrase de décision prix, avec source sur chaque chiffre.","alt":"Montrer le détail du prix d’une robe, pas seulement le total, aide la cliente à faire confiance au travail.","hint":"Chaque chiffre de ta fiche a-t-il un ticket, une estimation nommée, ou la mention d’exemple ?"},{"keys":["fiche_de","geste"],"q":"Astuce « Fiche de coûts du dossier » ?","a":"Si le volume réaliste change, recalcule la fiche le même jour. Sans source, le dossier devient fragile dès la première question simple. Ajoute une ligne main-d’œuvre si tu te verses une rémunération atelier, même modeste. Sinon le bénéfice mange un salaire invisible. Date la fiche et lie-la au prix de lancement choisi.","mod":"cap","li":4,"example":"Tu baisses le volume prévu du mois. Tu recalcules le jour même, tu ajoutes une petite ligne « ton temps atelier », tu dates, tu vérifies que le prix de marché couvre encore le total.","next":"Ajoute ou vérifie la ligne main-d’œuvre et recalcule si ton volume du mois a bougé.","alt":"Oublier de se compter dans le prix des beignets, c’est travailler pour la farine seule.","hint":"Ton temps apparaît-il quelque part sur la fiche, même modestement ?"},{"keys":["plan_de_","dossier"],"q":"But de « Plan de lancement » ?","a":"Le plan de lancement dit comment tu passes du dossier à la première vraie vague de ventes. Tu choisis un canal, un volume d’essai, un budget d’essais, une date de revue, et des critères continuer ou pas encore. Un lancement modeste maîtrisé bat une grande annonce vide. Après la revue tu écris: continuer, ajuster, ou pause.","mod":"cap","li":1,"example":"Page Baobab Bliss: canal marché du samedi; volume trente sachets; budget d’essais limité aux étiquettes et à la route; revue dans quinze jours; critère au moins huit rachats. Tu gèles le message oral pendant l’essai.","next":"Écris une page: canal, volume, budget d’essais, date de revue, critères, types de décision.","alt":"Ouvrir doucement un petit étal un jour par semaine, plutôt que d’annoncer une grande boutique vide.","hint":"As-tu déjà la date de revue et les critères écrits avant le premier sachet vendu ?"},{"keys":["plan_de_","geste"],"q":"Astuce « Plan de lancement » ?","a":"Gèle le message oral pendant l’essai: une seule phrase claire. Note les mots exacts avant la revue. Fixe un plafond de volume d’essai et tiens-le, même si l’enthousiasme monte. Évite de changer tamis, prix et sachet le même jour que le lancement. Après la revue, versionne le plan avec la décision et la date.","mod":"cap","li":5,"example":"Pendant quinze jours tu dis seulement « cent pour cent pulpe, rien d’ajouté ». Tu notes les phrases des clientes. Tu refuses de passer à, par exemple, soixante sachets alors que le plafond était de trente. Après revue tu écris « deuxième revue: continuer, ajuster la dose sur l’étiquette ».","next":"Fixe le plafond de volume et la phrase orale unique avant ton prochain essai de vente.","alt":"Changer la recette, le prix et l’assiette le jour où les invités arrivent, c’est ne plus savoir ce qui a marché.","hint":"Quel plafond de sachets refuses-tu de dépasser pendant l’essai, même si ça se vend bien ?"},{"keys":["triangle","iso","hasard"],"q":"Quelle est la chance de trouver l’intrus au hasard dans un triangle ?","a":"Dans un triangle, la chance de trouver l’intrus au hasard est d’une sur trois. Un seul verre sur trois est différent. Tu compares toujours le score du jury à ce repère avant de dire qu’une différence se sent. Sans cela, tu peux croire à une preuve qui n’est que de la chance.","mod":"m8","li":1,"example":"Douze personnes goûtent deux réglages de tamis de pain de singe. Quatre bonnes réponses, c’est exactement le hasard attendu. Tu notes: « pas de différence claire aujourd’hui » plutôt que de changer le tamis.","next":"Sur la feuille du prochain triangle, écris d’avance « repère hasard: 1 sur 3 » avant d’accueillir le jury.","alt":"Choisir une porte parmi trois sans indice: une fois sur trois on tombe juste, même les yeux fermés.","hint":"Combien d’intrus y a-t-il, et combien de verres au total ?"},{"keys":["hedonique","neuf"],"q":"Combien de crans a l’échelle de plaisir classique enseignée ?","a":"L’échelle de plaisir enseignée ici va de un à neuf. Tu rappelles la consigne à voix haute et tu changes de feuille par rapport au test de l’intrus. Les notes permettent des égalités. Sur un tout petit groupe tu restes prudente avec les moyennes.","mod":"m8","li":2,"example":"Pour le tô du matin, cinq voisines notent ta poudre entre six et huit sur neuf. Tu écris la question exacte et tu ne mélanges pas ces notes avec le score du triangle de la veille.","next":"Imprime ou dessine une ligne de un à neuf sur une feuille neuve pour la prochaine séance de plaisir.","alt":"Comme une règle de couture avec neuf marques: chacune place son coup de crayon sans que tu souffles sur la main.","hint":"Quel premier et quel dernier numéro annonces-tu quand tu poses l’échelle ?"},{"keys":["jury","stable"],"q":"Pourquoi préférer un petit jury stable ?","a":"Un petit jury stable apprend tes consignes et ton lexique. Six à douze personnes attentives valent mieux qu’une foule qui change à chaque fois. La stabilité réduit le bruit des malentendus. Tu décides à l’avance si le jury est naïf ou un peu entraîné, et tu l’écris en haut de la page.","mod":"m8","li":3,"example":"Les mêmes huit femmes reviennent pour comparer le grain. Elles connaissent déjà le silence et l’eau claire. Tu gagnes du temps d’explication et tu compares mieux d’une séance à l’autre.","next":"Coche sur ta liste les personnes que tu peux revoir au moins deux fois ce mois-ci.","alt":"Une équipe de cuisine qui revient chaque fête travaille plus vite qu’un groupe nouveau à chaque cérémonie.","hint":"Qu’est-ce qui se perd quand les visages changent à chaque dégustation ?"},{"keys":["moyenne","dispersion"],"q":"Que regarder en plus de la moyenne des poids de sachets ?","a":"Tu regardes aussi la dispersion: étendue ou écart. Une moyenne seule peu
