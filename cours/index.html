hets"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche la fonction.","hint2":"Élimine les paires absurdes.","solution":"Chaque élément a un rôle clair."},"exercise":{"prompt":"Fais un exercice de mock-retrait : choisis un lot et liste tous les endroits où ses sachets peuvent être.","hint1":"Carnet plus mémoire boutique.","hint2":"Chronomètre le temps de reconstruction.","solution":"Exemple modèle : lot … ; atelier 10 ; boutique 20 ; dégustation 15 ; temps 6 minutes ; trou identifié : une vente non notée."}},{"title":"Référentiels qualité : vue","body":["Au-delà de ton plan artisanal, tu entendras parler de référentiels: normes de management, référentiels privés de distributeurs, certifications. Ils ne sont pas obligatoires pour vendre aujourd’hui à Ouagadougou, mais ils montrent le langage des usines et des exportateurs.","Une norme de management de la sécurité des aliments décrit un système complet: politique, responsabilités, prérequis, analyse de ce qui peut nuire au produit, traçabilité, amélioration. Tu peux t’en inspirer chapitre par chapitre sans te certifier tout de suite.","Les référentiels privés (grandes enseignes) ajoutent souvent des exigences supplémentaires. Tu les regarderas seulement si un client les demande. D’ici là, ton plan simple et réel reste la priorité.","Objectif de la leçon: connaître les noms en couche expert, garder le calme en surface, et choisir conscient: « pas maintenant, mais je sais où chercher ». Ton badge du module, c’est la maîtrise quotidienne, pas un certificat mural. Quand un acheteur parle certification, demande quel schéma, quel délai, et qui paie l’audit. Réponds après ces trois réponses. Lis un seul chapitre de référentiel par mois et écris trois gestes atelier possibles. La lenteur intelligente gagne."],"prof":"Ne te laisse pas écraser par les sigles. Demande toujours: « Qu’est-ce que cela change concrètement dans mon atelier cette semaine ? » Si la réponse est « rien, sauf stress », tu reviens à ta liste de contrôle. Quand un acheteur export parlera certification, on ouvrira le pli expert ensemble et on fera un plan par étapes. Écris trois colonnes: déjà solide, ce mois-ci, plus tard. Les grandes normes vont dans « plus tard » tant qu’aucun client ne les paie.","tip":"Écris trois phrases : ce que tu fais déjà, ce que tu feras ce mois-ci, ce que tu laisses pour plus tard.","simple":"Comme apprendre la couture: d’abord un ourlet droit qui tient, ensuite les patrons compliqués. Ton ourlet, c’est le plan quotidien; les patrons, ce sont les grandes normes. Comme apprendre d’abord à faire un ourlet droit avant un costume brodé: les fondations avant les ornements.","plus":"Familles de référentiels: normes ISO de sécurité des aliments; programmes de certification reconnus par des initiatives mondiales (vues en expert); guides nationaux de bonnes pratiques. Avantages: langage commun, accès marché. Coûts: audit, temps, parfois équipements. Pour une micro-entreprise, la maturité progressive évite l’échec d’une certification trop tôt. Le Burkina a aussi des démarches de certification nationale via l’organisme de normalisation: utile selon canal. Les référentiels de management et les schémas privés partagent un langage: contexte, leadership, planification, support, réalisation, évaluation, amélioration. S’en inspirer chapitre par chapitre évite le mur de la certification précoce. Le coût d’un audit mal préparé décourage. La maturité progressive est une stratégie rationnelle. Le coût caché d’une certification trop tôt: temps, non-conformités, stress, éventuellement équipements. Calcule avant de signer. Un client qui exige sans contribuer au coût mérite une négociation claire. Auto-évaluation annuelle: score 1 à 5 sur hygiène, traçabilité, surveillance, documentation, revue. Photographier le tableau pour l’historique.","expert":"ISO 22000:2018 — Food safety management systems: approche High Level Structure; clause 4 contexte; 5 leadership; 6 planification; 7 support; 8 réalisation opérationnelle (PRP selon TS 22002-1 souvent, traçabilité, urgence, analyse de ce qui peut nuire au produit, CCP/OPRP, plan de maîtrise); 9 évaluation des performances; 10 amélioration. FSSC 22000 combine ISO 22000 + PRP sectoriels + exigences additionnelles. IFS Food et BRCGS Food sont des référentiels privés largement exigés par des distributeurs européens. GFSI reconnaît plusieurs schémas. Aucun n’est magique: sans PRP solides, un certificat est fragile. Pour Olga: feuille de route indicative — année 1 plan artisanal stable; année 2 mesures labo et traçabilité robuste; année 3+ étude de certification si un client paye le surcoût. ABNORM marque NBF: autre voie nationale de reconnaissance de conformité à des normes produits. ISO 22000:2018 structure HLS; PRP souvent via TS 22002-1; CCP et OPRP dans la clause opérationnelle. FSSC 22000, IFS, BRCGS: schémas souvent demandés par distributeurs UE. GFSI reconnaît plusieurs. Certification nationale via organisme de normalisation: autre voie. Feuille de route Olga: année 1 plan artisanal; année 2 labo et traçabilité; année 3+ certification si client finance. Aucun certificat ne remplace des PRP vivants. Comparatif schématique ISO management vs référentiels privés: ces derniers ajoutent souvent des exigences sur fraude alimentaire, culture sécurité, unsannounced audits. Lire un chapitre par trimestre en auto-formation suffit au début. Traduire chaque exigence en geste atelier avant d’acheter un audit. Les référentiels qualité ajoutent des exigences de système; ils ne remplacent pas les prérequis d’hygiène. Exemple (nombres inventés pour l’exercice): tu compares une clause de cahier des charges client avec ta pratique réelle et tu notes l’écart avant de signer.","quiz":[{"q":"Pour vendre aujourd’hui à Ouaga, tu dois d’abord :","choices":["Un plan quotidien réel","Un mur couvert de certificats vides","Ignorer toute hygiène"],"correct":0,"why_ok":"Le réel avant le décor.","why_ko":"Certificats vides ou hygiène ignorée ne construisent pas."},{"q":"Une grande norme de management :","choices":["Oblige à tout arrêter","Peut t’inspirer sans certification immédiate","Remplace le bon sens"],"correct":1,"why_ok":"Inspiration progressive.","why_ko":"Elle n’impose pas l’arrêt ni n’annule le bon sens."},{"q":"Les référentiels privés :","choices":["S’affichent sans lecture","Remplacent le carnet","Se regardent si un client les exige"],"correct":2,"why_ok":"Demande client.","why_ko":"Affichage aveugle ou suppression du carnet n’aident pas."},{"q":"Une feuille de route utile :","choices":["Promet tout pour demain matin","Étale les efforts dans le temps","Cache les coûts"],"correct":1,"why_ok":"Maturité progressive.","why_ko":"Promesses irréalistes ou coûts cachés cassent le projet."}],"activity":{"type":"tf","prompt":"Référentiels","statements":[{"t":"On peut s’inspirer d’une norme sans être certifiée tout de suite.","truth":true,"why":"L’esprit d’abord."},{"t":"Tous les sigles doivent apparaître sur l’étiquette cliente.","truth":false,"why":"L’étiquette reste simple et honnête."},{"t":"Un certificat sans bonnes pratiques solides reste fragile.","truth":true,"why":"Les fondations comptent."}]},"exercise":{"prompt":"Écris ta feuille de route en trois colonnes : déjà fait, ce mois-ci, plus tard (certifications éventuelles).","hint1":"Sois réaliste.","hint2":"Une page.","solution":"Exemple modèle : déjà : liste de contrôle et codes lot ; ce mois : revue écarts ; plus tard : étude labo et certification si client."}}],"m7":[{"title":"Les règles là où tu vends d’abord","body":["Les règles dépendent du lieu où tu vends. Aujourd’hui, Baobab Bliss vend à Ouagadougou. Tu commences donc par le cadre burkinabè et par les exigences de ton canal (marché, boutique, réseau). Tu n’affiches pas un règlement européen entier sur ton mur.","Fais deux colonnes sur une feuille: « obligatoire pour mon canal actuel » et « plus tard si j’exporte ». Mets une date de revue dans trois mois. Cela calme l’esprit et organise le travail.","Les détails d’articles et de normes vivent dans le pli expert. L’écran principal reste en langage clair: connaître les portes (normalisation, labo, hygiène de base) et préparer un dossier propre.","Ta responsabilité d’opératrice existe partout: tu mets sur le marché un produit sûr et loyal. Les textes précisent comment. Toi, tu retiens le geste: savoir ce qui s’applique vraiment à ton sachet. Mets une alarme calendrier dans trois mois pour relire tes deux colonnes. Les règles et ton canal peuvent avoir changé. Partage ta carte réglementaire avec Rachid une fois par trimestre. Quatre yeux voient mieux les trous. Quand une règle change, date la modification sur ta carte. Une carte sans dates devient une légende."],"prof":"Beaucoup d’artisanes se noient en voulant tout lire d’un coup. Toi, tu lis ce qui touche ton canal, tu notes deux contacts utiles, tu avances. Quand Rachid et toi préparerez un export, on ouvrira la colonne de droite ensemble. Pour l’instant, la colonne de gauche bien remplie suffit à dormir tranquille. Deux colonnes sur une feuille calment plus qu’un discours. Remplis la colonne de gauche cette semaine; la droite peut attendre un partenaire export.","tip":"Note aujourd’hui deux contacts : info normalisation, et un laboratoire d’analyses.","simple":"Les règles de ta cour d’abord, celles d’une autre ville ensuite. Tu ne peins pas ta maison avec le règlement d’un immeuble à Paris. Comme connaître d’abord les règles de ta cour avant celles d’une autre ville: tu vis ici, tu te mets en règle ici, tu prépares l’ailleurs sans panique.","plus":"Acteurs burkinabè utiles: organisme national de normalisation (catalogue de normes produits), structures d’analyses et d’alertes sanitaires, règles régionales d’union économique sur la sécurité sanitaire des aliments. Au niveau international, le Codex fournit des références. L’Union européenne devient pertinente si le produit est mis sur son marché. Pédagogie du cours: local d’abord, export ensuite, sans panique. La cartographie réglementaire évite la noyade. Local: normalisation, labo, hygiène de base, loyauté de l’étiquetage. Régional: principes de sécurité sanitaire de l’union économique. International: Codex comme référence. Européen: seulement si mise sur ce marché. Chaque porte a un contact à noter. Liste de contacts à jour: normalisation, laboratoire, chambre consulaires ou guichet export si besoin. Un numéro faux dans le carnet vaut zéro. Vérifie une fois par an. Distinction utile: règle obligatoire de ton canal versus bonne pratique volontaire. Tu marques chacune d’une couleur différente sur la carte. Commence par les règles du marché où tu vends aujourd’hui: loyauté, hygiène de base, métrologie du net. Quand tu viseras l’export, tu ajouteras le paquet du pays de destination sans abandonner le premier socle.","expert":"Cadre BF: ABNORM catalogue 2025 liste NBF 01-212:2018 « Pulpe du fruit de baobab (pain de singe): Spécifications » (7 pages) et NBF 01-211:2018 feuilles de baobab. Texte intégral des spécifications: à obtenir auprès d’ABNORM (accès payant typique des normes). ANSSEAT: analyses et alertes (ne pas revendiquer un contrôle officiel sans protocole). UEMOA Règlement n° 007/2007/CM/UEMOA: principes de sécurité sanitaire des végétaux, animaux et aliments; responsabilité des opérateurs alimentaires (art. 80 et s.); mesures fondées notamment sur Codex, OIE, CIPV. Codex: pas de norme CXS spécifique « pulpe de baobab » identifiée dans CCAFRICA au moment de la recherche du cours. UE: si mise sur le marché UE, paquet hygiène + INCO + contaminants + MCDA s’appliquent indépendamment du lieu de fabrication. BF: ABNORM NBF 01-212:2018 pulpe baobab (texte à acquérir). ANSSEAT pour analyses. UEMOA 007/2007: responsabilité opérateurs. Codex: pas de CXS baobab spécifique identifiée dans la recherche du cours. UE: 178/2002, 852/2004, 1169/2011, 2023/915, 1935/2004 si export. Pédagogie: ne pas afficher des numéros sur l’écran client; les garder pour le dossier. Revue trimestrielle de la carte réglementaire. Tableau de correspondance « exigence → preuve »: dénomination ↔ étiquette; lot ↔ fiche; hygiène ↔ liste de contrôle; analyses ↔ rapports. Ce tableau devient le squelette du dossier export. Mise à jour à chaque nouvelle preuve. Langage clair sur la face cliente; précision réglementaire dans le classeur. Veille réglementaire légère: une fois par semestre, vérifier si le catalogue national a bougé et si un règlement européen clé a été amendé (via importateur ou synthèses publiques). Consigner la date de veille dans le dossier.","quiz":[{"q":"Par où commencer les règles ?","choices":["Toujours par l’export européen d’abord","Par le lieu et le canal où tu vends maintenant","En ignorant toute règle"],"correct":1,"why_ok":"Le réel d’abord.","why_ko":"Export d’abord ou ignorance ne cadrent pas."},{"q":"À quoi servent deux colonnes actuel et export ?","choices":["Décorer seulement","Organiser sans se noyer","Remplacer l’hygiène"],"correct":1,"why_ok":"Priorisation claire.","why_ko":"Ni substitut d’hygiène ni pur décor."},{"q":"Le pli expert contient :","choices":["Les prix matériels inventés","Les numéros et détails de textes","Des blagues seulement"],"correct":1,"why_ok":"Profondeur réglementaire.","why_ko":"Pas des blagues ni des prix inventés."},{"q":"Mettre un produit sur le marché, c’est :","choices":["Copier une marque étrangère","Laisser tout au hasard","Assumer une responsabilité d’opératrice"],"correct":2,"why_ok":"Responsabilité claire.","why_ko":"Hasard ou copie ne remplacent pas la responsabilité."}],"activity":{"type":"tf","prompt":"Règles locales","statements":[{"t":"On commence par les exigences du lieu de vente actuel.","truth":true,"why":"Priorité canal."},{"t":"Il faut tout de suite appliquer un texte européen entier sur l’étiquette Ouaga.","truth":false,"why":"Tu ajoutes l’Europe si tu y vends."},{"t":"Noter des contacts utiles fait partie du travail.","truth":true,"why":"Portes à frapper."}]},"exercise":{"prompt":"Remplis les deux colonnes (actuel et export) avec au moins cinq lignes chacune et une date de revue.","hint1":"Reste concrète.","hint2":"Une page.","solution":"Exemple modèle : actuel : dénomination, poids, lot, hygiène, contact ; export : analyses contaminants, traçabilité renforcée, matériaux contact documentés, étiquetage information consommateurs."}},{"title":"Norme baobab burkinabè : ce qu’on sait","body":["Le Burkina a publié une norme de spécifications pour la pulpe du fruit de baobab, appelée aussi pain de singe. Son existence est confirmée dans le catalogue officiel de normalisation. Elle te donne un langage commun avec labos et acheteurs.","Le catalogue indique le titre et la pagination, pas tout le détail des seuils. Pour connaître les valeurs exactes (humidité, cendres, etc.), tu obtiens le texte auprès de l’organisme de normalisation. Tu n’inventes pas les chiffres.","En attendant le texte complet, tu peux déjà: dénommer honnêtement « pulpe de baobab en poudre », éviter les ajouts non déclarés, tenir hygiène et traçabilité, préparer des analyses quand ton budget le permet.","Le Sénégal a aussi une norme sur la pulpe conditionnée (référence voisine). Cela montre que la région travaille le sujet. Pour toi, la référence burkinabè reste le premier texte à lire. Dès que tu as le texte de la norme, surligne en une couleur ce qui touche la poudre emballée, en une autre ce qui touche l’étiquetage. Budgette l’achat de la norme dans ton enveloppe qualité. Un texte officiel fait partie de l’outil de travail."],"prof":"Ne stresse pas de ne pas avoir encore le PDF payant. Savoir que la norme existe, connaître son titre exact, et prévoir de l’acheter ou de la consulter, c’est déjà du travail d’ingénieure. Quand tu l’auras, on soulignera ensemble les clauses utiles à ton sachet. D’ici là, zéro chiffre inventé sur une étiquette. Savoir le titre exact de la norme et prévoir de l’acquérir, c’est déjà professionnel. Inventer un seuil pour faire sérieux, jamais.","tip":"Écris sur une carte le titre exact de la norme baobab burkinabè et range-la dans le carnet.","simple":"Comme savoir qu’il existe un règlement intérieur de l’école avant d’en réciter chaque article: tu connais le document, tu iras lire le détail au bureau. Tu notes le titre du document officiel, puis tu iras lire les articles au guichet quand tu pourras.","plus":"Normalisation nationale: outil de qualité et de commerce. La certification à une norme produit (marque nationale) est une démarche volontaire selon programmes. Elle peut ouvrir des rayons, mais coûte audits et conformité. Pour Baobab Bliss débutante, viser d’abord la conformité de fond (composition 100 pour cent pulpe, hygiène, étiquetage loyal) puis étudier la certification si un canal la demande. La normalisation produit crée un langage commun. La certification à la marque nationale est volontaire et coûteuse. Conformité de fond d’abord: composition, hygiène, étiquetage loyal. Le Sénégal a une norme voisine utile comme repère régional, pas comme substitut. Après acquisition du texte, fais une fiche d’une page « exigences retenues pour Baobab Bliss » avec renvoi aux clauses. Cela évite de ressortir les sept pages à chaque doute. Si le budget norme est serré, explore consultation sur place ou mutualisation avec une coopérative. L’utile est d’accéder au texte sans inventer. La norme burkinabè sur la pulpe (référence type NBF baobab) fixe des attentes de composition et d’hygiène à lire dans le texte officiel. Tu te procures la version en vigueur plutôt que de citer un résumé de mémoire.","expert":"ABNORM Catalogue des normes 2025: entrée « NBF 01-212:2018 — Pulpe du fruit de baobab (pain de singe): Spécifications », 1ère éd. 2018, 7 pages (section produits forestiers non ligneux). Voisine: NBF 01-211:2018 feuilles de baobab. note aux catalogues plus anciens qui ont pu permuter des numéros: se fier à la version 2025. Texte intégral non extrait dans la recherche du cours (norme à acquisition). Sénégal NS 03-085 « Bouy »: spécifications pulpe conditionnée (tolérances, présentation, étiquetage, contaminants, hygiène) — repère régional, pas substitut BF. Ne pas inventer dans le cours les seuils d’humidité ou microbiologiques de NBF 01-212 tant que le texte n’est pas lu. Processus: contacter ABNORM, acquérir, surligner clauses applicables à la poudre emballée, mettre à jour la liste de contrôle étiquette. Catalogue ABNORM 2025: NBF 01-212:2018 « Pulpe du fruit de baobab (pain de singe): Spécifications », 7 pages. NBF 01-211:2018 feuilles. Texte intégral non libre dans la recherche: acquisition nécessaire. NS 03-085 Sénégal « Bouy »: repère. Processus: contacter ABNORM, acquérir, surligner clauses poudre emballée, mettre à jour liste de contrôle. Interdiction pédagogique: inventer humidité ou micro seuils tant que non lus. Veille: catalogues ABNORM futurs peuvent réviser la norme. Abonnement ou passage annuel au catalogue. Si une révision paraît, budget d’achat et délai de mise en conformité. Communication clients: « nous suivons la norme burkinabè en vigueur » seulement si c’est vrai. Matrice de conformité interne après lecture: clause | applicable oui ou non | preuve actuelle | écart | délai. Cet outil d’ingénieure transforme un PDF en plan d’action. Revue à chaque lot majeur ou chaque trimestre.","quiz":[{"q":"Que confirme le catalogue 2025 ?","choices":["Qu’aucune norme n’existe","L’existence et le titre de la norme pulpe baobab","Tous les seuils détaillés ligne à ligne"],"correct":1,"why_ok":"Titre et pagination, pas le détail complet.","why_ko":"Le catalogue ne remplace pas le texte intégral."},{"q":"Que faire des seuils exacts avant d’avoir le texte ?","choices":["Les copier d’une rumeur","Ne pas les inventer sur l’étiquette","Les inventer pour faire sérieux"],"correct":1,"why_ok":"Honnêteté.","why_ko":"Invention et rumeur exposent."},{"q":"En attendant, tu peux déjà :","choices":["Affirmer un contrôle officiel sans protocole","Dénommer honnêtement et tenir hygiène et lots","Ajouter des poudres non déclarées"],"correct":1,"why_ok":"Gestes solides immédiats.","why_ko":"Affirmations fausses ou ajouts cachés ne vont pas."},{"q":"Une norme sénégalaise voisine :","choices":["Remplace automatiquement la norme locale","Est un repère, pas un remplaçant burkinabè","Est inutile à connaître"],"correct":1,"why_ok":"Repère régional.","why_ko":"Elle ne remplace pas le texte BF."}],"activity":{"type":"case","prompt":"Cas norme","story":"Une boutique te demande « ta conformité à la norme baobab » et tu n’as pas encore le texte.","q":"Que dis-tu ?","choices":["Je connais le titre exact, je vais l’acquérir, voici déjà mon hygiène et mes lots","Je nie l’existence de toute norme","J’invente des chiffres de seuils"],"correct":0,"why_ok":"Honnêteté plus plan.","why_ko":"Inventer ou nier casse la confiance."},"exercise":{"prompt":"Prépare un petit dossier : titre de la norme, contact pour l’obtenir, liste de ce que tu fais déjà sans le texte.","hint1":"Une page.","hint2":"Date.","solution":"Exemple modèle : titre exact de la norme baobab burkinabè ; contact organisme de normalisation ; déjà : 100 pour cent pulpe, lots, poids."}},{"title":"Paquet hygiène : idée d’ingénieure","body":["En Europe, un ensemble de textes encadre l’hygiène des aliments: responsabilité de l’exploitant, bonnes pratiques, procédures fondées sur l’analyse des points sensibles, contrôles officiels. On l’appelle souvent le paquet hygiène.","Même si tu vends à Ouaga, comprendre cette logique t’aide: c’est le langage des écoles d’ingénieurs françaises et des importateurs. Tu retiens l’esprit: maîtriser, tracer, pouvoir montrer ce que tu fais.","La flexibilité pour les petites structures existe dans ces textes: on ne demande pas à une micro-entreprise la même paperasse qu’à une usine. Mais on demande une maîtrise réelle, proportionnée.","Relie cette leçon à ton plan quotidien du module qualité. Le droit décrit l’obligation; ton carnet montre la preuve. Les deux se parlent. Relie chaque case de ta liste de contrôle du matin à l’esprit « maîtrise et preuve ». Si une case ne sert qu’à remplir le papier, remplace-la. Quand tu doutes entre deux exigences, choisis la maîtrise réelle d’abord, puis demande conseil écrit. Traduis une exigence du pli expert en une case de liste de contrôle. Si tu ne peux pas la traduire, elle n’est pas encore opérationnelle.","Le paquet hygiène européen repose sur la responsabilité de l’opérateur, des procédures proportionnées et des preuves. L’idée d’ingénieure: écrire peu, mesurer juste, corriger vite. Chez Baobab Bliss, trois preuves datées battent un discours long."],"prof":"Tu n’as pas à devenir juriste. Tu as à comprendre trois mots: responsabilité, proportionnalité, preuve. Quand un futur importateur parlera de plan de maîtrise formel ou d’hygiène européenne, tu sauras que cela rejoint ce que tu as déjà commencé, en plus formel. On gardera les numéros d’articles dans le pli expert. Trois mots suffisent pour l’esprit: responsabilité, proportionnalité, preuve. Ton carnet est la preuve; ton lave-mains est la proportionnalité vécue.","tip":"Reformule en une phrase l’esprit du paquet hygiène pour ton atelier.","simple":"Les règles de la cantine scolaire: chacun est responsable de sa propreté, on écrit les contrôles utiles, on ne noie pas une petite cantine sous les mêmes piles qu’un grand hôpital, mais on ne laisse pas non plus la saleté. Comme les règles d’une petite cantine: chacun nettoie, on note l’essentiel, on ne copie pas le classeur d’un hôpital entier, mais on ne laisse pas la saleté non plus.","plus":"Piliers: food law générale (sécurité, traçabilité, retrait), hygiène de tous les exploitants, règles spécifiques selon denrées, critères microbiologiques, contrôles officiels. Étiquetage et contaminants complètent le tableau pour la mise sur le marché. Guides de bonnes pratiques validés aident, sans effacer la responsabilité. Le paquet hygiène européen articule loi générale, hygiène des exploitants, règles spécifiques, critères microbiologiques et contrôles officiels. La flexibilité pour petites structures existe. L’esprit rejoint ton plan quotidien. Les numéros d’articles vivent dans le pli expert. Guides de bonnes pratiques sectoriels, quand ils existent, aident à traduire le droit. Ils ne remplacent pas ta responsabilité. Lis-les comme des suggestions structurées. Critères microbiologiques européens ne s’appliquent pas tous aux poudres végétales sèches de la même façon. Lis la denrée visée avant de copier un tableau. Les contrôles officiels existent pour vérifier la réalité, pas pour remplacer ton plan. Arrive préparée avec fiches et lots lisibles si un contrôle survient un jour.","expert":"Règlement (CE) 178/2002: principes généraux, EFSA, traçabilité art. 18, retrait art. 19, sécurité art. 14. Règlement (CE) 852/2004: hygiène; art. 5 procédures fondées sur principes HACCP après production primaire; annexes GHP; flexibilité PME (récital 15). Règlement (CE) 853/2004: denrées d’origine animale (peu central pour pulpe végétale, mais cadre IAA). Règlement (CE) 2073/2005: critères microbiologiques. Règlement (UE) 2017/625: contrôles officiels. En France: DGAL (sanitaire) et DGCCRF (loyauté, étiquetage, matériaux contact) se partagent des rôles; vérifier organigrammes à jour. Pour un export BF→UE: l’importateur UE et le producteur doivent assurer la conformité du produit mis sur le marché UE. 178/2002 (sécurité, traçabilité art.18, retrait art.19). 852/2004 art.5 procédures fondées sur principes HACCP; flexibilité PME. 853/2004 (origine animale, peu central ici). 2073/2005 critères micro. 2017/625 contrôles officiels. France: DGAL et DGCCRF se partagent des rôles. Export BF vers UE: conformité du produit mis sur le marché UE, souvent via importateur vigilant. Ton PMS artisanal est la base traduction. Articulation PRP et procédures fondées sur les principes: les PRP réduisent la charge globale; les points critiques ciblent ce qui reste essentiel. Confusion fréquente: tout transformer en point critique. Enseignement ingénieur: d’abord solide en prérequis, ensuite ciblage. Preuves: enregistrements proportionnés à la taille. Étude de cas pédagogique: petite unité fruits séchés qui a documenté PRP solides et trois CCP seulement, acceptée par un importateur grâce à la clarté plus qu’au volume. Message: proportionnalité crédible. Adapter à Baobab Bliss sans copier aveuglément. Règlements (CE) 178/2002 et 852/2004: sécurité, traçabilité, hygiène des denrées. Exemple (nombres inventés pour l’exercice): tu prépares une page des responsabilités — qui décide un blocage de lot — avant la haute saison.","quiz":[{"q":"L’esprit utile pour toi :","choices":["Ignorer toute preuve","Maîtriser, tracer, pouvoir montrer","Recopier cent pages sur l’étiquette"],"correct":1,"why_ok":"Preuve proportionnée.","why_ko":"Ignorer ou noyer l’étiquette n’aident pas."},{"q":"Les petites structures :","choices":["Sont exemptes de toute hygiène","Doivent toutes construire une usine demain","Ont droit à une flexibilité, pas à une absence de maîtrise"],"correct":2,"why_ok":"Proportionnalité.","why_ko":"Ni exemption totale ni usine obligatoire immédiate."},{"q":"Ton carnet sert de :","choices":["Remplaçant du lavage","Décor uniquement","Preuve de ce que tu fais"],"correct":2,"why_ok":"Lien droit-pratique.","why_ko":"Ni pur décor ni substitut d’hygiène."},{"q":"Le paquet hygiène concerne surtout :","choices":["Uniquement la décoration","Uniquement le prix du transport","La mise sur le marché européen et le langage ingénieur"],"correct":2,"why_ok":"Cadre Europe et formation.","why_ko":"Pas décor ni transport seuls."}],"activity":{"type":"match","prompt":"Relie idée et texte (vue simple)","left":["Responsabilité et traçabilité","Hygiène au quotidien","Contrôles par l’autorité"],"right":["Loi générale alimentaire","Règles d’hygiène exploitants","Contrôles officiels"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche le rôle.","hint2":"Élimine les absurdes.","solution":"Chaque idée a son pilier."},"exercise":{"prompt":"Écris en cinq lignes comment ton plan quotidien répond déjà à l’esprit « maîtriser, tracer, montrer ».","hint1":"Sans jargon.","hint2":"Une page.","solution":"Exemple modèle : liste de contrôle ; codes lot ; enregistrements ; corrections ; revue mensuelle."}},{"title":"Contaminants : lire une annexe","body":["Les contaminants sont des substances indésirables qui peuvent se trouver dans un aliment (par exemple certaines moisissures produisent des toxines). Les règlements fixent des teneurs maximales selon les catégories d’aliments.","Pour exporter vers l’Europe, tu apprends à lire une annexe: tu cherches la catégorie la plus proche de ton produit, tu notes les teneurs, tu fais analyser un échantillon par un labo compétent. Tu n’inventes pas un chiffre « baobab » s’il n’est pas nommé.","Le baobab n’apparaît pas toujours nommément. Il peut entrer dans une catégorie large (fruits séchés, etc.). Le choix de catégorie a des conséquences: tu te fais accompagner pour ne pas te tromper.","Même pour Ouaga, la vigilance hygiène contre les moisissures et un stockage sec restent utiles. L’analyse labo devient surtout critique quand un canal l’exige ou quand tu exportes. Range les rapports d’analyse avec le lot concerné. Un beau rapport sans lien de lot ne sert presque à rien en cas de question. Ne mélange pas les échantillons de lots différents dans le même sachet d’analyse. L’étiquette d’échantillon est sacrée. Refuse un rapport d’analyse sans nom de lot clair. Tu le renvoies au labo pour correction avant classement."],"prof":"Cette leçon t’apprend une compétence d’ingénieure: lire une table réglementaire sans paniquer. Tu soulignes la ligne, tu copies la teneur, tu demandes un devis d’analyse. Tu ne publies pas un seuil inventé sur WhatsApp. Si la catégorie est ambiguë, tu notes la question pour un expert réglementaire ou l’importateur. Lire une annexe, c’est souligner une ligne, copier une teneur, demander un devis. Ce n’est pas publier un chiffre inventé sur la place publique.","tip":"Sur une feuille, écris les trois gestes : trouver la catégorie, noter la teneur, faire analyser.","simple":"Comme lire le tableau des frais de scolarité: tu cherches la ligne qui correspond à ta classe, tu ne inventes pas un montant. Ici tu cherches la ligne alimentaire qui correspond à ton produit. Tu cherches la bonne ligne du tableau, comme pour ta classe à l’école, sans inventer un montant.","plus":"Mycotoxines (aflatoxines, etc.), métaux, autres contaminants: listes réglementaires périodiquement mises à jour. Le règlement européen 2023/915 remplace d’anciennes listes. Les aflatoxines sur fruits séchés ont des teneurs distinctes selon que le produit part au tri ou est prêt pour le consommateur. Les fruits secs spécifiques (ex. figues) ont parfois leurs propres lignes. Les listes de contaminants évoluent. Les mycotoxines sur fruits séchés ont des teneurs selon le stade (à trier ou prêt consommateur). Le baobab non nommé exige une hypothèse de catégorie confirmée. L’hygiène contre les moisissures reste utile même sans export. Plan d’échantillonnage: mieux vaut un protocole simple respecté qu’un plan savant abandonné. Note masse prélevée, date, lot, labo, délai de rendu. Conservation des rapports: durée au moins égale à la durée de vie plus marge, à l’abri de l’humidité, copies numériques si possible. Calendrier d’analyses: fixe deux fenêtres dans l’année liées à la saison d’achat des fruits. Improviser sous pression donne des protocoles faibles.","expert":"Règlement (UE) 2023/915, annexe I, section mycotoxines aflatoxines: pour « dried fruits » destinés à un traitement physique avant consommateur final (sauf figues): B1 5,0 µg/kg; somme B1+B2+G1+G2 10,0 µg/kg. Pour dried fruits placés sur le marché pour le consommateur final ou utilisés comme ingrédient (sauf figues): B1 2,0 µg/kg; somme 4,0 µg/kg. Figues séchées: lignes séparées (B1 6,0; somme 10,0). Le baobab n’est pas nommé séparément dans les extraits consultés: l’assimilation à « other dried fruits » est une hypothèse de travail à confirmer avec l’autorité ou l’importateur avant export. Ne jamais coller un chiffre sur l’étiquette grand public comme claim. Plan: devis ANSSEAT ou labo accrédité; plan d’échantillonnage; conservation des rapports. Règlement (UE) 2023/915 aflatoxines dried fruits (sauf figues): avant traitement physique B1 5,0 µg/kg somme 10,0; prêt consommateur B1 2,0 somme 4,0. Figues: lignes séparées. Assimilation baobab = hypothèse à confirmer. Plan: devis labo, échantillonnage, conservation rapports. Pas de claim chiffré sur WhatsApp grand public. Incertitude de catégorie: documente la question posée à l’importateur ou à l’autorité, la date, la réponse. Ne laisse pas l’hypothèse « fruits séchés » non confirmée devenir un dogme interne. Réévaluation si le règlement change (surveillance annuelle du numéro consolidé). Autres contaminants possibles selon catégorie future (métaux, etc.): ne pas ouvrir tous les chantiers d’un coup. Priorité mycotoxines si fruits séchés retenus comme catégorie. Budget analyses: planifier deux campagnes par an plutôt qu’une improvisation. Les annexes contaminants (UE 2023/915 et textes locaux) se lisent par denrée. Exemple (nombres inventés pour l’exercice): tu surlignés la ligne candidate pour ton produit avec le labo, sans recopier la limite des arachides sur la pulpe.","quiz":[{"q":"Que faire si le baobab n’est pas nommé dans une annexe ?","choices":["Chercher la catégorie proche et faire confirmer","Inventer une ligne « baobab »","Ignorer toute analyse pour toujours"],"correct":0,"why_ok":"Catégorie plus confirmation.","why_ko":"Invention ou ignorance totale ne vont pas."},{"q":"Les teneurs pour fruits séchés prêts consommateur sont souvent :","choices":["Inexistantes","Plus basses que pour ceux encore à trier","Identiques toujours aux arachides"],"correct":1,"why_ok":"Lignes distinctes dans l’annexe.","why_ko":"Pas forcément les arachides, et les lignes existent."},{"q":"Sur WhatsApp grand public, tu :","choices":["Copies un concurrent","N’affiches pas un seuil réglementaire inventé","Publies des chiffres au hasard"],"correct":1,"why_ok":"Honnêteté.","why_ko":"Hasard ou copie ne sont pas une lecture d’annexe."},{"q":"Les trois gestes clés :","choices":["Logo, slogan, musique","Catégorie, teneur, analyse","Prix inventé, oubli, précipitation"],"correct":1,"why_ok":"Méthode ingénieur.","why_ko":"Marketing creux ou précipitation n’analysent pas."}],"activity":{"type":"tf","prompt":"Contaminants","statements":[{"t":"On lit d’abord la catégorie dans l’annexe.","truth":true,"why":"Méthode."},{"t":"On peut inventer un seuil baobab pour l’étiquette.","truth":false,"why":"Interdit d’inventer."},{"t":"Un labo compétent mesure sur un échantillon.","truth":true,"why":"Preuve analytique."}]},"exercise":{"prompt":"Simule une lecture d’annexe : écris la catégorie que tu croiserais pour un fruit séché prêt à consommer et les teneurs aflatoxines associées (d’après la leçon expert), puis note « à confirmer pour baobab ».","hint1":"Sans inventer d’autre chiffre.","hint2":"Une demi-page.","solution":"Exemple modèle : catégorie fruits séchés consommateur ; B1 2,0 µg par kg ; somme 4,0 µg par kg ; confirmation catégorie baobab en attente."}},{"title":"Étiquetage loyal","body":["Un étiquetage loyal dit ce que le produit est, sans tromper. Pour Baobab Bliss: dénomination claire (pulpe de baobab en poudre), poids net, identification du lot, coordonnées de la responsable, et la promesse « 100 pour cent pulpe, rien d’ajouté » seulement si elle est vraie.","Tu n’ajoutes pas de date de péremption inventée ni de mentions médicales. Tu peux indiquer une période d’utilisation conseillée si tu as une base, ou simplement le cadre de conservation: lieu sec, à l’abri de l’humidité.","Les allégations santé (« soigne », « guérit ») sont interdites dans l’esprit des règles loyales. Tu parles de goût, d’usage en cuisine, de composition. Tu laisses la médecine aux médecins.","Avant export européen, d’autres mentions deviennent obligatoires (langue, nutrition dans certains cas, allergenes si présents). Pour Ouaga, commence par loyal et lisible. Le détail des articles vit dans le pli expert. Fais lire l’étiquette à une voisine non experte. Si elle ne comprend pas la dénomination, simplifie encore. Versionne ton étiquette: v1, v2, date. Un carton d’anciennes versions part à part pour éviter les mélangeages.","Étiquetage loyal: dire vrai, assez clair, sans tromper sur la nature ou la quantité. Une photo trop belle qui n’est pas le produit vendu crée un écart. Tu alignes oral et sachet."],"prof":"Relis ton étiquette comme si tu étais une cliente pressée au marché. Est-ce que tu comprends en trois secondes ce que tu achètes ? Est-ce qu’une promesse est tenue ? Si oui, tu es sur la bonne voie. Si une phrase sonne « miracle », tu la rayes. Je suis là pour t’aider à trouver des formulations calmes et vraies. Relis l’étiquette à voix haute comme une cliente pressée. Si une phrase sonne miracle, tu la rayes. Clair, vrai, lisible.","tip":"Prends une photo de ton étiquette actuelle et coche les cinq points : nom, poids, lot, contact, promesse vraie.","simple":"Comme présenter un plat à table devant des invités: tu nommes le mets, tu indiques la portion, tu dis qui a cuisiné, et tu restes honnête sur les ingrédients. Tu laisses la médecine aux médecins et tu gardes des mots calmes que tout le monde comprend.","plus":"Loyauté = information exacte, suffisante, non trompeuse. Allégations nutritionnelles et de santé: cadres stricts (en UE, règlement 1924/2006). « 100 pour cent pulpe » est une allégation de composition: elle exige l’absence d’ajouts. Poids net: mesurage fiable. Lot: lien traçabilité. Pour export UE: règlement 1169/2011 (INCO) — dénomination, liste d’ingrédients, allergènes, quantité nette, DDM ou DLC selon cas, conditions de conservation, nom et adresse de l’exploitant, pays d’origine si requis, déclaration nutritionnelle sauf exemptions. Loyauté: information exacte et non trompeuse. « 100 pour cent pulpe » exige l’absence d’ajouts. Allégations de santé: cadres stricts; mieux les éviter. Export: information des consommateurs avec mentions obligatoires selon le pays cible. Traduction éventuelle: si tu vends à des clientes qui lisent une autre langue locale, une deuxième ligne claire peut aider, sans surcharger. Garde la loyauté dans toutes les langues utilisées. Mentions volontaires utiles: mode d’emploi simple (saupoudrer, diluer). Mentions volontaires dangereuses: tout claim santé. Choisis la première famille.","expert":"UE 1169/2011: informations obligatoires art. 9; présentation art. 13 (lisibilité, taille minimale dans certains cas); dénomination art. 17; liste d’ingrédients art. 18; substances provoquant allergies annexe II; date de durabilité minimale vs date limite de consommation art. 24; déclaration nutritionnelle art. 30 et s. Allégations: 1924/2006 — listes autorisées, conditions d’emploi; interdiction des allégations médicinales sur denrées. Matériaux d’emballage: informations migratoires et aptitude au contact alimentaire (1935/2004) ne s’impriment pas toutes sur l’étiquette commerciale, mais doivent être documentées. Pour Baobab Bliss Ouaga: liste de contrôle minimale — dénomination FR, poids, lot, « ton nom et ton adresse », « 100 % pulpe, rien d’ajouté » si vrai, conservation au sec. Ne pas mettre d’allégation santé. Version publique d’un site: laisser nom et quartier vides si publication ouverte. UE 1169/2011 art.9 et suivants; 1924/2006 allégations; interdiction allégations médicales sur denrées. liste de contrôle Ouaga: dénomination, poids, lot, contact, promesse vraie, conservation au sec. Version publique web: anonymiser nom et quartier si besoin. Matériaux contact documentés à part. Contrôle pré-impression: relecture à deux voix, liste de contrôle mentions, preuve de poids net (échantillonnage balance). Archivage du BAT (bon à tirer) daté. Modification d’étiquette = nouveau numéro de version. Évite les stocks d’étiquettes obsolètes qui trompent. Cas d’étiquettes refusées en contrôle: caractères illisibles, allégation santé, poids net faux, lot absent. liste de contrôle anti-refus avant chaque réimpression. Responsabilité loyauté: même hors Europe, tromper une cliente détruit Baobab Bliss plus vite qu’un concurrent. Loyauté et information du consommateur se contrôlent autant que la chimie. Exemple (nombres inventés pour l’exercice): écart constaté entre dénomination sur message et sachet; tu corriges le message le jour même et tu archives les deux versions.","quiz":[{"q":"Une promesse « 100 pour cent pulpe » exige :","choices":["Une allégation médicale","Qu’il n’y ait vraiment aucun ajout","Un beau dessin seulement"],"correct":1,"why_ok":"Vérité de composition.","why_ko":"Dessin ou médecine ne remplacent pas la vérité."},{"q":"Les mentions « soigne » ou « guérit » :","choices":["Remplacent le poids net","N’ont pas leur place sur une denrée","Sont obligatoires"],"correct":1,"why_ok":"Pas de claim médical.","why_ko":"Ni obligatoires ni substitut du poids."},{"q":"Pour une cliente pressée, l’étiquette doit :","choices":["Multiplier le jargon","Cacher le lot","Être claire en quelques secondes"],"correct":2,"why_ok":"Lisibilité.","why_ko":"Cacher ou noyer n’aident pas."},{"q":"Avant un export européen, tu étudieras notamment :","choices":["Le règlement d’information des consommateurs","Uniquement le prix du transport","Uniquement la couleur du logo"],"correct":0,"why_ok":"Cadre d’information des consommateurs.","why_ko":"Logo ou transport seuls ne suffisent pas."}],"activity":{"type":"label","prompt":"Place les mentions sur le sachet","labels":["Dénomination","Poids net","Code lot","Contact","Promesse vraie"],"correct":{"0":"dénomination","1":"poids","2":"lot","3":"contact","4":"promesse"},"hint1":"Du haut vers les infos utiles.","hint2":"Pas de claim médical.","solution":"Dénomination, poids, lot, contact, promesse vraie.","svg":"<svg viewBox=\"0 0 200 160\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n<rect x=\"50\" y=\"20\" width=\"100\" height=\"120\" rx=\"8\" fill=\"#fff\" stroke=\"#1d1d1f\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"40\" x2=\"150\" y2=\"40\" stroke=\"#0071e3\" stroke-width=\"4\"/>\n<rect x=\"65\" y=\"55\" width=\"70\" height=\"40\" rx=\"4\" fill=\"#e8f1ff\" stroke=\"#0071e3\"/>\n<text x=\"100\" y=\"80\" text-anchor=\"middle\" font-size=\"11\">étiquette</text>\n<text x=\"100\" y=\"130\" text-anchor=\"middle\" font-size=\"10\">fond</text>\n</svg>"},"exercise":{"prompt":"Réécris ton étiquette en cinq lignes maximales, sans claim médical, avec lot et poids.","hint1":"Relis à voix haute.","hint2":"Une page.","solution":"Exemple modèle : Pulpe de baobab en poudre ; 300 g ; lot … ; contact … ; 100 pour cent pulpe, rien d’ajouté ; conserver au sec."}},{"title":"Préparer un dossier export (sans stress)","body":["Un jour, tu voudras peut-être vendre hors du Burkina. Ce jour-là, tu ne improvises pas la veille. Tu prépares un dossier progressivement: identité produit, process, analyses, traçabilité, emballage contact alimentaire, étiquetage cible.","Le dossier n’est pas un roman. C’est un classeur clair: une fiche produit, des rapports de labo datés, un schéma de fabrication, un modèle d’étiquette, les contacts utiles. Tu ajoutes pièce par pièce selon ton rythme de douze à dix-huit mois.","Tu travailles avec ton importateur ou ton partenaire commercial: c’est souvent lui qui connaît les exigences exactes du pays d’arrivée. Tu poses des questions écrites. Tu gardes les réponses.","Pour l’instant, si tu vends seulement à Ouaga, ce dossier est un projet « colonne de droite ». Tu y avances quand tu as de l’énergie, sans culpabilité. Le badge du module, c’est de savoir ce qui t’attend, pas d’exporter demain. Ajoute dans la pochette export une page « questions pour l’importateur ». Chaque réponse écrite évite une rumeur. Ferme chaque trimestre par un score de complétude du dossier. Célèbre une pièce ajoutée, sans dramatiser le reste.","Un dossier export rassemble identité du produit, procédé, analyses pertinentes, étiquette, et traçabilité. Tu avances pièce par pièce. Une liste de contrôle datée suffit pour démarrer la conversation avec un importateur ou un labo."],"prof":"Respire. Export ne veut pas dire « tout changer cette semaine ». Cela veut dire « savoir la liste ». On coche ensemble. Chaque pièce que tu ajoutes (un devis labo, une fiche lot modèle) te rapproche. Je reste calme avec toi: une pièce, une semaine, une revue. Tu n’es pas seule. Une pochette « export un jour » avec huit cases suffit pour commencer. Une pièce par mois bat un roman écrit la veille.","tip":"Crée une pochette « export un jour » et glisse-y une page de liste de contrôle vide à remplir.","simple":"Comme préparer un voyage: tu ne prends pas l’avion sans passeport, mais tu peux commencer par faire la liste des affaires longtemps à l’avance, sans paniquer. Comme préparer un voyage longtemps à l’avance: tu fais la liste des affaires sans paniquer, tu coches quand tu peux.","plus":"Contenu type d’un dossier: description produit (dénomination, composition, poids, DDM estimée), diagramme process, PRP et plan de maîtrise résumé, preuves traçabilité, rapports contaminants et microbiologie selon exigence, déclaration de conformité matériaux d’emballage, étiquette cible langue du pays, contacts ABNORM et labo. Incoterms et formalités douanières: avec le partenaire commercial. Coûts: analyses, éventuelle certification, transport, assurance. Dossier type: fiche produit, schéma process, plan de maîtrise résumé, preuves lots, rapports labo, conformité emballage, étiquette cible, contacts. L’importateur clarifie souvent le pays d’arrivée. Coûts à anticiper: analyses, transport, éventuelle certification. Assurance et transport font partie du dossier commercial autant que le labo. Note les questions même si les réponses viennent plus tard. Le dossier grandit par couches. Revue avec importateur: ordre du jour type en une page. Tu poses les questions de catégorie contaminants et d’étiquetage langue cible en premier. Index du dossier en première page: numéro de pièce, titre, date, statut. Sans index, le classeur est une boîte opaque même remplie.","expert":"Check-list export UE indicative (non exhaustive): conformité 178/2002 (sécurité, traçabilité); hygiène 852/2004 et plan HACCP proportionné; contaminants 2023/915 (catégorie à confirmer pour baobab); éventuels critères 2073/2005 selon usage; étiquetage 1169/2011; allégations 1924/2006 si utilisées (éviter); matériaux contact 1935/2004 et 10/2011 (plastiques) avec DoC fournisseur; novel food: le baobab pulp a un historique UE (vérifier statut à jour auprès de l’importateur / Commission — ne pas inventer un statut); contrôles à l’importation selon 2017/625 et mesures spécifiques éventuelles. Burkina / UEMOA: formalités d’exportation nationales et régionales à coordonner avec les services compétents. Plan 12–18 mois Baobab Bliss: mois 1–3 stabiliser Ouaga; 4–6 devis labo + acquisition NBF; 7–12 premier jeu d’analyses et dossier brouillon; 13–18 partenaire importateur et revue étiquette cible. Aucun chiffre de vente inventé. Check-list UE indicative: 178/2002, 852/2004, 2023/915 (catégorie à confirmer), 1169/2011, 1935/2004 et 10/2011, statut novel food à vérifier sans invention, 2017/625. Plan 12–18 mois: stabiliser Ouaga; devis labo et norme; analyses; partenaire. Gouvernance du dossier: une seule personne responsable (toi), un calendrier trimestriel, un indice de complétude (pour cent cases vertes). Partage sécurisé avec Rachid pour relecture. Aucune envoi à un tiers sans liste des pièces transmises. Journal des versions du dossier. Livrable final pédagogique du module: dossier export brouillon à 60 pour cent avec pages manquantes clairement listées. Ce n’est pas un échec: c’est un état d’avancement honnête. Prochaine étape naturelle: module statistiques et coûts pour dimensionner les analyses. Pièces types: diagramme, plan de maîtrise, bulletins (microbio, contaminants selon exigence), maquette conforme au marché cible, preuves de traçabilité. Exemple (nombres inventés pour l’exercice): tu classes six pièces dans un classeur à onglets avant tout envoi d’échantillon.","quiz":[{"q":"Un dossier export se construit :","choices":["La veille du départ seulement","En inventant les rapports","Pièce par pièce dans le temps"],"correct":2,"why_ok":"Progression.","why_ko":"Improvisation ou invention cassent la confiance."},{"q":"L’importateur sert souvent à :","choices":["Remplacer ton hygiène locale","Écrire tes recettes secrètes","Clarifier les exigences du pays d’arrivée"],"correct":2,"why_ok":"Exigences marché.","why_ko":"Il ne remplace ni hygiène ni recettes."},{"q":"Si tu vends seulement à Ouaga, le dossier export :","choices":["Peut avancer sans pression","Est inutile à connaître","Est obligatoire dès demain"],"correct":0,"why_ok":"Colonne de droite utile.","why_ko":"Ni urgence artificielle ni ignorance."},{"q":"Une pièce utile tôt :","choices":["Une allégation médicale","Un devis d’analyse labo","Un slogan creux"],"correct":1,"why_ok":"Preuve analytique en préparation.","why_ko":"Slogan ou médecine ne constituent pas un dossier."}],"activity":{"type":"order","prompt":"Mets dans l’ordre une préparation douce","steps":["Stabiliser les ventes locales","Obtenir devis labo et norme","Réunir analyses et schéma process","Travailler l’étiquette avec un partenaire"],"correct":[0,1,2,3],"hint1":"Commence stable, finis avec le partenaire.","hint2":"Ne commence pas par l’étiquette export.","solution":"Progression sur 12 à 18 mois."},"exercise":{"prompt":"Remplis une liste de contrôle export à 8 cases (produit, process, labo, lots, emballage, étiquette, contacts, partenaire) en cochant « fait, en cours, ou plus tard ».","hint1":"Sois honnête.","hint2":"Une page.","solution":"Exemple modèle : produit fait ; process en cours ; labo plus tard ; etc."}}],"m8":[{"title":"Tes sens et ce qui les trompe","body":["Tes cinq sens jugent le pain de singe avant toute analyse de laboratoire. L’œil voit une couleur crème, beige ou un peu grise. Le nez sent une acidité douce ou une odeur de renfermé. La bouche lit l’acidité, une pointe sucrée et le grain de la poudre. Chez Baobab Bliss, tu goûtes toujours le même jour, au même endroit calme, avec la même cuillère propre, et tu notes l’heure sur le carnet de lot.","Les sens se trompent facilement si le cadre bouge. Une lumière jaune change la couleur perçue. Un sachet ouvert depuis la veille sent plus fort qu’un sachet fraîchement ouvert. Si tu viens de manger une mangue très sucrée, le prochain goût de poudre paraît plus acide. Tu notes donc la lumière, l’heure, et ce que tu as mangé juste avant. Tu te rinces la bouche à l’eau claire entre deux goûts.","Pour un futur produit séché comme la mangue ou la tomate, tu ouvres une page de carnet séparée. La pulpe de baobab est déjà sèche dans la gousse; la mangue demande un vrai séchage chaud. Les règles des sens restent les mêmes, le produit change. Tu ne mélanges jamais les deux séances le même après-midi, pour ne pas comparer des choses trop différentes d’un seul trait.","Aujourd’hui, choisis trois sachets Baobab Bliss du même lot. Goûte-les en silence. Pour chacun, note couleur, odeur, grain et acidité en trois mots. Compare ensuite à voix haute. Tu verras vite ce qui vient vraiment du produit et ce qui vient de la pièce, de la fatigue ou du dernier repas."],"prof":"Tes sens sont des outils de mesure humaine. Ils demandent un cadre stable: même heure, même lumière, bouche propre, silence pendant le goût. Si le cadre bouge, tu juges la pièce plus que la poudre. Commence petit et régulier: trois sachets, une page datée, une conclusion en une phrase. N’essaie pas de tout juger le même jour. La constance bat l’exploit isolé.","tip":"Rince-toi la bouche à l’eau claire entre deux goûts et attends une trentaine de secondes.","simple":"Comme juger trois bols de bouillie de mil sous une ampoule jaune puis sous le soleil du matin: la même recette paraît différente. Tu stabilises d’abord la pièce et la lumière, ensuite tu juges le bol. Garde cette image pour cette leçon: d’abord le cadre, ensuite le jugement.","plus":"En analyse sensorielle, on distingue trois grandes familles de questions. La détection demande: y a-t-il quelque chose? La discrimination demande: ces deux échantillons diffèrent-ils? La description demande: quels mots stables décrivent ce que je perçois? Les biais classiques portent des noms simples. L’effet d’ordre fait que le premier goût influence le suivant. L’effet de contraste fait qu’un échantillon très acide rend le suivant plus doux. L’adaptation fait que le nez se fatigue après quelques minutes dans la même odeur. On limite ces biais par la randomisation de l’ordre, le rinçage à l’eau, le silence, et des codes à trois chiffres tirés au sort avant la séance. Pour la pulpe de baobab, un petit lexique d’atelier utile compte souvent: couleur crème à beige, odeur acidulée, grain fin ou grossier, acidité, légère astringence, arôme de fruit sec. Cinq à huit mots partagés suffisent. Un panel un peu entraîné répète les mêmes descripteurs. Un panel naïf dit surtout « j’aime » ou « je n’aime pas ». Les deux ont leur place, mais pas au même moment du travail. Tu sépares clairement une séance où tu décris et une séance où tu demandes le plaisir. Mélanger les deux sur la même feuille brouille les réponses.","expert":"Psychophysique sensorielle: loi de Weber-Fechner (perception logarithmique de l’intensité) et seuil de différence juste perceptible (jnd). Biais: effet d’ordre, d’attente, d’ancrage, contraste successif. ISO 6658 (méthodologie générale d’analyse sensorielle) et ISO 8586 (sélection des sujets) cadrent les bonnes pratiques sans exiger un labo industriel. Pour Baobab Bliss: un ordre de présentation tiré au sort et un rinçage (eau) réduisent le bruit. Exemple (nombres inventés pour l’exercice): trois bols A-B-C, six permutations possibles; tu en tires deux séances pour équilibrer. Tu notes aussi l’heure, la satiété déclarée et l’odeur ambiante: ce sont des cofacteurs, pas des détails. En jury maison, tu sépares clairement « description » (acide, farineux) et « hédonique » (j’aime). La confusion des deux invalide la conclusion. Tu formalises aussi le protocole: température de service, rinçage, consignes lues à voix haute, interdiction de commenter à haute voix pendant le test. Les effets de contraste et d’adaptation sensorielle expliquent pourquoi un produit moyen paraît meilleur après un produit très acide. En ingénierie alimentaire, tu traites le sensoriel comme une mesure: mesurande (intrus, ranking, note), méthode, incertitude qualitative (fatigue, biais), enregistrement. Pour un changement de tamis Baobab Bliss, tu documentes la granulométrie cible et tu ne changes pas l’emballage le même jour. Les normes ISO cités guident; elles ne remplacent pas ton jugement de cheffe d’atelier. Tu archives feuille, codes et conclusion en une phrase datée. Cette discipline transforme un avis de famille en donnée utile pour décider. Tu archives le protocole sensoriel Baobab Bliss avec la date et les codes à trois chiffres.","quiz":[{"q":"Pourquoi goûter toujours au même endroit calme?","choices":["Pour limiter les biais de lumière, d’odeur et de bruit","Pour remplacer la balance","Pour impressionner une cliente"],"correct":0,"why_ok":"Un cadre stable réduit les biais. Tu juges mieux le produit.","why_ko":"Le lieu calme sert la mesure sensorielle, pas la vente ni la pesée."},{"q":"Que faire si tu viens de manger un fruit très sucré?","choices":["Attendre et te rincer la bouche avant de goûter la poudre","Goûter tout de suite pour gagner du temps","Ajouter du sucre à la poudre"],"correct":0,"why_ok":"Le contraste sucré fausse l’acidité perçue. Rinçage et pause corrigent cela.","why_ko":"Goûter juste après un goût fort trompe tes sens."},{"q":"Pourquoi séparer le carnet baobab et le carnet mangue séchée?","choices":["Parce que les procédés et les critères ne sont pas les mêmes","Parce que la mangue est interdite","Parce que le carnet unique est plus cher"],"correct":0,"why_ok":"La pulpe de baobab est déjà sèche; la mangue demande un vrai séchage. Séparer évite les confusions.","why_ko":"La séparation sert la clarté du procédé, pas une interdiction ou un prix."},{"q":"Quel est un descripteur utile pour le pain de singe?","choices":["Couleur de ta robe","Prix du sachet voisin","Acidité et grain de la poudre"],"correct":2,"why_ok":"Acidité et grain décrivent le produit. Les autres points ne décrivent pas la poudre.","why_ko":"Un descripteur parle du produit goûté, pas du contexte vestimentaire ou commercial."}],"activity":{"type":"tf","prompt":"Vrai ou faux","statements":[{"t":"Connaître le lot peut changer ta note.","truth":true,"why":"Biais d’attente."},{"t":"Une pièce qui sent le repas convient.","truth":false,"why":"Odeurs parasites."},{"t":"Une question à la fois aide.","truth":true,"why":"Sinon mélange."}]},"exercise":{"prompt":"Goûte trois sachets du même lot Baobab Bliss. Note pour chacun couleur, odeur, grain, acidité en trois mots. Écris aussi lumière et heure.","hint1":"Reste en silence pendant le goût. Parle après.","hint2":"Utilise les mêmes mots-outils pour les trois sachets.","solution":"Exemple: sachet A crème, acidulé, grain fin; B un peu plus beige; C grain plus grossier. Lumière du jour, 10 h. Conclusion: grain à surveiller au tamis."}},{"title":"Le test du triangle","body":["Le test du triangle cherche une différence, pas une préférence. Tu prépares trois verres: deux avec la même poudre, un avec l’autre lot. Chez Baobab Bliss, tu codes les verres avec trois chiffres tirés au sort. Tu demandes seulement: lequel est l’intrus? Tu ne souris pas vers le bon verre. Tu ne donnes aucun indice de la voix.","La personne doit choisir même si elle hésite. C’est un choix forcé. Ensuite tu comptes combien de bonnes réponses tu obtiens sur tout le petit jury. Tu compares ce nombre au hasard: une personne seule a une chance sur trois de trouver l’intrus en devinant. Sans ce repère, un score « assez bon » ne veut rien dire.","Si le résultat reste proche du hasard, tes deux lots sont proches pour ce jury-là, à ce jour-là. Si beaucoup trouvent l’intrus, une différence se sent. Tu notes le lot, la date, et ce que tu voulais comparer: deux réglages de tamis, deux jours de stockage, deux façons de refermer le sachet. La conclusion tient en une phrase datée.","Ne demande pas « lequel tu préfères » sur la même feuille. La préférence vient plus tard, sur un autre exercice, avec une nouvelle feuille. Aujourd’hui tu cherches seulement si une différence existe. Séparer les tâches protège la clarté de ton carnet et le calme du jury."],"prof":"Le triangle est un détecteur de différence. S’il ne dépasse pas le hasard, tu n’as pas prouvé une différence pour ce jury. Tu n’as pas non plus prouvé que le monde entier trouvera les lots identiques. Garde une conclusion modeste, chiffrée et datée. Un petit jury oriente; il ne remplace pas un essai plus large si l’enjeu commercial grandit. Un chiffre sans date et sans n ne te servira pas la semaine suivante.","tip":"Tire les codes au sort avant d’appeler la première personne du jury.","simple":"Comme trouver laquelle des trois coquilles cache la noix différente au marché: tu pointes l’intrus, tu ne dis pas encore laquelle tu aimerais acheter pour le dîner. D’abord l’intrus, ensuite le goût préféré, sur un autre tour. Comme reconnaître laquelle des trois tasses de bouillie est différente: tu goûtes sans te faire dire la réponse. Le triangle fait pareil avec méthode.","plus":"La norme ISO 4120 décrit le test triangulaire: trois échantillons, deux identiques, un différent, choix forcé de l’échantillon différent. Il existe six ordres de présentation possibles. On les équilibre sur l’ensemble des juges pour ne pas favoriser une position dans la rangée. Sous l’hypothèse d’absence de différence sensorielle, la probabilité de succès par pure chance vaut un tiers. On fixe un points à surveiller alpha, souvent 0,05, puis on lit dans une table le nombre minimal de réponses correctes pour un effectif n donné. Exemple (nombres inventés pour l’exercice): avec 18 juges, environ 10 bonnes réponses suffisent souvent au seuil 0,05 pour conclure à une différence; autour de 12 bonnes réponses la conclusion se renforce selon la table. On n’enchaîne pas un test de préférence immédiatement après sans pause et sans nouvelle feuille: la tâche mentale n’est pas la même. Pour la poudre de baobab, homogénéise bien, sers le même volume, à température ambiante stable, avec des cuillères propres identiques. Évite les indices visuels: même type de verre, même niveau de remplissage, éclairage constant.","expert":"Test triangulaire (ISO 4120): trois échantillons, deux identiques, un différent; la question est « lequel est l’intrus », pas « lequel tu préfères ». Sous hypothèse nulle (hasard), p = 1/3. Tables ISO donnent le nombre minimal de réponses correctes pour un points à surveiller alpha choisi (souvent 0,05). Exemple (nombres inventés pour l’exercice): 12 juges, 8 bonnes réponses; tu compares à la table ISO avant de crier victoire. Codage à trois chiffres aléatoires, présentation simultanée, rinçage. Pour Baobab Bliss: utile pour valider un changement discret (tamis plus fin, autre lot de gousses). Tu documentes la différence réelle testée (une seule variable). Un triangle « réussi » sans variable contrôlée n’apprend rien. Tu archives feuille, codes et conclusion en une phrase. Le calcul du seuil de signification ne se fait pas «au feeling»: tu consultes la table ISO 4120 pour ton n et ton alpha. Un résultat juste au-dessus du hasard reste fragile: tu répètes avant de modifier le process. Le codage à trois chiffres évite l’ancrage («A est toujours le témoin»). La présentation simultanée réduit la mémoire de court terme comme facteur confondant. Si tu testes une mangue séchée future, tu crées une fiche séparée: le baobab déjà sec n’est pas le même produit. En cas de désaccord fort entre juges, tu cherches d’abord un défaut de protocole (ordre, rinçage, consigne) avant de conclure sur le lot. La traçabilité du test (qui, quand, quoi) est aussi utile que le score. Le triangle ne tranche un changement de tamis que si une seule variable a bougé.","quiz":[{"q":"Que cherche le test du triangle?","choices":["La couleur préférée du mur","Une différence entre deux produits","Le prix le plus bas"],"correct":1,"why_ok":"Le triangle détecte une différence. Préférence et décor viennent ailleurs.","why_ko":"Ce test ne fixe ni prix ni décor."},{"q":"Quelle chance a une personne qui devine au hasard?","choices":["Une sur trois","Une sur deux","Toujours juste"],"correct":0,"why_ok":"Trois verres, un intrus: la probabilité de hasard est un tiers.","why_ko":"Ce n’est pas un pile ou face, et le hasard n’est pas magique."},{"q":"Pourquoi forcer un choix même en cas d’hésitation?","choices":["Pour vexer le jury","Pour remplir le sachet","Pour pouvoir compter face au hasard selon la règle du test"],"correct":2,"why_ok":"Le modèle binomial suppose une réponse par juge. Le choix forcé rend le décompte possible.","why_ko":"La règle sert la statistique du test, pas la vexation."},{"q":"Que faire de la question de préférence?","choices":["La poser plus tard sur une autre feuille","La coller sur la même ligne que l’intrus","Ne jamais écouter les clientes"],"correct":0,"why_ok":"Différence et préférence sont deux tâches. Tu les sépares.","why_ko":"Mélanger les tâches embrouille le jury et le décompte."}],"activity":{"type":"order","prompt":"Ordre triangle","steps":["Préparer produits et codes","Servir trois verres tirés au sort","Désigner l’intrus","Compter face au hasard"],"correct":[0,1,2,3],"hint1":"Repère la première étape terrain.","hint2":"La dernière clôt l’action.","solution":"Ordre correct : Préparer produits et codes, Servir trois verres tirés au sort, Désigner l’intrus, Compter face au hasard"},"exercise":{"prompt":"Organise un mini triangle: deux lots Baobab Bliss proches (par exemple deux jours de stockage). Note n, bonnes réponses, et ta décision en une phrase.","hint1":"Même volume dans chaque verre.","hint2":"Écris clairement « différence détectée » ou « non détectée à mon seuil ».","solution":"Exemple: n égale 6, trois bonnes réponses, proche du hasard, différence non détectée à ce petit effectif. Je retesterai avec plus de juges si l’enjeu le mérite."}},{"title":"Classer et noter le plaisir","body":["Après avoir cherché une différence, tu peux demander le plaisir. Chez Baobab Bliss, tu poses une question simple: quel sachet préfères-tu, ou quelle note donnes-tu de un à neuf. Tu restes claire: ce n’est plus le test de l’intrus. Tu changes de feuille, tu rappelles la nouvelle consigne à voix haute, puis tu laisses goûter sans commentaire.","Classer, c’est mettre des sachets du moins aimé au plus aimé. Noter, c’est donner un chiffre sur une échelle. Les deux disent des choses utiles, mais pas les mêmes. Un classement force un ordre même si deux produits se valent presque. Une note permet des égalités et des moyennes, avec leurs limites sur un tout petit groupe.","Tu évites d’influencer: pas de phrase du type « celui-ci a demandé plus de travail », pas de regard vers le sachet que tu espères. Les codes restent tirés au sort. Tu sers la même quantité. Tu laisses le temps de goûter sans pression. Tu ramasses les feuilles avant toute discussion de groupe.","Sur le carnet, tu écris la question exacte posée. « Lequel tu préfères pour le tô du matin » n’est pas la même chose que « lequel tu offrirait en cadeau ». Une question floue donne des réponses floues. Une question nette te permet de relire la séance dans trois mois et de comprendre encore ce que le chiffre voulait dire."],"prof":"Le plaisir est personnel. Une moyenne de notes n’est pas une vérité universelle. Elle t’aide à trancher entre deux présentations ou deux fermetures de sachet, à condition que la question soit nette et le jury honnête. Garde n visible à côté de la moyenne. Sans n, la moyenne impressionne plus qu’elle n’informe. Ramasse les feuilles avant la discussion: les commentaires de groupe changent les notes après coup.","tip":"Écris la question de préférence en une seule phrase avant d’appeler qui que ce soit.","simple":"Comme demander à la famille quelle sauce d’arachide elle préfère pour le riz: tu ranges les bols, tu demandes un ordre clair, tu n’indiques pas ton bol favori du regard. Après le vote seulement, tu discutez autour de la table.","plus":"Les essais hédoniques mesurent l’appréciation. L’échelle à neuf points, qui va d’un déplaisir extrême à un plaisir extrême, est très utilisée en recherche et développement alimentaire. Le classement demande un ordre complet des échantillons. On l’analyse souvent avec un test de Friedman lorsque les mêmes personnes ont classé tous les produits. On distingue le liking, c’est-à-dire le plaisir noté, et la préférence, c’est-à-dire le choix forcé entre options. Exemple (nombres inventés pour l’exercice): cinq personnes classent trois sachets A, B et C. Si B est premier quatre fois, tu as un signal de préférence pour B dans ce petit groupe, pas une preuve nationale. Limites utiles à écrire: un jury de proches n’est pas le marché entier; la fatigue arrive après trop d’échantillons; l’échelle à neuf points demande une courte explication orale identique pour toutes les personnes. Bonnes pratiques: un produit à la fois pour la note isolée, rinçage entre produits, ordre randomisé, feuille individuelle, discussion seulement après la collecte. Pour Baobab Bliss, commence par trois variantes au plus: par exemple grain fin, grain moyen, grain plus grossier.","expert":"Classement (ISO 8587) et échelle hédonique (souvent 9 points, ISO 4121 pour les échelles). Le classement force une hiérarchie; l’échelle autorise des égalités perçues. Statistiques: test de Friedman pour classements appariés; pour hédonique, ANOVA ou tests non paramétriques selon la distribution. Exemple (nombres inventés pour l’exercice): trois dilutions notées 6, 7, 5 sur 9; médiane et étendue se lisent avant toute moyenne. Pour Baobab Bliss: tu expliques l’échelle à voix haute (« 1 = je n’aime pas du tout, 9 = j’aime énormément ») avant le premier bol. Tu sépares « intensité d’acidité » et « plaisir ». Un même produit peut être plus acide et moins aimé: ce n’est pas contradictoire. Tu notes la consigne exacte sur la feuille. L’échelle hédonique à 9 points est courante mais pas magique: les extrêmes sont peu utilisés, et la distance perçue entre 5 et 6 n’égale pas celle entre 8 et 9. Tu peux ancrer verbalement chaque cran. Pour un classement, le test de Friedman (esprit) respecte le caractère ordinal des rangs. Tu reports médiane et étendue avant toute moyenne. Quand tu compares dilutions de boisson baobab, tu prépares les concentrations à la balance et tu tires l’ordre au sort. Une feuille préimprimée avec cases évite les ratures ambiguës. Le lien ingénieur: la décision process (dosage, message d’usage) doit citer le résultat sensoriel et la limite de ce résultat (petit n, jury maison). Médiane et étendue des notes hédoniques se lisent avant toute moyenne sur tes dilutions.","quiz":[{"q":"Que mesure surtout une note de plaisir de un à neuf?","choices":["L’appréciation, pas la détection d’un intrus","La durée de séchage de la mangue","Le poids du sachet"],"correct":0,"why_ok":"L’échelle hédonique parle d’appréciation.","why_ko":"Poids et séchage se mesurent autrement."},{"q":"Pourquoi écrire la question exacte sur le carnet?","choices":["Parce que tu dois poser dix questions","Parce que deux formulations changent les réponses","Parce que le carnet aime les longues phrases"],"correct":1,"why_ok":"La formulation oriente la réponse. Tu la fixes et tu la gardes.","why_ko":"Ce n’est ni un goût pour le style ni une obligation de dix questions."},{"q":"Que force un classement?","choices":["Une date limite","Un ordre, même si deux produits se valent presque","Un prix de vente"],"correct":1,"why_ok":"Le classement exige un ordre complet. C’est sa force et sa limite.","why_ko":"Classer le plaisir ne fixe ni prix ni date."},{"q":"Quand éviter un test de préférence?","choices":["Quand tu as trop de cuillères","Quand le triangle n’a montré aucune différence sur les mêmes lots","Quand il fait beau"],"correct":1,"why_ok":"Sans différence perçue, la préférence sur ces lots apporte peu.","why_ko":"La météo et les couverts ne décident pas du plan d’essai."}],"activity":{"type":"match","prompt":"Outil et but","left":["Test du triangle","Échelle de plaisir","Classement"],"right":["Repérer une différence","Mesurer combien ça plaît","Ordonner du préféré au moins aimé"],"pairs":{"0":0,"1":1,"2":2},"hint1":"Cherche le lien métier.","hint2":"Élimine les paires absurdes.","solution":"Chaque élément a une seule bonne association."},"exercise":{"prompt":"Fais noter trois présentations Baobab Bliss (grain fin, moyen, grossier) sur une échelle de un à neuf par quatre personnes. Calcule la moyenne par présentation.","hint1":"Explique l’échelle en deux phrases identiques à chaque personne.","hint2":"Randomise l’ordre des trois présentations.","solution":"Exemple: fin 7,0 ; moyen 6,3 ; grossier 5,1. Tu retiens le grain fin pour le prochain marché test, en rappelant que n reste petit."}},{"title":"Monter un petit jury","body":["Un jury utile n’est pas forcément grand. Chez Baobab Bliss, six à douze personnes attentives valent mieux qu’une foule distraite. Tu choisis des personnes qui acceptent le silence, qui n’ont pas le rhume ce jour-là, et qui comprennent la consigne. Tu expliques le but en deux minutes, pas en discours.","Tu prépares la salle: table propre, verres identiques, eau claire pour rincer, codes déjà tirés, feuilles individuelles. Tu chronomètres un rythme calme. Trop d’échantillons fatiguent la bouche et le nez. Trois à quatre produits suffisent souvent pour une première séance.","Tu décides à l’avance si le jury est naïf ou un peu entraîné. Un jury naïf parle surtout de plaisir. Un jury entraîné peut utiliser ton petit lexique: acidité, grain, odeur acidulée. Tu ne improvises pas ce choix au milieu de la séance. Tu l’écris en haut de la page du jour.","À la fin, tu remercies, tu ramasses les feuilles, tu ranges les sachets, tu calcules le soir même. Une séance sans dépouillement le jour même perd la moitié de sa valeur. Tu dates la conclusion et tu notes ce que tu feras concrètement sur le prochain lot."],"prof":"Monter un jury, c’est monter une petite machine de mesure humaine. La qualité des consignes et du silence compte autant que le nombre de têtes. Six personnes bien cadrées t’apprennent plus qu’une table bruyante de vingt cousines. Protège le protocole: sans protocole, tu recueilles des opinions de salon. Dépouille le soir même, sinon la séance devient un souvenir flou. Un petit jury vaut mieux qu’une seule opinion fatiguée. Choisis des personnes qui osent dire qu’elles n’aiment pas. Briefe-les sans révéler le lot favori. Remercie-les avec clarté sur le temps donné.","tip":"Prépare codes, eau et feuilles avant l’arrivée de la première personne.","simple":"Comme organiser un petit concours de bouillie à la maison: tu poses les bols identiques, tu donnes la même cuillère à chacun, tu demandes le silence pendant le goût, tu ramasses les papiers avant que les commentaires n’influencent les voisines. Le gagnant se discute après, pas pendant.","plus":"En industrie, on distingue panels entraînés (descripteurs, répétabilité) et consommateurs (appréciation, usage). Le recrutement fixe des critères d’exclusion simples: rhume, tabac juste avant le test, allergie déclarée au produit, conflit d’intérêt trop fort si tu testes une alternative que la personne vend elle-même. La taille dépend de l’objectif. Pour un triangle de screening interne, une dizaine de juges peut suffire à repérer un gros écart. Pour une décision de lancement, on vise souvent des dizaines de consommateurs. Exemple (nombres inventés pour l’exercice): huit voisines notent deux fermetures de sachet. Six préfèrent la fermeture double pli. Signal utile pour ton atelier; preuve trop faible pour une campagne nationale. Logistique: durée maximale d’une séance, nombre d’échantillons, pauses, rémunération symbolique ou remerciement en nature, confidentialité des codes. Formation courte d’un panel maison: deux séances sur le lexique baobab, une séance de répétabilité sur le même lot, puis seulement des tests de différence. Tu documentes qui a participé par initiales, pas par discours public, par respect pour les personnes.","expert":"Panel: ISO 8586 distingue sujets naïfs, initiés, sélectionnés, experts. Pour une TPE, un petit jury stable (famille, aides formées) vaut mieux qu’un grand jury bruyant non cadré. Entraînement: vocabulaire commun (farineux, acide, caramelisé), exercices de reconnaissance, discipline de non-discussion pendant le test. Exemple (nombres inventés pour l’exercice): cinq personnes, deux séances, même protocole; tu calcules l’accord sur l’intrus du triangle. Hygiène et anonymat des codes restent non négociables. Pour Baobab Bliss: tu gardes un carnet « jury » avec dates et absences. Tu ne changes pas la consigne en cours de séance. La fatigue sensorielle après trop d’échantillons baisse la fiabilité: mieux vaut peu et bien. Former un jury maison, c’est créer une culture: silence pendant l’évaluation, vocabulaire partagé, respect des codes. ISO 8586 décrit des exercices de sélection (seuils, reconnaissance); tu en empruntes l’esprit sans prétendre certifier tes juges. Tu planifies des séances courtes (fatigue olfacto-gustative). L’eau de rinçage et un délai entre échantillons font partie du mode opératoire. Pour Baobab Bliss, tu peux entraîner sur acidité et farinosité avec trois références internes clairement étiquetées «entraînement». Les résultats d’entraînement ne se mélangent pas aux résultats de décision produit. Tu tiens un registre des absences: un jury variable sans note de composition rend les séries incomparables. Le registre du jury maison note absences et version de la consigne lue.","quiz":[{"q":"Qu’est-ce qui compte autant que le nombre de personnes?","choices":["La qualité des consignes et le silence","La couleur des chaises","Le volume de la radio"],"correct":0,"why_ok":"Un protocole clair et le silence protègent la mesure.","why_ko":"Chaises et radio ne font pas un jury sérieux."},{"q":"Combien de produits servir souvent en première séance?","choices":["Une vingtaine d’un coup","Aucun, seulement des photos","Trois ou quatre pour limiter la fatigue"],"correct":2,"why_ok":"Trop d’échantillons fatiguent les sens. Trois ou quatre suffisent souvent.","why_ko":"Une avalanche d’échantillons ou l’absence de goût n’aident pas."},{"q":"Quand dépouiller les feuilles?","choices":["Le soir même, avec une conclusion datée","Jamais, le feeling suffit","Le mois suivant si tu as le temps"],"correct":0,"why_ok":"Le dépouillement rapide transforme la séance en décision.","why_ko":"Attendre trop longtemps ou te fier au feeling fait perdre la valeur du jury."},{"q":"Que note-t-on en haut de la page du jour?","choices":["Le cours de la devise","Le prénom de toutes les clientes du quartier","Si le jury est naïf ou un peu entraîné, et l’objectif"],"correct":2,"why_ok":"Le type de jury et l’objectif cadrent l’interprétation.","why_ko":"Inutile de tout lister ni de suivre la devise ici."}],"activity":{"type":"case","prompt":"Cas jury","story":"Cinq amies prévues. Deux annulent. Une déteste déjà le baobab.","q":"Que fais-tu ?","choices":["Tu notes les absences, tu remercies la personne rebutée, tu continues avec les volontaires selon les règles","Tu inventes les notes des absentes","Tu forces la personne rebutée"],"correct":0,"why_ok":"Volontaires disponibles, sans données inventées.","why_ko":"Inventer ou forcer casse le sens du test."},"exercise":{"prompt":"Écris ta fiche jury Baobab Bliss: objectif, n visé, type de jury, liste du matériel, durée, règle de silence, comment tu dépouilles le soir.","hint1":"Une page recto suffit.","hint2":"Prévois l’eau de rinçage et les codes avant l’arrivée.","solution":"Exemple: objectif comparer deux tamis; n égale 8; jury naïf; 3 codes; 40 minutes; silence; dépouillement le soir avec moyenne et décision en une phrase."}},{"title":"Écouter les clientes sur le terrain","body":["Le jury en salle ne remplace pas la vie réelle. Chez Baobab Bliss, tu écoutes aussi au marché, chez une voisine, après une première vente. Tu poses peu de questions. Tu laisses la personne parler de l’usage: dans quelle sauce, pour quel enfant, à quel moment de la journée.","Tu notes les mots exacts, pas ta traduction élégante. Si quelqu’un dit « ça coince entre les dents », tu écris cette phrase. Plus tard, tu verras si cela pointe vers le grain du tamis, vers un sachet mal fermé, ou vers une attente différente.","Tu sépares les faits et tes conclusions. Fait: trois personnes ont dit que le sachet est difficile à refermer. Conclusion possible: changer le pli ou le lien. Tu dates les deux. Tu ne changes pas toute la ligne pour un seul commentaire isolé, sauf si la sécurité alimentaire est en jeu.","Pour un futur produit séché, tu écouteras d’autres usages: grignotage, sauce, mélange. Tu gardes des fiches séparées par produit. Mélanger les retours mangue et baobab sur la même page crée des décisions confuses.","Aujourd’hui, choisis une question ouverte unique pour le marché. Pose-la à trois personnes. Écris les réponses brutes le soir même. Choisis une seule priorité pour la semaine. Une écoute sans priorité redevient bavardage."],"prof":"Écouter n’est pas se défendre. Quand une cliente parle, tu prends note avant de répondre. Une phrase vraie et gênante t’apprend plus qu’un compliment poli. Classe ensuite: usage, emballage, goût, prix ressenti. Une oreille calme vaut un long discours commercial. Reviens vers la personne plus tard s
