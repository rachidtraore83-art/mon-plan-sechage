es le juste milieu sur des essais.","hint":"Quels trois leviers de la pince influences-tu avant de remplir la poudre ?"},{"keys":["durée","vie","essai"],"q":"Comment construire une durée de vie honnête ?","a":"Par des essais de stockage notés : toucher, goût, couleur, prise de masse, dans tes conditions réelles à Ouagadougou. Tu n’inventes pas un chiffre long. Tu peux viser une période courte au début et l’allonger après observations.","mod":"m5","li":1,"example":"Tu gardes des sachets témoins datés dans ton local réel. Chaque semaine tu notes aspect et poids. Après un mois stable, tu oses une durée un peu plus longue sur l’étiquette, toujours honnête.","next":"Place un sachet témoin daté au milieu du stock et pèse-le chaque semaine pendant un mois.","alt":"Comme juger combien de temps le mil se garde dans ton grenier : tu observes chez toi, saison après saison, plutôt que de copier une durée entendue au marché.","hint":"D’où doit venir la durée écrite : d’un souvenir flou, ou d’essais notés chez toi ?"},{"keys":["hygiène","emballage"],"q":"Pourquoi la table d’emballage doit-elle être sèche ?","a":"L’eau libre sur la table réhumidifie la poudre et contredit un conditionnement sec. Une table sèche, des mains séchées et des outils propres protègent le travail fait au tamis. Tu prépares la zone avant la série, pas pendant.","mod":"m5","li":0,"example":"Après avoir essuyé une table encore humide de nettoyage, tu attends qu’elle soit vraiment sèche au toucher avant d’y poser bols et sachets de pain de singe.","next":"Ajoute en tête de ta liste de contrôle : table sèche, mains lavées et séchées, avant le premier remplissage.","alt":"Comme étaler de la farine sur une planche encore mouillée : elle forme aussitôt des paquets. La poudre demande la même surface sèche.","hint":"Que fait une goutte d’eau libre au contact d’une poudre déjà bien préparée ?"},{"keys":["sol","produit"],"q":"Que faire d’une poudre tombée au sol ?","a":"Elle ne retourne pas dans le sachet client. La zone sol égale zone perdue pour le produit vendu. Tu balayes, tu notes la perte estimée, et tu cherches pourquoi ça tombe : bol trop plein, geste pressé, entonnoir mal tenu.","mod":"m5","li":5,"example":"Un bol bascule et de la poudre finit au sol près de la table. Tu l’écartes du flux Baobab Bliss, tu l’isoles pour un usage non vendu ou tu la jettes selon ta règle écrite, et tu notes les grammes perdus.","next":"Écris sur le mur en une ligne ta règle « sol : hors sachet client » et une case « poudre perdue estimée » sur la fiche lot.","alt":"Comme le riz tombé par terre en cuisine de fête : tu ne le remets pas dans le plat des invités. Même respect pour ta cliente.","hint":"Le sol fait-il partie de la zone propre destinée au sachet vendu ?"},{"keys":["lot","code"],"q":"À quoi sert le code de lot ?","a":"Le code de lot relie le sachet au carnet : fruits, process, film, destinataires. Il permet un rappel juste si une question arrive. Sans code, tu perds le fil entre ce que tu as fait et ce que la cliente tient.","mod":"m5","li":0,"example":"Une boutique te rappelle un sachet. Grâce au code, tu retrouves la date de cassage, le film utilisé et qui a soudé, au lieu de chercher dans tous les lots du mois.","next":"Choisis un format de code simple pour la semaine et écris-le sur chaque sachet et sur la fiche lot.","alt":"Comme numéroter les bassines d’un grand repas : tu sais laquelle a été préparée quand, et tu peux répondre vite si besoin.","hint":"Sans ce code, que peux-tu encore prouver sur l’origine d’un sachet précis ?"},{"keys":["étiquette","mentions"],"q":"Que mettre surtout sur l’étiquette client ?","a":"Nom du produit, composition honnête, poids net, ton nom et ton adresse, contact utile, lot, date de durabilité et conservation selon ton canal. Pas de phrases médicales ni de jargon technique en face avant. Le dessin choisi vient après une information loyale.","mod":"m5","li":1,"example":"Tu prépares une étiquette Baobab Bliss: « 100 pour cent pulpe de baobab », poids, ton nom et ton adresse, téléphone, code de lot, « à consommer de préférence avant » une date réelle, sans promesse médicale.","next":"Liste sur une page les mentions que tu mettras vraiment, et raye tout jargon inutile.","alt":"Comme présenter un pagne à une acheteuse : tu dis clairement ce que c’est, combien ça pèse ou mesure, et qui tu es, avant les fioritures.","hint":"Quelles informations une cliente doit pouvoir lire sans te téléphoner ?"},{"keys":["sachet","témoin"],"q":"À quoi sert un sachet témoin pesé ?","a":"Un sachet témoin pesé détecte une prise d’eau anormale au stock. Tu compares la masse dans le temps, au même endroit. La courbe guide mieux qu’une simple impression de toucher.","mod":"m5","li":0,"example":"Tu marques « témoin » sur un sachet du lot du mardi, tu le pèses chaque semaine. S’il grossit nettement en saison humide, tu revois film ou soudure avant la prochaine série.","next":"Choisis un sachet témoin du lot en cours, note sa masse de départ et le jour de la semaine où tu le repèseras.","alt":"Comme surveiller un sac de mil sur une balance de temps en temps : s’il s’alourdit sans raison, l’humidité s’est invitée.","hint":"Que surveilles-tu en repesant le même sachet au fil des jours ?"},{"keys":["aslt","accéléré"],"q":"Que signifie un essai de stabilité accéléré ?","a":"C’est stocker à plusieurs conditions, souvent plus chaud, pour estimer plus vite une durée, puis valider en conditions réelles. L’essai accéléré donne une piste ; il ne remplace pas l’observation dans ton local à Ouagadougou.","mod":"m5","li":1,"example":"Tu places quelques sachets dans un endroit plus chaud de la maison et d’autres dans le stock habituel. Tu compares collage et poids, puis tu confirmes sur le stock réel avant d’allonger la durée annoncée.","next":"Si tu testes un nouvel emballage, prévois au moins un lot témoin dans ton stock réel, pas seulement un coin chaud.","alt":"Comme faire sécher un peu de piment près du feu pour voir vite s’il noircit, puis vérifier dehors à l’ombre. Le test rapide oriente ; le vrai lieu confirme.","hint":"Après un test plus chaud, que dois-tu encore vérifier avant de faire confiance à une durée ?"},{"keys":["migration","matériaux"],"q":"Que demandent les règles européennes de contact alimentaire (idée) ?","a":"L’idée centrale, portée notamment par le règlement européen 1935 de 2004, est que les matériaux ne cèdent pas de constituants en quantité susceptible de nuire, de modifier la composition ou d’altérer le goût et l’odeur. Des textes détaillent plastiques et bonnes pratiques de fabrication des matériaux.","mod":"m5","li":2,"example":"Tu refuses un film qui donne un goût de plastique à un essai à blanc. Même sans labo, tu appliques l’esprit de la règle : pas d’altération du produit, preuve d’usage alimentaire si tu peux.","next":"Classe tes films en trois boîtes : documenté, en attente d’info, refusé. Rien de la boîte refusée ne touche la poudre.","alt":"Comme refuser de stocker de l’eau potable dans un bidon qui a contenu de l’huile moteur : le contenant compte autant que le contenu.","hint":"Que ne doivent pas faire les constituants du matériau envers l’aliment ?"},{"keys":["controle","emballage"],"q":"Donne un exemple de liste de contrôle courte avant série.","a":"Une liste de contrôle courte peut être : mains lavées et séchées ; table sèche ; film et cuillère propres ; poubelle évacuée ; premier sachet contrôlé après soudure. Tu la parcours avant chaque série, pas de mémoire.","mod":"m5","li":0,"example":"Avant de doser, par exemple, vingt sachets pour une commande, tu coches les cinq points sur un papier collé près de la table. Tu corriges une cuillère encore poudreuse d’hier avant de commencer.","next":"Écris ta liste de contrôle en cinq lignes maximum et colle-la à hauteur d’yeux près de la zone d’emballage.","alt":"Comme la liste avant de partir au marché : tu vérifies panier, monnaie et sacs avant de sortir, pour ne rien improviser au milieu de la foule.","hint":"Quels gestes de propreté et de contrôle fais-tu avant le premier sachet rempli ?"},{"keys":["zip","fermeture"],"q":"Si tu utilises une fermeture refermable un jour, que surveiller ?","a":"Tu surveilles la propreté de la zone de fermeture refermable et la soudure de fond, qui reste critique pour la barrière. Une fermeture sale ou mal engagée laisse passer l’air humide malgré le geste « refermer ».","mod":"m5","li":0,"example":"Un jour tu testes un sachet avec fermeture refermable pour une cliente qui dose en plusieurs fois. Tu nettoies la piste avant remplissage et tu vérifies toujours la soudure du bas au tirage.","next":"Si tu essais un format refermable, ajoute sur la fiche : contrôle piste propre et test de la soudure de fond.","alt":"Comme une boîte à épices avec couvercle à enclencher : le couvercle aide au quotidien, mais si le joint est sale ou fêlé, l’arôme fuit quand même.","hint":"Quelle soudure reste critique même quand une fermeture se rouvre et se referme ?"},{"keys":["prérequis","hygiène"],"q":"Que sont les programmes prérequis ?","a":"Les programmes prérequis sont les habitudes propres de base de ton atelier: lavage des mains, locaux rangés, lutte contre les nuisibles, nettoyage, gestion des déchets et formation simple. Sans eux, un plan écrit sur papier protège mal le produit. Tu les tiens avant de parler de points critiques.","mod":"m6","li":0,"example":"Avant de tamiser la pulpe, tu laves les mains, tu vérifies que le plan de travail est propre et que le seau à déchets est vidé: ces gestes sont tes programmes prérequis du matin.","next":"Cette semaine, écris sur une feuille les six gestes de base que tu fais déjà avant chaque lot, et coche-les un matin entier.","alt":"C’est comme balayer la cour et laver les bassines avant de cuisiner pour la famille: tu prépares un cadre propre, sinon le plat le plus soigné part sur un sol sale.","hint":"Pense aux gestes que tu ferais même sans carnet écrit: mains, table, déchets."},{"keys":["haccp","sept"],"q":"Résume l’esprit des sept principes.","a":"Les sept principes, c’est une chaîne claire: repérer ce qui peut arriver au produit, choisir où tu dois vraiment tenir bon, fixer une limite compréhensible, surveiller, corriger si ça dérape, vérifier que le système marche, et écrire ce que tu fais. Ils s’appuient sur des prérequis solides. Mieux vaut deux points vraiment tenus que vingt cases vides.","mod":"m6","li":1,"example":"Pour ta poudre, tu décides de surveiller la soudure de chaque sachet et l’absence d’éclat de coque sur le plateau après le tamis, avec une limite écrite que toi et une aide comprenez pareil.","next":"Choisis deux points à surveiller vraiment cette semaine et écris leur limite en une phrase chacune.","alt":"Imagine une marmite sur le feu: tu sais ce qui peut brûler, tu restes près, tu as une limite de temps, tu baisses si ça attache, tu notes pour la prochaine fois.","hint":"Compte les idées comme une petite chanson: voir, tenir, limiter, surveiller, corriger, vérifier, écrire."},{"keys":["ccp","baobab"],"q":"Quel point critique est souvent candidat chez toi ?","a":"Chez toi, un candidat fréquent est l’intégrité de la soudure et de l’emballage, car une fuite laisse l’humidité revenir dans la poudre. Si tu mesures l’humidité ou l’activité de l’eau avant de remplir, ce contrôle peut aussi devenir un point à tenir. Tout n’est pas critique: le cassage seul reste souvent une bonne pratique.","mod":"m6","li":3,"example":"À chaque série de sachets kraft, tu tires doucement sur la soudure d’un sachet d’essai: si un canal s’ouvre, tu ressoudes ou tu écartes avant de continuer la série.","next":"Rédige une demi-page pour un seul point critique réel: problème maîtrisé, limite, surveillance, correction.","alt":"Dans une maison, tu surveilles surtout l’extinction des braises avant de dormir, pas le rangement de chaque chaussure: tu réserves ton énergie au vrai point sensible.","hint":"Demande-toi quelle étape, si elle rate, laisse vraiment l’humidité ou un corps étranger atteindre la cliente."},{"keys":["douze","étapes"],"q":"Que préparent les premières des douze étapes ?","a":"Les cinq premières des douze étapes préparent le terrain avant l’analyse détaillée. Tu formes une petite équipe, tu décris le produit, tu précises l’usage prévu, tu dessines le diagramme de flux, puis tu confirmes ce schéma en marchant dans l’atelier. Ensuite seulement viennent les sept principes.","mod":"m6","li":2,"example":"Tu écris « poudre de pulpe de baobab 100 pour cent, sachet, boisson ou cuisine après préparation », tu dessines réception, cassage, tamis, soudure et stock, puis tu marches le trajet avec la feuille à la main.","next":"Recopie la liste des douze étapes et coche ce qui est déjà fait chez toi.","alt":"Comme préparer une fête: d’abord qui vient et quel menu, ensuite le chemin de la cuisine, puis les contrôles le jour J. Tu ne commences pas par le discours sur les desserts.","hint":"Les cinq premières ne remplacent pas les contrôles: elles cadrent le produit et le flux réel."},{"keys":["diagramme","terrain"],"q":"Pourquoi confirmer le diagramme dans la pièce ?","a":"Confirmer le diagramme dans la pièce veut dire marcher réellement avec le schéma à la main. Tu corriges ce qui manque: une table de tri oubliée, un bac ouvert, un stock intermédiaire. Un dessin inventé depuis le canapé ne protège personne.","mod":"m6","li":0,"example":"En marchant ton flux, tu te rends compte que tu avais oublié la table où tu retires fibres et graines avant le tamis: tu ajoutes cette case sur le papier le jour même.","next":"Prends ton schéma actuel, marche-le une fois dans l’atelier et corrige au moins un écart noté.","alt":"C’est comme vérifier le chemin réel vers le marché plutôt que de le décrire de mémoire: les détours et les trous apparaissent seulement en marchant.","hint":"Demande-toi ce que ton dessin oublie encore: une pause, un bac, un retour de produit."},{"keys":["limite","critique"],"q":"Qu’est-ce qu’une bonne limite quotidienne ?","a":"Une bonne limite quotidienne est claire pour toi et pour une aide, observable avec tes moyens réels, et liée à un vrai point sensible. « À peu près bien » n’est pas une limite. Elle doit tenir même un soir de marché pressé.","mod":"m6","li":1,"example":"Tu écris « soudure continue sans canal visible, test de traction réussi sur le sachet d’essai » plutôt qu’une phrase floue du type « emballage correct ».","next":"Pour un de tes deux points surveillés, reformule la limite en une phrase qu’une aide comprendrait sans toi.","alt":"Comme décider « le tô s’arrête quand la vapeur sent le cuit et le grain est tendre »: tout le monde comprend la même chose, sans jargon.","hint":"Si deux personnes peuvent lire la limite et juger pareil, elle est bonne."},{"keys":["seuil","opérationnel"],"q":"À quoi sert un seuil opérationnel ?","a":"Un seuil opérationnel est une alerte avant la limite critique. Il te laisse corriger tant qu’il est encore temps, sans attendre le rejet. C’est une marge de pilotage, pas un décor.","mod":"m6","li":1,"example":"Pour la soudure, tu notes une alerte si la traction paraît faible au doigt, et un rejet si le sachet s’ouvre: tu ressoudes dès l’alerte, tu écartes seulement au rejet.","next":"Pour un point que tu surveilles déjà, écris une zone d’alerte et une limite dure, en deux lignes.","alt":"Sur une moto, tu ralentis quand le compteur approche la vitesse limite du village, tu n’attends pas le panneau pour freiner d’un coup.","hint":"Cherche l’écart entre « ça commence à inquiéter » et « c’est hors limite »."},{"keys":["surveillance","soudure"],"q":"Quelle fréquence de surveillance pour la soudure ?","a":"Pour la soudure, tu surveilles souvent chaque sachet au regard, plus des essais de traction en début de série. La fréquence suit le rythme de ton remplissage: tu ne laisses pas une demi-journée sans contrôle. Si un écart apparaît, tu ressoudes ou tu écartes tout de suite.","mod":"m6","li":5,"example":"Avant de lancer, par exemple, vingt sachets, tu en soudes trois d’essai, tu tires sur les bords, puis tu regardes chaque soudure de la série avant de les mettre en carton.","next":"Décide par écrit ta règle: essai en début de série, puis regard sur chaque sachet, et teste-la un jour de production.","alt":"Comme goûter la sauce au début et regarder chaque assiette avant de servir: tu vérifies le départ, puis tu gardes l’œil sur chaque portion.","hint":"La leçon insiste sur un contrôle que tu peux vraiment tenir à chaque lot, pas sur un chiffre magique."},{"keys":["traçabilité","avant","arrière"],"q":"Que signifie traçabilité en avant et en arrière ?","a":"La traçabilité en arrière dit d’où vient la matière du lot: fournisseur des fruits, date, quantité. La traçabilité en avant dit où sont partis les sachets: boutique, marché, stock. Les deux maillons voisins suffisent pour retrouver un lot si une question revient.","mod":"m6","li":5,"example":"Sur le lot du mardi, tu notes le fournisseur des gousses et, après livraison, tu écris combien de sachets sont allés à la boutique du quartier et combien restent chez toi.","next":"Prends un sachet déjà fait et reconstruis sa fiche: fournisseur, date, code, destinataire si tu en as un.","alt":"Comme noter qui a emprunté quelle bassine au quartier: tu sais à qui demander si elle manque, sans suivre toute la ville.","hint":"Un pas vers le fournisseur, un pas vers la cliente ou la boutique: c’est le fil minimal."},{"keys":["rappel","calme"],"q":"Quel premier geste en cas de doute sur un lot ?","a":"Au premier doute sur un lot, tu isoles le reste, tu ouvres le carnet, tu regardes les destinataires notés, tu décides calmement, et tu écris tout. Tu ne vends plus ce lot tant que la décision n’est pas claire. La précipitation sans écrit crée des trous.","mod":"m6","li":5,"example":"Tu trouves trois sachets dont la soudure s’ouvre: tu bloques le carton du même créneau, tu listes où les autres sont partis, tu appelles la boutique, tu notes l’heure et l’action.","next":"Écris sur une carte les quatre gestes du doute: isoler, ouvrir le carnet, contacter, écrire.","alt":"Comme retirer un plat douteux de la table avant de servir les invités: tu mets de côté, tu vérifies, tu décides, tu ne improvises pas devant tout le monde.","hint":"Le premier geste n’est pas de discuter: c’est de séparer le douteux du reste."},{"keys":["iso","22000"],"q":"Que couvre surtout référentiel qualité 22000 (idée) ?","a":"Le référentiel 22000 décrit un système de management de la sécurité des aliments: politique, responsabilités, prérequis, analyse de ce qui peut nuire, traçabilité, preuves et amélioration. Tu peux t’en inspirer chapitre par chapitre sans te certifier tout de suite. Aucun certificat ne remplace des bonnes pratiques vivantes.","mod":"m6","li":6,"example":"Tu lis l’idée de « prérequis puis plan de maîtrise » et tu la traduis en liste de contrôle matin-pendant-soir, sans acheter un audit pour l’instant.","next":"Écris trois phrases: ce que tu fais déjà, ce que tu feras ce mois-ci, ce que tu laisses pour plus tard côté grandes normes.","alt":"Comme apprendre d’abord un ourlet droit avant un costume brodé: les fondations avant les ornements du référentiel.","hint":"Demande toujours: qu’est-ce que cela change concrètement dans mon atelier cette semaine ?"},{"keys":["certification","quand"],"q":"Faut-il courir la certification demain ?","a":"Non, tu ne cours pas la certification demain. Tu tiens d’abord un système familial solide: hygiène, lots, liste de contrôle, corrections. La certification vient si un client et un volume la justifient, et si quelqu’un contribue au coût de l’audit. Un mur de certificats vides n’aide personne.","mod":"m6","li":0,"example":"Une boutique te parle de certificat: tu demandes quel schéma, quel délai et qui paie l’audit, puis tu réponds après ces trois réponses, par exemple plutôt que de promettre tout de suite.","next":"Remplis, par exemple, trois colonnes sur une page: déjà solide, ce mois-ci, plus tard (certifications éventuelles).","alt":"Comme construire d’abord des murs droits avant d’acheter la peinture de façade: sans structure, le décor ne tient pas.","hint":"Le badge du module, c’est la maîtrise quotidienne, pas un certificat mural."},{"keys":["audit","interne"],"q":"À quoi sert un audit interne mensuel ?","a":"Un audit interne mensuel compare l’écrit et le réel sur un thème choisi. Tu notes les forces, les écarts, et tu fixes une correction datée. Ce n’est pas un théâtre: une heure, une liste de contrôle, trois actions maximum suffisent au début.","mod":"m6","li":5,"example":"Un samedi, tu prends la feuille « soudure » et tu vérifies si les essais de traction sont vraiment notés sur les fiches des deux dernières semaines; tu trouves deux trous et tu dates une correction.","next":"Choisis un thème pour ce mois (par exemple les codes lot) et passe une heure à comparer carnet et réalité.","alt":"Comme relire le cahier de dépenses du foyer une fois par mois: tu confrontes ce qui était prévu et ce qui s’est passé, puis tu ajustes.","hint":"Surveillance suit le lot; vérification juge le système à froid."},{"keys":["non","conforme"],"q":"Que faire d’un sachet non conforme à la soudure ?","a":"Un sachet non conforme à la soudure, tu l’écartes ou tu le ressoudes selon ta règle écrite. Tu ne le vends pas en silence. Tu notes l’écart, tu te demandes pourquoi, et tu corriges le geste ou l’outil si le défaut revient.","mod":"m6","li":5,"example":"Un sachet s’ouvre au test de traction: tu le mets dans la caisse « à revoir », tu ressoudes s’il le mérite ou tu vides la poudre pour un autre usage interne documenté, jamais en vente telle quelle.","next":"Écris ta règle de correction soudure en trois lignes, par exemple, et colle-la près de la pince.","alt":"Comme retirer une mangue abîmée du plateau avant la vente: tu ne négocies pas avec le fruit ouvert, tu le sors du lot destiné aux clientes.","hint":"La leçon dit: tu n’improvises pas avec un sachet ouvert, tu appliques la correction écrite."},{"keys":["équipe","haccp"],"q":"Qui peut former l’équipe plan de maîtrise chez toi ?","a":"L’équipe du plan de maîtrise peut être toi et une personne de confiance. Même seule, tu es l’équipe: tu notes tes décisions pour ne pas les perdre. L’échelle doit coller à ton atelier, pas à une usine imaginaire.","mod":"m6","li":4,"example":"Tu demandes à une nièce qui t’aide le samedi de lire la liste de contrôle et de te dire ce qu’elle ne comprend pas: vous formez déjà une petite équipe.","next":"Nomme sur une feuille qui surveille quoi un jour de production, même si c’est surtout toi.","alt":"Comme organiser une cérémonie familiale à deux plutôt qu’avec un comité de vingt personnes, par exemple: peu de rôles clairs battent une foule confuse.","hint":"Les douze étapes parlent d’équipe: chez toi, cela peut tenir sur deux noms."},{"keys":["usage","prévu"],"q":"Pourquoi décrire l’usage prévu du produit ?","a":"Décrire l’usage prévu évite une analyse hors sujet. Tu dis qui consomme le produit et comment: familles préparant une boisson ou cuisinant, conservation au sec, pas un usage médical. Ce cadrage guide les points sensibles et l’étiquetage.","mod":"m6","li":0,"example":"Tu écris « usage: diluer dans de l’eau ou saupoudrer en cuisine, public général, conserver au sec » et tu refuses toute phrase du type « soigne » sur le sachet.","next":"Rédige en cinq lignes, par exemple, l’usage prévu de Baobab Bliss et range la feuille avec ton diagramme de flux.","alt":"Comme préciser si un plat est pour les enfants du quartier ou pour un banquet: le public change ce que tu surveilles et ce que tu écris.","hint":"Sans usage clair, tu analyses comme si c’était une autre denrée: le cadrage évite ce détour."},{"keys":["ifs","brc"],"q":"Que sont IFS ou BRC en une phrase ?","a":"IFS et BRC sont des référentiels privés souvent demandés par de grands distributeurs, surtout en Europe. Tu les regardes seulement si un client les exige. Ils n’effacent ni ton carnet ni tes bonnes pratiques de base.","mod":"m6","li":6,"example":"Un acheteur export cite un référentiel privé: tu notes le nom exact, tu demandes s’il finance l’audit, et tu ne t’y plonges que si la demande est réelle.","next":"Ajoute sur ta feuille de route une ligne « référentiels privés: seulement sur demande client ».","alt":"Comme le règlement intérieur d’un grand magasin lointain: utile si tu y travailles un jour, inutile à coller sur ta porte aujourd’hui.","hint":"Ces sigles vivent dans le pli expert; le quotidien reste ta liste de contrôle réelle."},{"keys":["preuve","qualité"],"q":"Quelles preuves de base comptes-tu déjà ?","a":"Tes preuves de base, ce sont déjà les gestes et les écrits que tu tiens: liste de contrôle cochée, codes lot lisibles, fiches de contrôles, registre des sorties, corrections datées. Par exemple, trois preuves datées battent un long discours. Tu les ranges pour pouvoir les montrer.","mod":"m6","li":6,"example":"Tu montres à Rachid une semaine de fiches lot avec date, code, résultat de soudure et initiale: voilà une preuve simple et réelle.","next":"Rassemble dans une pochette, par exemple cinq preuves déjà existantes, et date la pochette.","alt":"Comme garder les reçus du marché dans une enveloppe: le jour où on te demande des comptes, tu ouvres l’enveloppe au lieu d’inventer.","hint":"Liste ce que tu peux déjà prouver sans nouvel outil."},{"keys":["burkina","d’abord"],"q":"Quelles règles primaries si tu vends à Ouagadougou ?","a":"Si tu vends à Ouagadougou, tu commences par le cadre burkinabè et les exigences de ton canal: marché, boutique ou réseau. Tu notes loyauté de l’étiquette, hygiène de base, poids juste, lots. Tu n’affiches pas un règlement européen entier sur ton mur.","mod":"m7","li":0,"example":"Sur ta carte réglementaire, la colonne de gauche porte: dénomination claire, poids net, code lot, contact, hygiène du local; la colonne de droite attend l’export.","next":"Remplis les deux colonnes « obligatoire pour mon canal actuel » et « plus tard si j’exporte » avec une date de revue dans trois mois.","alt":"Les règles de ta cour d’abord, celles d’une autre ville ensuite: tu ne peins pas ta maison avec le règlement d’un immeuble lointain.","hint":"Priorité au lieu où le sachet part vraiment aujourd’hui."},{"keys":["nbf","pulpe","norme"],"q":"Que dit le catalogue ABNORM 2025 sur la pulpe ?","a":"Le catalogue ABNORM 2025 confirme l’existence et le titre de la norme sur la pulpe du fruit de baobab, dite aussi pain de singe. Il donne la pagination, pas tous les seuils détaillés. Pour les valeurs exactes, tu obtiens le texte auprès de l’organisme de normalisation, sans inventer de chiffres.","mod":"m7","li":1,"example":"Tu écris sur une carte « NBF 01-212:2018 Pulpe du fruit de baobab (pain de singe): Spécifications » et tu ranges la carte dans le carnet en attendant le texte complet.","next":"Note aujourd’hui le titre exact de la norme et un contact pour l’obtenir.","alt":"Comme savoir qu’il existe un règlement intérieur de l’école avant d’en réciter chaque article: tu connais le document, tu liras le détail au guichet.","hint":"Le catalogue prouve que la norme existe; il ne remplace pas la lecture du texte."},{"keys":["conformité","déclarer"],"q":"Peut-on déclarer une conformité sans lire la norme ?","a":"Non, tu ne déclares pas une conformité à la norme sans l’avoir lue. Tu peux dire que tu connais le titre exact, que tu vas l’acquérir, et montrer déjà ton hygiène et tes lots. Inventer des seuils pour faire sérieux casse la confiance.","mod":"m7","li":1,"example":"Une boutique demande ta conformité: tu réponds honnêtement « je connais le titre, je prépare l’achat du texte, voici déjà ma composition 100 pour cent pulpe et mes codes lot ».","next":"Prépare un petit dossier d’une page: titre de la norme, contact pour l’obtenir, liste de ce que tu fais déjà sans le texte.","alt":"Comme refuser de signer « j’ai lu le contrat » avant d’ouvrir les pages: tu restes digne en disant où tu en es vraiment.","hint":"Garde l’honnêteté et un plan d’acquisition: cela bat une affirmation vide sur le sachet."},{"keys":["autorisations","vérifier"],"q":"Face à une rumeur d’autorisation, que faire ?","a":"Face à une rumeur d’autorisation, tu vérifies auprès d’une source officielle ou d’un contact noté, tu dates ce que tu as entendu, et tu n’affirmes rien sur l’étiquette tant que ce n’est pas confirmé. Les rumeurs ne remplacent pas un texte ou un avis écrit.","mod":"m7","li":3,"example":"Quelqu’un au marché dit qu’il faut un tampon spécial pour vendre la poudre: tu notes la phrase, tu appelles ton contact normalisation ou labo, tu attends la réponse avant de changer ton étiquette.","next":"Ajoute sur ta carte réglementaire une ligne « rumeurs: vérifier avant d’agir » avec deux numéros utiles.","alt":"Comme ne pas changer le prix du sac de mil sur la foi d’un bruit de couloir: tu confirmes au marché officiel avant de décider.","hint":"Demande toujours: qui l’a dit par écrit, et où le lire ?"},{"keys":["uemoa","007"],"q":"Que concerne le règlement UEMOA 007 2007 (idée) ?","a":"Le règlement UEMOA 007 de 2007 pose des principes de sécurité sanitaire des végétaux, des animaux et des aliments dans l’espace régional. Il rappelle la responsabilité des opérateurs alimentaires. Pour toi, l’esprit est clair: tu mets sur le marché un produit sûr et loyal.","mod":"m7","li":2,"example":"Tu notes sur ta carte « union économique régionale: responsabilité d’opératrice » dans la colonne actuelle, sans recopier tout le texte sur le mur de l’atelier.","next":"Ajoute une ligne datée sur ta carte réglementaire pour ce règlement régional et le sens que tu en retiens.","alt":"Comme les règles partagées d’un grand quartier entre plusieurs concessions: chacun reste responsable de ce qu’il met dehors.","hint":"Retiens le mot responsabilité plutôt qu’une litanie de numéros."},{"keys":["codex","spécifique"],"q":"Y a-t-il une norme Codex spécifique pulpe de baobab ?","a":"Dans la recherche du cours, aucune norme Codex spécifique « pulpe de baobab » n’a été identifiée. Le Codex reste une référence internationale utile pour l’hygiène et les principes, pas un texte produit nommé pour ta poudre. Tu t’appuies d’abord sur la norme burkinabè à acquérir.","mod":"m7","li":1,"example":"Quand une cliente savante cite « le Codex baobab », tu réponds calmement que tu suis la norme nationale en vigueur et les principes généraux, sans inventer un numéro Codex produit.","next":"Écris sur une fiche: « pas de norme Codex produit baobab identifiée; référence locale à lire en priorité ».","alt":"Comme chercher le règlement d’un club qui n’existe pas encore: tu ne l’inventes pas, tu travailles avec le document local qui existe.","hint":"Absence de norme Codex produit ne veut pas dire absence de règles: le local compte."},{"keys":["cxc1","hygiène"],"q":"À quoi sert CXC 1 ?","a":"CXC 1 est le code d’usages international du Codex sur les principes généraux d’hygiène des aliments. Il guide l’analyse des points à surveiller et les mesures de maîtrise le long du flux. Tu en retiens l’esprit: voir, maîtriser, proportionner, sans noyer l’atelier sous le jargon.","mod":"m7","li":2,"example":"Tu relies CXC 1 à ta feuille des points sensibles: réception, tamis, soudure, stock, avec un geste de maîtrise pour chacun.","next":"Relis ta feuille des points sensibles et coche ceux qui ont déjà un geste écrit.","alt":"Comme le guide de bonne conduite d’une association de femmes: principes partagés, adaptés à la taille du groupe.","hint":"Le sigle désigne un code d’hygiène international; l’utile, c’est ta feuille locale."},{"keys":["novel","food","2008"],"q":"Quel est le statut européen de la pulpe séchée de baobab ?","a":"Pour le statut européen de la pulpe séchée de baobab, tu n’inventes rien: tu vérifies auprès de l’importateur ou des sources officielles à jour. Le cours demande de confirmer le statut sans affirmer un chiffre ou une date de mémoire. Tant que tu vends à Ouaga, ce point reste dans la colonne export.","mod":"m7","li":1,"example":"Tu ajoutes dans ta pochette export une question écrite: « quel est le statut actuel de la pulpe de baobab sur le marché européen ? » à poser au futur partenaire.","next":"Inscris cette question sur la page « questions pour l’importateur » de ta pochette export.","alt":"Comme demander au guichet si un document de voyage est encore valable plutôt que de le décider soi-même au bord du quai.","hint":"Confirme le statut auprès d’une source réelle: tu ne l’inventes jamais sur WhatsApp."},{"keys":["178","2002"],"q":"Que pose le règlement 178 2002 (idée) ?","a":"Le règlement 178 de 2002 pose les principes généraux du droit alimentaire européen: sécurité des denrées, traçabilité, responsabilité de l’exploitant, et retrait si un produit non conforme a quitté ton contrôle. C’est le socle que les autres textes d’hygiène prolongent.","mod":"m7","li":2,"example":"Tu relies ce texte à ton carnet: si un lot douteux a déjà quitté l’atelier, tu engages le retrait et tu informes, au lieu d’attendre en silence.","next":"Reformule en une phrase ce que tu retiendras: « je dois pouvoir retracer et retirer si besoin ».","alt":"Comme la règle du chef de famille qui dit: si un plat part dehors et qu’il pose problème, on le rappelle et on assume.","hint":"Retiens trois mots pour cette leçon: sécurité, traçabilité, responsabilité."},{"keys":["852","2004"],"q":"Que demande le 852 2004 aux exploitants ?","a":"Le règlement 852 de 2004 demande aux exploitants des bonnes pratiques d’hygiène et, après la production primaire, des procédures fondées sur les principes d’analyse des points sensibles. Il prévoit une flexibilité pour les petites structures: maîtrise réelle, paperasse proportionnée.","mod":"m7","li":2,"example":"Tu traduis l’esprit en liste de contrôle matin-pendant-soir et en deux points vraiment surveillés, sans recopier un classeur d’usine sur ton mur.","next":"Écris en cinq lignes, par exemple, comment ton plan quotidien répond déjà à « maîtriser, tracer, montrer ».","alt":"Comme les règles d’une petite cantine: chacun nettoie, on note l’essentiel, on ne copie pas le classeur d’un hôpital entier.","hint":"La flexibilité d’un petit atelier ne veut pas dire zéro hygiène: reste proportionnée."},{"keys":["1169","inco"],"q":"Que cadre le règlement 1169 2011 ?","a":"Le règlement 1169 de 2011 cadre l’information des consommateurs en Europe: dénomination, ingrédients, allergènes si présents, quantité nette, dates selon les cas, conservation, nom et adresse, nutrition dans certains cas. Pour Ouaga, tu commences par un étiquetage loyal et lisible; l’Europe s’ajoute si tu y vends.","mod":"m7","li":0,"example":"Ton sachet porte déjà dénomination, poids, lot, nom et adresse, date de durabilité et « 100 pour cent pulpe, rien d’ajouté » si c’est vrai: tu notes ce qui manquerait encore pour un marché européen plus tard.","next":"Prends une photo de ton étiquette et coche: nom du produit, poids, lot, nom et adresse, date, promesse vraie.","alt":"Comme présenter un plat à table: tu nommes le mets, tu indiques la portion, tu dis qui a cuisiné, tu restes honnête sur les ingrédients.","hint":"Ce texte parle d’étiquette honnête et complète; le détail des articles vit dans le pli expert."},{"keys":["2023","915","contaminants"],"q":"Comment lire les contaminants pour l’export Europe ?","a":"Pour lire les contaminants à l’export Europe, tu cherches la catégorie la plus proche dans l’annexe, tu notes les teneurs, tu fais analyser un échantillon par un labo compétent. Tu n’inventes pas une ligne « baobab » si le produit n’est pas nommé. Tu te fais confirmer la catégorie.","mod":"m7","li":3,"example":"Tu soulignes sur une feuille d’étude la ligne « fruits séchés » candidate, tu copies la teneur, tu écris « à confirmer pour baobab », puis tu demandes un devis d’analyse.","next":"Écris les trois gestes, par exemple: trouver la catégorie, noter la teneur, faire analyser.","alt":"Comme lire le tableau des frais de scolarité: tu cherches la ligne de ta classe, tu n’inventes pas un montant.","hint":"Choisis d’abord la catégorie, puis le chiffre, et confirme avant tout affichage."},{"keys":["1935","contact"],"q":"Que rappelle le 1935 2004 ?","a":"Le règlement 1935 de 2004 rappelle que les matériaux en contact avec les aliments doivent être aptes à cet usage: ils ne doivent pas céder de substances indésirables au produit dans des conditions normales. Pour toi, cela veut dire choisir des sachets et contenants adaptés, et garder les preuves du fournisseur.","mod":"m7","li":0,"example":"Avant d’acheter un nouveau film pour tes sachets kraft, tu demandes au vendeur une déclaration d’aptitude au contact alimentaire et tu la ranges dans le dossier emballage.","next":"Vérifie cette semaine que tes sachets actuels ont une preuve ou une référence claire de contact alimentaire, ou note l’écart à combler.","alt":"Comme ne pas servir le tô dans une bassine destinée à la lessive: le contenant doit être fait pour l’aliment.","hint":"Le texte parle des emballages et outils qui touchent la poudre."},{"keys":["importateur","europe"],"q":"Pourquoi un importateur pour l’Europe ?","a":"Un importateur pour l’Europe connaît souvent les exigences exactes du pays d’arrivée. Il clarifie catégorie, étiquetage, analyses et formalités. Tu poses des questions écrites et tu gardes les réponses. Il ne remplace ni ton hygiène locale ni tes lots.","mod":"m7","li":0,"example":"Tu prépares une page de questions: statut du produit, catégorie contaminants, langue de l’étiquette, analyses attendues, et tu l’envoies au partenaire quand le moment vient.","next":"Note sur une feuille datée ce que tu demanderais d’abord à un importateur: catégorie, analyses, langue d’étiquette.","alt":"Comme prendre un guide local quand tu arrives dans une ville inconnue: il connaît les portes, toi tu restes responsable de tes affaires.","hint":"Son rôle: clarifier le marché d’arrivée, pas faire ton nettoyage à ta place."},{"keys":["bulletin","labo"],"q":"Comment lire un bulletin d’analyse ?","a":"Lire un bulletin d’analyse, c’est vérifier le nom du produit, le numéro de lot, la date, les paramètres mesurés et les résultats face aux teneurs attendues. Tu ranges le rapport avec le lot concerné. Un beau rapport sans lien de lot sert presque à rien si une question revient.","mod":"m7","li":3,"example":"Tu reçois un résultat d’humidité: tu contrôles que le code lot du bulletin est le même que sur tes sachets, puis tu classes le papier dans la fiche de ce lot.","next":"Si tu as déjà un bulletin, relie-le à son lot; sinon écris la règle « pas de classement sans nom de lot ».","alt":"Comme lire un bulletin scolaire: tu regardes le nom de l’enfant, la date et les notes, pas seulement le tampon coloré.","hint":"Lot, date, paramètres, résultats: les quatre coins de la lecture."},{"keys":["échantillonnage"],"q":"Pourquoi l’échantillonnage compte-t-il ?","a":"L’échantillonnage compte parce que le labo ne mesure que ce que tu lui envoies. Un échantillon mal pris, mélangé entre lots ou mal étiqueté donne une réponse trompeuse. Tu notes masse prélevée, date, lot, labo et délai de rendu.","mod":"m7","li":3,"example":"Tu prépares un sachet d’échantillon avec le même code que le lot du mardi, tu refuses de mélanger la poudre de deux jours, tu colles une étiquette claire avant l’envoi.","next":"Écris un protocole simple d’échantillonnage en cinq lignes, par exemple, et range-le près de la balance.","alt":"Comme goûter la sauce: si tu plonges la cuillère dans un autre pot, tu juges le mauvais plat.","hint":"L’étiquette d’échantillon est sacrée: un lot, un sachet, une date."},{"keys":["cercles","preuves"],"q":"Que signifie local, régional, européen comme cercles ?","a":"Local, régional et européen sont trois cercles de règles. Local: ce qui s’applique où tu vends aujourd’hui. Régional: principes de l’union économique. Européen: seulement si tu mets le produit sur ce marché. Chaque cercle a ses preuves; tu ne les mélanges pas sur l’étiquette cliente.","mod":"m7","li":0,"example":"Ta carte montre Ouaga en premier, UEMOA en note, Europe en colonne de droite avec analyses et étiquetage cible à préparer plus tard.","next":"Dessine trois cercles sur une page et place une preuve typique dans chacun.","alt":"Comme les règles de la maison, du quartier, puis de la ville lointaine où tu voyageras un jour: tu vis d’abord ici.","hint":"Le cours dit: local d’abord, export ensuite, sans panique."},{"keys":["séchage","mangue","futur"],"q":"Le séchage à air chaud en couche mince sert surtout à quoi dans ce cours ?","a":"Il sert surtout aux produits futurs riches en eau : mangue, tomate, oignon ou feuilles. Pour Baobab Bliss aujourd’hui, ce n’est pas le geste central du pain de singe déjà sec dans la gousse. Tu apprends les idées sans les coller sur ton lot du jour.","mod":"m4","li":4,"example":"Tu prépares une claie pour un essai mangue du week-end, pendant que le lot baobab du vendredi ne fait que séparation, tamis et sachet, sans air chaud.","next":"Écris quatre titres sur la page « futurs fruits » : produit, épaisseur, temps, poids.","alt":"Sécher des tranches de manioc près du feu et trier une farine déjà sèche sont deux gestes voisins, pas interchangeables. Même distinction ici.","hint":"Ce geste retire-t-il beaucoup d’eau d’un fruit juteux, ou termine-t-il le baobab de base ?"},{"keys":["réception","critère","fruit"],"q":"Que faire d’un fruit douteux à la réception ?","a":"Tu le mets à part dans une zone « à revoir », tu décides avec un critère écrit, et tu notes fournisseur et décision sur la fiche lot. Tu n’envoies pas un doute plus loin dans le flux. La réception est déjà une maîtrise.","mod":"m4","li":0,"example":"Une gousse fendue avec odeur douteuse arrive dans le panier. Tu l’isoles, tu coches « écartée » avec le nom du fournisseur, et tu continues le lot avec les fruits sains seulement.","next":"Écris trois critères go ou non pour la réception et colle-les près de la zone d’arrivée des fruits.","alt":"Comme écarter une tomate abîmée avant de préparer la sauce pour toute la famille : tu décides à l’entrée, pas au moment de servir.","hint":"Où places-tu le fruit douteux, et qu’écris-tu avant de passer au cassage ?"},{"keys":["rendement","pulpe","calcul"],"q":"Comment calculer un rendement de pulpe ?","a":"Tu prends cent fois la masse de pulpe obtenue, divisée par la masse de fruits cassés. Compare plusieurs lots pour voir ta moyenne et tes écarts. Marque clairement « exemple » si tu utilises des nombres d’exercice.","mod":"m4","li":4,"example":"Par exemple, 7,2 kilogrammes de pulpe brute pour 20 kilogrammes de fruits cassés donnent 36 pour cent de rendement pulpe. Tu le compares au lot suivant du même fournisseur.","next":"Calcule le rendement pulpe sur ton prochain panier cassé et note-le à côté du nom du fournisseur.","alt":"Comme peser les arachides décortiquées face aux arachides en coque : tu vois ce que la séparation te laisse vraiment.","hint":"Quel poids mets-tu en haut, et quel poids de fruits cassés en bas ?"},{"keys":["tamis","toile","fiche"],"q":"Pourquoi noter la toile de tamis sur la fiche lot ?","a":"Pour comparer la texture d’un sachet à l’autre. Sans cette note, « poudre fine » ne veut pas dire la même chose d’une semaine à l’autre. Tu photographies aussi la toile à côté d’une pièce si tu n’as pas de numéro.","mod":"m4","li":2,"example":"Deux semaines plus tard, une cliente trouve la poudre plus granuleuse. Tu ouvres les fiches et tu vois qu’une autre toile a été utilisée un jour de remplacement.","next":"Ajoute dès aujourd’hui la case « toile de tamis » sur ta fiche lot et remplis-la à chaque série.","alt":"Comme noter quel panier a servi à vanner le mil : sans note, tu ne retrouves pas pourquoi un jour le grain était plus propre.","hint":"Comment prouves-tu qu’une « poudre fine » d’aujourd’hui est comparable à celle de la semaine dernière ?"},{"keys":["finition","seulement","besoin"],"q":"Quand faire une finition de séchage sur la pulpe ?","a":"Seulement si le toucher ou le poids montrent un besoin réel après le tamis. Ce n’est pas un rituel automatique. Tu mesures ou observes, tu notes, tu décides, puis tu refroidis avant d’emballer.","mod":"m4","li":3,"example":"Le lot de fin de journée semble libre et coule bien. Tu passes au sachet sans finition. Le lendemain, un lot un peu collant après une nuit humide reçoit une finition courte en couche fine.","next":"Sur la prochaine fiche, prévois deux cases : « finition : oui ou non » et « raison observée ».","alt":"Comme ne repasser que le pagne encore froissé : tu n’allumes pas le fer par habitude si le tissu est déjà net.","hint":"As-tu un signe hors cible sous les doigts ou sur la balance, ou seulement l’envie de « faire comme un séchage » ?"},{"keys":["bilan","matière","écarts"],"q":"Que faire si un bilan matière ne tombe pas juste ?","a":"Cherche d’abord un oubli de pesée ou un bol non compté avant de changer le procédé. Un écart est une information utile. Recommence la pesée avant de soupçonner le fournisseur.","mod":"m4","li":1,"example":"Ton bilan laisse un trou d’environ 200 grammes. Tu retrouves un bol de refus de tamis oublié sous la table. Une fois pesé, les cases se ferment.","next":"Sur le prochain bilan, coche une liste : fruits, coques, graines, pulpe, refus, poudre, sachets, avant de conclure.","alt":"Comme compter la monnaie de la journée : tu revérifies les piles avant de dire qu’il manque quelque chose au marché.","hint":"Quel oubli simple vérifies-tu en premier quand les chiffres ne ferment pas ?"},{"keys":["flux","baobab","ordre"],"q":"Quel est l’ordre de base du procédé baobab ?","a":"L’ordre de base est : sélectionner les fruits, casser les gousses, séparer pulpe et graines, broyer avec soin, tamiser, contrôler, puis emballer au sec. Cet enchaînement garde la propreté et évite de chauffer sans besoin.","mod":"m4","li":0,"example":"Tu accueilles un panier le matin : tu tries d’abord, tu casses, tu sépares sur une toile propre, tu broies, tu tamises, tu regardes l’aspect, puis tu doses dans les sachets au sec.","next":"Dessine cet ordre en cases sur une feuille et montre-le à la personne qui t’aide pour vérifier qu’il est clair.","alt":"Comme enfiler les perles dans le bon sens pour un collier : si tu emballes avant de tamiser, tu bloques tout le fil.","hint":"Quel geste vient avant le sachet : le contrôle après tamis, ou le dessin de l’étiquette ?"},{"keys":["teneur","eau","base","sèche"],"q":"Quelle est la différence entre teneur en eau base humide et base sèche ?","a":"En base humide, tu rapportes la masse d’eau à la masse totale. En base sèche, tu rapportes la masse d’eau à la masse sèche seulement. La base sèche sert souvent aux bilans de séchage parce qu’elle ne change pas quand l’eau part.","mod":"m4","li":3,"example":"Par exemple, pour un futur plateau mangue, tu notes l’eau sur matière sèche pour comparer deux heures de séchage sans te tromper quand le poids total diminue.","next":"Écris les deux définitions côte à côte dans le carnet « futurs fruits », avec les mots « totale » et « sèche ».","alt":"Comme parler de la sauce : « beaucoup d’eau dans tout le bol » n’est pas la même phrase que « beaucoup d’eau pour la seule farine ». Deux façons de compter.","hint":"Dans un cas le dénominateur inclut l’eau ; dans l’autre, il ne garde que la matière sans eau. Lequel est lequel ?"},{"keys":["claies","mangue","essai"],"q":"Comment démarrer un essai de séchage mangue ?","a":"Commence par une petite claie, un carnet avec heure, toucher et poids, puis seulement des volumes plus grands si l’essai est stable. Tu contrôles épaisseur, air et durée. Tu ne copies pas une recette sans mesure.","mod":"m4","li":2,"example":"Le samedi, tu déposes une seule couche de tranches régulières, tu pèses le plateau au départ et à deux reprises, tu notes couleur et goût. Dimanche tu décides si tu agrandis.","next":"Prépare une fiche d’essai mangue avec colonnes : heure, poids, toucher, couleur.","alt":"Comme goûter une nouvelle sauce sur une petite casserole avant d’en faire pour toute la cour. Tu apprends petit, puis tu élargis.","hint":"Par quelle taille d’essai commences-tu, et que notes-tu avant d’augmenter le volume ?"},{"keys":["coques","mélange","lots"],"q":"Pourquoi nettoyer entre deux lots fournisseurs ?","a":"Pour ne pas mélanger les origines. Un mélange brouille la traçabilité si une question arrive plus tard. Nettoyer broyeur et tamis entre deux lots fournisseurs est une vraie étape de la ligne.","mod":"m4","li":1,"example":"Tu finis le panier du fournisseur A. Avant d’ouvrir celui de B, tu brosses le tamis, tu changes de torchon propre, et tu notes le nettoyage sur la fiche.","next":"Ajoute sur chaque fiche lot une case « nettoyage entre fournisseurs » à cocher.","alt":"Comme rincer la marmite entre deux sauces très différentes pour un repas de fête : tu veux que chaque goût reste lisible.","hint":"Si un sachet pose question, pourras-tu encore dire quel fournisseur était seul dans la machine ?"},{"keys":["plateau","blanc","éclat"],"q":"À quoi sert un plateau blanc après le tamis ?","a":"Le plateau blanc fait ressortir éclats de coque ou corps étrangers avant emballage. Tu regardes à la lumière, tu écartes ce qui ne doit pas partir en sachet, puis tu notes si le défaut revient souvent.","mod":"m4","li":2,"example":"Après le tamis, tu étales une fine couche sur un plateau clair. Un petit éclat de coque apparaît tout de suite ; tu l’ôtes avant le dosage.","next":"Place un plateau clair dédié juste après le tamis et utilise-le sur le prochain lot.","alt":"Comme trier le riz sur une nappe claire : les petits cailloux se voient mieux que sur un fond sombre.","hint":"Pourquoi un fond clair aide-t-il l’œil juste avant le sachet ?"},{"keys":["refroidissement","soudure"],"q":"Pourquoi refroidir avant de souder ?","a":"La chaleur enfermée crée de la buée dans le sachet et peut défaire le bénéfice d’une finition. Tu attends que la poudre soit proche de la température de la pièce, à l’abri de l’air trop humide, puis tu soudes.","mod":"m4","li":3,"example":"Après une finition douce de, par exemple, vingt minutes, tu étends la poudre dans un bac propre une heure. Ensuite seulement tu doses et tu soudes sans retrouver de buée au matin.","next":"Chronomètre une pause de refroidissement et écris-la comme poste de maîtrise sur la fiche.","alt":"Comme le tô trop chaud mis dans une boîte fermée : la vapeur revient en eau sur le couvercle. La poudre fait pareil dans un sachet soudé trop tôt.","hint":"Que se dépose sur les parois internes si tu fermes encore chaud ?"},{"keys":["indicateurs","mois","trois"],"q":"Quels trois chiffres utiles afficher chaque mois ?","a":"Trois chiffres utiles : rendement moyen, écarts d’emballage, et nombre de lots sans fiche complète. Un tableau d’une page suffit pour voir si tu progresses d’un mois à l’autre.","mod":"m4","li":5,"example":"En fin de mois, tu affiches près de l’atelier : rendement moyen du mois, nombre de sachets écartés, et combien de lots ont une fiche incomplète. Toute l’aide voit les mêmes nombres.","next":"Prépare une feuille mensuelle avec ces trois cases et remplis-la à la fin du mois en cours.","alt":"Comme compter à la fin du mois les repas réussis, les plats repartis et les listes oubliées : trois nombres pour voir la maison clairement.","hint":"Quels trois indicateurs simples tiendraient sur une seule page visible ?"},{"keys":["humidité","stockage","réception"],"q":"Pourquoi stocker les fruits au sec avant cassage ?","a":"L’humidité ambiante dégrade la suite du travail et peut coller la pulpe. Un local sec, à l’abri des insectes, protège le process avant même le cassage. Tu surélèves et tu aères sans exposer à la pluie.","mod":"m4","li":3,"example":"Pendant la saison des pluies, tu ranges les gousses sur une étagère sèche plutôt qu’au sol près d’un mur qui suinte. Le cassage du lendemain reste plus net.","next":"Vérifie aujourd’hui où dorment tes fruits en attente et surélève-les si besoin.","alt":"Comme le sac de mil : tu ne le poses pas directement sur le sol humide. Les gousses méritent le même réflexe.","hint":"Que craint la pulpe encore dans la gousse si le local d’attente est humide ?"},{"keys":["épaisseur","tranches","séchage"],"q":"Quel rôle joue l’épaisseur des tranches en séchage mangue ?","a":"Elle pilote le temps de séchage. Trop épais, le cœur reste humide. Trop fin, tu peux sur-sécher et casser les morceaux. Des tranches régulières donnent un plateau plus homogène.","mod":"m4","li":4,"example":"Sur un essai, des tranches très épaisses restent souples au centre alors que le bord durcit. Au plateau suivant, tu vises une épaisseur plus régulière et tu retrouves un séchage plus uniforme.","next":"Pour le prochain essai mangue, choisis une épaisseur cible et coupe un témoin que tu casses en fin de cycle.","alt":"Comme faire sécher des tranches de manioc : trop épaisses, le milieu reste mou ; trop fines, ça brûle ou casse. L’épaisseur mène le résultat.","hint":"Si le centre reste humide, que changes-tu d’abord sur la tranche ?"},{"keys":["opération","unitaire","réception"],"q":"En quoi la réception est-elle une opération unitaire de maîtrise ?","a":"Tu y appliques des critères go ou non, tu enregistres fournisseur et décision, et tu évites d’envoyer un problème plus loin dans le flux. C’est une opération unitaire de maîtrise, pas seulement un déchargement.","mod":"m4","li":0,"example":"Chaque panier reçoit une ligne : date, fournisseur, accepté ou écarté, motif. Un fruit douteux n’atteint pas le cassage sans cette ligne.","next":"Crée une petite fiche réception d’une demi-page et utilise-la sur la prochaine livraison.","alt":"Comme contrôler les légumes avant de les mettre au panier de cuisine : tu tries à l’entrée pour protéger tout le repas.","hint":"Quels enregistrements fais-tu à l’arrivée avant de casser la première gousse ?"},{"keys":["granulométrie","écoulement"],"q":"Pourquoi la granulométrie compte-t-elle pour une poudre à boire ?","a":"Elle influence l’écoulement, le mélange dans la boisson et la sensation en bouche. Une poudre trop hétérogène se comporte bizarrement dans l’eau et se tasse mal dans le sachet. Le tamisage classe les tailles pour une coupe régulière.","mod":"m4","li":6,"example":"Une cliente prépare une boisson et sent des grains sous la langue. Tu revérifies la toile et le temps de broyage du lot concerné, puis tu harmonises le réglage.","next":"Goûte une cuillère diluée de ton dernier lot et note texture en bouche sur la fiche.","alt":"C’est comme une farine de mil trop grossière dans une bouillie : le grain se sent, et la boisson n’est pas lisse. La taille compte pour le plaisir.","hint":"Que ressent la langue si les tailles de particules varient trop ?"},{"keys":["période","constante","décroissante"],"q":"Que se passe-t-il souvent pendant le séchage d’un fruit riche en eau ?","a":"Souvent une période où l’eau part vite à vitesse quasi constante, puis une période plus lente quand l’eau liée résiste. Ton chronomètre et une balance de plateau valent mieux qu’une recette copiée sans mesure.","mod":"m4","li":0,"example":"Sur un plateau mangue, le poids chute vite la première heure, puis beaucoup moins ensuite. Tu notes les deux phases pour prévoir le temps réel la prochaine fois.","next":"Lors d’un essai, pèse au moins trois fois et marque sur le carnet où le rythme ralentit.","alt":"Comme une flaque au soleil : le dessus part vite, puis le reste collé au sol s’évapore plus lentement. Le fruit suit une histoire proche.","hint":"Le rythme de perte d’eau reste-t-il identique du début à la fin ?"},{"keys":["équation","bilan","entrée"],"q":"Quelle équation de bilan matière retenir ?","a":"Entrées égales sorties plus accumulation plus pertes non mesurées. Sur un lot fini traité entièrement, tu cherches une accumulation nulle dans l’atelier et tu réduis la part non mesurée. Balance et cases nommées suffisent pour commencer.","mod":"m4","li":1,"example":"Tu additionnes coques, graines, poudre, refus et sachets. S’il reste un trou, tu cherches le bol oublié avant de modifier le procédé.","next":"Écris l’équation en une ligne en tête de ta page bilan et applique-la au prochain petit lot.","alt":"Comme le budget de la semaine : ce qui entre doit se retrouver en dépenses, restes et oublis. Tu traques les oublis.","hint":"Que mets-tu en face des entrées pour fermer le compte d’un lot ?"},{"keys":["emballage","fonctions"],"q":"Quelles fonctions principales un emballage doit-il remplir pour Baobab Bliss ?","a":"Protéger, surtout freiner l’humidité, permettre la soudure, et porter les informations loyales : nom, poids, lot, contact. Ce n’est pas seulement un joli papier. Décide aussi quelle durée tu vises avant de choisir le film.","mod":"m5","li":0,"example":"Tu regardes trois sachets du marché : farine, lait en poudre, épices. Tu notes comment ils ferment, s’ils sont opaques, puis tu listes les mêmes rôles pour Baobab Bliss.","next":"Liste sur une page les trois rôles de ton sachet : protéger, informer, servir l’usage.","alt":"Comme un panier pour porter des œufs : joli ne suffit pas ; il doit empêcher la casse et te laisser lire ce que tu transportes.","hint":"Avant le dessin, quelles fonctions de protection et d’information dois-tu garantir ?"},{"keys":["prise","masse","essai"],"q":"Comment comparer deux films sans laboratoire ?","a":"Remplis des sachets de même masse, laisse-les dans le même local quelques jours, puis classe selon la prise de masse. Celui qui grossit le plus a repris plus d’eau. Garde un échantillon de chaque film avec la date et le résultat.","mod":"m5","li":1,"example":"Tu prépares six sachets : trois d’un film A, trois d’un film B, même poudre, même pièce. Après trois jours tu repèses et tu choisis le candidat le plus stable.","next":"Si tu as deux films, lance ce mini essai de reprise de poids sur trois jours et note les masses.","alt":"Comme comparer deux bâches sur le mil : tu regardes laquelle laisse vraiment moins passer l’humidité, pas seulement laquelle paraît plus épaisse.","hint":"Sans labo, quel signe simple sur la balance compare deux films ?"},{"keys":["contact","alimentaire","document"],"q":"Que faire d’un film sans information de contact alimentaire ?","a":"Traite-le comme un inconnu : ne lance pas toute la production dessus. Cherche une alternative documentée ou une déclaration écrite du fournisseur. Classe-le en « refusé » tant que l’information manque.","mod":"m5","li":2,"example":"Un rouleau sans aucune mention alimentaire arrive. Tu le ranges dans la boîte « refusé », tu continues avec le film documenté, et tu demandes un écrit avant tout nouvel achat.","next":"Colle sur le mur la liste « autorisé au contact » en trois lignes et vérifie que chaque outil y figure.","alt":"Comme refuser un bidon sans étiquette pour stocker l’huile de cuisine : sans information, tu choisis plutôt un contenant connu et documenté.","hint":"Que fais-tu d’un matériau sans preuve avant de remplir toute une série client ?"},{"keys":["soudure","poudre","joint"],"q":"Pourquoi la poudre dans le joint est-elle un problème ?","a":"Elle empêche une fermeture hermétique et crée des fuites d’air humide. Nettoyer la zone avant de souder est un geste de maîtrise. Une soudure farinée est une fuite annoncée.","mod":"m5","li":5,"example":"En fin de série, tu comptes plusieurs sachets écartés pour « poudre dans le joint ». Tu ralentis le dosage, tu essuies les bords, et le taux d’écarts baisse le lendemain.","next":"Compte aujourd’hui les sachets écartés avec le motif « poudre dans le joint » et note-le sur la fiche.","alt":"Comme coller deux bords de papier avec de la farine dessus : ça n’adhère pas. La soudure a besoin d’une ligne propre.","hint":"Que laisse un grain coincé dans la ligne de soudure comme chemin pour l’air ?"},{"keys":["stock","surélevé","rotation"],"q":"Quels gestes de stock protéger la poudre ?","a":"Surélever les cartons, garder au sec, éloigner des murs humides et du soleil direct, et sortir le plus ancien d’abord. Le stock est la dernière machine de ton procédé : l’air et le temps.","mod":"m5","li":0,"example":"Tu places les cartons sur des briques, étiquette du lot le plus ancien devant à hauteur d’yeux, loin du mur qui suinte pendant les pluies.","next":"Place un carton témoin à hauteur d’yeux avec la date du lot le plus ancien devant.","alt":"Comme ranger le mil dans des bidons surélevés plutôt qu’à même le sol en saison des pluies : l’endroit change la durée de vie.","hint":"Quels quatre gestes de lieu et de rotation protègent les sachets déjà soudés ?"},{"keys":["éco","rebuts"],"q":"Par où commence l’éco-conception légère ici ?","a":"Par réduire les sachets écartés et éviter le suremballage, tout en gardant la protection nécessaire. Moins de rebuts est déjà écologique et économique à Ouagadougou. Tu mesures avant de changer de discours.","mod":"m5","li":5,"example":"Après une courte formation soudure, tu compares deux semaines de rebuts. Le taux baisse : tu as déjà fait de l’éco-conception sans changer de film.","next":"Ajoute sur la fiche lot les cases « sachets écartés » et « poudre perdue estimée ».","alt":"Comme cuisiner juste assez de tô pour le repas : trop de restes froids jetés, c’est de l’énergie et de la farine perdues. Ici tu vises le juste emballage.","hint":"Par quel chiffre simple commences-tu avant d’imprimer une phrase verte ?"},{"keys":["barrière","vapeur"],"q":"Pourquoi la barrière à la vapeur d’eau est-elle centrale à Ouagadougou ?","a":"Parce qu’une poudre sèche peut reprendre l’humidité de l’air chaud et humide. Un film trop ouvert ramollit le produit et fait coller. À Ouagadougou en saison des pluies, freiner la vapeur d’eau est central.","mod":"m5","li":4,"example":"Un sachet trop ouvert à la vapeur grossit et colle après une semaine orageuse, alors qu’un film mieux choisi du même lot reste libre au toucher.","next":"Demande au prochain vendeur ce qu’il sait de la barrière à l’humidité ; si rien, note « inconnu » et compare ailleurs.","alt":"Comme choisir un manteau pour la saison des pluies : épais ne suffit pas, il faut qu’il rebute vraiment l’eau. Ton film est le manteau de la poudre.","hint":"Quel transfert de l’air de Ouagadougou menace le plus une poudre déjà sèche ?"},{"keys":["déclaration","conformité"],"q":"À quoi sert une déclaration d’aptitude au contact ?","a":"Elle documente que le matériau convient à l’usage prévu : type d’aliment, température, durée. Ce n’est pas un badge décoratif. Tu la ranges avec la facture et tu t’y réfères si une question arrive.","mod":"m5","li":0,"example":"Tu obtiens enfin un écrit du fournisseur pour ton film intérieur. Tu le classes dans le dossier emballage Baobab Bliss à côté de l’échantillon du film.","next":"Crée une pochette « preuves film » et y mets le premier écrit ou note clairement ce qui manque.","alt":"Comme garder le papier d’un médicament de la pharmacie : tu sais pour qui et pour quel usage il est fait. Le film mérite la même clarté.","hint":"Que prouve ce document au-delà du mot « alimentaire » dit à voix haute ?"},{"keys":["taux","défauts","soudure"],"q":"Comment calculer un taux de défauts emballage ?","a":"Cent fois le nombre de sachets écartés, divisé par le nombre de sachets produits. Tu suis ce taux mois après mois. Les motifs d’écart guident la formation plus que le seul pourcentage.","mod":"m5","li":5,"example":"Par exemple, 12 sachets écartés sur 200 produits donnent 6 pour cent. Après réglage de la pince, tu vises de faire baisser ce taux sur le mois suivant.","next":"Calcule le taux de la dernière série et écris-le avec le motif principal d’écart.","alt":"Comme compter les coutures ratées sur une série de pagnes : le taux te dit si la formation a servi.","hint":"Quel rapport simple fais-tu entre écarts et total produit ?"},{"keys":["sachet","témoin"],"q":"À quoi sert un sachet témoin dans le stock ?","a":"Il sert à suivre la reprise d’humidité en le pesant régulièrement. La courbe guide mieux qu’une simple impression. Tu l’ouvres seulement pour contrôle, pas pour la vente.","mod":"m5","li":4,"example":"Au milieu du stock, un sachet daté « témoin lot 12 » est repesé chaque lundi. La courbe reste plate : tu gardes confiance dans film et soudure pour ce lot.","next":"Désigne un sachet témoin du stock actuel et note sa masse de départ dans le carnet de stock.","alt":"Comme laisser une pierre de référence sur le chemin pour voir si la mare monte : tu compares toujours au même point.","hint":"Pourquoi repeser toujours le même sachet plutôt que d’en ouvrir un au hasard chaque fois ?"},{"keys":["durée","vie","film"],"q":"Pourquoi décider la durée de vie visée avant d’acheter le film ?","a":"Un sachet vendu vite n’a pas les mêmes besoins qu’un sachet qui attend des mois. Le choix du film suit cet objectif de durée. Tu décides la cible avant d’acheter un stock entier.","mod":"m5","li":0,"example":"Pour des ventes de marché chaque samedi, tu acceptes un film correct à court terme. Pour un dépôt qui garde trois mois, tu exiges une barrière plus forte testée chez toi.","next":"Écris la durée de vie que tu vises pour ton canal principal avant le prochain achat de film.","alt":"Comme choisir des chaussures pour un trajet court ou pour un long voyage à pied : la durée change l’exigence.","hint":"Que dois-tu fixer avant de comparer les films chez le vendeur ?"},{"keys":["multicouche","soudable"],"q":"Que cherche-t-on souvent dans un film multicouche artisanal ?","a":"Souvent une face intérieure soudable, une barrière adaptée au milieu, parfois une opacité à l’extérieur, pour un coût encore tenable. Tu demandes au vendeur, en langage clair, ce que chaque couche est censée faire.","mod":"m5","li":0,"example":"Tu choisis un film avec intérieur qui se soude sur ta pince, milieu qui freine l’humidité, et dehors qui masque un peu la lumière, puis tu valides par essai de poids.","next":"Pour le film actuel, note en trois mots : soudable, barrière, opaque ou non.","alt":"Comme un pagne doublé pour la fraîcheur : chaque couche a un rôle, le tout doit encore se coudre facilement.","hint":"Quelles fonctions cherches-tu souvent à combiner dans plusieurs couches ?"},{"keys":["sac","poubelle"],"q":"Peut-on emballer la poudre dans un sac poubelle ?","a":"Non. Ce n’est pas un usage alimentaire documenté. Tu classes ce type de film en « refusé ». Même propre en apparence, il n’est pas pensé pour le contact avec ta poudre.","mod":"m5","li":0,"example":"Quelqu’un propose d’économiser avec des sacs noirs du marché. Tu refuses, tu montres ta liste « autorisé au contact », et tu gardes le film documenté pour Baobab Bliss.","next":"Ajoute explicitement « sac poubelle : refusé » sur ta liste murale des matériaux.","alt":"Tu ne sers pas le repas dans le seau du savon. Un sac poubelle suit la même logique de refus calme.","hint":"Ce sac a-t-il une preuve d’usage alimentaire, ou seulement un prix bas ?"},{"keys":["formation","soudure"],"q":"Pourquoi former toute personne qui soude ?","a":"Des gestes différents chaque jour créent des fuites invisibles. Les mêmes gestes et le même test de traction stabilisent la qualité. Tu formes toute personne qui soude avant de lui confier une série client.","mod":"m5","li":0,"example":"Ta nièce aide le week-end. Tu lui montres le réglage, les cinq sachets vides d’essai, le tirage sur les bords, puis tu restes à côté pour la première série.","next":"Écris une mini fiche « gestes de soudure » en cinq points et fais-la signer par chaque personne formée.","alt":"Comme apprendre à nouer de la même façon le pagne avant une cérémonie : si chacun invente son nœud, ça se défait au mauvais moment.","hint":"Que se passe-t-il si chaque personne invente sa propre façon de souder ?"},{"keys":["greenwashing"],"q":"Que faire avant d’écrire une phrase « verte » sur l’étiquette ?","a":"Demande-toi quelle preuve tu montrerais à une cliente curieuse. Pas de preuve, pas de phrase. Évite les affirmations non vérifiées. L’écologie commence par moins de défauts et le juste film.","mod":"m5","li":0,"example":"Tu voulais écrire « emballage vert » sur l’étiquette. Tu n’as pas de preuve simple à montrer. Tu retires la phrase et tu gardes nom, poids et lot.","next":"Relis ton projet d’étiquette et raye toute phrase verte sans preuve écrite à côté.","alt":"Comme promettre un pagne « qui ne déteint jamais » sans l’avoir lavé une fois : mieux vaut se taire que d’affirmer sans preuve.","hint":"Quelle preuve concrète pourrais-tu montrer si une cliente demande « pourquoi vert » ?"},{"keys":["règlement","contact","europe"],"q":"Quel esprit retenir des règles européennes sur les matériaux au contact ?","a":"Ne pas céder aux aliments des constituants qui nuisent ou altèrent le goût et l’odeur, et documenter l’aptitude. C’est utile surtout si tu exportes, et comme discipline locale même à Ouagadougou. L’esprit compte plus que réciter des numéros sur l’étiquette.","mod":"m5","li":2,"example":"Tu appliques l’esprit du règlement européen 1935 de 2004 en refusant les matériaux douteux et en gardant les preuves, sans coller le numéro sur le sachet client.","next":"Résume l’esprit en une phrase sur ta liste murale : « pas d’altération, preuve d’usage ».","alt":"Comme la règle de ne pas stocker l’eau potable n’importe où : tu retiens le principe, tu l’appliques avec les moyens du quartier.","hint":"Que retiens-tu comme principe, sans réciter toute la gazette sur l’étiquette ?"},{"keys":["ouverts","cartons"],"q":"Pourquoi limiter l’ouverture des cartons entamés ?","a":"Chaque ouverture expose les sachets à l’air humide de la pièce et accélère la reprise d’humidité. Tu ouvres le moins possible les cartons entamés et tu refermes bien. Un carton témoin bien géré protège le reste.","mod":"m5","li":3,"example":"Au lieu d’ouvrir trois cartons pour préparer une petite commande, tu finis d’abord le carton entamé daté, puis tu refermes soigneusement.","next":"Repère les cartons entamés et place-les devant pour les finir avant d’en ouvrir un neuf.","alt":"Comme le bidon de mil entamé : plus tu l’ouvres souvent, plus l’air humide s’invite. Tu prends ce qu’il faut et tu refermes.","hint":"Que se passe-t-il pour les sachets chaque fois que le carton reste ouvert dans la pièce ?"},{"keys":["grammes","film","kilo"],"q":"Quel indicateur simple d’éco-conception suivre ?","a":"Les grammes de film par kilogramme de poudre vendable, une fois par mois. S’il monte sans raison, cherche le gaspillage : sachets écartés, formats trop grands, double emballage inutile.","mod":"m5","li":5,"example":"Tu notes qu’un mois a consommé plus de film pour la même poudre vendue. Tu découvres des essais de format trop grands et tu reviens au format validé.","next":"Mesure une fois ce mois-ci les grammes de film utilisés face aux kilogrammes vendables.","alt":"Comme couper le tissu juste à la mesure pour un pagne : trop large tu gaspilles, trop juste tu rates la couture ; tu apprends la juste mesure.","hint":"Quel rapport simple entre film consommé et poudre vendue suis-tu chaque mois ?"},{"keys":["points","sensibles","feuille"],"q":"Par où commencer l’analyse des points sensibles ?","a":"Tu commences l’analyse des points sensibles par le flux réel de ton atelier, pas par un règlement recopié d’ailleurs. Tu marches réception, cassage, bols, tamis, soudure, stock, et tu demandes à chaque étape ce qui pourrait mal tourner pour la cliente. Une feuille courte et franche suffit au début.","mod":"m6","li":0,"example":"Tu listes, par exemple, huit lignes maximum: fruits abîmés à la réception, éclats au cassage, toile de tamis trouée, soudure qui fuit, stock humide, et tu ajoutes un geste pour chacune.","next":"Marche demain dans l’atelier avec une feuille et note, par exemple, huit points sensibles avec un geste de maîtrise chacun.","alt":"Comme inspecter la cuisine avant d’inviter la famille: tu regardes où ça peut salir le repas, tu ranges, tu ne cries pas.","hint":"Le flux vécu guide l’analyse; le papier hors sol ne protège pas."},{"keys":["sept","idées","maîtrise"],"q":"Que retiennent les sept idées de maîtrise en langage simple ?","a":"En langage simple, les sept idées disent: voir ce qui peut arriver, tenir bon aux bons endroits, limiter clairement, surveiller, corriger, vérifier, écrire. Si une idée manque, le plan boite. Affiche-les en mots simples près du poste si une aide doit comprendre.","mod":"m6","li":1,"example":"Tu colles au mur: « voir, tenir, limiter, surveiller, corriger, vérifier, écrire » et tu entraînes une aide à les redire avec l’exemple de la soudure.","next":"Explique une idée par soir pendant une semaine; le huitième jour, redites-les ensemble.","alt":"Les freins d’une moto: tu vérifies ce qui protège vraiment la route, pas chaque décoration du rétroviseur.","hint":"Retiens la phrase: je sais quoi surveiller, comment, et quoi faire si ça dérape."},{"keys":["douze","étapes","flux"],"q":"Pourquoi vérifier le diagramme de flux sur site ?","a":"Vérifier le diagramme de flux sur site veut dire marcher dans l’atelier avec la feuille. Tu confirmes que chaque flèche correspond à un geste réel. Tu ajoutes reprises, déchets et tables oubliées. Un flux trop linéaire est souvent faux.","mod":"m6","li":2,"example":"Tu photographies une fois le trajet réel et tu t’aperçois que le refroidissement de la poudre avant soudure manquait sur le schéma: tu l’ajoutes.","next":"Dessine ton diagramme actuel et marche-le en corrigeant trois écarts notés.","alt":"Comme vérifier le parcours de la noce jusqu’à la salle plutôt que de le dessiner de mémoire au salon: les raccourcis apparaissent sur place.","hint":"Ce qui est dessiné doit encore être vrai le mois prochain."},{"keys":["points","critiques","peu"],"q":"Vaut-il mieux vingt points critiques ou peu de points réels ?","a":"Mieux vaut peu de points critiques vraiment surveillables que, par exemple, vingt cases vides pour « faire sérieux ». Si tout est critique, plus rien n’est priorisé. Choisis ce que tu peux tenir chaque lot, avec limite, surveillance et correction.","mod":"m6","li":1,"example":"Tu gardes deux points pour Baobab Bliss: intégrité de soudure et, si tu mesures, humidité avant emballage; le reste reste en bonnes pratiques.","next":"Écris aujourd’hui une fiche d’une demi-page pour un seul point critique réel.","alt":"Comme décider de tenir surtout la porte de la rue et le feu de la cuisine: tu ne mets pas un gardien sur chaque tiroir.","hint":"Résiste à baptiser tout critique: la clarté bat la longue liste abandonnée."},{"keys":["controle","quotidien"],"q":"Que doit faire une bonne liste de contrôle du jour ?","a":"Une bonne liste de contrôle du jour est courte, visible, et utilisable par une aide. Elle couvre matin, pendant le lot et soir, sans cent pages. Par exemple, douze cases bien choisies battent quarante cases fantômes. Tu la coches pour de vrai.","mod":"m6","li":4,"example":"Ta liste du jour porte: mains et table, état du tamis, balance à zéro, film prêt, fruits conformes, plateau blanc, essai de soudure, code lot, poids, stock surélevé, déchets sortis, carnet à jour.","next":"Affiche une liste de contrôle matin-pendant-soir en douze cases maximum, par exemple, et teste-la un jour entier.","alt":"Comme la liste du marché écrite sur un papier: courte, lue avant de sortir, cochée en rentrant.","hint":"Si elle est trop longue, tu la sautes: allège jusqu’à ce qu’elle vive."},{"keys":["traçabilité","pas","arrière"],"q":"Que signifie « un pas en arrière, un pas en avant » ?","a":"« Un pas en arrière, un pas en avant » signifie connaître le fournisseur immédiat et le client ou canal immédiat. Tu n’as pas besoin de suivre toute la ville. Tu as besoin du maillon voisin pour retrouver un lot.","mod":"m6","li":5,"example":"Pour le lot du jeudi, tu sais quel fournisseur a livré les gousses et tu as noté la boutique qui a reçu, par exemple, trente sachets: les deux pas sont là.","next":"Vérifie qu’un sachet pris au hasard a son jumeau dans le carnet avec fournisseur et sortie.","alt":"Comme retrouver qui a emprunté quelle chaise à la cérémonie: tu as noté les noms, tu rétrouves vite.","hint":"Fournisseur d’un côté, destinataire de l’autre: c’est le fil."},{"keys":["référentiels","pas","tout","de","suite"],"q":"Faut-il se certifier tout de suite pour vendre à Ouagadougou ?","a":"Non, tu n’as pas besoin de te certifier tout de suite pour vendre à Ouagadougou. Un plan quotidien réel, une hygiène tenue et un étiquetage loyal passent d’abord. Les grandes normes et audits viennent plus tard, si un canal les demande et les finance.","mod":"m6","li":4,"example":"Tu continues à vendre au marché avec liste de contrôle et lots, et tu ranges « certification » dans la colonne plus tard de ta feuille de route.","next":"Écris trois phrases datées: déjà fait, ce mois-ci, plus tard côté certification.","alt":"Comme apprendre la couture: d’abord un ourlet qui tient, ensuite les patrons compliqués.","hint":"Commence par ce que tu fais vraiment, avant le décor mural d’un certificat."},{"keys":["mock","retrait"],"q":"À quoi sert un exercice de mock-retrait ?","a":"Un exercice de mock-retrait teste ton système avant un vrai souci. Tu choisis un lot et tu listes tous les endroits où ses sachets peuvent être. Tu chronomètres le temps et tu notes les trous, par exemple une vente non écrite.","mod":"m6","li":5,"example":"Tu prends le lot du lundi, tu comptes ce qui reste à l’atelier, ce qui est en boutique et ce qui est parti en dégustation; tu trouves un trou et tu corriges le registre des sorties.","next":"Fais un mock-retrait cette semaine sur un lot réel et note le temps de reconstruction.","alt":"Comme un exercice d’évacuation à l’école: on répète calmement pour que le jour J les gestes soient connus.","hint":"Le but n’est pas la perfection: c’est de voir où le fil casse."},{"keys":["surveillance","vérification"],"q":"Quelle différence entre surveiller et vérifier ?","a":"Surveiller, c’est suivre le lot au moment où tu travailles: regarder la soudure, cocher la liste de contrôle. Vérifier, c’est juger le système à froid: relire les écarts du mois, tester, auditer légèrement. Les deux cases doivent exister sur ton calendrier.","mod":"m6","li":1,"example":"Pendant le lot tu surveilles chaque soudure; le dimanche tu vérifies en relisant les fiches et en comptant les écarts du mois.","next":"Ajoute sur ton calendrier une case « revue mensuelle des écarts » distincte des contrôles du jour.","alt":"Comme goûter la sauce pendant la cuisson, puis juger le repas entier le lendemain avec les restes et les commentaires: deux moments différents.","hint":"L’une suit le produit; l’autre juge si la méthode tient."},{"keys":["prérequis","prp"],"q":"Pourquoi les bonnes pratiques de base (prérequis) comptent-elles tant ?","a":"Les bonnes pratiques de base, ou prérequis, réduisent déjà beaucoup ce qui peut nuire: locaux, eau, personnel, nettoyage, nuisibles, déchets. Sans elles, multiplier les points critiques ne sert à rien. Elles viennent avant le plan détaillé.","mod":"m6","li":0,"example":"Tu refuses de commencer un lot si le plan de travail est collant ou si le savon manque près du point d’eau: le prérequis bloque avant le tamis.","next":"Liste six prérequis visibles dans ton atelier et coche ceux tenus chaque matin cette semaine.","alt":"Comme poser des fondations avant d’élever les murs: sans socle, le plan étage s’écroule.","hint":"Le cours place les prérequis avant même de parler de points critiques."},{"keys":["changement","process","revue"],"q":"Que faire après un changement de film, d’aide ou de local ?","a":"Après un changement de film, d’aide ou de local, tu relis la feuille des points sensibles et tu mets à jour le plan. Un changement non relu crée des trous. Tu dates la nouvelle version et tu gardes l’ancienne.","mod":"m6","li":0,"example":"Tu changes de film pour les sachets: tu refais un essai de soudure, tu notes la nouvelle limite de traction si besoin, tu formes l’aide au nouveau geste.","next":"Si tu as changé quelque chose récemment, date une mini-revue d’une demi-page cette semaine.","alt":"Comme revoir le chemi
